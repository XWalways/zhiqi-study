  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

/* Catalog */

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }

.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }

.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }

.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter21","number":4,"title":"金融机构","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-04-金融机构-离线学习.html"},"lessons":{"title":"金融机构","subtitle":"区分中央银行、商业银行、政策性银行和其他金融机构的职责与业务。","sections":[{"id":"institutions","title":"金融机构分类与监管分工","summary":"同一个机构可以按资金来源、业务性质、政策职能或融资角色分类。","bodyHtml":"\u003cp>金融机构经营资金融通、金融交易和相关服务。按融资关系可分直接融资机构与间接融资机构，按业务性质可分银行与非银行金融机构，按目标可分商业性与政策性机构。资金来源常用于区分存款性、投资性、契约性和政策性机构。现代金融机构体系通常以中央银行为核心。\u003c/p>\u003cp>我国人民银行承担货币政策、宏观审慎管理及依法负责的市场管理等职责。国家金融监督管理总局依法承担除证券业之外的金融业监管职责，证监会依法对证券、基金及期货等市场履行监管职责。原银监会、原银保监会是历史机构名称。\u003c/p>\u003cp>国务院派出国有重点金融机构监事会的制度强调监督检查。它与公司内部治理、现行行政监管和国有资本出资人职责属于不同关系。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/2023/2023_zt02/yw/202303/t20230311_1050340.html\" target=\"_blank\" rel=\"noopener noreferrer\">国务院机构改革方案\u003c/a> · \u003ca href=\"https://app.www.gov.cn/govdata/gov/202310/13/508173/article.html\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行职责调整通知\u003c/a> · \u003ca href=\"https://www.csrc.gov.cn/csrc/c100002/c7443811/content.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">证监会职责\u003c/a> · \u003ca href=\"https://xzfg.moj.gov.cn/front/law/detail?LawID=540\" target=\"_blank\" rel=\"noopener noreferrer\">国有重点金融机构监事会暂行条例\u003c/a>\u003c/p>","keyTakeaway":"先识别分类维度，再区分经营机构、自律组织与行政监管机关。","pitfall":"金融机构并非都吸收公众存款，银行业监管口径也可覆盖部分非银行机构。","example":"银行吸收存款再放贷是间接融资。证券公司承销债券时，投资者直接持有对发行人的债权。"},{"id":"central-roles","title":"中央银行的职能","summary":"从货币发行、银行服务和政府服务识别三类职能。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>发行的银行\u003c/strong>集中行使法定货币发行权。\u003c/li>\u003cli>\u003cstrong>银行的银行\u003c/strong>保管存款准备金、组织银行间清算、提供流动性并发挥最后贷款人作用。\u003c/li>\u003cli>\u003cstrong>政府的银行\u003c/strong>依法经理国库，承担相应政府金融服务。\u003c/li>\u003c/ul>\u003cp>中央银行以货币金融稳定等公共目标为重，通常不经营面向普通公众的存贷款业务，也不以利润最大化为目标。货币政策独立程度、资本安排、透明度与业务条件由各地制度决定。我国人民银行依法制定执行货币政策并防范和化解系统性金融风险。依《中国人民银行法》第二十九条，人民银行不得对政府财政透支或直接认购、包销国债和其他政府债券。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://haikou.pbc.gov.cn/eportal/fileDir/image_public/UserFiles/haikou/upload/File/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E4%B8%AD%E5%9B%BD%E4%BA%BA%E6%B0%91%E9%93%B6%E8%A1%8C%E6%B3%95.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">《中国人民银行法》\u003c/a> · \u003ca href=\"https://app.www.gov.cn/govdata/gov/202310/13/508173/article.html\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行职责调整通知\u003c/a>\u003c/p>","keyTakeaway":"经理国库是国库资金管理服务。认购政府债券一级发行会向政府提供资金，需看法律是否允许。","pitfall":"组织结算是实际央行业务，通常归于“银行的银行”等职能。","example":"商业银行为支付清算将资金存放在央行，账户资金同时对应央行负债。"},{"id":"central-models","title":"中央银行的组织形式","summary":"单一中央银行、复合、准中央银行与跨国制度各有不同组织关系。","bodyHtml":"\u003cp>单一中央银行制下设专门机构执行中央银行职能，按组织层级常分\u003cstrong>一元式\u003c/strong>和\u003cstrong>二元式\u003c/strong>。我国人民银行通过总行和分支机构履职，通常归入一元式。复合制由承担商业银行业务的机构兼行部分中央银行职能。“准中央银行”是旧式组织分类，指通过某类机构承担部分央行职能。\u003c/p>\u003cp>新加坡金融管理局现明确是本国中央银行及综合监管机构。欧洲中央银行与已采用欧元的成员国央行组成欧元体系，是跨国组织的常见例子。韩国银行法规定韩国银行为无资本金的特别法人。英格兰银行成立于 1694 年，常作近代中央银行制度的代表，瑞典央行成立更早。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://haikou.pbc.gov.cn/eportal/fileDir/image_public/UserFiles/haikou/upload/File/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E4%B8%AD%E5%9B%BD%E4%BA%BA%E6%B0%91%E9%93%B6%E8%A1%8C%E6%B3%95.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">《中国人民银行法》\u003c/a> · \u003ca href=\"https://www.mas.gov.sg/who-we-are/What-We-Do\" target=\"_blank\" rel=\"noopener noreferrer\">新加坡金融管理局职能\u003c/a> · \u003ca href=\"https://www.ecb.europa.eu/ecb/orga/escb/html/index.xx.html\" target=\"_blank\" rel=\"noopener noreferrer\">欧洲中央银行与欧元体系\u003c/a> · \u003ca href=\"https://www.bok.or.kr/eng/bbs/E0000824/view.do?menuNo=400261&nttId=10090902\" target=\"_blank\" rel=\"noopener noreferrer\">韩国银行公布的《韩国银行法》\u003c/a> · \u003ca href=\"https://www.bankofengland.co.uk/museum/online-collections/blog/world-first-central-bank-invention-of-banknotes\" target=\"_blank\" rel=\"noopener noreferrer\">英格兰银行中央银行历史资料\u003c/a>\u003c/p>","keyTakeaway":"组织形式看机构如何分工，机构名称和设立年代分别判断。","pitfall":"“欧元体系”包括欧洲中央银行及采用欧元的国家央行，“欧洲中央银行体系”还包括欧盟未采用欧元成员的央行。","example":"几个国家共同使用货币并共享货币政策机构，符合跨国中央银行安排。"},{"id":"central-balance","title":"中央银行的资产、负债与政策利率","summary":"同一笔业务可同时改变资产端和负债端。","bodyHtml":"\u003cp>央行\u003cstrong>资产\u003c/strong>包括持有证券、外汇储备、对金融机构的再贷款或再贴现等。央行\u003cstrong>负债\u003c/strong>包括发行货币、银行存放的准备金、政府存款以及已发行央行票据等。清算、票据交换、经理国库具有服务属性，需区分业务活动和资产负债项目。\u003c/p>\u003cp>\u003cstrong>基础货币\u003c/strong>通常由流通现金和银行准备金等构成。贷款、外汇交易及公开市场操作都可能影响基础货币，不能脱离时期给各因素排序。再贴现率上升在其他条件相同且银行实际使用工具时，可能减少再贴现需求。我国主要政策利率为公开市场 7 天期逆回购操作利率。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://haikou.pbc.gov.cn/eportal/fileDir/image_public/UserFiles/haikou/upload/File/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E4%B8%AD%E5%9B%BD%E4%BA%BA%E6%B0%91%E9%93%B6%E8%A1%8C%E6%B3%95.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">《中国人民银行法》\u003c/a> · \u003ca href=\"https://camlmac.pbc.gov.cn/zhengcehuobisi/125207/125227/125957/5347949/2025100917195573922/2025081217013923839.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行货币政策执行报告\u003c/a> · \u003ca href=\"https://cif.mofcom.gov.cn/cif/html/upload/20261102092525391_2026%E5%B9%B49%E6%9C%88%E9%87%91%E8%9E%8D%E5%B8%82%E5%9C%BA%E8%BF%90%E8%A1%8C.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">2026 年 9 月金融市场运行情况\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914522391548.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">商业汇票承兑、贴现与再贴现管理办法\u003c/a>\u003c/p>","keyTakeaway":"央行发放贷款时通常增加自身债权，并同时记增银行准备金负债。","pitfall":"银行在央行的存款对银行是资产，对央行是负债。再贴现率与主要政策利率分别理解。","example":"央行向银行发放 100 万元再贷款，并将 100 万元记入银行准备金账户，资产和负债各增 100 万元。"},{"id":"policy-banks","title":"政策性与开发性银行","summary":"政策性资金重点支持发展战略、薄弱领域与长期项目。","bodyHtml":"\u003cp>政策性金融机构的常见职能包括引导资金、选择重点、填补商业金融供给缺口、提供配套金融服务。资金来源可包括国家出资、政策性金融债及依法融资。机构同时需要管理风险和保持财务可持续，具体业务范围以监管规则和章程为准。\u003c/p>\u003cp>\u003cstrong>国家开发银行\u003c/strong>定位于开发性金融，支持中长期战略与重点薄弱领域。\u003cstrong>中国进出口银行\u003c/strong>主要支持对外贸易、开放和国际合作。\u003cstrong>中国农业发展银行\u003c/strong>是支持农业农村发展的政策性银行。政策性金融机构行政许可规程采用较广的机构范围，包括国家开发银行和中国出口信用保险公司等。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.cdb.com.cn/gykh/\" target=\"_blank\" rel=\"noopener noreferrer\">国家开发银行简介\u003c/a> · \u003ca href=\"https://www.cdb.com.cn/kfxjr/gykfxjr/\" target=\"_blank\" rel=\"noopener noreferrer\">国家开发银行开发性金融说明\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1026165&itemId=4214\" target=\"_blank\" rel=\"noopener noreferrer\">中国进出口银行监督管理办法\u003c/a> · \u003ca href=\"https://www.adbc.com.cn/n4/n13/c602252/attr/602253.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">中国农业发展银行简介及经营范围\u003c/a> · \u003ca href=\"https://www.adbc.com.cn/n5/n15/c708450/content.html\" target=\"_blank\" rel=\"noopener noreferrer\">农发行 2026 年金融债券公告\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/governmentDetail.html?docId=1236057&generaltype=1&itemId=861\" target=\"_blank\" rel=\"noopener noreferrer\">政策性金融机构行政许可规程\u003c/a>\u003c/p>","keyTakeaway":"国开行是开发性金融机构，进出口银行和农发行的业务方向分别偏向外经贸、农业农村。","pitfall":"不能将所有政策性银行的业务范围一概描述为不吸收任何存款，农发行公开列明可办理部分存款业务。","example":"农发行通过发行金融债募集资金，可支持春耕备耕等融资。"},{"id":"bank-basics","title":"商业银行的职能与存款创造","summary":"商业银行主要从事存款、贷款和支付结算，使用自身资产负债表组织资金。","bodyHtml":"\u003cp>\u003cstrong>信用中介\u003c/strong>通过吸收存款、贷款投资等方式调剂资金。\u003cstrong>支付中介\u003c/strong>为客户划付资金和办理结算。\u003cstrong>信用创造\u003c/strong>体现为银行发放贷款后形成存款。银行还提供咨询、代收代付等服务。\u003c/p>\u003cp>商业银行以货币和信用为经营对象，以大量存款等负债支持资产运作，具有高杠杆特征。吸收活期存款是典型业务。银行创造存款要受到资本、流动性、贷款需求、风险管理和政策等约束。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_35aff5bda2374572b8eb87cafcd1541a.html\" target=\"_blank\" rel=\"noopener noreferrer\">《商业银行法》\u003c/a>\u003c/p>","keyTakeaway":"支付收付找支付中介，资金调剂和信用转换找信用中介，新增贷款同时新增存款找信用创造。","pitfall":"活期存款是商业银行负债，客户活期账户余额是客户资产。","example":"银行向企业发放 10 万元贷款并转入企业账户，贷款资产和存款负债同时增加。"},{"id":"bank-accounts","title":"商业银行资产、负债、中间与表外业务","summary":"区分资金从哪里来、投到哪里、服务收入和或有风险。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>负债业务\u003c/strong>形成资金来源，如吸收存款、同业拆入和发行债券。\u003c/li>\u003cli>\u003cstrong>资产业务\u003c/strong>形成资金运用，如发放贷款、持有债券和存放央行款项。基础头寸在常见口径下为库存现金与超额存款准备金。\u003c/li>\u003cli>\u003cstrong>中间业务\u003c/strong>典型为结算、代理和咨询等服务，收入常是手续费。\u003cstrong>狭义表外业务\u003c/strong>常见担保、承诺等敞口，满足条件时可能需要确认相关资产、负债或损失。\u003c/li>\u003c/ul>\u003cp>广义表外业务的监管口径也涵盖某些代理和中介服务。处理信用证、贷款转让或衍生工具时，应分别看合同风险和会计确认。按《商业银行法》第四十三条，商业银行在境内从事信托投资受限制，国家另有规定的除外。按复利折现时，\u003cstrong>现值＝终值÷(1＋每期利率)ⁿ\u003c/strong>。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_35aff5bda2374572b8eb87cafcd1541a.html\" target=\"_blank\" rel=\"noopener noreferrer\">《商业银行法》\u003c/a> · \u003ca href=\"https://app.www.gov.cn/govdata/gov/202212/04/494900/article.html\" target=\"_blank\" rel=\"noopener noreferrer\">商业银行表外业务风险管理办法解读\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914522391548.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">商业汇票承兑、贴现与再贴现管理办法\u003c/a>\u003c/p>","keyTakeaway":"看业务发生时哪项资产、负债或费用产生，并留意是否有担保或承诺。","pitfall":"用面值计算票据单利贴息，与用复利计算未来现金流的现值不同。","example":"银行出具信用证可收取手续费，还应对承诺产生的敞口进行管理。"},{"id":"bank-risk","title":"经营原则、流动性与贷款分类","summary":"经营原则并列安全性、流动性与效益性，风险分类按履约风险分级。","bodyHtml":"\u003cp>安全性要求控制损失和偿付风险。资产流动性是资产迅速且低损耗变现的能力，负债流动性是及时以合理成本补充资金的能力。效益性强调经营收益与长期成本，经营目标应受风险和合规约束。\u003c/p>\u003cp>金融资产按风险程度划分\u003cstrong>正常、关注、次级、可疑、损失\u003c/strong>。后三类合称不良资产。对贷款适用时，后三类合称不良贷款。关注类存在不利因素，尚未达到不良贷款分类标准。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_35aff5bda2374572b8eb87cafcd1541a.html\" target=\"_blank\" rel=\"noopener noreferrer\">《商业银行法》\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1095372\" target=\"_blank\" rel=\"noopener noreferrer\">商业银行金融资产风险分类办法\u003c/a>\u003c/p>","keyTakeaway":"“后三类”从次级开始，关注类单独记。","pitfall":"能快速借到资金是负债流动性，能快速卖出持有资产是资产流动性。","example":"某笔贷款被划入可疑类，计入不良贷款。"},{"id":"bank-governance","title":"商业银行组织形式与合规职责","summary":"总分行关系看法人边界，治理责任看股东会、董事会和高级管理层。","bodyHtml":"\u003cp>\u003cstrong>分支银行制\u003c/strong>由总行和分支机构组成同一银行网络。\u003cstrong>单一银行制\u003c/strong>强调单个银行独立经营。\u003cstrong>持股公司制\u003c/strong>由专设公司持股控制多家银行，\u003cstrong>连锁银行制\u003c/strong>由同一投资者或集团直接持股控制多家银行。分业与综合经营则按业务范围区分。我国商业银行可依法设立分支，分支机构不具有法人资格。\u003c/p>\u003cp>股份有限公司的股东会为权力机构。金融机构董事会对合规管理有效性承担最终责任，高级管理层组织实施。内部监督可随法律、监管要求和章程采用相应安排。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_35aff5bda2374572b8eb87cafcd1541a.html\" target=\"_blank\" rel=\"noopener noreferrer\">《商业银行法》\u003c/a> · \u003ca href=\"https://www.samr.gov.cn/xyjgs/flfg/art/2024/art_d4e84936a8a744f8928ac7aec7594345.html\" target=\"_blank\" rel=\"noopener noreferrer\">《公司法》\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1192220\" target=\"_blank\" rel=\"noopener noreferrer\">金融机构合规管理办法\u003c/a>\u003c/p>","keyTakeaway":"同一银行向下设机构是分支制，多个银行法人由同一公司控制是持股公司制。","pitfall":"股东会是公司权力机构，董事会仍对合规管理有效性承担最终责任。","example":"总行下设多个地区分行时，各分行没有独立法人资格。"},{"id":"nonbank","title":"其他金融服务机构","summary":"用资金来源、客户范围和主要业务区分机构。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>保险公司\u003c/strong>通过保险合同转移、分散风险，并按约定补偿或给付保险金。商业保险可分财产和人身保险，另有原保险、再保险、共同保险等安排。保险人、投保人、被保险人和受益人的角色各有定义。社会保险另有公共制度依据。\u003c/li>\u003cli>\u003cstrong>金融资产管理公司\u003c/strong>从事不良资产收购、管理和处置等业务。历史上曾由国家出资设立专门机构集中处置国有银行不良资产。\u003c/li>\u003cli>\u003cstrong>企业集团财务公司\u003c/strong>服务集团成员，开展资金集中管理等业务。\u003cstrong>消费金融公司\u003c/strong>依法向居民个人提供以消费为目的的贷款，属于非银行金融机构。\u003c/li>\u003cli>\u003cstrong>小额贷款公司\u003c/strong>是主要开展小额贷款业务的地方金融组织，不吸收公众存款。可按现行规则使用自有资金及适格外部融资，需符合限额与地域等规定。\u003c/li>\u003c/ul>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_4c715a53f3d4402c89f62ae77809f638.html\" target=\"_blank\" rel=\"noopener noreferrer\">《保险法》\u003c/a> · \u003ca href=\"https://xzfg.moj.gov.cn/front/law/detail?LawID=554\" target=\"_blank\" rel=\"noopener noreferrer\">金融资产管理公司条例\u003c/a> · \u003ca href=\"https://app.www.gov.cn/govdata/gov/202411/16/521787/article.html\" target=\"_blank\" rel=\"noopener noreferrer\">金融资产管理公司不良资产业务管理办法\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1077306&itemId=4214\" target=\"_blank\" rel=\"noopener noreferrer\">企业集团财务公司管理办法\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1155386\" target=\"_blank\" rel=\"noopener noreferrer\">消费金融公司管理办法\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/governmentDetail.html?docId=1195616&generaltype=1\" target=\"_blank\" rel=\"noopener noreferrer\">小额贷款公司监督管理暂行办法\u003c/a>\u003c/p>","keyTakeaway":"金融资产管理公司看不良资产，财务公司看集团成员，小额贷款公司看小额贷款与不吸收公众存款。","pitfall":"财务公司可以按许可为成员提供存贷款等服务。小额贷款公司的资金融入要区分合规融资与吸收公众存款。","example":"集团成员企业需要集中管理资金，可以由其集团财务公司按许可提供服务。"},{"id":"trust","title":"信托目的、财产与当事人","summary":"受托人依信托目的为受益人或特定目的管理、处分信托财产。","bodyHtml":"\u003cp>信托涉及委托人、受托人、受益人。设立信托必须有\u003cstrong>合法目的\u003c/strong>和确定的信托财产，并按法律规定采用书面形式。信托财产按法律规定独立管理，有助于区分信托财产和当事人其他财产。\u003c/p>\u003cp>信托公司主要作为专业受托人提供服务。自 2026 年 1 月 1 日起施行的《信托公司管理办法》规定国家金融监督管理总局及其派出机构依法对信托公司及其业务活动实施监督管理。原中国银保监会名称可出现在历史题境。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=879933&generaltype=0&itemId=927\" target=\"_blank\" rel=\"noopener noreferrer\">《信托法》\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=1225642\" target=\"_blank\" rel=\"noopener noreferrer\">2026 年起施行的信托公司管理办法\u003c/a> · \u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/2023/2023_zt02/yw/202303/t20230311_1050340.html\" target=\"_blank\" rel=\"noopener noreferrer\">国务院机构改革方案\u003c/a>\u003c/p>","keyTakeaway":"信托要看目的、财产、当事人和书面设立安排。","pitfall":"合法信托目的与确定的信托财产是设立条件，信托收益无法仅凭机构名称保证。","example":"委托人设立公益信托时，受托人应按依法设立的信托目的使用相应财产。"},{"id":"international","title":"国际金融与监管组织","summary":"把发展融资、宏观金融合作、审慎标准和金融稳定协调对应到机构。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>国际货币基金组织（IMF）\u003c/strong>开展宏观经济监测、能力建设及国际收支融资等。\u003c/li>\u003cli>\u003cstrong>世界银行\u003c/strong>狭义包括 IBRD 与 IDA，主要提供发展融资。IBRD 依靠自身权益和债券市场融资，IDA 还依赖成员资源补充等。\u003c/li>\u003cli>\u003cstrong>亚洲基础设施投资银行\u003c/strong>是政府间多边开发银行。中国 2013 年提出筹建倡议，2014 年相关国家签署筹建备忘录。\u003c/li>\u003cli>\u003cstrong>巴塞尔银行监管委员会\u003c/strong>制定国际银行审慎标准。\u003cstrong>金融稳定理事会\u003c/strong>监测全球金融系统并协调政策和建议。\u003c/li>\u003c/ul>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.imf.org/en/about/factsheets/financial-system-soundness\" target=\"_blank\" rel=\"noopener noreferrer\">国际货币基金组织金融稳定说明\u003c/a> · \u003ca href=\"https://www.worldbank.org/en/about/annual-report-2025/world-bank?dropid=ibrd\" target=\"_blank\" rel=\"noopener noreferrer\">世界银行 IBRD 和 IDA 资料\u003c/a> · \u003ca href=\"https://www.aiib.org/en/about-aiib/who-we-are/yearbook/.content/index/download/aiib-yearbook.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">亚洲基础设施投资银行历史\u003c/a> · \u003ca href=\"https://www.bis.org/committees/bcbs/charter\" target=\"_blank\" rel=\"noopener noreferrer\">巴塞尔委员会章程\u003c/a> · \u003ca href=\"https://www.fsb.org/about/\" target=\"_blank\" rel=\"noopener noreferrer\">金融稳定理事会简介\u003c/a>\u003c/p>","keyTakeaway":"出现银行审慎国际标准找巴塞尔委员会，出现发展项目融资找相应多边开发银行。","pitfall":"巴塞尔委员会制定国际标准，各地按自身法律和监管框架落实。","example":"跨境基础设施项目可由多边开发银行提供融资，银行资本监管标准属于审慎监管安排。"}],"mindmap":[{"label":"金融机构概述","target":"institutions","children":[{"label":"金融活动及配套服务","target":"institutions"},{"label":"分类","target":"institutions","children":[{"label":"直接融资与间接融资","target":"institutions"},{"label":"银行与非银行","target":"institutions"},{"label":"政策性与商业性","target":"institutions"},{"label":"存款性、投资性、契约性等","target":"institutions"}]},{"label":"监管分工","target":"institutions"}]},{"label":"中央银行","target":"central-roles","children":[{"label":"特征","target":"central-roles","children":[{"label":"公共目标与非营利导向","target":"central-roles"},{"label":"资产流动性与业务透明","target":"central-roles"},{"label":"政策独立程度","target":"central-roles"}]},{"label":"组织形式","target":"central-models","children":[{"label":"单一式","target":"central-models","children":[{"label":"一元式","target":"central-models"},{"label":"二元式","target":"central-models"}]},{"label":"复合式","target":"central-models"},{"label":"准中央银行的传统分类","target":"central-models"},{"label":"跨国模式","target":"central-models"}]},{"label":"职能","target":"central-roles","children":[{"label":"发行的银行","target":"central-roles"},{"label":"银行的银行","target":"central-roles"},{"label":"政府的银行","target":"central-roles"},{"label":"调控、监管与服务","target":"central-roles"}]},{"label":"业务","target":"central-balance","children":[{"label":"负债端","target":"central-balance","children":[{"label":"货币发行","target":"central-balance"},{"label":"银行准备金","target":"central-balance"},{"label":"政府存款与央行票据","target":"central-balance"}]},{"label":"资产端","target":"central-balance","children":[{"label":"再贷款与再贴现","target":"central-balance"},{"label":"证券与外汇储备","target":"central-balance"}]},{"label":"清算与票据交换","target":"central-balance"}]}]},{"label":"政策性银行与商业银行","target":"bank-basics","children":[{"label":"政策性及开发性银行","target":"policy-banks","children":[{"label":"国家出资、发债等资金来源","target":"policy-banks"},{"label":"国开行、进出口银行和农发行","target":"policy-banks"},{"label":"引导、选择、补充与服务","target":"policy-banks"}]},{"label":"商业银行","target":"bank-basics","children":[{"label":"经营特征与职能","target":"bank-basics","children":[{"label":"活期存款与信用创造","target":"bank-basics"},{"label":"信用中介、支付中介和金融服务","target":"bank-basics"}]},{"label":"组织与治理","target":"bank-governance","children":[{"label":"单一、分支、持股与连锁","target":"bank-governance"},{"label":"专业化与综合经营","target":"bank-governance"}]},{"label":"业务","target":"bank-accounts","children":[{"label":"资产与负债","target":"bank-accounts"},{"label":"中间与表外","target":"bank-accounts"}]},{"label":"风险管理","target":"bank-risk","children":[{"label":"安全性、流动性、效益性","target":"bank-risk"},{"label":"贷款五级分类","target":"bank-risk"}]}]}]},{"label":"其他金融机构","target":"nonbank","children":[{"label":"保险公司","target":"nonbank","children":[{"label":"风险分散、损失补偿与给付","target":"nonbank"},{"label":"人身、财产及再保险","target":"nonbank"},{"label":"投保人、保险人、被保险人与受益人","target":"nonbank"}]},{"label":"金融资产管理公司","target":"nonbank","children":[{"label":"不良资产收购与处置","target":"nonbank"}]},{"label":"小额贷款与其他机构","target":"nonbank","children":[{"label":"自有资金和合规融资","target":"nonbank"},{"label":"禁止吸收公众存款","target":"nonbank"},{"label":"财务公司与消费金融公司","target":"nonbank"}]},{"label":"信托公司","target":"trust","children":[{"label":"合法目的","target":"trust"},{"label":"委托人、受托人和受益人","target":"trust"},{"label":"信托财产","target":"trust"}]},{"label":"国际机构","target":"international","children":[{"label":"国际货币基金组织","target":"international"},{"label":"世界银行与亚投行","target":"international"},{"label":"巴塞尔委员会与金融稳定理事会","target":"international"}]}]}]},"questions":[{"id":"fin-04-q01","number":1,"group":"金融机构概述","type":"single","stem":"金融机构之所以被称为金融企业，是因为它所经营的对象不是普通商品，而是（　　）。","options":{"A":"存款","B":"货币资金","C":"资本","D":"有价证券"},"answer":["B"],"explanationSupplement":"经营对象是货币资金及其相关权益，存款和证券只是具体表现形式。","optionExplanations":{"A":"存款是部分机构的负债来源","B":"概括资金融通的共同对象","C":"资本概念有特定含义，不能完整覆盖","D":"有价证券只是交易工具之一"},"conceptId":"institutions"},{"id":"fin-04-q02","number":2,"group":"金融机构概述","type":"single","stem":"金融机构最基本、最能反映其经营活动特征的职能是（　　）。","options":{"A":"信用中介","B":"支付中介","C":"金融服务","D":"创造信用工具"},"answer":["A"],"explanationSupplement":"传统金融中介分类以把盈余方资金转给短缺方为核心。不同机构还有支付、承保或受托投资等职能。","optionExplanations":{"A":"借由金融机构资产负债等安排实现资金融通","B":"负责资金划付和结算","C":"是宽泛的服务概念","D":"是部分机构的货币信用创造机制"},"conceptId":"institutions"},{"id":"fin-04-q03","number":3,"group":"金融机构概述","type":"single","stem":"现代金融机构体系通常是以（　　）为核心。","options":{"A":"投资银行","B":"中央银行","C":"商业银行","D":"证券公司"},"answer":["B"],"explanationSupplement":"中央银行承担货币发行、货币政策、流动性支持等职能，是现代银行体系的核心。","optionExplanations":{"A":"提供证券承销和融资服务","B":"承担基础货币和货币政策职能","C":"是面向企业与公众的主要业务机构","D":"属于资本市场中介"},"conceptId":"institutions"},{"id":"fin-04-q04","number":4,"group":"金融机构概述","type":"single","stem":"国有重点金融机构监事会与国有重点金融机构的关系是（　　）。","options":{"A":"上级与下级的关系","B":"监督与被监督的关系","C":"指导与被指导的关系","D":"领导与被领导的关系"},"answer":["B"],"explanationSupplement":"《国有重点金融机构监事会暂行条例》描述的是国务院派出监事会的监督检查安排。应区分该制度、公司内部监事机制与现行金融行政监管。","optionExplanations":{"A":"不构成行政上下级","B":"符合条例设定的监督关系","C":"特定内部审计指导职责并不概括主要法律关系","D":"不参与或干预企业经营决策"},"conceptId":"institutions"},{"id":"fin-04-q05","number":5,"group":"中央银行","type":"discussion","stem":"在影响基础货币增减变动的因素中，最主要的影响因素是（　　）。","options":{"A":"中央银行对商业银行债权","B":"中央银行对政府债权","C":"国外净资产","D":"固定资产的增减变动"},"answer":[],"explanationSupplement":"央行对银行放贷通常增加准备金，购入外汇也可投放基础货币。哪个因素占主导要看经济体、时期及央行操作，不能仅凭机制决定。","optionExplanations":{"A":"再贷款等可扩大准备金，特定时期可能占主导","B":"政府债权变化可影响基础货币，须结合同期负债","C":"外汇净资产也曾是重要投放渠道","D":"不是常见主要投放渠道"},"conceptId":"central-balance"},{"id":"fin-04-q06","number":6,"group":"中央银行","type":"single","stem":"以下哪项属于中央银行的负债业务？（　　）","options":{"A":"证券买卖业务","B":"再贴现业务","C":"发行货币","D":"对金融机构放款"},"answer":["C"],"explanationSupplement":"发行货币形成央行负债。央行买入证券、办理再贴现或向金融机构贷款可形成资产。","optionExplanations":{"A":"购入证券形成资产","B":"形成对交易机构的债权","C":"发行货币记在负债端","D":"形成央行债权"},"conceptId":"central-balance"},{"id":"fin-04-q07","number":7,"group":"中央银行","type":"discussion","stem":"下列关于中央银行业务的描述中，不属于中央银行负债业务的是（　　）。","options":{"A":"中国人民银行通过贷款渠道发行人民币","B":"中国人民银行吸收存款准备金","C":"中国人民银行接受政府委托管理国库","D":"中国人民银行组织全国商业银行进行资金清算"},"answer":[],"explanationSupplement":"组织银行间资金清算属于结算服务。央行经理国库是职能，国库存款才具体表现为央行负债。放贷时可同时形成央行资产和基础货币负债。","optionExplanations":{"A":"货币发行一侧属于负债，再贷款本身是资产","B":"是央行欠商业银行的存款准备金","C":"只有国库存款等余额属于负债，经理国库本身也含服务","D":"清算服务不必单独形成负债"},"conceptId":"central-balance"},{"id":"fin-04-q08","number":8,"group":"中央银行","type":"single","stem":"被公认近代中央银行鼻祖的是（　　）。","options":{"A":"美联储","B":"英格兰银行","C":"瑞典银行","D":"法兰西银行"},"answer":["B"],"explanationSupplement":"英格兰银行成立于 1694 年，常作为近代中央银行制度演进的代表。瑞典央行在 1668 年成立，历史更早。","optionExplanations":{"A":"美国联邦储备体系建立时间较晚","B":"常作为近代制度范型","C":"世界历史最悠久的中央银行，题目问近代模式","D":"成立时间晚于前两者"},"conceptId":"central-models"},{"id":"fin-04-q09","number":9,"group":"中央银行","type":"single","stem":"中央银行直接进入一级市场购买国库券的行为，从其职能上看属于（　　）。","options":{"A":"对政府融通资金","B":"代理国库","C":"充当最后贷款人","D":"调节国际收支"},"answer":["A"],"explanationSupplement":"若在允许此操作的假设下直接认购一级发行的国债，款项给政府，因此构成对政府融资。我国《中国人民银行法》第二十九条禁止人民银行直接认购、包销政府债券。","optionExplanations":{"A":"一级发行款项流入发行人，属于直接融资","B":"经理国库指办理财政款项收付与管理","C":"主要面向银行体系的紧急流动性支持","D":"与跨境收支管理职能不同"},"conceptId":"central-roles"},{"id":"fin-04-q10","number":10,"group":"中央银行","type":"single","stem":"在中央银行的职能中，“银行的银行”的职能主要是指（　　）。","options":{"A":"垄断发行货币，调节货币供应量","B":"代理国库，对政府融通资金","C":"集中保管存款准备金，充当最后贷款人","D":"实施货币政策，制定金融法规"},"answer":["C"],"explanationSupplement":"“银行的银行”面向存款机构等金融机构，典型业务为保管准备金、清算和必要时流动性支持。","optionExplanations":{"A":"对应发行的银行与货币政策","B":"对应政府的银行且我国另有融资禁令","C":"体现银行体系的准备金和流动性支持","D":"概括宏观政策及相应法定职能"},"conceptId":"central-roles"},{"id":"fin-04-q11","number":11,"group":"中央银行","type":"discussion","stem":"实行准中央银行制度的典型国家和地区是（　　）。","options":{"A":"英国","B":"韩国","C":"美国","D":"新加坡"},"answer":[],"explanationSupplement":"新加坡常被旧式分类作为货币管理局形式的例子。新加坡金融管理局现行公开职责明确其是中央银行，并行使货币政策、发行货币等职能。","optionExplanations":{"A":"英格兰银行通常视为现代中央银行","B":"韩国银行履行中央银行职能","C":"美联储为联邦储备体系","D":"对应传统形式分类，现行 MAS 是中央银行"},"conceptId":"central-models"},{"id":"fin-04-q12","number":12,"group":"中央银行","type":"discussion","stem":"目前，唯一没有资本金的中央银行是（　　） 的中央银行。","options":{"A":"中国香港","B":"新加坡","C":"韩国","D":"德国"},"answer":[],"explanationSupplement":"《韩国银行法》第二条规定韩国银行是无资本金的特别法人。该条支持韩国这一例子，不能证明全世界仅此一例。","optionExplanations":{"A":"香港金管局是香港货币当局，不能据机构名称判定资本制度","B":"新加坡有自己的货币当局法","C":"韩国银行无资本金得到法律条文支持","D":"德意志联邦银行资本制度不同"},"conceptId":"central-models"},{"id":"fin-04-q13","number":13,"group":"中央银行","type":"single","stem":"中国人民银行负责国家的金融稳定，防范和化解（　　）。","options":{"A":"银行风险","B":"信用风险","C":"非系统性风险","D":"系统性风险"},"answer":["D"],"explanationSupplement":"金融稳定职责强调识别和防范可能扩散至金融系统、影响关键服务的风险。个别风险一旦传播也可能升级为系统性风险。","optionExplanations":{"A":"银行风险可能成为系统风险的一部分","B":"信用风险是风险类型之一","C":"单一机构风险尚未涉及系统功能","D":"对应金融系统整体稳定"},"conceptId":"central-roles"},{"id":"fin-04-q14","number":14,"group":"中央银行","type":"single","stem":"中国人民银行作为政府的银行，其重要的职能是（　　）。","options":{"A":"对政府贷款","B":"再贷款","C":"经理国库","D":"再贴现"},"answer":["C"],"explanationSupplement":"经理国库是人民银行法定职责，包括依法办理国库相关事项。我国禁止央行向政府财政透支或直接认购、包销政府债券。","optionExplanations":{"A":"我国题境下不能把对政府贷款当成常规职责","B":"是面向金融机构的政策工具","C":"体现央行服务政府的法定角色","D":"是面向合格票据的政策工具"},"conceptId":"central-roles"},{"id":"fin-04-q15","number":15,"group":"中央银行","type":"single","stem":"欧洲中央银行是为了适应欧元发行流通而设立的金融机构。从组织形式上看，其属于（　　）。","options":{"A":"一元式中央银行制度","B":"二元式中央银行制度","C":"跨国的中央银行制度","D":"准中央银行制度"},"answer":["C"],"explanationSupplement":"欧洲中央银行和采用欧元的成员国央行组成欧元体系，共同履行统一货币政策，符合跨国形式。","optionExplanations":{"A":"是单一国家内集中组织形式","B":"通常在一个国家内存在不同组织层级","C":"跨越成员国边界","D":"不能只凭机构名称区分"},"conceptId":"central-models"},{"id":"fin-04-q16","number":16,"group":"中央银行","type":"single","stem":"其他情况不变，中央银行提高商业银行再贴现率，货币供给量将可能（　　）。","options":{"A":"增加","B":"减少","C":"不变","D":"不定"},"answer":["B"],"explanationSupplement":"再贴现率提高会增加银行把已贴现票据转给央行获取资金的成本，可能减少资金需求和信贷扩张。题设保持其他因素不变。","optionExplanations":{"A":"通常不是成本上升的直接结果","B":"常见传导方向","C":"若工具使用量极小，实际影响可能弱","D":"有条件的方向判断可作出"},"conceptId":"central-balance"},{"id":"fin-04-q17","number":17,"group":"中央银行","type":"single","stem":"中国人民银行实行的体制是（　　）。","options":{"A":"二元中央银行体制","B":"一元中央银行体制","C":"多元中央银行体制","D":"复合中央银行体制"},"answer":["B"],"explanationSupplement":"人民银行通过总行和分支机构集中履职，组织分类中属于单一中央银行制的一元式。","optionExplanations":{"A":"常以中央层和分区实体的制度区分","B":"单一中央银行组织承担主要职责","C":"不是题设中国的组织形式","D":"复合式还兼行普通商业银行业务"},"conceptId":"central-models"},{"id":"fin-04-q18","number":18,"group":"中央银行","type":"single","stem":"一个国家的中央银行在金融宏观调控中发挥重要的作用，中央银行的职能不包括（　　）。","options":{"A":"发行的银行","B":"银行的银行","C":"政府的银行","D":"结算的银行"},"answer":["D"],"explanationSupplement":"常见“三类职能”按服务对象归纳为发行的银行、银行的银行、政府的银行。组织结算是央行实际业务，归于银行的银行等职责。","optionExplanations":{"A":"是三类概括之一","B":"涵盖准备金、最后贷款人及银行间清算","C":"经理国库等归入此类","D":"不是三类中的独立类别"},"conceptId":"central-roles"},{"id":"fin-04-q19","number":19,"group":"中央银行","type":"single","stem":"中央银行和商业银行最主要的区别是（　　）。","options":{"A":"中央银行的业务对象是银行和企业，商业银行的业务对象是个人","B":"中央银行负责货币的发行，商业银行负责货币的回笼","C":"中央银行是国家机关，商业银行是金融机构","D":"中央银行是管理金融事业的国家机关，商业银行是企业法人"},"answer":["D"],"explanationSupplement":"我国人民银行执行法定中央银行职责，商业银行依法设立为经营存贷款、结算等业务的企业法人。题目要求最精确的机构属性差异。","optionExplanations":{"A":"商业银行服务对象包括企业和个人","B":"职责不只是发行或回笼","C":"后半句范围太宽，不能精确区分","D":"同时点明中央银行公共职责和商业银行企业属性"},"conceptId":"central-roles"},{"id":"fin-04-q20","number":20,"group":"中央银行","type":"single","stem":"下列属于中央银行负债业务的是（　　）。","options":{"A":"货币发行","B":"再贷款","C":"再贴现","D":"证券买卖"},"answer":["A"],"explanationSupplement":"央行发行货币使央行货币负债增加。再贷款和再贴现形成央行债权，买入证券时形成持券资产。","optionExplanations":{"A":"央行负债","B":"央行对机构的债权","C":"央行取得票据形成资产","D":"通常为央行资产运用或其逆向处理"},"conceptId":"central-balance"},{"id":"fin-04-q21","number":21,"group":"中央银行","type":"single","stem":"中央银行之所以成为中央银行，最基本、最重要的标志是（　　）。","options":{"A":"集中存款准备金","B":"集中与垄断货币发行","C":"充当“最后贷款人”","D":"代理国库"},"answer":["B"],"explanationSupplement":"法定货币发行权是区分中央银行和普通商业银行的典型制度标志。商业银行可以通过贷款创造存款，但不因此拥有现金发行权。","optionExplanations":{"A":"是银行的银行的业务","B":"直接对应货币发行权","C":"重要的金融稳定职能","D":"对应政府的银行"},"conceptId":"central-roles"},{"id":"fin-04-q22","number":22,"group":"中央银行","type":"single","stem":"（　　）确立了中央银行在金融体系中的核心和主导地位，确定了中央银行对金融机构实施金融监督管理的必然性与必要性。","options":{"A":"依法实施货币政策","B":"代理国库","C":"充当“最后贷款人”角色","D":"依法金融监管"},"answer":["C"],"explanationSupplement":"最后贷款人能向符合条件的机构提供紧急流动性，也使风险监测和约束尤其重要。实际监管分工须以制度规定为准。","optionExplanations":{"A":"是央行另一核心职能","B":"对应国库服务","C":"题干强调紧急资金支持与监管的联系","D":"这是被解释的职责，非题干强调的角色"},"conceptId":"central-roles"},{"id":"fin-04-q23","number":23,"group":"中央银行","type":"single","stem":"下列中央银行的行为和服务中，体现其“银行的银行”职能的是（　　）。","options":{"A":"代理国库","B":"对政府提供信贷","C":"集中商业银行现金准备","D":"发行货币"},"answer":["C"],"explanationSupplement":"银行准备金由中央银行集中保管并用于结算，与面向财政部门的经理国库及现金发行分别归类。","optionExplanations":{"A":"服务政府国库","B":"属假设下对政府融资，我国央行受法律约束","C":"对应银行存款准备金业务","D":"对应发行的银行"},"conceptId":"central-roles"},{"id":"fin-04-q24","number":24,"group":"中央银行","type":"single","stem":"金融宏观调控的主要承担者是（　　）。","options":{"A":"中央银行","B":"商业银行","C":"财政部","D":"统计局"},"answer":["A"],"explanationSupplement":"中央银行通过货币政策工具影响融资条件、金融市场及总需求。财政部门主要运用财政政策，也参与宏观协调。","optionExplanations":{"A":"承担货币和金融宏观调控核心职责","B":"参与政策传导，不负责制定货币政策","C":"负责财政预算等","D":"负责统计"},"conceptId":"central-roles"},{"id":"fin-04-q25","number":25,"group":"中央银行","type":"single","stem":"以下银行不属于中央银行的是（　　）。","options":{"A":"英格兰银行","B":"新西兰储备银行","C":"美国银行","D":"德意志联邦银行"},"answer":["C"],"explanationSupplement":"美国银行通常指 Bank of America，是商业银行。美国中央银行体系是美联储。","optionExplanations":{"A":"英国央行","B":"新西兰央行","C":"属于商业银行","D":"德国央行，参与欧元体系"},"conceptId":"central-models"},{"id":"fin-04-q26","number":26,"group":"中央银行","type":"single","stem":"流通中的现金是（　　）。","options":{"A":"政策性银行的负债","B":"商业银行的负债","C":"信用合作社的负债","D":"中央银行的负债"},"answer":["D"],"explanationSupplement":"公众手中的流通现金是中央银行发行并计在央行负债端的货币。银行库存里的现钞，从银行视角是其资产。","optionExplanations":{"A":"不是发行现金的主体","B":"商业银行的存款负债与流通现金不同","C":"信用社无现金发行权","D":"央行发行现金形成央行负债"},"conceptId":"central-balance"},{"id":"fin-04-q27","number":27,"group":"中央银行","type":"single","stem":"中央银行的资产业务不包括（　　）。","options":{"A":"再贴现和再贷款业务","B":"证券买卖业务","C":"经理国库业务","D":"国际储备业务"},"answer":["C"],"explanationSupplement":"国库存款可以列入央行负债。经理国库本身是法定服务。再贷款、证券持有和国际储备则常体现在央行资产端。","optionExplanations":{"A":"对金融机构债权","B":"买入证券增加央行资产","C":"服务政府国库，不是央行资产运用","D":"黄金与外汇储备通常是央行资产"},"conceptId":"central-balance"},{"id":"fin-04-q28","number":28,"group":"中央银行","type":"single","stem":"超额准备金存款在商业银行的日常业务活动中（　　）。","options":{"A":"可以自由支配","B":"经人民银行审批可以使用","C":"经银保监会审批可以使用","D":"不得投入使用"},"answer":["A"],"explanationSupplement":"商业银行超出法定要求的准备金可在合规范围内用于日常支付和清算。相应业务仍要满足流动性和准备金管理要求。","optionExplanations":{"A":"可按规则调动，用于支付等","B":"正常资金调度不以逐笔审批为定义","C":"不是需旧机构逐笔许可的项目","D":"与法定最低要求混淆"},"conceptId":"central-balance"},{"id":"fin-04-q29","number":29,"group":"中央银行","type":"single","stem":"下列中央银行资产负债项目中，属于中央银行对金融机构债权的是（　　）。","options":{"A":"金融机构存款","B":"存款准备金","C":"贴现及放款","D":"通货发行"},"answer":["C"],"explanationSupplement":"央行把资金借给金融机构或贴现票据形成债权。金融机构在央行的存款属于该机构的资产、央行的负债。","optionExplanations":{"A":"央行对机构负债","B":"储存在央行时属于央行负债","C":"贴现和放款都能形成对机构债权","D":"对货币持有人的负债"},"conceptId":"central-balance"},{"id":"fin-04-q30","number":30,"group":"中央银行","type":"discussion","stem":"（　　）是中央银行对商业银行和其他金融机构短期融通资金的基准利率。","options":{"A":"中央银行存款准备金率","B":"中央银行贴现率","C":"同业拆借利率","D":"一年期国债利率"},"answer":[],"explanationSupplement":"贴现或再贴现利率适用于相应工具。我国央行主要政策利率的现行操作口径为公开市场 7 天期逆回购操作利率，融资工具适用利率依具体业务而定。","optionExplanations":{"A":"属于比率工具而非融资价格","B":"可描述相应贴现工具，不能统称所有央行短期融资的基准","C":"是同业市场资金价格","D":"是债券市场收益率"},"conceptId":"central-balance"},{"id":"fin-04-q31","number":31,"group":"政策性银行与商业银行","type":"single","stem":"以下不属于政策性金融机构职能的是（　　）。","options":{"A":"倡导性职能","B":"选择性职能","C":"服务性职能","D":"监督性职能"},"answer":["D"],"explanationSupplement":"政策性金融机构对重点或薄弱领域提供资金，引导社会资金、填补商业供给不足并服务政策目标。监管监督由依法承担职权的部门实施。","optionExplanations":{"A":"引导资金投向","B":"有重点地支持特定领域","C":"提供契合政策目标的金融服务","D":"行政监督不属于其融资职能"},"conceptId":"policy-banks"},{"id":"fin-04-q32","number":32,"group":"政策性银行与商业银行","type":"single","stem":"下列金融机构中，属于存款性金融机构的是（　　）。","options":{"A":"投资银行","B":"保险公司","C":"投资基金","D":"储蓄银行"},"answer":["D"],"explanationSupplement":"按主要资金来源区分，储蓄银行以存款作为重要负债来源。保险公司以合同保费为主，基金聚集投资资金。","optionExplanations":{"A":"以承销、并购服务等为主","B":"保费形成契约性资金来源","C":"以发行份额募集资金","D":"吸收存款是主要特征"},"conceptId":"institutions"},{"id":"fin-04-q33","number":33,"group":"政策性银行与商业银行","type":"single","stem":"商业银行经营与普通企业经营的一个重要区别是（　　）。","options":{"A":"高风险经营","B":"高负债经营","C":"高资产经营","D":"高盈利经营"},"answer":["B"],"explanationSupplement":"银行常以较小比例权益支撑大量存款等负债，金融杠杆较高，所以资本充足和流动性管理尤为关键。","optionExplanations":{"A":"并非所有银行都比普通企业风险更高","B":"存款等债务构成较大资金来源","C":"资产规模取决于机构大小","D":"盈利能力无法靠机构类别直接确定"},"conceptId":"bank-basics"},{"id":"fin-04-q34","number":34,"group":"政策性银行与商业银行","type":"single","stem":"我国政策性银行的资金来源主要靠（　　）。","options":{"A":"自筹","B":"发行股票","C":"集资","D":"财政划拨与发行金融债券"},"answer":["D"],"explanationSupplement":"政府出资可形成资本金，政策性金融债可形成市场化筹资来源。具体机构还可依法利用借款等渠道，资金结构依实际情况。","optionExplanations":{"A":"市场运作不等于资金完全自筹","B":"非典型主要来源","C":"没有概括主要正规渠道","D":"兼顾资本支持与发行金融债券融资"},"conceptId":"policy-banks"},{"id":"fin-04-q35","number":35,"group":"政策性银行与商业银行","type":"single","stem":"由若干国家联合组建一家中央银行，并在其成员范围内行使全部或部分中央银行职能，这种中央银行组织形式属于（　　）。","options":{"A":"准中央银行制度","B":"二元式中央银行制度","C":"跨国的中央银行制度","D":"一元式中央银行制度"},"answer":["C"],"explanationSupplement":"由多个国家共设中央货币机构、在成员范围内履职，是跨国模式。欧洲中央银行是常见实例。","optionExplanations":{"A":"通常按机构是否完整承担央行职能区分","B":"是在一国中央银行体系内区分层级","C":"与多个国家联合一致","D":"集中于一国中央银行制度"},"conceptId":"central-models"},{"id":"fin-04-q36","number":36,"group":"政策性银行与商业银行","type":"single","stem":"商业银行把贷款分为正常类、关注类、次级类、可疑类和损失类，构成不良贷款的是（　　）。","options":{"A":"后两类","B":"后三类","C":"后四类","D":"前三类"},"answer":["B"],"explanationSupplement":"按风险从低到高排列为正常、关注、次级、可疑、损失。后三类合称不良资产，落在贷款资产上就是不良贷款。","optionExplanations":{"A":"漏了次级","B":"完整包含次级、可疑、损失","C":"把关注类误算进去","D":"纳入了正常、关注，还漏了后两类"},"conceptId":"bank-risk"},{"id":"fin-04-q37","number":37,"group":"政策性银行与商业银行","type":"discussion","stem":"商业银行在企业资金业务来往中扮演着重要角色，企业资金的进出都需要经过银行系统，这个过程中，银行扮演的角色是（　　）。","options":{"A":"交易中介","B":"清算中介","C":"信用中介","D":"支付中介"},"answer":[],"explanationSupplement":"若说为企业完成转账付款，属于支付中介。若指吸收盈余资金、经信贷转给资金短缺方，才是信用中介。题干没有给出吸储或贷款事实。","optionExplanations":{"A":"不是通常银行职能名称","B":"可以描述银行间结算过程，但范围较窄","C":"需要吸储、贷款等信用转换线索","D":"仅依据企业资金往来，支付中介更贴合"},"conceptId":"bank-basics"},{"id":"fin-04-q38","number":38,"group":"政策性银行与商业银行","type":"single","stem":"表外业务是商业银行从事的，不列入（　　）的经营活动。","options":{"A":"损益表","B":"资产负债表","C":"现金流量表","D":"财务状况变动表"},"answer":["B"],"explanationSupplement":"表外业务的传统定义指未按表内资产、负债列示的相关业务。监管统计、附注披露和会计计量仍应按规则处理。","optionExplanations":{"A":"某些表外业务可能带来手续费损益","B":"表外相对于资产负债表而言","C":"发生现金流时仍可能影响现金流量表","D":"题目分类所依基准是资产负债表"},"conceptId":"bank-accounts"},{"id":"fin-04-q39","number":39,"group":"政策性银行与商业银行","type":"single","stem":"下列经营活动中，属于商业银行负债管理范畴的是（　　）。","options":{"A":"贷款管理","B":"借入款管理","C":"现金管理","D":"债券投资管理"},"answer":["B"],"explanationSupplement":"借入款来自其他机构或资金市场，形成偿还义务，属于负债管理。贷款、现金和债券持有是银行资产。","optionExplanations":{"A":"运用资金形成资产","B":"融资形成负债","C":"管理流动性资产","D":"属于投资资产管理"},"conceptId":"bank-accounts"},{"id":"fin-04-q40","number":40,"group":"政策性银行与商业银行","type":"single","stem":"商业银行的负债业务是（　　）。","options":{"A":"形成资金来源的业务","B":"资金运用业务","C":"票据承兑业务","D":"发放贷款业务"},"answer":["A"],"explanationSupplement":"负债业务解决资金从何而来，包括吸收存款、同业借款和发行银行债券等。","optionExplanations":{"A":"概括负债业务","B":"是资产运用","C":"主要产生承诺或支付义务，按具体会计规则处理","D":"是典型资产业务"},"conceptId":"bank-accounts"},{"id":"fin-04-q41","number":41,"group":"政策性银行与商业银行","type":"single","stem":"商业银行经营的首要原则是（　　）。","options":{"A":"安全性","B":"流动性","C":"效益性","D":"保密性"},"answer":["A"],"explanationSupplement":"安全性是传统银行经营理论的前提。现行《商业银行法》第四条并列安全性、流动性、效益性三个原则。","optionExplanations":{"A":"强调保护资产并控制损失风险","B":"同样是法定原则，题问传统排序","C":"属于经营原则和收益目标","D":"保护客户信息是义务，但不在三原则中"},"conceptId":"bank-risk"},{"id":"fin-04-q42","number":42,"group":"政策性银行与商业银行","type":"single","stem":"商业银行的资产业务通常是指（　　）。","options":{"A":"资金来源业务","B":"资金运用业务","C":"中间业务","D":"代理业务"},"answer":["B"],"explanationSupplement":"资产业务把资金投放出去，形成贷款、债券等有价资产或现金类资产。","optionExplanations":{"A":"典型为负债业务","B":"概括资产业务","C":"一般指结算、咨询等服务","D":"是中间业务的一类"},"conceptId":"bank-accounts"},{"id":"fin-04-q43","number":43,"group":"政策性银行与商业银行","type":"single","stem":"2003年修改通过的《中华人民共和国商业银行法》规定，商业银行以安全性、流动性和（　　）为经营原则。","options":{"A":"政策性","B":"公益性","C":"效益性","D":"审慎性"},"answer":["C"],"explanationSupplement":"《商业银行法》第四条规定安全性、流动性和效益性三个经营原则。经营管理需要同时兼顾三项。","optionExplanations":{"A":"对应政策性金融目标","B":"属于特定活动目的","C":"是法律采用的第三项术语","D":"审慎监管要求不等于题目条文用词"},"conceptId":"bank-risk"},{"id":"fin-04-q44","number":44,"group":"政策性银行与商业银行","type":"single","stem":"商业银行资产在不受损失的条件下能够迅速变现的含义是（　　）。","options":{"A":"负债流动性","B":"经营的安全性","C":"资产的流动性","D":"经营的盈利性"},"answer":["C"],"explanationSupplement":"资产流动性指资产以较小成本迅速变现的能力。负债流动性指能否及时、合理成本地补充资金。","optionExplanations":{"A":"涉及筹资能力","B":"涉及避免损失和风险管理","C":"与题干资产变现对应","D":"涉及银行经营收益"},"conceptId":"bank-risk"},{"id":"fin-04-q45","number":45,"group":"政策性银行与商业银行","type":"single","stem":"近年来，我国商业银行逐步改变过去依赖存贷款利率的经营模式，中间业务发展加速，以下属于商业银行中间业务的是（　　）。","options":{"A":"发行金融债券","B":"信用贷款","C":"信用证业务","D":"同业拆借"},"answer":["C"],"explanationSupplement":"信用证是典型服务和结算安排，在宽口径中间业务分类可纳入。带付款承诺的信用证也是表外风险管理的对象。","optionExplanations":{"A":"负债性融资","B":"运用资金形成资产","C":"可提供结算服务并收取手续费","D":"拆入融资属负债，拆出属资产"},"conceptId":"bank-accounts"},{"id":"fin-04-q46","number":46,"group":"政策性银行与商业银行","type":"single","stem":"作为金融中介机构，商业银行的经营对象是（　　）。","options":{"A":"内控和风险","B":"信贷和风险","C":"货币和信用","D":"资产和负债"},"answer":["C"],"explanationSupplement":"商业银行以货币和信用为经营对象，通过存款、贷款、结算等组织资金融通。","optionExplanations":{"A":"是治理与管理事项","B":"信贷是部分经营活动，风险是伴生因素","C":"概括经营对象","D":"资产负债属于财务呈现"},"conceptId":"bank-basics"},{"id":"fin-04-q47","number":47,"group":"政策性银行与商业银行","type":"single","stem":"根据我国商业银行的贷款五级分类，下列贷款中，不属于不良贷款的是（　　）。","options":{"A":"关注类贷款","B":"次级类贷款","C":"损失类贷款","D":"可疑类贷款"},"answer":["A"],"explanationSupplement":"关注类存在可能影响履约的不利因素，但不属于不良贷款后三类。题干问“不属于”。","optionExplanations":{"A":"仍在不良贷款之外","B":"属于不良贷款","C":"属于不良贷款","D":"属于不良贷款"},"conceptId":"bank-risk"},{"id":"fin-04-q48","number":48,"group":"政策性银行与商业银行","type":"single","stem":"中间业务与狭义的表外业务最大区别是（　　）。","options":{"A":"承担的风险不同","B":"业务性质不同","C":"盈利能力不同","D":"业务范围不同"},"answer":["A"],"explanationSupplement":"狭义表外业务常强调担保、承诺等或有风险敞口。结算、代理等纯服务型中间业务通常以手续费为主，仍有操作和合规风险。","optionExplanations":{"A":"关键在承担的信用、市场或其他敞口","B":"业务性质不同是表现，题问核心辨析","C":"盈利高低不由分类决定","D":"范围不是最有判断力的指标"},"conceptId":"bank-accounts"},{"id":"fin-04-q49","number":49,"group":"政策性银行与商业银行","type":"single","stem":"按我国现行规定，可以向商业银行申请贴现的票据必须是（　　）商业汇票。","options":{"A":"未到期的已承兑","B":"已到期的已承兑","C":"未到期的未承兑","D":"已到期的未承兑"},"answer":["A"],"explanationSupplement":"贴现是持票人在商业汇票到期日前付息转让给有贷款业务资质的机构。承兑承诺和真实交易关系等条件还应符合现行规则。","optionExplanations":{"A":"时间与承兑符合四项中的要求","B":"票据已到期，属于到期提示付款等程序","C":"缺少付款承诺的前提","D":"既已到期，也未承兑"},"conceptId":"bank-accounts"},{"id":"fin-04-q50","number":50,"group":"政策性银行与商业银行","type":"single","stem":"由某一集团成立持股公司，由该公司控制或收购两家以上的若干银行的组织制度是（　　）。","options":{"A":"分支银行制度","B":"连锁银行制度","C":"单一银行制度","D":"持股公司制度"},"answer":["D"],"explanationSupplement":"题眼是设立独立持股公司并由其控制多家银行。各银行与同一法人的分支机构不同。","optionExplanations":{"A":"以同一法人内的总分支架构为主","B":"常由同一投资人直接控制多家银行","C":"不设跨机构控制网络","D":"由专门的公司作为持股主体"},"conceptId":"bank-governance"},{"id":"fin-04-q51","number":51,"group":"政策性银行与商业银行","type":"single","stem":"具有规模效益高，竞争力强，但会加速银行的垄断与集中等特点的商业银行组织制度是（　　）制度。","options":{"A":"单一银行","B":"持股公司","C":"连锁银行","D":"分支银行"},"answer":["D"],"explanationSupplement":"总分行制可共享技术和风控基础设施，获得规模效益，也可能推进行业集中。后者是可能结果，仍取决于准入和竞争。","optionExplanations":{"A":"强调单独经营","B":"强调独立公司持股","C":"强调共同持股人联合经营","D":"与大范围营业网点和规模效应相符"},"conceptId":"bank-governance"},{"id":"fin-04-q52","number":52,"group":"政策性银行与商业银行","type":"single","stem":"目前，我国商业银行最主要的组织制度是（　　）。","options":{"A":"单一银行制度","B":"分支银行制度","C":"持股公司制度","D":"连锁银行制度"},"answer":["B"],"explanationSupplement":"我国商业银行可按规定设立分支机构。典型全国性商业银行使用总分行架构，分支机构一般不具备独立法人资格。","optionExplanations":{"A":"与全国银行常见分支网络不符","B":"同一银行法人设总行与分支","C":"主要描述跨银行股权控制","D":"是多个独立银行共同控制关系"},"conceptId":"bank-governance"},{"id":"fin-04-q53","number":53,"group":"政策性银行与商业银行","type":"single","stem":"如果在总行之下设立若干机构，形成以总行为中心的银行网络系统，则该商业银行组织制度是（　　）。","options":{"A":"一元式银行制度","B":"综合式银行制度","C":"分支式银行制度","D":"分业经营银行制度"},"answer":["C"],"explanationSupplement":"总行下设分支，是同一银行组织内向不同地区延伸。专营或综合经营则按业务范围划分。","optionExplanations":{"A":"一元式常用于中央银行组织形式分类","B":"描述业务经营范围","C":"明确描述一个总行和分支网络","D":"描述经营范围监管安排"},"conceptId":"bank-governance"},{"id":"fin-04-q54","number":54,"group":"政策性银行与商业银行","type":"single","stem":"与其他金融机构相比，商业银行的一个最明显特征是（　　）。","options":{"A":"以盈利为目的","B":"提供金融服务","C":"吸收活期存款","D":"执行国家金融政策"},"answer":["C"],"explanationSupplement":"可吸收活期存款并通过支付账户、贷款活动提供存款货币，是商业银行的典型区分特征。","optionExplanations":{"A":"许多非银行机构也追求盈利","B":"几乎所有金融机构都提供服务","C":"是存款类银行的主要识别点","D":"并非只由商业银行执行"},"conceptId":"bank-basics"},{"id":"fin-04-q55","number":55,"group":"政策性银行与商业银行","type":"single","stem":"由某一个人或某一集团通过购买两家或更多的银行多数股票的形式，形成联合经营的银行组织制度称为（　　）制度。","options":{"A":"持股公司","B":"连锁银行","C":"分支银行","D":"单一银行"},"answer":["B"],"explanationSupplement":"传统分类中，同一自然人或团体直接控制多家银行股权并形成联合经营，称连锁银行制。借助专设控股公司则是持股公司制。","optionExplanations":{"A":"题干未提到另设控股法人","B":"直接共同持股控制多家银行","C":"一个法人通过分支经营","D":"没有多银行联合"},"conceptId":"bank-governance"},{"id":"fin-04-q56","number":56,"group":"政策性银行与商业银行","type":"single","stem":"以下（　　）不属于商业银行现金类资产。","options":{"A":"存款准备金","B":"向其他银行发放的贷款","C":"库存现金","D":"在其他银行的存款"},"answer":["B"],"explanationSupplement":"现金类资产常包括库存现金、存放央行款项和存放同业款项。对同业发放的贷款有贷款债权属性。","optionExplanations":{"A":"常记作存放央行款项","B":"属于对其他机构的贷款债权","C":"属于现金类资产","D":"属于存放同业款项"},"conceptId":"bank-accounts"},{"id":"fin-04-q57","number":57,"group":"政策性银行与商业银行","type":"single","stem":"下列哪一项不属于表外业务？（　　）","options":{"A":"交易活动与风险管理工具","B":"费用收入的产生","C":"银行贷款","D":"贷款出售"},"answer":["C"],"explanationSupplement":"银行发放普通贷款后，资产负债表上产生贷款资产。担保承诺、代理服务等的分类应看会计确认和监管要求。","optionExplanations":{"A":"部分风险工具可在表外业务管理范围内，需看确认条件","B":"典型代理业务可取得手续费","C":"银行发放普通贷款形成表内债权","D":"贷款转让需看是否终止确认及是否保留风险"},"conceptId":"bank-accounts"},{"id":"fin-04-q58","number":58,"group":"政策性银行与商业银行","type":"single","stem":"下列经营活动中，属于商业银行中间业务特点的是（　　）。","options":{"A":"运用银行自有资金","B":"以收取服务费的方式获得收益","C":"赚取利差收入","D":"留存管理现金"},"answer":["B"],"explanationSupplement":"银行代理客户完成结算或其他服务，通常取得手续费或管理费。利差是银行作为债权人和债务人运用资金的收入来源。","optionExplanations":{"A":"银行自营投资使用自有或其他资金","B":"体现按服务收费","C":"是信贷类业务常见收入","D":"是现金管理行为"},"conceptId":"bank-accounts"},{"id":"fin-04-q59","number":59,"group":"政策性银行与商业银行","type":"single","stem":"商业银行的基础头寸是指（　　）。","options":{"A":"库存现金和法定存款准备金","B":"库存现金和超额存款准备金","C":"法定存款准备金和超额存款准备金","D":"库存现金和存放同业存款"},"answer":["B"],"explanationSupplement":"按常用银行头寸分析，可随时用于支付的基础头寸由库存现金和超额准备金构成。法定准备金须满足最低要求。","optionExplanations":{"A":"含法定最低准备金","B":"两项可用于日常支付和清算","C":"漏了库存现金且纳入法定部分","D":"存放同业不是本口径组成"},"conceptId":"bank-accounts"},{"id":"fin-04-q60","number":60,"group":"政策性银行与商业银行","type":"single","stem":"银行以（　　）方式发放贷款时创造的存款是派生存款。","options":{"A":"转账","B":"现金","C":"汇票","D":"贴现"},"answer":["A"],"explanationSupplement":"转账发放贷款时，银行同时记入对借款人的贷款资产和借款人的账户存款，银行体系存款因此增加。","optionExplanations":{"A":"存款入账形成派生存款","B":"交付现钞不直接按题设计入存款账户","C":"汇票是支付或信用工具","D":"贴现可形成信贷资产，但题问发放贷款的入账方式"},"conceptId":"bank-basics"},{"id":"fin-04-q61","number":61,"group":"政策性银行与商业银行","type":"single","stem":"假定年贴现率为 6%，2年后一笔10000元的资金的现值为（　　）元。","options":{"A":"8900","B":"8929","C":"9100","D":"9750"},"answer":["A"],"explanationSupplement":"假定按年复利折现，现值＝10,000 ÷ (1＋6%)² ≈ 8,899.96 元，取最接近整数为 8,900 元。","optionExplanations":{"A":"是按复利计算后取整","B":"近似用两年单利折现计算","C":"与给定年复利不符","D":"折现幅度过小"},"conceptId":"bank-accounts"},{"id":"fin-04-q62","number":62,"group":"政策性银行与商业银行","type":"discussion","stem":"信托与支付结算业务属于商业银行的（　　）。","options":{"A":"资产业务","B":"负债业务","C":"投资业务","D":"中间业务"},"answer":[],"explanationSupplement":"支付结算是典型中间业务。银行一般业务分类中的受托代理与信托投资的法定范围不同，我国《商业银行法》第四十三条限制境内商业银行从事信托投资，国家另有规定的除外。","optionExplanations":{"A":"支付结算不属于资金投放","B":"支付结算并非吸收资金形成负债","C":"支付结算不是自营投资","D":"只在宽泛的代理服务分类且符合许可时可理解"},"conceptId":"bank-accounts"},{"id":"fin-04-q63","number":63,"group":"政策性银行与商业银行","type":"single","stem":"股份制商业银行的最高权力机构是（　　）。","options":{"A":"股东大会","B":"董事长","C":"监事会","D":"行长（总经理）"},"answer":["A"],"explanationSupplement":"股份有限公司的股东会是公司的权力机构，传统题干用“股东大会”。董事会负责决策治理，高级管理层负责经营实施。","optionExplanations":{"A":"指股份有限公司股东会","B":"是董事会负责人","C":"是特定治理安排下的监督机关","D":"属于高级管理层"},"conceptId":"bank-governance"},{"id":"fin-04-q64","number":64,"group":"政策性银行与商业银行","type":"single","stem":"商业银行的（　　）对构建高效合规风险管理体系以确保银行合规负有最终责任。","options":{"A":"股东大会","B":"董事会","C":"监事会","D":"高级管理层"},"answer":["B"],"explanationSupplement":"《金融机构合规管理办法》第八条规定董事会对合规管理有效性承担最终责任，高级管理层承担实施责任。","optionExplanations":{"A":"股东会行使公司权力，但该条未将最终合规责任赋予股东会","B":"是监管规则指定主体","C":"监督职能与最终责任不同","D":"组织落实管理要求"},"conceptId":"bank-governance"},{"id":"fin-04-q65","number":65,"group":"政策性银行与商业银行","type":"discussion","stem":"商业银行是资本市场的重要参与者，它的哪一项业务直接为资本市场提供了资金来源？（　　）","options":{"A":"吸收存款","B":"发售理财产品","C":"发放贷款","D":"投放基础货币"},"answer":[],"explanationSupplement":"发放贷款向借款人提供资金，通常属于间接融资。理财产品可依合同配置资本市场资产，也不等于银行吸收存款。题目没有说明贷款用途或理财产品实际投向。","optionExplanations":{"A":"为银行提供负债资金","B":"产品可能投资资本市场，未说明投向","C":"向借款人提供资金，不等于直接向资本市场投资","D":"央行资产负债表操作形成基础货币"},"conceptId":"bank-accounts"},{"id":"fin-04-q66","number":66,"group":"政策性银行与商业银行","type":"single","stem":"商业银行将资金从资金盈余者手中转移到资金短缺者手中，使闲置资金得到充分运用，这种功能被称为商业银行的（　　）功能。","options":{"A":"信用中介","B":"支付中介","C":"信用创造","D":"直接融资"},"answer":["A"],"explanationSupplement":"银行吸收盈余资金并通过贷款服务资金短缺者，称信用中介。企业用银行进行付款是支付中介。","optionExplanations":{"A":"资金融通的信用中介机制","B":"清算和划付","C":"强调贷款转账产生存款的机制","D":"银行通过自身资产负债提供贷款通常属于间接融资"},"conceptId":"bank-basics"},{"id":"fin-04-q67","number":67,"group":"政策性银行与商业银行","type":"single","stem":"商业银行（　　）的主要收入来源是手续费收入。","options":{"A":"贷款业务","B":"存款业务","C":"同业拆借业务","D":"支付结算业务"},"answer":["D"],"explanationSupplement":"支付结算提供划付、清算等服务，可按规定收取服务费。存贷款业务的典型收入是利差。","optionExplanations":{"A":"贷款的主要典型收益是利息","B":"存款通常需要支付利息","C":"拆出取得利息，拆入支付利息","D":"按服务收费的典型业务"},"conceptId":"bank-accounts"},{"id":"fin-04-q68","number":68,"group":"政策性银行与商业银行","type":"single","stem":"商业银行经营的核心目标是（　　）。","options":{"A":"安全性","B":"流动性","C":"盈利性","D":"持续性"},"answer":["C"],"explanationSupplement":"商业银行作为经营机构追求效益与盈利。盈利目标要与经营的安全性、流动性和合规要求一同考虑。","optionExplanations":{"A":"是经营原则和风险约束","B":"是经营原则和偿付约束","C":"对应企业经营目标","D":"是经营可持续性的要求"},"conceptId":"bank-risk"},{"id":"fin-04-q69","number":69,"group":"其他金融机构","type":"single","stem":"以下（　　）是非银行金融机构。","options":{"A":"邮政储蓄银行","B":"消费金融公司","C":"中国农业银行","D":"国家开发银行"},"answer":["B"],"explanationSupplement":"消费金融公司依法从事消费贷款，属于经批准设立的非银行金融机构，不吸收公众存款。","optionExplanations":{"A":"是商业银行","B":"属于非银行金融机构","C":"是商业银行","D":"是开发性金融机构，以银行形式设立"},"conceptId":"nonbank"},{"id":"fin-04-q70","number":70,"group":"其他金融机构","type":"single","stem":"原中国银监会负责监督管理的银行业金融机构中不包括（　　）。","options":{"A":"国有商业银行","B":"城市商业银行","C":"农村商业银行","D":"基金公司"},"answer":["D"],"explanationSupplement":"这是历史机构分工题。商业银行原由银监会监管，证券投资基金及其管理人由证监会依法监管。现行金融机构分工见精讲。","optionExplanations":{"A":"纳入原银行业监管范围","B":"纳入原银行业监管范围","C":"纳入原银行业监管范围","D":"基金公司属于证券基金监管范围"},"conceptId":"institutions"},{"id":"fin-04-q71","number":71,"group":"其他金融机构","type":"single","stem":"中国于2014年起倡导成立的政府间性质的亚洲区域多边开发机构是（　　）。","options":{"A":"亚洲基础设施投资银行","B":"亚洲开发投资银行","C":"亚洲开发银行","D":"丝路基金"},"answer":["A"],"explanationSupplement":"中国于 2013 年提出筹建亚洲基础设施投资银行，2014 年有关国家签署筹建备忘录，亚投行为政府间多边开发银行。","optionExplanations":{"A":"对应基础设施投资与多边开发职能","B":"不是该机构正式名称","C":"是另一个多边开发银行","D":"属于投资基金安排"},"conceptId":"international"},{"id":"fin-04-q72","number":72,"group":"其他金融机构","type":"single","stem":"下列不属于世界银行资金来源的是（　　）。","options":{"A":"各成员国交纳的股金","B":"向国际金融市场的借款","C":"发行债券和收取贷款利息","D":"接受各国中央银行的黄金存款和商业银行的存款"},"answer":["D"],"explanationSupplement":"世界银行狭义指 IBRD 和 IDA。题中发债和贷款收入主要对应 IBRD，IDA 另有成员补充资金等来源。","optionExplanations":{"A":"成员认缴资本支持 IBRD","B":"市场筹资是 IBRD 的重要来源","C":"债券筹资和经营收入支持 IBRD 运作","D":"不是世界银行的存款来源"},"conceptId":"international"},{"id":"fin-04-q73","number":73,"group":"其他金融机构","type":"single","stem":"发起人发起设立信托的前提条件是必须要有（　　）。","options":{"A":"确定的信托收益","B":"巨额的信托财产","C":"固定的信托要件","D":"合法的信托目的"},"answer":["D"],"explanationSupplement":"《信托法》要求设立信托有合法目的及确定的信托财产，并依规则采用书面形式。信托收益随资产和安排变化。","optionExplanations":{"A":"无普遍保证收益","B":"须确定财产，不要求巨额","C":"笼统表述，未指出法律条件","D":"符合设立信托的明确条件"},"conceptId":"trust"},{"id":"fin-04-q74","number":74,"group":"其他金融机构","type":"discussion","stem":"我国对信托投资公司进行统一监督管理的金融监管机构是（　　）。","options":{"A":"中国人民银行","B":"金融稳定发展委员会","C":"中国证券监督管理委员会","D":"中国银行保险业监督管理委员会"},"answer":[],"explanationSupplement":"原中国银保监会承担相关监管。现行《信托公司管理办法》由国家金融监督管理总局发布，自 2026 年 1 月 1 日施行，由其及派出机构依法监管信托公司。","optionExplanations":{"A":"现行并非信托公司日常监管机关","B":"并非题设信托公司监管机关","C":"主要负责证券期货领域","D":"是历史机构名称，不能当作现行机构答案"},"conceptId":"trust"},{"id":"fin-04-q75","number":75,"group":"其他金融机构","type":"single","stem":"在特定时期，我国政府为解决银行业不良资产，由政府出资专门收购和集中处置银行业不良资产的机构是（　　）。","options":{"A":"银监会","B":"保监会","C":"金融租赁公司","D":"金融资产管理公司"},"answer":["D"],"explanationSupplement":"在历史处置安排下，金融资产管理公司集中收购、管理和处置国有银行不良贷款等资产。不同于负责监督行业的监管机构。","optionExplanations":{"A":"历史银行业监管机关","B":"历史保险业监管机关","C":"以融资租赁为核心业务","D":"对应收购、管理及处置不良金融资产"},"conceptId":"nonbank"},{"id":"fin-04-q76","number":76,"group":"其他金融机构","type":"single","stem":"我国为企业集团成员单位提供财务管理服务的非银行金融机构是（　　）。","options":{"A":"信托投资公司","B":"财务公司","C":"小额贷款公司","D":"金融租赁公司"},"answer":["B"],"explanationSupplement":"企业集团财务公司为成员单位提供财务管理和资金集中服务，强调集团内部成员关系。","optionExplanations":{"A":"提供信托服务","B":"专为企业集团成员提供财务管理","C":"主要经营小额贷款","D":"主要开展融资租赁"},"conceptId":"nonbank"},{"id":"fin-04-q77","number":77,"group":"其他金融机构","type":"discussion","stem":"根据有关规定，我国小额贷款公司的主要资金来源是（　　）。","options":{"A":"借入外资和融入资金","B":"发行债券和捐赠资金","C":"吸收存款和融入资金","D":"股东缴纳的资本金和捐赠资本"},"answer":[],"explanationSupplement":"现行小额贷款公司规则区分自有资金与外部融资，后者按适用规则包括银行借款等非标准化融资和发行债券等标准化融资，并受额度管理。禁止吸收公众存款。","optionExplanations":{"A":"可能有依法融资，但不能概括主要来源","B":"可能有债券融资，但选项的概括不完整","C":"吸收公众存款被禁止","D":"属于历史表述的一部分，不能作为现行完整概括"},"conceptId":"nonbank"},{"id":"fin-04-q78","number":78,"group":"其他金融机构","type":"single","stem":"我国的小额贷款公司是由自然人、企业法人与其他社会组织投资设立的机构，可以经营小额贷款业务，但不得（　　）。","options":{"A":"发放企业贷款","B":"发放涉外贷款","C":"吸收公众存款","D":"从商业银行融入资金"},"answer":["C"],"explanationSupplement":"现行《小额贷款公司监督管理暂行办法》将其定义为主要经营小额贷款、不得吸收公众存款的地方金融组织。贷款对象和融资方式有相应条件。","optionExplanations":{"A":"可以在范围内为小微企业等提供小额贷款","B":"具体适用条件另看业务地域及监管规定","C":"属于明确禁止事项","D":"可按合规条件向银行等机构融资"},"conceptId":"nonbank"},{"id":"fin-04-q79","number":79,"group":"其他金融机构","type":"single","stem":"在我国，负责对期货市场进行监管的机构是（　　）。","options":{"A":"中国人民银行","B":"中国银行业协会","C":"中国证券监督管理委员会","D":"中国银行保险业监督管理委员会"},"answer":["C"],"explanationSupplement":"我国证监会及派出机构依法承担期货监管职责。交易所和行业协会进行自律管理，不能替代行政监管。","optionExplanations":{"A":"承担货币政策及相应金融管理","B":"属行业协会","C":"履行期货市场行政监管职责","D":"为历史机构名称，且非期货市场主管机构"},"conceptId":"institutions"},{"id":"fin-04-q80","number":80,"group":"其他金融机构","type":"single","stem":"下列属于契约型金融机构的是（　　）。","options":{"A":"金融公司","B":"封闭型基金","C":"保险公司","D":"信用社"},"answer":["C"],"explanationSupplement":"契约型机构依据长期保险、养老金等合同收到资金，典型代表为保险公司。基金依投资目的募集份额。","optionExplanations":{"A":"通常作为融资类机构的泛称","B":"按投资资金集合方式分类","C":"保费体现长期契约性来源","D":"主要属于存款性机构"},"conceptId":"nonbank"},{"id":"fin-04-q81","number":81,"group":"其他金融机构","type":"single","stem":"“受人之托，代人理财”是（　　）的基本特征。","options":{"A":"基金公司","B":"租赁公司","C":"金融担保公司","D":"信托投资公司"},"answer":["D"],"explanationSupplement":"信托公司以受托人身份依信托目的为受益人管理或处分财产，承担受托职责。“代人理财”也可用来描述其他服务，题问这一传统信托概括。","optionExplanations":{"A":"基金公司也受托管理资金，但题眼指向信托关系","B":"融资租赁安排","C":"对信用义务提供保证","D":"以信托受托人为核心业务"},"conceptId":"trust"},{"id":"fin-04-q82","number":82,"group":"其他金融机构","type":"single","stem":"下列组织中，在国际银行业监管领域最具影响力的是（　　）。","options":{"A":"国际复兴开发银行","B":"巴塞尔委员会","C":"世界银行","D":"国际货币基金组织"},"answer":["B"],"explanationSupplement":"巴塞尔银行监管委员会制定银行审慎监管国际标准。其规则在各司法辖区依当地法律监管安排落实。","optionExplanations":{"A":"是世界银行的开发融资机构","B":"国际银行监管标准制定和协调机构","C":"专注发展融资","D":"重在宏观经济监测和国际收支支持"},"conceptId":"international"},{"id":"fin-04-q83","number":83,"group":"其他金融机构","type":"single","stem":"信托关系的核心是（　　）。","options":{"A":"信任和诚信","B":"信托财产","C":"委托人","D":"受托人"},"answer":["B"],"explanationSupplement":"信托财产是受托人管理或处分的对象。其确定性及与委托人、受托人其他财产相区分的规则，是信托制度关键。","optionExplanations":{"A":"是重要前提，无法代替可确定的财产","B":"信托安排围绕该财产运作","C":"是设立信托的一方","D":"是管理或处分信托财产的一方"},"conceptId":"trust"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }
 const chapterViews = chapter?.visual ? ['learn', 'map', 'visual', 'practice'] : ['learn', 'map', 'practice'];
 function chapterActions(visible) {
  $$('[data-action="favorites"], [data-action="records"], [data-action="download"], .sidebar-quick-actions').forEach(node => node.hidden = !visible);
 }
 function showHome() {
  saveReadingPosition();
  pausePPF();
  chapterActions(false);
  $('#home-view').hidden=false;
  $('#chapter-view').hidden=true;
  document.title='学习目录 · 知其所以';
  window.scrollTo({top:0,behavior:'instant'});
 }
 function showChapter() {
  chapterActions(true);
  $('#home-view').hidden=true;
  $('#chapter-view').hidden=false;
  document.title=chapter.title+' · 知其所以';
 }
 function switchView(next, scroll=true) {
  if (!chapterViews.includes(next)) next='learn';
  saveReadingPosition();
  pausePPF();
  view=next;
  $$('.content-view').forEach(v=>v.hidden=v.id!=='view-'+next);
  $$('[data-view]').forEach(b=>{
   const active=b.dataset.view===next;
   b.classList.toggle('active',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(scroll) {
   readingTracking=false;
   $('.view-tabs').scrollIntoView({behavior:'instant',block:'start'});
   requestAnimationFrame(()=>requestAnimationFrame(()=>{readingTracking=true;}));
  }
  if(next==='map')fitMapOnFirstOpen();
  if(next==='practice')mountQuiz();
  history.replaceState(null,'','#'+next);
 }
 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}
 function download() {
  if(offline) {
   openModal('你正在使用离线学习版','<p>本文件包含本章的讲解、思维导图和练习。保存好这份 HTML，断网后双击即可继续学习。</p><p>可在「学习记录」中导出、导入本章备份。</p>');
   return;
  }
  const a=el('a');
  a.href=(flatDownloads?'':'downloads/')+encodeURIComponent(chapter.downloadName);
  a.download=chapter.downloadName;
  document.body.append(a);
  a.click();
  a.remove();
  toast('离线 HTML 下载已开始，保存后可双击学习');
 }
 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  $('[data-view="visual"]').hidden=!chapter.visual;
  renderLessons();
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if(chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');}});
})();
