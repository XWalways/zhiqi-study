  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter19","number":2,"title":"信用与利率","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-02-信用与利率-离线学习.html"},"lessons":{"title":"信用与利率","subtitle":"从信用关系识别融资渠道，区分计息方法、利率理论与市场基准。","sections":[{"id":"credit","title":"信用关系与价值让渡","summary":"现在提供资金或商品使用机会，未来按约偿还。","bodyHtml":"\u003cp>\u003cstrong>信用\u003c/strong>是在约定条件下，以偿还为核心的借贷关系。信用双方分别形成债权与债务。金融学常以资金使用权的暂时让渡来解释信用：出借人保留要求返还的债权，借款人获得暂时使用机会。货币发放与清偿体现支付职能。\u003c/p>\u003cp>借贷中常有信任、收益和利息安排。传统分析用 G→G′ 表示出借货币并在将来收回本息，也用高利贷信用、借贷资本信用说明历史形态。\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>民法典规定借款合同及利息处理规则，对支付利息没有约定时，视为没有利息。\u003ca href=\"https://tjca.miit.gov.cn/zwgk/zcwj/flfg/art/2020/art_20cf1a2e1b854924b5caa744c8045d1f.html1\" target=\"_blank\" rel=\"noopener noreferrer\">民法典第六百六十七条、六百八十条\u003c/a>\u003c/p>","keyTakeaway":"辨认是否有约定偿还义务。是否付息以及利率多少还要看约定和法律规则。","pitfall":"金融学的使用权描述用于理解信用关系，具体资产的法律权利要按合同和法律分别判断。","example":"商家先给企业交货，企业约定下月付款，双方形成商业信用。无需返还的财政拨款则没有同样的借贷义务。"},{"id":"credit-forms","title":"商业、银行、国家、消费与国际信用","summary":"按信用双方、媒介和用途分别判断。","bodyHtml":"\u003cp>\u003cstrong>商业信用\u003c/strong>主要指企业在赊销等商品交易中直接给出的信用。它与商品流向、交易双方偿债能力和期限相关，连续赊欠也可能形成债务链。\u003cstrong>银行信用\u003c/strong>由银行等以货币资金提供，可通过吸收存款、发放贷款等进行期限和额度匹配，仍受风险、监管和资金条件约束。\u003c/p>\u003cp>\u003cstrong>国家信用\u003c/strong>常以政府筹资为例，如发行国债。\u003cstrong>消费信用\u003c/strong>面向个人消费用途，可用赊销、分期、消费贷款及信用卡等形式。\u003cstrong>国际信用\u003c/strong>发生于跨境交易，可以是进出口企业间的商业信用，也可以是金融机构参与的买方信贷或卖方信贷。\u003c/p>\u003cp>借记卡通常先存款后支付，贷记卡按授信额度先消费后还款，传统准贷记卡先交存备用金且可以依约透支。\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>现行商业银行信用卡业务规则以授信额度和透支功能识别信用卡。1999 年《银行卡业务管理办法》已于 2025 年废止。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=272670\" target=\"_blank\" rel=\"noopener noreferrer\">商业银行信用卡业务监督管理办法\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111915453330308.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">银行卡业务管理办法废止决定\u003c/a>\u003c/p>","keyTakeaway":"同一笔贷款可按不同标准分类，银行为个人自住购房提供的贷款既体现银行信用，也可按用途归入消费信用。","pitfall":"银行信用突破了典型商业信用的方向与规模限制，仍不能忽略资质、期限和偿还能力。","example":"出口方银行贷给外国买家以支付本国出口合同，通常称出口买方信贷；银行贷给本国出口方以支持其延期收款，称卖方信贷。"},{"id":"financing","title":"直接融资与间接融资","summary":"看投资者持有的是筹资者的权利，还是中介机构的负债。","bodyHtml":"\u003cp>\u003cmark>直接融资\u003c/mark>使资金提供者直接持有筹资企业或政府等发行的债券、股票等工具。承销、交易等服务可以由中介办理，但没有把资金关系改造成「先存款，再由银行放款」。企业交易中的商业票据也是直接信用的典型工具。\u003c/p>\u003cp>\u003cmark>间接融资\u003c/mark>中，金融中介以自身信用吸收资金，再向资金需求者提供贷款。存款人对银行有债权，银行对借款人有债权。金融机构有助于匹配不同规模、期限和风险偏好；直接融资在一定条件下减少中间环节，仍有发行、信息和合约成本。\u003c/p>","keyTakeaway":"看谁对谁负债。证券公司承销债券不改变投资者直接对发债企业享有权利。","pitfall":"直接融资可以用债权，也可以用股权。可转让性不等于直接融资。","example":"你认购甲公司债券，甲公司对你负债。你在银行存款而银行贷款给甲公司时，你的债权对象是银行。"},{"id":"bills","title":"商业汇票的承兑与贴现链条","summary":"区分付款承诺、持票人融资、机构间转让和央行再贴现。","bodyHtml":"\u003cp>\u003cstrong>承兑\u003c/strong>是付款人承诺在到期日支付汇票金额。出票、背书、承兑、付款、贴现各有不同法律功能。完成承兑会形成承兑人的到期付款责任，不能笼统当作一切汇票出票生效的唯一要件。\u003c/p>\u003cp>\u003cstrong>贴现\u003c/strong>是持票人在票据到期前转让票据并贴付利息取得资金；\u003cstrong>转贴现\u003c/strong>是金融机构把持有票据转让给其他金融机构；\u003cstrong>再贴现\u003c/strong>是金融机构向人民银行办理的融资。买断式不约定日后赎回，回购式按约安排赎回。\u003c/p>\u003cp>\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>本节对照票据法和人民银行发布的票据业务规章区分各环节。\u003ca href=\"https://cicc.court.gov.cn/html/1/380/385/12912.html\" target=\"_blank\" rel=\"noopener noreferrer\">票据法\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914522391548.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">商业汇票承兑、贴现与再贴现管理办法\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914150216887.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">电子商业汇票业务管理办法\u003c/a>\u003c/p>","keyTakeaway":"承兑看谁承诺付款，贴现看谁向持票人提供资金。","pitfall":"背书可用于转让票据权利，不等于承兑。转贴现和再贴现的受让方不同。","example":"企业持票到银行提前融资是贴现。该银行把票据转给另一银行是转贴现；向人民银行融资属于再贴现。"},{"id":"interest-math","title":"单利、复利与实际利率","summary":"把本金、计息期和通货膨胀率放在同一时间尺度比较。","bodyHtml":"\u003cp>利率表示一定时期内利息相对于本金的比率。设本金 P、每期利率 i、期数 n。单利本利和 \u003cvar>FV\u003c/var>＝P(1＋ni)，只按原本金计息。复利本利和 \u003cmark>FV＝P(1＋i)\u003csup>n\u003c/sup>\u003c/mark>，每期的利息加入下一期计息基数。\u003c/p>\u003cp>名义利率 i 衡量货币金额增长。通胀率 π 衡量同期价格水平变化，实际利率 \u003cvar>r\u003c/var>＝(1＋i)/(1＋π)−1。低利率、低通胀时常近似用 i−π。签约时估计购买力回报用预期通胀，事后计算用实现的通胀。\u003c/p>","keyTakeaway":"用精确公式还是减法近似取决于题目要求。名义利率、通胀率必须同周期。","pitfall":"利率固定与否和是否剔除通胀是两种分类。年化报价、月利率与计息期不能直接混用。","example":"本金 100 元、每年 5%、两年。单利 110 元，复利 110.25 元；若一年通胀 2%，实际利率约为 2.94%。"},{"id":"benchmarks","title":"利率分类及国内基准","summary":"区分政策工具利率、货币市场报价和贷款参考。","bodyHtml":"\u003cp>利率可按计息法分单利与复利，按是否扣除通胀分名义与实际，按合同调整方式分固定与浮动，按形成主体分官定、市场或公定利率，按作用分基准和差别利率，也可按使用范围区分国内、国际利率。\u003c/p>\u003cp>\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>我国公开市场 7 天期逆回购操作利率承担主要政策利率的角色。再贷款利率是特定工具利率，LPR 是贷款市场报价利率。Shibor 则是人民币同业拆放的报价基准，具有单利、无担保和批发性特征，按规则剔除极端报价后对其余报价作算术平均。\u003ca href=\"https://www.pbc.gov.cn/zhengcehuobisi/125207/125227/125957/5347949/ad0bc3efe0234fed8cc6260a134a6e95/2025022618190099812.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行货币政策执行报告\u003c/a> · \u003ca href=\"https://www.chinamoney.com.cn/chinese/bklpr/\" target=\"_blank\" rel=\"noopener noreferrer\">中国货币网 LPR 说明\u003c/a> · \u003ca href=\"https://www.chinamoney.com.cn/chinese/bkshibor/\" target=\"_blank\" rel=\"noopener noreferrer\">中国货币网 Shibor 实施准则\u003c/a>\u003c/p>","keyTakeaway":"看利率服务哪个市场或工具。主要政策利率、贷款参考和银行间拆放报价各有口径。","pitfall":"存款准备金率是比例。基准也不是所有融资合同共同使用的一个实际成交利率。","example":"一笔贷款可约定参考某期限 LPR 加一定点差。即使贷款参考变化，合同的实际调整日期仍取决于重定价安排。"},{"id":"rate-theories","title":"利率的四种决定视角","summary":"先辨认利率在哪个市场实现均衡。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>视角\u003c/th>\u003cth>决定机制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>马克思的利息分析\u003c/td>\u003ctd>利息是借贷资本分享利润的一部分，平均利润率为分析背景\u003c/td>\u003c/tr>\u003ctr>\u003ctd>古典理论\u003c/td>\u003ctd>储蓄与投资相互作用。其他条件不变，储蓄增加倾向于降低利率\u003c/td>\u003c/tr>\u003ctr>\u003ctd>流动性偏好理论\u003c/td>\u003ctd>货币供给与货币需求共同决定利率，利率越高通常越不愿持有无息货币\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可贷资金理论\u003c/td>\u003ctd>由可贷资金的供求决定，供求还可纳入信用扩张和现金余额调整\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>凯恩斯框架中，若货币供给超过原利率下的需求，人们会将一部分余额转换为债券。在价格、收入等给定时，债券价格上升与利率下降相对应。\u003c/p>","keyTakeaway":"题干强调储蓄和投资时，优先考虑古典理论。强调货币供求和流动性偏好时，考虑凯恩斯理论。","pitfall":"模型里的变动方向通常以其他条件不变为前提，不应用一条曲线概括全部利率变化。","example":"收入和价格水平给定，央行增加货币供给时，流动性偏好模型通常得到较低的均衡利率。"},{"id":"risk-liquidity","title":"金融工具的三性与债券价格","summary":"区分交易便利、违约风险、收益率和现值变化。","bodyHtml":"\u003cp>安全性关注本金和现金流能否实现；流动性关注多快、以何种成本变现；收益性关注利息、分红或价格变动等回报。风险越高可能要求更高风险补偿，流动性越差可能要求流动性溢价。这些是有条件的关系，不能给三者指定普遍的相关符号。\u003c/p>\u003cp>剩余期限短的工具较快自然到期，二级市场流动性仍受交易规模和深度影响。现金流固定时，债券价格是未来支付的现值：\u003cmark>贴现率上升，价格下降\u003c/mark>，贴现率下降时反之。\u003c/p>","keyTakeaway":"固定未来现金流来比较贴现率与价格。比较工具流动性还要看二级市场和交易成本。","pitfall":"票面利率、到期收益率和信用风险是不同概念。期限长短也不等于变现能力。","example":"一年后固定支付 105 元。市场贴现率为 5% 时现值 100 元，升至 10% 时现值约 95.45 元。"}],"mindmap":[{"label":"信用","target":"credit","children":[{"label":"基本特征","target":"credit","children":[{"label":"资金使用机会暂时让渡","target":"credit"},{"label":"债权债务关系","target":"credit"},{"label":"以偿还为核心","target":"credit"},{"label":"信任和收益安排","target":"credit"},{"label":"G→G′ 的典型运动形式","target":"credit"}]},{"label":"历史形态","target":"credit","children":[{"label":"高利贷信用","target":"credit"},{"label":"借贷资本信用","target":"credit"}]},{"label":"现代信用形式","target":"credit-forms","children":[{"label":"商业信用","target":"credit-forms","children":[{"label":"商品交易基础","target":"credit-forms"},{"label":"企业之间直接形成","target":"credit-forms"},{"label":"方向、规模、期限与信用能力有限","target":"credit-forms"},{"label":"可能形成债务链","target":"credit-forms"},{"label":"商业票据","target":"bills"}]},{"label":"银行信用","target":"credit-forms","children":[{"label":"金融机构媒介","target":"credit-forms"},{"label":"以货币资金提供","target":"credit-forms"},{"label":"缓解期限和额度约束","target":"credit-forms"}]},{"label":"国家信用","target":"credit-forms","children":[{"label":"国债等政府筹资","target":"credit-forms"}]},{"label":"消费信用","target":"credit-forms","children":[{"label":"赊销与分期付款","target":"credit-forms"},{"label":"消费贷款与信用卡","target":"credit-forms"}]},{"label":"国际信用","target":"credit-forms","children":[{"label":"国际商业信用","target":"credit-forms"},{"label":"国际银行信用","target":"credit-forms"},{"label":"买方信贷与卖方信贷","target":"credit-forms"}]}]},{"label":"融资渠道","target":"financing","children":[{"label":"直接融资","target":"financing"},{"label":"间接融资","target":"financing"}]}]},{"label":"利率与利率决定","target":"benchmarks","children":[{"label":"利率分类","target":"benchmarks","children":[{"label":"单利与复利","target":"interest-math"},{"label":"名义与实际","target":"interest-math"},{"label":"固定与浮动","target":"benchmarks"},{"label":"官定、市场和公定","target":"benchmarks"},{"label":"基准与差别","target":"benchmarks"},{"label":"国内与国际","target":"benchmarks"},{"label":"Shibor、政策利率及 LPR","target":"benchmarks"}]},{"label":"决定理论","target":"rate-theories","children":[{"label":"马克思的利息分析","target":"rate-theories"},{"label":"古典储蓄投资理论","target":"rate-theories"},{"label":"凯恩斯流动性偏好理论","target":"rate-theories"},{"label":"可贷资金理论","target":"rate-theories"}]},{"label":"利率与资产价格","target":"risk-liquidity","children":[{"label":"给定现金流时债券价格和贴现率反向变化","target":"risk-liquidity"},{"label":"安全性、流动性、收益性需要具体判断","target":"risk-liquidity"}]}]}]},"questions":[{"id":"fin-02-q01","number":1,"group":"信用","type":"single","stem":"从信用关系的经济分析看，信用关系的建立（　　）。","options":{"A":"改变了借贷标的物的使用权","B":"改变了借贷标的物的所有权","C":"既没有改变标的物的使用权也没有改变所有权","D":"既改变了标的物的使用权也改变了所有权"},"answer":["A"],"explanationSupplement":"金融学将借贷理解为暂时让渡资金的使用机会，同时形成要求到期归还的债权。这里的所有权是与信用关系相对的经济意义，不是在判断特定货币或资产的物权归属。","optionExplanations":{"A":"借款人能在约定期间使用资金。","B":"不能把一般经济概念等同于特定标的物的法律变动。","C":"未反映借款人获得暂时使用机会。","D":"题目考查的是暂时使用资金与保留返还债权。"},"conceptId":"credit"},{"id":"fin-02-q02","number":2,"group":"信用","type":"single","stem":"直接信用工具是指在直接投资活动中使用的信用工具，下列属于直接信用工具的是（　　）。","options":{"A":"企业债券","B":"存款凭证","C":"保险单证","D":"银行汇票"},"answer":["A"],"explanationSupplement":"直接融资中，资金提供者直接持有筹资主体发行的债权或权益工具。企业债券使投资者对发债企业享有直接债权。","optionExplanations":{"A":"企业发债直接向投资者融资。","B":"是存款人与银行之间的凭证。","C":"记录保险合同关系。","D":"由银行签发用于支付。"},"conceptId":"financing"},{"id":"fin-02-q03","number":3,"group":"信用","type":"single","stem":"下列哪一项不是现代信用的表现形式？（　　）","options":{"A":"商业信用","B":"个人信用","C":"银行信用","D":"消费信用"},"answer":["B"],"explanationSupplement":"按题目采用的常见分类，商业、银行、政府、消费及国际信用按主体、媒介或用途归类。个人信用可以描述个人作为信用主体或其履约状况，不是这一分类中的同一层级类别。","optionExplanations":{"A":"是企业交易赊销形成的信用。","B":"属于其他分类维度。","C":"由银行等金融机构提供。","D":"面向个人消费用途。"},"conceptId":"credit-forms"},{"id":"fin-02-q04","number":4,"group":"信用","type":"single","stem":"下列哪一项不是现代消费信用的表现形式？（　　）","options":{"A":"赊销","B":"分期付款","C":"延期付款","D":"发行债券"},"answer":["D"],"explanationSupplement":"消费信用让消费者先取得商品、服务或消费资金，后来按约偿还。发行债券是筹资者募集资金的证券融资方式。","optionExplanations":{"A":"购买先发生，价款后付。","B":"将价款分成多期偿还。","C":"将付款时间向后移。","D":"典型是面向投资者筹资。"},"conceptId":"credit-forms"},{"id":"fin-02-q05","number":5,"group":"信用","type":"single","stem":"信用最基本的特征是（　　）。","options":{"A":"安全性","B":"流动性","C":"收益性","D":"偿还性"},"answer":["D"],"explanationSupplement":"信贷的关键是现在转移资金或商品使用价值，未来按约归还。利息是常见对价，也存在按规定或约定不付利息的借款。","optionExplanations":{"A":"信用关系存在违约可能。","B":"债权可能不易变现。","C":"利息不是一切信用关系的必备条件。","D":"约定归还使信用区别于赠与或拨款。"},"conceptId":"credit"},{"id":"fin-02-q06","number":6,"group":"信用","type":"single","stem":"在现代信用形式的常见金融学分类中，最主要的形式是（　　）。","options":{"A":"商业信用","B":"政府信用","C":"民间信用","D":"银行信用"},"answer":["D"],"explanationSupplement":"银行信用通过吸收存款等方式汇集资金，再通过贷款等方式提供信用。它能匹配不同额度和期限，在现代金融理论的常见分类中居主要地位。","optionExplanations":{"A":"主要在交易双方之间形成。","B":"以国家或政府为主体。","C":"常指非正规或民间借贷。","D":"是金融中介开展的核心信用形式。"},"conceptId":"credit-forms"},{"id":"fin-02-q07","number":7,"group":"信用","type":"single","stem":"以金融机构为媒介的信用是（　　）。","options":{"A":"银行信用","B":"消费信用","C":"商业信用","D":"国家信用"},"answer":["A"],"explanationSupplement":"识别中介是否通过自身资产负债表筹资和放款。银行及类似金融机构通过这一路径提供的属于银行信用。","optionExplanations":{"A":"以银行等为媒介是关键。","B":"按资金用途划分，与银行信用可以重叠。","C":"通常是交易双方直接提供。","D":"国家或政府作为债务人时的分类。"},"conceptId":"credit-forms"},{"id":"fin-02-q08","number":8,"group":"信用","type":"single","stem":"以下属于信用活动的是（　　）。","options":{"A":"财政拨款","B":"商品买卖","C":"赊销","D":"救济"},"answer":["C"],"explanationSupplement":"赊销是先交货、后付款，形成以后清偿的债权债务关系。一般现款买卖、财政拨款和救济不以还本为条件。","optionExplanations":{"A":"通常没有到期偿还义务。","B":"即期交易时不产生延付信用。","C":"先取得商品、后清偿价款。","D":"转移给付通常不要求返还。"},"conceptId":"credit"},{"id":"fin-02-q09","number":9,"group":"信用","type":"single","stem":"小王采用银行卡来缴纳电费。他总是先在卡里存足够的钱，在规定的时间由供电部门通过银行将卡里的钱自动转入供电部门的账户，每次转账前两天，供电部门短信提醒小王往卡里存钱。一旦卡里没有钱了，供电部门到时间收不到钱，立即会停小王家的电。小王的这种银行卡属于（　　）。","options":{"A":"贷记卡","B":"准贷记卡","C":"借记卡","D":"储蓄存折"},"answer":["C"],"explanationSupplement":"题目的识别线索是必须先存入足够的款项，并且账户不足时无法透支付款。借记卡以存款余额为资金基础。题中供电安排只用于识别支付来源。","optionExplanations":{"A":"贷记卡有银行授信额度。","B":"准贷记卡按典型分类可在备用金不足时按授信额度透支。","C":"符合先存后付且无透支的特点。","D":"是储蓄账户记录凭证，不是题目所述银行卡。"},"conceptId":"credit-forms"},{"id":"fin-02-q10","number":10,"group":"信用","type":"single","stem":"银行及其他金融机构以货币形式提供的信用是（　　）。","options":{"A":"商业信用","B":"银行信用","C":"国家信用","D":"消费信用"},"answer":["B"],"explanationSupplement":"银行及其他金融机构以货币资金为对象，通过存款、贷款等开展信用活动。题目按提供者与媒介划分。","optionExplanations":{"A":"主要依托商品销售中的赊欠。","B":"对应金融机构媒介和货币资金。","C":"国家作为信用主体。","D":"按个人消费用途划分。"},"conceptId":"credit-forms"},{"id":"fin-02-q11","number":11,"group":"信用","type":"single","stem":"甲公司同意乙公司以分期付款的方式偿还所欠货款，这种信用属于（　　）。","options":{"A":"直接信用","B":"国家信用","C":"银行信用","D":"消费信用"},"answer":["A"],"explanationSupplement":"题设中的甲乙企业直接约定如何偿付货款，债权债务仍在企业之间。按融资关系划分属于直接信用，按交易来源可称商业信用。","optionExplanations":{"A":"题目没有另一个中介承担债权债务。","B":"没有国家作为借款主体。","C":"未由银行等承担中介债权。","D":"双方是企业，未描述个人消费。"},"conceptId":"financing"},{"id":"fin-02-q12","number":12,"group":"信用","type":"single","stem":"个人获得住房贷款属于（　　）。","options":{"A":"商业信用","B":"消费信用","C":"国家信用","D":"补偿贸易"},"answer":["B"],"explanationSupplement":"按信用用途划分，个人为购置自住住房获得的融资属于消费信用。若按提供机构划分，银行发放的住房贷款也属于银行信用。","optionExplanations":{"A":"不是企业间商品赊销。","B":"对应家庭住房消费用途。","C":"不是政府向社会筹资。","D":"属于贸易安排的另一概念。"},"conceptId":"credit-forms"},{"id":"fin-02-q13","number":13,"group":"信用","type":"single","stem":"间接融资领域中最主要的金融机构是（　　）。","options":{"A":"投资银行","B":"商业银行","C":"证券公司","D":"保险公司"},"answer":["B"],"explanationSupplement":"商业银行向存款者承担负债，同时向借款人发放贷款并持有债权。它居于资金提供者与最终借款人之间，是典型的间接融资中介。","optionExplanations":{"A":"通常提供承销、顾问等市场服务。","B":"是最典型的间接融资中介。","C":"作为证券中介时常服务直接融资。","D":"也有资金融通功能，但不是存贷款中介的典型答案。"},"conceptId":"financing"},{"id":"fin-02-q14","number":14,"group":"信用","type":"single","stem":"商业信用的工具主要是（　　）。","options":{"A":"商业票据","B":"企业债券","C":"支票","D":"金融债券"},"answer":["A"],"explanationSupplement":"企业之间先交货后付款时，可以用商业票据记录付款承诺或指令。这比普通即期支付工具更直接体现商业信用。","optionExplanations":{"A":"典型的商业信用载体。","B":"企业可通过债券面向投资者筹资，和交易赊销不同。","C":"多用于支付结算。","D":"是金融机构融资工具。"},"conceptId":"credit-forms"},{"id":"fin-02-q15","number":15,"group":"信用","type":"single","stem":"下列不属于商业信用局限性的是（　　）。","options":{"A":"规模上和数量上的局限性","B":"方向上的局限性","C":"信用能力上的局限性","D":"只能通过银行和职能资本之间发生信用关系"},"answer":["D"],"explanationSupplement":"商业信用建立在商品交易上，受到交易方向、对方偿付能力、交易规模和期限的限制。它由交易双方直接形成，无须先经银行。","optionExplanations":{"A":"货物和债权的规模有约束。","B":"与商品流向相联系。","C":"依赖企业的偿付能力。","D":"错误地把银行中介当成必要条件。"},"conceptId":"credit-forms"},{"id":"fin-02-q16","number":16,"group":"信用","type":"single","stem":"银行信用是由银行及其他金融机构以（　　）的形式，通过存款、贷款等活动提供的信用。","options":{"A":"抵押","B":"投资","C":"债券","D":"货币"},"answer":["D"],"explanationSupplement":"银行信用主要以货币资金提供。抵押只是可能用到的增信方式，不能替代信用的资金形态。","optionExplanations":{"A":"是一种担保方式。","B":"是资金运用活动，非题目所问形态。","C":"是金融工具之一。","D":"货币是典型的借贷对象。"},"conceptId":"credit-forms"},{"id":"fin-02-q17","number":17,"group":"信用","type":"single","stem":"转贴现买断是（　　）间融通资金的一种方式。","options":{"A":"金融机构和非金融机构","B":"金融机构和客户","C":"客户和客户","D":"金融机构和金融机构"},"answer":["D"],"explanationSupplement":"贴现后的票据由一家金融机构转让给另一家金融机构，属于转贴现。买断式不约定日后赎回票据，与回购式有别。","optionExplanations":{"A":"普通持票企业向金融机构融资通常是贴现。","B":"不是金融机构之间的转贴现。","C":"没有金融机构时不能按转贴现理解。","D":"交易两端都是金融机构。"},"conceptId":"bills"},{"id":"fin-02-q18","number":18,"group":"信用","type":"single","stem":"以下关于商业信用的表述不正确的是（　　）。","options":{"A":"商业信用是资本主义信用制度的基础","B":"信用就是“使商品资本向货币转化得以预先实现的形式”","C":"商业信用体现的是从事再生产的资本之间相互提供信用的关系","D":"商业信用的存在，就可以杜绝赊购方到期无力偿还的信用风险"},"answer":["D"],"explanationSupplement":"商业信用帮助企业延后支付并形成债权，但到期不能履约的风险仍然存在。A、B、C 是本题采用的商品资本与商业信用理论语境下的表述。","optionExplanations":{"A":"是这种理论中对商业信用基础地位的概括。","B":"在讨论商品资本赊销时体现延期实现货币价值，不能泛化成所有信用的定义。","C":"反映企业在再生产交易中的信用关系。","D":"延期清偿不会消除违约风险。"},"conceptId":"credit-forms"},{"id":"fin-02-q19","number":19,"group":"信用","type":"single","stem":"下列属于直接融资的优点的是（　　）。","options":{"A":"容易实现资金供需期限和数量的匹配","B":"投资者承担较小的投资风险","C":"可以节约交易成本","D":"不利于降低信息成本和合约成本"},"answer":["C"],"explanationSupplement":"直接融资可以省去由金融中介吸收存款再发放贷款的环节，在一定条件下节省交易成本。发行、信息披露等成本仍需另外计量。","optionExplanations":{"A":"期限和规模转换是金融中介擅长的功能。","B":"投资人通常直接面对发行人信用或市场风险。","C":"可减少一部分中间环节成本。","D":"这是可能的局限，题干问优点。"},"conceptId":"financing"},{"id":"fin-02-q20","number":20,"group":"信用","type":"single","stem":"在信用关系的价值运动中，货币执行的职能是（　　）。","options":{"A":"价值尺度","B":"流通手段","C":"支付手段","D":"贮藏手段"},"answer":["C"],"explanationSupplement":"信用资金的发放与清偿不是同一时点上的钱货交换。货币作为价值的独立给付方式时，体现支付手段。","optionExplanations":{"A":"着重计量或标价。","B":"着重同时交付商品和价款。","C":"在信用关系中转移资金和偿还债务。","D":"着重保存购买力。"},"conceptId":"credit"},{"id":"fin-02-q21","number":21,"group":"信用","type":"single","stem":"经济学角度的信用是指（　　）。","options":{"A":"在对人的信任基础上委以重任","B":"在行为准则上做到“一诺千金”","C":"相信对方进行的货币借贷","D":"以还本付息为条件的价值运动的特殊形式"},"answer":["D"],"explanationSupplement":"从经济学角度，信用以未来偿还的承诺为核心，使价值在当期和未来之间转移。还本付息是典型的有偿借贷形式。","optionExplanations":{"A":"描述人际信任，不一定有借贷。","B":"描述守约道德。","C":"范围较窄，商业信用还可以先提供商品。","D":"包含未来偿还、价值暂时让渡的关键结构。"},"conceptId":"credit"},{"id":"fin-02-q22","number":22,"group":"信用","type":"discussion","stem":"商业汇票需要先（　　）才能生效和流通。","options":{"A":"贴现","B":"背书","C":"承兑","D":"担保"},"answer":[],"explanationSupplement":"承兑是付款人承诺在汇票到期时付款。它会形成承兑人的票据责任。出票与交付、承兑、背书转让和贴现是不同环节，不能把承兑笼统写成一切汇票生效和流通的统一前提。","optionExplanations":{"A":"持票人提前转让票据取得资金。","B":"用于转让票据权利等。","C":"在题目想考的付款承诺环节成立。","D":"给履约增加担保。"},"conceptId":"bills"},{"id":"fin-02-q23","number":23,"group":"信用","type":"single","stem":"具备以下两个特征的就是银行信用：一是以银行及其他金融机构为媒介；二是（　　）。","options":{"A":"直接以货币形态的资本为借贷对象","B":"直接以实物形态的资本为借贷对象","C":"由商业信用直接转化而来","D":"有直接的担保和商品的抵押"},"answer":["A"],"explanationSupplement":"银行信用有两条识别线索：金融机构承担信用中介角色，借贷对象主要表现为货币资金。担保可以存在，但不是信用类型的必要特征。","optionExplanations":{"A":"描述借贷资金形态。","B":"实物赊销更常体现商业信用。","C":"两种信用可能相互联系，不能说银行信用只能来自商业信用。","D":"信用贷款也属于银行信用。"},"conceptId":"credit-forms"},{"id":"fin-02-q24","number":24,"group":"信用","type":"single","stem":"（　　）的债权人和债务人都是企业。","options":{"A":"商业信用","B":"银行信用","C":"国家信用","D":"消费信用"},"answer":["A"],"explanationSupplement":"典型商业信用是企业在商品买卖中相互提供的信用，赊销企业为债权人，延期付款企业为债务人。","optionExplanations":{"A":"供货企业和购货企业是债权债务双方。","B":"关键是有金融机构媒介。","C":"至少涉及政府信用主体。","D":"面向消费者消费用途。"},"conceptId":"credit-forms"},{"id":"fin-02-q25","number":25,"group":"利率与利率的决定","type":"single","stem":"根据凯恩斯理论，利率水平主要取决于（　　）。","options":{"A":"货币流动量","B":"储蓄总量","C":"投资需求","D":"货币需求与货币供给"},"answer":["D"],"explanationSupplement":"凯恩斯的流动性偏好理论把利率理解为放弃流动性的报酬。在其他条件给定时，货币市场的供给和需求共同决定均衡利率。","optionExplanations":{"A":"一个流量不能单独决定均衡利率。","B":"储蓄与投资是古典模型的直接变量。","C":"投资需求可受利率影响，题目问货币市场的决定机制。","D":"货币供需在均衡时相等。"},"conceptId":"rate-theories"},{"id":"fin-02-q26","number":26,"group":"利率与利率的决定","type":"single","stem":"在中央银行通过再贴现为金融机构融通短期资金的情况下，所用利率是（　　）。","options":{"A":"中央银行存款准备金率","B":"中央银行贴现率","C":"同业拆借利率","D":"一年期国债利率"},"answer":["B"],"explanationSupplement":"中央银行买入金融机构持有的已贴现票据并提供资金时，使用的是央行再贴现利率。题目中「央行贴现率」对应这一工具的常见叫法。","optionExplanations":{"A":"决定存款准备金的比例，属于比率而非融通资金利率。","B":"对应中央银行贴现或再贴现工具。","C":"是金融机构之间的市场融资利率。","D":"是政府债券的利率指标。"},"conceptId":"benchmarks"},{"id":"fin-02-q27","number":27,"group":"利率与利率的决定","type":"single","stem":"下列关于 Shibor 的说法错误的是（　　）。","options":{"A":"单利计息","B":"不需要提供担保","C":"批发性利率","D":"是一种加权平均利率"},"answer":["D"],"explanationSupplement":"Shibor 是人民币银行间同业拆放报价。官方规则剔除极端报价后对其余报价求算术平均，属于单利、无担保、批发性利率。","optionExplanations":{"A":"是单利。","B":"按无担保拆放报价。","C":"面向银行间市场。","D":"不是对保留报价作加权平均，故此项错误。"},"conceptId":"benchmarks"},{"id":"fin-02-q28","number":28,"group":"利率与利率的决定","type":"single","stem":"在正常情况下，货币需求的数量与市场利率的变动呈（　　）。","options":{"A":"正相关关系","B":"负相关关系","C":"不相关","D":"无法确定"},"answer":["B"],"explanationSupplement":"在收入、价格水平等给定的流动性偏好模型中，市场利率上升提高持有货币的机会成本，因此货币需求量通常减少。","optionExplanations":{"A":"方向与机会成本机制相反。","B":"持有货币的成本会随利率改变。","C":"利率上升通常压低货币需求。","D":"B 是模型下的通常方向。"},"conceptId":"rate-theories"},{"id":"fin-02-q29","number":29,"group":"利率与利率的决定","type":"discussion","stem":"以下关于安全性、流动性和收益性关系表述正确的是（　　）。","options":{"A":"安全性与流动性正相关，与收益性负相关","B":"安全性与流动性负相关，与收益性负相关","C":"安全性与流动性负相关，与收益性正相关","D":"安全性与流动性正相关，与收益性正相关"},"answer":[],"explanationSupplement":"在简化的比较中，风险较低的资产往往要求较低的风险补偿，也可能更容易成交。但是安全性、流动性和预期收益由不同机制决定，没有仅凭这三个概念就能推出的普遍相关符号。","optionExplanations":{"A":"在某些可比资产中可体现这一倾向，不能作为定律。","B":"安全资产也可能难变现，不能据此确定普遍负相关。","C":"高安全性不必对应高收益或低流动性。","D":"流动性良好不必对应高收益。"},"conceptId":"risk-liquidity"},{"id":"fin-02-q30","number":30,"group":"利率与利率的决定","type":"single","stem":"一般来说，金融工具的流动性与偿还期（　　）。","options":{"A":"成正比关系","B":"成反比关系","C":"成线性关系","D":"无确定关系"},"answer":["B"],"explanationSupplement":"其他条件相近时，剩余期限更短的工具更快自然到期，因此往往更容易转为现金。题目所说的反比是一般反向趋势，不是严格数学公式。","optionExplanations":{"A":"期限延长通常不会增强到期变现便利。","B":"按题设的一般趋势，期限越长流动性往往越弱。","C":"没有固定线性关系。","D":"实际可受交易深度影响，但题目在可比条件下考查典型趋势。"},"conceptId":"risk-liquidity"},{"id":"fin-02-q31","number":31,"group":"利率与利率的决定","type":"single","stem":"以下哪个是直接融资工具？（　　）","options":{"A":"银行债券","B":"企业债券","C":"银行承兑汇票","D":"大额可转让定期存单"},"answer":["B"],"explanationSupplement":"企业债券由实体企业直接发行，投资者对该企业持有债权。银行发行的工具通常体现金融机构筹资或信用支持。","optionExplanations":{"A":"融资工具由银行发行。","B":"投资者直接持有企业债权。","C":"银行承担承兑责任。","D":"是银行的存款负债工具。"},"conceptId":"financing"},{"id":"fin-02-q32","number":32,"group":"利率与利率的决定","type":"single","stem":"以下哪个是直接融资工具？（　　）","options":{"A":"商业票据","B":"银行本票","C":"保险单","D":"银行券"},"answer":["A"],"explanationSupplement":"企业之间以商业票据记录赊购欠款，债权债务在交易当事人之间形成。题目用它来说明直接信用工具。","optionExplanations":{"A":"不经银行贷款形成的商业信用工具。","B":"由银行签发。","C":"反映保险合同。","D":"通常是银行发行的货币凭证。"},"conceptId":"financing"},{"id":"fin-02-q33","number":33,"group":"利率与利率的决定","type":"single","stem":"“复利”也就是俗称的“利滚利”，指在每一个计息期，把上一个计息期的利息计入（　　）生息，以利生利。","options":{"A":"单利","B":"本金","C":"收益","D":"利率"},"answer":["B"],"explanationSupplement":"复利把以前计入账户的利息加到计算基数中，让下一期利息也对前期利息计提。期末本利和可写成 P×(1＋i)ⁿ。","optionExplanations":{"A":"单利始终以原本金计息。","B":"利息被计入下一期本金。","C":"收益是结果，不是题目要找的计息基数。","D":"利率是比率，不能加上利息金额。"},"conceptId":"interest-math"},{"id":"fin-02-q34","number":34,"group":"利率与利率的决定","type":"single","stem":"按低通胀情形下的常用近似，关于实际利率，以下正确的是（　　）。","options":{"A":"实际利率≈名义利率−浮动利率","B":"实际利率≈固定利率−浮动利率","C":"实际利率≈固定利率−通货膨胀率","D":"实际利率≈名义利率−通货膨胀率"},"answer":["D"],"explanationSupplement":"若 i 是名义利率、π 是同期通胀率，实际利率 r＝(1＋i)/(1＋π)−1。在通常低利率、低通胀的近似下，可用 i−π。","optionExplanations":{"A":"浮动利率不是价格水平变化率。","B":"固定和浮动描述利率能否调整。","C":"名义利率既可以固定也可以浮动。","D":"从名义回报扣除通胀影响，是常用近似。"},"conceptId":"interest-math"},{"id":"fin-02-q35","number":35,"group":"利率与利率的决定","type":"single","stem":"古典利率理论认为，利率取决于（　　）。","options":{"A":"储蓄和投资的相互作用","B":"公众的流动性偏好","C":"储蓄和可贷资金的需求","D":"中央银行的货币政策"},"answer":["A"],"explanationSupplement":"古典利率理论把储蓄看作资金供给，把投资看作资金需求，均衡利率使两者相等。其他条件不变，储蓄增加倾向于降低利率。","optionExplanations":{"A":"是古典理论的核心。","B":"是凯恩斯货币需求理论的重要概念。","C":"可贷资金理论还涉及其他来源和用途。","D":"属于政策因素，不能替代古典模型的供需变量。"},"conceptId":"rate-theories"},{"id":"fin-02-q36","number":36,"group":"利率与利率的决定","type":"single","stem":"由资金供求关系和风险收益关系等因素直接决定的利率称为（　　）。","options":{"A":"市场利率","B":"官定利率","C":"公利利率","D":"浮动利率"},"answer":["A"],"explanationSupplement":"题干描述由市场资金供需、风险溢价等决定的融资价格，所以按形成机制分类属于市场利率。","optionExplanations":{"A":"由市场交易形成。","B":"由主管机关规定。","C":"常见术语为公定利率，指行业组织等约定的利率。","D":"描述合同内是否调整，与决定机制是两种维度。"},"conceptId":"benchmarks"},{"id":"fin-02-q37","number":37,"group":"利率与利率的决定","type":"discussion","stem":"中国人民银行对商业银行的（　　），可理解为我国目前的基准利率。","options":{"A":"固定利率","B":"存款利率","C":"贷款利率","D":"再贷款利率"},"answer":[],"explanationSupplement":"再贷款利率是中央银行提供再贷款时使用的工具利率。题目以它代表旧式基准利率说法。现行框架中，人民银行明确公开市场7天期逆回购操作利率的主要政策利率地位，贷款市场还使用 LPR 等参考基准。四个选项没有列出现行主要政策利率。","optionExplanations":{"A":"描述是否固定，不是具体基准。","B":"可能是银行对存款人的报价。","C":"概念太宽。","D":"对应题目的历史参考说法，不能代表现行主要政策利率。"},"conceptId":"benchmarks"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');

    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }
 const chapterViews = chapter?.visual ? ['learn', 'map', 'visual', 'practice'] : ['learn', 'map', 'practice'];

 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}
 function download() {

   openModal('你正在使用离线学习版','<p>本文件包含本章的讲解、思维导图和练习。保存好这份 HTML，断网后双击即可继续学习。</p><p>可在「学习记录」中导出、导入本章备份。</p>');

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
