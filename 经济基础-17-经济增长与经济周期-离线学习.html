  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter17","number":17,"title":"经济增长与经济周期","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-17-经济增长与经济周期-离线学习.html"},"lessons":{"title":"经济增长与经济周期","subtitle":"分清长期产能扩张与短期波动，读懂实际 GDP 和增长核算。","sections":[{"id":"growth-gdp","title":"经济增长、经济发展与 GDP","summary":"用不变价格计算实际增长率，并区分经济规模和发展质量。","bodyHtml":"\u003cp>\u003cstrong>经济增长\u003c/strong>可以从两个角度看。实际 GDP 增速衡量观察期内总产出的真实变化；长期增长分析关注资本、劳动或技术积累带来的潜在产能提高。用生产可能性曲线表示长期产能扩张时，边界向外移动。\u003c/p>\u003cp>\u003cmark>实际增长率=（本期实际 GDP−上期同口径实际 GDP）÷上期实际 GDP\u003c/mark>。现价 GDP 适合描述当期货币价值，不变价 GDP 用于剔除价格变动后的跨期比较。经济发展还涉及经济结构、收入分配、健康、教育和生活质量。GDP 是一项重要指标，还可结合投资等指标分析经济运行。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）：国家统计局区分现价 GDP 总量与不变价 GDP 增速，其定期国民经济运行发布也列出固定资产投资。\u003ca href=\"https://www.stats.gov.cn/zs/tjws/zytjzbqs/gnsczz/202502/t20250226_1958799.html\">国家统计局 · GDP 数据解读\u003c/a>，\u003ca href=\"https://www.stats.gov.cn/sj/zxfb/202610/t20261019_1965618.html\">国家统计局 · 主要指标发布示例\u003c/a>\u003c/p>","keyTakeaway":"衡量实际增速时比较同口径不变价 GDP。讨论长期增长时留意生产能力是否提高。","pitfall":"价格上涨可以抬高现价 GDP。实际产出变动、潜在产能和居民福利是不同概念。","example":"两年按同一基期价格衡量的 GDP 分别为 100 和 105，实际增长率是 5%。如果产出增长只是闲置设备重新启用，原有生产可能性边界可以保持不变。"},{"id":"growth-accounting","title":"增长核算与全要素生产率","summary":"把产出增长分解为投入贡献和生产率增长。","bodyHtml":"\u003cp>在两要素增长核算中，用劳动和资本的产出弹性作权重，可以写成 g\u003csub>Y\u003c/sub>=αg\u003csub>L\u003c/sub>+βg\u003csub>K\u003c/sub>+g\u003csub>A\u003c/sub>。在完全竞争等条件下，可用要素收入份额估计权重。整理得\u003cmark>g\u003csub>A\u003c/sub>=g\u003csub>Y\u003c/sub>−αg\u003csub>L\u003c/sub>−βg\u003csub>K\u003c/sub>\u003c/mark>。剩余项是全要素生产率的增长估计，常称索罗余值，可能包含技术改进、配置效率、投入质量和测量误差等。\u003c/p>\u003cp>要素投入型或粗放型增长主要依靠投入数量增加。集约型增长更依赖技术、管理、技能和资源利用效率提高。若采用储蓄率 s 固定、资本产出比 v 固定且忽略折旧的简化哈罗德—多马关系 g=s/v，单位产出占用资本越多，给定投入可支持的增长率越低。\u003c/p>\u003cp>索罗的增长核算是经典方法，阿布拉莫维茨也在同期研究中分离投入与生产率的贡献。\u003ca href=\"https://www.bls.gov/opub/hom/opt/concepts.htm\">美国劳工统计局 · 生产率概念\u003c/a>，\u003ca href=\"https://www.nber.org/books-and-chapters/resource-and-output-trends-united-states-1870/resource-and-output-trends-united-states-1870\">阿布拉莫维茨的 1956 年研究\u003c/a>\u003c/p>","keyTakeaway":"各投入贡献等于其增长率乘相应权重。两项贡献从实际产出增长率中扣除后得到生产率余值。","pitfall":"区分生产率水平、生产率增速、生产率拉动的百分点和生产率贡献占总增长的比例。","example":"产出增长 8%，资本增长 5% 且权重 60%，劳动增长 2% 且权重 40%。生产率余值为 8%−3%−0.8%=4.2%。"},{"id":"solow-growth","title":"索罗增长模型：稳态与黄金律","summary":"理解投资补偿折旧与人口增长后，怎样改变人均资本。","bodyHtml":"\u003cp>设 k 为人均资本、f(k) 为人均产出、s 为储蓄率、n 为人口增长率、δ 为折旧率。在无技术进步的连续时间简化模型中，\u003cmark>ḱ=sf(k)−(n+δ)k\u003c/mark>。前者是人均储蓄形成的投资，后者是维持人均资本所需的保本投资，既要补折旧，也要补人口增长带来的资本稀释。\u003c/p>\u003cp>稳态满足 sf(k*)=(n+δ)k*。人均资本和人均产出不变，总资本和总产出随人口按 n 增长。稳态人均消费 c*=f(k*)−(n+δ)k*。可微内点最大化的黄金律条件是\u003cmark>f′(k\u003csub>gold\u003c/sub>)=n+δ\u003c/mark>。在按有效劳动定义变量且引入劳动增进型技术增长 g 的模型中，保本投资包含 g。\u003c/p>","keyTakeaway":"先明确人均或总量口径，以及是否假定技术不变，再写稳态和黄金律条件。","pitfall":"稳态是人均资本停止变化的状态，黄金律在所有可行稳态中进一步寻找人均消费最大的资本水平。","example":"若 n=2%、δ=5%，在无技术进步的简化模型中每年要投入人均资本的 7% 才能维持现有人均资本。黄金律对应资本边际产量 7%。"},{"id":"macro-schools","title":"新古典与新凯恩斯主义的短期观点","summary":"用价格、工资调整速度和预期解释政策影响。","bodyHtml":"\u003cp>部分\u003cstrong>新古典宏观\u003c/strong>模型假定市场价格较灵活且主体具有理性预期。典型的货币意外模型中，预期到的货币变化主要反映在价格上，未被预期的变化才可能暂时影响实际产出和就业。\u003c/p>\u003cp>\u003cstrong>新凯恩斯主义\u003c/strong>模型也常使用理性经济行为和理性预期，同时引入名义价格、工资黏性等约束。需求下滑时，价格和工资调整可能慢于支出调整，经济恢复充分就业需要时间，稳定政策可在短期影响实际活动。\u003c/p>","keyTakeaway":"讨论政策何时有效时，先比较两种模型对价格调整和信息的假设。","pitfall":"索罗模型研究长期资本积累。货币意外和名义黏性属于不同短期波动模型，使用各自的假设。","example":"工资通过年度合同调整。需求突然下降时，工资短期固定，企业可能先减少工时或招聘。"},{"id":"business-cycle","title":"经济周期的阶段与长度","summary":"辨认实际产出、国民收入和就业的共同波动。","bodyHtml":"\u003cp>\u003cstrong>经济周期\u003c/strong>是总体经济活动随时间出现的扩张与收缩，常用实际产出和实际国民收入的变化观察。扩张可分为复苏和繁荣，收缩可分为衰退和萧条。波峰连接扩张与收缩，波谷连接收缩与下一轮扩张。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>传统分类\u003c/th>\u003cth>代表名称\u003c/th>\u003cth>大致长度\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>短周期\u003c/td>\u003ctd>基钦周期\u003c/td>\u003ctd>约 3–5 年\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中周期\u003c/td>\u003ctd>朱格拉周期\u003c/td>\u003ctd>约 8–10 年\u003c/td>\u003c/tr>\u003ctr>\u003ctd>长周期\u003c/td>\u003ctd>康德拉耶夫周期\u003c/td>\u003ctd>约 50–60 年\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>经典周期理论常用这组分类组织长期观察。实际周期的长度和幅度可随冲击、制度和研究口径变化。\u003c/p>","keyTakeaway":"扩张含复苏和繁荣，收缩含衰退和萧条。短、中、长周期分别记住基钦、朱格拉、康德拉耶夫。","pitfall":"就业、价格和利率也可能波动。识别总体经济活动的周期应综合观察多个指标。","example":"经历衰退后，企业订单、产出和就业逐渐回升，可称为复苏，属于扩张的早期阶段。"},{"id":"cycle-mechanisms","title":"乘数、加速数与逆周期调节","summary":"理解需求、投资和产出怎样相互影响。","bodyHtml":"\u003cp>\u003cmark>乘数机制\u003c/mark>描述初始支出变化如何通过收入和消费反复传递，形成更大的产出变化。\u003cmark>加速数机制\u003c/mark>描述产出或销售增长预期如何带动企业扩大所需资本与投资。两者相互反馈并带有时滞时，在某些参数下可生成周期波动。\u003c/p>\u003cp>现实周期还可能由需求、供给、金融等冲击触发。需求不足且产能闲置时，增加有效公共投资可支持总需求。经济过热时，减少支出可降温。政策效果取决于冲击性质、融资空间和项目落地速度。\u003c/p>","keyTakeaway":"乘数的方向是支出影响收入，加速数的方向是需求或产出变化影响投资。","pitfall":"乘数—加速数相互作用是一种解释机制。周期问题若没有限定模型，还需要考虑外部冲击等其他因素。","example":"销售上升促使企业添置设备。设备投资增加又提高收入与消费，进一步推高销售。这是两种机制相互反馈的例子。"}],"mindmap":[{"label":"经济增长","target":"growth-gdp","children":[{"label":"经济增长率","target":"growth-gdp","children":[{"label":"实际 GDP 较上期的增长率","target":"growth-gdp"},{"label":"生产可能性边界向外移动","target":"growth-gdp"}]},{"label":"产出增长的分解","target":"growth-accounting","children":[{"label":"劳动份额乘劳动增长率","target":"growth-accounting"},{"label":"资本份额乘资本增长率","target":"growth-accounting"},{"label":"全要素生产率增长：索罗余值","target":"growth-accounting"}]},{"label":"新古典增长模型","target":"solow-growth","children":[{"label":"人均资本变化：储蓄投资减保本投资","target":"solow-growth"},{"label":"稳态：人均资本和人均产出不变","target":"solow-growth"},{"label":"黄金律：资本边际产量等于折旧率加人口增长率","target":"solow-growth"}]},{"label":"新古典宏观的货币意外模型","target":"macro-schools","children":[{"label":"预期货币变化主要影响价格","target":"macro-schools"},{"label":"意外货币变化可短期影响产出和就业","target":"macro-schools"}]},{"label":"新凯恩斯主义","target":"macro-schools","children":[{"label":"名义工资和价格黏性","target":"macro-schools"},{"label":"理性选择与理性预期","target":"macro-schools"},{"label":"需求冲击后复原较慢，短期稳定政策可影响产出","target":"macro-schools"}]}]},{"label":"经济周期","target":"business-cycle","children":[{"label":"扩张阶段","target":"business-cycle","children":[{"label":"复苏","target":"business-cycle"},{"label":"繁荣","target":"business-cycle"}]},{"label":"紧缩或衰退阶段","target":"business-cycle","children":[{"label":"衰退","target":"business-cycle"},{"label":"萧条","target":"business-cycle"}]},{"label":"传统长度分类：基钦、朱格拉、康德拉耶夫","target":"business-cycle"},{"label":"乘数、加速数与政策应对","target":"cycle-mechanisms"}]}]},"questions":[{"id":"eco-17-q01","number":1,"group":"经济增长","type":"single","stem":"关于经济增长与经济发展，下列说法正确的是（　）。","options":{"A":"用不变价格计算的 GDP 可以反映一国或地区的经济发展规模","B":"用现行价格计算的 GDP 可以用来计算经济增长速度","C":"经济发展是一个国家或地区在一定时期内总产出与前期相比所实现的增长","D":"经济增长率的高低是衡量一个国家总体经济实力增长速度的标志"},"answer":["D"],"explanationSupplement":"题目区分宏观指标的常见用法：当期市场价值总量通常用现价 GDP 表示，跨期实际产出增速用不变价 GDP 计算。经济发展还包括结构变化和生活质量改善。","optionExplanations":{"A":"不变价 GDP 可以比较可比口径下的实际产出规模。本题按统计发布的常用口径，用现价 GDP 描述当期货币计量的经济规模。","B":"现价 GDP 只能直接计算名义增速，价格因素还需剔除。","C":"这个说法描述总产出增长，发展还包括结构和生活质量。","D":"实际经济增长率反映实际产出的扩张速度，是总体经济实力变化的一个指标。"},"conceptId":"growth-gdp"},{"id":"eco-17-q02","number":2,"group":"经济增长","type":"single","stem":"下列因素中，与经济增长率成反比关系的是（　）。","options":{"A":"生产资料数量的增加","B":"固定资产和流动资产数量的增加","C":"单位产品生产基金占用数量的增加","D":"劳动力数量的增加"},"answer":["C"],"explanationSupplement":"在投资规模或储蓄率给定的简化模型中，每单位产出需要的资本越多，同样的资金能形成的新增产出越少。若以 g=s/v 表示这一关系，g 与资本产出比 v 反向变动。","optionExplanations":{"A":"其他条件给定时，更多可用生产资料可支持扩产。","B":"能投入生产的资本增加通常支持扩大产出。","C":"单位产出占用的资本上升，给定资金可支持的产出增幅下降。","D":"其他条件不变且劳动边际产量为正时，新增劳动可增加产出。"},"conceptId":"growth-accounting"},{"id":"eco-17-q03","number":3,"group":"经济增长","type":"single","stem":"在下述选项中，全要素生产率的计算公式是（　）。","options":{"A":"G=αL+βK","B":"G=αL+βK+A","C":"GQ=GH+GP","D":"GA=GY−αGL−βGK"},"answer":["D"],"explanationSupplement":"选项中的 GA 按增长率解释。给劳动和资本的增长率分别乘对应权重，再从产出增长率 GY 扣除，得到全要素生产率的增长余值。","optionExplanations":{"A":"这个表达式只有投入加权项。","B":"右侧包含投入与其他项的和，未把生产率增长单独解出。","C":"它没有体现产出增长扣除劳动与资本贡献。","D":"明确表示从产出增速中扣除两项投入的加权贡献。"},"conceptId":"growth-accounting"},{"id":"eco-17-q04","number":4,"group":"经济增长","type":"single","stem":"主要依靠科技进步及提高劳动者素质来增加社会产品的数量和质量的经济增长方式属于（　）。","options":{"A":"要素投入型经济增长方式","B":"粗放型经济增长方式","C":"集约型经济增长方式","D":"供给推动型经济增长方式"},"answer":["C"],"explanationSupplement":"识别增长来自哪里。题设强调技术和劳动质量提高，说明相同数量的投入可以产生更多或更优的产出，属于集约型增长。","optionExplanations":{"A":"要素投入型以劳动、资本等投入数量的扩大为主要来源。","B":"粗放型强调扩大投入和资源耗用。","C":"技术进步和劳动素质提高符合典型的集约型增长。","D":"供给推动是更广的描述，此处考查投入数量与投入效率的分类。"},"conceptId":"growth-accounting"},{"id":"eco-17-q05","number":5,"group":"经济增长","type":"single","stem":"经济增长的标志是（　）。","options":{"A":"失业率的下降","B":"先进技术的广泛应用","C":"社会生产能力的不断提高","D":"城市化速度加快"},"answer":["C"],"explanationSupplement":"题目使用长期增长口径。资本积累、劳动力和技术改善可以提高潜在产能，使社会能生产更多商品和服务。","optionExplanations":{"A":"失业率下降可伴随短期复苏。","B":"技术应用是提高生产能力的一种来源。","C":"生产能力提高反映长期潜在产出的扩张。","D":"城市化是经济结构变化的表现，速度可以独立变化。"},"conceptId":"growth-gdp"},{"id":"eco-17-q06","number":6,"group":"经济增长","type":"single","stem":"下列对经济指标的说法不准确的是（　）。","options":{"A":"经济指标是指反应一定社会经济现象数量方面的名称及其数值","B":"社会总产值 XX 亿元，就是经济指标","C":"国民收入 XX 亿元，也是经济指标","D":"固定资产投资是经济指标，但不是主要的经济指标"},"answer":["D"],"explanationSupplement":"经济指标把一个经济现象与可观察的数值联系起来。固定资产投资经常列在国民经济运行的主要指标中，题目要求选出把它排除在主要指标之外的说法。","optionExplanations":{"A":"名称和数值共同说明观测的经济现象与程度。","B":"该项同时给出指标概念和以金额表示的观测值。","C":"一定时期内的国民收入可以用数值度量。","D":"固定资产投资是观察资本形成与投资活动的重要宏观指标。"},"conceptId":"growth-gdp"},{"id":"eco-17-q07","number":7,"group":"经济增长","type":"single","stem":"当使用国内生产总值反映一个国家的经济增长速度时，国内生产总值的计算应采用（　）。","options":{"A":"期望价格","B":"现行价格","C":"公允价格","D":"不变价格"},"answer":["D"],"explanationSupplement":"用同一价格口径衡量不同时期的产出，使增速反映产量和结构的实际变动，避免把一般价格变化混入实际增速。","optionExplanations":{"A":"预期价格描述未来判断，无法作为常规实际 GDP 比较口径。","B":"当期价格变化会影响计算出的名义增速。","C":"“公允价格”不是本题要求的跨期不变价口径。","D":"统一价格口径后可比较实际产出。"},"conceptId":"growth-gdp"},{"id":"eco-17-q08","number":8,"group":"经济增长","type":"single","stem":"假设某个国家 2011 年～2015 年，GDP 年均增长 8%，资本存量平均增长 5%，劳动力年均增长 2%，如果在 GDP 增长中的资本的份额为 60%，劳动力为 40%，这一时期全要素生产率增长率为（　）。","options":{"A":"3.0%","B":"4.0%","C":"7.0%","D":"4.2%"},"answer":["D"],"explanationSupplement":"把 60% 和 40% 用作资本、劳动的权重。资本拉动 5%×60%=3 个百分点，劳动拉动 2%×40%=0.8 个百分点，剩余 8−3−0.8=4.2 个百分点。","optionExplanations":{"A":"3.0% 对应资本的加权贡献。","B":"两个加权贡献合计为 3.8 个百分点，8 减去 3.8 得 4.2。","C":"7.0% 不是扣除两种投入贡献后的结果。","D":"同时扣除资本与劳动的加权贡献后得到 4.2%。"},"conceptId":"growth-accounting"},{"id":"eco-17-q09","number":9,"group":"经济增长","type":"discussion","stem":"全要素生产率是由（　）首先提出的。","options":{"A":"罗伯特·索罗","B":"凯恩斯","C":"弗里德曼","D":"法玛"},"answer":[],"explanationSupplement":"索罗的 1957 年工作建立了经典的生产函数增长核算方法，计算结果常称索罗余值。阿布拉莫维茨等研究者在此前也分解了投入与生产率对产出增长的贡献。可用本题辨认经典方法的代表人物，“首先提出”的历史归属需要明确所指方法。","optionExplanations":{"A":"索罗是用生产函数计算增长余值的代表人物。","B":"凯恩斯的代表性贡献集中于总需求与就业理论。","C":"弗里德曼以货币理论等研究著称。","D":"法玛以有效市场理论等金融研究著称。"},"conceptId":"growth-accounting"},{"id":"eco-17-q10","number":10,"group":"经济增长","type":"single","stem":"将劳动、资本等要素投入数量因素对经济增长率的贡献扣除之后，技术进步因素对经济增长的贡献份额称为（　）。","options":{"A":"净要素生产率","B":"技术生产率","C":"经济增长率","D":"全要素生产率"},"answer":["D"],"explanationSupplement":"产出增长率由投入的加权贡献和剩余项组成。扣除可观测的投入贡献后得到全要素生产率增长的估计。其数值是对产出增长的百分点贡献。若要计算占总增长的份额，还需再除以产出增长率。","optionExplanations":{"A":"“净要素生产率”并非此项增长核算余量的常用名称。","B":"技术改进可能是余值的一部分，标准术语为全要素生产率。","C":"经济增长率包括已计量的投入增长贡献。","D":"从产出增长率中扣除投入贡献得到的是全要素生产率增长。"},"conceptId":"growth-accounting"},{"id":"eco-17-q11","number":11,"group":"经济增长","type":"single","stem":"经济增长的最佳定义是（　）。","options":{"A":"投资和资本量的增加","B":"因要素供给增加或生产率提高使潜在的国民收入有所提高","C":"实际国民收入在现有水平上有所提高","D":"人均货币收入的增加"},"answer":["B"],"explanationSupplement":"本题考查长期增长。要素增加或技术进步扩大潜在产能，从而抬高可持续的实际产出。观察短期实际经济增长时，常用实际 GDP 增速，可能包含周期反弹。","optionExplanations":{"A":"投资与资本增长是潜在产能增加的一个来源。","B":"该项同时交代了潜在产出的提高及其来源。","C":"实际国民收入可以因周期性恢复而提高，潜在产能未必改变。","D":"货币收入也可能只因物价上涨而增加。"},"conceptId":"growth-gdp"},{"id":"eco-17-q12","number":12,"group":"经济增长","type":"discussion","stem":"关于经济增长与经济发展之间的关系，下列说法正确的是（　）。","options":{"A":"经济增长与经济发展是同一概念","B":"经济增长过程中必然伴随着经济发展","C":"经济增长不等于经济发展，但经济发展过程中必然存在经济增长","D":"经济增长不等于经济发展，经济发展与经济增长没有关系"},"answer":[],"explanationSupplement":"产出增长通常有助于提高生活水平并支持公共服务，经济发展还涉及结构、分配和生活质量。题目没有限定考察期或发展标准。某一时期内，医疗、教育或分配指标可以改善，同时实际产出未增长，因此“必然”需要附加条件。","optionExplanations":{"A":"实际产出增长与发展所涵盖的社会经济变化范围不同。","B":"产出增长并不能保证分配或生活质量同步改善。","C":"经济增长通常是长期发展的重要物质基础，短期情况需要结合发展指标。","D":"增长和发展存在密切联系，二者可相互影响。"},"conceptId":"growth-gdp"},{"id":"eco-17-q13","number":13,"group":"经济增长","type":"single","stem":"经济增长在图形上表现为（　）。","options":{"A":"生产可能性曲线内的某一点向曲线上移动","B":"生产可能性曲线向外移动","C":"生产可能性曲线外的某一点向曲线上移动","D":"生产可能性曲线上某一点沿曲线移动"},"answer":["B"],"explanationSupplement":"本题关注潜在产出提高。要素增加或技术进步会使某些原本不可达的生产组合变得可达，于是生产可能性边界向外移动。","optionExplanations":{"A":"这是资源利用程度提高，原有边界可以不变。","B":"向外移动意味着可达到的生产组合扩大。","C":"原边界外的点在给定资源技术下不可达。","D":"沿边界变动反映在既定产能下重新配置资源。"},"conceptId":"growth-gdp"},{"id":"eco-17-q14","number":14,"group":"经济增长","type":"single","stem":"GDP 是衡量经济增长的一个较好指标，是因为（　）。","options":{"A":"GDP 以货币表示，易于比较","B":"GDP 的增长总是意味着已发生的实际经济增长","C":"GDP 的值不仅可以反映一国的经济实力，还可以反映一国的经济福利程度","D":"以上说法都对"},"answer":["A"],"explanationSupplement":"以货币单位为权重汇总不同的最终产品和服务，可以形成总产出指标。判断实际增长时还要在相同价格口径下比较。","optionExplanations":{"A":"共同单位有助于加总和比较不同产品与服务。","B":"现价 GDP 可能因价格变化而增长。","C":"GDP 的主要统计对象是生产活动，福利还受收入分配、健康和环境等影响。","D":"实际增长与福利都需要补充适当的口径和指标。"},"conceptId":"growth-gdp"},{"id":"eco-17-q15","number":15,"group":"经济周期","type":"discussion","stem":"经济之所以会发生周期性波动，是因为（　）。","options":{"A":"外部因素的变动","B":"乘数作用","C":"加速数作用","D":"乘数和加速数交织作用"},"answer":[],"explanationSupplement":"在乘数—加速数模型中，支出变化经乘数影响产出，产出增速再经加速数影响投资，两者反馈能在适当参数下形成周期波动。其他理论也讨论技术、供给、金融或政策等外部冲击。题干没有指定模型，因此可以比较不同解释。","optionExplanations":{"A":"外部冲击可触发宏观波动。","B":"乘数描述支出对收入的放大过程，单独使用还需补充周期机制。","C":"加速数描述产出变化引起投资调整。","D":"在乘数—加速数模型中，这是周期波动的反馈机制。"},"conceptId":"cycle-mechanisms"},{"id":"eco-17-q16","number":16,"group":"经济周期","type":"single","stem":"经济周期的实质是（　）。","options":{"A":"失业率的波动","B":"利息率的波动","C":"价格水平的波动","D":"国民收入的波动"},"answer":["D"],"explanationSupplement":"经济周期描述总体经济活动的扩张与收缩。实际国民收入和产出是衡量整体活动的核心量，就业、物价和利率常随之变化。","optionExplanations":{"A":"失业率是反映劳动力市场变化的重要指标。","B":"利率受货币条件和政策等多种因素影响。","C":"物价变化是经济活动的一个方面。","D":"国民收入的波动更直接反映经济活动总量变化。"},"conceptId":"business-cycle"},{"id":"eco-17-q17","number":17,"group":"经济周期","type":"single","stem":"按照经济周期波动的时间长短，经济周期主要有长周期、中周期和短周期三种类型。其中，短周期又称为（　）。","options":{"A":"熊彼特周期","B":"康德拉耶夫周期","C":"基钦周期","D":"朱格拉周期"},"answer":["C"],"explanationSupplement":"经典周期分类中，基钦对应短周期，朱格拉对应中周期，康德拉耶夫对应长周期。","optionExplanations":{"A":"熊彼特的创新理论讨论多种长度的周期。","B":"康德拉耶夫对应长周期。","C":"基钦对应短周期。","D":"朱格拉对应中周期。"},"conceptId":"business-cycle"},{"id":"eco-17-q18","number":18,"group":"经济周期","type":"discussion","stem":"经济周期有三种类型，其中现实生活人们更关注的是（　）。","options":{"A":"短周期","B":"长周期","C":"中周期","D":"全周期"},"answer":[],"explanationSupplement":"朱格拉中周期常用于讨论投资与信贷扩张收缩。关注周期的长度也会随观察对象变化。研究库存的企业可能关心短周期，研究技术扩散的人可能关心长周期。题目没有限定观察对象或时期。","optionExplanations":{"A":"库存管理常关注更短期波动。","B":"技术进步的长期波动适合用长周期框架讨论。","C":"中周期常用于观察固定投资和信贷的阶段性变化。","D":"全周期是一种观察视角，题设长度分类没有“全周期”这一类。"},"conceptId":"business-cycle"},{"id":"eco-17-q19","number":19,"group":"经济周期","type":"single","stem":"扩张阶段可以细分为（　）。","options":{"A":"复苏阶段和萧条阶段","B":"复苏阶段和繁荣阶段","C":"衰退阶段和繁荣阶段","D":"衰退阶段和萧条阶段"},"answer":["B"],"explanationSupplement":"从波谷之后开始，生产和就业回升称为复苏；经济活动维持较高水平并接近波峰可称为繁荣。这两段都属于扩张。","optionExplanations":{"A":"萧条位于经济活动的低谷附近。","B":"复苏与繁荣对应扩张的两个阶段。","C":"衰退描述波峰后的收缩过程。","D":"衰退和萧条是收缩阶段的两部分。"},"conceptId":"business-cycle"},{"id":"eco-17-q20","number":20,"group":"经济周期","type":"single","stem":"当经济处于萧条时期，政府应采取的投资政策措施是（　）。","options":{"A":"提高投资支出水平，缓解或者逐步消除经济衰退","B":"提高税率、增加税收优惠，扩大社会总供给","C":"提高补贴，扩大转移支付，降低社会总需求","D":"降低投资支出水平，使经济降温、平稳回落"},"answer":["A"],"explanationSupplement":"如果萧条源于总需求不足、存在闲置产能，增加有效投资支出会直接增加支出需求，还可能通过收入与消费继续传导。","optionExplanations":{"A":"方向符合需求不足时的扩张性投资政策。","B":"增税会压低可支配收入，税收优惠的效果则取决于细节，该项也未直接提出投资措施。","C":"转移支付通常支持可支配收入和需求，选项给出的方向相反。","D":"削减投资支出通常用于降低需求压力，萧条期总需求已偏弱。"},"conceptId":"cycle-mechanisms"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';

  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));

  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');

  }

   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');

  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];

    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
