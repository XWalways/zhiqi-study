  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter14","number":14,"title":"失业与通货膨胀","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-14-失业与通货膨胀-离线学习.html","visual":"phillips","visualSectionId":"phillips-curve","visuals":[{"type":"phillips","sectionId":"phillips-curve"}]},"lessons":{"title":"失业与通货膨胀","subtitle":"从就业统计、物价变化和产出缺口理解宏观经济波动。","sections":[{"id":"employment-measure","title":"就业、失业与劳动参与","summary":"调查失业率的分母是劳动力人口，劳动力包括就业和失业两组。","bodyHtml":"\u003cp>在一般经济分析中，\u003cstrong>失业\u003c/strong>指没有工作、有工作意愿且具备工作条件。统计时还要观察求职行为、能否及时工作以及统计时期。\u003c/p>\u003cp>我国劳动力调查对 16 周岁及以上人口进行就业状态分类。调查参考周内为取得报酬或经营收入工作至少 1 小时，或暂时离岗但符合在职条件，计为就业。参考周内没有工作，过去 3 个月积极寻找工作，且能在有合适工作后 2 周内开始工作的人员，计为失业。\u003c/p>\u003cul>\u003cli>调查失业率 = 失业人数 ÷（就业人数 + 失业人数）× 100%。\u003c/li>\u003cli>劳动参与率 = 劳动力人口 ÷ 相应年龄人口 × 100%。\u003c/li>\u003cli>城镇调查按常住地划分统计范围。符合调查范围的进城务工人员也在覆盖范围内。\u003c/li>\u003c/ul>\u003cp>统计口径核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.stats.gov.cn/zs/tjws/zytjzbqs/tcsyl/202409/t20240910_1956360.html\">国家统计局《什么是调查失业率》\u003c/a> · \u003ca href=\"https://www.stats.gov.cn/zs/tjws/zytjzbqs/tcsyl/202411/t20241115_1957491.html\">国家统计局《调查失业率的计算方法》\u003c/a>\u003c/p>","keyTakeaway":"先按统计口径分为就业、失业和非劳动力，再用失业人数除以劳动力。","pitfall":"城镇调查失业率和城镇登记失业率的人员范围及计算方式不同。未就业但近期未求职的人可能归入非劳动力。","example":"某地有就业者 950 人、符合调查口径的失业者 50 人，调查失业率为 5%。其他非劳动力不计入这个分母。"},{"id":"unemployment-types","title":"摩擦性、结构性、周期性与季节性失业","summary":"识别岗位搜索、技能错配、需求波动和季节变化这四类原因。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>主要成因\u003c/th>\u003cth>典型情境\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>摩擦性失业\u003c/td>\u003ctd>搜索、面试或岗位转换需要时间\u003c/td>\u003ctd>毕业生进入劳动力市场后仍在找工作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结构性失业\u003c/td>\u003ctd>岗位与劳动者的技能、地区等难以匹配\u003c/td>\u003ctd>工人缺少新设备所需技能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期性失业\u003c/td>\u003ctd>经济下行、总需求不足\u003c/td>\u003ctd>衰退时多行业缩减用工\u003c/td>\u003c/tr>\u003ctr>\u003ctd>季节性失业\u003c/td>\u003ctd>用工随季节反复变化\u003c/td>\u003ctd>滑雪场在非营业季减少岗位\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>自愿与非自愿描述劳动者在现行工资和工作条件下的选择。劳动者愿意按现行条件工作但找不到岗位，可归为非自愿失业。一次失业也能按成因和意愿分别描述。\u003c/p>","keyTakeaway":"做情境题时抓失业的直接成因。技能错配看结构性，总需求收缩看周期性。","pitfall":"“某行业不景气”需要进一步观察原因。技术替代、消费结构变化和全经济需求收缩指向不同机制。","example":"车间搬迁而本地工人缺乏新产业要求的技能，属于结构性失业。工人投递同类岗位、等待面试期间也可能经历摩擦性失业。"},{"id":"natural-unemployment","title":"自然失业率与充分就业","summary":"充分就业时周期性失业约为零，仍可存在岗位转换和结构错配。","bodyHtml":"\u003cp>基础模型通常将\u003cstrong>自然失业率\u003c/strong>理解为周期性失业约为零时的失业率，主要来自摩擦性与结构性失业。劳动力流动、技能匹配效率、求职成本与劳动力市场制度变化都会影响它。\u003c/p>\u003cp>在简化的两状态模型中，设就业者失去工作概率为 s，失业者找到工作概率为 f。稳态失业率为 \u003cstrong>u* = s ÷ (s + f)\u003c/strong>。给定 s，提高 f 会降低稳态失业率。\u003c/p>","keyTakeaway":"充分就业的标准是经济接近潜在产出、周期性失业约为零。","pitfall":"自然失业率会随结构和制度变化。一次需求衰退直接推高的是周期性失业；若造成长期技能损失，还可能改变自然失业率。","example":"若 s = 2%、f = 38%，模型给出稳态失业率 5%。若工作匹配加快使 f 提高至 48%，则降到 4%。"},{"id":"inflation-types","title":"通货膨胀的含义与分类","summary":"观察一般物价水平是否持续上升，并区分涨速、价格结构与表现形式。","bodyHtml":"\u003cp>\u003cstrong>通货膨胀\u003c/strong>是一般物价水平持续上升的过程，货币购买力随之下降。通胀率常按价格指数相对上期或上年同期的百分比变化计算。\u003c/p>\u003cul>\u003cli>\u003cstrong>按涨速\u003c/strong>可分温和、奔腾、恶性。四档教学分类另列涨幅更低的爬行式。划分阈值取决于采用的定义。\u003c/li>\u003cli>\u003cstrong>按相对价格\u003c/strong>区分平衡和非平衡。各类价格同比例上涨时，相对价格基本不变。\u003c/li>\u003cli>\u003cstrong>按表现\u003c/strong>区分公开与抑制或隐蔽。价格受管制时，超额需求可表现为短缺、排队、凭证购买或黑市价格。\u003c/li>\u003c/ul>","keyTakeaway":"观察总体价格指标和变化持续性。","pitfall":"单一商品涨价反映该商品的相对价格变化。通胀率由 5% 降至 2% 时，一般物价仍在上升。","example":"价格指数从 100 升至 104，涨幅 4%。再升至 106.08 时，第二期通胀率是 2%，物价指数仍比第一期高。"},{"id":"inflation-causes","title":"需求拉动、成本推动与结构性成因","summary":"固定另一条曲线，比较需求或成本冲击对价格和产出的方向。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>需求拉动\u003c/strong>是总需求相对于生产能力过旺，AD 右移。短期通常伴随价格和产出同向上升。\u003c/li>\u003cli>\u003cstrong>成本推动\u003c/strong>来自单位工资成本、原材料成本或加价率等上升，短期 AS 左移。物价可上升而产出减少。\u003c/li>\u003cli>\u003cstrong>供求混合\u003c/strong>表示需求扩张与成本上升共同作用，产出方向取决于各自幅度。\u003c/li>\u003cli>\u003cstrong>结构性通胀\u003c/strong>与部门生产率、工资传导或要素配置差异有关。在需求扩张或传导持续时，相对价格冲击可推动一般价格。\u003c/li>\u003c/ul>\u003cp>传统货币数量论从 \u003cstrong>MV = PY\u003c/strong> 出发。在货币流通速度 V 和实际产出 Y 给定时，货币量 M 越高，价格水平 P 越高。长期通胀判断还要考虑货币增长、实际产出增长与流通速度变化。\u003c/p>","keyTakeaway":"需求拉动看超额总需求，成本推动看单位成本或加价率。","pitfall":"名义工资增加的同时若劳动生产率同比例提高，单位劳动成本可能保持稳定。","example":"若国际能源短缺推高企业投入成本，短期总供给收缩，物价上升、产出下降。"},{"id":"inflation-costs","title":"通胀的成本与经济活动","summary":"分别判断价格调整、持币行为、税收和相对价格信号受到的影响。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>菜单成本\u003c/strong>是企业更改价签、报价系统和合同的成本。\u003c/li>\u003cli>\u003cstrong>鞋底成本\u003c/strong>是为减少货币购买力损失而调整现金持有的时间与交易成本。\u003c/li>\u003cli>\u003cstrong>税收扭曲\u003c/strong>会在名义税档和名义收益未完全随价格调整时出现。\u003c/li>\u003cli>较高、波动较大的通胀会使相对价格信号更难判断，并加剧投资与交易不确定性。\u003c/li>\u003c/ul>\u003cp>需求扩张可能在有闲置产能、价格和工资未完全调整时带动短期生产。高通胀、严重缺货或成本冲击可能破坏正常交易，降低投资意愿。\u003c/p>","keyTakeaway":"区分通胀随附的成本和造成通胀的冲击。","pitfall":"通胀即使被预期到，也可能有调价成本与税收影响。实际生产反应取决于成因和经济条件。","example":"价格需要频繁变动时，商家花费额外工时更新报价，消费者也更难比较不同商店的真实价格。"},{"id":"inflation-redistribution","title":"通胀如何改变收入与财富分配","summary":"给定名义合同，未预期到的通胀提高会减轻债务实际负担。","bodyHtml":"\u003cp>固定名义工资、固定退休金和现金储蓄的购买力会被通胀侵蚀。名义收入及时按价格调整的群体所受影响较小。固定利率借贷中，\u003cstrong>实际利率约等于名义利率减去通胀率\u003c/strong>，精确式为 (1+i) ÷ (1+π) − 1。\u003c/p>\u003cp>在名义合同给定时，未预期通胀使固定名义还款的实际价值下降，购买力从债权人向债务人转移。预期通胀可进入新签合同的名义利率，指数化合同也可减轻影响。政府若发行名义债务，意外通胀可能降低其实际负担，公共支出和税收还会经价格、指数化和征收时滞变化。\u003c/p>","keyTakeaway":"先检查名义金额是否固定、通胀是否被预期、合同是否指数化。","pitfall":"名义利率是以货币计量的收益率，实际利率反映购买力。","example":"固定名义利率为 5%，通胀率意外达到 8%，实际利率约为 −3%，精确值约为 −2.78%。"},{"id":"inflation-policies","title":"通胀治理与政策作用路径","summary":"不同成因对应需求管理、改善供给和降低再分配成本等措施。","bodyHtml":"\u003cul>\u003cli>对需求过旺，可通过紧缩性货币或财政措施减少总需求。标准模型中，央行卖出证券可回收流动性。\u003c/li>\u003cli>改善供给可针对物流瓶颈、单位生产成本和生产率。供给学派强调税收对供给激励的影响，实际效果取决于税种、融资与政策环境。\u003c/li>\u003cli>收入政策可通过工资与价格指引缓解成本传导。指数化可调整名义合同，降低实际购买力偏离。\u003c/li>\u003cli>极端通胀下，货币制度改革通常需要配合财政与货币政策稳定，才能重建货币信用。\u003c/li>\u003c/ul>","keyTakeaway":"先诊断通胀成因，再判断所考工具对总需求、总供给或名义合同的直接作用。","pitfall":"价格管制可能压住公开标价，同时出现供给不足或黑市。指数化可减轻部分再分配影响，持续通胀仍取决于其成因。","example":"需求超过产能时，减少政府购买可使总需求回落。若问题源于港口堵塞，疏通物流有助于降低供给成本。"},{"id":"deflation","title":"通货紧缩、实际利率与债务","summary":"一般物价持续下跌时，固定名义债务的实际负担可能上升。","bodyHtml":"\u003cp>\u003cstrong>通货紧缩\u003c/strong>是一般物价水平持续下降。需求不足引发的紧缩可使销售、投资和就业承压。若名义利率变化有限，通胀率下降到负数会推高实际利率，增加名义债务的实际负担。\u003c/p>\u003cp>在总需求不足的情境中，增加公共支出、降低政策利率或改善收入支持可通过总需求缓解通缩。部分教学分类使用“隐性通缩”指价格被人为维持而需求不足或商品积压的情境。统计判断仍要观察一般价格水平是否持续下行。\u003c/p>","keyTakeaway":"物价水平持续下降属于通缩，物价涨得更慢属于通胀放缓。","pitfall":"供给改善带来的降价与需求收缩带来的通缩对产出和就业的影响不同。判断债务负担时先检查名义利率与合同。","example":"名义借款利率 2%、价格水平下降 3% 时，实际利率近似为 5%。"},{"id":"okun-law","title":"奥肯定律与产出缺口","summary":"用经验关系连接周期性失业和实际产出缺口。","bodyHtml":"\u003cp>缺口式奥肯定律可写作 \u003cstrong>(Y − Y*) ÷ Y* ≈ −β(u − u*)\u003c/strong>。Y 为实际产出，Y* 为潜在产出，u 为实际失业率，u* 为自然失业率。β 为经验系数。\u003c/p>\u003cp>基础练习常使用 β ≈ 2。当失业率高于自然失业率 1 个百分点，实际产出约比潜在产出低 2%。估计系数随经济体、时期、估计方式与劳动市场调整而变。\u003c/p>","keyTakeaway":"失业率差用百分点，产出缺口表示为潜在产出的百分比。","pitfall":"奥肯定律联系产出和失业。增长率形式需要另外确定潜在增长率与失业率变动的估计关系。","example":"若自然失业率 4.5%，实际失业率 6%，取 β = 2，则实际产出约低于潜在产出 3%。"},{"id":"phillips-curve","title":"菲利普斯曲线与通胀预期","summary":"短期存在有条件的负向关系，长期曲线在自然失业率处垂直。","bodyHtml":"\u003cp>早期菲利普斯曲线描述名义工资增长率与失业率的负向关系，后续形式用价格通胀率。考虑预期和供给冲击时，可写为 \u003cstrong>π = πᵉ − α(u − u*) + v\u003c/strong>。其中 α &gt; 0，πᵉ 为预期通胀率，v 为供给冲击。\u003c/p>\u003cp>给定预期和供给条件，降低失业率对应沿短期曲线提高通胀率。预期通胀提高或不利供给冲击可使短期曲线向上移动。长期预期与实际通胀一致，且供给冲击消退时，失业率回到自然率。\u003c/p>","keyTakeaway":"在短期题中固定预期与供给条件。长期垂直曲线排除靠持续提高通胀永久降低失业率。","pitfall":"需求政策在长期仍可影响名义变量。提高岗位匹配效率等结构措施还可能改变自然失业率。","example":"需求扩张可在短期减少周期性失业并提高通胀。随着通胀预期调整，失业率回归自然率，物价路径可能已改变。"}],"mindmap":[{"label":"失业","target":"employment-measure","children":[{"label":"失业主体条件与统计","target":"employment-measure","children":[{"label":"有劳动能力","target":"employment-measure"},{"label":"有工作意愿","target":"employment-measure"},{"label":"没有工作","target":"employment-measure"},{"label":"调查失业率与统计口径","target":"employment-measure"}]},{"label":"按意愿分类","target":"unemployment-types","children":[{"label":"自愿失业","target":"unemployment-types"},{"label":"非自愿失业","target":"unemployment-types"}]},{"label":"自然失业与充分就业","target":"natural-unemployment","children":[{"label":"摩擦性失业","target":"unemployment-types"},{"label":"结构性失业","target":"unemployment-types"},{"label":"充分就业仍有自然失业","target":"natural-unemployment"}]},{"label":"季节性失业","target":"unemployment-types"},{"label":"周期性失业","target":"unemployment-types"}]},{"label":"通货膨胀","target":"inflation-types","children":[{"label":"类型","target":"inflation-types","children":[{"label":"按物价上涨速度","target":"inflation-types","children":[{"label":"温和型","target":"inflation-types"},{"label":"奔腾式","target":"inflation-types"},{"label":"恶性型","target":"inflation-types"},{"label":"四档分法另列爬行式","target":"inflation-types"}]},{"label":"按相对价格变化","target":"inflation-types","children":[{"label":"平衡型","target":"inflation-types"},{"label":"非平衡型","target":"inflation-types"}]},{"label":"按表现形式","target":"inflation-types","children":[{"label":"公开性","target":"inflation-types"},{"label":"隐蔽性或抑制性","target":"inflation-types"}]}]},{"label":"成因","target":"inflation-causes","children":[{"label":"传统货币数量论","target":"inflation-causes"},{"label":"需求拉动","target":"inflation-causes"},{"label":"成本推动","target":"inflation-causes"},{"label":"供求混合","target":"inflation-causes"},{"label":"结构性通胀","target":"inflation-causes"}]},{"label":"成本","target":"inflation-costs","children":[{"label":"菜单成本","target":"inflation-costs"},{"label":"鞋底成本","target":"inflation-costs"},{"label":"税收扭曲","target":"inflation-costs"}]},{"label":"分配影响","target":"inflation-redistribution","children":[{"label":"固定收入与浮动收入","target":"inflation-redistribution"},{"label":"货币储蓄者","target":"inflation-redistribution"},{"label":"债权人与债务人","target":"inflation-redistribution"},{"label":"政府与公众","target":"inflation-redistribution"}]},{"label":"治理","target":"inflation-policies","children":[{"label":"控制需求","target":"inflation-policies"},{"label":"改善供给","target":"inflation-policies"},{"label":"收入政策","target":"inflation-policies"},{"label":"收入指数化","target":"inflation-policies"},{"label":"货币制度改革","target":"inflation-policies"}]},{"label":"通货紧缩","target":"deflation","children":[{"label":"持续下跌的一般物价","target":"deflation"},{"label":"实际利率和债务负担","target":"deflation"},{"label":"需求不足时的政策","target":"deflation"}]}]},{"label":"奥肯定律与菲利普斯曲线","target":"okun-law","children":[{"label":"奥肯定律","target":"okun-law","children":[{"label":"自然失业率与周期性失业","target":"okun-law"},{"label":"实际产出与潜在产出缺口","target":"okun-law"}]},{"label":"菲利普斯曲线","target":"phillips-curve","children":[{"label":"工资上涨率与失业率","target":"phillips-curve"},{"label":"价格通胀率与失业率","target":"phillips-curve"},{"label":"短期曲线与通胀预期","target":"phillips-curve"},{"label":"长期曲线在自然失业率处垂直","target":"phillips-curve"}]}]}]},"questions":[{"id":"eco-14-q01","number":1,"group":"失业","type":"single","stem":"由于经济衰退而形成的失业属于（　　）。","options":{"A":"摩擦性失业","B":"结构性失业","C":"周期性失业","D":"自然失业"},"answer":["C"],"explanationSupplement":"总需求随经济衰退减少，企业因订单下降缩减用工，这属于周期性失业。","optionExplanations":{"A":"岗位搜寻与转换形成摩擦性失业。","B":"岗位要求与劳动者不匹配形成结构性失业。","C":"宏观经济衰退是典型的周期性因素。","D":"自然失业通常包含摩擦性和结构性失业。"},"conceptId":"unemployment-types"},{"id":"eco-14-q02","number":2,"group":"失业","type":"discussion","stem":"充分就业一般是指消除了一国经济中的（　　），但仍存在着（　　）。","options":{"A":"非自愿失业，自愿失业和摩擦失业","B":"自愿失业，非自愿失业和摩擦失业","C":"摩擦失业，自愿失业和非摩擦失业","D":"非自愿失业，自愿失业和非摩擦失业"},"answer":[],"explanationSupplement":"充分就业通常指周期性失业约为零，仍可能有摩擦性和结构性失业。部分结构性失业者愿意按现行条件工作，因此把所有非自愿失业都排除会混淆两种分类。","optionExplanations":{"A":"按意愿分类过于宽泛，缺少周期性失业这一条件。","B":"自愿失业的存在不决定是否充分就业。","C":"正常的岗位搜寻仍会产生摩擦性失业。","D":"按意愿和摩擦性直接划分，缺少周期性和结构性。"},"conceptId":"natural-unemployment"},{"id":"eco-14-q03","number":3,"group":"失业","type":"discussion","stem":"以下对我国就业与失业的说法中，错误的是（　　）。","options":{"A":"我国只计算城镇地区的失业率","B":"在计算城镇失业率时，主要以是否具有城镇户口为标准","C":"我国的就业人口是指在16周岁以上，从事一定社会劳动并取得劳动报酬或经营收入的人员","D":"就业率=（就业人口/民用成年人口数）×100%"},"answer":[],"explanationSupplement":"我国劳动力调查覆盖城乡，城镇调查失业率按常住地划分。比较就业比例时，需要先明确年龄范围和统计分母。","optionExplanations":{"A":"城乡都可以计算调查失业率。","B":"城镇调查以常住地划分，覆盖符合范围的进城务工人员。","C":"就业口径还包括至少工作 1 小时或符合条件的暂时离岗者。","D":"就业人口占工作年龄人口的比例有其统计含义。需先明确题目所说的就业率口径。"},"conceptId":"employment-measure"},{"id":"eco-14-q04","number":4,"group":"失业","type":"single","stem":"由于产业结构调整所造成的失业称为（　　）。","options":{"A":"需求不足型失业","B":"摩擦性失业","C":"结构性失业","D":"周期性失业"},"answer":["C"],"explanationSupplement":"产业结构调整会改变各行业和地区的岗位需求。若劳动者的技能或所在地难以匹配新岗位，属于结构性失业。","optionExplanations":{"A":"需求不足型失业来自总需求收缩。","B":"短期搜索产生摩擦性失业。","C":"产业重组改变岗位结构与技能匹配。","D":"整体经济周期收缩引起周期性失业。"},"conceptId":"unemployment-types"},{"id":"eco-14-q05","number":5,"group":"失业","type":"single","stem":"由于经济衰退导致需求不足而引起的失业属于（　　）。","options":{"A":"季节性失业","B":"摩擦性失业","C":"结构性失业","D":"周期性失业"},"answer":["D"],"explanationSupplement":"衰退造成总需求不足，进而减少产出和就业，这是周期性失业的典型传导。","optionExplanations":{"A":"季节性失业来自定期重复的用工波动。","B":"摩擦性失业来自搜寻和岗位转换。","C":"结构性失业来自岗位与劳动者错配。","D":"总需求不足随经济周期发生。"},"conceptId":"unemployment-types"},{"id":"eco-14-q06","number":6,"group":"失业","type":"single","stem":"劳动者在现行工资水平下找不到工作，或总需求相对不足减少劳动力派生需求所导致的失业属于（　　）。","options":{"A":"季节性失业","B":"摩擦性失业","C":"结构性失业","D":"非自愿失业"},"answer":["D"],"explanationSupplement":"判断劳动者是否愿意在现行工资与条件下就业。愿意工作却找不到岗位，符合非自愿失业的含义。","optionExplanations":{"A":"季节性需要季节用工因素。","B":"摩擦性强调求职搜索与转换。","C":"结构性强调岗位与技能或地区错配。","D":"符合意愿维度上的定义。"},"conceptId":"unemployment-types"},{"id":"eco-14-q07","number":7,"group":"失业","type":"single","stem":"周期性失业是指（　　）。","options":{"A":"经济中由于正常的劳动力流动而引起的失业","B":"由于总需求不足而引起的短期失业","C":"由于经济中一些难以克服的原因而引起的失业","D":"由于经济中一些制度上的原因而引起的失业"},"answer":["B"],"explanationSupplement":"总需求下滑时企业减少用工，经济复苏后通常随需求恢复而下降。","optionExplanations":{"A":"正常劳动流动主要导致摩擦性失业。","B":"总需求不足对应周期性失业。","C":"长期难克服的错配更接近结构性问题。","D":"制度因素可能影响自然失业率。"},"conceptId":"unemployment-types"},{"id":"eco-14-q08","number":8,"group":"失业","type":"single","stem":"下列关于自然失业率的描述哪一个是正确的？（　　）","options":{"A":"自然失业率是历史上最低限度水平的失业率","B":"自然失业率与一国的经济效率之间关系密切","C":"自然失业率恒定不变","D":"自然失业率包含摩擦性失业"},"answer":["D"],"explanationSupplement":"基础模型把摩擦性和结构性失业计入自然失业。自然失业率受岗位转换和匹配效率影响。","optionExplanations":{"A":"历史最低观察值会受当期经济周期影响。","B":"经济效率的表述范围宽，无法给出清晰定义。","C":"劳动市场结构与制度变化可改变自然失业率。","D":"正常求职等待仍会发生，计入自然失业。"},"conceptId":"natural-unemployment"},{"id":"eco-14-q09","number":9,"group":"失业","type":"discussion","stem":"某人由于彩电行业不景气而失去工作，这种失业属于（　　）。","options":{"A":"摩擦性失业","B":"结构性失业","C":"周期性失业","D":"自愿性失业"},"answer":[],"explanationSupplement":"若产业长期萎缩造成技能和岗位错配，可归为结构性失业。若整体经济下行导致彩电需求暂时减少，则可归为周期性失业。","optionExplanations":{"A":"题目缺少岗位搜寻过程的信息。","B":"产业结构长期变化时成立。","C":"宏观需求收缩时也可能成立。","D":"材料描述失去工作，未给出主动离职的情形。"},"conceptId":"unemployment-types"},{"id":"eco-14-q10","number":10,"group":"失业","type":"single","stem":"某人由于刚刚进入劳动力队伍尚未找到工作，这是属于（　　）。","options":{"A":"摩擦性失业","B":"结构性失业","C":"周期性失业","D":"季节性失业"},"answer":["A"],"explanationSupplement":"刚进入劳动力市场还在搜寻、投递和面试，体现正常的岗位匹配时间。","optionExplanations":{"A":"属于进入劳动力市场后的求职摩擦。","B":"题目未提示所学技能与岗位要求错配。","C":"题目未提示经济衰退。","D":"题目未给出季节因素。"},"conceptId":"unemployment-types"},{"id":"eco-14-q11","number":11,"group":"失业","type":"single","stem":"在经济复苏时期，经济活动水平上升，（　　）将有所下降。","options":{"A":"摩擦性失业","B":"结构性失业","C":"周期性失业","D":"季节性失业"},"answer":["C"],"explanationSupplement":"复苏时总需求和企业订单回升，企业增加用工，周期性失业通常下降。","optionExplanations":{"A":"岗位搜寻过程仍会存在。","B":"技能与地区错配需要结构性调整。","C":"周期性失业随经济复苏回落。","D":"季节性变化由季节性用工决定。"},"conceptId":"unemployment-types"},{"id":"eco-14-q12","number":12,"group":"失业","type":"single","stem":"某工人因不会操作工厂的新机器而被解雇属于（　　）。","options":{"A":"摩擦性失业","B":"自愿失业","C":"结构性失业","D":"周期性失业"},"answer":["C"],"explanationSupplement":"新机器改变岗位所需技能，劳动者暂时缺少相应技能，形成结构性失业。","optionExplanations":{"A":"情境给出的直接原因是技能错配。","B":"劳动者被解雇，材料未描述主动离职。","C":"技术变化改变了技能要求。","D":"材料未给出总需求不足的背景。"},"conceptId":"unemployment-types"},{"id":"eco-14-q13","number":13,"group":"失业","type":"single","stem":"一个人为了寻找一份薪酬更高的工作而辞去现有工作的失业状态属于（　　）。","options":{"A":"摩擦性失业","B":"结构性失业","C":"非自愿失业","D":"周期性失业"},"answer":["A"],"explanationSupplement":"离开旧岗位寻找新岗位，期间的求职等待属于摩擦性失业。按意愿分类，这次离职是自愿的。","optionExplanations":{"A":"属于工作转换中的搜索摩擦。","B":"没有证据表明技能和岗位出现持久错配。","C":"劳动者主动辞职。","D":"材料未给出总需求收缩。"},"conceptId":"unemployment-types"},{"id":"eco-14-q14","number":14,"group":"失业","type":"single","stem":"充分就业的含义是（　　）。","options":{"A":"人人都有工作，没有失业者","B":"消灭了周期性失业的就业状态","C":"消灭了摩擦性失业时的就业状态","D":"消灭了自愿失业时的就业状态"},"answer":["B"],"explanationSupplement":"充分就业对应产出接近潜在水平，通常还存在摩擦性和结构性失业。","optionExplanations":{"A":"充分就业仍容许自然失业。","B":"周期性失业约为零。","C":"岗位转换需要时间。","D":"是否存在自愿离职不能据此判断是否充分就业。"},"conceptId":"natural-unemployment"},{"id":"eco-14-q15","number":15,"group":"失业","type":"discussion","stem":"我国统计部门计算和公布的反映失业水平方面的指标是（　　）。","options":{"A":"城镇实际失业率","B":"城镇预期失业率","C":"城镇登记失业率","D":"城乡登记失业率"},"answer":[],"explanationSupplement":"我国当前定期公布城镇调查失业率。城镇登记失业率是另一统计指标，范围和分母有别。题目未提供城镇调查失业率这一选项。","optionExplanations":{"A":"这一表述没有给出官方调查指标名称。","B":"调查失业率衡量已观察到的就业状态。","C":"确有城镇登记失业率这一口径，和城镇调查失业率各有定义。","D":"这不是国家统计局月度发布中相应指标的名称。"},"conceptId":"employment-measure"},{"id":"eco-14-q16","number":16,"group":"失业","type":"single","stem":"经济学中，充分就业不等于社会劳动力 100%就业，通常是将（　　）排除在外。","options":{"A":"摩擦性失业和非自愿失业","B":"周期性失业和自愿失业","C":"摩擦性失业和周期性失业","D":"摩擦性失业和结构性失业"},"answer":["D"],"explanationSupplement":"这里的“排除”是指判断充分就业时，允许摩擦性和结构性失业继续存在。需要消除的是周期性失业。","optionExplanations":{"A":"部分非自愿失业来自需求不足，仍需纳入判断。","B":"存在周期性失业时，经济通常尚未充分就业。","C":"摩擦性可以保留，但周期性应约为零。","D":"两者都属于常用自然失业率框架。"},"conceptId":"natural-unemployment"},{"id":"eco-14-q17","number":17,"group":"失业","type":"single","stem":"在宏观经济学理论中，由于经济萧条引起的失业属于（　　）。","options":{"A":"摩擦性失业","B":"结构性失业","C":"周期性失业","D":"临时性失业"},"answer":["C"],"explanationSupplement":"经济萧条常伴随总需求不足和企业用工减少，属于周期性失业。","optionExplanations":{"A":"岗位搜索和转换造成摩擦性失业。","B":"结构性失业由长期错配引起。","C":"宏观经济萧条指向周期性失业。","D":"“临时”描述持续时间，无法说明失业成因。"},"conceptId":"unemployment-types"},{"id":"eco-14-q18","number":18,"group":"失业","type":"single","stem":"根据菲利普斯曲线，降低失业率的办法是（　　）。","options":{"A":"减少货币供应量","B":"增加货币供应量","C":"增加税收","D":"减少政府购买"},"answer":["B"],"explanationSupplement":"在预期和供给条件给定时，扩张性货币政策可通过增加需求减少周期性失业，同时带来更高通胀。长期预期调整后，失业率回归自然率。","optionExplanations":{"A":"收紧货币通常压低总需求。","B":"扩大需求，短期可能降低失业率。","C":"提高税收通常降低私人支出。","D":"减少政府购买会压低总需求。"},"conceptId":"phillips-curve"},{"id":"eco-14-q19","number":19,"group":"失业","type":"discussion","stem":"下列关于自然失业率的说法中，错误的是（　　）。","options":{"A":"经济波动会导致自然失业率的变动","B":"失业津贴延长会降低自然失业率","C":"就职率升高会降低自然失业率","D":"自然失业率与部门转移正相关"},"answer":[],"explanationSupplement":"在简化模型中，提高就职率通常降低自然失业率，增加部门转换摩擦通常提高自然失业率。失业津贴、长期衰退是否改变自然失业率需具体分析。","optionExplanations":{"A":"普通周期波动首先改变周期性失业，持久的结构损伤才可能改变自然率。","B":"延长津贴对搜索、匹配与退出劳动力市场的影响可能不同，不能直接断言自然失业率下降。","C":"给定工作丧失率，稳态模型中就职率越高，自然失业率越低。","D":"更频繁的部门转换可能在其他条件不变时提高匹配成本。"},"conceptId":"natural-unemployment"},{"id":"eco-14-q20","number":20,"group":"通货膨胀","type":"single","stem":"通货膨胀对策中，通过公开市场业务出售政府债券属于（　　）。","options":{"A":"控制需求","B":"改善供给","C":"减少政府转移支付","D":"收入指数化政策"},"answer":["A"],"explanationSupplement":"央行出售债券可回收流动性，在基础模型中通过压低总支出来缓和过旺需求。","optionExplanations":{"A":"公开市场卖出操作可用于紧缩需求。","B":"改善供给通常针对成本、产能或供给瓶颈。","C":"转移支付是财政工具。","D":"指数化将合同名义额与价格指数挂钩。"},"conceptId":"inflation-policies"},{"id":"eco-14-q21","number":21,"group":"通货膨胀","type":"single","stem":"在供给学派看来，治理通货膨胀的最核心政策是（　　）。","options":{"A":"紧缩性收入政策","B":"减税政策","C":"增税政策","D":"限价政策"},"answer":["B"],"explanationSupplement":"供给学派强调降低部分税负可改善劳动、投资和生产激励。实际效果还需看税制、融资与供给反应。","optionExplanations":{"A":"工资与价格指引属于收入政策。","B":"减税体现供给学派强调的激励渠道。","C":"增税可能通过财政需求渠道抑制支出。","D":"限价属于价格控制。"},"conceptId":"inflation-policies"},{"id":"eco-14-q22","number":22,"group":"通货膨胀","type":"single","stem":"经济学家一般认为，能够产生真实效应的通货膨胀是（　　）。","options":{"A":"公开性通货膨胀","B":"抑制性通货膨胀","C":"隐蔽性通货膨胀","D":"非预期性通货膨胀"},"answer":["D"],"explanationSupplement":"给定名义合同与预期，意外通胀改变实际支付和购买力。在常用短期模型中，通胀偏离预期还可能影响真实活动。","optionExplanations":{"A":"能观察到通胀不说明其是否超出预期。","B":"价格受到抑制也可能造成实际短缺，仍需识别预期和合同。","C":"隐蔽性描述价格或短缺的表现形式。","D":"偏离预期会使实际合同条件偏离预定值。"},"conceptId":"inflation-redistribution"},{"id":"eco-14-q23","number":23,"group":"通货膨胀","type":"single","stem":"通货膨胀是指（　　）持续地、较大幅度地上涨的过程和由此引起的货币价值下降的现象。","options":{"A":"价格总水平","B":"部分商品价格","C":"房地产价格","D":"外汇汇率"},"answer":["A"],"explanationSupplement":"通胀衡量整体价格水平的持续上升，反映单位货币购买力下降。","optionExplanations":{"A":"一般价格指数符合定义。","B":"部分商品涨价只说明局部价格变化。","C":"房价上涨主要指一种资产的价格。","D":"汇率变化需要通过进口等渠道才可能影响物价。"},"conceptId":"inflation-types"},{"id":"eco-14-q24","number":24,"group":"通货膨胀","type":"single","stem":"从通货膨胀的程度来看，物价上涨幅度最小的是（　　）通货膨胀。","options":{"A":"温和式","B":"爬行式","C":"奔腾式","D":"恶性"},"answer":["B"],"explanationSupplement":"题目把爬行式和温和式分为两档。在这种分类中，爬行式对应最低涨幅。","optionExplanations":{"A":"采用三档分类时，温和式可包含低幅上涨。","B":"题设的四档分类中对应最低涨幅。","C":"通常表示较快上涨。","D":"表示极高的价格上涨速度。"},"conceptId":"inflation-types"},{"id":"eco-14-q25","number":25,"group":"通货膨胀","type":"single","stem":"与通货膨胀相反，通货紧缩有利于（　　）。","options":{"A":"债权人","B":"债务人","C":"生产者","D":"投资者"},"answer":["A"],"explanationSupplement":"在固定名义债务条件下，物价持续下降会提高货币和还款的实际购买力，债权人可能相对受益。","optionExplanations":{"A":"名义还款实际价值上升。","B":"债务实际负担通常上升。","C":"需求不足可能使企业销售和利润承压。","D":"投资结果取决于资产类别和融资结构。"},"conceptId":"deflation"},{"id":"eco-14-q26","number":26,"group":"通货膨胀","type":"single","stem":"物价总水平上涨的年平均率在2位数以上，且发展速度很快，这种通货膨胀类型是（　　）。","options":{"A":"爬行式通货膨胀","B":"温和式通货膨胀","C":"奔腾式通货膨胀","D":"恶性通货膨胀"},"answer":["C"],"explanationSupplement":"常见分类用两位数的较快年度价格涨幅描述奔腾式通胀。极端高涨幅再归入恶性通胀。","optionExplanations":{"A":"对应低速物价上涨。","B":"对应较低且温和的涨幅。","C":"符合题设的较快两位数涨幅。","D":"通常需要高得多的涨幅。不同定义使用的阈值和时间单位可能不同。"},"conceptId":"inflation-types"},{"id":"eco-14-q27","number":27,"group":"通货膨胀","type":"single","stem":"通货膨胀实质是一种货币现象，表现为商品和生产要素价格总水平在一定时期内（　　）。","options":{"A":"持续下降","B":"持续上升","C":"间歇性下降","D":"间歇性上升"},"answer":["B"],"explanationSupplement":"通胀表现为商品与服务一般价格水平持续上升，货币购买力下降。","optionExplanations":{"A":"持续下降对应通缩。","B":"持续上升符合定义。","C":"间歇下降不足以表明持续上涨。","D":"零星或间歇上涨要结合整体趋势判断。"},"conceptId":"inflation-types"},{"id":"eco-14-q28","number":28,"group":"通货膨胀","type":"single","stem":"需求拉上的通货膨胀可以通俗地表述为（　　）。","options":{"A":"太多的货币追求太多的商品","B":"太多的货币追求太少的商品","C":"太少的货币追求太多的商品","D":"太少的货币追求太少的商品"},"answer":["B"],"explanationSupplement":"当购买需求超过既有生产能力时，需求方竞争有限供给，推高一般价格水平。","optionExplanations":{"A":"供给和需求都多，缺少需求超额的条件。","B":"形容较多购买力追逐相对有限的产出。","C":"需求少且供给多可能有降价压力。","D":"都少仍需比较供需的相对大小。"},"conceptId":"inflation-causes"},{"id":"eco-14-q29","number":29,"group":"通货膨胀","type":"single","stem":"在治理通货膨胀过程中，收入政策主要是针对（　　）。","options":{"A":"需求拉上型通货膨胀","B":"成本推进型通货膨胀","C":"结构性通货膨胀","D":"供求混合型通货膨胀"},"answer":["B"],"explanationSupplement":"收入政策通过工资、价格或利润指引尝试抑制单位成本与售价相互推升。","optionExplanations":{"A":"总需求过旺主要通过需求管理调节。","B":"收入政策针对工资与价格传导。","C":"结构性问题还需分析生产率、资源配置和行业差异。","D":"混合冲击可能需要同时使用多类政策。"},"conceptId":"inflation-policies"},{"id":"eco-14-q30","number":30,"group":"通货膨胀","type":"single","stem":"通货膨胀的过程是一种强制性的（　　）过程。","options":{"A":"国民收入再分配","B":"财政收入再分配","C":"财政收入分配","D":"国民收入分配"},"answer":["A"],"explanationSupplement":"通胀改变固定名义收入、现金储蓄和合同支付的实际购买力，影响国民收入在不同群体间的分配。","optionExplanations":{"A":"通胀会改变已形成的实际收入分配。","B":"财政收入只是影响范围的一部分。","C":"财政收入分配无法覆盖私人收入和借贷合同。","D":"题目指价格变化使既有实际分配再次发生变化。"},"conceptId":"inflation-redistribution"},{"id":"eco-14-q31","number":31,"group":"通货膨胀","type":"single","stem":"通货膨胀打乱了正常的商品流通秩序，使商品迟迟不能进入（　　）。","options":{"A":"流通领域","B":"消费领域","C":"生产领域","D":"分配领域"},"answer":["B"],"explanationSupplement":"在严重通胀或价格管制导致短缺的假设下，囤积、投机或反复转售可能使商品延迟进入最终消费。","optionExplanations":{"A":"题设中商品已处于流通过程。","B":"最终消费可能被延迟。","C":"生产环节发生在商品进入流通之前。","D":"这里讨论商品到达最终使用者的过程。"},"conceptId":"inflation-costs"},{"id":"eco-14-q32","number":32,"group":"通货膨胀","type":"single","stem":"在实际利率为负值时，不划算的行为是（　　）。","options":{"A":"贷出货币","B":"借入货币","C":"购买商品","D":"贮藏商品"},"answer":["A"],"explanationSupplement":"实际利率为负时，固定名义贷款的实际回报为负，出借人到期收回款项的购买力下降。","optionExplanations":{"A":"在题设的固定名义收益下，出借人的实际回报为负。","B":"借款人还款的实际负担相对降低。","C":"购入商品是否合适取决于用途和价格。","D":"储存收益还取决于变质、仓储和相对价格变化。"},"conceptId":"inflation-redistribution"},{"id":"eco-14-q33","number":33,"group":"通货膨胀","type":"single","stem":"在通货膨胀时期，中央银行一般会在市场上（　　）。","options":{"A":"出售有价证券","B":"购入有价证券","C":"投放货币","D":"降低利率"},"answer":["A"],"explanationSupplement":"在总需求过旺的基础模型中，卖出证券可回收流动性并收紧货币条件。实际政策取决于通胀成因和其他目标。","optionExplanations":{"A":"卖出证券通常回收流动性。","B":"买入证券通常投放流动性。","C":"投放货币通常有扩张效果。","D":"降低利率通常鼓励支出。"},"conceptId":"inflation-policies"},{"id":"eco-14-q34","number":34,"group":"通货膨胀","type":"single","stem":"工资上涨使得生产成本增长，在既定的价格水平下，厂商愿意并且能够供给的数量减少，从而使得总供给曲线向左上方移动，造成（　　）。","options":{"A":"价格推动的通货膨胀","B":"需求拉上的通货膨胀","C":"报酬拉动的通货膨胀","D":"成本推进的通货膨胀"},"answer":["D"],"explanationSupplement":"单位劳动成本上升时，同一物价下可获利的供给量减少，短期总供给向左上移动并推高物价。","optionExplanations":{"A":"题干给出工资造成的成本冲击。","B":"需求拉动源于总支出扩大。","C":"“报酬拉动”没有直接刻画成本通过供给曲线传导。","D":"成本推进与题干机制一致。"},"conceptId":"inflation-causes"},{"id":"eco-14-q35","number":35,"group":"通货膨胀","type":"discussion","stem":"关于通货膨胀影响的说法，错误的是（　　）。","options":{"A":"通货膨胀能够有效地扩张社会生产资本总量","B":"通货膨胀初期会对生产有一定的刺激作用","C":"较严重的通货膨胀会导致投机活动猖獗、价格信号扭曲","D":"在通货膨胀的情况下，商品会长期滞留在流通领域，成为倒买倒卖的对象"},"answer":[],"explanationSupplement":"通胀对产出、投资和流通的影响取决于成因、预期、通胀水平和供给条件。低程度需求冲击和高通胀供给冲击可能有不同结果。","optionExplanations":{"A":"名义价格上涨本身无法保证实际资本增加。","B":"有闲置资源的需求扩张可能短期刺激生产，成本冲击则可能压低产出。","C":"严重且不稳定的通胀可扭曲价格信号。","D":"囤积倒卖可能出现在特定环境，商品长期滞留并非通胀的一般结果。"},"conceptId":"inflation-costs"},{"id":"eco-14-q36","number":36,"group":"通货膨胀","type":"single","stem":"总供给和总需求共同作用情况下的通货膨胀称为（　　）。","options":{"A":"综合性通货膨胀","B":"供求混合推进型通货膨胀","C":"结构性通货膨胀","D":"成本推进型通货膨胀"},"answer":["B"],"explanationSupplement":"总需求过旺与供给成本增加可以同时发生，通常称为供求混合推进型通胀。","optionExplanations":{"A":"措辞宽泛，未明确指出供需两种机制。","B":"明确包含需求拉动和成本推动。","C":"结构性通胀主要分析部门差异。","D":"成本推进只描述供给或定价端的冲击。"},"conceptId":"inflation-causes"},{"id":"eco-14-q37","number":37,"group":"通货膨胀","type":"single","stem":"治理通货紧缩的一般措施中，不正确的方法是（　　）。","options":{"A":"增加政府公共支出","B":"降低法定存款准备金率","C":"增加农民的收入水平","D":"提高中央银行的再贴现率"},"answer":["D"],"explanationSupplement":"若通缩主要来自总需求不足，扩大公共支出或放松货币条件可支撑总需求。提高再贴现率通常收紧融资。","optionExplanations":{"A":"增加公共支出可扩大需求。","B":"下调准备金率通常改善银行流动性。","C":"收入提高在有消费响应时可支持需求。","D":"再贴现成本上升通常减少融资和支出。"},"conceptId":"deflation"},{"id":"eco-14-q38","number":38,"group":"通货膨胀","type":"single","stem":"可用于治理通货膨胀的货币政策措施是（　　）。","options":{"A":"提高法定存款准备金率","B":"降低利率","C":"降低再贴现率","D":"公开市场上买入政府债券"},"answer":["A"],"explanationSupplement":"在题设的货币工具框架下，提高法定存款准备金率通常收紧银行可用于放贷的资金，抑制过旺需求。","optionExplanations":{"A":"属于常见的紧缩方向。","B":"降低利率一般鼓励借贷。","C":"降低再贴现率通常放松融资。","D":"买入政府债券一般投放流动性。"},"conceptId":"inflation-policies"},{"id":"eco-14-q39","number":39,"group":"通货膨胀","type":"single","stem":"通货紧缩是指商品和劳务的（　　）。","options":{"A":"价格普遍持续上涨","B":"价格普遍持续下降","C":"贷款持续增加","D":"贷款持续减少"},"answer":["B"],"explanationSupplement":"通缩描述一般价格水平普遍且持续下降。贷款可以受影响，但贷款变动不是物价定义。","optionExplanations":{"A":"持续上涨对应通胀。","B":"普遍持续下降符合通缩。","C":"贷款扩张是信用变化。","D":"贷款收缩可能伴随通缩，仍须看总体价格。"},"conceptId":"deflation"},{"id":"eco-14-q40","number":40,"group":"通货膨胀","type":"single","stem":"石油危机、资源枯竭等造成原材料、能源价格上升，从而导致一般物价水平上涨，这种情形属于（　　）通货膨胀。","options":{"A":"需求拉上型","B":"成本推进型","C":"结构型","D":"隐蔽型"},"answer":["B"],"explanationSupplement":"能源与原材料价格上涨提高单位成本，短期总供给收缩，可推高一般物价。","optionExplanations":{"A":"缺少总需求扩大信息。","B":"供给成本上升是直接机制。","C":"需额外给出部门结构传导条件。","D":"没有给出价格管制或隐藏短缺的信息。"},"conceptId":"inflation-causes"},{"id":"eco-14-q41","number":41,"group":"通货膨胀","type":"single","stem":"通货紧缩的危害之一是，当物价水平持续性地普遍下降时，实际利率将会（　　），从而损害债务人的利益。","options":{"A":"降低","B":"不变","C":"升高","D":"为零"},"answer":["C"],"explanationSupplement":"在名义利率给定或降幅较小的情况下，实际利率近似等于名义利率减去通胀率。通胀率下降至负数会提高实际利率。","optionExplanations":{"A":"若名义利率下降更多，实际利率才可能下降。","B":"名义利率与通胀率同幅下降时可不变。","C":"符合固定名义利率下的方向。","D":"实际利率由两者的差额决定。"},"conceptId":"deflation"},{"id":"eco-14-q42","number":42,"group":"通货膨胀","type":"single","stem":"在政府对商品价格和货币工资进行严格控制的情况下，隐蔽性通货膨胀可以表现为（　　）。","options":{"A":"市场商品供过于求","B":"商品过度需求通过物价上涨吸收","C":"居民实际消费水平提高","D":"商品黑市、排队和凭证购买等"},"answer":["D"],"explanationSupplement":"价格与工资受到严格控制时，过度需求可能没有充分反映在公开价格中，商品短缺表现为黑市、排队和凭证配给。","optionExplanations":{"A":"供过于求指向需求不足或供给过多。","B":"价格上升可见时更接近公开性通胀。","C":"短缺限制可购商品，不能直接推出实际消费上升。","D":"典型的配给和非正式交易表现。"},"conceptId":"inflation-types"},{"id":"eco-14-q43","number":43,"group":"通货膨胀","type":"single","stem":"根据“成本推进”型通货膨胀理论，导致“利润推进型通货膨胀”的因素是（　　）。","options":{"A":"经济结构失衡","B":"汇率变动使进口原材料成本上升","C":"工会对工资成本的操纵","D":"垄断性大公司对价格的操纵"},"answer":["D"],"explanationSupplement":"具有市场势力的企业提高加价率，在单位成本不变时也可抬高售价。在这一分类中称为利润推进。","optionExplanations":{"A":"结构失衡属于另一类机制。","B":"进口投入涨价属于外部成本冲击。","C":"工资涨价压力属于工资成本推动。","D":"加价率提高体现利润推动。"},"conceptId":"inflation-causes"},{"id":"eco-14-q44","number":44,"group":"通货膨胀","type":"single","stem":"强制性的国民收入再分配是通货膨胀对社会再生产的负面影响之一，其表现在债权债务关系中，就是由于通货膨胀（　　）。","options":{"A":"降低了实际利率，债务人受益","B":"提高了实际利率，债务人受益","C":"降低了实际利率，债权人受益","D":"提高了实际利率，债权人受益"},"answer":["A"],"explanationSupplement":"名义利率固定时，更高的通胀压低实际利率。以货币计量的还款不变，债务人付出的购买力减少。","optionExplanations":{"A":"方向和受益方均符合固定名义合同。","B":"实际利率提高通常加重债务实际负担。","C":"实际利率下降减少债权人的实际回报。","D":"实际利率提高可提高债权人的实际回报，通胀在给定名义利率下产生反方向影响。"},"conceptId":"inflation-redistribution"},{"id":"eco-14-q45","number":45,"group":"通货膨胀","type":"single","stem":"未预期到的通货膨胀会使财富（　　）。","options":{"A":"从年轻一代转移到上一代","B":"从穷人转移到富人","C":"从债权人转移到债务人","D":"从债务人转移到债权人"},"answer":["C"],"explanationSupplement":"对固定名义借贷合同，意外通胀侵蚀名义还款的购买力，债权人相对受损，债务人相对受益。","optionExplanations":{"A":"年龄不能决定净债权或净债务。","B":"财富和债务配置因人而异。","C":"符合固定名义合同下的转移方向。","D":"固定名义合同在意外通缩下才可能出现该方向。"},"conceptId":"inflation-redistribution"},{"id":"eco-14-q46","number":46,"group":"通货膨胀","type":"single","stem":"当出现严重通货膨胀时，政府不宜使用的手段是（　　）。","options":{"A":"降低利率","B":"削减财政支出","C":"增加税收","D":"公开市场业务出售政府债券"},"answer":["A"],"explanationSupplement":"从需求管理角度，通胀压力过高时，降低利率通常刺激借贷和支出。其余选项在常用模型中均可收缩需求。","optionExplanations":{"A":"利率下降通常扩大需求。","B":"减少政府购买可压低总支出。","C":"税收增加通常压低可支配收入。","D":"央行出售债券通常回收流动性。"},"conceptId":"inflation-policies"},{"id":"eco-14-q47","number":47,"group":"通货膨胀","type":"single","stem":"如果采取非市场的手段，硬性维持价格的稳定，就会出现实际产生了通货紧缩，但价格可能并没有降低下来的状况，而这种类型的通货紧缩就是（　　）。","options":{"A":"隐性通货紧缩","B":"显性通货紧缩","C":"柔性通货紧缩","D":"慢性通货紧缩"},"answer":["A"],"explanationSupplement":"本题按价格受管制的分类，将价格维持不变但需求不足、商品积压的情境称为隐性通缩。统计通缩时仍须观察一般价格水平是否持续下降。","optionExplanations":{"A":"对应题干给出的专门分类。","B":"显性通缩能观察到总体物价下降。","C":"柔性描述价格调整特点，未刻画这里的强制维持价格。","D":"慢性指持续性或变化速度，未说明价格管制。"},"conceptId":"deflation"},{"id":"eco-14-q48","number":48,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"菲利普斯曲线揭示了失业率和通胀率之间存在（　　）关系。（2019）","options":{"A":"负相关","B":"正相关","C":"无相关","D":"等同于"},"answer":["A"],"explanationSupplement":"给定预期通胀和供给冲击，短期菲利普斯曲线上，失业率下降对应较高的通胀率。长期曲线在自然失业率处垂直。","optionExplanations":{"A":"符合短期曲线斜率。","B":"不利供给冲击可使通胀和失业同升，但属于曲线移动。","C":"给定短期曲线有负向关系。","D":"两个变量具有不同的经济含义。"},"conceptId":"phillips-curve"},{"id":"eco-14-q49","number":49,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"奥肯定律说明了（　　）。","options":{"A":"失业率与实际国内生产总值呈负相关关系","B":"失业率与实际国内生产总值呈正相关关系","C":"失业率与物价水平呈负相关关系","D":"失业率与物价水平呈正相关关系"},"answer":["A"],"explanationSupplement":"其他条件给定，实际产出相对潜在产出越低，周期性失业通常越高。","optionExplanations":{"A":"奥肯关系的经验方向为负。","B":"实际产出缺口与失业缺口方向相反。","C":"奥肯定律不直接描述物价。","D":"物价和失业可用菲利普斯模型分析。"},"conceptId":"okun-law"},{"id":"eco-14-q50","number":50,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"根据“奥肯法则”，失业率每高于自然失业率1个百分点，实际 GDP将低于潜在 GDP（　　）个百分点。","options":{"A":"2","B":"2.5","C":"3","D":"5"},"answer":["A"],"explanationSupplement":"采用题目的常用近似系数 2，失业率缺口为 1 个百分点时，实际 GDP 约比潜在 GDP 低 2%。","optionExplanations":{"A":"符合题目采用的系数。","B":"可能是其他时期或经济体的估计值。","C":"实际系数可变化，本题按系数 2。","D":"用这一缺口需要额外给出系数 5。"},"conceptId":"okun-law"},{"id":"eco-14-q51","number":51,"group":"奥肯定律与菲利普斯曲线","type":"discussion","stem":"根据传统菲利普斯曲线，降低通货膨胀的政策有（　　）。","options":{"A":"减少货币供给量","B":"降低失业率","C":"提高失业率","D":"增加财政赤字"},"answer":[],"explanationSupplement":"在给定预期的短期曲线上，通胀下降伴随失业率提高。减少货币供给量可以作为收缩总需求的工具，失业率提高是可能的结果。","optionExplanations":{"A":"可用作压低需求的货币政策工具。","B":"沿同一曲线降低失业率对应更高通胀。","C":"描述模型结果，不直接指定政策工具。","D":"扩大赤字通常是需求扩张方向。"},"conceptId":"phillips-curve"},{"id":"eco-14-q52","number":52,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"奥肯定律表明了在经济增长和失业之间存在一定的负相关关系，政府应当把（　　）作为降低失业的主要途径。","options":{"A":"稳定物价","B":"促进经济增长","C":"平衡国际收支","D":"稳定经济秩序"},"answer":["B"],"explanationSupplement":"若经济增长提高实际产出并缩小负的产出缺口，周期性失业通常下降。结构性失业还需分析岗位匹配。","optionExplanations":{"A":"物价稳定属于另一宏观目标。","B":"提高产出可改善周期性就业。","C":"国际收支不是奥肯定律的直接变量。","D":"经济秩序稳定可提供条件，未指出产出变化。"},"conceptId":"okun-law"},{"id":"eco-14-q53","number":53,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"长期菲利普斯曲线说明（　　）。","options":{"A":"通货膨胀和失业之间不存在相互替代关系","B":"传统菲利普斯曲线仍然有效","C":"在价格很高的情况下通货膨胀与失业之间仍有替代关系","D":"可以通过扩张性的需求管理政策来减少失业"},"answer":["A"],"explanationSupplement":"通胀预期在长期调整。在自然失业率给定且冲击消退时，长期菲利普斯曲线垂直，持续提高通胀无法永久降低失业率。","optionExplanations":{"A":"长期曲线不存在固定替代。","B":"传统负斜率适用于给定预期和供给条件的短期。","C":"长期垂直关系不由价格水平的高低改变。","D":"需求扩张可产生短期效果，长期失业率回归自然率。"},"conceptId":"phillips-curve"},{"id":"eco-14-q54","number":54,"group":"奥肯定律与菲利普斯曲线","type":"discussion","stem":"根据对菲利普斯曲线的解释，下列结论正确的是（　　）。","options":{"A":"宏观经济政策在短期与长期中均是有用的","B":"宏观经济政策在短期与长期中均是无用的","C":"宏观经济政策只在短期中有用，而在长期中无用","D":"宏观经济政策只在长期中有用，而在短期中无用"},"answer":[],"explanationSupplement":"菲利普斯曲线限定的是需求政策的长期就业效果。名义价格仍可受需求政策影响，结构政策还可能改变自然失业率。","optionExplanations":{"A":"“有用”缺少政策工具、目标和效果的限定。","B":"短期需求变化可以改变失业和通胀。","C":"在长期无法靠持续提高通胀压低失业，但这不能推广到全部政策和目标。","D":"短期内可能影响周期性失业。"},"conceptId":"phillips-curve"},{"id":"eco-14-q55","number":55,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"宏观经济学中的菲利普斯曲线描述的是（　　）。","options":{"A":"通货膨胀和居民收入增长率之间的关系","B":"经济增长率和失业率之间的关系","C":"通货膨胀率和失业率之间的关系","D":"财政收入增长率和失业率之间的关系"},"answer":["C"],"explanationSupplement":"现代常用形式用失业率与价格通胀率描述短期关系。早期版本使用名义工资增长率。","optionExplanations":{"A":"居民收入增长率不是现代曲线的通胀变量。","B":"经济增长和失业率的关系接近奥肯定律。","C":"符合现代常见表述。","D":"财政收入不是这条曲线的变量。"},"conceptId":"phillips-curve"},{"id":"eco-14-q56","number":56,"group":"奥肯定律与菲利普斯曲线","type":"single","stem":"通常情况下，物价上涨率和失业率是成（　　）。","options":{"A":"有联系但不确定","B":"正相关","C":"负相关","D":"无相关"},"answer":["C"],"explanationSupplement":"固定通胀预期和供给条件，沿短期曲线可观察到物价上涨率与失业率负相关。改变预期或遇到供给冲击时，曲线本身也会移动。","optionExplanations":{"A":"若预期和供给条件未固定，跨时期相关方向可能变化。","B":"不利供给冲击可能使两者同升，但属于曲线移动。","C":"符合短期曲线上关系。","D":"短期模型给出有条件的负向关系。"},"conceptId":"phillips-curve"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"c <script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');

          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;
        }
        const label = el('label', 'quiz-option');
        const input = el('input'); input.type = q.type === 'multiple' ? 'checkbox' : 'radio'; input.name = 'quiz-answer'; input.value = key;
        input.checked = selected.includes(key); input.disabled = show; input.dataset.qid = q.id;
        if (show && q.answer.includes(key)) label.classList.add('correct');
        if (show && selected.includes(key) && !q.answer.includes(key)) label.classList.add('wrong');
        label.append(input, el('span', '', `${key}. ${text}`)); field.append(label);
      }); card.append(field);
      if (mode === 'wrong' && s.answers[q.id] && s.answers[q.id].correct) card.append(el('p', 'quiz-status quiz-correct', '最近一次已答对 · 已掌握，历史错题仍保留'));
      const actions = el('div', 'quiz-actions');
      const nav = el('div', 'quiz-nav');
      const questionIndex = list.findIndex((item) => item.id === q.id);
      const prev = button('上一题', 'previous'); prev.disabled = questionIndex <= 0;
      const next = button('下一题', 'next'); next.disabled = questionIndex >= list.length - 1;
      nav.append(prev, next); actions.append(nav);
      if (discussion) {
        const open = openDiscussions.has(q.id);
        const toggle = button(open ? '收起讨论解析' : '查看讨论解析', 'discussion', 'button button-primary');
        toggle.setAttribute('aria-expanded', String(open));
        actions.append(toggle);
      } else if (mode !== 'test') {
        const submit = button(show ? '重新作答' : '提交答案', show ? 'retry' : 'submit', 'button button-primary');
        submit.disabled = !show && !selected.length; actions.append(submit);
      } else if (!s.test.submitted) actions.append(el('span', 'muted', '本章测试交卷后统一显示解析'));
      card.append(actions);
      const status = el('p', 'quiz-status', statusText); status.setAttribute('role', 'status'); status.setAttribute('aria-live', 'polite'); card.append(status);
      if (show || openDiscussions.has(q.id)) renderExplanation(card, q, selected);
      root.append(card);
      if (mode === 'test' && !s.test.submitted) {
        const foot = el('div', 'quiz-actions');
        foot.append(el('p', 'muted', '未答题交卷后记为未作答，不加入错题本。'), button('交卷并查看解析', 'finish-test', 'button button-primary'));
        root.append(foot);
      }
    }
    function renderTestSummary(s) {
      const summary = testSummary(questions, s.test.drafts);
      const box = el('div', 'quiz-summary');
      if (s.test.submitted) {

        box.append(el('strong', '', `${summary.correct} / ${summary.total}`), el('span', '', `  答对 · 答错 ${summary.wrong} 道 · 未答 ${summary.unanswered} 道`));
        box.append(el('p', '', `正确率 ${summary.total ? Math.round(summary.correct / summary.total * 100) : 0}% · 点击题号查看各题解析。`), button('重新测试', 'restart-test'));
      } else box.append(el('span', '', `已选择 ${summary.answered} / ${summary.total} 题 · 测试中不显示答案，随时可切换题号。`));

    function renderExplanation(card, q, selected) {

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

      if (!Number.isFinite(val)) continue;

      root.querySelector('[data-role="pi-val"]').textContent = fmt(pi, 1) + '%';
      root.querySelector('[data-role="u-val"]').textContent = fmt(u, 1) + '%';
      root.querySelector('[data-role="msg"]').textContent = u === 5
        ? `失业率等于自然失业率 5%，实际通胀率恰好等于预期通胀率（${pe}%），落在垂直的长期菲利普斯曲线 LRPC 上。`
        : u < 5
          ? `短期内压低失业率至 ${fmt(u, 1)}%（低于自然失业率）会推高通胀至 ${fmt(pi, 1)}%；一旦公众上调通胀预期，SRPC 将上移，最终只留下更高通胀。`
          : `失业率高于自然失业率（${fmt(u, 1)}% > 5%），短期通胀回落至 ${fmt(pi, 1)}%（通缩压力）。`;
    }
    peIn.addEventListener('input', draw);
    uIn.addEventListener('input', draw);
    draw();
  }

        <p>拖动「事故发生时间」与「提出索赔时间」，秒懂两种承保基础的理赔边界。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <svg viewBox="0 0 540 230" role="img" aria-label="期内发生式与期内索赔式时间轴对比图">
            <rect x="46" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <rect x="190" y="42" width="160" height="106" class="mv-stage-band" stroke="var(--accent)" stroke-width="1.5"/>
            <rect x="350" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <g class="tick-label" text-anchor="middle">
              <text x="118" y="30">追溯期（2025）</text>
              <text x="270" y="30" fill="var(--accent)" font-weight="650">保单有效期（2026）</text>
              <text x="422" y="30">保单到期后（2027）</text>
              <text x="46" y="170">25.01</text><text x="190" y="170">26.01</text><text x="350" y="170">27.01</text><text x="494" y="170">27.12</text>
            </g>
            <line x1="38" y1="95" x2="504" y2="95" class="chart-axis" stroke-width="1.6"/>
            <line data-role="span" y1="95" y2="95" stroke="var(--accent)" stroke-width="4" opacity=".45"/>
            <circle r="7.5" class="mv-dot-1" data-role="occ-pt" cy="95"/>
            <text class="point-label" data-role="occ-lbl" y="74" text-anchor="middle">事故</text>
            <circle r="7.5" class="mv-dot-2" data-role="clm-pt" cy="95"/>
            <text class="point-label" data-role="clm-lbl" y="128" text-anchor="middle" style="fill:var(--mv-c2)">索赔</text>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">事故发生月份（1-12 追溯期，13-24 有效期）<output data-role="occ-out">2026.06</output></label>
          <input type="range" data-role="occ" min="2" max="34" step="1" value="18">
          <label class="range-label">提出索赔月份（须不早于事故）<output data-role="clm-out">2027.04</output></label>
          <input type="range" data-role="clm" min="2" max="36" step="1" value="28">
          <div class="ppf-outputs">
            <div><span>期内发生式</span><strong data-role="occ-res">承保</strong></div>
            <div><span>期内索赔式</span><strong data-role="clm-res">不赔</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
          <div class="button-row">
            <button type="button" class="button button-secondary" data-sc="18,28">期内发生+期后索赔</button>
            <button type="button" class="button button-secondary" data-sc="8,19">追溯期发生+期内索赔</button>
          </div>
        </div>
      </div>`;
    const x = m => 46 + ((m - 1) / 35) * 448;
    const mLabel = m => `${2025 + Math.floor((m - 1) / 12)}.${String(((m - 1) % 12) + 1).padStart(2, '0')}`;
    const occIn = root.querySelector('[data-role="occ"]');
    const clmIn = root.querySelector('[data-role="clm"]');

    function draw() {
      let o = occIn.valueAsNumber, c = clmIn.valueAsNumber;
      if (c < o) { c = o; clmIn.value = String(c); }
      const xo = x(o).toFixed(1), xc = x(c).toFixed(1);
      root.querySelector('[data-role="occ-pt"]').setAttribute('cx', xo);
      root.querySelector('[data-role="occ-lbl"]').setAttribute('x', xo);
      root.querySelector('[data-role="clm-pt"]').setAttribute('cx', xc);
      root.querySelector('[data-role="clm-lbl"]').setAttribute('x', xc);
      const span = root.querySelector('[data-role="span"]');
      span.setAttribute('x1', xo); span.setAttribute('x2', xc);
      root.querySelector('[data-role="occ-out"]').value = mLabel(o);
      root.querySelector('[data-role="clm-out"]').value = mLabel(c);
      const occCovered = o >= 13 && o <= 24;
      const clmCovered = o >= 1 && c >= 13 && c <= 24;
      root.querySelector('[data-role="occ-res"]').textContent = occCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="clm-res"]').textContent = clmCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="msg"]').textContent =
        `期内发生式只看「事故是否落在 2026 保单期内」（当前${occCovered ? '满足' : '不满足'}）；期内索赔式要求「事故在追溯日后且索赔落在 2026 保单期内」（当前${clmCovered ? '满足' : '不满足'}）。`;
    }
    occIn.addEventListener('input', draw);
    clmIn.addEventListener('input', draw);
    root.querySelectorAll('[data-sc]').forEach(b => b.addEventListener('click', () => {
      const [o, c] = b.dataset.sc.split(',');
      occIn.value = o; clmIn.value = c; draw();
    }));
    draw();
  }

  const registry = {
    'is-lm': mountISLM,
    'ad-as': mountADAS,
    phillips: mountPhillips,
    trilemma: mountTrilemma,
    bond: mountBond,
    multiplier: mountMultiplier,
    deductible: mountDeductible,
    'liability-timeline': mountLiabilityTimeline,
  };

  document.querySelectorAll('[data-micro-visual]').forEach(container => {
    const fn = registry[container.dataset.microVisual];
    if (fn) fn(container);
  });
})();
</script>
</body>
</html>
