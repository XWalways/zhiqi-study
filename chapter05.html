  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

/* Catalog */

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }

.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }

.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }

.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter05","number":5,"title":"生产理论","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-05-生产理论-离线学习.html"},"lessons":{"title":"生产理论","subtitle":"区分短期的边际产量与长期的规模报酬，理解厂商如何选择投入组合。","sections":[{"id":"production","title":"厂商目标、生产要素与生产函数","summary":"生产函数描述既定技术下，投入组合所能实现的最大产量。","bodyHtml":"\u003cp>基础模型常假设厂商追求\u003cstrong>利润最大化\u003c/strong>，利润等于总收益减去总经济成本。厂商在生产中组织四类常见要素，即劳动、资本、土地与企业家才能。\u003c/p>\u003cp>对给定技术，\u003cmark>生产函数\u003c/mark>把投入组合与该组合能够有效生产的最大产量联系起来。用劳动 \u003cvar>L\u003c/var> 和资本 \u003cvar>K\u003c/var> 表示时，可写为 \u003cvar>Q = f(L, K)\u003c/var>。技术改进可以改变相同投入对应的最大产量，因此会改变生产函数。\u003c/p>","keyTakeaway":"判断生产函数变化时，区分技术条件变化与同一技术下投入组合的变化。","pitfall":"生产函数说明技术上能生产多少。判断企业利润还需要知道投入品价格与销售收入。","example":"同一间烘焙店拥有两台烤箱，增加工人后沿既有生产函数改变产量。采用更快的烤制技术后，相同工人与烤箱可以生产更多，生产函数随之改变。"},{"id":"short-run-production","title":"短期生产与边际报酬递减","summary":"技术和部分投入固定，观察增加某一种投入带来的产量变化。","bodyHtml":"\u003cp>\u003cstrong>短期\u003c/strong>至少有一种生产要素投入无法调整。\u003cstrong>长期\u003c/strong>允许厂商调整所有要素投入。划分依据是能否调整全部要素，具体时长随行业而异。\u003c/p>\u003cp>在技术和其他要素投入固定时，连续增加某种可变投入，到一定阶段后，每单位新增投入所带来的额外产量会减少。这是\u003cmark>边际报酬递减规律\u003c/mark>。在常见的短期生产曲线中，分工改善可使边际产量先上升，固定设备逐渐饱和后边际产量下降。\u003c/p>","keyTakeaway":"先固定技术和其他投入，再比较可变要素每增加一单位带来的产量增量。","pitfall":"边际产量开始递减时，总产量仍可能增加。只要新增投入的边际产量大于零，就还有额外产出。","example":"厨房的烤箱数量固定。增加最初几名工人有助于分工，后来工人排队使用烤箱，额外一名工人带来的产出开始减少。"},{"id":"marginal-product","title":"总产量、平均产量和边际产量","summary":"总产量看累计产出，平均产量看每单位投入，边际产量看新增投入。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>指标\u003c/th>\u003cth>计算\u003c/th>\u003cth>总产量曲线上的含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>总产量 TP\u003c/td>\u003ctd>给定要素组合的总产出\u003c/td>\u003ctd>曲线上该投入量的纵坐标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平均产量 AP\u003c/td>\u003ctd>TP/L，L 大于零\u003c/td>\u003ctd>原点到对应点的连线斜率\u003c/td>\u003c/tr>\u003ctr>\u003ctd>边际产量 MP\u003c/td>\u003ctd>单位新增投入带来的 TP 变化，可微时为 dTP/dL\u003c/td>\u003ctd>对应点的切线斜率\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>在常见平滑模型中，\u003cmark>MP 大于 AP 时 AP 上升，MP 小于 AP 时 AP 下降\u003c/mark>。若 MP 从高于 AP 转为低于 AP，交点处 AP 达到最大。MP 为正时 TP 上升，MP 为负时 TP 下降。若 MP 从正变负，MP 等于零处 TP 达到峰值。\u003c/p>\u003cp>采用典型的先升后降的边际产量曲线时，峰值依次出现在 MP、AP、TP 上。\u003c/p>","keyTakeaway":"MP 的正负决定 TP 的变化方向。MP 与 AP 的大小关系决定 AP 的变化方向。","pitfall":"只有看到符号或大小关系越过相应临界点，才能确认峰值。只知道某点 MP 等于零或 MP 等于 AP，通常还需检查前后走势。","example":"工人从 4 名增加到 5 名，总产量从 48 件增加到 57 件。第 5 名工人的边际产量为 9 件，低于原平均 12 件，新平均产量降为 11.4 件。"},{"id":"production-stages","title":"短期生产的三个阶段","summary":"以平均产量和总产量的峰值划分典型生产区间。","bodyHtml":"\u003cp>在典型的单一可变投入模型中，\u003cstrong>第一阶段\u003c/strong>的平均产量持续上升，结束于 AP 达到最大、MP 等于 AP 的位置。\u003cstrong>第二阶段\u003c/strong>的 AP 与 MP 下降，MP 仍为正，TP 继续上升至 MP 等于零的峰值。\u003cstrong>第三阶段\u003c/strong>的 MP 为负，继续增加可变投入会减少 TP，常表现为固定要素相对不足。\u003c/p>\u003cp>在可变要素与产出价格为正、厂商选择正产量的典型模型中，第二阶段是通常的经济生产区间，具体投入还要比较新增收益与新增成本。\u003c/p>","keyTakeaway":"两个分界点依次是 MP 等于 AP 和 MP 等于零。","pitfall":"第一阶段内 MP 可能已开始下降，AP 仍可上升。第三阶段的新增投入会使总产量下降。","example":"若平均产量在第 6 个单位投入达到峰值、总产量在第 8 个单位达到峰值，则 6 到 8 是第二阶段。"},{"id":"isoquants","title":"等产量曲线与边际技术替代率","summary":"固定产量，比较劳动和资本可以如何替换。","bodyHtml":"\u003cp>\u003cstrong>等产量曲线\u003c/strong>连接能够生产同一产量的劳动与资本组合。令劳动 L 为横轴，资本 K 为纵轴。两种投入的边际产量均为正时，增加劳动并保持产量不变，需要减少资本，曲线通常向右下倾斜。提高两种要素的生产效率可使同一产量的曲线向原点靠近。\u003c/p>\u003cp>\u003cstrong>边际技术替代率\u003c/strong>是保持产量不变时，多用一单位劳动所能减少的资本量。生产函数可微且两种边际产量为正时，\u003cmark>MRTS = MP\u003csub>L\u003c/sub>/MP\u003csub>K\u003c/sub>\u003c/mark>，等于等产量曲线斜率的绝对值。若在曲线上随劳动增加、资本减少，MRTS 下降，等产量曲线凸向原点。\u003c/p>\u003cp>常见模型中，劳动越多时其边际产量越低，资本越少时其边际产量越高，这使二者的比值趋于下降。一般情形下，判断 MRTS 的变化还要考虑两种要素相互影响的方式。\u003c/p>","keyTakeaway":"用等产量曲线分析固定产量下的投入组合，替代率比较的是两种投入的边际产量。","pitfall":"给定同一条曲线改变投入组合时，产量保持固定。技术改进后，原有产量可能用更少的投入实现。","example":"在某投入组合处，劳动的边际产量为 8，资本的边际产量为 4。小幅增加 1 单位劳动，约能少用 2 单位资本而保持产量。"},{"id":"isocost","title":"等成本线","summary":"给定投入价格和成本预算，比较可购买的要素组合。","bodyHtml":"\u003cp>若工资为 \u003cvar>w\u003c/var>，资本使用价格为 \u003cvar>r\u003c/var>，总投入支出为 \u003cvar>C\u003c/var>，\u003cstrong>等成本线\u003c/strong>满足 \u003cmark>wL + rK = C\u003c/mark>。以劳动为横轴，资本为纵轴，横轴截距是 C/w，纵轴截距是 C/r，斜率是 −w/r。\u003c/p>\u003cp>投入品价格固定时，提高成本预算使线平行外移。只改变一种投入的价格会改变斜率，线围绕另一种投入的截距旋转。\u003c/p>","keyTakeaway":"等产量曲线来自技术，等成本线来自预算和要素价格。","pitfall":"把工资和资本价格放入斜率时，分子是横轴投入的价格。","example":"工资 20 元、资本使用价格 40 元、预算 400 元时，劳动和资本轴截距分别为 20 和 10。斜率为 −0.5。"},{"id":"producer-equilibrium","title":"生产者的投入选择","summary":"内点成本最小化时，两种要素每元支出的边际产量相同。","bodyHtml":"\u003cp>给定产量时，厂商在可行的等产量曲线上寻找最低可达的等成本线。给定成本预算时，厂商寻找可达到的最高等产量曲线。这是同一投入选择的两个方向。\u003c/p>\u003cp>在常见光滑凸等产量曲线和正投入量的内点上，等产量曲线和等成本线相切。\u003cmark>MP\u003csub>L\u003c/sub>/MP\u003csub>K\u003c/sub> = w/r\u003c/mark>，等价于 MP\u003csub>L\u003c/sub>/w = MP\u003csub>K\u003c/sub>/r。若某要素每元投入的边际产量更高，就有理由调整投入结构，直至达到切点或边界。\u003c/p>","keyTakeaway":"成本最小化的切点条件比较技术替代比例与要素价格比。","pitfall":"仅计算边际技术替代率还不够。题目若要求给定产量下的投入，还需用生产函数约束求解。","example":"劳动和资本每投入一元分别带来 0.8 和 0.6 单位新增产量。局部调整时，可将部分预算从资本转到劳动以增加产量。"},{"id":"returns-to-scale","title":"规模报酬","summary":"将全部生产要素同比例放大，比较产量的放大比例。","bodyHtml":"\u003cp>在技术不变时，将劳动和资本等\u003cstrong>全部要素\u003c/strong>乘以同一个 \u003cvar>t\u003c/var>，其中 \u003cvar>t\u003c/var> 大于 1。比较新产量 f(tL, tK) 与原产量的 \u003cvar>t\u003c/var> 倍。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>比较结果\u003c/th>\u003cth>规模报酬\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>新产量大于 t × 原产量\u003c/td>\u003ctd>规模报酬递增\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新产量等于 t × 原产量\u003c/td>\u003ctd>规模报酬不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新产量小于 t × 原产量\u003c/td>\u003ctd>规模报酬递减\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>对 Q = A L\u003csup>α\u003c/sup>K\u003csup>β\u003c/sup> 这类生产函数，要素乘以 \u003cvar>t\u003c/var> 后产量乘以 t\u003csup>α+β\u003c/sup>。指数和大于、等于或小于 1，分别对应三类规模报酬。规模报酬也可随考察的投入区间变化。\u003c/p>","keyTakeaway":"规模报酬看所有要素一起变。边际报酬看其他要素固定时单种投入变化。","pitfall":"规模报酬不变只约束全部投入同比例变化的结果。要比较仅增加劳动后的产量，需要生产函数或更多条件。","example":"若产量 Q 等于 L 与 K 乘积的平方根，劳动、资本均翻倍时产量翻倍。只让劳动翻倍，产量乘以 √2。"}],"mindmap":[{"label":"厂商与生产的基本概念","target":"production","children":[{"label":"厂商通常追求利润最大化","target":"production"},{"label":"生产要素","target":"production","children":[{"label":"劳动","target":"production"},{"label":"资本","target":"production"},{"label":"土地","target":"production"},{"label":"企业家才能","target":"production"}]},{"label":"生产函数","target":"production","children":[{"label":"短期至少有一种投入固定","target":"short-run-production"},{"label":"长期可调整全部投入","target":"isoquants"}]}]},{"label":"短期生产函数","target":"short-run-production","children":[{"label":"平均产量与边际产量","target":"marginal-product","children":[{"label":"MP 高于 AP 时 AP 上升","target":"marginal-product"},{"label":"MP 自上而下穿过 AP 时 AP 达到最大","target":"marginal-product"},{"label":"MP 低于 AP 时 AP 下降","target":"marginal-product"}]},{"label":"总产量与边际产量","target":"marginal-product","children":[{"label":"MP 大于零时 TP 上升","target":"marginal-product"},{"label":"MP 由正转负经过零时 TP 达到最大","target":"marginal-product"}]},{"label":"边际报酬递减规律","target":"short-run-production","children":[{"label":"其他要素与技术不变时，增加单种投入的产量增量最终减少","target":"short-run-production"}]},{"label":"生产的三个阶段","target":"production-stages","children":[{"label":"第一阶段结束于平均产量最大","target":"production-stages"},{"label":"第二阶段结束于总产量最大","target":"production-stages"},{"label":"第三阶段总产量减少，固定投入相对不足","target":"production-stages"}]}]},{"label":"长期生产函数","target":"isoquants","children":[{"label":"等产量曲线","target":"isoquants","children":[{"label":"生产技术改进可使同产量曲线向原点移动","target":"isoquants"}]},{"label":"边际技术替代率","target":"isoquants","children":[{"label":"保持产量不变，多用一种要素所能替代的另一要素的数量","target":"isoquants"},{"label":"常见情形中，替代率递减，等产量曲线凸向原点","target":"isoquants"}]},{"label":"规模报酬的种类","target":"returns-to-scale","children":[{"label":"递增时，产量增长比例超过投入增长比例","target":"returns-to-scale"},{"label":"不变时，产量增长比例等于投入增长比例","target":"returns-to-scale"},{"label":"递减时，产量增长比例小于投入增长比例","target":"returns-to-scale"}]},{"label":"投入选择","target":"producer-equilibrium","children":[{"label":"等成本线表示同一支出的投入组合","target":"isocost"},{"label":"内点成本最小时，技术替代率等于投入价格比","target":"producer-equilibrium"}]}]}]},"questions":[{"id":"eco-05-q01","number":1,"group":"厂商与生产的基本概念","type":"single","stem":"下列选项中，不属于生产要素的是（　）。","options":{"A":"土地","B":"产品","C":"资本","D":"劳动"},"answer":["B"],"explanationSupplement":"生产要素指生产过程中使用的投入资源。本题所说的产品是当前生产活动形成的产出。","optionExplanations":{"A":"土地及其自然资源可以用于生产。","B":"产品在本题中指生产活动的产出。","C":"机器、厂房等资本可作为生产投入。","D":"劳动是人员为生产提供的工作投入。"},"conceptId":"production"},{"id":"eco-05-q02","number":2,"group":"厂商与生产的基本概念","type":"single","stem":"在生产者行为的分析中，一般假设生产者或企业的目标是（　）。","options":{"A":"提高生产率","B":"实现战略目标","C":"实现企业使命","D":"追求利润最大化"},"answer":["D"],"explanationSupplement":"标准的厂商模型让企业在给定技术和市场约束下选择产量与投入，目标是让总收益减总成本达到最大。","optionExplanations":{"A":"提高生产率可以帮助降低成本，模型仍要比较收益和成本。","B":"战略目标可能包括许多具体指标，标准厂商模型采用利润目标。","C":"企业使命可用于企业管理分析。","D":"利润最大化是标准厂商模型设定的决策目标。"},"conceptId":"production"},{"id":"eco-05-q03","number":3,"group":"厂商与生产的基本概念","type":"single","stem":"在经济学中，短期是指（　）。","options":{"A":"一年或一年以内的时期","B":"所有投入要素均是固定不变的时间周期","C":"所有投入要素均是可以变动的时间周期","D":"生产者来不及调整其全部生产要素的投入数量，至少有一种生产要素的投入数量是固定不变的时间周期"},"answer":["D"],"explanationSupplement":"判断长短期时看能否改变全部投入。例如厂房短期内无法调整，但企业可改变工时和原料数量。","optionExplanations":{"A":"短期的日历长度随行业和技术条件而变。","B":"只要至少有一种投入固定，就符合短期条件。","C":"所有投入都可调整是长期条件。","D":"该项明确给出了至少一种投入固定的判据。"},"conceptId":"short-run-production"},{"id":"eco-05-q04","number":4,"group":"厂商与生产的基本概念","type":"single","stem":"生产函数是（　）之间的函数关系。","options":{"A":"最大产量与投入成本","B":"最大产量与投入要素","C":"平均产量与投入成本","D":"平均产量与投入要素"},"answer":["B"],"explanationSupplement":"在给定技术下，Q=f(L,K) 给出使用一定劳动 L 和资本 K 所能生产的最大产量 Q。成本的计算还需投入品价格。","optionExplanations":{"A":"投入成本属于用货币衡量的投入支出。","B":"生产函数将要素投入量与可实现的最大产量对应起来。","C":"平均产量通常用总产量除以投入量。","D":"生产函数直接给出总产量的上限。"},"conceptId":"production"},{"id":"eco-05-q05","number":5,"group":"厂商与生产的基本概念","type":"single","stem":"经济学中短期与长期的划分实质上取决于（　）。","options":{"A":"时间长短","B":"可否调整产量","C":"可否调整生产规模","D":"可否调整产品价格"},"answer":["C"],"explanationSupplement":"厂房、设备等投入可随需要调整时，企业可以改变生产规模。短期内部分投入固定，企业仍可通过改变可变投入来调整产量。","optionExplanations":{"A":"不同产业调整固定投入所需时间不同。","B":"短期也可通过可变投入改变产量。","C":"可调整生产规模对应全部投入可以调整的长期情形。","D":"产品价格是市场条件，划分长短期关注投入调整。"},"conceptId":"short-run-production"},{"id":"eco-05-q06","number":6,"group":"厂商与生产的基本概念","type":"single","stem":"以下关于生产函数特点的表述，错误的是（　）。","options":{"A":"生产函数反映的是某一特定要素投入组合在现有技术条件下能且只能产生的最大产出","B":"生产函数反映的是在既定的生产技术条件下投入和产出之间的数量关系","C":"如果技术条件改变，必然会产生新的生产函数","D":"生产函数会使生产自动达到帕累托最优"},"answer":["D"],"explanationSupplement":"生产函数给出技术上可实现的产出上限。帕累托最优涉及整个配置中能否在无人受损时改善某人的处境，需要额外条件。","optionExplanations":{"A":"函数值代表给定投入的最大可达产出，厂商实际可以低于这一上限。","B":"给定技术条件下的投入产出数量关系符合定义。","C":"技术变动若改变可达产出，投入产出函数相应改变。","D":"技术约束本身无法推出整个经济配置的效率，因此本项错误。"},"conceptId":"production"},{"id":"eco-05-q07","number":7,"group":"厂商与生产的基本概念","type":"single","stem":"在生产者行为分析中，生产者或企业追求利润最大化目标这一基本假设，是（　）在生产和企业理论中的具体化。","options":{"A":"经济人假设","B":"社会主义生产目的理论","C":"生产者均衡理论","D":"股东利益最大化"},"answer":["A"],"explanationSupplement":"经济人假设用于概括经济主体在约束下优化目标。应用于厂商时，通常将其目标设定为利润最大化。","optionExplanations":{"A":"这是厂商利润最大化假设背后更一般的假设。","B":"该项讨论特定制度下的生产目的。","C":"生产者均衡是依据目标和约束分析得到的结果。","D":"股东利益最大化属于公司治理层面的目标设定。"},"conceptId":"production"},{"id":"eco-05-q08","number":8,"group":"短期生产函数","type":"single","stem":"在其他条件不变的情况下，如果连续增加劳动的投入，在总产量达到最大值时，劳动的边际产量（　）。","options":{"A":"大于零","B":"小于零","C":"等于零","D":"等于平均产量"},"answer":["C"],"explanationSupplement":"劳动的边际产量是总产量曲线对劳动投入量的斜率。在光滑内点最大值处斜率为零。","optionExplanations":{"A":"边际产量为正时，总产量随劳动增加而上升。","B":"边际产量为负时，总产量随劳动增加而下降。","C":"总产量的可微内点最大值对应零斜率。","D":"边际产量等于平均产量通常标志平均产量达到峰值。"},"conceptId":"marginal-product"},{"id":"eco-05-q09","number":9,"group":"短期生产函数","type":"single","stem":"假设只有一种生产要素投入可变，其他生产要素投入不可变，关于边际产量和平均产量关系的说法，正确的是（　）。","options":{"A":"只要边际产量大于平均产量，平均产量就是递增的","B":"只要边际产量等于平均产量，平均产量就是递增的","C":"只要边际产量小于平均产量，平均产量就是递增的","D":"只要边际产量大于平均产量，平均产量就是递减的"},"answer":["A"],"explanationSupplement":"劳动投入 L＞0 时，AP=Q/L，导数 dAP/dL=(MP−AP)/L。新增投入的产出高于此前平均值，就会拉高平均值。","optionExplanations":{"A":"MP＞AP 时，平均产量的导数为正。","B":"MP=AP 时，平均产量的导数为零。","C":"MP＜AP 时，新增单位的产出会拉低平均值。","D":"MP＞AP 会拉高平均值。"},"conceptId":"marginal-product"},{"id":"eco-05-q10","number":10,"group":"短期生产函数","type":"discussion","stem":"边际产量递减规律的基本含义是（　）。","options":{"A":"在技术水平和其他投入不变的条件下，连续追加一种生产要素的投入量，总是存在着一个临界点，在这一点之前，边际产量递增，超过这一点之后，边际产量将出现递减的趋势，直到出现负值","B":"在技术水平和其他投入变动的条件下，连续追加一种生产要素的投入量，总是存在着一个临界点，在这一点之后，边际产量递增，这一点之前，边际产量将出现递减的趋势，直到出现负值","C":"在技术水平不变、其他投入变动的条件下，连续追加一种生产要素的投入量，边际产量总是递减的","D":"在技术水平和其他投入不变的条件下，连续追加一种生产要素的投入量，边际产量总是递减的"},"answer":[],"explanationSupplement":"边际产量递减的核心是技术与其他投入给定时，持续追加一种可变投入，超过某一范围后，每增加一单位所带来的产量增量会减少。典型的短期三阶段图常画出先升后降及负值区间，而一般规律允许边际产量从一开始就递减，也允许它在递减时始终为正。","optionExplanations":{"A":"符合典型三阶段图，前期必然递增和最终必然出现负值超出了普遍定义。","B":"这里改变了技术或其他投入，无法隔离可变投入的影响。","C":"其他投入的变化可能改变边际产量曲线。","D":"边际产量递减可以在一定投入水平之后出现，普遍命题不要求全程递减。"},"conceptId":"marginal-product"},{"id":"eco-05-q11","number":11,"group":"短期生产函数","type":"single","stem":"如果连续地增加某种生产要素，在总产量达到最大时，边际产量曲线（　）。","options":{"A":"与纵轴相交","B":"经过原点","C":"与平均产量曲线相交","D":"与横轴相交"},"answer":["D"],"explanationSupplement":"横轴表示投入量，纵轴表示边际产量。典型总产量曲线从上升转为下降时，边际产量从正变为负，经过零点并与横轴相交。","optionExplanations":{"A":"与纵轴相交对应投入量为零。","B":"过原点要求投入量和边际产量都为零。","C":"边际产量曲线与平均产量曲线的典型交点对应平均产量峰值。","D":"边际产量为零对应横轴上的点。"},"conceptId":"marginal-product"},{"id":"eco-05-q12","number":12,"group":"短期生产函数","type":"single","stem":"下列说法中错误的是（　）。","options":{"A":"只要总产量减少，边际产量一定是负数","B":"只要边际产量减少，总产量一定也减少","C":"随着某种生产要素投入量的增加，边际产量和平均产量增加到一定程度将趋于下降，其中边际产量的下降一定先于平均产量","D":"边际产量曲线一定在平均产量曲线的最高点与之相交"},"answer":["B"],"explanationSupplement":"在典型短期生产曲线中，MP 的符号决定 TP 的增减。比如 MP 从 8 降到 5，新增一单位仍增加 5 单位总产量。","optionExplanations":{"A":"以新增投入导致的产量变化衡量，负的产量增量意味着负边际产量。","B":"MP 下降但仍为正时，TP 还在增加，因此本项错误。","C":"典型三阶段曲线中，MP 先到峰值，随后在 AP 峰值处降至与 AP 相等。","D":"可微平均产量曲线在正投入量的内点峰值上满足 MP=AP。"},"conceptId":"marginal-product"},{"id":"eco-05-q13","number":13,"group":"短期生产函数","type":"single","stem":"当生产函数 Q=f(L,K) 的 AP_L 为正且递减时，MP_L 可以是（　）。","options":{"A":"递减且为正","B":"递减且为负","C":"为 0","D":"上述任何一种情况"},"answer":["D"],"explanationSupplement":"AP_L 递减仅要求 MP_L＜AP_L。由于 AP_L 是正值，比它小的边际产量既可以为正，也可以等于零或为负。","optionExplanations":{"A":"只要正的 MP_L 低于 AP_L，AP_L 便会递减。","B":"负的 MP_L 低于正的 AP_L，AP_L 会递减。","C":"MP_L 为零时也小于正的 AP_L。","D":"三个情形都与 MP_L＜AP_L 相容。"},"conceptId":"marginal-product"},{"id":"eco-05-q14","number":14,"group":"短期生产函数","type":"single","stem":"在短期生产的第一阶段，产量曲线的特征是（　）。","options":{"A":"总产出上升，平均产出上升，边际产出上升","B":"总产出上升，平均产出上升，边际产出先上升后下降","C":"总产出上升，平均产出先上升后下降，边际产出先上升后下降","D":"总产出上升，平均产出先上升后下降，边际产出上升"},"answer":["B"],"explanationSupplement":"在通常的短期三阶段图中，第一阶段一直持续到 AP 最大处。其间 MP 先升后降，但仍高于 AP，故 AP 与 TP 继续上升。","optionExplanations":{"A":"边际产量在平均产量峰值之前已开始回落。","B":"总产量与平均产量上升，边际产量先升后降，符合典型第一阶段。","C":"平均产量开始下降是在第一阶段结束后。","D":"该项把平均产量与边际产量的典型走势混淆。"},"conceptId":"production-stages"},{"id":"eco-05-q15","number":15,"group":"短期生产函数","type":"single","stem":"在其他投入保持不变的条件下，由于新增一单位的投入而多生产出来的产量或产出称为（　）。","options":{"A":"总产量","B":"平均产量","C":"边际产量","D":"固定产量"},"answer":["C"],"explanationSupplement":"固定资本等其他投入，再多用一单位劳动。比较前后总产量，新增部分就是劳动的边际产量。","optionExplanations":{"A":"总产量是现有投入产生的全部产出。","B":"平均产量等于总产量除以可变投入量。","C":"新增一单位投入带来的额外产量就是边际产量。","D":"投入有固定要素的区分，该题考察产量增量的定义。"},"conceptId":"marginal-product"},{"id":"eco-05-q16","number":16,"group":"短期生产函数","type":"single","stem":"在总产量、平均产量和边际产量的变化过程中，下列哪一个变化首先发生？（　）","options":{"A":"边际产量下降","B":"平均产量下降","C":"总产量下降","D":"B 和 C"},"answer":["A"],"explanationSupplement":"在典型短期曲线中，MP 开始下降时仍大于 AP 且大于零。AP 在 MP 降至等于 AP 后开始下降，TP 在 MP 进一步降为负后开始下降。","optionExplanations":{"A":"边际产量的峰值最早出现。","B":"平均产量在 MP 下降并穿过 AP 时才达到峰值。","C":"总产量要等到 MP 降为负值才开始下降。","D":"平均产量和总产量下降都在边际产量开始下降之后。"},"conceptId":"production-stages"},{"id":"eco-05-q17","number":17,"group":"短期生产函数","type":"single","stem":"根据可变要素的总产量曲线、平均产量曲线和边际产量曲线之间的关系，可将生产划分为三个阶段，任何理性的生产者都会将生产选择在（　）。","options":{"A":"第Ⅰ阶段","B":"第Ⅱ阶段","C":"第Ⅲ阶段","D":"第Ⅳ阶段"},"answer":["B"],"explanationSupplement":"典型短期图中，选择正产量的理性厂商在第二阶段寻找生产点。此时平均产量已开始下降，边际产量仍为正。具体投入还需比较边际产值和投入价格。","optionExplanations":{"A":"通常视为相对于固定要素使用的劳动过少，AP 仍可提高。","B":"可变要素继续增加仍可增加总产量，属于合理生产区间。","C":"边际产量为负，减少投入可以提高产量。","D":"这套划分只有三个阶段。"},"conceptId":"production-stages"},{"id":"eco-05-q18","number":18,"group":"短期生产函数","type":"single","stem":"当（　），平均产量曲线与边际产量曲线相交。","options":{"A":"边际产量为 0","B":"总产量最小","C":"平均产量最大","D":"总产量最大"},"answer":["C"],"explanationSupplement":"在标准短期图中，MP 从 AP 上方穿到 AP 下方时，AP 从递增转为递减，于是交点对应 AP 最大。代数上 dAP/dL=(MP−AP)/L。","optionExplanations":{"A":"MP=0 通常对应 TP 最大。","B":"总产量最小并不能决定 MP 与 AP 是否相等。","C":"在平均产量的可微内点峰值，MP=AP。","D":"TP 最大时 MP=0，而 AP 通常仍为正。"},"conceptId":"marginal-product"},{"id":"eco-05-q19","number":19,"group":"长期生产函数","type":"discussion","stem":"如果规模报酬不变，增加 20% 的劳动量，但保持资本数量不变，则总产量将（　）。","options":{"A":"增加 20%","B":"减少 20%","C":"增加小于 20%","D":"增加大于 20%"},"answer":[],"explanationSupplement":"规模报酬不变说明 f(1.2L,1.2K)=1.2f(L,K)。题目问的是 f(1.2L,K)，还需要技术条件。若产量随两种投入都严格增加，结果是增幅介于 0 与 20% 之间。固定比例技术 Q=min(L,K) 下，劳动仍是瓶颈时可以恰好增加 20%，资本是瓶颈时产量保持不变。","optionExplanations":{"A":"劳动持续为固定比例技术的约束投入时，这种结果可能出现。","B":"在投入可自由处置的通常生产技术中，增加劳动不会降低最大可达产量。","C":"若劳动和资本各自的边际产量都严格为正，此项成立。","D":"在产量随资本非减的技术中，只增劳动的产量不超过两种要素同时增加时的产量。"},"conceptId":"returns-to-scale"},{"id":"eco-05-q20","number":20,"group":"长期生产函数","type":"single","stem":"边际收益递减和规模报酬递减两者之间（　）。","options":{"A":"互为因果关系","B":"前因后果关系","C":"前果后因关系","D":"前提条件不同，不能互为因果关系"},"answer":["D"],"explanationSupplement":"边际报酬递减保持其他要素固定，考察新增一单位的产量。规模报酬递减将所有要素按同一比例放大，比较总产量增幅。比如 Q=√(LK) 的单项边际产量会递减，规模报酬仍不变。","optionExplanations":{"A":"两个命题对应不同的变化实验，无法互为因果。","B":"固定资本时劳动边际报酬递减，整体规模报酬仍可能不变。","C":"整体放大时产量增长比例偏小，不能直接推出每种投入的边际变化。","D":"两种结论的前提不同，无必然因果联系。"},"conceptId":"returns-to-scale"},{"id":"eco-05-q21","number":21,"group":"长期生产函数","type":"single","stem":"根据生产规模和产量的变化比例的比较，可以将规模报酬分为不同类别。如果产量增加的比例大于各种生产要素增加的比例，则属于（　）。","options":{"A":"规模报酬不变","B":"规模报酬递增","C":"规模报酬递减","D":"以上选项都正确"},"answer":["B"],"explanationSupplement":"先确认所有投入按相同比例扩大，再将产出增幅与这个共同增幅比较。产出增加得更快即为规模报酬递增。","optionExplanations":{"A":"规模报酬不变要求两个比例相等。","B":"产量增幅超过共同的投入增幅，符合定义。","C":"规模报酬递减要求产量增幅较小。","D":"三种类型在同一次比较中分别对应大于、等于和小于。"},"conceptId":"returns-to-scale"},{"id":"eco-05-q22","number":22,"group":"长期生产函数","type":"single","stem":"规模报酬递增，就是（　）。","options":{"A":"产量增加的比例等于各生产要素增加的比例","B":"产量增加的比例大于各生产要素增加的比例","C":"产量增加的比例小于各生产要素增加的比例","D":"产量增加的比例小于或等于各生产要素增加的比例"},"answer":["B"],"explanationSupplement":"例如劳动和资本都增加 10%，同一技术下可达的最大产量增加 15%，此时产量增幅超过投入增幅。","optionExplanations":{"A":"增幅相等是规模报酬不变。","B":"产量的比例增幅严格高于共同的投入增幅，符合定义。","C":"产量增幅较小是规模报酬递减。","D":"小于或等于涵盖递减与不变。"},"conceptId":"returns-to-scale"},{"id":"eco-05-q23","number":23,"group":"长期生产函数","type":"single","stem":"关于规模报酬，说法错误的是（　）。","options":{"A":"产量增加的比例等于各种生产要素增加的比例，这是规模报酬不变","B":"产量增加的比例大于各种生产要素增加的比例，这是规模报酬递增","C":"产量增加的比例小于各种生产要素增加的比例，这是规模报酬递减","D":"企业规模较小时规模报酬递减，当企业规模达到临界值以后，企业继续扩大规模会出现规模报酬递增"},"answer":["D"],"explanationSupplement":"判断前三项时用共同的投入增幅与产量增幅比较。不同产量区间的规模报酬取决于技术条件，企业规模本身无法决定从递减转为递增。","optionExplanations":{"A":"相等对应规模报酬不变。","B":"产量增长相对较快对应规模报酬递增。","C":"产量增长相对较慢对应规模报酬递减。","D":"该项把一种规模报酬变化顺序当作普遍结论，因此错误。"},"conceptId":"returns-to-scale"},{"id":"eco-05-q24","number":24,"group":"长期生产函数","type":"single","stem":"规模报酬递减是在下述（　）情况下发生的。","options":{"A":"按比例连续增加各种生产要素","B":"不按比例连续增加各种生产要素","C":"连续地投入某种生产要素而保持其他生产要素不变","D":"上述都正确"},"answer":["A"],"explanationSupplement":"规模报酬的比较实验要求把所有要素同时乘以同一个大于 1 的系数。如果产量增加的比例小于这一投入增幅，就属于规模报酬递减。","optionExplanations":{"A":"同比例增加各种要素提供了判断规模报酬的必要条件。","B":"投入比例改变会同时改变生产规模和投入组合。","C":"仅增加一种投入用来分析其边际产量。","D":"其余两种情形没有满足所有要素同比例增加的条件。"},"conceptId":"returns-to-scale"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;

 const observer = new IntersectionObserver(entries => {
  if (view !== 'learn' || $('#chapter-view').hidden) return;
  const visible=entries.filter(entry=>entry.isIntersecting).map(entry=>entry.target.id);
  if(!visible.some(id=>!state.reading.seen.includes(id)))return;
  store.update(record=>{
   record.reading.seen=[...new Set([...record.reading.seen,...visible])];
   if(!record.reading.lastConcept)record.reading.lastConcept=visible[0];
  });
 }, { threshold: 0.12, rootMargin: '-125px 0px -15% 0px' });

 function saveReadingPosition() {

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 function records() {
  const wrap=el('div');

     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));

     }));
    status.replaceChildren(confirm);
   } catch(e) {

   }

  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
