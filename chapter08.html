  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

/* Topic map and the interactive production chart */

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter08","number":8,"title":"博弈论初步","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-08-博弈论初步-离线学习.html"},"lessons":{"title":"博弈论初步","subtitle":"从支付表找最优反应，判断策略组合是否稳定。","sections":[{"id":"game-elements","title":"博弈的基本要素","summary":"参与人、策略与支付描述互相影响的选择。","bodyHtml":"\u003cp>\u003cstrong>博弈\u003c/strong>分析一个人的结果如何同时取决于自己的选择与别人的选择。策略式表示包含\u003cmark>参与人、各参与人的策略集合、各策略组合下的支付\u003c/mark>。支付可以是利润、效用或以负数表示的损失。\u003c/p>\u003cp>纯策略是在给定信息下确定的行动计划。若按某种概率选择不同纯策略，就是混合策略。支付表通常用有序数对记「行方，列方」，比较行方选择时只看数对的第一项。\u003c/p>","keyTakeaway":"均衡是根据策略和支付推导的结果。","pitfall":"支付的单位和方向要先确认。若用负刑期表示，−1 大于 −3。","example":"两家企业各可选高价或低价，支付表的每格记录该价格组合下两家的利润。"},{"id":"nash","title":"占优策略与纳什均衡","summary":"逐一核对参与人是否能靠单方面改变策略提高支付。","bodyHtml":"\u003cp>给定对手选择，能带来最高支付的策略称为\u003cstrong>最优反应\u003c/strong>。如果不论对手如何选择，某策略总是最佳，它就是占优策略；总是严格更好时称为严格占优。\u003c/p>\u003cp>\u003cstrong>纳什均衡\u003c/strong>要求每个人的策略都是对其他人策略的最优反应。固定其他人的选择，任何参与人都无法通过单方面改策略而提高自己的支付。各自选择占优策略形成的组合一定是纳什均衡。纳什均衡也可以在没有占优策略时出现。\u003c/p>","keyTakeaway":"找纯策略纳什均衡时，分别标出各人的最优反应，寻找它们重合的格子。","pitfall":"均衡只限制单边偏离。参与人可以选不同策略，支付也可以不同。","example":"两家商店都希望选在对方也开业的时段。双方都选上午或都选下午可能各是一个纳什均衡。"},{"id":"prisoners-dilemma","title":"囚徒困境","summary":"个体的占优策略组合可能使双方比共同合作时更差。","bodyHtml":"\u003cp>下面给出标准单次博弈。括号里先写甲的支付，再写乙的支付，数值越大越好。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>甲／乙\u003c/th>\u003cth>乙合作\u003c/th>\u003cth>乙背离\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth>甲合作\u003c/th>\u003ctd>3，3\u003c/td>\u003ctd>0，5\u003c/td>\u003c/tr>\u003ctr>\u003cth>甲背离\u003c/th>\u003ctd>5，0\u003c/td>\u003ctd>1，1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>乙合作时，甲背离得 5 而合作得 3；乙背离时，甲背离得 1 而合作得 0。乙的比较对称。因此背离是双方的严格占优策略，均衡支付为（1，1）。双方合作的（3，3）对双方都更好，却无法阻止单方面背离。\u003c/p>","keyTakeaway":"比较单方面偏离能否获益，再比较两个结果对双方的支付。","pitfall":"重复博弈、约束或可执行承诺改变了问题的条件。单次博弈结论不能直接套用。","example":"两家企业都希望减少成本较高的促销，但如果只有一家取消促销，它可能失去许多顾客。"}],"mindmap":[{"label":"博弈论的基本概念","target":"game-elements","children":[{"label":"基本要素","target":"game-elements","children":[{"label":"参与人","target":"game-elements"},{"label":"参与人的策略","target":"game-elements"},{"label":"各策略组合的支付","target":"game-elements"}]}]},{"label":"纯策略均衡","target":"nash","children":[{"label":"均衡与最优反应","target":"nash","children":[{"label":"固定他人策略，比较自己的支付","target":"nash"},{"label":"无人因单边偏离获益","target":"nash"}]},{"label":"占优策略均衡","target":"nash","children":[{"label":"最优策略不取决于对手选择","target":"nash"},{"label":"占优策略均衡是纳什均衡","target":"nash"}]},{"label":"纳什均衡","target":"nash","children":[{"label":"不必每个人都有占优策略","target":"nash"}]},{"label":"囚徒困境","target":"prisoners-dilemma","children":[{"label":"背离是双方的占优策略","target":"prisoners-dilemma"},{"label":"共同合作对双方都更好","target":"prisoners-dilemma"}]}]}]},"questions":[{"id":"eco-08-q01","number":1,"group":"博弈论的基本概念","type":"multiple","stem":"（多选题）博弈的基本要素包括（　　）。","options":{"A":"参与人","B":"均衡","C":"参与人的策略","D":"参与人的支付"},"answer":["A","C","D"],"explanationSupplement":"一个策略式博弈需要给出谁参与、每人可以选择哪些策略，以及各策略组合给每个人带来什么支付。均衡是在给出这些条件后推导的结果。","optionExplanations":{"A":"参与人是作决策的主体。","B":"均衡是用基本要素分析出的策略组合。","C":"每人的策略集合给出可选计划。","D":"支付表达每人在各结果下的收益或效用。"},"conceptId":"game-elements"},{"id":"eco-08-q02","number":2,"group":"纯策略均衡","type":"single","stem":"囚徒困境中，两个人的博弈说明（　　）。","options":{"A":"合作的结果对两个人来说可能比纳什均衡还坏","B":"即使合作的结果对一个人来说比纳什均衡好，对另一个人来说可能会更坏","C":"即使合作比纳什均衡好，每个囚徒也会有不合作的激励","D":"理性、利己的人会自然而然地回避纳什均衡，因为这对他们都不好"},"answer":["C"],"explanationSupplement":"在标准的单次囚徒困境中，无论另一方是否合作，自己背离都能得到更高支付。双方按各自最优反应都背离，却比双方合作时得到的支付更低。","optionExplanations":{"A":"标准囚徒困境的共同合作对双方都更好。","B":"共同合作相对于共同背离改善双方支付。","C":"个体有单方面背离的激励，即使合作对双方更好。","D":"个体理性恰可导向共同背离的纳什均衡。"},"conceptId":"prisoners-dilemma"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","num    expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {

     }));

  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);syncInlineQuizzes();favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');if(!range||!radios.length)return;function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
