  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter18","number":1,"title":"货币与货币制度","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-01-货币与货币制度-离线学习.html"},"lessons":{"title":"货币与货币制度","subtitle":"先辨认货币的职能与层次，再比较不同本位制度和国际安排。","sections":[{"id":"money-theories","title":"货币的本质与价值形式","summary":"区分货币的经济职能、历史形态与法定地位。","bodyHtml":"\u003cp>\u003cstrong>货币\u003c/strong>承担一般接受的计价和交换职能。货币金属说强调内在商品价值；货币名目说强调计价符号与单位；国家货币说关注法定认可和制度；劳动价值论把商品货币理解为固定充当\u003cmark>一般等价物\u003c/mark>的特殊商品。\u003c/p>\u003cp>在劳动价值论的叙述中，价值形式从简单或偶然的交换，发展为扩大的价值形式，再到集中表达为某种一般等价物，最后该等价物稳定为货币。实物货币、金属货币、可兑现的代用货币和不兑现的信用货币代表不同历史形态。\u003c/p>","keyTakeaway":"先辨认理论框架，再区分货币职能和货币形态。","pitfall":"商品货币的价值解释不能不加限定地套到现代不兑现货币。","example":"在物物交换中，一把斧头可能分别和羊、粮食或布交换。统一以货币标价后，各物品的价值可用相同单位比较。"},{"id":"money-functions","title":"货币的五种职能","summary":"按标价、即时交换、偿债、贮藏和跨国使用判断。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>职能\u003c/th>\u003cth>判断线索\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>价值尺度\u003c/td>\u003ctd>用单位标示价格，无须实际转移货币\u003c/td>\u003c/tr>\u003ctr>\u003ctd>流通手段\u003c/td>\u003ctd>钱货即时交换，货币作为交换媒介\u003c/td>\u003c/tr>\u003ctr>\u003ctd>支付手段\u003c/td>\u003ctd>延期付款、清偿债务、发放工资等资金给付\u003c/td>\u003c/tr>\u003ctr>\u003ctd>贮藏手段\u003c/td>\u003ctd>持有货币或货币性资产以保存未来购买力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>世界货币\u003c/td>\u003ctd>在国际交易、清偿和财富转移中使用\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>在传统五职能框架中，价值尺度和流通手段为基本职能。信用关系可使交货和付款分离，进而产生可转让的信用凭证。现代支票、汇票等还应区分是转移资金的工具还是实际存款余额。\u003c/p>","keyTakeaway":"先看钱有没有移动，再看是否即时对应交货，最后确认分析的是哪个交易环节。","pitfall":"同一场景可以有多个分析角度。国际偿债的具体动作是支付，跨境使用又可对应世界货币。","example":"商品先发货并记为赊销，月末结清欠款时发挥支付职能；在柜台现取现付时发挥流通职能。"},{"id":"liquidity","title":"流动性与货币层次","summary":"比较变现所需时间、成本和价格折损。","bodyHtml":"\u003cp>流动性表示金融资产可多快、多方便地转化为购买力，并尽量少损失价值。活期存款通常可随时使用，定期存款或证券的流动性取决于提前支取安排、交易深度和折价。\u003c/p>\u003cp>货币层次按流动性从窄到宽组织。现金和可以直接支付的余额更接近狭义货币。较宽层次还纳入部分需要转换后才能使用的资金。\u003c/p>","keyTakeaway":"快速卖出只是流动性的一部分，还要看价值能否保全。","pitfall":"能在市场卖出与能直接支付不是一回事。有价证券也不能仅按是否可转让判定层次。","example":"某债券可立即以大幅折价卖出。它虽然能成交，但大幅折价说明流动性不足。"},{"id":"aggregates","title":"我国 M0、M1、M2 与社融","summary":"按统计期区分旧 M1 与新 M1，并独立理解社会融资规模。","bodyHtml":"\u003cp>\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>\u003cmark>M0\u003c/mark> 是流通中货币，银行库存现金不计作公众流通。自统计 2025 年 1 月起，\u003cmark>M1\u003c/mark> 包括 M0、单位活期存款、个人活期存款及非银行支付机构客户备付金。旧口径通常以 M0 加单位活期存款来说明。\u003ca href=\"https://www.pbc.gov.cn/chubanwu/fileDir/resource/cms/2025/06/2025062416082199683.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行〔2024〕第17号公告\u003c/a> · \u003ca href=\"https://jrj.sh.gov.cn/SCGK194/20261015/24a15f78c09947de9eb58a48c2fdb451.html\" target=\"_blank\" rel=\"noopener noreferrer\">2026年前三季度金融统计数据报告\u003c/a>\u003c/p>\u003cp>\u003cmark>M2\u003c/mark> 是广义货币，包含 M1 及统计口径纳入的其他存款和部分金融工具。常用的「准货币＝M2−M1」随 M1 的划分而变。不能把全部储蓄、所有信托产品或银行承兑汇票一概列进这一差额。题型中有时用 M3 表示更广范围，我国公开常规货币统计使用 M0、M1、M2。\u003c/p>\u003cp>\u003cstrong>社会融资规模\u003c/strong>衡量实体经济从金融体系获得的资金，按一定期间的增量或期末存量统计。它可以包括贷款、债券融资、境内股票融资等，作为独立指标公布。\u003ca href=\"https://www.pbc.gov.cn/diaochatongjisi/attachDir/2025/12/2025121517152654772.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行社会融资规模存量统计表\u003c/a>\u003c/p>","keyTakeaway":"看题目年份和账户类型。社会融资规模与货币供应量分别统计。","pitfall":"App 是支付渠道。仅知道用手机付款，无法判断付款和收款在哪个统计层次，也无法推出现金增加。","example":"旧口径中个人活期向单位活期转账可能使 M1 增加。新口径下这两项本已计入 M1，若只在两账户间转账，M1 总量不变。"},{"id":"fiat-money","title":"信用货币、人民币与电子支付","summary":"区分发行基础、数字形态与支付工具。","bodyHtml":"\u003cp>可兑现的代用货币可按规则兑换金属货币。不兑现信用货币的流通依靠发行信用、制度安排与社会接受；持有者没有按固定含金量向发行方兑换黄金的权利。现代存款货币常通过账户划转支付，App 或银行卡是发起支付的工具。\u003c/p>\u003cp>\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong>人民币是我国的法定货币，由中国人民银行依法发行，单位为元，辅币单位为角、分。《人民币现金收付及服务规定》自 2026 年 2 月 1 日施行，对现金收付及服务提出要求。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_b133589d1e1c4d3ea6ac7929c23839f3.html\" target=\"_blank\" rel=\"noopener noreferrer\">人民币管理条例\u003c/a> · \u003ca href=\"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=105387\" target=\"_blank\" rel=\"noopener noreferrer\">人民币现金收付及服务规定\u003c/a>\u003c/p>\u003cp>数字人民币与第三方账户余额、虚拟货币属于不同概念。数字人民币的产品与计量规则可调整。例如，工商银行公告规定自 2026 年 1 月起按挂牌活期存款利率为本行实名钱包余额计息。现行部门通知明确，所指虚拟货币没有与法定货币等同的法律地位。\u003ca href=\"https://m.icbc.com.cn/page/1179734355649470466.html\" target=\"_blank\" rel=\"noopener noreferrer\">工商银行数字人民币计息公告\u003c/a> · \u003ca href=\"https://www.csrc.gov.cn/csrc/c100028/c7614318/content.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">银发〔2026〕42号通知\u003c/a>\u003c/p>","keyTakeaway":"辨认谁发行、余额记在哪个主体、通过什么方式支付。","pitfall":"「不兑现」说的是没有固定兑金承诺，不影响货币按面额结算。电子化也不改变工具和基础余额的区别。","example":"用支付软件发出转账指令时，资金可能来自银行存款；软件只是支付通道。"},{"id":"metal-systems","title":"货币制度及金属本位","summary":"从发行、铸造、兑换和法偿安排区分制度。","bodyHtml":"\u003cp>货币制度通常规定货币名称与单位、材料或基础、主辅币、法偿、发行兑换及准备安排。历史上的典型演变可概括为银本位、金银复本位、金本位、不兑现的信用本位。各国路径并非完全相同。\u003c/p>\u003cul>\u003cli>\u003cstrong>金币本位\u003c/strong>：金币可流通，典型制度允许自由铸造、按规则兑金和黄金跨境流动。\u003c/li>\u003cli>\u003cstrong>金块本位\u003c/strong>：金币通常不流通，纸币达到一定额度后可直接换成金块。\u003c/li>\u003cli>\u003cstrong>金汇兑本位\u003c/strong>：本币换为与黄金挂钩的外汇，再间接兑现黄金。\u003c/li>\u003c/ul>\u003cp>足值金属币可被贮藏或熔化，符合制度条件时金属也可再铸币，因而具有调节流通量的缓冲作用。历史上的相对汇率稳定不意味着物价始终稳定。\u003c/p>","keyTakeaway":"金币、金块、金汇兑分别对应金币流通、直接兑金块、通过外汇间接兑金。","pitfall":"无限法偿说的是可用于清偿的金额范围，自由铸造说的是金属转换为铸币的权利。","example":"本国银行券只能先兑某种外币，该外币可按固定比价兑金。这接近金汇兑本位。"},{"id":"bimetallism","title":"金银复本位与格雷欣法则","summary":"固定法定比价与市场比价的偏离影响哪种币被使用。","bodyHtml":"\u003cp>金银复本位使用两种本位金属。\u003cstrong>平行本位\u003c/strong>按市场比价兑换；\u003cstrong>双本位\u003c/strong>为两种币规定固定法定比价；\u003cstrong>跛行本位\u003c/strong>通常只允许一种金属自由铸造，限制另一种。\u003c/p>\u003cp>双本位下，若两种币可以按法定比价清偿，而金属市场比价偏离它，持有人会倾向于支付按法定面值被高估的币，把市场价值更高的币收藏、熔化或输出。这称\u003cmark>格雷欣法则\u003c/mark>，即劣币驱逐良币。\u003c/p>","keyTakeaway":"看是否存在必须共同接受的固定兑换比价，再看哪种币按面值被高估。","pitfall":"「劣」说的是市场金属价值相对于法定面值较低，不能把它理解为假币。","example":"两枚币在法律上都能清偿 10 元，但金属可分别卖 8 元和 12 元。持有人更可能用值 8 元的币付款。"},{"id":"international-gold","title":"国际金本位、铸币平价与黄金输送点","summary":"按法定含金量算平价，再用运金成本理解波动范围。","bodyHtml":"\u003cp>国际货币体系包括汇率安排、储备资产、国际收支调节和协调机构。在典型国际金本位下，黄金是主要锚，两国货币单位所含黄金重量之比确定\u003cmark>铸币平价\u003c/mark>。实际市场汇率会在平价周围波动。\u003c/p>\u003cp>在黄金可自由运送且金本位兑现有效的条件下，汇价超过含运费的上界时，输送黄金比购汇划算；低于下界时可作相反方向套利。上下界称黄金输出点与黄金输入点，直接标价下可近似写作铸币平价加减运金成本。\u003c/p>","keyTakeaway":"含金量决定平价，运输及保险成本决定波动边界。","pitfall":"两国货币的换算方向必须先明确。不能把黄金平价机制用于不承诺固定兑金的货币。","example":"若 1 甲币含金 2 克、1 乙币含金 1 克，则 1 甲币对应 2 乙币的铸币平价，实际汇价可因运金成本略有偏离。"},{"id":"bretton-woods","title":"布雷顿森林、特里芬难题与牙买加安排","summary":"记住双挂钩与瓦解之后的汇率制度多样化。","bodyHtml":"\u003cp>布雷顿森林体系的核心是\u003cmark>双挂钩\u003c/mark>：美元按官方比价对外国货币当局兑换黄金，其他成员货币维持对美元可调整的固定平价。体系建立了 IMF 协调等安排，美元和黄金具有国际储备作用。\u003c/p>\u003cp>\u003cstrong>特里芬难题\u003c/strong>是世界需要更多美元提供国际流动性，而外国持有美元越来越多会削弱按固定比价兑金的可信度。美元停止官方兑金后，原有平价体系瓦解。\u003c/p>\u003cp>牙买加安排和 IMF 协定第二次修订使汇率安排多样化，削弱黄金在官方平价体系中的作用，继续发展特别提款权（SDR）。\u003cstrong>核验日期：2026 年 11 月 11 日。\u003c/strong> IMF 将 SDR 定位为补充成员国官方储备的国际储备资产，可用于换取可自由使用的货币。其估值参考美元、欧元、人民币、日元与英镑。\u003ca href=\"https://www.imf.org/en/About/Factsheets/Sheets/2022/gold-in-the-imf\" target=\"_blank\" rel=\"noopener noreferrer\">IMF 黄金与国际货币制度说明\u003c/a> · \u003ca href=\"https://www.imf.org/en/topics/special-drawing-right\" target=\"_blank\" rel=\"noopener noreferrer\">IMF 特别提款权说明\u003c/a>\u003c/p>","keyTakeaway":"古典金本位直接按含金量定平价。布雷顿森林体系通过美元搭起两层挂钩。","pitfall":"SDR 是储备资产，不能当作公众直接用于支付的货币。牙买加安排也没有要求所有经济体都实行自由浮动。","example":"若其他成员承诺维持本币对美元的平价，而美元当局承诺用黄金兑现外国官方持有的美元，就形成双挂钩。"}],"mindmap":[{"label":"货币与货币职能","target":"money-functions","children":[{"label":"货币本质","target":"money-theories","children":[{"label":"金属说","target":"money-theories"},{"label":"名目说","target":"money-theories"},{"label":"劳动价值论","target":"money-theories"},{"label":"国家货币说","target":"money-theories"}]},{"label":"价值形式演变","target":"money-theories","children":[{"label":"简单或偶然形式","target":"money-theories"},{"label":"扩大形式","target":"money-theories"},{"label":"一般价值形式","target":"money-theories"},{"label":"货币形式","target":"money-theories"}]},{"label":"货币形态","target":"fiat-money","children":[{"label":"实物和金属货币","target":"fiat-money"},{"label":"代用货币和信用货币","target":"fiat-money"},{"label":"电子支付与数字人民币","target":"fiat-money"}]},{"label":"货币层次","target":"aggregates","children":[{"label":"按流动性由窄到宽","target":"liquidity"},{"label":"M0 为流通中货币","target":"aggregates"},{"label":"M1 包括高流动性余额","target":"aggregates"},{"label":"M2 为广义货币","target":"aggregates"},{"label":"M2−M1 常用来说明准货币","target":"aggregates"},{"label":"理论上的 M3 与社融统计相区别","target":"aggregates"}]},{"label":"五种职能","target":"money-functions","children":[{"label":"价值尺度","target":"money-functions"},{"label":"流通手段","target":"money-functions"},{"label":"支付手段","target":"money-functions"},{"label":"贮藏手段","target":"money-functions"},{"label":"世界货币","target":"money-functions"}]}]},{"label":"货币制度","target":"metal-systems","children":[{"label":"制度内容","target":"metal-systems","children":[{"label":"货币材料","target":"metal-systems"},{"label":"名称和单位","target":"metal-systems"},{"label":"本位币和辅币","target":"metal-systems"},{"label":"有限与无限法偿","target":"metal-systems"},{"label":"发行及准备制度","target":"metal-systems"}]},{"label":"金属本位","target":"metal-systems","children":[{"label":"银本位","target":"metal-systems"},{"label":"金银复本位","target":"bimetallism","children":[{"label":"平行本位","target":"bimetallism"},{"label":"双本位与格雷欣法则","target":"bimetallism"},{"label":"跛行本位","target":"bimetallism"}]},{"label":"金本位","target":"metal-systems","children":[{"label":"金币本位","target":"metal-systems"},{"label":"金块本位","target":"metal-systems"},{"label":"金汇兑本位","target":"metal-systems"}]}]},{"label":"不兑现信用本位","target":"fiat-money","children":[{"label":"发行信用与法定货币","target":"fiat-money"}]}]},{"label":"国际货币体系","target":"international-gold","children":[{"label":"制度内容","target":"international-gold","children":[{"label":"汇率制度","target":"international-gold"},{"label":"储备资产","target":"international-gold"},{"label":"国际收支调节","target":"international-gold"},{"label":"国际协调机制","target":"international-gold"}]},{"label":"国际金本位","target":"international-gold","children":[{"label":"黄金为锚","target":"international-gold"},{"label":"铸币平价决定基准","target":"international-gold"},{"label":"黄金输送点限制波动","target":"international-gold"},{"label":"黄金流动与国际收支调节","target":"international-gold"}]},{"label":"布雷顿森林体系","target":"bretton-woods","children":[{"label":"美元与黄金双挂钩","target":"bretton-woods"},{"label":"可调整的固定汇率","target":"bretton-woods"},{"label":"IMF 的建立","target":"bretton-woods"},{"label":"特里芬难题","target":"bretton-woods"}]},{"label":"牙买加安排","target":"bretton-woods","children":[{"label":"黄金的官方平价作用下降","target":"bretton-woods"},{"label":"国际储备多样化","target":"bretton-woods"},{"label":"汇率安排合法多样化","target":"bretton-woods"},{"label":"调节方式多样化","target":"bretton-woods"},{"label":"特别提款权作为储备资产","target":"bretton-woods"}]}]}]},"questions":[{"id":"fin-01-q01","number":1,"group":"货币与货币职能","type":"single","stem":"货币在执行（　　）的职能中产生了信用货币。","options":{"A":"支付手段","B":"价值尺度","C":"流通手段","D":"贮藏手段"},"answer":["A"],"explanationSupplement":"赊销使货物交付与款项清偿分开。未来偿债的承诺可以表现为信用凭证，这是传统理论把信用货币的发展与支付手段相联系的原因。","optionExplanations":{"A":"信用关系形成后，货币用于清偿。","B":"计价可只用货币单位。","C":"即时交换不必产生延期偿付的信用关系。","D":"贮藏讨论保存购买力。"},"conceptId":"money-functions"},{"id":"fin-01-q02","number":2,"group":"货币与货币职能","type":"single","stem":"下列哪一种货币职能可以没有真实货币？（　　）","options":{"A":"流通手段","B":"支付手段","C":"贮藏手段","D":"价值尺度"},"answer":["D"],"explanationSupplement":"价值尺度使用货币单位表示价格。商店为商品标价时，即使尚未发生任何转移，也能衡量和比较商品的价值。","optionExplanations":{"A":"交换需要实际履行转移。","B":"偿付债务需要实际给付。","C":"保存购买力需要持有相应资产。","D":"可以只使用观念上的货币单位。"},"conceptId":"money-functions"},{"id":"fin-01-q03","number":3,"group":"货币与货币职能","type":"single","stem":"在国际债务清偿中使用的货币发挥的是货币的哪种职能？（　　）","options":{"A":"价值尺度","B":"购买手段","C":"支付手段","D":"价值储存手段"},"answer":["C"],"explanationSupplement":"题设是清偿已存在的国际债务。在具体交易环节，货币在执行支付手段职能；从跨国运用角度也可以讨论世界货币。","optionExplanations":{"A":"比较价值或标价。","B":"强调换取商品或服务。","C":"清偿已经形成的债务。","D":"强调跨期保存财富。"},"conceptId":"money-functions"},{"id":"fin-01-q04","number":4,"group":"货币与货币职能","type":"discussion","stem":"投资者将钱存入中国工商银行的活期存款账户，此时货币使用的是（　　）职能。","options":{"A":"支付手段","B":"财富储藏","C":"价值尺度","D":"交易媒介"},"answer":[],"explanationSupplement":"将钱存入活期账户可以从两个角度理解。若着眼于资金转移与银行信用形成，可讨论支付手段；若着眼于储户将购买力留待以后，可讨论价值贮藏。题干没有交代应采用哪个角度。","optionExplanations":{"A":"资金划转和形成存款债权可按传统支付手段解释。","B":"若着眼于跨期保存购买力，此项也有依据。","C":"没有用价格计量商品。","D":"没有给出货物或服务当场交付。"},"conceptId":"money-functions"},{"id":"fin-01-q05","number":5,"group":"货币与货币职能","type":"single","stem":"按历史题设中的货币层次分类，信托类存款属于哪个范围？（　　）","options":{"A":"M2","B":"M1","C":"其他三项都不是","D":"M0"},"answer":["A"],"explanationSupplement":"把题设中的信托类存款理解为纳入统计的较低流动性存款，传统分类将它归在 M2。判断实际业务要看账户和持有人类型，不能仅凭「信托」两个字把信托产品直接列入货币供应量。","optionExplanations":{"A":"在题设分类中属于广义货币。","B":"不能像交易性活期余额一样直接支付。","C":"题设已给出传统分类范围。","D":"M0 是流通中货币。"},"conceptId":"aggregates"},{"id":"fin-01-q06","number":6,"group":"货币与货币职能","type":"single","stem":"货币有五大职能，其中最主要的两大职能是（　　）。","options":{"A":"价值尺度和贮藏手段","B":"价值尺度和流通手段","C":"流通手段和世界货币","D":"贮藏手段和支付手段"},"answer":["B"],"explanationSupplement":"按五种货币职能的传统框架，价值尺度使商品可以用统一单位标价，流通手段使货币成为交易媒介，这两项是基本职能。","optionExplanations":{"A":"贮藏是在基本职能之外保存购买力。","B":"两项分别解决统一计价与交易媒介。","C":"世界货币是跨国运用中的概念。","D":"贮藏与支付属于衍生职能。"},"conceptId":"money-functions"},{"id":"fin-01-q07","number":7,"group":"货币与货币职能","type":"single","stem":"下面不属于 M1的范围是（　　）。","options":{"A":"某企业在交通银行的活期存款1.5万元","B":"某企业用于日常支付的流动现金80万元","C":"小卖部老板持有的1000个1元硬币","D":"某民间协会的三年定期存款20万元"},"answer":["D"],"explanationSupplement":"无论按题设时期还是2025年起的新 M1 口径，流通中货币和单位活期存款在 M1 内，单位三年定期存款不计入 M1。","optionExplanations":{"A":"单位活期存款计入 M1。","B":"公众持有的流通现金属于 M0，包含于 M1。","C":"流通中的硬币属于 M0。","D":"单位定期存款属于较宽的货币统计范围。"},"conceptId":"aggregates"},{"id":"fin-01-q08","number":8,"group":"货币与货币职能","type":"single","stem":"金融资产的流动性是指（　　）。","options":{"A":"金融资产能迅速变现","B":"金融资产能迅速转让流通","C":"金融资产能在金融市场上简便快捷地转让变现而不致遭受损失","D":"金融资产能在金融市场上以市场价格迅速变现"},"answer":["C"],"explanationSupplement":"金融资产流动性要同时看变现速度、交易便利程度和价值折损。能够迅速卖出但必须大幅折价，仍可能缺乏流动性。","optionExplanations":{"A":"只说速度，没有考虑折损。","B":"转让快不代表可无明显损失地转化为购买力。","C":"同时包括便利、速度和价值保持。","D":"市场价格可能因交易规模和冲击成本而变化。"},"conceptId":"liquidity"},{"id":"fin-01-q09","number":9,"group":"货币与货币职能","type":"discussion","stem":"日常生活中，我们使用手机上的移动支付 APP 完成外卖、水果、学费的支付，这一过程会令 M1 和 M2 发生何种变化？（　　）","options":{"A":"M1减少，M2不变","B":"M1 和M2 都不变","C":"M1 增加，M2不变","D":"M1 和M2 都变，但无法确定是增加还是减少"},"answer":[],"explanationSupplement":"支付 App 只是发起交易的工具。要判断总量变化，需要知道付款、收款分别属于哪类账户，以及有没有新增信用。在旧口径下，个人活期转为商户单位活期可令 M1 上升、M2 不变；按2025年起口径，若两端本已计入 M1，纯转账不改变两层总额。","optionExplanations":{"A":"特定资金从 M1 内移到 M1 外而仍在 M2 内，才可能出现。","B":"按新口径，从个人活期向单位活期纯转账通常符合。","C":"旧口径下可能发生，不能由「使用 App」本身推出。","D":"支付渠道不足以判断，需分析账户和资金来源。"},"conceptId":"aggregates"},{"id":"fin-01-q10","number":10,"group":"货币与货币职能","type":"single","stem":"某公司以延期付款方式销售给某商场一批商品，则该商品到期偿还欠款时，货币执行的是（　　）职能。","options":{"A":"价值尺度","B":"流通手段","C":"储藏手段","D":"支付手段"},"answer":["D"],"explanationSupplement":"货物已经先交付，后来付钱用于清偿欠款。关键是交易和付款在时间上分开，结清应付款项时体现支付手段。","optionExplanations":{"A":"先标价时可体现价值尺度。","B":"即时钱货两清时体现流通手段。","C":"将购买力保存至以后时体现贮藏手段。","D":"清偿延期付款形成的债务。"},"conceptId":"money-functions"},{"id":"fin-01-q11","number":11,"group":"货币与货币职能","type":"discussion","stem":"按流动性来划分，我国社会融资规模被划入（　　）中。","options":{"A":"M0","B":"M1","C":"M2","D":"M3"},"answer":[],"explanationSupplement":"社会融资规模衡量实体经济从金融体系取得的资金。货币供应量统计流通中货币和符合口径的金融工具余额，两者是不同统计维度。人民银行公布的社会融资规模单独列示，不能整体划入 M3。","optionExplanations":{"A":"只涉及流通中货币。","B":"统计高流动性的货币及部分账户余额。","C":"广义货币与社融衡量的对象不同。","D":"不是我国官方社融口径对应的货币层次。"},"conceptId":"aggregates"},{"id":"fin-01-q12","number":12,"group":"货币与货币职能","type":"single","stem":"现阶段中国货币供应量中 M2-M1是（　　）。","options":{"A":"狭义货币供应量","B":"广义货币供应量","C":"准货币","D":"流通中现金"},"answer":["C"],"explanationSupplement":"按本题定义，M2 是货币与准货币之和，M1 是狭义货币，两者之差代表 M2 内流动性低于 M1 组成的部分。M1 的统计调整也会改变该差额的构成。","optionExplanations":{"A":"狭义货币是 M1。","B":"广义货币是 M2。","C":"按定义为 M2−M1。","D":"流通中货币是 M0。"},"conceptId":"aggregates"},{"id":"fin-01-q13","number":13,"group":"货币与货币职能","type":"single","stem":"按2025年1月以前的狭义货币统计口径理解，下列关于货币层次的说法中错误的是（　　）。","options":{"A":"从数量上看，M0\u003cM1\u003cM2","B":"M1 是狭义货币，M2是广义货币","C":"M0 包括银行的库存现金","D":"在我国，准货币包括定期存款、储蓄存款和其他存款"},"answer":["C"],"explanationSupplement":"M0 指银行体系以外的流通中货币，银行库存现金不属于公众流通持有。旧口径中 M1 不包含个人活期存款。自2025年起，个人活期存款已经计入 M1。","optionExplanations":{"A":"实际统计中的各层余额按嵌套口径由窄到宽。","B":"是两者的常用名称。","C":"银行库存在公众流通范围之外，故此项错误。","D":"按题设旧口径，部分储蓄存款属于准货币。"},"conceptId":"aggregates"},{"id":"fin-01-q14","number":14,"group":"货币与货币职能","type":"single","stem":"据央行公布的数据，2020年12月末，M2余额218.68万亿元，同比增长10.1%；M1余额62.56万亿元，同比增长8.6%；M0余额8.43万亿元，同比增长9.2%。央行划分上述货币供给层次的标准是基于货币的（　　）。","options":{"A":"安全性","B":"风险性","C":"流动性","D":"盈利性"},"answer":["C"],"explanationSupplement":"2020 年的余额是历史例子，题目考查为什么从 M0 到 M2 逐渐纳入更多资产。划分依据是资金能否方便直接支付或转化为购买力。","optionExplanations":{"A":"关注损失概率，与能否迅速支付不同。","B":"是风险维度，不是这里的主要层次划分标准。","C":"流动性高的项目进入较窄层次。","D":"收益率不能直接判定是否纳入某个货币层次。"},"conceptId":"liquidity"},{"id":"fin-01-q15","number":15,"group":"货币与货币职能","type":"single","stem":"按劳动价值论中商品货币的分析，下列说法错误的是（　　）。","options":{"A":"货币是固定充当一般等价物的特殊商品","B":"货币在与其他商品直接相交换的时候经常受到制约","C":"货币是价值和使用价值的统一体","D":"货币是商品"},"answer":["B"],"explanationSupplement":"劳动价值论中，商品交换发展后由某种商品固定充当一般等价物。该等价物在交易中具有普遍可接受性，因此 B 与这种分析不符。现代信用货币的价值与法偿安排另作分析。","optionExplanations":{"A":"是商品货币在劳动价值论中的经典表述。","B":"一般等价物被广泛接受，缓解直接物物交换的限制。","C":"在商品货币分析中适用。","D":"题目已限定到商品货币的理论框架。"},"conceptId":"money-theories"},{"id":"fin-01-q16","number":16,"group":"货币与货币职能","type":"single","stem":"只需要想象的或观念上的货币，此时货币的职能是（　　）。","options":{"A":"流通手段","B":"贮藏手段","C":"价值尺度","D":"支付手段"},"answer":["C"],"explanationSupplement":"以货币给商品或资产标价，只需要一个公认的计价单位。实际收款还未发生，也不妨碍货币发挥价值尺度职能。","optionExplanations":{"A":"需要现实交换。","B":"需要实际持有购买力。","C":"可仅使用观念上的货币。","D":"需要履行给付或清偿。"},"conceptId":"money-functions"},{"id":"fin-01-q17","number":17,"group":"货币与货币职能","type":"single","stem":"人民币是我国的法定货币，其本质是（　　）。","options":{"A":"代用货币","B":"银行券","C":"不兑现的信用货币","D":"可兑现的信用货币"},"answer":["C"],"explanationSupplement":"人民币是法定货币，持有人没有按固定比价将人民币兑换为黄金的权利。在货币制度分类中，它属于不兑现的信用货币。这里的兑现特指按本位制度兑换货币金属。","optionExplanations":{"A":"通常指可以按规则代表并兑换一定量金属货币的凭证。","B":"历史上的银行券是形态描述，未给出现行制度分类。","C":"符合不按固定含金量兑现的信用本位。","D":"题目所说的制度不存在固定兑金承诺。"},"conceptId":"fiat-money"},{"id":"fin-01-q18","number":18,"group":"货币与货币职能","type":"single","stem":"当货币作为资产成为持有者的财富时，货币是在执行（　　）。","options":{"A":"价值尺度","B":"流通手段","C":"支付手段","D":"贮藏手段"},"answer":["D"],"explanationSupplement":"把货币作为资产保存，重点是让购买力从现在转移到以后。这一功能是价值贮藏。","optionExplanations":{"A":"用单位衡量价值。","B":"用货币作为当期交易媒介。","C":"结清义务或债务。","D":"持有以备以后购买。"},"conceptId":"money-functions"},{"id":"fin-01-q19","number":19,"group":"货币与货币职能","type":"single","stem":"货币的本质特征是充当（　　）。","options":{"A":"特殊等价物","B":"一般等价物","C":"普通商品","D":"特殊商品"},"answer":["B"],"explanationSupplement":"传统价值形式分析用一般等价物说明货币为什么能统一衡量商品价值并充当交易媒介。关键是它能被广泛接受。","optionExplanations":{"A":"等价物只在部分交换中使用时，尚未成为一般等价物。","B":"是货币的核心角色。","C":"普通商品没有承担普遍交换媒介的地位。","D":"特殊商品说还要进一步说明其一般等价物功能。"},"conceptId":"money-theories"},{"id":"fin-01-q20","number":20,"group":"货币与货币职能","type":"discussion","stem":"准货币又称为亚货币，近似货币，并不是真正的货币。下列选项中不属于准货币的是（　　）。","options":{"A":"单位定期存款","B":"城乡居民储蓄存款","C":"银行承兑汇票","D":"股票"},"answer":[],"explanationSupplement":"准货币有统计口径和较宽的理论用法。按我国 M2−M1 的用法，个人活期已经进入 M1，银行承兑汇票也不能凭名称直接作为该差额中的项目。按部分理论的宽定义，短期信用工具可能被称为近似货币。题目没有指定口径，不能唯一排除。","optionExplanations":{"A":"典型较低流动性存款。","B":"应区分个人定期和个人活期。","C":"属于短期信用工具，不能直接套用 M2−M1 的统计范围。","D":"股票是权益证券，通常不属于标准准货币指标。"},"conceptId":"aggregates"},{"id":"fin-01-q21","number":21,"group":"货币与货币职能","type":"single","stem":"执行流通手段职能的货币必须是（　　）。","options":{"A":"观念上的货币","B":"想象的货币","C":"现实的货币","D":"足值货币"},"answer":["C"],"explanationSupplement":"充当交换媒介时，必须有实际价值转移。它可以通过现金或电子资金转移完成，单纯的想象金额无法完成购买。","optionExplanations":{"A":"只是计价概念。","B":"不能完成现实交易。","C":"包括现实支付所转移的现金或存款。","D":"现实信用货币也能用于流通。"},"conceptId":"money-functions"},{"id":"fin-01-q22","number":22,"group":"货币与货币职能","type":"single","stem":"在银行发放借款的情况下，货币作为价值运动的独立形式从银行单方面转移到借款人，这时货币执行的职能是（　　）。","options":{"A":"价值尺度","B":"支付手段","C":"流通手段","D":"贮藏手段"},"answer":["B"],"explanationSupplement":"银行发放贷款使资金转移并形成借贷关系，没有商品在同一时刻作为对价交付。按题目的传统分类，这是货币在信用关系中的支付职能。","optionExplanations":{"A":"不只是标示货币金额。","B":"交易中的资金给付建立借贷关系。","C":"题设没有钱货同时交换。","D":"题设描述资金发放。"},"conceptId":"money-functions"},{"id":"fin-01-q23","number":23,"group":"货币与货币职能","type":"single","stem":"下列选项中，流动性最强的是（　　）。","options":{"A":"定期存款","B":"有价证券","C":"活期存款","D":"大额可转让存单"},"answer":["C"],"explanationSupplement":"活期存款通常可随时划转或支取，不需要先出售资产或等到期。对其他选项，要考虑到期、折价和市场成交等条件。","optionExplanations":{"A":"提前支取可能影响利息。","B":"变现便利程度和价格冲击因证券而异。","C":"一般可直接支付或提取。","D":"虽可转让，但须有买方及相应交易安排。"},"conceptId":"liquidity"},{"id":"fin-01-q24","number":24,"group":"货币与货币职能","type":"single","stem":"在我国货币层次划分中，M0通常是指（　　）。","options":{"A":"企业单位的活期存款","B":"流通中的现金","C":"居民储蓄存款","D":"银行全部存款"},"answer":["B"],"explanationSupplement":"M0 是流通中货币。传统题目称流通中的现金，强调公众持有且能够流通的现金。统计应以人民银行发布口径为准。","optionExplanations":{"A":"单位活期存款计入 M1 的非 M0 部分。","B":"最接近流通中货币的传统定义。","C":"居民存款不属于现金。","D":"银行存款不是流通中货币。"},"conceptId":"aggregates"},{"id":"fin-01-q25","number":25,"group":"货币与货币职能","type":"single","stem":"在金属货币制度下，货币的（　　）可以自发地调节流通中的货币量。","options":{"A":"价值尺度职能","B":"流通手段职能","C":"支付手段职能","D":"贮藏手段职能"},"answer":["D"],"explanationSupplement":"足值金属币可以退出交易、成为金属贮藏，也可在条件允许时被重新投入流通或自由铸造。因此，在典型金属本位假设下，贮藏发挥缓冲作用。","optionExplanations":{"A":"负责用货币单位衡量价值。","B":"负责作为交换媒介。","C":"负责偿付。","D":"使金属币能够在流通和贮藏之间转移。"},"conceptId":"metal-systems"},{"id":"fin-01-q26","number":26,"group":"货币与货币职能","type":"single","stem":"货币在（　　）时执行流通手段的职能。","options":{"A":"企业发工资","B":"分期付款购房","C":"交水电费","D":"吃饭付账"},"answer":["D"],"explanationSupplement":"按传统题型，钱货当场交换时是流通手段。工资、分期款和通常按期缴纳的公用费用多对应支付既有义务。","optionExplanations":{"A":"结算已经提供的劳动。","B":"分期付款体现延期支付。","C":"结清已用水电的费用。","D":"即食即付时对应即时交易。"},"conceptId":"money-functions"},{"id":"fin-01-q27","number":27,"group":"货币制度","type":"single","stem":"在金银复本位制下，当金币与银币的实际价值相背离，致使实际价值高于名义价值的货币被收藏、熔化而退出流通，而实际价值低于名义价值的货币则充斥市场，这是（　　）。","options":{"A":"特里芬难题","B":"米德冲突","C":"格雷欣法则","D":"三元悖论"},"answer":["C"],"explanationSupplement":"当两种足值金属币必须按法定固定比价偿付，而市场比价与它不同，持有人会优先用法定估值偏高的劣币支付，保留实际价值更高的良币。","optionExplanations":{"A":"是国际储备供给与美元兑金承诺的矛盾。","B":"是内外经济均衡目标可能冲突。","C":"描述固定法定比价下劣币驱逐良币。","D":"讨论汇率、资本流动和货币政策自主的取舍。"},"conceptId":"bimetallism"},{"id":"fin-01-q28","number":28,"group":"货币制度","type":"single","stem":"金本位制度下，两国货币单位的含金量之比称为（　　）。","options":{"A":"购买力平价","B":"利息平价","C":"铸币平价","D":"黄金平价"},"answer":["C"],"explanationSupplement":"金本位制规定本国货币单位的含金量。按两国货币单位含金量之比折算的汇率基础，通常称为铸币平价。","optionExplanations":{"A":"比较相同商品篮子购买力。","B":"联系利率差与汇率。","C":"是含金量之比的具体术语。","D":"更宽泛的黄金平价用语，不如铸币平价具体。"},"conceptId":"international-gold"},{"id":"fin-01-q29","number":29,"group":"货币制度","type":"single","stem":"从历史发展过程看，世界各国的货币制度演变过程大体是（　　）。","options":{"A":"金银复本位制→银本位制→金本位制→不兑现的纸币本位制","B":"银本位制→金银复本位制→金本位制→不兑现的纸币本位制","C":"金本位制→金银复本位制→银本位制→不兑现的纸币本位制","D":"银本位制→金本位制→金银复本位制→不兑现的纸币本位制"},"answer":["B"],"explanationSupplement":"这是货币制度史的概括序列：银本位、金银复本位、金本位、不兑现的信用货币制度。各地实施的先后和时间不完全相同。","optionExplanations":{"A":"把银本位与复本位的次序调换。","B":"符合常见概括。","C":"把金本位放在最前。","D":"把金本位放在复本位之前。"},"conceptId":"metal-systems"},{"id":"fin-01-q30","number":30,"group":"货币制度","type":"single","stem":"（　　）是一种相对稳定的货币制度，对资本主义的发展曾起着积极的作用。","options":{"A":"金币本位制","B":"金汇兑本位制","C":"金银复本位制","D":"金块本位制"},"answer":["A"],"explanationSupplement":"金币本位制允许黄金铸币流通、按规则兑换与自由铸造，历史上能稳定以黄金计量的货币比价。币值与物价仍会受黄金供应及经济周期影响。","optionExplanations":{"A":"是古典金本位的完整形式。","B":"通常通过外汇间接兑现。","C":"法定固定比价与市场比价冲突时可能产生挤出。","D":"金块兑换通常有门槛，金币不普遍流通。"},"conceptId":"metal-systems"},{"id":"fin-01-q31","number":31,"group":"货币制度","type":"single","stem":"金属铸币能够自动调节货币流通量，发挥“蓄水池”功能的主要原因在于（　　）。","options":{"A":"自由铸造原则","B":"无限法偿原则","C":"限制铸造原则","D":"有限法偿原则"},"answer":["A"],"explanationSupplement":"足值铸币可退出流通并被熔藏。自由铸造允许需要更多货币时把符合规格的金属重新铸成铸币，使金属存量与流通币能够双向调节。","optionExplanations":{"A":"是补充流通铸币的重要制度条件。","B":"规定法定清偿能力，不能解释铸币如何补充。","C":"限制把金属重新转为铸币。","D":"限制法偿金额，与贮藏转换机制不同。"},"conceptId":"metal-systems"},{"id":"fin-01-q32","number":32,"group":"货币制度","type":"single","stem":"国家纸币从性质上讲是一种凭（　　）流通的货币。","options":{"A":"国家信用","B":"国家强制力","C":"国家法律","D":"国家财物抵押"},"answer":["A"],"explanationSupplement":"国家纸币依靠发行者信用、制度安排和公众接受形成流通。法偿规定提供制度保障，经济分类中的性质强调信用基础。","optionExplanations":{"A":"体现国家信用。","B":"属于制度保障的一个方面。","C":"法律规定法偿地位，题目问性质。","D":"一般没有以特定国家财物逐张作抵押。"},"conceptId":"fiat-money"},{"id":"fin-01-q33","number":33,"group":"货币制度","type":"single","stem":"“劣币驱逐良币”现象存在于（　　）。","options":{"A":"银元本位制","B":"金块本位制","C":"纸币本位制","D":"金银复本位制"},"answer":["D"],"explanationSupplement":"该现象要求两种实际价值不同的货币可以按固定法定比价清偿。在金银双本位制中，金币和银币按固定法定比价交易，最容易说明这个机制。","optionExplanations":{"A":"只有银作为本位金属。","B":"主要以规则兑换金块，不以两种币固定比价共同流通。","C":"此项缺少题目所需的金银固定法定比价。","D":"具体对应其中的双本位。"},"conceptId":"bimetallism"},{"id":"fin-01-q34","number":34,"group":"货币制度","type":"single","stem":"格雷欣法则是指（　　）。","options":{"A":"劣币驱逐良币现象","B":"良币驱逐劣币现象","C":"劣币良币并存","D":"纸币铸币同时流通"},"answer":["A"],"explanationSupplement":"格雷欣法则常表述为劣币驱逐良币。两种货币能按法定比价支付时，人们倾向于付出实际价值低的币，保留实际价值高的币。","optionExplanations":{"A":"符合固定比价下的支付选择。","B":"把保留和支付方向弄反。","C":"并存本身不能描述挤出机制。","D":"材质不同不自动产生该机制。"},"conceptId":"bimetallism"},{"id":"fin-01-q35","number":35,"group":"货币制度","type":"single","stem":"下列关于金银复本位制的说法中，（　　）是正确的。","options":{"A":"平行本位制下，会产生“劣币驱逐良币”的现象","B":"平行本位制下，金币和银币的兑换比率主要由市场比价决定，国家进行适当调控","C":"在跛行本位制下，金币和银币均不得自由铸造","D":"劣币驱逐良币规律，又称为格雷欣法则，产生于金银复本位的双本位制度下"},"answer":["D"],"explanationSupplement":"平行本位按市场比价兑换。双本位设法定固定比价，市场价偏离时会发生格雷欣机制。跛行本位通常保留一金属自由铸造，同时限制另一金属。","optionExplanations":{"A":"没有固定兑换比价时，不能按同一法定价格解释挤出。","B":"平行本位比价由市场决定，附带国家调控并非定义条件。","C":"通常限制其中一种，而非两种都限制。","D":"符合双本位下的格雷欣法则。"},"conceptId":"bimetallism"},{"id":"fin-01-q36","number":36,"group":"货币制度","type":"single","stem":"劣币是指实际价值（　　）的货币。","options":{"A":"等于零","B":"等于名义价值","C":"高于名义价值","D":"低于名义价值"},"answer":["D"],"explanationSupplement":"比较金属本身的市场价值与铸币的法定面值。当一枚币按法定面值能清偿更多，但其中的金属价值较低时，它就是此机制中的劣币。","optionExplanations":{"A":"市场价值不需要为零。","B":"价值相同没有题目所说的低估或高估。","C":"对应被低估的良币。","D":"面值高于实际价值。"},"conceptId":"bimetallism"},{"id":"fin-01-q37","number":37,"group":"货币制度","type":"single","stem":"以金为货币金属，以金币为本位币，不铸造也不流通金币，银行券不可以直接兑换黄金，可以兑换外币汇票进而由外汇兑换黄金的货币制度属于（　　）。","options":{"A":"金块本位制","B":"金本位制","C":"金汇兑本位制","D":"银本位制"},"answer":["C"],"explanationSupplement":"本国银行券可以先兑换外国货币，再经外汇兑换黄金，是金汇兑本位的识别线索。B 是金本位的上位分类，C 是题目问到的具体制度。","optionExplanations":{"A":"达到规定数量可直接换金块。","B":"包括多种以金为本位的安排，范围更宽。","C":"通过外汇间接兑换黄金。","D":"以银为本位金属。"},"conceptId":"metal-systems"},{"id":"fin-01-q38","number":38,"group":"国际货币体系","type":"single","stem":"布雷顿森林会议确立的国际货币体系核心内容是（　　）。（2019）","options":{"A":"各国货币与美元和英镑构成的货币篮子挂钩","B":"各国货币都与特别提款权挂钩","C":"美元与黄金挂钩，其他各国货币与美元挂钩","D":"各国货币都与黄金挂钩"},"answer":["C"],"explanationSupplement":"二战后布雷顿森林体系的核心是双挂钩。美元承担向外国官方持有者按官方价格兑金的承诺，其他参加国货币通过固定但可调整的平价与美元联系。","optionExplanations":{"A":"该体系没有以美元和英镑的组合为锚。","B":"SDR 后来作为补充储备资产设立。","C":"概括两层平价关系。","D":"不是所有成员货币都直接兑换黄金。"},"conceptId":"bretton-woods"},{"id":"fin-01-q39","number":39,"group":"国际货币体系","type":"single","stem":"为满足世界经济增长和贸易发展，美元必须持续供应；但持续供应美元将难以维系美元同黄金的固定比价，这叫（　　）。","options":{"A":"不可能三角","B":"米德冲突","C":"特里芬难题","D":"美元的不可得性"},"answer":["C"],"explanationSupplement":"国际贸易增长需要更多国际储备，向世界供应美元会增加外国美元持有量。美元负债相对于可动用黄金越大，官方固定兑金承诺越难维持。这一矛盾称特里芬难题。","optionExplanations":{"A":"讨论固定汇率、自由资本流动、货币政策自主三者。","B":"讨论实现内部与外部经济均衡可能冲突。","C":"对应储备流动性与锚货币信心的矛盾。","D":"题目同时描述美元供应不足和过多的困难。"},"conceptId":"bretton-woods"},{"id":"fin-01-q40","number":40,"group":"国际货币体系","type":"single","stem":"铸币平价是指（　　）。","options":{"A":"两国货币单位代表的美元之比","B":"两国货币单位含金量之比","C":"两国货币单位购买力之比","D":"两国货币单位价值量之比"},"answer":["B"],"explanationSupplement":"铸币平价用本位金币的法定含金量折算两国货币的比价。实际汇率可因黄金运输和保险费用在平价周围波动。","optionExplanations":{"A":"美元不是定义所需的分母。","B":"直接比较单位货币含金量。","C":"对应购买力平价。","D":"价值量一词没有指定黄金重量。"},"conceptId":"international-gold"},{"id":"fin-01-q41","number":41,"group":"国际货币体系","type":"single","stem":"第二次世界大战以后，在国际领域建立的（　　），也是金汇兑本位制的一种体现。","options":{"A":"金本位体系","B":"布雷顿森林体系","C":"牙买加体系","D":"美元体系"},"answer":["B"],"explanationSupplement":"二战后建立的具体体系称布雷顿森林体系。在其安排中，各成员通过美元间接联系黄金，因此可以归为国际层面的金汇兑安排。","optionExplanations":{"A":"古典国际金本位直接以各币含金量为汇率基础。","B":"是该二战后体系的专有名称。","C":"是在原体系瓦解后形成的后续安排。","D":"说明美元居中，但并非题目指的正式制度名称。"},"conceptId":"bretton-woods"},{"id":"fin-01-q42","number":42,"group":"国际货币体系","type":"single","stem":"金本位制下外汇汇率上下波动的幅度受制于（　　）。","options":{"A":"黄金储备状况","B":"外汇储备状况","C":"黄金输送点","D":"外汇政策"},"answer":["C"],"explanationSupplement":"当外汇成本超出铸币平价加运金费用，直接运出黄金更便宜；低至另一端则可运入黄金套利。因此，黄金输出点和输入点约束汇率波动。","optionExplanations":{"A":"储备是背景条件，不是两端的具体界限。","B":"外汇储备不等于运金成本确定的边界。","C":"包括黄金输出点和输入点。","D":"题目在可运金的金本位假设下分析。"},"conceptId":"international-gold"},{"id":"fin-01-q43","number":43,"group":"国际货币体系","type":"single","stem":"规定了各国货币与美元挂钩，美元与黄金挂钩的国际货币体系是（　　）。","options":{"A":"金本位体系","B":"金汇兑本位体系","C":"布雷顿森林体系","D":"牙买加体系"},"answer":["C"],"explanationSupplement":"两层挂钩的具体历史名称是布雷顿森林体系。金汇兑本位可以概括其制度类型，而题目问的是这个具体的国际安排。","optionExplanations":{"A":"古典金本位不以美元这一中间锚为必要条件。","B":"是更宽的制度类型。","C":"准确命名具有该双挂钩结构的历史体系。","D":"允许多种汇率安排并取消黄金的官方共同计价地位。"},"conceptId":"bretton-woods"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;
        }
        const label = el('label', 'quiz-option');
        const input = el('input'); input.type = q.type === 'multiple' ? 'checkbox' : 'radio'; input.name = 'quiz-answer'; input.value = key;
        input.checked = selected.includes(key); input.disabled = show; input.dataset.qid = q.id;
        if (show && q.answer.includes(key)) label.classList.add('correct');
        if (show && selected.includes(key) && !q.answer.includes(key)) label.classList.add('wrong');
        label.append(input, el('span', '', `${key}. ${text}`)); field.append(label);

   fitWidth();
  };
 }
 const chapterViews = chapter?.visual ? ['learn', 'map', 'visual', 'practice'] : ['learn', 'map', 'practice'];
 function chapterActions(visible) {
  $$('[data-action="favorites"], [data-action="records"], [data-action="download"], .sidebar-quick-actions').forEach(node => node.hidden = !visible);
 }
 function showHome() {
  saveReadingPosition();
  pausePPF();
  chapterActions(false);
  $('#home-view').hidden=false;
  $('#chapter-view').hidden=true;
  document.title='学习目录 · 知其所以';
  window.scrollTo({top:0,behavior:'instant'});
 }
 function showChapter() {
  chapterActions(true);
  $('#home-view').hidden=true;
  $('#chapter-view').hidden=false;
  document.title=chapter.title+' · 知其所以';
 }
 function switchView(next, scroll=true) {
  if (!chapterViews.includes(next)) next='learn';
  saveReadingPosition();
  pausePPF();
  view=next;
  $$('.content-view').forEach(v=>v.hidden=v.id!=='view-'+next);
  $$('[data-view]').forEach(b=>{
   const active=b.dataset.view===next;
   b.classList.toggle('active',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(scroll) {
   readingTracking=false;
   $('.view-tabs').scrollIntoView({behavior:'instant',block:'start'});
   requestAnimationFrame(()=>requestAnimationFrame(()=>{readingTracking=true;}));
  }
  if(next==='map')fitMapOnFirstOpen();
  if(next==='practice')mountQuiz();
  history.replaceState(null,'','#'+next);
 }
 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}
 function download() {
  if(offline) {
   openModal('你正在使用离线学习版','<p>本文件包含本章的讲解、思维导图和练习。保存好这份 HTML，断网后双击即可继续学习。</p><p>可在「学习记录」中导出、导入本章备份。</p>');
   return;
  }
  const a=el('a');
  a.href=(flatDownloads?'':'downloads/')+encodeURIComponent(chapter.downloadName);
  a.download=chapter.downloadName;
  document.body.append(a);
  a.click();
  a.remove();
  toast('离线 HTML 下载已开始，保存后可双击学习');
 }
 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  $('[data-view="visual"]').hidden=!chapter.visual;
  renderLessons();
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if(chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');}});
})();
