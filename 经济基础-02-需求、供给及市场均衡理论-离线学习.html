  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-02-需求、供给及市场均衡理论-离线学习.html","visual":"demand-move","visualSectionId":"demand-shifts","visuals":[{"type":"demand-move","sectionId":"demand-shifts"},{"type":"supply-move","sectionId":"supply-shifts"},{"type":"market","sectionId":"equilibrium"},{"type":"price-controls","sectionId":"price-controls"}]},"lessons":{"title":"需求、供给及市场均衡理论","subtitle":"从买卖双方的选择出发，判断价格和交易量如何变化。","sections":[{"id":"demand","title":"需求与需求量","summary":"给定时期和价格，消费者愿意且能够购买多少。","bodyHtml":"\u003cp>\u003cstrong>需求\u003c/strong>是在一定时期内，给定其他条件时，消费者在各种可能的价格下\u003cmark>愿意且能够购买\u003c/mark>的数量关系。某一价格对应的数量称为\u003cstrong>需求量\u003c/strong>，它是需求曲线上的一个点。满足购买意愿和支付能力两个条件，才构成有效需求。\u003c/p>\u003cp>需求曲线通常用纵轴表示价格 \u003cvar>P\u003c/var>，横轴表示数量 \u003cvar>Q\u003c/var>。分析给定需求曲线时，收入、偏好和其他商品的价格等因素保持不变。本品价格是用来比较各点的变量。\u003c/p>\u003cp>在同一价格上加总各消费者的需求量，就得到该价格下的\u003cmark>市场需求量\u003c/mark>。\u003c/p>","keyTakeaway":"需求是不同价格下的一整组数量。需求量是给定价格下的一个数量。","pitfall":"购物愿望和支付能力缺一不可。需求量表示计划购买的数量，实际成交量还取决于供给和交易条件。","example":"同一天，甲愿意以每个 5 元购买 2 个面包，乙愿意购买 3 个，两人都有足够的钱。两人在 5 元时的合计需求量为 5 个。"},{"id":"demand-law","title":"需求规律与吉芬品","summary":"其他条件不变，本品价格上升通常使需求量减少。","bodyHtml":"\u003cp>\u003cstrong>需求规律\u003c/strong>描述\u003cmark>其他条件不变\u003c/mark>时，本品价格与需求量通常反向变动。价格上升时，点沿需求曲线向左上方移动。价格下降时，点向右下方移动。\u003c/p>\u003cul>\u003cli>\u003cstrong>替代效应\u003c/strong>来自相对价格变化。本品降价使它相对其他商品更便宜，消费者倾向于用它替代其他商品。\u003c/li>\u003cli>\u003cstrong>收入效应\u003c/strong>来自购买力变化。本品降价提高了既定货币收入的购买力。对正常品，购买力提高会增加需求量。对低档品，购买力提高会减少需求量。\u003c/li>\u003cli>\u003cstrong>吉芬品\u003c/strong>是一种特殊的低档品。在一定价格区间内，收入效应强于且反向于替代效应，降价反而使需求量下降。\u003c/li>\u003c/ul>","keyTakeaway":"价格变化对需求量的总效应可以分解为替代效应和收入效应。正常品的两种效应同向。","pitfall":"低档品指收入提高时需求减少的商品。判定吉芬品还需比较两种效应的强弱。","example":"其他商品价格和货币收入不变时，苹果降价使苹果相对梨更便宜，也使家庭预算的购买力提高。两种效应共同决定苹果需求量的变化。"},{"id":"demand-shifts","title":"需求曲线为什么移动","summary":"固定本品价格，比较收入、偏好、相关品价格或预期变化。","bodyHtml":"\u003cp>\u003cmark>本品价格变动\u003c/mark>，沿原需求曲线改变需求量。\u003cmark>本品价格以外的因素变化\u003c/mark>，可能改变各价格对应的需求量，使整条需求曲线移动。同一价格下愿买得更多，表示需求增加，图上向右移。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>变化\u003c/th>\u003cth>本品需求的常见方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>收入增加\u003c/td>\u003ctd>正常品增加，低档品减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>偏好增强\u003c/td>\u003ctd>增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>替代品涨价\u003c/td>\u003ctd>增加，例如咖啡涨价带动茶的需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>互补品涨价\u003c/td>\u003ctd>减少，例如打印墨盒涨价抑制打印机需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>预期本品未来涨价\u003c/td>\u003ctd>可以提前购买时，当期需求往往增加。预期未来降价时，消费者可能推迟购买\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>商品品种、质量、广告、地理位置、季节和政策等也可能改变需求，方向取决于它们怎样改变买方的支付意愿或能力。\u003c/p>","keyTakeaway":"先明确分析的是哪一种商品。替代品价格与本品需求同向变动，互补品价格与本品需求反向变动。","pitfall":"判断曲线是否移动，要固定本品价格。其他商品价格虽也是价格，却属于本品的曲线移动因素。","example":"某饮品的替代品降价使该饮品需求减少 30 单位，互补品降价使它需求增加 20 单位。若两项效应可相加，合计需求减少 10 单位。"},{"id":"supply","title":"供给与供给规律","summary":"给定时期和价格，生产者愿意且能够出售多少。","bodyHtml":"\u003cp>\u003cstrong>供给\u003c/strong>是在一定时期内，给定其他条件时，生产者在各种可能的价格下\u003cmark>愿意且能够出售\u003c/mark>的数量关系。某一价格对应的是\u003cstrong>供给量\u003c/strong>。市场供给量等于同一价格下各卖方的供给量之和。\u003c/p>\u003cp>\u003cstrong>供给规律\u003c/strong>描述其他条件不变时，本品价格与供给量通常同向变动。价格上升时，更多单位的生产或出售变得有利，供给量增加，点沿供给曲线向右上方移动。价格下降时，点向左下方移动。\u003c/p>","keyTakeaway":"供给曲线描述整组价格与供给量的关系。供给量对应曲线上的一点。","pitfall":"可出售的库存、工厂最大产能和当期实际成交量有各自的含义。供给量还需要结合当期价格和卖方出售意愿来判断。","example":"一家面包店在成本相同的条件下，每个面包卖 5 元时愿供给 80 个，卖 6 元时愿供给 100 个。这两个数量对应同一条供给曲线的两个点。"},{"id":"supply-shifts","title":"供给曲线为什么移动","summary":"成本、技术、卖方预期等变化会改变同一价格下的供给量。","bodyHtml":"\u003cp>本品价格改变时，供给量沿原曲线变动。固定本品价格，改变生产成本、技术或其他条件，会改变供给。同一价格下愿卖得更多，\u003cmark>供给曲线向右移\u003c/mark>。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>变化\u003c/th>\u003cth>本品供给的常见方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>投入品价格或工资上升\u003c/td>\u003ctd>单位生产成本上升，供给减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生产技术改进\u003c/td>\u003ctd>能够降低生产成本时，供给增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>卖方预期未来涨价\u003c/td>\u003ctd>商品可储存且延迟销售有利时，当期供给可能减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生产中可替代的其他商品涨价\u003c/td>\u003ctd>资源可能转向生产更有利的产品，本品供给减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>天气、税费、补贴等条件变化\u003c/td>\u003ctd>根据产量、成本和卖方收益的具体变化判断\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>同一事件在不同市场可能作用于不同曲线。例如，工资上涨在彩电市场可通过成本改变彩电供给。技术偏向使用资本时，在产出给定且资本替代劳动的条件下，劳动市场的需求可能减少。\u003c/p>","keyTakeaway":"先确定所分析的市场，再判断冲击直接作用于买方还是卖方。","pitfall":"小麦歉收减少的是供给。随之出现的小麦涨价，使买方沿原需求曲线减少需求量。","example":"工厂因电价上涨而增加生产成本。在彩电售价不变时，企业愿卖的彩电减少，表现为彩电供给曲线左移。"},{"id":"equilibrium","title":"均衡价格与均衡数量","summary":"需求量与供给量相等的价格使市场出清。","bodyHtml":"\u003cp>均衡是相关变量相互作用后达到的相对稳定状态。在常见竞争市场模型中，\u003cmark>均衡价格\u003c/mark>是使 \u003cvar>Q\u003csub>d\u003c/sub>\u003c/var> 等于 \u003cvar>Q\u003csub>s\u003c/sub>\u003c/var> 的价格，\u003cmark>均衡数量\u003c/mark>是此价格下双方共同愿意交易的数量。图上均衡点位于需求曲线和供给曲线的交点。\u003c/p>\u003cp>在需求曲线向下、供给曲线向上且价格可调整的模型中，价格低于均衡价格时，需求量大于供给量，出现短缺，产生涨价压力。价格高于均衡价格时，供给量大于需求量，出现过剩，产生降价压力。\u003c/p>\u003cp>计算时先联立 \u003cvar>Q\u003csub>d\u003c/sub>\u003c/var> = \u003cvar>Q\u003csub>s\u003c/sub>\u003c/var> 求价格，再代入任一函数求数量，并检查价格和数量落在有效范围内。\u003c/p>","keyTakeaway":"判断短缺或过剩，要比较同一价格下的需求量和供给量。","pitfall":"需求曲线与供给曲线是两种数量关系。只有到达均衡点时，这两个计划数量才相等。","example":"若需求量为 100 − 2P，供给量为 20 + 2P，令两式相等得到 P = 20，再代回得到 Q = 60。若价格是 15，则需求量 70、供给量 50，短缺 20。"},{"id":"equilibrium-shifts","title":"供需变化后的新均衡","summary":"分别比较供给和需求对新均衡价格、数量的作用。","bodyHtml":"\u003cp>下表采用\u003cmark>向下的需求曲线、向上的供给曲线\u003c/mark>，并假定两个均衡都位于曲线的有效范围内。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>变动\u003c/th>\u003cth>均衡价格\u003c/th>\u003cth>均衡数量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>仅需求增加\u003c/td>\u003ctd>上升\u003c/td>\u003ctd>增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>仅需求减少\u003c/td>\u003ctd>下降\u003c/td>\u003ctd>减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>仅供给增加\u003c/td>\u003ctd>下降\u003c/td>\u003ctd>增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>仅供给减少\u003c/td>\u003ctd>上升\u003c/td>\u003ctd>减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需求、供给同时增加\u003c/td>\u003ctd>取决于相对变动\u003c/td>\u003ctd>增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需求、供给同时减少\u003c/td>\u003ctd>取决于相对变动\u003c/td>\u003ctd>减少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需求增加、供给减少\u003c/td>\u003ctd>上升\u003c/td>\u003ctd>取决于相对变动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需求减少、供给增加\u003c/td>\u003ctd>下降\u003c/td>\u003ctd>取决于相对变动\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>做题时分别画出每条曲线移动后的交点方向。两股作用方向一致时，可以判断结果方向。方向相反时，需要知道相对移动幅度或曲线形状，结果也可能不变。\u003c/p>","keyTakeaway":"需求单独增加，价格和数量都上升。供给单独增加，价格下降、数量上升。","pitfall":"需求曲线右移时，旧价格下新增的需求量通常大于均衡交易量的增幅。价格随均衡调整，买方会沿新需求曲线减少一部分购买量。","example":"原交易量是 1000。在旧价格上，收入增加使需求量变成 1400。供给不变且向上倾斜时，新均衡价格上升，成交量高于 1000、低于 1400。"},{"id":"price-controls","title":"最高限价与最低限价","summary":"判断价格管制是否生效，要将限价与无管制均衡价格比较。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>措施\u003c/th>\u003cth>产生约束的条件\u003c/th>\u003cth>常见目的\u003c/th>\u003cth>模型结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>最高限价\u003c/td>\u003ctd>上限低于均衡价格\u003c/td>\u003ctd>减轻消费者负担，或限制某项投入品价格以降低下游成本\u003c/td>\u003ctd>供不应求，可能出现排队、配给、额外收费或非正规交易，分配环节也可能滋生寻租\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最低限价（价格下限）\u003c/td>\u003ctd>下限高于均衡价格\u003c/td>\u003ctd>保护生产者收入或扶持某个产业\u003c/td>\u003ctd>供过于求，可能出现未售出的产量。政府收购是吸收过剩的一种办法\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>若最高限价高于均衡价格，或最低限价低于均衡价格，竞争市场仍可在原均衡价格成交。限价恰好等于原均衡价格时，也不会在原均衡点造成短缺或过剩。\u003c/p>","keyTakeaway":"低于均衡价格的上限造成短缺。高于均衡价格的下限造成过剩。","pitfall":"名称中的最高与最低，指允许交易的价格上限和下限。能否改变市场结果由它与均衡价格的关系决定。","example":"某市场的均衡价是 20 元。最高限价为 15 元时，愿买数量超过愿卖数量。若改设最低限价为 25 元，愿卖数量超过愿买数量。"},{"id":"market-surplus","title":"支付意愿、成本与交易剩余","summary":"买卖双方的交易收益可用成交价与各自的保留价格比较。","bodyHtml":"\u003cp>买方的\u003cstrong>支付意愿\u003c/strong>是愿意为该单位支付的最高价格。卖方的\u003cstrong>保留价格\u003c/strong>是愿意接受的最低价格，在基础竞争模型中可用出售该单位的机会成本表示。\u003c/p>\u003cul>\u003cli>\u003cstrong>消费者剩余\u003c/strong> = 支付意愿 − 实际支付价格。\u003c/li>\u003cli>\u003cstrong>生产者剩余\u003c/strong> = 实际收到的价格 − 卖方的机会成本。\u003c/li>\u003c/ul>\u003cp>在竞争市场中，若无外部性等市场失灵，且买卖双方以同一价格交易，交易通常由支付意愿较高的买家和成本较低的卖家完成，均衡使\u003cmark>消费者剩余与生产者剩余之和\u003c/mark>达到最大。\u003c/p>","keyTakeaway":"买方看最高愿付价，卖方看最低可接受价。两者的差额是该笔交易创造的总剩余。","pitfall":"竞争均衡最大化的是总剩余。成交价变化还可能改变总剩余在买卖双方之间的分配。","example":"顾客最多愿付 12 元，店家提供这件商品的机会成本是 7 元，成交价为 9 元。消费者剩余为 3 元，生产者剩余为 2 元，总剩余为 5 元。"}],"mindmap":[{"label":"需求","target":"demand","children":[{"label":"需求的含义","target":"demand","children":[{"label":"一定时期内，各价格下愿意且能够购买的数量关系","target":"demand"}]},{"label":"需求规律","target":"demand-law","children":[{"label":"其他条件不变时，需求量与本品价格通常反向变动","target":"demand-law"},{"label":"特殊情形为吉芬品","target":"demand-law"}]},{"label":"需求量变动与需求变动","target":"demand-shifts","children":[{"label":"本品价格变化引起沿需求曲线移动","target":"demand-law"},{"label":"其他因素变化可能使需求曲线移动","target":"demand-shifts"}]},{"label":"影响需求数量的因素","target":"demand-shifts","children":[{"label":"本品涨价通常减少需求量","target":"demand-law"},{"label":"收入增加时，正常品需求增加，低档品需求减少","target":"demand-shifts"},{"label":"偏好增强通常增加需求","target":"demand-shifts"},{"label":"替代品涨价使本品需求增加","target":"demand-shifts"},{"label":"互补品涨价使本品需求减少","target":"demand-shifts"},{"label":"预期涨价可能促使买方提前购买","target":"demand-shifts"},{"label":"品种、质量、广告、地点、季节、政策","target":"demand-shifts"}]}]},{"label":"供给","target":"supply","children":[{"label":"供给的含义","target":"supply","children":[{"label":"一定时期内，各价格下愿意且能够出售的数量关系","target":"supply"}]},{"label":"供给规律","target":"supply","children":[{"label":"其他条件不变时，供给量与本品价格通常同向变动","target":"supply"}]},{"label":"供给量变动与供给变动","target":"supply-shifts","children":[{"label":"本品价格变化引起沿供给曲线移动","target":"supply"},{"label":"其他因素变化可能使供给曲线移动","target":"supply-shifts"}]},{"label":"影响供给数量的因素","target":"supply-shifts","children":[{"label":"本品涨价通常增加供给量","target":"supply"},{"label":"生产成本提高通常减少供给","target":"supply-shifts"},{"label":"技术进步可降低成本、增加供给","target":"supply-shifts"},{"label":"卖方预期涨价且可延迟出售时，当期供给可能减少","target":"supply-shifts"},{"label":"相关商品价格、天气、政策","target":"supply-shifts"}]}]},{"label":"市场均衡","target":"equilibrium","children":[{"label":"均衡的含义","target":"equilibrium","children":[{"label":"相关变量相互作用，形成相对稳定的状态","target":"equilibrium"},{"label":"需求量等于供给量，市场出清","target":"equilibrium"}]},{"label":"市场均衡的变动","target":"equilibrium-shifts","children":[{"label":"需求单独变动时，价格与数量均同向","target":"equilibrium-shifts"},{"label":"供给单独变动时，价格反向、数量同向","target":"equilibrium-shifts"},{"label":"供需同时变动时，分别判断两种作用是否一致","target":"equilibrium-shifts"}]},{"label":"最高限价","target":"price-controls","children":[{"label":"上限低于均衡价时产生约束","target":"price-controls"},{"label":"减轻消费者负担或限制投入品价格","target":"price-controls"},{"label":"可能出现短缺、排队、配给、额外收费和非正规交易","target":"price-controls"}]},{"label":"最低限价","target":"price-controls","children":[{"label":"下限高于均衡价时产生约束","target":"price-controls"},{"label":"保护生产者收入或支持产业发展","target":"price-controls"},{"label":"产生过剩，政府收购可吸收多余供给","target":"price-controls"}]},{"label":"交易剩余","target":"market-surplus","children":[{"label":"消费者剩余等于最高愿付价减实际支付价格","target":"market-surplus"},{"label":"生产者剩余等于实际收到的价格减机会成本","target":"market-surplus"}]}]}]},"questions":[{"id":"eco-02-q01","number":1,"group":"需求","type":"discussion","stem":"经济学中货币需求是一种（　　）。","options":{"A":"主观意愿上的需求","B":"不受客观制约的资金需求","C":"社会学意义上的资金需求","D":"有支付能力的需求"},"answer":[],"explanationSupplement":"如果问的是商品的有效需求，购买意愿和支付能力必须同时成立，D 最接近这一定义。如果按货币理论理解「货币需求」，考查的是在一定条件下愿意持有多少货币余额，四个选项没有给出这一定义。两种理解的对象不同，本题用于辨析。","optionExplanations":{"A":"只有购买意愿，缺少支付能力条件。","B":"购买与货币持有决策都受预算、收入等约束。","C":"未给出经济学所需的行为条件或数量关系。","D":"指向商品有效需求，但还需同时具备购买意愿。"},"conceptId":"demand"},{"id":"eco-02-q02","number":2,"group":"需求","type":"single","stem":"引起一种商品需求曲线变动的因素不包括（　　）。","options":{"A":"商品本身的质量","B":"消费者的收入水平","C":"商品的价格","D":"消费者的偏好"},"answer":["C"],"explanationSupplement":"固定商品自身价格，观察每个价位下消费者愿意购买的数量是否改变。商品质量、收入和偏好都可能改变这个对应关系。若只有自身价格变动，所取的点会沿同一条曲线移动。","optionExplanations":{"A":"质量可改变购买意愿，使曲线移动。","B":"收入变化可改变同一价位的购买量。","C":"自身价格变化对应同一需求曲线上的点移动。","D":"偏好改变可移动整条需求曲线。"},"conceptId":"demand-shifts"},{"id":"eco-02-q03","number":3,"group":"需求","type":"single","stem":"一定时期内，甲商品的替代品和互补品的价格同时下降，二者引起甲商品的需求变动分别为30单位和20单位，则在这些因素的共同作用下，该时期甲商品的需求变动情况是（　　）。","options":{"A":"增加10单位","B":"减少10单位","C":"增加50单位","D":"减少50单位"},"answer":["B"],"explanationSupplement":"替代品降价，部分消费者改买替代品，甲需求变动为 −30。互补品降价，搭配购买的成本下降，甲需求变动为 +20。按题设把两项效应相加，净变动为 −10 单位。","optionExplanations":{"A":"差额大小是10，但方向应为减少。","B":"−30＋20＝−10，正确。","C":"两种效应方向相反，不能同向相加。","D":"互补品降价对甲的效应为正，不能把两项都记成减少。"},"conceptId":"demand-shifts"},{"id":"eco-02-q04","number":4,"group":"需求","type":"single","stem":"下列属于互补品的是（　　）。","options":{"A":"鼠标和鼠标垫","B":"隐形眼镜和眼镜框","C":"猪肉和牛肉","D":"汽车和自行车"},"answer":["A"],"explanationSupplement":"互补品通常可以搭配使用。鼠标降价后，更多人购买鼠标，可能带动鼠标垫的需求。商品关系取决于具体用途和市场，答题时判断哪一组最明确地需要配合使用。","optionExplanations":{"A":"鼠标与鼠标垫是常见搭配。","B":"隐形眼镜的使用不需要眼镜框。","C":"两种肉可在一些餐食中相互替换。","D":"两者可分别满足出行需要，题设未给出搭配使用关系。"},"conceptId":"demand-shifts"},{"id":"eco-02-q05","number":5,"group":"需求","type":"single","stem":"影响商品需求数量的最关键因素是（　　）。","options":{"A":"商品价格","B":"消费者收入","C":"预期","D":"消费者偏好"},"answer":["A"],"explanationSupplement":"在最基本的需求曲线里，先固定收入、预期和偏好，再考察商品自身价格与需求量的对应关系。「最关键」在这里指这个分析框架中的直接变量，不表示它在任意市场中的实际影响一定最大。","optionExplanations":{"A":"自身价格决定在给定需求曲线上取哪个点。","B":"收入是会移动曲线的非自身价格因素。","C":"预期变化可改变当前需求，但不是基本需求曲线的价格变量。","D":"偏好变化也可移动曲线。"},"conceptId":"demand-law"},{"id":"eco-02-q06","number":6,"group":"需求","type":"single","stem":"消费者收入一般是指社会的人均收入。一般来说，消费者收入变动与需求的变动（　　）。","options":{"A":"呈正方向变化","B":"呈反方向变化","C":"不相关","D":"完全等价"},"answer":["A"],"explanationSupplement":"按题意采用正常品的典型情形：同一价格下，收入增加会让正常品需求增加。低档品在相应收入区间可能呈相反方向。这里只判断方向，不要求收入与需求变动幅度相同。","optionExplanations":{"A":"符合正常品的收入效应方向。","B":"低档品可能如此，但并非题目的通常情形。","C":"收入是需求的重要影响因素。","D":"收入与需求是不同变量，同向变化不等于完全等价。"},"conceptId":"demand-shifts"},{"id":"eco-02-q07","number":7,"group":"需求","type":"single","stem":"在其他条件不变的情况下，某种商品的需求（　　）。","options":{"A":"随着替代商品价格的提高而减少","B":"随着替代商品价格的提高而增加","C":"随着偏好的增加而减少","D":"随着互补品价格下降而减少"},"answer":["B"],"explanationSupplement":"替代品变贵，消费者较愿意转向本商品，需求向右移动。互补品变便宜会降低搭配购买的总成本，也可能提高本商品需求。","optionExplanations":{"A":"替代品涨价对本商品通常产生正向影响。","B":"替代品涨价使本商品相对便宜，需求增加。","C":"更偏爱本商品通常使需求增加。","D":"互补品降价通常使本商品需求增加。"},"conceptId":"demand-shifts"},{"id":"eco-02-q08","number":8,"group":"需求","type":"single","stem":"下列因素中，能够导致某种商品需求曲线上的点发生移动的是（　　）。","options":{"A":"消费者收入","B":"该商品的成本","C":"该商品的税率","D":"该商品自身的价格"},"answer":["D"],"explanationSupplement":"题目问的是一条给定需求曲线上的点如何换位置。沿曲线读取不同需求量时，变化的是商品自身价格。生产条件、税率变化可能间接影响市场结果，分析时要把它们同图上直接改变的价格区分开。","optionExplanations":{"A":"收入改变可能使需求曲线整体移动。","B":"生产成本首先影响供给。","C":"税率不属于给定需求曲线上的自身价格轴变量。","D":"自身价格改变让取点沿该需求曲线移动。"},"conceptId":"demand-law"},{"id":"eco-02-q09","number":9,"group":"需求","type":"single","stem":"下列（　　）体现了需求规律。","options":{"A":"药品的价格上涨，使药品质量得到了提高","B":"汽油的价格提高，小汽车的销售量减少","C":"照相机价格下降，导致销售量增加","D":"丝绸价格提高，游览公园的人数增加"},"answer":["C"],"explanationSupplement":"需求规律比较同一商品的自身价格与需求量，且保持其他条件不变。照相机价格下降并带来销量上升，是题目给出的直接例子。","optionExplanations":{"A":"描述了价格和质量，没有给出需求量。","B":"汽油与小汽车是两种商品，考查互补关系。","C":"同一商品的价格下降，需求量增加。","D":"比较了不同对象，没有体现自身价格与需求量关系。"},"conceptId":"demand-law"},{"id":"eco-02-q10","number":10,"group":"需求","type":"single","stem":"两种互补品中的一种商品的价格下降，将导致另一种商品的（　　）上升。","options":{"A":"需求量","B":"需求","C":"价格","D":"均衡价格"},"answer":["B"],"explanationSupplement":"对另一种商品而言，互补品价格属于非自身价格因素。它降价会让另一种商品在各自给定价格下更受欢迎，直接影响是需求曲线右移。是否以及如何传导到成交价格，需要再给出供给条件。","optionExplanations":{"A":"给定价格时需求量可以增加，但应将这里的整个对应关系变化表述为需求增加。","B":"互补品变便宜，使另一种商品的需求上升。","C":"价格要由市场供求共同决定，不能由互补关系单独推出。","D":"要讨论均衡价格还需要另一种商品供给的条件。"},"conceptId":"demand-shifts"},{"id":"eco-02-q11","number":11,"group":"需求","type":"single","stem":"对于大白菜供给的减少，不可能是由于（　　）。","options":{"A":"大白菜的价格下降","B":"化肥价格上涨","C":"政策限制大白菜的种植","D":"气候异常严寒"},"answer":["A"],"explanationSupplement":"题目问供给曲线为什么左移。白菜自身降价会使供给量沿原曲线下降；投入成本、种植限制和气候变化都可能使同一白菜价格下愿意并能够出售的数量减少。","optionExplanations":{"A":"自身价格下降引起沿供给曲线的供给量变化。","B":"化肥涨价可提高成本并使供给曲线左移。","C":"种植限制可压低同一价格下的可供数量。","D":"严寒可能使产量减少，从而影响供给曲线。"},"conceptId":"supply-shifts"},{"id":"eco-02-q12","number":12,"group":"需求","type":"single","stem":"如果两种商品是互补关系，则一种商品的需求量与另一种商品的价格之间是（　　）。","options":{"A":"反方向变动关系","B":"同方向变动关系","C":"没有关系","D":"难以确定"},"answer":["A"],"explanationSupplement":"固定本商品价格，互补品变贵意味着组合使用更贵，因此本商品需求量往往降低。这个比较对应负的需求交叉价格效应。","optionExplanations":{"A":"互补品价格上升会压低本商品的需求量。","B":"同向是替代品的典型关系。","C":"两种商品的搭配关系会传导价格影响。","D":"在其他条件固定时，互补关系已经给出方向。"},"conceptId":"demand-shifts"},{"id":"eco-02-q13","number":13,"group":"需求","type":"single","stem":"在得出某种商品的需求曲线时，下列因素除哪一种外是常数？（　　）","options":{"A":"消费者的收入","B":"其他商品的价格","C":"消费者的偏好","D":"商品本身的价格"},"answer":["D"],"explanationSupplement":"画一条给定的需求曲线时，保持收入、其他商品价格和偏好等条件不变，逐个改变本商品的价格并读取对应需求量。","optionExplanations":{"A":"收入固定。","B":"其他商品价格固定。","C":"偏好固定。","D":"自身价格变化用于产生不同的需求量观察点。"},"conceptId":"demand-law"},{"id":"eco-02-q14","number":14,"group":"需求","type":"single","stem":"如果商品A和商品B是互相替代的，则A的价格上升将导致（　　）。","options":{"A":"商品A的需求曲线向右移动","B":"商品A的需求曲线向左移动","C":"商品B的需求曲线向右移动","D":"商品B的需求曲线向左移动"},"answer":["C"],"explanationSupplement":"同一次 A 涨价，对 A 自身来说是沿原曲线移动；对 B 来说，A 是替代品，其涨价会提高 B 在各价格下的需求，使 B 的曲线右移。","optionExplanations":{"A":"A 自身涨价不使 A 曲线右移。","B":"A 自身涨价不使 A 曲线左移。","C":"消费者转向相对便宜的 B，B 的需求曲线右移。","D":"替代品 A 涨价会使 B 需求增加，方向与此项相反。"},"conceptId":"demand-shifts"},{"id":"eco-02-q15","number":15,"group":"需求","type":"single","stem":"一种商品价格下降对其互补品最直接的影响是（　　）。","options":{"A":"互补品的需求曲线向左移动","B":"互补品的需求曲线向右移动","C":"互补品的供给曲线向右移动","D":"互补品的价格下降"},"answer":["B"],"explanationSupplement":"互补品被搭配使用，任一商品降价会降低组合购买成本。另一种商品在同一价格下的需求增加，因此其需求曲线右移。","optionExplanations":{"A":"需求增加对应右移。","B":"另一种商品在各个给定价格下的需求增加。","C":"该机制影响购买意愿，未给出供给条件变化。","D":"均衡价格须再分析另一种商品的供给。"},"conceptId":"demand-shifts"},{"id":"eco-02-q16","number":16,"group":"需求","type":"discussion","stem":"关于决定需求的基本因素，以下表述错误的是（　　）。","options":{"A":"价格和需求的变动呈反方向发展","B":"价格是影响需求的最重要的因素","C":"如果预期价格将下跌，许多消费者会提前购买","D":"互补商品中，一种商品价格上升，会引起另一种商品需求随之降低"},"answer":[],"explanationSupplement":"C 把预期的作用方向说反了：在可以择时的购买中，预计未来降价通常会促使消费者等待。A 把「需求量」写成「需求」，严格区分时也有问题。题干要求选择一个错误项，因而保留为讨论题。","optionExplanations":{"A":"严格说，自身价格与需求量通常反向变化；需求曲线不因自身价格而平移。","B":"在基本需求曲线框架中，自身价格是直接比较的变量。","C":"通常预期未来降价会延后购买。","D":"其他条件不变时，互补品涨价会压低本商品的需求。"},"conceptId":"demand-shifts"},{"id":"eco-02-q17","number":17,"group":"需求","type":"single","stem":"保持所有其他因素不变，某种商品的价格下降，将导致（　　）。","options":{"A":"需求量增加","B":"需求量减少","C":"需求增加","D":"需求减少"},"answer":["A"],"explanationSupplement":"按通常向右下方倾斜的需求曲线，自身价格下降使选取的点沿曲线向右下移动，读取到更高的需求量。其他决定因素固定，整条需求曲线保持不变。","optionExplanations":{"A":"价格下降沿原需求曲线对应较高的需求量。","B":"与通常的需求规律方向相反。","C":"需求增加指整条曲线右移，本题没有这种变化。","D":"需求减少指整条曲线左移，本题没有这种变化。"},"conceptId":"demand-law"},{"id":"eco-02-q18","number":18,"group":"需求","type":"single","stem":"据统计，自去年9月份以来，纯碱价格已经从1400元/吨左右上调至2200元/吨左右，涨幅约60%。假设纯碱与甲商品是替代品，与乙商品是互补品。那么在其他条件不变的情况下，以下说法正确的是（　　）。","options":{"A":"甲商品需求会增加，乙商品需求会增加","B":"甲商品需求会减少，乙商品需求会减少","C":"甲商品需求会增加，乙商品需求会减少","D":"甲商品需求会减少，乙商品需求会增加"},"answer":["C"],"explanationSupplement":"价格数字是题设背景，只需要判断纯碱涨价。甲可替代纯碱，需求增加；乙需要与纯碱搭配使用，组合成本提高，需求减少。","optionExplanations":{"A":"甲的方向正确，乙应减少。","B":"乙的方向正确，甲应增加。","C":"替代品需求增加，互补品需求减少。","D":"甲与乙的变动方向都相反。"},"conceptId":"demand-shifts"},{"id":"eco-02-q19","number":19,"group":"需求","type":"single","stem":"商品的需求程度在不同的情况下是不同的，下列情况中，构成商品有效需求的是（　　）。","options":{"A":"乙失手打碎了水杯，他计划下班后到超市再买一个","B":"甲就读某小学5年纪，看到时尚的平板电脑，也想买一台","C":"一家企业信誉极好，账户流动资金充裕，但无意于房地产市场，因此婉拒了很多投资邀请","D":"一家企业已经连续3个月没有发工资，为了弥补员工流动，将工资上调再招聘一批新员工"},"answer":["A"],"explanationSupplement":"有效需求同时要求想买和买得起。在给出的选项中，A 的具体购买计划最符合题意，题目默认日常购物有相应的支付能力。只表达想要，或有钱却不打算买，都不够。","optionExplanations":{"A":"给出了具体的购买计划，按日常场景理解具备购买能力。","B":"只说明想要，没有给出支付能力。","C":"有资金，但缺少购买意愿。","D":"有招聘意愿，但拖欠工资且未表明具备支付能力。"},"conceptId":"demand"},{"id":"eco-02-q20","number":20,"group":"需求","type":"single","stem":"影响需求变动的主要因素不包括（　　）。","options":{"A":"生产技术","B":"消费者偏好","C":"替代品的价格","D":"互补品的价格"},"answer":["A"],"explanationSupplement":"先判断冲击来自买方还是卖方。生产技术改变的是厂商的成本和可供数量，属于供给因素。偏好、替代品与互补品价格都能改变消费者在给定价格下的购买选择。","optionExplanations":{"A":"生产技术直接影响供给。","B":"消费者偏好会改变购买意愿。","C":"替代品价格会改变消费者在相关商品间的选择。","D":"互补品价格会改变搭配使用的成本。"},"conceptId":"demand-shifts"},{"id":"eco-02-q21","number":21,"group":"需求","type":"single","stem":"需求量和价格之所以呈反方向变化，是因为（　　）。","options":{"A":"替代效应的作用","B":"收入效应的作用","C":"上述两种效用同时发生作用","D":"两种效应不同时交替作用"},"answer":["C"],"explanationSupplement":"自身价格变化同时改变相对价格和实际购买力。总效应可分解为替代效应与收入效应。正常品的两种效应同向；低档品的收入效应可反向，若强到超过替代效应，就可能出现吉芬品的例外。","optionExplanations":{"A":"只说明相对价格机制，缺少实际购买力机制。","B":"只说明购买力机制，缺少相对价格机制。","C":"这里的「效用」按题意指两种效应，共同决定总效应。","D":"两者是对同一次价格变动的分解，不是轮流发生。"},"conceptId":"demand-law"},{"id":"eco-02-q22","number":22,"group":"供给","type":"single","stem":"当达到市场均衡时，买者是支付愿望（　　）的人，卖者是成本（　　）的人。（2019）","options":{"A":"最高、最高","B":"最高、最低","C":"最低、最高","D":"最低、最低"},"answer":["B"],"explanationSupplement":"在标准竞争市场模型中，均衡价筛选出支付意愿不低于该价格的买者，以及成本不高于该价格的卖者。实际成交的单位来自支付意愿较高、成本较低的一侧。生产者剩余按「成交价 − 卖方成本」计算；在没有外部性等市场失灵的基准下，竞争均衡最大化的是总剩余。","optionExplanations":{"A":"高成本卖者的参与优先级较低。","B":"交易优先发生在愿意出价较高的买者和成本较低的卖者之间。","C":"两边的方向都相反。","D":"低成本方向正确，但买者应是支付意愿较高的人。"},"conceptId":"market-surplus"},{"id":"eco-02-q23","number":23,"group":"供给","type":"single","stem":"彩电行业工人工资的提高，将会导致（　　）。","options":{"A":"彩电供给曲线左移，并使得彩电价格上升","B":"彩电供给曲线右移，并使得彩电价格下降","C":"彩电需求曲线左移，并使得彩电价格下降","D":"彩电需求曲线右移，并使得彩电价格上升"},"answer":["A"],"explanationSupplement":"工资属于企业的投入成本。其他条件不变，工资上涨使厂商在各给定价格下愿意出售的彩电减少，供给曲线左移。与原有向下倾斜的需求曲线相交时，新均衡价格上升。","optionExplanations":{"A":"投入成本提高使供给减少，均衡价上升。","B":"此方向通常对应生产成本下降。","C":"工资变动首先影响彩电行业的生产成本。","D":"题目没有给出彩电购买者偏好或收入变化。"},"conceptId":"supply-shifts"},{"id":"eco-02-q24","number":24,"group":"供给","type":"single","stem":"某一时期科技进步很快，人们越来越倾向于资本密集生产方式，这将导致（　　）。","options":{"A":"劳动的供给曲线向右移动","B":"劳动的需求曲线向右移动","C":"劳动的供给曲线向左移动","D":"劳动的需求曲线向左移动"},"answer":["D"],"explanationSupplement":"按题目的替代机制理解：生产规模等条件不变时，厂商以资本替代部分劳动，在给定工资下减少用工，劳动需求曲线左移。若技术进步也扩大产出或提高某些劳动的生产率，实际劳动需求的总变化还要比较这些机制。","optionExplanations":{"A":"该冲击来自雇主的生产方式，未直接改变劳动者提供劳动的意愿。","B":"产出扩大等效应可能提高用工，但题目考查资本替代劳动。","C":"题设改变的是用工需求条件。","D":"在资本替代劳动、其他条件不变的假设下，劳动需求减少。"},"conceptId":"demand-shifts"},{"id":"eco-02-q25","number":25,"group":"供给","type":"single","stem":"下列哪一项不是商品供给曲线移动的原因？（　　）","options":{"A":"自然环境","B":"技术水平","C":"商品价格","D":"生产要素价格"},"answer":["C"],"explanationSupplement":"价格轴是该商品自身价格。改变它只会沿同一条供给曲线取点。自然环境、技术和生产要素价格可能改变每一价格下的生产或出售数量，所以会影响整条供给曲线。","optionExplanations":{"A":"环境可改变生产能力。","B":"技术可改变单位成本和产量。","C":"商品自身价格变化只改变曲线上的取点。","D":"工资、原材料价格等属于投入条件。"},"conceptId":"supply-shifts"},{"id":"eco-02-q26","number":26,"group":"供给","type":"single","stem":"小麦歉收导致小麦价格上升，准确地说在这个过程中（　　）。","options":{"A":"小麦供给的减少引起需求量下降","B":"小麦供给的减少引起需求下降","C":"小麦供给量的减少引起需求量下降","D":"小麦供给量的减少引起需求下降"},"answer":["A"],"explanationSupplement":"分两步看。歉收让任一价格下可出售的小麦减少，供给曲线先左移。新均衡价上升，消费者沿原需求曲线减少购买量。因此供给变了，需求量变了。","optionExplanations":{"A":"准确对应供给曲线左移和沿需求曲线的取点变化。","B":"均衡价变化不使需求曲线平移。","C":"歉收在同一价格下改变可供数量，属于供给变化。","D":"既误把供给平移当作沿线取点，又误把需求量变化当作需求变化。"},"conceptId":"equilibrium-shifts"},{"id":"eco-02-q27","number":27,"group":"市场均衡理论","type":"single","stem":"政府为了扶持农业，对农产品规定了高于其均衡价格的支持价格。政府为了维持支持价格，应该采取的相应措施是（　　）。","options":{"A":"增加对农产品的税收","B":"对农产品生产者给予补贴","C":"收购过剩的农产品","D":"实行农产品配给制"},"answer":["C"],"explanationSupplement":"题目设定的支持价高于均衡价。在这个最低价上，厂商愿卖的数量大于消费者愿买的数量。按支持价收购剩余产品可以吸收这个差额。这是价格下限模型的推论，题目未涉及具体政策规定。","optionExplanations":{"A":"加税不直接吸收给定价格下的过剩产量。","B":"直接补贴生产可能进一步增加供给。","C":"收购剩余数量可以使厂商按支持价出售产品。","D":"配给通常分配短缺商品，题目出现的是过剩。"},"conceptId":"price-controls"},{"id":"eco-02-q28","number":28,"group":"市场均衡理论","type":"single","stem":"以纵轴代表价格、横轴代表产量绘制某种农业产品的需求曲线和供给曲线，假设其他条件不变，当生产成本上升时，在坐标图上就表现为这种农产品的（　　）。","options":{"A":"供给曲线将向左移动","B":"需求曲线将向左移动","C":"需求曲线将向右移动","D":"供给曲线将向右移动"},"answer":["A"],"explanationSupplement":"先固定纵轴上的一个价格。成本上升后，厂商愿意供应的数量变小，所以点落在原供给点左侧。对各个价格做同样的比较，就得到供给曲线向左移动。","optionExplanations":{"A":"给定价格下愿意提供的数量减少。","B":"生产成本冲击直接影响卖方供给。","C":"成本变化未改变买者的购买意愿。","D":"右移表示供给增加，方向相反。"},"conceptId":"supply-shifts"},{"id":"eco-02-q29","number":29,"group":"市场均衡理论","type":"single","stem":"当某种生活必需品的市场价格上涨幅度过大时，为保障大多数消费者的基本生活稳定，政府采取最高限价进行干预，可能导致的结果是（　　）。","options":{"A":"政府储备增加","B":"供给过多","C":"生产成本上升","D":"供给短缺"},"answer":["D"],"explanationSupplement":"最高限价低于原均衡价格时才会限制成交价格。在这个较低价位，需求量大于供给量，差额就是短缺。若限价高于均衡价，原均衡可照常实现。","optionExplanations":{"A":"限价不会直接增加政府库存。","B":"有效的价格下限可能导致过剩，价格上限的典型结果是短缺。","C":"限价本身改变成交价格的约束，不能据此推出投入成本上升。","D":"在具约束力的最高限价下，愿买数量超过愿卖数量。"},"conceptId":"price-controls"},{"id":"eco-02-q30","number":30,"group":"市场均衡理论","type":"discussion","stem":"假如耐用消费品的需求函数为 Q＝400−5P 时的均衡价格是50，当需求函数变为 Q′＝600−5P 时，（假设供给不变）均衡价格将（　　）。","options":{"A":"低于50","B":"高于50","C":"等于50","D":"上升"},"answer":[],"explanationSupplement":"需求函数的截距增加了200。旧均衡价格50处，旧需求量150，新需求量350，原供给量仍为150。按通常供给曲线和唯一均衡的假设，新的均衡价会上升。因此「高于50」和「上升」表达相同结论，无法给出唯一选项。","optionExplanations":{"A":"需求右移导致旧价格下出现超额需求。","B":"在标准模型下结论正确，等价于 D。","C":"旧价位已不再使供给量等于需求量。","D":"与 B 表达相同结论，因此单选题没有唯一答案。"},"conceptId":"equilibrium-shifts"},{"id":"eco-02-q31","number":31,"group":"市场均衡理论","type":"single","stem":"当某种商品的需求和供给出现同时减少的情况时，那么（　　）。","options":{"A":"均衡价格下降，均衡产量减少","B":"均衡价格下降，均衡产量无法确定","C":"均衡价格上升，均衡产量减少","D":"均衡价格无法确定，均衡产量减少"},"answer":["D"],"explanationSupplement":"先拆开两个冲击。需求减少使均衡价下降、交易量减少；供给减少使均衡价上升、交易量也减少。两个冲击的数量效应同向，价格效应反向，须看移动幅度才能确定最终价格方向。","optionExplanations":{"A":"数量结论正确，价格下降需要需求收缩的价格效应更强。","B":"两次左移都减少数量，不能说数量无法确定。","C":"数量结论正确，价格上涨需要供给收缩的价格效应更强。","D":"两种冲击同时压低均衡量，对价格的作用方向相反。"},"conceptId":"equilibrium-shifts"},{"id":"eco-02-q32","number":32,"group":"市场均衡理论","type":"single","stem":"已知当某种商品的均衡价格是1元钱的时候，均衡交易量是1000单位。现假定买者收入的增加使这种商品的需求量增加了400单位，那么在新的均衡价格水平上，买者的购买量是（　　）。","options":{"A":"1000单位","B":"多于1000单位但小于1400单位","C":"1400单位","D":"以上均不对"},"answer":["B"],"explanationSupplement":"在标准模型中，400 是按旧价格1元计算的需求增量。给定向上倾斜的供给与向下倾斜的需求，供给不变时新均衡价高于1元。供给沿原曲线增加，所以新成交量超过1000；需求沿新曲线因涨价回落，所以低于旧价处的1400。","optionExplanations":{"A":"在通常向上倾斜的供给下，均衡价上涨也会提高成交量。","B":"新成交量介于旧均衡量与旧价下的新需求量之间。","C":"1400 是维持旧价格时想买的数量。","D":"标准曲线与供给不变的条件下 B 成立。"},"conceptId":"equilibrium-shifts"},{"id":"eco-02-q33","number":33,"group":"市场均衡理论","type":"single","stem":"均衡价格随着（　　）。","options":{"A":"需求和供给的增加而上升","B":"需求和供给的减少而上升","C":"需求的减少和供给的增加而上升","D":"需求的增加和供给的减少而上升"},"answer":["D"],"explanationSupplement":"需求增加向上推价格，供给减少也向上推价格。两种冲击都提高均衡价格，因此无需知道它们各自的幅度即可判断价格上升。","optionExplanations":{"A":"需求增加推高价格，供给增加压低价格。","B":"需求减少压低价格，供给减少推高价格。","C":"两项作用都压低均衡价格。","D":"两项作用都推高均衡价格。"},"conceptId":"equilibrium-shifts"},{"id":"eco-02-q34","number":34,"group":"市场均衡理论","type":"single","stem":"下列哪种情况不正确？（　　）","options":{"A":"如果供给减少，需求不变，均衡价格将上升","B":"如果供给增加，需求减少，均衡价格将下降","C":"如果需求增加，供给减少，均衡价格将上升","D":"如果需求减少，供给增加，均衡价格将上升"},"answer":["D"],"explanationSupplement":"注意题目选不正确的。需求减少使买方出价压力降低，供给增加使给定价格下的供应增加，两项冲击均压低均衡价格，D 把方向说反了。","optionExplanations":{"A":"供给曲线左移会抬高均衡价格。","B":"供给增加和需求减少都压低均衡价格。","C":"需求增加和供给减少都抬高均衡价格。","D":"需求减少和供给增加都压低价格，所以本项不正确。"},"conceptId":"equilibrium-shifts"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","hr <script>(function (global) {
  'use strict';
  let activeController = null;

  function grade(question, selected) {

  function recordAttempt(state, question, selected, at) {

      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,

    };
    return true;
  }
  function testSummary(questions, drafts) {

    });
    return summary;
  }
  function submitTest(state, questions, at) {

    state.test.submitted = true;
    return true;
  }

    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {

    };
    function state() {

      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;

      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();

      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));

      });
      toolbar.append(tabs);

      toolbar.append(stats); root.append(toolbar);

      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;

          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;

        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;
        }
        const label = el('label', 'quiz-option');
        const input = el('input'); input.type = q.type === 'multiple' ? 'checkbox' : 'radio'; input.name = 'quiz-answer'; input.value = key;
        input.checked = selected.includes(key); input.disabled = show; input.dataset.qid = q.id;
        if (show && q.answer.includes(key)) label.classList.add('correct');
        if (show && selected.includes(key) && !q.answer.includes(key)) label.classList.add('wrong');
        label.append(input, el('span', '', `${key}. ${text}`)); field.append(label);
      }); card.append(field);
      if (mode === 'wrong' && s.answers[q.id] && s.answers[q.id].correct) card.append(el('p', 'quiz-status quiz-correct', '最近一次已答对 · 已掌握，历史错题仍保留'));
      const actions = el('div', 'quiz-actions');
      const nav = el('div', 'quiz-nav');
      const questionIndex = list.findIndex((item) => item.id === q.id);
      const prev = button('上一题', 'previous'); prev.disabled = questionIndex <= 0;
      const next = button('下一题', 'next'); next.disabled = questionIndex >= list.length - 1;
      nav.append(prev, next); actions.append(nav);
      if (discussion) {

      } else if (mode !== 'test') {

      if (mode === 'test' && !s.test.submitted) {
        const foot = el('div', 'quiz-actions');
        foot.append(el('p', 'muted', '未答题交卷后记为未作答，不加入错题本。'), button('交卷并查看解析', 'finish-test', 'button button-primary'));

    function renderTestSummary(s) {

      } else box.append(el('span', '', `已选择 ${summary.answered} / ${summary.total} 题 · 测试中不显示答案，随时可切换题号。`));

        feedback.append(el('p', '', details.join('')));

      feedback.append(el('h4', '', '解题思路'), el('p', '', q.explanationSupplement || '请结合对应知识点复习。'));
      if (q.optionExplanations && Object.keys(q.optionExplanations).length) {

      }
      const links = el('div', 'quiz-actions'); const jump = button('回看对应知识点', 'concept'); jump.dataset.concept = q.conceptId;
      links.append(jump); feedback.append(links); card.append(feedback);
    }
    function handleClick(event) {

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

(() => {
  'use strict';
  const byId = name => document.getElementById('market-' + name);
  const priceInput = byId('price');
  const demandInput = byId('demand');
  const supplyInput = byId('supply');
  const controls = [priceInput, demandInput, supplyInput];
  const x = quantity => 54 + 3 * quantity;
  const y = price => 296 - 6.75 * price;
  const demand = (price, shift) => 100 + shift - 2 * price;
  const supply = (price, shift) => 20 + shift + 2 * price;
  const curve = (fn, shift) => `M${x(fn(0, shift))} ${y(0)}L${x(fn(40, shift))} ${y(40)}`;
  const signed = number => number > 0 ? '+' + number : String(number);
  const eqPrice = (demandShift, supplyShift) => (80 + demandShift - supplyShift) / 4;

  function setPoint(element, attributes) {
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
  }

  function draw() {
    const [price, demandShift, supplyShift] = controls.map(input => input.valueAsNumber);
    const balancedPrice = eqPrice(demandShift, supplyShift);
    const balancedQuantity = demand(balancedPrice, demandShift);
    const demandQuantity = demand(price, demandShift);
    const supplyQuantity = supply(price, supplyShift);
    const gap = demandQuantity - supplyQuantity;
    byId('demand-curve').setAttribute('d', curve(demand, demandShift));
    byId('supply-curve').setAttribute('d', curve(supply, supplyShift));
    byId('demand-before').classList.toggle('market-inactive', demandShift === 0);
    byId('supply-before').classList.toggle('market-inactive', supplyShift === 0);
    byId('price-guide').setAttribute('d', `M54 ${y(price)}H${x(Math.max(demandQuantity, supplyQuantity))}`);
    byId('equilibrium-guide').setAttribute('d', `M54 ${y(balancedPrice)}H${x(balancedQuantity)}V296`);
    setPoint(byId('equilibrium-point'), { cx: x(balancedQuantity), cy: y(balancedPrice) });
    setPoint(byId('equilibrium-label'), { x: x(balancedQuantity) + 12, y: y(balancedPrice) - 10 });
    setPoint(byId('qd-point'), { cx: x(demandQuantity), cy: y(price) });
    setPoint(byId('qs-point'), { x: x(supplyQuantity) - 5, y: y(price) - 5 });
    byId('qd-point').classList.toggle('market-inactive', gap === 0);
    byId('qs-point').classList.toggle('market-inactive', gap === 0);
    byId('price-value').value = String(price);
    byId('demand-value').value = signed(demandShift);
    byId('supply-value').value = signed(supplyShift);
    byId('qd').textContent = String(demandQuantity);
    byId('qs').textContent = String(supplyQuantity);
    const equilibrium = `均衡价格 ${balancedPrice} · 均衡数量 ${balancedQuantity}`;
    const explanation = gap > 0 ? `当前价格下短缺 ${gap} 单位，需求量大于供给量。` :
      gap < 0 ? `当前价格下过剩 ${-gap} 单位，供给量大于需求量。` :
      '当前价格下供需相等，市场达到均衡。';
    if (byId('equilibrium').textContent !== equilibrium) byId('equilibrium').textContent = equilibrium;
    if (byId('gap').textContent !== explanation) byId('gap').textContent = explanation;
  }

  controls.forEach(input => input.addEventListener('input', draw));
  byId('match').addEventListener('click', () => {
    priceInput.value = eqPrice(demandInput.valueAsNumber, supplyInput.valueAsNumber);
    draw();
  });
  byId('reset').addEventListener('click', () => {
    controls.forEach(input => input.value = input.defaultValue);
    draw();
  });
  byId('demand-before').setAttribute('d', curve(demand, 0));
  byId('supply-before').setAttribute('d', curve(supply, 0));
  draw();
})();

        msg = `有效最低限价（P=${pc} > 30）：供给量 ${qs} 大于需求量 ${qt}，市场出现 ${qs - qt} 单位过剩，实际仅成交 ${qt} 单位并产生无谓损失。`;
      } else if (mode === 'free') {
        msg = '自由均衡点 E（P*=30, Q*=40）：消费者剩余 CS 与生产者剩余 PS 之和达到最大，无谓损失 DWL = 0。';
      } else {
        msg = mode === 'ceiling'
          ? `最高限价 P=${pc} 高于或等于均衡价 30，不具有约束力，市场仍停留在均衡点 E。`
          : `最低限价 P=${pc} 低于或等于均衡价 30，不具有约束力，市场仍停留在均衡点 E。`;
      }

      const pdAtQt = 50 - 0.5 * qt;
      const psAtQt = 10 + 0.5 * qt;
      const dwl = effective ? 0.5 * (pdAtQt - psAtQt) * (40 - qt) : 0;
      root.querySelector('[data-role="cs"]').setAttribute('points', pts([[0, 50], [0, pEff], [qt, pEff], [qt, pdAtQt]]));
      root.querySelector('[data-role="ps"]').setAttribute('points', pts([[0, 10], [0, pEff], [qt, pEff], [qt, psAtQt]]));
      root.querySelector('[data-role="dwl"]').setAttribute('points', effective ? pts([[qt, pdAtQt], [40, 30], [qt, psAtQt]]) : '');
      root.querySelector('[data-role="qt"]').textContent = String(qt);
      root.querySelector('[data-role="dwl-val"]').textContent = fmt(dwl, 0);
      root.querySelector('[data-role="msg"]').textContent = msg;
    }

      if (r.value === 'floor' && pIn.valueAsNumber <= 30) pIn.value = '38';
      draw();
    }));
    pIn.addEventListener('input', draw);
    draw();
  }

            <path class="mv-ref-ic" data-role="iq-high"/>

            <div><span>最优 (L*, K*)</span><strong data-role="lk">15, 15</strong></div>
            <div><span>最大产量 Q*</span><strong data-role="q-val">15.0</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
          <div class="button-row"><button type="button" class="button button-secondary" data-role="reset">重置</button></div>
        </div>
      </div>`;

    const x = v => X0 + (v / 60) * W;
    const y = v => Y0 - (v / 50) * H;
    const cIn = root.querySelector('[data-role="cost"]');
    const wIn = root.querySelector('[data-role="w"]');
    const iqPath = q => {
      const lStart = Math.max(1.2, (q * q) / 48);
      const lEnd = Math.min(58, (q * q) / 1.5);
      if (lStart >= lEnd) return '';
      return samplePath(vl => (q * q) / vl, lStart, lEnd, 60, x, y);
    };
    root.querySelector('[data-role="ic0"]').setAttribute('d', `M${x(0)} ${y(30)} L${x(30)} ${y(0)}`);

    function draw() {
      const C = cIn.valueAsNumber, w = wIn.valueAsNumber;
      const lMax = C / w, kMax = C / rPrice;
      const lOpt = C / (2 * w), kOpt = C / (2 * rPrice);
      const q = Math.sqrt(lOpt * kOpt);
      const lAtTop = Math.max(0, (C - rPrice * 50) / w);
      const kAtLeft = Math.min(50, kMax);
      const lAtBot = Math.min(60, lMax);
      const kAtRight = Math.max(0, (C - w * 60) / rPrice);
      root.querySelector('[data-role="ic"]').setAttribute('d', `M${x(lAtTop).toFixed(1)} ${y(kAtLeft).toFixed(1)} L${x(lAtBot).toFixed(1)} ${y(kAtRight).toFixed(1)}`);
      root.querySelector('[data-role="iq-opt"]').setAttribute('d', iqPath(q));
      root.querySelector('[data-role="iq-low"]').setAttribute('d', iqPath(q * 0.72));
      root.querySelector('[data-role="iq-high"]').setAttribute('d', iqPath(q * 1.28));
      root.querySelector('[data-role="guide"]').setAttribute('d', `M${X0} ${y(kOpt).toFixed(1)} H${x(lOpt).toFixed(1)} V${Y0}`);
      root.querySelector('[data-role="pt"]').setAttribute('cx', x(lOpt).toFixed(1));
      root.querySelector('[data-role="pt"]').setAttribute('cy', y(kOpt).toFixed(1));
      root.querySelector('[data-role="lbl"]').setAttribute('x', (x(lOpt) + 10).toFixed(1));
      root.querySelector('[data-role="lbl"]').setAttribute('y', (y(kOpt) - 10).toFixed(1));
      root.querySelector('[data-role="c-out"]').value = String(C);
      root.querySelector('[data-role="w-out"]').value = fmt(w, 1);
      root.querySelector('[data-role="lk"]').textContent = `${fmt(lOpt, 1)}, ${fmt(kOpt, 1)}`;
      root.querySelector('[data-role="q-val"]').textContent = fmt(q, 1);
      root.querySelector('[data-role="msg"]').textContent = `切点 E 满足 MRTS_LK = MP_L/MP_K = w/r = ${fmt(w / rPrice, 2)}。给定成本 C=${C} 时达到最大产量 Q*=${fmt(q, 1)}（工资上涨会促使厂商用资本替代劳动）。`;
    }
    cIn.addEventListener('input', draw);
    wIn.addEventListener('input', draw);
    root.querySelector('[data-role="reset"]').addEventListener('click', () => { cIn.value = '60'; wIn.value = '2'; draw(); });
    draw();
  }

        cAc.setAttribute('d', `M${x(0)} ${y(50)} L${x(25)} ${y(0)}`);
        cMr.setAttribute('d', `M${x(0)} ${y(50)} L${x(12.5)} ${y(0)}`);
        cMc.setAttribute('d', `M${x(0)} ${y(c)} L${x(25)} ${y(c)}`);
        cAvc.setAttribute('d', '');
        pline.style.display = 'none';
        rect.setAttribute('class', 'mv-fill-cs');
        rect.setAttribute('x', x(0));
        rect.setAttribute('y', y(pm).toFixed(1));
        rect.setAttribute('width', (x(qm) - x(0)).toFixed(1));
        rect.setAttribute('height', (y(c) - y(pm)).toFixed(1));
        dwl.setAttribute('points', `${x(qm).toFixed(1)},${y(pm).toFixed(1)} ${x(qc).toFixed(1)},${y(c).toFixed(1)} ${x(qm).toFixed(1)},${y(c).toFixed(1)}`);

        root.querySelector('[data-role="msg"]').textContent = `垄断厂商按 MR=MC 定产 Qm=${fmt(qm, 1)}（低于竞争产量 ${fmt(qc, 1)}），定价 Pm=${fmt(pm, 1)} > MC=${c}，获利润 ${fmt(profit, 0)}，同时造成 ${fmt(dwlVal, 0)} 社会无谓损失。`;

    radios.forEach(r => r.addEventListener('change', () => {

      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <div class="chart-caption">
            <span><i class="chart-line mv-c2-line"></i>当前供给曲线 S</span>
            <span><i class="chart-line mv-base-line"></i>过原点参考线（Es = 1）</span>
          </div>
          <svg viewBox="0 0 540 360" role="img" aria-label="供给价格弹性几何截距对比图">
            <rect x="66" y="42" width="420" height="252" class="mv-grid-box"/>
            <path class="chart-axis" d="M66 30V294H498 M61 37l5-7 5 7 M491 289l7 5-7 5" fill="none" stroke-width="1.5"/>
            <text x="14" y="18" class="axis-label">价格 P</text>
            <text x="276" y="346" text-anchor="middle" class="axis-label">供给量 Q</text>
            <g class="tick-label" text-anchor="middle"><text x="66" y="316">0</text><text x="171" y="316">25</text><text x="276" y="316">50</text><text x="381" y="316">75</text><text x="486" y="316">100</text></g>
            <g class="tick-label" text-anchor="end"><text x="56" y="235">10</text><text x="56" y="172">20</text><text x="56" y="109">30</text><text x="56" y="46">40</text></g>
            <path class="mv-base-curve" data-role="ref"/>
            <path class="mv-curve-2" data-role="curve"/>
            <path class="mv-guide" data-role="guide"/>
            <circle r="6.5" class="mv-dot-2" data-role="pt"/>
            <circle r="5" class="mv-dot-eq" data-role="intercept"/>
          </svg>
        </div>
        <div class="ppf-controls">
          <fieldset class="ppf-scenarios">
            <legend>选择线性供给曲线形态</legend>
            <label><input type="radio" name="es-type" value="elastic" checked> 与纵轴正半轴相交（富有弹性 Es &gt; 1）</label>
            <label><input type="radio" name="es-type" value="unit"> 经过原点（单位弹性 Es = 1）</label>
            <label><input type="radio" name="es-type" value="inelastic"> 与横轴正半轴相交（缺乏弹性 Es &lt; 1）</label>
            <label><input type="radio" name="es-type" value="vertical"> 垂直于横轴（完全无弹性 Es = 0）</label>
          </fieldset>
          <label class="range-label">市场价格 P <output data-role="p-out">20</output></label>
          <input type="range" data-role="p" min="12" max="36" step="2" value="20">
          <div class="ppf-outputs">
            <div><span>供给量 Qs</span><strong data-role="q-val">40</strong></div>
            <div><span>点弹性 Es</span><strong data-role="es-val">2.00</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    const x = q => X0 + (q / 100) * W;
    const y = p => Y0 - (p / 40) * H;
    root.querySelector('[data-role="ref"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(100)} ${y(40)}`);
    const radios = [...root.querySelectorAll('input[name="es-type"]')];
    const pIn = root.querySelector('[data-role="p"]');

    function draw() {
      const mode = radios.find(r => r.checked).value;
      const p = pIn.valueAsNumber;
      let q = 0, es = 0, path = '', ix = 0, iy = 0, msg = '';
      if (mode === 'elastic') {
        // Q = -40 + 4P => P = 10 + 0.25Q (intersects P-axis at P=10)
        q = Math.max(0, -40 + 4 * p);
        es = q > 0 ? (4 * p) / q : 99;
        path = `M${x(0)} ${y(10)} L${x(100)} ${y(35)}`;
        ix = x(0); iy = y(10);
        msg = `曲线与纵轴正半轴相交（P₀=10）：任意价格下的点弹性均大于 1（当前 Es=${fmt(es, 2)}），供给富有弹性。`;
      } else if (mode === 'unit') {
        // Q = 2.5P (through origin)
        q = 2.5 * p;
        es = 1;
        path = `M${x(0)} ${y(0)} L${x(100)} ${y(40)}`;
        ix = x(0); iy = y(0);
        msg = '曲线经过原点：无论斜率陡峭还是平缓，线上任意一点的供给价格弹性恒等于 1（单位弹性）。';
      } else if (mode === 'inelastic') {
        // Q = 30 + 1.5P (intersects Q-axis at Q=30)
        q = 30 + 1.5 * p;
        es = (1.5 * p) / q;
        path = `M${x(30)} ${y(0)} L${x(90)} ${y(40)}`;
        ix = x(30); iy = y(0);
        msg = `曲线与横轴正半轴相交（Q₀=30）：任意价格下的点弹性均小于 1（当前 Es=${fmt(es, 2)}），供给缺乏弹性。`;
      } else {
        // Vertical at Q=50
        q = 50;
        es = 0;
        path = `M${x(50)} ${y(0)} L${x(50)} ${y(40)}`;
        ix = x(50); iy = y(0);
        msg = '供给曲线垂直于横轴（Es = 0）：如古董、土地或极短期鲜活农产品，价格如何变动，供给量均固定不变。';
      }
      root.querySelector('[data-role="curve"]').setAttribute('d', path);
      root.querySelector('[data-role="guide"]').setAttribute('d', `M${X0} ${y(p).toFixed(1)} H${x(q).toFixed(1)} V${Y0}`);
      root.querySelector('[data-role="pt"]').setAttribute('cx', x(q).toFixed(1));
      root.querySelector('[data-role="pt"]').setAttribute('cy', y(p).toFixed(1));
      root.querySelector('[data-role="intercept"]').setAttribute('cx', ix.toFixed(1));
      root.querySelector('[data-role="intercept"]').setAttribute('cy', iy.toFixed(1));
      root.querySelector('[data-role="p-out"]').value = String(p);
      root.querySelector('[data-role="q-val"]').textContent = fmt(q, 0);
      root.querySelector('[data-role="es-val"]').textContent = fmt(es, 2);
      root.querySelector('[data-role="msg"]').textContent = msg;
    }
    radios.forEach(r => r.addEventListener('change', draw));
    pIn.addEventListener('input', draw);
    draw();
  }

  const registry = {
    'demand-move': mountDemandMove,
    'supply-move': mountSupplyMove,
    'price-controls': mountPriceControls,
    elasticity: mountElasticity,
    'supply-elasticity': mountSupplyElasticity,
    consumer: mountConsumer,
    production: mountProduction,
    isoquant: mountIsoquant,
    cost: mountCost,
    'market-structure': mountMarketStructure,
  };

  document.querySelectorAll('[data-micro-visual]').forEach(container => {
    const fn = registry[container.dataset.microVisual];
    if (fn) fn(container);
  });
})();
</script>
</body>
</html>
