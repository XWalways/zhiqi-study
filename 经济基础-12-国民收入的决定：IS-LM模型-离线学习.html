  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-12-国民收入的决定：IS-LM模型-离线学习.html","visual":"is-lm","visualSectionId":"is-lm-equilibrium","visuals":[{"type":"is-lm","sectionId":"is-lm-equilibrium"}]},"lessons":{"title":"国民收入的决定：IS-LM模型","subtitle":"用产品和货币市场的共同均衡解释短期产出与利率。","sections":[{"id":"is-curve","title":"IS 曲线与产品市场","summary":"每个点都使计划总支出等于产出。","bodyHtml":"\u003cp>短期价格给定的封闭经济中，产品市场均衡满足 \u003cmark>Y = C + I + G\u003c/mark>。设 C = α + β(Y − T)，I = e − dr，T 和 G 为外生量且 d &gt; 0，则 \u003cmark>Y = (α + e + G − βT − dr)/(1 − β)\u003c/mark>。若不含政府，可用计划投资 I 等于计划储蓄 S 表示。\u003c/p>\u003cp>以 Y 为横轴、r 为纵轴，IS 斜率为 −(1 − β)/d。利率越高，计划投资通常越低，均衡产出也越低。投资对利率越敏感（d 越大）或边际消费倾向 β 越高，IS 越平坦。\u003c/p>","keyTakeaway":"IS 表示产品市场均衡下的产出和利率组合。","pitfall":"利率在给定曲线内改变时，沿曲线移动。政府购买或其他外生支出改变时，比较各利率下的均衡产出。","example":"IS 为 Y = 500 − 2000r 时，r = 0.05 对应 Y = 400。"},{"id":"is-shifts","title":"财政变化与 IS 曲线移动","summary":"固定利率，判断自主支出变化怎样移动 IS。","bodyHtml":"\u003cp>当其他条件不变时，\u003cstrong>增加政府购买\u003c/strong>提高任何给定利率下的计划支出，使 IS 右移。降低定额税提高可支配收入，也可使 IS 右移。减少政府购买或提高定额税使 IS 左移。\u003c/p>\u003cp>在本章线性模型中，政府购买、税额或自主投资改变时，改变的是 IS 的截距。改变投资对利率的敏感度、边际消费倾向等参数，可能改变曲线斜率。\u003c/p>","keyTakeaway":"分清财政政策直接改变的产品市场和货币市场随后发生的变化。","pitfall":"IS 右移给出各利率下的产品市场均衡产出变化。最终新利率与产出要同时满足 LM。","example":"β = 0.8，固定利率时政府购买增加 20，IS 在该利率上向右移动 20/(1 − 0.8) = 100。"},{"id":"money-demand","title":"凯恩斯的三种持币动机","summary":"把收入相关的持币需求与利率相关的持币需求分开。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>交易动机\u003c/strong>来自日常支付，收入越高，通常所需的交易余额越多。\u003c/li>\u003cli>\u003cstrong>预防动机\u003c/strong>用于应付不确定的支付，也通常随收入上升。\u003c/li>\u003cli>\u003cstrong>投机动机\u003c/strong>反映持有货币和债券之间的选择。其他条件不变，利率较高时持币机会成本提高，投机性持币需求下降。\u003c/li>\u003c/ul>\u003cp>对固定票息债券，其他条件不变时收益率与债券价格反向。若当前利率很低且预期利率回升，当前买入的债券可能出现价格损失，这是流动性偏好模型中人们愿持有货币的原因之一。\u003c/p>","keyTakeaway":"交易和预防动机主要与收入有关，投机动机主要与利率和预期有关。","pitfall":"利率很低时是否实际发生债券损失，还取决于后续利率、期限和信用等条件。","example":"收入提高后家庭可能保留更多支付余额。若利率上升而预期等条件不变，其投机性现金持有可能下降。"},{"id":"lm-curve","title":"LM 曲线与货币市场","summary":"每个点都使实际货币需求等于实际货币供给。","bodyHtml":"\u003cp>设实际货币需求为 L(Y,r) = kY − hr，k、h 均为正，实际货币供给 m = M/P。令需求等于供给得到 \u003cmark>r = (k/h)Y − m/h\u003c/mark>。以 Y 为横轴、r 为纵轴时，LM 的斜率是 k/h。\u003c/p>\u003cp>更高的收入增加交易等持币需求。给定实际货币供给，利率需要提高以减少投机性持币需求。h 越大或 k 越小，LM 越平坦。固定价格时，扩张货币供给使 LM 向右下方移动，收缩使 LM 向左上方移动。\u003c/p>","keyTakeaway":"用 r 对 Y 的表达式直接读取 LM 斜率。","pitfall":"改变 Y 或 r 的组合时，沿曲线读均衡关系。实际货币供给变化才会移动这条 LM 曲线。","example":"若 k = 0.5、h = 10，LM 斜率为 0.05。其他参数固定时，h 上升到 20，斜率降为 0.025。"},{"id":"lm-regions","title":"LM 曲线的三个区间","summary":"比较货币需求对利率的敏感程度。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>区间\u003c/th>\u003cth>货币需求的利率敏感性\u003c/th>\u003cth>简化模型的政策作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>凯恩斯区域\u003c/td>\u003ctd>利率极低，额外货币可以被持有，LM 接近水平\u003c/td>\u003ctd>增发货币难以继续压低利率，财政扩张可提高产出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中间区域\u003c/td>\u003ctd>LM 向右上倾斜\u003c/td>\u003ctd>财政和货币政策均可改变均衡产出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>古典区域\u003c/td>\u003ctd>利率较高，投机性持币需求很低，LM 接近垂直\u003c/td>\u003ctd>在垂直极限，财政扩张推高利率而产出不变，增加货币供给可使产出增加\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cmark>流动性陷阱\u003c/mark>描述对额外货币的需求在低利率下高度有弹性。关于政策失效的结论只适用于模型所讨论的利率传导渠道。\u003c/p>","keyTakeaway":"LM 越平坦，既定财政扩张带来的利率上升越小。","pitfall":"用货币需求的利率弹性解释水平极限。某个低利率上的实际持币余额仍可能有限。","example":"若均衡位于水平 LM 的内部，提高政府购买使 IS 右移，新均衡产出提高，利率保持该水平。"},{"id":"money-theories","title":"交易方程、现金余额与新货币数量论","summary":"区分三种货币需求分析的切入点。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>费雪交易方程\u003c/strong>将货币量、货币流通速度与名义交易量相联系。用收入表示交易的简化写法是 MV = PY。\u003c/li>\u003cli>\u003cstrong>剑桥现金余额方程\u003c/strong>强调人们希望以货币保存的名义收入比例 k，写作 M\u003csup>d\u003c/sup> = kPY。\u003c/li>\u003cli>\u003cstrong>弗里德曼的新货币数量论\u003c/strong>将货币视为财富的一种持有形式，货币需求与持久收入及货币和其他资产的相对回报等有关。\u003c/li>\u003c/ul>","keyTakeaway":"费雪从货币流通切入，剑桥学派从意愿持有切入，弗里德曼从资产选择切入。","pitfall":"MV = PY 是收入形式的关系式，若要推出物价变化，还要说明流通速度和真实产出怎样变化。","example":"若 V 恒定、真实产出 Y 也固定，M 增加 10%，收入形式的方程给出 P 同比增加 10%。"},{"id":"is-lm-equilibrium","title":"两个市场的共同均衡与失衡","summary":"联立 IS 与 LM，并分别判断曲线两侧的超额需求。","bodyHtml":"\u003cp>IS 与 LM 的交点满足产品市场和货币市场两个均衡条件。在一条向下和一条向上且于有效范围相交的模型中，共同均衡的产出与利率唯一。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>固定产出时所处位置\u003c/th>\u003cth>失衡\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IS 上方\u003c/td>\u003ctd>利率高于产品市场均衡所需水平，计划投资偏少，产品超额供给\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IS 下方\u003c/td>\u003ctd>利率低于产品市场均衡所需水平，计划投资偏多，产品超额需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LM 上方\u003c/td>\u003ctd>利率较高，货币需求低于实际供给\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LM 下方\u003c/td>\u003ctd>利率较低，货币需求超过实际供给\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>也可以固定利率，看位于曲线的左右侧。IS 右侧意味着产出超过计划支出，LM 左侧意味着收入相关的货币需求较低。\u003c/p>","keyTakeaway":"给定 Y 比上下，或给定 r 比左右。分别判定两个市场，最后合并。","pitfall":"斜向方位如果无法确定在曲线的哪一侧，不能直接判定市场状态。","example":"若 IS 为 Y = 500 − 20r、LM 为 r = Y/20 − 5，联立得 Y = 300、r = 10。"}],"mindmap":[{"label":"产品市场均衡与货币市场均衡","target":"is-curve","children":[{"label":"IS 曲线","target":"is-curve","children":[{"label":"三部门产品市场均衡","target":"is-curve"},{"label":"投资利率敏感度或边际消费倾向提高使 IS 更平坦","target":"is-curve"},{"label":"财政扩张使 IS 右移，财政紧缩使 IS 左移","target":"is-shifts"}]},{"label":"LM 曲线","target":"lm-curve","children":[{"label":"实际货币供给等于实际货币需求","target":"lm-curve"},{"label":"凯恩斯货币需求理论","target":"money-demand","children":[{"label":"交易动机","target":"money-demand"},{"label":"预防动机","target":"money-demand"},{"label":"投机动机","target":"money-demand"},{"label":"低利率下的流动性陷阱","target":"lm-regions"}]},{"label":"r = (k/h)Y − m/h","target":"lm-curve"},{"label":"k 越小、h 越大，LM 越平坦","target":"lm-curve"},{"label":"LM 的三个区间","target":"lm-regions","children":[{"label":"凯恩斯区域接近水平","target":"lm-regions"},{"label":"中间区域向右上倾斜","target":"lm-regions"},{"label":"古典区域接近垂直","target":"lm-regions"}]},{"label":"实际货币供给增加使 LM 向右下方移动","target":"lm-curve"}]},{"label":"其他货币需求理论","target":"money-theories","children":[{"label":"费雪交易方程 MV = PY","target":"money-theories"},{"label":"剑桥现金余额方程 M = kPY","target":"money-theories"},{"label":"弗里德曼新货币数量论","target":"money-theories"}]}]},{"label":"IS-LM 模型","target":"is-lm-equilibrium","children":[{"label":"均衡状态","target":"is-lm-equilibrium","children":[{"label":"交点同时满足产品市场与货币市场的均衡","target":"is-lm-equilibrium"}]},{"label":"非均衡状态","target":"is-lm-equilibrium","children":[{"label":"IS 右侧或上方时，产品超额供给","target":"is-lm-equilibrium"},{"label":"IS 左侧或下方时，产品超额需求","target":"is-lm-equilibrium"},{"label":"LM 左侧或上方时，货币超额供给","target":"is-lm-equilibrium"},{"label":"LM 右侧或下方时，货币超额需求","target":"is-lm-equilibrium"}]}]}]},"questions":[{"id":"eco-12-q01","number":1,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"经济学中存在众多的重要曲线，其中IS 曲线表示（　　）。","options":{"A":"当产品市场达到均衡时，国民收入和物价水平之间的关系","B":"当货币市场达到均衡时，国民收入和物价水平之间的关系","C":"当产品市场达到均衡时，国民收入和利率之间的关系","D":"当货币市场达到均衡时，国民收入和利率之间的关系"},"answer":["C"],"explanationSupplement":"IS 描述在产品市场出清时，利率与产出的组合。利率通过计划投资影响产品需求。","optionExplanations":{"A":"使用的是物价与产出坐标。","B":"市场和坐标都不匹配。","C":"符合 IS 的市场与两项变量。","D":"这是 LM 的含义。"},"conceptId":"is-curve"},{"id":"eco-12-q02","number":2,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"关于 LM 曲线的表述，不正确的是（　　）。","options":{"A":"在LM 曲线上，每一点都表示收入与利息率的组合，这些组合点恰好使得货币市场处于均衡","B":"LM 曲线表示在货币市场中，货币供给等于货币需求时收入与利率的各种组合的点的轨迹","C":"LM 曲线的表达式为 M/P=ky-hr，它的斜率为负，这表明LM 曲线一般是向左上方倾斜的曲线","D":"LM 曲线是一条用来描述在货币市场均衡状态下国民收入和利率之间相互关系的曲线"},"answer":["C"],"explanationSupplement":"将 M/P = kY − hr 写成 r = (k/h)Y − M/(Ph)。在 k、h 为正时，标准坐标的斜率 k/h 为正。","optionExplanations":{"A":"曲线上每个组合使货币市场均衡。","B":"均衡要求实际货币供求相等。","C":"错误地把利率项的负号当成曲线斜率。","D":"正确描述了市场和变量。"},"conceptId":"lm-curve"},{"id":"eco-12-q03","number":3,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"如果货币市场均衡方程为 r=ky/h-m/h，则引致LM 曲线变得平坦是由于（　　）。","options":{"A":"k变小，h变大","B":"k变大，h变小","C":"k 和h同比例变大","D":"k 和h 同比例变小"},"answer":["A"],"explanationSupplement":"标准坐标下 LM 斜率为 k/h，分子减小、分母增大使其下降。","optionExplanations":{"A":"k/h 变小，曲线变平坦。","B":"k/h 变大。","C":"同倍放大不改变比率。","D":"同倍缩小不改变比率。"},"conceptId":"lm-curve"},{"id":"eco-12-q04","number":4,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"投资对利率的敏感程度不同会有不同的经济学曲线。如果投资对利率变的很敏感，那么（　　）。","options":{"A":"IS 曲线将变的更陡峭","B":"IS 曲线将变的更平坦","C":"LM 曲线将变的更陡峭","D":"LM 曲线将变的更平坦"},"answer":["B"],"explanationSupplement":"IS 斜率绝对值为 (1 − β)/d。投资对利率越敏感，d 越大，IS 越平坦。","optionExplanations":{"A":"与斜率公式相反。","B":"投资利率敏感度增大使斜率绝对值变小。","C":"投资函数影响产品市场的 IS。","D":"LM 斜率由货币需求参数决定。"},"conceptId":"is-curve"},{"id":"eco-12-q05","number":5,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在凯恩斯的三个持币动机中，他认为（　　）对利率最为敏感。","options":{"A":"交易动机","B":"预防动机","C":"投机动机","D":"无私动机"},"answer":["C"],"explanationSupplement":"持币的机会成本与利率有关，凯恩斯模型中特别敏感的是投机性货币需求。","optionExplanations":{"A":"交易性需求主要跟随交易量。","B":"预防性需求主要跟随收入和意外支出准备。","C":"相对资产收益改变会影响投机性持币。","D":"这不属于三种持币动机。"},"conceptId":"money-demand"},{"id":"eco-12-q06","number":6,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"LM 曲线是描述（　　）。","options":{"A":"产品市场均衡时，国民收入与利息率之间的关系","B":"货币市场均衡时，国民收入与利息率之间的关系","C":"货币市场均衡时，国民收入与价格之间的关系","D":"产品市场均衡时，国民收入与价格之间的关系"},"answer":["B"],"explanationSupplement":"LM 描述实际货币供求相等时的产出与利率组合。","optionExplanations":{"A":"这是 IS 的含义。","B":"符合 LM 的定义。","C":"把利率替换成了价格。","D":"市场与纵轴都不匹配。"},"conceptId":"lm-curve"},{"id":"eco-12-q07","number":7,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"根据凯恩斯的货币需求理论，（　　）与收入水平相关。","options":{"A":"投机性货币需求","B":"流动性陷阱","C":"预防性货币需求","D":"投资风险"},"answer":["C"],"explanationSupplement":"在简化模型中，交易性和预防性货币需求都随收入变化。给出的选项中只有预防性需求属于这类。","optionExplanations":{"A":"主要与利率相关。","B":"是特定低利率情形。","C":"常随收入上升。","D":"这不是该模型的货币需求类别。"},"conceptId":"money-demand"},{"id":"eco-12-q08","number":8,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在IS 曲线不变的情况下，货币量减少会引起（　　）。","options":{"A":"国民收入增加，利率下降","B":"国民收入增加，利率上升","C":"国民收入减少，利率上升","D":"国民收入减少，利率下降"},"answer":["C"],"explanationSupplement":"价格固定，货币供给减少使 LM 向左上移动。沿不变且向下倾斜的 IS 到达新均衡，产出降低、利率上升。","optionExplanations":{"A":"对应货币扩张。","B":"利率上升，但均衡产出减少。","C":"符合货币收缩。","D":"货币收缩会推高均衡利率。"},"conceptId":"lm-curve"},{"id":"eco-12-q09","number":9,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"政府支出增加使IS曲线（　　）。","options":{"A":"向左移动","B":"向右移动","C":"保持不动","D":"以上说法均有可能"},"answer":["B"],"explanationSupplement":"政府购买增加使各利率下的计划总支出和均衡产出提高，IS 向右移动。","optionExplanations":{"A":"对应政府购买减少。","B":"给定利率时均衡产出增加。","C":"政府购买是 IS 的移动因素。","D":"其他参数给定时，方向明确。"},"conceptId":"is-shifts"},{"id":"eco-12-q10","number":10,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"IS 曲线为 Y=500-2000r，下列哪一个利率和收入水平的组合不在IS 曲线上？（　　）。","options":{"A":"r = 0.02，Y = 450","B":"r = 0.05，Y = 400","C":"r=0.07,Y=360","D":"r=0.10,Y=300"},"answer":["A"],"explanationSupplement":"分别将利率代入 Y = 500 − 2000r。r = 0.02 时应有 Y = 460。","optionExplanations":{"A":"应为 460，所列数对不在曲线上。","B":"代入等于 400。","C":"代入等于 360。","D":"代入等于 300。"},"conceptId":"is-curve"},{"id":"eco-12-q11","number":11,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在IS 曲线上存在储蓄和投资均衡的收入和利率的组合点有（　　）。","options":{"A":"一个","B":"无数个","C":"几个","D":"一个或无数个都不可能"},"answer":["B"],"explanationSupplement":"IS 是产品市场均衡的整条轨迹。两部门模型中，曲线上的每一组收入与利率都使计划储蓄等于计划投资。","optionExplanations":{"A":"与 LM 同时联立才可得到单个常见交点。","B":"曲线连续时包含无数个组合。","C":"曲线上的点不限于有限个。","D":"无数个组合正是曲线的含义。"},"conceptId":"is-curve"},{"id":"eco-12-q12","number":12,"group":"产品市场均衡与货币市场均衡","type":"discussion","stem":"当利率降到很低时，人们购买债券的风险将会（　　）","options":{"A":"变得很小","B":"变得很大","C":"不发生变化","D":"无法判定"},"answer":[],"explanationSupplement":"经典流动性偏好模型假定利率极低时，人们预期利率回升、债券价格下降，因此愿意避免潜在的价格损失。仅凭当前利率低无法确定实际风险。","optionExplanations":{"A":"缺少后续利率与债券条件，无法认定风险变小。","B":"在低利率后预期回升的模型里，预期价格风险会增强。","C":"风险也可能随预期和债券性质改变。","D":"如果只知道当前利率，无法判断实际风险。"},"conceptId":"money-demand"},{"id":"eco-12-q13","number":13,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"按照凯恩斯的货币理论，如果利率上升，货币需求将（　　）。","options":{"A":"不变","B":"下降","C":"上升","D":"均不对"},"answer":["B"],"explanationSupplement":"固定收入，利率上升提高了持币机会成本，使投机性货币需求下降。","optionExplanations":{"A":"忽略了投机动机。","B":"货币需求减少。","C":"方向相反。","D":"在通常的凯恩斯模型中有明确方向。"},"conceptId":"money-demand"},{"id":"eco-12-q14","number":14,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"按照凯恩斯的观点，人们需要货币是出于（　　）。","options":{"A":"交易动机","B":"谨慎动机","C":"投机动机","D":"以上都对"},"answer":["D"],"explanationSupplement":"凯恩斯提出交易、预防和投机三种持币动机。","optionExplanations":{"A":"用于日常支付。","B":"用于意外支出，也称预防动机。","C":"出于资产选择。","D":"三种动机都属于该模型。"},"conceptId":"money-demand"},{"id":"eco-12-q15","number":15,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"利息率提高时，货币的投机需求将（　　）。","options":{"A":"增加","B":"不变","C":"减少","D":"不确定"},"answer":["C"],"explanationSupplement":"利率上升时，持有无息货币的机会成本上升。其他条件不变，投机性货币需求下降。","optionExplanations":{"A":"与模型关系方向相反。","B":"投机性需求具有利率敏感性。","C":"符合反向关系。","D":"标准模型下方向明确。"},"conceptId":"money-demand"},{"id":"eco-12-q16","number":16,"group":"产品市场均衡与货币市场均衡","type":"discussion","stem":"当出现凯恩斯陷阱的情况时，下列说法正确的是（　　）。","options":{"A":"应采取货币政策","B":"财政政策无效","C":"利率处于极高的水平","D":"货币需求无限大"},"answer":[],"explanationSupplement":"流动性陷阱发生在极低利率处。理想化模型中货币需求对利率极富弹性，增加供给时利率难以再下降。","optionExplanations":{"A":"单靠增加货币供给未必能压低利率。","B":"在基本模型的水平区，财政政策仍可移动 IS。","C":"陷阱出现在低利率而非高利率。","D":"经典模型中可理解为对额外货币的需求弹性趋于无限，实际持有量可以是有限值。"},"conceptId":"lm-regions"},{"id":"eco-12-q17","number":17,"group":"IS-LM 模型","type":"single","stem":"IS 曲线与LM 曲线的交点是（　　）。","options":{"A":"产品市场和货币市场的均衡，且利率和产出唯一","B":"总需求和总供给的均衡，且价格和产出唯一","C":"产品市场和货币市场的均衡，但利率和产出不唯一","D":"总需求和总供给的均衡，但价格和产出不唯一"},"answer":["A"],"explanationSupplement":"IS-LM 模型把利率和产出放在同一图上。常见的向下 IS 与向上 LM 相交一次，共同确定产出与利率。","optionExplanations":{"A":"符合标准模型的共同均衡。","B":"AD-AS 才在价格和产出坐标中讨论均衡。","C":"两条常见单调曲线只有一个交点。","D":"混淆了市场与坐标。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q18","number":18,"group":"IS-LM 模型","type":"single","stem":"利率和收入的组合点出现在IS 曲线右上方，LM 曲线的左上方的区域中，则表示（　　）。","options":{"A":"投资小于储蓄且货币需求小于货币供给","B":"投资小于储蓄且货币供给小于货币需求","C":"投资大于储蓄且货币需求小于货币供给","D":"投资大于储蓄且货币需求大于货币供给"},"answer":["A"],"explanationSupplement":"IS 右侧或上方是产品超额供给，两部门模型中 I \u003c S。LM 左侧或上方是货币超额供给，L \u003c M/P。","optionExplanations":{"A":"两个不等式都符合。","B":"货币市场的不等号反了。","C":"产品市场的不等号反了。","D":"两个不等式均反了。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q19","number":19,"group":"IS-LM 模型","type":"single","stem":"一般地说，位于LM 曲线左方的收入和利率的组合，都是（　　）。","options":{"A":"货币需求大于货币供给的非均衡组合","B":"货币需求小于货币供给的非均衡组合","C":"产品需求小于产品供给的非均衡组合","D":"产品需求大于产品供给的非均衡组合"},"answer":["B"],"explanationSupplement":"固定利率，LM 左方的收入较低，交易和预防持币需求较低，因此货币需求小于实际供给。","optionExplanations":{"A":"描述 LM 右侧。","B":"描述货币超额供给。","C":"仅由 LM 的位置无法判断产品市场。","D":"该判断要以 IS 的位置为依据。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q20","number":20,"group":"IS-LM 模型","type":"single","stem":"IS 曲线与LM 曲线相交时表示（　　）。","options":{"A":"产品市场处于均衡状态，而货币市场处于非均衡状态","B":"产品市场处于非均衡状态，而货币市场处于均衡状态","C":"产品市场与货币市场都处于均衡状态","D":"产品市场与货币市场都处于非均衡状态"},"answer":["C"],"explanationSupplement":"交点同时位于两条曲线上，既使计划支出等于产出，也使实际货币供求相等。","optionExplanations":{"A":"在 LM 上，货币市场也均衡。","B":"在 IS 上，产品市场也均衡。","C":"符合交点同时满足的两个条件。","D":"交点不存在这两个市场的超额需求。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q21","number":21,"group":"IS-LM 模型","type":"discussion","stem":"利率和收入的组合点出现在IS 曲线左上方，LM 曲线的右下方的区域中，则表示（　　）。","options":{"A":"I>S, L\u003cM","B":"I>S,L>M","C":"I\u003cS, L\u003cM","D":"I\u003cS,L>M"},"answer":[],"explanationSupplement":"LM 右下方可判货币超额需求。对向下倾斜的 IS，“左上方”未指明是在同一利率下位于左侧，还是同一产出下位于上方，两种读法的产品市场状态相反。","optionExplanations":{"A":"LM 右下方不是货币超额供给。","B":"按给定利率下的 IS 左侧解读，I > S 且 L > M。","C":"与货币市场状态不符。","D":"按给定产出下的 IS 上侧解读，I \u003c S 且 L > M。"},"conceptId":"is-lm-equilibrium"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);

      root.querySelector('[data-role="st-val"]').textContent = st;
      root.querySelector('[data-role="msg"]').textContent = st === '平价'
        ? `市场利率（${fmt(yv, 1)}%）等于票面利率（${fmt(cv, 1)}%），债券按面值 1000 元平价交易。`
        : st === '溢价'
          ? `市场利率（${fmt(yv, 1)}%）低于票面利率（${fmt(cv, 1)}%），票息更有吸引力，债券溢价至 ${fmt(pv, 1)} 元。`
          : `市场利率（${fmt(yv, 1)}%）高于票面利率（${fmt(cv, 1)}%），债券折价至 ${fmt(pv, 1)} 元。试着拉长剩余期限，曲线会更陡峭。`;
    }
    [yIn, cIn, nIn].forEach(i => i.addEventListener('input', draw));
    draw();
  }

  function mountMultiplier(root) {
    root.innerHTML = `
      <div class="inline-visual-header">
        <span class="inline-visual-badge">交互图解</span>
        <h4>商业银行派生存款创造与货币乘数（1 / r）</h4>
        <p>调节法定存款准备金率 r，观察原始存款在银行体系中前 6 轮逐级放贷扩张的过程。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <div class="chart-caption">
            <span><i class="mv-swatch mv-cs"></i>新增贷款/派生存款</span>
            <span><i class="mv-swatch mv-dwl"></i>缴存法定准备金</span>
          </div>
          <svg viewBox="0 0 540 330" role="img" aria-label="派生存款创造阶梯柱状图">
            <path class="chart-axis" d="M56 36V276H506" fill="none" stroke-width="1.5"/>
            <text x="14" y="20" class="axis-label">金额（万元）</text>
            <g data-role="bars"></g>
            <text x="281" y="320" text-anchor="middle" class="axis-label">银行体系信用扩张轮次</text>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">法定准备金率 r <output data-role="r-out">10%</output></label>
          <input type="range" data-role="r" min="5" max="25" step="1" value="10">
          <label class="range-label">初始原始存款 D₀（万元）<output data-role="d-out">100</output></label>
          <input type="range" data-role="d" min="100" max="500" step="50" value="100">
          <div class="ppf-outputs">
            <div><span>理论乘数 1/r</span><strong data-role="k-val">10.0×</strong></div>
            <div><span>存款总额</span><strong data-role="tot-val">1000</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    const rIn = root.querySelector('[data-role="r"]');
    const dIn = root.querySelector('[data-role="d"]');

    function draw() {
      const r = rIn.valueAsNumber / 100;
      const d0 = dIn.valueAsNumber;
      const k = 1 / r;
      const total = d0 * k;
      const bars = root.querySelector('[data-role="bars"]');
      let html = '';
      for (let i = 0; i < 6; i++) {
        const dep = d0 * Math.pow(1 - r, i);
        const res = dep * r;
        const bx = 76 + i * 70;
        const hTotal = (dep / d0) * 210;
        const hRes = (res / d0) * 210;
        const hLoan = hTotal - hRes;
        html += `<rect x="${bx}" y="${(276 - hLoan).toFixed(1)}" width="42" height="${hLoan.toFixed(1)}" rx="3" class="mv-fill-cs" stroke="var(--mv-c1)" stroke-width="1.2"/>`;
        html += `<rect x="${bx}" y="${(276 - hTotal).toFixed(1)}" width="42" height="${hRes.toFixed(1)}" rx="3" class="mv-fill-dwl" stroke="var(--error)" stroke-width="1.2"/>`;
        html += `<text x="${bx + 21}" y="${(268 - hTotal).toFixed(1)}" text-anchor="middle" class="tick-label">${fmt(dep, 0)}</text>`;
        html += `<text x="${bx + 21}" y="296" text-anchor="middle" class="tick-label">第${i + 1}轮</text>`;
      }
      bars.innerHTML = html;
      root.querySelector('[data-role="r-out"]').value = rIn.value + '%';
      root.querySelector('[data-role="d-out"]').value = String(d0);
      root.querySelector('[data-role="k-val"]').textContent = fmt(k, 1) + '×';
      root.querySelector('[data-role="tot-val"]').textContent = fmt(total, 0);
      root.querySelector('[data-role="msg"]').textContent = `在无现金漏损和超额准备金假设下，原始存款 ${d0} 万元最终放大为 ${fmt(total, 0)} 万元（其中净派生存款 ${fmt(total - d0, 0)} 万元）。准备金率 r 越低，乘数越大。`;
    }
    rIn.addEventListener('input', draw);
    dIn.addEventListener('input', draw);
    draw();
  }

  function mountDeductible(root) {
    root.innerHTML = `
      <div class="inline-visual-header">
        <span class="inline-visual-badge">交互图解</span>
        <h4>绝对免赔额 vs 相对免赔额赔付对比</h4>
        <p>拖动损失金额与免赔额，直观对比“超过免赔额后是否扣除免赔额”导致的赔付跳变差异。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <div class="chart-caption">
            <span><i class="chart-line mv-c1-line"></i>绝对免赔额赔付</span>
            <span><i class="chart-line mv-c2-line"></i>相对免赔额赔付</span>
          </div>
          <svg viewBox="0 0 540 360" role="img" aria-label="绝对免赔额与相对免赔额赔付折线图">
            <rect x="66" y="42" width="420" height="252" class="mv-grid-box"/>
            <path class="chart-axis" d="M66 30V294H498 M61 37l5-7 5 7 M491 289l7 5-7 5" fill="none" stroke-width="1.5"/>
            <text x="14" y="18" class="axis-label">赔付金额（元）</text>
            <text x="276" y="346" text-anchor="middle" class="axis-label">实际损失金额（元）</text>
            <g class="tick-label" text-anchor="middle"><text x="66" y="316">0</text><text x="206" y="316">2000</text><text x="346" y="316">4000</text><text x="486" y="316">6000</text></g>
            <g class="tick-label" text-anchor="end"><text x="56" y="214">2000</text><text x="56" y="130">4000</text><text x="56" y="46">6000</text></g>
            <path class="mv-curve-2" data-role="rel"/>
            <path class="mv-curve-1" data-role="abs"/>
            <line class="mv-guide" data-role="vline" y1="42" y2="294"/>
            <circle r="5.5" class="mv-dot-1" data-role="pt-abs"/>
            <circle r="5.5" class="mv-dot-2" data-role="pt-rel"/>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">约定免赔额 M（元）<output data-role="m-out">1000</output></label>
          <input type="range" data-role="m" min="500" max="3000" step="500" value="1000">
          <label class="range-label">实际损失金额 L（元）<output data-role="l-out">2000</output></label>
          <input type="range" data-role="l" min="0" max="6000" step="200" value="2000">
          <div class="ppf-outputs">
            <div><span>绝对免赔赔付</span><strong data-role="abs-val">1000</strong></div>
            <div><span>相对免赔赔付</span><strong data-role="rel-val">2000</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    const x = v => X0 + (v / 6000) * W;
    const y = v => Y0 - (v / 6000) * H;
    const mIn = root.querySelector('[data-role="m"]');
    const lIn = root.querySelector('[data-role="l"]');

    function draw() {
      const m = mIn.valueAsNumber, l = lIn.valueAsNumber;
      const absPay = l > m ? l - m : 0;
      const relPay = l > m ? l : 0;
      root.querySelector('[data-role="abs"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(m)} ${y(0)} L${x(6000)} ${y(6000 - m)}`);
      root.querySelector('[data-role="rel"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(m)} ${y(0)} M${x(m)} ${y(m)} L${x(6000)} ${y(6000)}`);
      const xl = x(l).toFixed(1);
      const vl = root.querySelector('[data-role="vline"]');
      vl.setAttribute('x1', xl); vl.setAttribute('x2', xl);
      root.querySelector('[data-role="pt-abs"]').setAttribute('cx', xl);
      root.querySelector('[data-role="pt-abs"]').setAttribute('cy', y(absPay).toFixed(1));
      root.querySelector('[data-role="pt-rel"]').setAttribute('cx', xl);
      root.querySelector('[data-role="pt-rel"]').setAttribute('cy', y(relPay).toFixed(1));
      root.querySelector('[data-role="m-out"]').value = String(m);
      root.querySelector('[data-role="l-out"]').value = String(l);
      root.querySelector('[data-role="abs-val"]').textContent = String(absPay);
      root.querySelector('[data-role="rel-val"]').textContent = String(relPay);
      root.querySelector('[data-role="msg"]').textContent = l <= m
        ? `损失 ${l} 元未超过免赔额 ${m} 元：绝对免赔额与相对免赔额均不赔付（0 元）。`
        : `损失 ${l} 元超过免赔额 ${m} 元：绝对免赔额须先扣除 ${m} 元，仅赔 ${absPay} 元；相对免赔额达到门槛即全额赔付 ${relPay} 元（多赔 ${m} 元）。`;
    }
    mIn.addEventListener('input', draw);
    lIn.addEventListener('input', draw);
    draw();
  }

  function mountLiabilityTimeline(root) {
    root.innerHTML = `
      <div class="inline-visual-header">
        <span class="inline-visual-badge">交互图解</span>
        <h4>责任保险：期内发生式 vs 期内索赔式时间轴判定</h4>
        <p>拖动「事故发生时间」与「提出索赔时间」，秒懂两种承保基础的理赔边界。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <svg viewBox="0 0 540 230" role="img" aria-label="期内发生式与期内索赔式时间轴对比图">
            <rect x="46" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <rect x="190" y="42" width="160" height="106" class="mv-stage-band" stroke="var(--accent)" stroke-width="1.5"/>
            <rect x="350" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <g class="tick-label" text-anchor="middle">
              <text x="118" y="30">追溯期（2025）</text>
              <text x="270" y="30" fill="var(--accent)" font-weight="650">保单有效期（2026）</text>
              <text x="422" y="30">保单到期后（2027）</text>
              <text x="46" y="170">25.01</text><text x="190" y="170">26.01</text><text x="350" y="170">27.01</text><text x="494" y="170">27.12</text>
            </g>
            <line x1="38" y1="95" x2="504" y2="95" class="chart-axis" stroke-width="1.6"/>
            <line data-role="span" y1="95" y2="95" stroke="var(--accent)" stroke-width="4" opacity=".45"/>
            <circle r="7.5" class="mv-dot-1" data-role="occ-pt" cy="95"/>
            <text class="point-label" data-role="occ-lbl" y="74" text-anchor="middle">事故</text>
            <circle r="7.5" class="mv-dot-2" data-role="clm-pt" cy="95"/>
            <text class="point-label" data-role="clm-lbl" y="128" text-anchor="middle" style="fill:var(--mv-c2)">索赔</text>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">事故发生月份（1-12 追溯期，13-24 有效期）<output data-role="occ-out">2026.06</output></label>
          <input type="range" data-role="occ" min="2" max="34" step="1" value="18">
          <label class="range-label">提出索赔月份（须不早于事故）<output data-role="clm-out">2027.04</output></label>
          <input type="range" data-role="clm" min="2" max="36" step="1" value="28">
          <div class="ppf-outputs">
            <div><span>期内发生式</span><strong data-role="occ-res">承保</strong></div>
            <div><span>期内索赔式</span><strong data-role="clm-res">不赔</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
          <div class="button-row">
            <button type="button" class="button button-secondary" data-sc="18,28">期内发生+期后索赔</button>
            <button type="button" class="button button-secondary" data-sc="8,19">追溯期发生+期内索赔</button>
          </div>
        </div>
      </div>`;
    const x = m => 46 + ((m - 1) / 35) * 448;
    const mLabel = m => `${2025 + Math.floor((m - 1) / 12)}.${String(((m - 1) % 12) + 1).padStart(2, '0')}`;
    const occIn = root.querySelector('[data-role="occ"]');
    const clmIn = root.querySelector('[data-role="clm"]');

    function draw() {
      let o = occIn.valueAsNumber, c = clmIn.valueAsNumber;
      if (c < o) { c = o; clmIn.value = String(c); }
      const xo = x(o).toFixed(1), xc = x(c).toFixed(1);
      root.querySelector('[data-role="occ-pt"]').setAttribute('cx', xo);
      root.querySelector('[data-role="occ-lbl"]').setAttribute('x', xo);
      root.querySelector('[data-role="clm-pt"]').setAttribute('cx', xc);
      root.querySelector('[data-role="clm-lbl"]').setAttribute('x', xc);
      const span = root.querySelector('[data-role="span"]');
      span.setAttribute('x1', xo); span.setAttribute('x2', xc);
      root.querySelector('[data-role="occ-out"]').value = mLabel(o);
      root.querySelector('[data-role="clm-out"]').value = mLabel(c);
      const occCovered = o >= 13 && o <= 24;
      const clmCovered = o >= 1 && c >= 13 && c <= 24;
      root.querySelector('[data-role="occ-res"]').textContent = occCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="clm-res"]').textContent = clmCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="msg"]').textContent =
        `期内发生式只看「事故是否落在 2026 保单期内」（当前${occCovered ? '满足' : '不满足'}）；期内索赔式要求「事故在追溯日后且索赔落在 2026 保单期内」（当前${clmCovered ? '满足' : '不满足'}）。`;
    }
    occIn.addEventListener('input', draw);
    clmIn.addEventListener('input', draw);
    root.querySelectorAll('[data-sc]').forEach(b => b.addEventListener('click', () => {
      const [o, c] = b.dataset.sc.split(',');
      occIn.value = o; clmIn.value = c; draw();
    }));
    draw();
  }

  const registry = {
    'is-lm': mountISLM,
    'ad-as': mountADAS,
    phillips: mountPhillips,
    trilemma: mountTrilemma,
    bond: mountBond,
    multiplier: mountMultiplier,
    deductible: mountDeductible,
    'liability-timeline': mountLiabilityTimeline,
  };

  document.querySelectorAll('[data-micro-visual]').forEach(container => {
    const fn = registry[container.dataset.microVisual];
    if (fn) fn(container);
  });
})();
</script>
</body>
</html>
