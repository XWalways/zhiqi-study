  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-12-国民收入的决定：IS-LM模型-离线学习.html"},"lessons":{"title":"国民收入的决定：IS-LM模型","subtitle":"用产品和货币市场的共同均衡解释短期产出与利率。","sections":[{"id":"is-curve","title":"IS 曲线与产品市场","summary":"每个点都使计划总支出等于产出。","bodyHtml":"\u003cp>短期价格给定的封闭经济中，产品市场均衡满足 \u003cmark>Y = C + I + G\u003c/mark>。设 C = α + β(Y − T)，I = e − dr，T 和 G 为外生量且 d &gt; 0，则 \u003cmark>Y = (α + e + G − βT − dr)/(1 − β)\u003c/mark>。若不含政府，可用计划投资 I 等于计划储蓄 S 表示。\u003c/p>\u003cp>以 Y 为横轴、r 为纵轴，IS 斜率为 −(1 − β)/d。利率越高，计划投资通常越低，均衡产出也越低。投资对利率越敏感（d 越大）或边际消费倾向 β 越高，IS 越平坦。\u003c/p>","keyTakeaway":"IS 表示产品市场均衡下的产出和利率组合。","pitfall":"利率在给定曲线内改变时，沿曲线移动。政府购买或其他外生支出改变时，比较各利率下的均衡产出。","example":"IS 为 Y = 500 − 2000r 时，r = 0.05 对应 Y = 400。"},{"id":"is-shifts","title":"财政变化与 IS 曲线移动","summary":"固定利率，判断自主支出变化怎样移动 IS。","bodyHtml":"\u003cp>当其他条件不变时，\u003cstrong>增加政府购买\u003c/strong>提高任何给定利率下的计划支出，使 IS 右移。降低定额税提高可支配收入，也可使 IS 右移。减少政府购买或提高定额税使 IS 左移。\u003c/p>\u003cp>在本章线性模型中，政府购买、税额或自主投资改变时，改变的是 IS 的截距。改变投资对利率的敏感度、边际消费倾向等参数，可能改变曲线斜率。\u003c/p>","keyTakeaway":"分清财政政策直接改变的产品市场和货币市场随后发生的变化。","pitfall":"IS 右移给出各利率下的产品市场均衡产出变化。最终新利率与产出要同时满足 LM。","example":"β = 0.8，固定利率时政府购买增加 20，IS 在该利率上向右移动 20/(1 − 0.8) = 100。"},{"id":"money-demand","title":"凯恩斯的三种持币动机","summary":"把收入相关的持币需求与利率相关的持币需求分开。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>交易动机\u003c/strong>来自日常支付，收入越高，通常所需的交易余额越多。\u003c/li>\u003cli>\u003cstrong>预防动机\u003c/strong>用于应付不确定的支付，也通常随收入上升。\u003c/li>\u003cli>\u003cstrong>投机动机\u003c/strong>反映持有货币和债券之间的选择。其他条件不变，利率较高时持币机会成本提高，投机性持币需求下降。\u003c/li>\u003c/ul>\u003cp>对固定票息债券，其他条件不变时收益率与债券价格反向。若当前利率很低且预期利率回升，当前买入的债券可能出现价格损失，这是流动性偏好模型中人们愿持有货币的原因之一。\u003c/p>","keyTakeaway":"交易和预防动机主要与收入有关，投机动机主要与利率和预期有关。","pitfall":"利率很低时是否实际发生债券损失，还取决于后续利率、期限和信用等条件。","example":"收入提高后家庭可能保留更多支付余额。若利率上升而预期等条件不变，其投机性现金持有可能下降。"},{"id":"lm-curve","title":"LM 曲线与货币市场","summary":"每个点都使实际货币需求等于实际货币供给。","bodyHtml":"\u003cp>设实际货币需求为 L(Y,r) = kY − hr，k、h 均为正，实际货币供给 m = M/P。令需求等于供给得到 \u003cmark>r = (k/h)Y − m/h\u003c/mark>。以 Y 为横轴、r 为纵轴时，LM 的斜率是 k/h。\u003c/p>\u003cp>更高的收入增加交易等持币需求。给定实际货币供给，利率需要提高以减少投机性持币需求。h 越大或 k 越小，LM 越平坦。固定价格时，扩张货币供给使 LM 向右下方移动，收缩使 LM 向左上方移动。\u003c/p>","keyTakeaway":"用 r 对 Y 的表达式直接读取 LM 斜率。","pitfall":"改变 Y 或 r 的组合时，沿曲线读均衡关系。实际货币供给变化才会移动这条 LM 曲线。","example":"若 k = 0.5、h = 10，LM 斜率为 0.05。其他参数固定时，h 上升到 20，斜率降为 0.025。"},{"id":"lm-regions","title":"LM 曲线的三个区间","summary":"比较货币需求对利率的敏感程度。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>区间\u003c/th>\u003cth>货币需求的利率敏感性\u003c/th>\u003cth>简化模型的政策作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>凯恩斯区域\u003c/td>\u003ctd>利率极低，额外货币可以被持有，LM 接近水平\u003c/td>\u003ctd>增发货币难以继续压低利率，财政扩张可提高产出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中间区域\u003c/td>\u003ctd>LM 向右上倾斜\u003c/td>\u003ctd>财政和货币政策均可改变均衡产出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>古典区域\u003c/td>\u003ctd>利率较高，投机性持币需求很低，LM 接近垂直\u003c/td>\u003ctd>在垂直极限，财政扩张推高利率而产出不变，增加货币供给可使产出增加\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cmark>流动性陷阱\u003c/mark>描述对额外货币的需求在低利率下高度有弹性。关于政策失效的结论只适用于模型所讨论的利率传导渠道。\u003c/p>","keyTakeaway":"LM 越平坦，既定财政扩张带来的利率上升越小。","pitfall":"用货币需求的利率弹性解释水平极限。某个低利率上的实际持币余额仍可能有限。","example":"若均衡位于水平 LM 的内部，提高政府购买使 IS 右移，新均衡产出提高，利率保持该水平。"},{"id":"money-theories","title":"交易方程、现金余额与新货币数量论","summary":"区分三种货币需求分析的切入点。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>费雪交易方程\u003c/strong>将货币量、货币流通速度与名义交易量相联系。用收入表示交易的简化写法是 MV = PY。\u003c/li>\u003cli>\u003cstrong>剑桥现金余额方程\u003c/strong>强调人们希望以货币保存的名义收入比例 k，写作 M\u003csup>d\u003c/sup> = kPY。\u003c/li>\u003cli>\u003cstrong>弗里德曼的新货币数量论\u003c/strong>将货币视为财富的一种持有形式，货币需求与持久收入及货币和其他资产的相对回报等有关。\u003c/li>\u003c/ul>","keyTakeaway":"费雪从货币流通切入，剑桥学派从意愿持有切入，弗里德曼从资产选择切入。","pitfall":"MV = PY 是收入形式的关系式，若要推出物价变化，还要说明流通速度和真实产出怎样变化。","example":"若 V 恒定、真实产出 Y 也固定，M 增加 10%，收入形式的方程给出 P 同比增加 10%。"},{"id":"is-lm-equilibrium","title":"两个市场的共同均衡与失衡","summary":"联立 IS 与 LM，并分别判断曲线两侧的超额需求。","bodyHtml":"\u003cp>IS 与 LM 的交点满足产品市场和货币市场两个均衡条件。在一条向下和一条向上且于有效范围相交的模型中，共同均衡的产出与利率唯一。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>固定产出时所处位置\u003c/th>\u003cth>失衡\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>IS 上方\u003c/td>\u003ctd>利率高于产品市场均衡所需水平，计划投资偏少，产品超额供给\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IS 下方\u003c/td>\u003ctd>利率低于产品市场均衡所需水平，计划投资偏多，产品超额需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LM 上方\u003c/td>\u003ctd>利率较高，货币需求低于实际供给\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LM 下方\u003c/td>\u003ctd>利率较低，货币需求超过实际供给\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>也可以固定利率，看位于曲线的左右侧。IS 右侧意味着产出超过计划支出，LM 左侧意味着收入相关的货币需求较低。\u003c/p>","keyTakeaway":"给定 Y 比上下，或给定 r 比左右。分别判定两个市场，最后合并。","pitfall":"斜向方位如果无法确定在曲线的哪一侧，不能直接判定市场状态。","example":"若 IS 为 Y = 500 − 20r、LM 为 r = Y/20 − 5，联立得 Y = 300、r = 10。"}],"mindmap":[{"label":"产品市场均衡与货币市场均衡","target":"is-curve","children":[{"label":"IS 曲线","target":"is-curve","children":[{"label":"三部门产品市场均衡","target":"is-curve"},{"label":"投资利率敏感度或边际消费倾向提高使 IS 更平坦","target":"is-curve"},{"label":"财政扩张使 IS 右移，财政紧缩使 IS 左移","target":"is-shifts"}]},{"label":"LM 曲线","target":"lm-curve","children":[{"label":"实际货币供给等于实际货币需求","target":"lm-curve"},{"label":"凯恩斯货币需求理论","target":"money-demand","children":[{"label":"交易动机","target":"money-demand"},{"label":"预防动机","target":"money-demand"},{"label":"投机动机","target":"money-demand"},{"label":"低利率下的流动性陷阱","target":"lm-regions"}]},{"label":"r = (k/h)Y − m/h","target":"lm-curve"},{"label":"k 越小、h 越大，LM 越平坦","target":"lm-curve"},{"label":"LM 的三个区间","target":"lm-regions","children":[{"label":"凯恩斯区域接近水平","target":"lm-regions"},{"label":"中间区域向右上倾斜","target":"lm-regions"},{"label":"古典区域接近垂直","target":"lm-regions"}]},{"label":"实际货币供给增加使 LM 向右下方移动","target":"lm-curve"}]},{"label":"其他货币需求理论","target":"money-theories","children":[{"label":"费雪交易方程 MV = PY","target":"money-theories"},{"label":"剑桥现金余额方程 M = kPY","target":"money-theories"},{"label":"弗里德曼新货币数量论","target":"money-theories"}]}]},{"label":"IS-LM 模型","target":"is-lm-equilibrium","children":[{"label":"均衡状态","target":"is-lm-equilibrium","children":[{"label":"交点同时满足产品市场与货币市场的均衡","target":"is-lm-equilibrium"}]},{"label":"非均衡状态","target":"is-lm-equilibrium","children":[{"label":"IS 右侧或上方时，产品超额供给","target":"is-lm-equilibrium"},{"label":"IS 左侧或下方时，产品超额需求","target":"is-lm-equilibrium"},{"label":"LM 左侧或上方时，货币超额供给","target":"is-lm-equilibrium"},{"label":"LM 右侧或下方时，货币超额需求","target":"is-lm-equilibrium"}]}]}]},"questions":[{"id":"eco-12-q01","number":1,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"经济学中存在众多的重要曲线，其中IS 曲线表示（　　）。","options":{"A":"当产品市场达到均衡时，国民收入和物价水平之间的关系","B":"当货币市场达到均衡时，国民收入和物价水平之间的关系","C":"当产品市场达到均衡时，国民收入和利率之间的关系","D":"当货币市场达到均衡时，国民收入和利率之间的关系"},"answer":["C"],"explanationSupplement":"IS 描述在产品市场出清时，利率与产出的组合。利率通过计划投资影响产品需求。","optionExplanations":{"A":"使用的是物价与产出坐标。","B":"市场和坐标都不匹配。","C":"符合 IS 的市场与两项变量。","D":"这是 LM 的含义。"},"conceptId":"is-curve"},{"id":"eco-12-q02","number":2,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"关于 LM 曲线的表述，不正确的是（　　）。","options":{"A":"在LM 曲线上，每一点都表示收入与利息率的组合，这些组合点恰好使得货币市场处于均衡","B":"LM 曲线表示在货币市场中，货币供给等于货币需求时收入与利率的各种组合的点的轨迹","C":"LM 曲线的表达式为 M/P=ky-hr，它的斜率为负，这表明LM 曲线一般是向左上方倾斜的曲线","D":"LM 曲线是一条用来描述在货币市场均衡状态下国民收入和利率之间相互关系的曲线"},"answer":["C"],"explanationSupplement":"将 M/P = kY − hr 写成 r = (k/h)Y − M/(Ph)。在 k、h 为正时，标准坐标的斜率 k/h 为正。","optionExplanations":{"A":"曲线上每个组合使货币市场均衡。","B":"均衡要求实际货币供求相等。","C":"错误地把利率项的负号当成曲线斜率。","D":"正确描述了市场和变量。"},"conceptId":"lm-curve"},{"id":"eco-12-q03","number":3,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"如果货币市场均衡方程为 r=ky/h-m/h，则引致LM 曲线变得平坦是由于（　　）。","options":{"A":"k变小，h变大","B":"k变大，h变小","C":"k 和h同比例变大","D":"k 和h 同比例变小"},"answer":["A"],"explanationSupplement":"标准坐标下 LM 斜率为 k/h，分子减小、分母增大使其下降。","optionExplanations":{"A":"k/h 变小，曲线变平坦。","B":"k/h 变大。","C":"同倍放大不改变比率。","D":"同倍缩小不改变比率。"},"conceptId":"lm-curve"},{"id":"eco-12-q04","number":4,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"投资对利率的敏感程度不同会有不同的经济学曲线。如果投资对利率变的很敏感，那么（　　）。","options":{"A":"IS 曲线将变的更陡峭","B":"IS 曲线将变的更平坦","C":"LM 曲线将变的更陡峭","D":"LM 曲线将变的更平坦"},"answer":["B"],"explanationSupplement":"IS 斜率绝对值为 (1 − β)/d。投资对利率越敏感，d 越大，IS 越平坦。","optionExplanations":{"A":"与斜率公式相反。","B":"投资利率敏感度增大使斜率绝对值变小。","C":"投资函数影响产品市场的 IS。","D":"LM 斜率由货币需求参数决定。"},"conceptId":"is-curve"},{"id":"eco-12-q05","number":5,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在凯恩斯的三个持币动机中，他认为（　　）对利率最为敏感。","options":{"A":"交易动机","B":"预防动机","C":"投机动机","D":"无私动机"},"answer":["C"],"explanationSupplement":"持币的机会成本与利率有关，凯恩斯模型中特别敏感的是投机性货币需求。","optionExplanations":{"A":"交易性需求主要跟随交易量。","B":"预防性需求主要跟随收入和意外支出准备。","C":"相对资产收益改变会影响投机性持币。","D":"这不属于三种持币动机。"},"conceptId":"money-demand"},{"id":"eco-12-q06","number":6,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"LM 曲线是描述（　　）。","options":{"A":"产品市场均衡时，国民收入与利息率之间的关系","B":"货币市场均衡时，国民收入与利息率之间的关系","C":"货币市场均衡时，国民收入与价格之间的关系","D":"产品市场均衡时，国民收入与价格之间的关系"},"answer":["B"],"explanationSupplement":"LM 描述实际货币供求相等时的产出与利率组合。","optionExplanations":{"A":"这是 IS 的含义。","B":"符合 LM 的定义。","C":"把利率替换成了价格。","D":"市场与纵轴都不匹配。"},"conceptId":"lm-curve"},{"id":"eco-12-q07","number":7,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"根据凯恩斯的货币需求理论，（　　）与收入水平相关。","options":{"A":"投机性货币需求","B":"流动性陷阱","C":"预防性货币需求","D":"投资风险"},"answer":["C"],"explanationSupplement":"在简化模型中，交易性和预防性货币需求都随收入变化。给出的选项中只有预防性需求属于这类。","optionExplanations":{"A":"主要与利率相关。","B":"是特定低利率情形。","C":"常随收入上升。","D":"这不是该模型的货币需求类别。"},"conceptId":"money-demand"},{"id":"eco-12-q08","number":8,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在IS 曲线不变的情况下，货币量减少会引起（　　）。","options":{"A":"国民收入增加，利率下降","B":"国民收入增加，利率上升","C":"国民收入减少，利率上升","D":"国民收入减少，利率下降"},"answer":["C"],"explanationSupplement":"价格固定，货币供给减少使 LM 向左上移动。沿不变且向下倾斜的 IS 到达新均衡，产出降低、利率上升。","optionExplanations":{"A":"对应货币扩张。","B":"利率上升，但均衡产出减少。","C":"符合货币收缩。","D":"货币收缩会推高均衡利率。"},"conceptId":"lm-curve"},{"id":"eco-12-q09","number":9,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"政府支出增加使IS曲线（　　）。","options":{"A":"向左移动","B":"向右移动","C":"保持不动","D":"以上说法均有可能"},"answer":["B"],"explanationSupplement":"政府购买增加使各利率下的计划总支出和均衡产出提高，IS 向右移动。","optionExplanations":{"A":"对应政府购买减少。","B":"给定利率时均衡产出增加。","C":"政府购买是 IS 的移动因素。","D":"其他参数给定时，方向明确。"},"conceptId":"is-shifts"},{"id":"eco-12-q10","number":10,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"IS 曲线为 Y=500-2000r，下列哪一个利率和收入水平的组合不在IS 曲线上？（　　）。","options":{"A":"r = 0.02，Y = 450","B":"r = 0.05，Y = 400","C":"r=0.07,Y=360","D":"r=0.10,Y=300"},"answer":["A"],"explanationSupplement":"分别将利率代入 Y = 500 − 2000r。r = 0.02 时应有 Y = 460。","optionExplanations":{"A":"应为 460，所列数对不在曲线上。","B":"代入等于 400。","C":"代入等于 360。","D":"代入等于 300。"},"conceptId":"is-curve"},{"id":"eco-12-q11","number":11,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"在IS 曲线上存在储蓄和投资均衡的收入和利率的组合点有（　　）。","options":{"A":"一个","B":"无数个","C":"几个","D":"一个或无数个都不可能"},"answer":["B"],"explanationSupplement":"IS 是产品市场均衡的整条轨迹。两部门模型中，曲线上的每一组收入与利率都使计划储蓄等于计划投资。","optionExplanations":{"A":"与 LM 同时联立才可得到单个常见交点。","B":"曲线连续时包含无数个组合。","C":"曲线上的点不限于有限个。","D":"无数个组合正是曲线的含义。"},"conceptId":"is-curve"},{"id":"eco-12-q12","number":12,"group":"产品市场均衡与货币市场均衡","type":"discussion","stem":"当利率降到很低时，人们购买债券的风险将会（　　）","options":{"A":"变得很小","B":"变得很大","C":"不发生变化","D":"无法判定"},"answer":[],"explanationSupplement":"经典流动性偏好模型假定利率极低时，人们预期利率回升、债券价格下降，因此愿意避免潜在的价格损失。仅凭当前利率低无法确定实际风险。","optionExplanations":{"A":"缺少后续利率与债券条件，无法认定风险变小。","B":"在低利率后预期回升的模型里，预期价格风险会增强。","C":"风险也可能随预期和债券性质改变。","D":"如果只知道当前利率，无法判断实际风险。"},"conceptId":"money-demand"},{"id":"eco-12-q13","number":13,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"按照凯恩斯的货币理论，如果利率上升，货币需求将（　　）。","options":{"A":"不变","B":"下降","C":"上升","D":"均不对"},"answer":["B"],"explanationSupplement":"固定收入，利率上升提高了持币机会成本，使投机性货币需求下降。","optionExplanations":{"A":"忽略了投机动机。","B":"货币需求减少。","C":"方向相反。","D":"在通常的凯恩斯模型中有明确方向。"},"conceptId":"money-demand"},{"id":"eco-12-q14","number":14,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"按照凯恩斯的观点，人们需要货币是出于（　　）。","options":{"A":"交易动机","B":"谨慎动机","C":"投机动机","D":"以上都对"},"answer":["D"],"explanationSupplement":"凯恩斯提出交易、预防和投机三种持币动机。","optionExplanations":{"A":"用于日常支付。","B":"用于意外支出，也称预防动机。","C":"出于资产选择。","D":"三种动机都属于该模型。"},"conceptId":"money-demand"},{"id":"eco-12-q15","number":15,"group":"产品市场均衡与货币市场均衡","type":"single","stem":"利息率提高时，货币的投机需求将（　　）。","options":{"A":"增加","B":"不变","C":"减少","D":"不确定"},"answer":["C"],"explanationSupplement":"利率上升时，持有无息货币的机会成本上升。其他条件不变，投机性货币需求下降。","optionExplanations":{"A":"与模型关系方向相反。","B":"投机性需求具有利率敏感性。","C":"符合反向关系。","D":"标准模型下方向明确。"},"conceptId":"money-demand"},{"id":"eco-12-q16","number":16,"group":"产品市场均衡与货币市场均衡","type":"discussion","stem":"当出现凯恩斯陷阱的情况时，下列说法正确的是（　　）。","options":{"A":"应采取货币政策","B":"财政政策无效","C":"利率处于极高的水平","D":"货币需求无限大"},"answer":[],"explanationSupplement":"流动性陷阱发生在极低利率处。理想化模型中货币需求对利率极富弹性，增加供给时利率难以再下降。","optionExplanations":{"A":"单靠增加货币供给未必能压低利率。","B":"在基本模型的水平区，财政政策仍可移动 IS。","C":"陷阱出现在低利率而非高利率。","D":"经典模型中可理解为对额外货币的需求弹性趋于无限，实际持有量可以是有限值。"},"conceptId":"lm-regions"},{"id":"eco-12-q17","number":17,"group":"IS-LM 模型","type":"single","stem":"IS 曲线与LM 曲线的交点是（　　）。","options":{"A":"产品市场和货币市场的均衡，且利率和产出唯一","B":"总需求和总供给的均衡，且价格和产出唯一","C":"产品市场和货币市场的均衡，但利率和产出不唯一","D":"总需求和总供给的均衡，但价格和产出不唯一"},"answer":["A"],"explanationSupplement":"IS-LM 模型把利率和产出放在同一图上。常见的向下 IS 与向上 LM 相交一次，共同确定产出与利率。","optionExplanations":{"A":"符合标准模型的共同均衡。","B":"AD-AS 才在价格和产出坐标中讨论均衡。","C":"两条常见单调曲线只有一个交点。","D":"混淆了市场与坐标。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q18","number":18,"group":"IS-LM 模型","type":"single","stem":"利率和收入的组合点出现在IS 曲线右上方，LM 曲线的左上方的区域中，则表示（　　）。","options":{"A":"投资小于储蓄且货币需求小于货币供给","B":"投资小于储蓄且货币供给小于货币需求","C":"投资大于储蓄且货币需求小于货币供给","D":"投资大于储蓄且货币需求大于货币供给"},"answer":["A"],"explanationSupplement":"IS 右侧或上方是产品超额供给，两部门模型中 I \u003c S。LM 左侧或上方是货币超额供给，L \u003c M/P。","optionExplanations":{"A":"两个不等式都符合。","B":"货币市场的不等号反了。","C":"产品市场的不等号反了。","D":"两个不等式均反了。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q19","number":19,"group":"IS-LM 模型","type":"single","stem":"一般地说，位于LM 曲线左方的收入和利率的组合，都是（　　）。","options":{"A":"货币需求大于货币供给的非均衡组合","B":"货币需求小于货币供给的非均衡组合","C":"产品需求小于产品供给的非均衡组合","D":"产品需求大于产品供给的非均衡组合"},"answer":["B"],"explanationSupplement":"固定利率，LM 左方的收入较低，交易和预防持币需求较低，因此货币需求小于实际供给。","optionExplanations":{"A":"描述 LM 右侧。","B":"描述货币超额供给。","C":"仅由 LM 的位置无法判断产品市场。","D":"该判断要以 IS 的位置为依据。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q20","number":20,"group":"IS-LM 模型","type":"single","stem":"IS 曲线与LM 曲线相交时表示（　　）。","options":{"A":"产品市场处于均衡状态，而货币市场处于非均衡状态","B":"产品市场处于非均衡状态，而货币市场处于均衡状态","C":"产品市场与货币市场都处于均衡状态","D":"产品市场与货币市场都处于非均衡状态"},"answer":["C"],"explanationSupplement":"交点同时位于两条曲线上，既使计划支出等于产出，也使实际货币供求相等。","optionExplanations":{"A":"在 LM 上，货币市场也均衡。","B":"在 IS 上，产品市场也均衡。","C":"符合交点同时满足的两个条件。","D":"交点不存在这两个市场的超额需求。"},"conceptId":"is-lm-equilibrium"},{"id":"eco-12-q21","number":21,"group":"IS-LM 模型","type":"discussion","stem":"利率和收入的组合点出现在IS 曲线左上方，LM 曲线的右下方的区域中，则表示（　　）。","options":{"A":"I>S, L\u003cM","B":"I>S,L>M","C":"I\u003cS, L\u003cM","D":"I\u003cS,L>M"},"answer":[],"explanationSupplement":"LM 右下方可判货币超额需求。对向下倾斜的 IS，“左上方”未指明是在同一利率下位于左侧，还是同一产出下位于上方，两种读法的产品市场状态相反。","optionExplanations":{"A":"LM 右下方不是货币超额供给。","B":"按给定利率下的 IS 左侧解读，I > S 且 L > M。","C":"与货币市场状态不符。","D":"按给定产出下的 IS 上侧解读，I \u003c S 且 L > M。"},"conceptId":"is-lm-equilibrium"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;

 const observer = new IntersectionObserver(entries => {
  if (view !== 'learn' || $('#chapter-view').hidden) return;
  const visible=entries.filter(entry=>entry.isIntersecting).map(entry=>entry.target.id);
  if(!visible.some(id=>!state.reading.seen.includes(id)))return;
  store.update(record=>{
   record.reading.seen=[...new Set([...record.reading.seen,...visible])];
   if(!record.reading.lastConcept)record.reading.lastConcept=visible[0];
  });
 }, { threshold: 0.12, rootMargin: '-125px 0px -15% 0px' });

 function saveReadingPosition() {
  if(!readingChanged||view!=='learn'||$('#chapter-view').hidden)return;
  readingChanged=false;
  const cards=$$('.lesson-card');
  const current=cards.findLast(card=>card.getBoundingClientRect().top<=155)||cards[0];
  store.update(record=>{
   record.reading.lastConcept=current.id;
   record.reading.scrollY=window.scrollY;
  });
  if(sectionIds.has(location.hash.slice(1)))history.replaceState(null,'','#learn');
 }

 function restoreReadingPosition(saved) {
  requestAnimationFrame(()=>{
   if(saved.lastConcept) {
    if(saved.scrollY>0)window.scrollTo({top:saved.scrollY,behavior:'instant'});
    else document.getElementById(saved.lastConcept).scrollIntoView({block:'start',behavior:'instant'});
   }
   requestAnimationFrame(()=>{readingTracking=true;});
  });
 }
 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 function switchView(next, scroll=true) {
  if (!chapterViews.includes(next)) next='learn';
  saveReadingPosition();
  pausePPF();
  view=next;
  $$('.content-view').forEach(v=>v.hidden=v.id!=='view-'+next);
  $$('[data-view]').forEach(b=>{
   const active=b.dataset.view===next;
   b.classList.toggle('active',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(scroll) {
   readingTracking=false;
   $('.view-tabs').scrollIntoView({behavior:'instant',block:'start'});
   requestAnimationFrame(()=>requestAnimationFrame(()=>{readingTracking=true;}));
  }
  if(next==='map')fitMapOnFirstOpen();
  if(next==='practice')mountQuiz();
  history.replaceState(null,'','#'+next);
 }
 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
