  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

/* Catalog */

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }

.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }

.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }

.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter30","number":5,"title":"财产保险","moduleId":"insurance","moduleTitle":"保险基础","downloadName":"保险基础-05-财产保险-离线学习.html"},"lessons":{"title":"财产保险","subtitle":"先识别承保的是财产本身、对他人的赔偿责任，还是交易对手的履约风险，再判断触发条件和赔偿方式。","sections":[{"id":"property-coverage","title":"广义财产保险与财产损失保险","summary":"广义财产保险覆盖财产及相关利益，狭义财产保险主要补偿具体财产损失。","bodyHtml":"\u003cp>广义\u003cstrong>财产保险\u003c/strong>包括财产损失、责任、信用、保证等保险业务。狭义的财产保险主要是财产损失保险，典型险种包括火灾保险、运输工具保险、货物运输保险、工程保险和农业保险。财产保险通常具有补偿性，赔偿以承保损失和合同约定为基础。\u003c/p>\u003cp>\u003cstrong>火灾保险\u003c/strong>通常围绕房屋、设备、存货或家庭财产等标的承保火灾及合同列明的其他风险。常见产品有企业财产险、家庭财产险，判断时依次查标的范围、保险事故、责任免除、保额与赔偿办法。标的地点和用途可能影响风险。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 12、55、95 条分别涉及保险标的、保险价值与业务分类。经批准，财险公司可经营短期健康保险和意外伤害保险，这两类业务属于人身保险。自 2026 年 11 月 1 日施行的财险产品开发管理规定也明确区分险种类别。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=1274236&amp;itemId=928\">国家金融监督管理总局 · 财险产品开发规定\u003c/a>\u003c/p>","keyTakeaway":"财产险补偿财产损失、经济利益损失或赔偿责任，具体以承保险种为准。","pitfall":"“财险公司可以经营的业务”和“财产保险业务”采用不同分类口径。","example":"仓库因火灾损毁的是财产损失。若事故还导致经营者依法赔偿他人损失，需另看责任保险。"},{"id":"property-compensation","title":"第一风险赔偿与免赔额","summary":"先确认赔偿方式，再按保险金额、承保损失和免赔条款计算。","bodyHtml":"\u003cp>采用\u003cstrong>第一风险责任赔偿\u003c/strong>且无其他扣减时，赔款＝承保损失与保险金额两者中的较小值。保额以内称第一损失，超过保额的部分由被保险人承担。采用不足额比例赔偿时，按承保损失乘保险金额与保险价值之比计算，适用条件是保额低于保险价值且合同无另行约定。\u003c/p>\u003cp>\u003cstrong>绝对免赔额\u003c/strong>通常从核定可赔损失中扣除约定数额，低于该金额不赔。\u003cstrong>相对免赔额\u003c/strong>是启动赔付的门槛，达到合同约定的触发条件后无需再扣这笔金额。刚好等于门槛时，按条款约定判断。\u003c/p>","keyTakeaway":"先定“第一风险还是比例”，再定“绝对免赔还是相对免赔”，最后核对赔款上限。","pitfall":"保险金额是赔付限额之一，承保损失才是计算起点。","example":"住宅价值 120 万元，保额 90 万元，可赔损失 40 万元。采用第一风险赔 40 万元，采用不足额比例规则且无其他扣减则为 30 万元。"},{"id":"motor-insurance","title":"机动车保险的保障对象","summary":"分别核对本车、车上人员、车载货物和第三者损失。","bodyHtml":"\u003cp>\u003cstrong>交强险\u003c/strong>是法定强制责任保险，按条例在责任限额内赔偿道路交通事故造成的相应受害人损失，受害人范围不含本车人员和被保险人。\u003cstrong>机动车损失保险\u003c/strong>保障本车承保的直接损失。\u003cstrong>商业第三者责任保险\u003c/strong>承保依法应向第三者承担的约定赔偿责任，\u003cstrong>车上人员责任保险\u003c/strong>按约定保障对本车乘员的赔偿责任。车载货物损失另核对货运险、附加保障等合同安排。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对交强险条例，以及中国保险行业协会公布的普通机动车商业保险示范条款。该示范条款列机动车损失险、商业第三者责任险和车上人员责任险三项独立主险，特种车等另有示范条款。\u003ca href=\"https://xzfg.moj.gov.cn/front/law/detail?LawID=162\">国家行政法规库 · 交强险条例\u003c/a>　\u003ca href=\"https://www.iachina.cn/art/2020/9/4/art_24_104621.html\">中国保险行业协会 · 商业车险示范条款\u003c/a>\u003c/p>","keyTakeaway":"本车损失看车损险，第三者责任看交强险及商业三者险，车上人员与货物各看专门保障。","pitfall":"同一次事故可产生多类损失。商业第三者责任险和交强险有各自的适用规则。","example":"暴雨中汽车碰树，本车受损和车上乘客受伤分别核对车损险和车上人员保障。"},{"id":"agricultural-insurance","title":"农业保险、保额与政策支持","summary":"农业保险覆盖合同约定的生产风险，保额可按成本、产量或估定价值确定。","bodyHtml":"\u003cp>\u003cstrong>农业保险\u003c/strong>承保种植业、林业、畜牧业、渔业等生产中约定的自然灾害、意外事故、疫病和疾病等引起的财产损失。农业风险常有地域性和季节性。实践中可按生产成本、约定产量对应价值或估定价值确定保险金额，主要险种可按承保的种植、森林、养殖等生产对象区分。\u003c/p>\u003cp>财政保费补贴可以提高农业保险的可及性。WTO 的\u003cstrong>绿箱\u003c/strong>指满足《农业协定》附件 2 条件、对贸易或生产影响很小的国内支持。政府参与收入保险或自然灾害救助项目，需要核对一般条件和相应类别的损失门槛、补偿限制等专门条件。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《农业保险条例》第 2、3 条涉及农业保险的范围和政府引导、市场运作等原则。WTO《农业协定》附件 2 第 1、7、8 段规定绿箱及相关项目条件。\u003ca href=\"https://xzfg.moj.gov.cn/front/law/detail?LawID=361\">国家行政法规库 · 农业保险条例\u003c/a>　\u003ca href=\"https://www.wto.org/ENGLISH/docs_e/legal_e/14-ag_02_e.htm\">世界贸易组织 · 农业协定附件 2\u003c/a>\u003c/p>","keyTakeaway":"农险按生产活动及约定事故判断。政策支持、是否强制投保、WTO 通报类别需要分别核对。","pitfall":"政府参与农险只说明存在政策支持。判断绿箱要知道方案如何触发和计算补偿。","example":"同一地区的水稻保险可按投入成本设保额。遇洪涝后，还需按合同核定受损面积和赔偿条件。"},{"id":"liability-insurance","title":"责任保险及常见险种","summary":"用“谁因什么对谁负赔偿责任”区分公众、产品、雇主和职业责任。","bodyHtml":"\u003cp>\u003cstrong>责任保险\u003c/strong>以被保险人对第三者依法应负的赔偿责任为保险标的。具体合同可约定承保与排除的责任范围、赔偿限额及有关法律费用。责任确定后，直接向第三者赔付及其请求条件可按《保险法》第 65 条判断。\u003c/p>\u003cul>\u003cli>\u003cstrong>公众责任\u003c/strong>常见于综合公众责任、营业场所、电梯运行、承包人对公众和个人家庭日常活动责任。\u003c/li>\u003cli>\u003cstrong>产品责任\u003c/strong>关注缺陷产品造成使用者或他人的人身伤害或财产损失。产品自身质量或保修风险应另看相应合同。\u003c/li>\u003cli>\u003cstrong>雇主责任\u003c/strong>关注员工工作中受伤、伤残、死亡或患约定职业病时，雇主依法或依约应负的赔偿责任。故意等情形须核对除外条款。\u003c/li>\u003cli>\u003cstrong>职业责任\u003c/strong>关注提供专业服务时的约定责任，例如医疗、律师、会计师、建筑和工程技术人员责任。\u003c/li>\u003c/ul>\u003cp>官方核验（2026 年 11 月 11 日）。核对《保险法》第 65、66 条、《民法典》第 1202、1203 条和用人单位依法参加工伤保险的要求。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/202006/t20200602_463886.shtml\">最高人民检察院 · 民法典\u003c/a>　\u003ca href=\"https://app.www.gov.cn/govdata/gov/202108/04/474314/article.html\">中国政府网 · 工伤保险参保说明\u003c/a>\u003c/p>","keyTakeaway":"顾客因产品缺陷受伤看产品责任，雇员因工作受伤看雇主责任，公众在场所受伤看场所责任。","pitfall":"购买商业雇主责任险后，用人单位仍须履行法定工伤保险参保义务。","example":"玩具缺陷伤及客户时，对应产品责任。员工操作机器受伤时，对应雇主责任并核对工伤保险待遇。"},{"id":"liability-triggers","title":"期内发生式与期内索赔式","summary":"分别找出事故或损害发生日、首次提出索赔日和合同期间。","bodyHtml":"\u003cp>\u003cstrong>期内发生式\u003c/strong>主要按保险事故或损害是否发生在保险期间内判断承保期间。期后提出的索赔仍可能适用，需要核对条款、通知和法定时效。\u003cstrong>期内索赔式\u003c/strong>通常要求第三者首次提出赔偿请求发生在保险期间或约定的延长报告期，发生在保单生效前的损害还要看追溯日、已知情形等条件。\u003c/p>","keyTakeaway":"期内发生式看事故或损害时间，期内索赔式看首次索赔及相关报告约定。","pitfall":"生产日期、事故日、发现日、第三者索赔日和向保险人报案日都可能不同，逐一写在时间线上。","example":"产品在保单生效前生产，使用者在保险期间内受伤。按期内发生式，生产早于承保期本身不排除责任。"},{"id":"credit-guarantee","title":"信用保险与保证保险的角色","summary":"两类保险都保障履约信用风险，差别在于谁投保。","bodyHtml":"\u003cp>三方分别是承担赔偿责任的保险人、享有债权或合同利益的权利人、负有还款或履约义务的义务人。\u003cstrong>信用保险\u003c/strong>中，权利人作为投保人和被保险人，承保义务人的履约信用风险。\u003cstrong>保证保险\u003c/strong>中，履约义务人投保，权利人是被保险人。风险必须具有不确定性。\u003c/p>\u003cp>信用类业务可见国内信用保险、出口信用保险及广义分类中的投资保险。保证类产品可见履约或其他确实保证、雇员诚实保证、产品保证等，具体看保险责任。其保障具有信用增级作用，赔付仍须满足保险合同约定。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对《信用保险和保证保险业务监管办法》第 1、7、33 条，政策性保险公司中长期出口信用保险和海外投资保险业务有适用例外。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/governmentDetail.html?docId=904960&amp;generaltype=1\">国家金融监督管理总局 · 信用保险和保证保险业务监管办法\u003c/a>\u003c/p>","keyTakeaway":"信用险是权利人给他人的信用风险投保。保证险是义务人给自己的履约风险投保。","pitfall":"投保人负责投保与缴费，被保险人享有合同保障。信用风险主体在两个险种中均指履约义务人。","example":"供货商为买方赊购货款投保是信用保险，承包商为自己的工程履约向保险人投保是保证保险。"},{"id":"export-credit","title":"出口信用保险与经营模式","summary":"出口信用保险保障出口收款等约定风险，具体政策工具还要符合国际规则。","bodyHtml":"\u003cp>\u003cstrong>出口信用保险\u003c/strong>可以对买方拖欠、破产以及约定政治风险造成的收款损失提供保障。我国政策性出口信用保险由国家出资设立的国有政策性保险公司中国信保承办。中国信保公开营业执照登记为有限责任公司（国有控股），年报列有财政部及中央汇金派驻股权董事。按政策承办模式和按工商登记性质分类，需要分别核对口径。\u003c/p>\u003cp>WTO《补贴与反补贴措施协定》附件 I 第 (j) 项针对政府或政府控制机构以不足以覆盖长期经营成本和损失的费率提供相关出口信用保险等计划。判断一个方案须审查它的实际设计和运行。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对中国信保的营业执照、2025 年报及 WTO 协定正文。\u003ca href=\"https://sx.sinosure.com.cn/images/gywm/gsjj/xxpl/hlwbxxxplu/gsjcxx/2026/04/15/1494017395218657280.pdf\">中国信保 · 营业执照\u003c/a>　\u003ca href=\"https://js.sinosure.com.cn/xwzx/ndbd/ndbg_2025/\">中国信保 · 2025 年报\u003c/a>　\u003ca href=\"https://www.wto.org/english/docs_e/legal_e/24-scm_01_e.htm\">世界贸易组织 · 补贴与反补贴措施协定\u003c/a>\u003c/p>","keyTakeaway":"出口信用保险看出口信用风险和政策性承办机构，补贴合规还要看费率等条件。","pitfall":"出口收款风险和海外投资政治风险可由不同的产品处理，投保时要核对保险标的。","example":"出口企业向海外买方赊销设备，买方破产造成应收账款损失时，检查出口信用保单是否覆盖该损失。"},{"id":"financing-credit-risk","title":"融资性信用保证保险的风险控制","summary":"分散承保、审查融资交易与履约能力，并控制自留责任和集中度。","bodyHtml":"\u003cp>\u003cstrong>融资性信保业务\u003c/strong>承保借贷、融资租赁等融资合同的履约信用风险。经营时要识别底层融资合同和真实交易，检查履约义务人的资产、信用与偿债能力。风险管理还包括小额分散、集中度管理、净资产约束、再保险和持续跟踪。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《信用保险和保证保险业务监管办法》以净资产约束自留未了责任余额及单一义务人集中度，第 6 条禁止承保保险公司的控股股东、实际控制人、子公司及其他关联方的资金融入业务，第 15 条要求审慎调查和跟踪融资性业务。2017 年暂行办法已被该办法废止。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/governmentDetail.html?docId=904960&amp;generaltype=1\">国家金融监督管理总局 · 信用保险和保证保险业务监管办法\u003c/a>\u003c/p>","keyTakeaway":"风险审查覆盖单笔真实性、义务人偿债能力和组合集中度。","pitfall":"关联方的资金融入与资金融出是不同概念。判断承保限制时先看它在交易中是哪一方。","example":"同一集团企业集中融资时，逐笔金额较小也可能形成相关性和集中暴露，应按监管口径合并审查。"}],"mindmap":[{"label":"狭义的财产保险","target":"property-coverage","children":[{"label":"定义与范围","target":"property-coverage","children":[{"label":"广义含财产损失、责任、信用与保证","target":"property-coverage"},{"label":"狭义承保具体财产损失","target":"property-coverage"}]},{"label":"财产损失险分类","target":"property-coverage","children":[{"label":"火灾、运输工具、货运、工程、农业","target":"property-coverage"}]},{"label":"火灾保险","target":"property-coverage","children":[{"label":"特征与主要险种","target":"property-coverage"},{"label":"适用范围、责任与赔偿","target":"property-compensation","children":[{"label":"第一风险和比例赔偿","target":"property-compensation"},{"label":"相对免赔和绝对免赔","target":"property-compensation"}]}]},{"label":"机动车辆保险","target":"motor-insurance","children":[{"label":"交强险","target":"motor-insurance"},{"label":"车损、商业三者和车上人员责任","target":"motor-insurance"},{"label":"附加保障","target":"motor-insurance"}]},{"label":"农业保险","target":"agricultural-insurance","children":[{"label":"成本、产量或估定价值确定保额","target":"agricultural-insurance"},{"label":"种植、林业、畜牧及渔业","target":"agricultural-insurance"},{"label":"财政支持与绿箱适用条件","target":"agricultural-insurance"}]}]},{"label":"责任保险","target":"liability-insurance","children":[{"label":"对第三者依法承担的赔偿责任","target":"liability-insurance"},{"label":"公众责任","target":"liability-insurance","children":[{"label":"综合公众、场所、电梯、承包人、个人家庭","target":"liability-insurance"}]},{"label":"产品责任","target":"liability-insurance","children":[{"label":"产品缺陷损害他人人身或财产","target":"liability-insurance"},{"label":"期内发生式和期内索赔式","target":"liability-triggers"}]},{"label":"雇主责任","target":"liability-insurance","children":[{"label":"雇员工伤、职业病与约定除外责任","target":"liability-insurance"}]},{"label":"职业责任","target":"liability-insurance","children":[{"label":"医疗、律师、会计和工程专业责任","target":"liability-insurance"}]}]},{"label":"信用、保证保险","target":"credit-guarantee","children":[{"label":"保险人、权利人、履约义务人","target":"credit-guarantee"},{"label":"信用保险","target":"credit-guarantee","children":[{"label":"权利人作为投保人和被保险人","target":"credit-guarantee"},{"label":"国内信用、出口信用与投资保障","target":"credit-guarantee","children":[{"label":"出口信用政策工具及适用规则","target":"export-credit"}]}]},{"label":"保证保险","target":"credit-guarantee","children":[{"label":"义务人投保，权利人受保障","target":"credit-guarantee"},{"label":"确实保证、诚实保证与产品保证","target":"credit-guarantee"}]},{"label":"融资性业务与风险控制","target":"financing-credit-risk"}]}]},"questions":[{"id":"ins-05-q01","number":1,"group":"狭义的财产保险","type":"single","stem":"根据《中华人民共和国保险法》的规定，财产保险业务包括（　）。","options":{"A":"财产损失保险、责任保险、意外伤害和健康保险","B":"财产损失保险、责任保险、信用保险、保证保险","C":"财产损失保险、保证保险、意外伤害保险","D":"财产损失保险、责任保险、保证保险、健康保险"},"answer":["B"],"explanationSupplement":"符合资质的财险公司经批准可以经营短期健康和意外伤害保险。判断险种类别时，两者仍属于人身保险。","optionExplanations":{"A":"混入意外伤害和健康保险。","B":"符合财产保险业务的法定列举。","C":"混入意外伤害险，遗漏责任、信用等业务。","D":"健康保险归入人身保险业务。"},"conceptId":"property-coverage"},{"id":"ins-05-q02","number":2,"group":"狭义的财产保险","type":"single","stem":"广义财产保险的保险标的是指（　）。","options":{"A":"财产及其有关的人身意外","B":"财产及其有关的健康、人身意外","C":"财产及其有关的经济利益和损害赔偿责任","D":"财产及其有关的健康、人身意外、经济利益和损害赔偿责任"},"answer":["C"],"explanationSupplement":"责任保险可以赔付第三者人身伤害引发的赔偿责任，但它直接承保的是被保险人的赔偿责任。","optionExplanations":{"A":"人身意外本身属于另一类风险。","B":"健康与人身意外不属于广义财产保险的标的。","C":"同时包含财产、经济利益及相关赔偿责任。","D":"健康和人身意外的加入扩大了范围。"},"conceptId":"property-coverage"},{"id":"ins-05-q03","number":3,"group":"狭义的财产保险","type":"single","stem":"财产保险合同属于（　）。","options":{"A":"实践性合同","B":"强制性合同","C":"补偿性合同","D":"给付性合同"},"answer":["C"],"explanationSupplement":"判断合同性质时看赔偿金额如何产生。财产险通常以实际承保损失为基础，还要核对保额和条款限制。","optionExplanations":{"A":"是否交付实物属于另一种合同分类。","B":"部分险种有强制要求，财产保险整体不限于强制投保。","C":"符合按承保损失补偿的典型特征。","D":"定额给付常用于寿险等产品。"},"conceptId":"property-coverage"},{"id":"ins-05-q04","number":4,"group":"狭义的财产保险","type":"single","stem":"某业主将自有的一套价值 120 万元的住宅投保了家庭财产保险，保险金额为 90 万元，后房屋发生火灾，造成部分损失共计 40 万元。按第一风险责任赔偿方式保险人应承担的赔偿金是（　）。","options":{"A":"120 万元","B":"90 万元","C":"40 万元","D":"30 万元"},"answer":["C"],"explanationSupplement":"题目指定第一风险方式。无其他扣减时，取损失和保额中的较小值。","optionExplanations":{"A":"120 万元是住宅价值。","B":"90 万元是保额，本次损失较小。","C":"40 万元是限额内的承保损失。","D":"30 万元是乘不足额比例 90 ÷ 120 的结果。"},"conceptId":"property-compensation"},{"id":"ins-05-q05","number":5,"group":"狭义的财产保险","type":"single","stem":"某企业投保了企业财产保险，保险金额为 1000 万元，约定的免赔额是 1000 元，保险事故发生后总计造成的损失为 50 万元，若按相对免赔额保险公司应赔（　）。","options":{"A":"1000 元","B":"499000 元","C":"500000 元","D":"不予赔偿"},"answer":["C"],"explanationSupplement":"相对免赔额用于判断是否进入赔付。达到触发条件后通常无需扣除该笔金额。若题目改成绝对免赔额，则按约定扣减。","optionExplanations":{"A":"1000 元是门槛。","B":"这是按绝对免赔额扣减的结果。","C":"达到相对免赔门槛后的本题赔款。","D":"题设损失已超过门槛且属于承保事故。"},"conceptId":"property-compensation"},{"id":"ins-05-q06","number":6,"group":"狭义的财产保险","type":"discussion","stem":"机动车辆保险的基本险是（　）。","options":{"A":"车辆损失险和车上人员安全险","B":"机动车辆损失险和第三者责任保险","C":"机动车辆损失险和无过错损失补偿险","D":"车上人员安全险和车上货物责任险"},"answer":[],"explanationSupplement":"题目没有限定分类口径。如果问普通机动车商业保险示范条款的主险，须同时列车损、商业三者和车上人员责任，现有选项没有完整组合。","optionExplanations":{"A":"缺少第三者责任，且车上人员安全险与示范条款名称不同。","B":"涵盖两项常见主险，按普通商业车险示范条款仍缺车上人员责任。","C":"无过错损失补偿险未列入示范条款的独立主险。","D":"车上货物保障须核对具体条款，不能代替完整主险分类。"},"conceptId":"motor-insurance"},{"id":"ins-05-q07","number":7,"group":"狭义的财产保险","type":"single","stem":"某人将其自有的汽车投保了车辆损失险和第三者责任保险。在保险期间，由于下暴雨视线不清，保险车辆撞到树上，造成车上人员医疗费用、所载货物和车辆损失。对此，保险公司应该承担的赔偿责任是（　）。","options":{"A":"车辆损失","B":"所载货物和车辆损失","C":"车上人员医疗费用和车辆损失","D":"车上人员医疗费用和所载货物"},"answer":["A"],"explanationSupplement":"把事故后果按对象拆开。题中只有车损及第三者责任保障，人员和货物没有另列适用保单。题目所列选项中只有车辆损失符合。","optionExplanations":{"A":"对应车损险保障范围。","B":"所载货物需要核对货运险或附加责任。","C":"本车人员医疗费用不属于商业三者险的第三者损失。","D":"这两项均不能由题设两项保障直接推出。"},"conceptId":"motor-insurance"},{"id":"ins-05-q08","number":8,"group":"狭义的财产保险","type":"single","stem":"承保农业生产者和经营者在从事种植业和养殖业生产过程中因自然灾害和意外事故所造成损失的一种财产保险是（　）。","options":{"A":"农村保险","B":"农业保险","C":"农民保险","D":"政策保险"},"answer":["B"],"explanationSupplement":"按保险标的和生产风险识别。农业保险还可以覆盖林业、畜牧业、渔业等生产中约定的风险。","optionExplanations":{"A":"“农村”描述地域范围，包含的业务可能更广。","B":"对应农业生产过程中的财产风险。","C":"“农民”描述人群，不能区分其生产财产保障与人身保障。","D":"政策性描述支持方式，题目需要具体险种。"},"conceptId":"agricultural-insurance"},{"id":"ins-05-q09","number":9,"group":"狭义的财产保险","type":"single","stem":"为了保障农业生产的稳定，促进农村经济发展，许多国家都把农业保险作为（　）保险业务。","options":{"A":"商业","B":"强制","C":"非盈利性","D":"政策性"},"answer":["D"],"explanationSupplement":"政策性指政策目标和支持机制，可以与保险公司市场化承保并存。我国条例还强调自主自愿等原则。","optionExplanations":{"A":"商业机构可以参与运营，题目强调政策支持属性。","B":"政策支持本身不代表强制投保。","C":"政策目标不能直接推出经营不得盈利。","D":"保障生产稳定与促进农村发展的目标体现政策性。"},"conceptId":"agricultural-insurance"},{"id":"ins-05-q10","number":10,"group":"狭义的财产保险","type":"multiple","stem":"农业保险是指保险机构根据农业保险合同，对被保险人在（　）生产中因保险标的遭受约定的自然灾害、意外事故、疫病、疾病等保险事故所造成的财产损失，承担赔偿保险金责任的保险活动。（多选，2019）","options":{"A":"种植业","B":"林业","C":"畜牧业","D":"渔业"},"answer":["A","B","C","D"],"explanationSupplement":"四项都在列举范围内。具体赔付仍要求标的、损失和事故符合合同约定。","optionExplanations":{"A":"作物遭受承保灾害的损失可纳入。","B":"森林或林木面临的约定风险可纳入。","C":"牲畜等养殖生产风险可纳入。","D":"渔业生产中的约定风险可纳入。"},"conceptId":"agricultural-insurance"},{"id":"ins-05-q11","number":11,"group":"狭义的财产保险","type":"discussion","stem":"农业在国民经济中的基础地位和农业的弱势性决定了农业风险保障的重要性。财政通过农业保险对农业生产进行补贴符合世界贸易组织的规则，在世界各国被广泛应用，属于（　）。（2020）","options":{"A":"白箱政策","B":"绿箱政策","C":"黄箱政策","D":"灰箱政策"},"answer":[],"explanationSupplement":"若补充“满足附件 2 条件”，B 符合考点。实际判断需核对财政安排、是否提供价格支持、触发损失门槛和补偿标准等。","optionExplanations":{"A":"附件 2 的免削减支持通常称绿箱。","B":"满足附件 2 的一般与适用专门条件时成立。","C":"有贸易扭曲的支持可能纳入黄箱等监管口径，题干缺少判断方案的事实。","D":"不是该协定附件 2 免削减支持的通称。"},"conceptId":"agricultural-insurance"},{"id":"ins-05-q12","number":12,"group":"责任保险","type":"single","stem":"责任保险是以（　）依法应承担的民事损害赔偿责任作为承保对象的保险。","options":{"A":"投保人对被保险人","B":"被保险人对第三者","C":"保险人对第三者","D":"保险人对被保险人"},"answer":["B"],"explanationSupplement":"先定位致害责任人和受害人，再分析保险人依据保险合同如何履行赔付。","optionExplanations":{"A":"投保人身份本身不足以确定侵权赔偿义务。","B":"对应《保险法》第 65 条的责任保险定义。","C":"保险人可能直接向第三者赔偿，但其合同义务与被保险人的原赔偿责任不同。","D":"保险人对被保险人的合同赔付义务并非承保标的。"},"conceptId":"liability-insurance"},{"id":"ins-05-q13","number":13,"group":"责任保险","type":"single","stem":"某制药厂在 2006 年投保了产品责任保险，保险期限为 1 年，以“期内发生式”为基础承保。在保险期限内，一患者服用该厂 2006 年生产的药物，因其配制上的过失致使该患者身体受到了潜在的伤害。该患者在 2007 年发现并提出索赔，保险人是否要承担赔偿责任（　）。","options":{"A":"否，因为索赔是在保险期满后提出的","B":"是，因为患者的损害是在保险期内发生的","C":"是，因为导致患者损害的被保险产品是在保险期限内生产的","D":"否，因为患者的损害是在保险期满后发现的"},"answer":["B"],"explanationSupplement":"分开药物生产、损害发生、发现和索赔四个时点。题目给了损害已在期内发生的事实，实务中仍应核对具体条款和时效。","optionExplanations":{"A":"期后提出索赔本身不足以否定期内发生式的保障。","B":"抓住损害在保险期内发生。","C":"产品的生产日期不是这里的触发标准。","D":"期后发现与期后发生是两件事。"},"conceptId":"liability-triggers"},{"id":"ins-05-q14","number":14,"group":"责任保险","type":"single","stem":"生产热水器的厂家，2018 年投保了产品责任险，在 2017 年 4 月 15 日发生保险事故，生产厂家于 2018 年 4 月 15 日向保险公司索赔，保险公司赔付，这个承保基础是（　）。","options":{"A":"赔偿限额","B":"期内发生式","C":"期内索赔式","D":"以上都正确"},"answer":["C"],"explanationSupplement":"期内索赔式一般还看首次索赔日、追溯日期、报告期限和已知事项。本题已给出赔付结果，用来辨别触发机制。","optionExplanations":{"A":"赔偿限额决定最高赔付金额。","B":"若按通常期内发生式，题设事故发生在保单期间之前。","C":"符合题设以索赔时点触发的方式。","D":"前两项并非本题描述的承保基础。"},"conceptId":"liability-triggers"},{"id":"ins-05-q15","number":15,"group":"责任保险","type":"single","stem":"责任保险中常见的电梯责任保险属于（　）。","options":{"A":"公众责任保险","B":"雇主责任保险","C":"职业责任保险","D":"产品责任保险"},"answer":["A"],"explanationSupplement":"按责任的来源区分。电梯制造缺陷可能另外涉及产品责任，题目问通常的电梯责任险类别。","optionExplanations":{"A":"电梯运行致第三者受损，符合公众责任的场所风险。","B":"雇主责任针对对雇员依法或依约承担的责任。","C":"职业责任针对专业服务责任。","D":"产品责任涉及生产销售等主体因缺陷产品应负的责任。"},"conceptId":"liability-insurance"},{"id":"ins-05-q16","number":16,"group":"责任保险","type":"single","stem":"按照保险利益原则，制造商对因其制造的产品有缺陷，而对用户或消费者造成人身伤害或财产损失依法应承担的经济赔偿责任，具有保险利益，对此制造商可以投保的主要险种是（　）。","options":{"A":"公众责任保险","B":"产品质量险","C":"产品责任险","D":"雇主责任险"},"answer":["C"],"explanationSupplement":"题目给出缺陷产品造成他人人身伤害或财产损失。产品自身质量、修理和更换另看相关保证合同。","optionExplanations":{"A":"公众责任是更广的概念，题设指向产品缺陷。","B":"质量险或产品保证处理约定的产品自身质量等损失。","C":"保障制造商因缺陷产品依法承担的赔偿责任。","D":"雇主责任保护的是雇主对员工的约定赔偿责任。"},"conceptId":"liability-insurance"},{"id":"ins-05-q17","number":17,"group":"责任保险","type":"single","stem":"下列哪项不属于公众责任保险的险种（　）。","options":{"A":"雇主责任保险","B":"个人责任保险","C":"承包人责任保险","D":"场所责任保险"},"answer":["A"],"explanationSupplement":"注意题干的“不属于”。选择对员工承担责任的一项，其他三项可按约定覆盖对外部第三者的赔偿责任。","optionExplanations":{"A":"与雇佣关系及工作伤害有关。","B":"可覆盖个人或家庭日常活动中对他人承担的约定责任。","C":"可保障施工等活动对公众造成的约定责任。","D":"可保障营业场所等发生事故对公众引发的责任。"},"conceptId":"liability-insurance"},{"id":"ins-05-q18","number":18,"group":"责任保险","type":"single","stem":"A 公司是一家玩具生产企业，为防范生产的玩具给客户造成人身伤害或财产损失等风险，A 公司可以投保（　）。（2020）","options":{"A":"产品责任保险","B":"公众责任保险","C":"雇主责任险","D":"职业责任险"},"answer":["A"],"explanationSupplement":"识别风险来自产品进入使用环节。若风险改为顾客在展厅滑倒，则更接近场所公众责任。","optionExplanations":{"A":"承保产品缺陷引发的约定赔偿责任。","B":"一般公众责任与特定产品缺陷风险分开识别。","C":"题目中的客户不是雇员。","D":"风险来自制造的玩具，未涉及专业服务过失。"},"conceptId":"liability-insurance"},{"id":"ins-05-q19","number":19,"group":"责任保险","type":"single","stem":"某承建公司承包了 2022 年冬奥会北京延庆场馆的建筑工程。若该公司希望，项目建筑工人在场馆建设过程中，因意外事故导致伤残、死亡或患有职业病以后可以获得经济赔偿，那么该公司应当投（　）。（2022）","options":{"A":"场所责任保险","B":"职业责任保险","C":"承包人责任保险","D":"雇主责任保险"},"answer":["D"],"explanationSupplement":"关键词是“项目建筑工人”“工作过程中”和“职业病”。商业雇主责任保险与用人单位依法缴纳的工伤保险各有适用规则。","optionExplanations":{"A":"场所责任通常针对场所内对公众的损害。","B":"职业责任关注专业服务造成的约定赔偿责任。","C":"承包人对公众的责任与对雇员的赔偿责任不同。","D":"题设的雇员因工伤害风险与该险种对应。"},"conceptId":"liability-insurance"},{"id":"ins-05-q20","number":20,"group":"信用、保证保险","type":"single","stem":"信用保险合同的被保险人是信用放款的（　）。（2020）","options":{"A":"债务人","B":"债权人","C":"抵押人","D":"被保证人"},"answer":["B"],"explanationSupplement":"先看谁面临未收款损失。贷款人作为权利人投保信用保险，借款人的履约风险是承保对象。","optionExplanations":{"A":"债务人负还款义务，其履约风险被承保。","B":"债权人是信用保险中的权利人和被保险人。","C":"提供抵押财产的身份不足以确定谁享有信用保险保障。","D":"被保证人一般指履约义务人。"},"conceptId":"credit-guarantee"},{"id":"ins-05-q21","number":21,"group":"信用、保证保险","type":"discussion","stem":"我国采取的出口信用保险经营模式主要为（　）。（2022）","options":{"A":"政府直接办理","B":"政府全资公司经营模式","C":"政府控股公司经营模式","D":"进出口银行兼营模式"},"answer":[],"explanationSupplement":"按现行登记名称，C 更贴近“国有控股”。财政部和中央汇金等国有出资背景与由政府直接办理属于不同问题。题目未指定按历史政策模式还是现行登记口径分类。","optionExplanations":{"A":"业务由具独立法人地位的政策性保险公司承办。","B":"可用于识别历史考点的国家出资背景，不能直接替代现行登记性质。","C":"现行公开营业执照登记为国有控股。","D":"政策性出口信用保险由中国信保承办。"},"conceptId":"export-credit"},{"id":"ins-05-q22","number":22,"group":"信用、保证保险","type":"multiple","stem":"关于信用保险与保证保险，以下表述正确的是（　）。（多选，2022）","options":{"A":"信用保险以商品赊销和信用放款中的债务人的信用作为保险标的","B":"保险人是在预期将发生损失的前提下提供服务的","C":"在贷款信用保险中，贷款方（即债权人）是投保人","D":"在履约保证保险中，权利人是投保人"},"answer":["A","C"],"explanationSupplement":"“谁可能违约”用于确定承保风险，“谁申请保险”用于区分信用险和保证险。保险可以估计损失概率，实际损失须有不确定性。","optionExplanations":{"A":"符合赊销和贷款场景的履约信用风险。","B":"精算可以估计期望损失，具体损失并未确定发生。","C":"贷款方是贷款信用保险中的投保人和被保险人。","D":"保证保险由负有履约义务的人投保。"},"conceptId":"credit-guarantee"},{"id":"ins-05-q23","number":23,"group":"信用、保证保险","type":"single","stem":"（　）作为 WTO 允许的政策性金融工具，是各国政府促进对外经贸发展、保障本国企业利益、防范国际经营风险所采用的通行做法。（2019）","options":{"A":"企业信用保险","B":"出口退税保险","C":"境外投资保险","D":"出口信用保险"},"answer":["D"],"explanationSupplement":"题目中的“允许”需要按计划适用条件理解。WTO《补贴与反补贴措施协定》附件 I 第 (j) 项对政府支持的有关保险计划费率有约束，具体方案需检查长期经营成本和损失等条件。","optionExplanations":{"A":"范围更宽，可能涵盖国内交易信用。","B":"题目考查出口交易的信用风险，退税属于另一政策领域。","C":"主要围绕跨境投资的约定政治等风险。","D":"对应出口买方违约等出口信用风险。"},"conceptId":"export-credit"},{"id":"ins-05-q24","number":24,"group":"信用、保证保险","type":"multiple","stem":"近年来，有的保险公司在经营融资性信用保证保险中产生较大亏损。为降低融资性信用保证保险风险，保险公司可以（　）。（多选，2023）","options":{"A":"承保小额、分散的融资性信用保证保险业务","B":"穿透底层资产，了解借款人的真实融资需求","C":"加强与股东业务协同，承保股东的融资业务","D":"控制信用保证保险自留责任占公司净资产的比重"},"answer":["A","B","D"],"explanationSupplement":"逐项看措施降低的是集中风险、信息不对称还是资本压力。股东协同不能替代独立审查，关联融资还须满足禁止性规定。","optionExplanations":{"A":"分散承保有助于控制单一或集中损失。","B":"检查底层资产和真实融资需求有助于识别欺诈及违约风险。","C":"现行规则禁止承保控股股东、实际控制人、子公司及其他关联方的资金融入业务。","D":"以净资产约束自留未了责任余额有助于使承保规模匹配风险承受能力。"},"conceptId":"financing-credit-risk"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);

 const observer = new IntersectionObserver(entries => {
  if (view !== 'learn' || $('#chapter-view').hidden) return;
  const visible=entries.filter(entry=>entry.isIntersecting).map(entry=>entry.target.id);
  if(!visible.some(id=>!state.reading.seen.includes(id)))return;
  store.update(record=>{
   record.reading.seen=[...new Set([...record.reading.seen,...visible])];
   if(!record.reading.lastConcept)record.reading.lastConcept=visible[0];
  });
 }, { threshold: 0.12, rootMargin: '-125px 0px -15% 0px' });

 function saveReadingPosition() {
  if(!readingChanged||view!=='learn'||$('#chapter-view').hidden)return;
  readingChanged=false;
  const cards=$$('.lesson-card');
  const current=cards.findLast(card=>card.getBoundingClientRect().top<=155)||cards[0];
  store.update(record=>{
   record.reading.lastConcept=current.id;
   record.reading.scrollY=window.scrollY;
  });
  if(sectionIds.has(location.hash.slice(1)))history.replaceState(null,'','#learn');
 }

 function restoreReadingPosition(saved) {

   if(saved.lastConcept) {
    if(saved.scrollY>0)window.scrollTo({top:saved.scrollY,behavior:'instant'});
    else document.getElementById(saved.lastConcept).scrollIntoView({block:'start',behavior:'instant'});
   }

  });
 }
 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;

  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');

   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');

  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
