  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter26","number":1,"title":"风险与保险","moduleId":"insurance","moduleTitle":"保险基础","downloadName":"保险基础-01-风险与保险-离线学习.html","visual":"risk-matrix","visualSectionId":"risk-management","visuals":[{"type":"risk-matrix","sectionId":"risk-management"}]},"lessons":{"title":"风险与保险","subtitle":"沿着风险因素、事故和损失，理解保险如何转移和分散经济负担。","sections":[{"id":"risk-elements","title":"风险的含义与三个要素","summary":"区分使事故更可能发生的条件、事故本身与最终损失。","bodyHtml":"\u003cp>保险语境中的\u003cstrong>风险\u003c/strong>是损失发生的不确定性，包括是否发生、何时发生和损失程度。可用\u003cmark>风险因素 → 风险事故 → 损失\u003c/mark>追踪风险形成过程。风险因素是增加事故发生可能性或扩大损失程度的条件，风险事故是直接造成损失的事件，损失是事故造成的经济价值减少。\u003c/p>\u003cp>从保险公司经营角度，实际出险率或赔付水平高于定价与准备金所依据的估计，会形成保险风险。监管规则也将保险风险、市场风险和信用风险作为不同的风险类别。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.nfra.gov.cn/chinese/docfile/2022/ce1d31a4be034fd4ad9db8913dc7faa3.pdf\">金融监管总局 · 偿付能力风险管理要求与评估\u003c/a>\u003c/p>","keyTakeaway":"识别风险要素时，先找“为什么更容易发生”，再找“发生了什么”，最后看“造成多少损失”。","pitfall":"同一事件在不同因果链中可扮演不同角色。按题干给定的损失和观察对象确定角色。","example":"电线老化是风险因素，火灾是风险事故，烧毁的设备价值是损失。"},{"id":"risk-types","title":"风险的分类","summary":"先识别分类标准，再选择对应的风险类型。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>分类标准\u003c/th>\u003cth>类型\u003c/th>\u003cth>判断线索\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>风险性质\u003c/td>\u003ctd>纯粹风险、投机风险\u003c/td>\u003ctd>纯粹风险的结果是损失或无损失，投机风险还可能有收益\u003c/td>\u003c/tr>\u003ctr>\u003ctd>风险对象\u003c/td>\u003ctd>人身、财产、责任、信用\u003c/td>\u003ctd>判断损害落在人身、财产、依法承担的赔偿责任还是信用义务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发生原因\u003c/td>\u003ctd>自然、社会、经济、政治等\u003c/td>\u003ctd>判断风险主要由什么引起\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发生环境\u003c/td>\u003ctd>静态风险、动态风险\u003c/td>\u003ctd>静态风险可发生在相对稳定环境中，动态风险与技术、社会经济变化相关\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"“按性质”对应纯粹与投机，“按对象”对应人身、财产、责任、信用。","pitfall":"同一个风险可以同时属于不同维度的类别。标签要与题目的分类标准匹配。","example":"房屋因雷击起火，按原因可归自然风险，按受损对象可归财产风险，按结果可能性可归纯粹风险。"},{"id":"risk-management","title":"风险管理的目标、流程和工具","summary":"用成本与保障的权衡安排预防、控制及事故后的资金。","bodyHtml":"\u003cp>家庭、企业等经济主体进行\u003cstrong>风险管理\u003c/strong>时，通常先识别风险，再衡量频率和损失程度，评价优先级，选择技术，最后检查效果。基本目标是在成本约束下取得尽可能充分的安全保障。损失前重在预防，损失后重在恢复与持续经营。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>技术\u003c/th>\u003cth>要处理的问题\u003c/th>\u003cth>例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>控制型\u003c/td>\u003ctd>避免暴露、降低事故频率、减轻损失程度\u003c/td>\u003ctd>放弃危险活动、定期巡检、安装自动喷淋\u003c/td>\u003c/tr>\u003ctr>\u003ctd>财务型\u003c/td>\u003ctd>安排资金、确定谁承担损失的经济后果\u003c/td>\u003ctd>建立自留准备金，通过保险或其他合同转移约定损失\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"损失预防侧重减少发生次数，损失抑制侧重降低发生后的损失程度。","pitfall":"风险转移改变损失经济负担的承担者，风险分散改变风险集中程度。购买保险可同时涉及两个角度。","example":"企业给机房安装烟感和喷淋降低事故损失，同时投保财产险转移合同承保部分的经济负担。"},{"id":"insurance-definition","title":"保险的定义、市场与基本职能","summary":"从合同承诺和风险集合两层理解保险。","bodyHtml":"\u003cp>商业保险通过合同安排分担特定风险。投保人缴纳保险费，保险人按合同对符合条件的财产损失承担赔偿，或在约定的人身事件、年龄或期限条件满足时给付保险金。\u003cmark>基本职能是分散风险以及补偿损失或给付保险金\u003c/mark>，防灾防损、资金运用、社会管理等可视为派生职能。\u003c/p>\u003cp>保险交易提供未来一段期间的风险保障。是否赔付及金额通常要等约定条件成就才确定。保险是无形保障服务，商品属性体现在市场交易和定价。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）：《保险法》第二条规定商业保险的合同关系与赔偿或给付责任。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_4c715a53f3d4402c89f62ae77809f638.html\">市场监管总局 · 中华人民共和国保险法\u003c/a>\u003c/p>","keyTakeaway":"投保人以确定的保费换取约定保障，保险人集中管理并分摊许多风险单位的损失。","pitfall":"保险的未来履约特点可用远期承诺理解，金融期货合约则另有交易结构和监管规则。","example":"家庭为火灾投保后，仍要维护电线。事故如符合保单条件，可按约定获得赔偿。"},{"id":"insurable-risk","title":"可保风险、同质性与大数法则","summary":"判断风险能否进入一个可估计、可分担的风险池。","bodyHtml":"\u003cp>传统可保条件关注纯粹损失、发生的偶然性和意外性，以及同类风险单位的规模和分布。可承保风险通常存在值得转移的损失，且许多类似标的有发生损失的可能。若大多数风险单位可能同时遭受重大损失，风险集中将削弱分散效果，需要再保险、分层或其他机制。\u003c/p>\u003cp>\u003cstrong>同质风险\u003c/strong>指风险单位在相关的种类、品质、性能、价值等方面大体相近，可归入可比较的风险组。在独立或弱相关等条件下，样本规模扩大时，每单位的平均损失或损失频率趋近于期望，这就是\u003cmark>大数法则\u003c/mark>在保险中的应用。\u003c/p>","keyTakeaway":"同质与低相关帮助估计和分散风险。计算时留意题目谈的是平均损失、频率还是总损失。","pitfall":"大数法则说明平均结果更稳定。随着承保数量增加，总损失的绝对金额或波动仍可能增加。","example":"一千户条件相似且分布在不同地区的住宅，通常比少量集中在同一高风险地带的住宅更容易分散个体事故波动。"},{"id":"insurance-types","title":"保险的分类与承保方式","summary":"识别商业、社会、政策性保险，以及多方承保的区别。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>分类维度\u003c/th>\u003cth>示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>性质或功能\u003c/td>\u003ctd>社会保险、商业保险、政策性保险\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保险标的\u003c/td>\u003ctd>人身保险、财产保险。狭义财产损失保险可与责任保险、信用保证保险分列\u003c/td>\u003c/tr>\u003ctr>\u003ctd>承保方式与责任次序\u003c/td>\u003ctd>原保险、再保险、复合保险、重复保险、共同保险\u003c/td>\u003c/tr>\u003ctr>\u003ctd>实施方式\u003c/td>\u003ctd>自愿保险、强制保险\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保险价值是否事先约定\u003c/td>\u003ctd>定值保险、不定值保险\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>原保险人与投保人直接订立原保险合同，再保险由保险人向其他保险人分出部分承保责任。多个保险人按份共同承保可称共同保险。同一标的、同一保险利益、同一保险事故分别投保且保险金额总和超过保险价值，符合《保险法》第五十六条所规定的重复保险定义。相同条件下总金额未超过保险价值，学习分类中常称复合保险。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）：《社会保险法》第二条列出基本养老、医疗、工伤、失业、生育等社会保险。商业保险机构可按安排受托承办城乡居民大病保险等服务，具体以项目规则为准。\u003ca href=\"https://shanxi.chinatax.gov.cn/zdgk/detail/sx-11400-545-1784612\">税务总局网站 · 中华人民共和国社会保险法\u003c/a>，\u003ca href=\"https://www.nhsa.gov.cn/art/2020/9/25/art_110_6861.html\">国家医保局 · 商业保险机构参与医保经办\u003c/a>\u003c/p>","keyTakeaway":"按标的、实施方式和承保结构分清题目问的是哪个分类维度。","pitfall":"社会保险提供制度性基本保障，商业保险按具体合同提供保障。保障水平取决于制度、险种与合同安排。","example":"同一设备价值 100 万元，对相同风险分别向两家投保 40 万元和 50 万元，合计 90 万元，符合本章的复合保险分类条件。"}],"mindmap":[{"label":"风险","target":"risk-elements","children":[{"label":"风险因素、风险事故、损失","target":"risk-elements"},{"label":"风险分类","target":"risk-types","children":[{"label":"性质：纯粹风险、投机风险","target":"risk-types"},{"label":"对象：人身、财产、责任、信用","target":"risk-types"},{"label":"原因：自然、社会、经济、政治","target":"risk-types"},{"label":"环境：静态、动态","target":"risk-types"}]},{"label":"风险管理的概念与目标","target":"risk-management","children":[{"label":"主体：家庭、企业等经济单位","target":"risk-management"},{"label":"选择管理技术，权衡成本与安全保障","target":"risk-management"}]},{"label":"管理流程","target":"risk-management","children":[{"label":"识别、衡量、评价","target":"risk-management"},{"label":"选择技术与评估效果","target":"risk-management"}]},{"label":"风险管理技术","target":"risk-management","children":[{"label":"控制型：避免、预防、抑制","target":"risk-management"},{"label":"财务型：风险自留、风险转移","target":"risk-management"}]}]},{"label":"保险","target":"insurance-definition","children":[{"label":"商业保险的合同定义","target":"insurance-definition"},{"label":"可保风险的要件","target":"insurable-risk","children":[{"label":"纯粹风险，具有偶然性和意外性","target":"insurable-risk"},{"label":"大量同质标的有遭受损失的可能","target":"insurable-risk"},{"label":"存在重大损失的可能","target":"insurable-risk"},{"label":"避免多数标的同时遭受重大损失","target":"insurable-risk"},{"label":"大数法则与分散","target":"insurable-risk"}]},{"label":"保险的分类","target":"insurance-types","children":[{"label":"性质：社会、商业、政策性","target":"insurance-types"},{"label":"标的：人身、财产、责任、信用保证","target":"insurance-types"},{"label":"承保：原保险、再保险、复合、重复、共同","target":"insurance-types"},{"label":"实施方式：自愿、强制","target":"insurance-types"},{"label":"保险价值：定值、不定值","target":"insurance-types"}]},{"label":"保险的职能","target":"insurance-definition","children":[{"label":"基本职能：风险分散、损失补偿或保险金给付","target":"insurance-definition"},{"label":"派生职能：防灾防损、融通资金、社会管理","target":"insurance-definition"}]}]}]},"questions":[{"id":"ins-01-q01","number":1,"group":"风险","type":"single","stem":"保险中的风险是指（　）的不确定性。","options":{"A":"发生的结果","B":"损失发生","C":"损失程度","D":"损失补偿"},"answer":["B"],"explanationSupplement":"在保险语境中，先看损失是否会发生，再考虑时间和程度。题目要求选择能够概括损失不确定性的说法。","optionExplanations":{"A":"表述没有明确限定保险所关注的损失。","B":"直接指出损失发生具有不确定性。","C":"损失程度是整体不确定性的一个方面。","D":"损失补偿是保险合同可能产生的结果。"},"conceptId":"risk-elements"},{"id":"ins-01-q02","number":2,"group":"风险","type":"single","stem":"只有损失机会而无获利可能的风险是（　）。","options":{"A":"投机风险","B":"纯粹风险","C":"社会风险","D":"政治风险"},"answer":["B"],"explanationSupplement":"用可能结果来区分。纯粹风险的结果是受到损失或维持原状，比如房屋失火风险。投机风险还可能带来收益。","optionExplanations":{"A":"投机风险同时具有损失和收益的可能。","B":"纯粹风险只有损失或无损失两种结果。","C":"社会风险按成因分类。","D":"政治风险也按风险成因分类。"},"conceptId":"risk-types"},{"id":"ins-01-q03","number":3,"group":"风险","type":"single","stem":"按风险的性质分类，可以分为（　）。","options":{"A":"人身风险和财产风险","B":"纯粹风险和投机风险","C":"经济风险和技术风险","D":"自然风险和社会风险"},"answer":["B"],"explanationSupplement":"按性质分类的依据是结果是否可能包含获利。只有损失或无损失的是纯粹风险，另有获利可能的是投机风险。","optionExplanations":{"A":"人身和财产是按受影响对象分类。","B":"对应风险性质的分类。","C":"经济或技术变动属于风险来源。","D":"自然与社会是风险成因维度。"},"conceptId":"risk-types"},{"id":"ins-01-q04","number":4,"group":"风险","type":"single","stem":"设我国国民收入水平提高，同时环境污染、生活节奏和压力等因素使糖尿病、高血压、癌症等疾病发病率升高。保险公司的投资者关注其健康保险未来赔付水平可能持续上升。这些投资者担忧的是保险公司面临的什么风险？（　）","options":{"A":"环境污染风险","B":"医疗风险","C":"保险风险","D":"流动性风险"},"answer":["C"],"explanationSupplement":"把观察对象放在承保公司的赔付上。发病率或赔付费用高于原先预期，将使保险合同的赔付成本增加。","optionExplanations":{"A":"环境污染在题设中是影响发病和赔付的外部因素。","B":"医疗风险可描述诊疗过程中的损害或不确定性。","C":"实际赔付超出承保估计属于保险风险。","D":"流动性风险关注能否在到期时获得足够资金支付。"},"conceptId":"risk-elements"},{"id":"ins-01-q05","number":5,"group":"风险","type":"single","stem":"风险因素是风险事故发生的（　），是造成损失的（　）。","options":{"A":"间接原因，外部原因","B":"直接原因，间接原因","C":"外部原因，内部原因","D":"潜在原因，间接原因"},"answer":["D"],"explanationSupplement":"例如线路老化增加失火可能性。真正造成财产受损的是失火事故，线路老化通过失火间接造成损失。","optionExplanations":{"A":"外部或内部取决于所研究的对象，无法概括风险因素的角色。","B":"风险事故是损失的直接原因，风险因素在事故发生前形成条件。","C":"内外部并非此处判断两种因果角色的标准。","D":"风险因素增加事故可能性，并通过事故间接带来损失。"},"conceptId":"risk-elements"},{"id":"ins-01-q06","number":6,"group":"风险","type":"single","stem":"只有（　）的存在，才有风险事故发生的可能性。","options":{"A":"风险因素","B":"风险损失","C":"风险事故","D":"风险变化"},"answer":["A"],"explanationSupplement":"这道题按风险因素、风险事故、损失的先后关系判断。事故的发生以相关风险因素或条件存在为背景。","optionExplanations":{"A":"风险因素是可能促成风险事故的条件。","B":"风险损失通常发生在事故之后。","C":"风险事故是题干所问可能发生的事件。","D":"风险变化描述风险程度的变动。"},"conceptId":"risk-elements"},{"id":"ins-01-q07","number":7,"group":"风险","type":"multiple","stem":"风险的基本要素包括（　）。","options":{"A":"风险因素","B":"风险事故","C":"损失","D":"风险评估"},"answer":["A","B","C"],"explanationSupplement":"用一条因果链识别三要素。风险因素影响事故发生概率或程度，风险事故直接引发损失，损失是事故后果。","optionExplanations":{"A":"对应事故发生的条件。","B":"对应造成损害的事件。","C":"对应经济价值的减少等后果。","D":"风险评估是管理流程中的活动。"},"conceptId":"risk-elements"},{"id":"ins-01-q08","number":8,"group":"风险","type":"single","stem":"风险管理的基本目标是（　）。","options":{"A":"以最小的成本获得最小的安全保障","B":"以最大的成本获得最大的安全保障","C":"以最小的成本获得最大的安全保障","D":"以最大的成本获得最小的安全保障"},"answer":["C"],"explanationSupplement":"实际选择需要权衡成本与剩余风险。在可达到的保障水平下选择较低成本，或在给定预算内争取更高保障。","optionExplanations":{"A":"低成本要与足够保障相配合。","B":"追求保障时也应比较成本。","C":"概括了控制成本和提高保障的综合目标。","D":"高成本与低保障同时偏离管理目标。"},"conceptId":"risk-management"},{"id":"ins-01-q09","number":9,"group":"风险","type":"single","stem":"风险管理中损失前目标是（　）。","options":{"A":"消除和降低风险发生的必然性","B":"消除和降低风险发生的可能性","C":"使受损企业的生产得以迅速恢复","D":"使受损家园得以迅速重建"},"answer":["B"],"explanationSupplement":"先判断措施作用在事故发生前还是发生后。事故前可以预防或回避风险，降低事故发生的概率。","optionExplanations":{"A":"风险强调不确定性，应从发生可能性判断。","B":"预防、控制等可以降低风险事故发生的可能性。","C":"恢复生产属于事故后的目标。","D":"重建受损家园属于事故后的目标。"},"conceptId":"risk-management"},{"id":"ins-01-q10","number":10,"group":"风险","type":"single","stem":"控制型风险管理技术的目的是（　）。","options":{"A":"提供基金的方式做财务安排","B":"降低损失频率和减少损失程度","C":"降低损失频率","D":"减少损失幅度"},"answer":["B"],"explanationSupplement":"控制型措施直接作用于事故的发生或后果，例如巡检降低火灾频率，喷淋减轻失火后的损失。","optionExplanations":{"A":"基金安排属于财务型技术。","B":"涵盖降低发生频率和减轻损失程度两方面。","C":"降低频率是预防措施的目标，只覆盖一部分。","D":"减少幅度是减损措施的目标，只覆盖一部分。"},"conceptId":"risk-management"},{"id":"ins-01-q11","number":11,"group":"风险","type":"single","stem":"以下不属于控制型风险管理技术的是（　）。","options":{"A":"避免","B":"预防","C":"抑制","D":"转移"},"answer":["D"],"explanationSupplement":"按本章分类，风险回避、预防和抑制用于改变风险发生或损失程度。保险等财务型风险转移安排的是损失的承担方式。","optionExplanations":{"A":"退出风险活动属于回避。","B":"降低事故发生机会属于预防。","C":"事故发生时减轻损失属于抑制。","D":"题目在财务型的意义上使用转移，故选此项。"},"conceptId":"risk-management"},{"id":"ins-01-q12","number":12,"group":"风险","type":"discussion","stem":"保险是一种（　）风险的办法。","options":{"A":"降低","B":"集中","C":"分散","D":"转移"},"answer":[],"explanationSupplement":"从投保人的风险管理角度，保险转移承保范围内的经济负担，D 成立。从保险人集合许多独立或低相关风险的角度，保险也发挥分散作用，C 成立。题干没有限定观察角度。","optionExplanations":{"A":"购买保险后，个体自担的经济风险可降低，事故发生概率取决于预防等措施。","B":"保险人将许多风险集合起来管理，集中是分散的前置步骤。","C":"从风险池角度，保险使许多个体分担损失。","D":"从投保人角度，保险合同转移约定范围内的经济负担。"},"conceptId":"risk-management"},{"id":"ins-01-q13","number":13,"group":"风险","type":"single","stem":"设医疗费用支出增长、居民健康意识提高，更多人加入跑步、健走、游泳等健身锻炼。从风险管理角度看，这些行为属于（　）。","options":{"A":"损失控制","B":"风险回避","C":"风险自留","D":"风险融资"},"answer":["A"],"explanationSupplement":"题目考查行为直接作用于风险条件的分类。以改善身体状况、降低相关损失发生可能性为目标的措施，可归入损失控制。","optionExplanations":{"A":"降低损失发生概率属于控制型措施。","B":"回避通常意味着退出某项风险活动。","C":"自留指自己承担经济损失。","D":"风险融资为可能的损失预先安排资金。"},"conceptId":"risk-management"},{"id":"ins-01-q14","number":14,"group":"风险","type":"single","stem":"面对养老支出不足的风险，人们选择购买养老保险来弥补退休后的支出缺口。这种风险管理策略属于（　）。","options":{"A":"风险回避","B":"风险自留","C":"风险转移","D":"风险分散"},"answer":["C"],"explanationSupplement":"以个人购买商业养老保险为题设，支付保费换取合同约定的养老给付，由保险人承担相应的给付义务，属于风险转移。","optionExplanations":{"A":"退休后仍有养老支出需求。","B":"自行储蓄并完全自行承担属于风险自留。","C":"通过保险合同由保险人承担约定经济负担。","D":"多样化资产或风险敞口是常见分散方式，题目直接问购买合同的策略。"},"conceptId":"risk-management"},{"id":"ins-01-q15","number":15,"group":"保险","type":"single","stem":"下列有关保险的陈述错误的是（　）。","options":{"A":"保险是风险处理的传统有效的措施","B":"保险是分摊意外事故损失的一种财务安排","C":"保险体现的是一种民事法律关系","D":"保险不具有商品属性"},"answer":["D"],"explanationSupplement":"从商业保险合同看，投保人缴费，保险人提供约定保障，形成有价格的服务交易。合同同时规定双方的民事权利义务。","optionExplanations":{"A":"保险是常用的风险管理工具。","B":"风险池和保费安排可以分担承保事故损失。","C":"商业保险合同载明民事权利与义务。","D":"商业保险提供可定价、可交易的保障服务，此项错误。"},"conceptId":"insurance-definition"},{"id":"ins-01-q16","number":16,"group":"保险","type":"single","stem":"关于社会保险与商业保险，以下陈述错误的是（　）。","options":{"A":"社会保险具有立法强制性，商业保险通常为自愿参加","B":"社会保险具有福利性和政策性，商业保险以盈利性为目标","C":"社会保险比商业保险的覆盖人群更广、保障水平更高","D":"商业保险可以接受政府委托，办理某些项目的社会保险"},"answer":["C"],"explanationSupplement":"社会保险由法律规定相关制度，承担基本保障职责。商业保险通常依合同自愿投保，保障范围与限额取决于具体产品。覆盖面与保障水平是不同指标。","optionExplanations":{"A":"社会保险的法定性质突出，商业保险通常按自愿原则订立，也有法律规定的例外。","B":"社会保险强调基本保障，经营性商业保险通常按市场原则开展业务。","C":"社会保险覆盖面可以较广，不能由此推出保障水平总是高于商业保险。","D":"商业保险机构可按制度安排接受委托承担指定的医疗保障经办服务。"},"conceptId":"insurance-types"},{"id":"ins-01-q17","number":17,"group":"保险","type":"discussion","stem":"关于保险市场的本质特征，以下表述错误的是（　）。","options":{"A":"保险市场交易的标的是风险","B":"保险市场有固定的场所和交易时间","C":"保险市场是一种特殊的期货市场","D":"保险市场是非即时结清的市场"},"answer":[],"explanationSupplement":"保险市场可以通过不同渠道订立合同，没有统一的固定交易场所或时间。保险合同的赔付具有未来性和不确定性，但称其为“期货市场”需要明确这是类比。按期货市场的严格定义理解，B 与 C 都会有问题。","optionExplanations":{"A":"市场交易的经济内容可理解为承保风险及对应保障服务。","B":"保险业务可通过多个场所、渠道和时间开展。","C":"保险具有未来履约特征，金融期货市场的标准化交易结构属于不同概念。","D":"通常要到未来事件发生后，才能确认最终是否赔付。"},"conceptId":"insurance-definition"},{"id":"ins-01-q18","number":18,"group":"保险","type":"single","stem":"同质风险的集合体是保险风险集合与分散的前提条件之一。同质风险的含义是（　）。","options":{"A":"风险单位在种类、品质、性能等方面大体相近，但价值差异较大","B":"风险单位在种类、品质、价值等方面大体相近，但性能差异较大","C":"风险单位在性能、品质、价值等方面大体相近，但种类差异较大","D":"风险单位在种类、性能、品质、价值等方面大体相近"},"answer":["D"],"explanationSupplement":"同质性有利于把相似的出险频率和损失程度归类估计。在题目列出的维度中，相近范围最完整的选项符合定义。","optionExplanations":{"A":"显著的价值差异可能带来不同损失规模。","B":"显著的性能差异可能改变事故频率。","C":"种类差异较大可能对应不同风险形成机制。","D":"各关键维度大体相近，适合归入相同风险组。"},"conceptId":"insurable-risk"},{"id":"ins-01-q19","number":19,"group":"保险","type":"multiple","stem":"可保风险的要件有（　）。","options":{"A":"风险不是投机的","B":"风险必须是偶然的","C":"风险必须是意外的","D":"风险应有发生重大损失的可能性"},"answer":["A","B","C","D"],"explanationSupplement":"传统保险依赖可描述、可估计并可集合的损失风险。题列四项都是传统可保风险判据中的要点。","optionExplanations":{"A":"传统保险主要处理有损失或无损失的纯粹风险。","B":"发生时点、概率或损失结果存在不确定性。","C":"投保人的故意行为与意外风险有不同处理。","D":"损失可能较大时，预先分担具有明显保障价值。"},"conceptId":"insurable-risk"},{"id":"ins-01-q20","number":20,"group":"保险","type":"single","stem":"同质的风险损失事件的不同单位，如果大量结合在一个组里，那么结合的单位越多，发生风险损失的波动幅度就会逐渐减少而趋向于稳定。这是保险经营的一个重要定律，叫做（　）。","options":{"A":"随机定律","B":"大数法则","C":"趋同定律","D":"概率法则"},"answer":["B"],"explanationSupplement":"在风险单位足够相近且相互独立或相关性较低等条件下，样本增多使相对频率和单位平均损失趋稳。题干中的波动应按相对或平均口径理解。","optionExplanations":{"A":"随机性说明结果存在不确定性，无法给出样本增多后的趋稳结论。","B":"大数法则说明样本均值随样本规模扩大趋近于期望。","C":"“趋同定律”不是这项保险统计原理的名称。","D":"概率法则是广义说法，题目要求识别特定的收敛原理。"},"conceptId":"insurable-risk"},{"id":"ins-01-q21","number":21,"group":"保险","type":"single","stem":"人身保险和社会保险的共同点包括（　）等。","options":{"A":"经营主体","B":"费率厘定的数理基础","C":"实施方式","D":"适用原则"},"answer":["B"],"explanationSupplement":"两类制度都需要评估死亡率、疾病率或养老支出等不确定因素，可使用概率与精算方法。具体缴费标准的确定还受各自制度目标影响。","optionExplanations":{"A":"社会保险经办机构与商业保险公司承担不同职责。","B":"估计大规模群体的风险和资金需求时，可以使用共同的数理工具。","C":"法定参保和商业保险合同的实施方式通常不同。","D":"两类制度的法律依据和保障原则各有侧重。"},"conceptId":"insurance-types"},{"id":"ins-01-q22","number":22,"group":"保险","type":"single","stem":"投保人以保险利益的全部或部分，分别向数个保险人投保相同种类的保险，签订数个保险合同，其保险金额总和不超过保险价值的一种保险称为（　）。","options":{"A":"复合保险","B":"联合保险","C":"共同保险","D":"重复保险"},"answer":["A"],"explanationSupplement":"先看合同数量，再比较保险金额合计与保险价值。若相同保险利益与事故分别订立多个合同，且保险金额合计未超过保险价值，可归为复合保险。","optionExplanations":{"A":"多个合同金额合计未超过保险价值，符合复合保险。","B":"此处没有给出可据以认定联合承保的条件。","C":"共同保险通常由多家保险人按份共同承保同一业务。","D":"保险法规定的重复保险还要求保险金额总和超过保险价值。"},"conceptId":"insurance-types"},{"id":"ins-01-q23","number":23,"group":"保险","type":"multiple","stem":"依照承保方式对保险进行划分，可分为（　）。","options":{"A":"重复保险","B":"共同保险","C":"复合保险","D":"信用保险"},"answer":["A","B","C"],"explanationSupplement":"题目问多家保险人怎样承接同一风险。看合同是否分别订立、是否约定共同承保和保险金额的合计。","optionExplanations":{"A":"按分别投保和总金额是否超过保险价值识别。","B":"多家保险人分担同一承保责任属于承保方式。","C":"分别投保且总金额未超过保险价值属于该分类。","D":"信用保险按承保风险或保障对象分类。"},"conceptId":"insurance-types"},{"id":"ins-01-q24","number":24,"group":"保险","type":"discussion","stem":"关于保险的不同分类标准，以下说法正确的有（　）。","options":{"A":"按照保险的实施方式，可以分为自愿保险和强制保险","B":"按照保险对象的不同，可以分为财产保险和人身保险","C":"按照保险实施范围的不同，可以分为社会保险和普通保险","D":"按照保险承担的责任次序，可以分为原保险和再保险"},"answer":[],"explanationSupplement":"A、B、D 使用可明确说明的分类标准。C 的“普通保险”需要给出范围定义，社会保险、商业保险和政策性保险也可以按制度性质划分。不同口径会改变 C 是否纳入，因此适合讨论分类维度。","optionExplanations":{"A":"自愿或强制由实施规则决定。","B":"财产与人身可按保障对象划分。","C":"需要先界定“普通保险”，才能判断这组分类是否完整。","D":"直接承保和由保险人再分保可按责任次序区分。"},"conceptId":"insurance-types"},{"id":"ins-01-q25","number":25,"group":"保险","type":"single","stem":"保险作为风险管理的一种方法，其基本职能是（　）。","options":{"A":"分散风险，补偿损失","B":"分散风险，排除损失","C":"消除风险，排除损失","D":"排除风险，消化损失"},"answer":["A"],"explanationSupplement":"保险人集中保费和承保风险，在合同约定的事件发生后赔偿财产损失或给付人身保险金。许多保单持有人共同分担承保损失。","optionExplanations":{"A":"概括了保险作为风险管理工具的两项基本职能。","B":"保险可以分散经济负担，事故和损失仍可能发生。","C":"保险通过合同赔付缓冲损失后果。","D":"预防和控制措施可减少风险，保险主要承担约定的经济后果。"},"conceptId":"insurance-definition"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;

   const rec=Object.hasOwn(raw.answers,q.id)?raw.answers[q.id]:null;
   if(rec){const selected=cleanSelected(rec.selected,q);if(!selected.length||rec.submitted!==true||!Number.isSafeInteger(rec.attempts)||rec.attempts<1)throw Error('答题记录格式不完整');out.answers[q.id]={selected,submitted:true,correct:window.StudyQuiz.grade(q,selected),attempts:rec.attempts,everWrong:rec.everWrong===true||!window.StudyQuiz.grade(q,selected),lastAnsweredAt:typeof rec.lastAnsweredAt==='string'?rec.lastAnsweredAt:''};}

 const observer = new IntersectionObserver(entries => {

  store.update(record=>{
   record.reading.seen=[...new Set([...record.reading.seen,...visible])];
   if(!record.reading.lastConcept)record.reading.lastConcept=visible[0];
  });
 }, { threshold: 0.12, rootMargin: '-125px 0px -15% 0px' });

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

    let d = '';
    for (let i = 0; i <= steps; i++) {
      const t = start + (end - start) * (i / steps);
      const val = fn(t);
      if (!Number.isFinite(val)) continue;
      d += (d ? ' L' : 'M') + xMap(t).toFixed(1) + ' ' + yMap(val).toFixed(1);

        <p>拖动收入分配不平等程度，观察洛伦兹曲线弯曲幅度与阴影面积 A 的变化，直观理解基尼系数 0.4 警戒线。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <div class="chart-caption">
            <span><i class="chart-line mv-base-line"></i>绝对平等线（45°）</span>

            <g class="tick-label" text-anchor="end"><text x="56" y="235">25%</text><text x="56" y="172">50%</text><text x="56" y="109">75%</text><text x="56" y="46">100%</text></g>
            <path class="mv-fill-cs" data-role="area-a"/>

          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    // L(p) = p^k => Gini = (k - 1)/(k + 1)
    const x = p => X0 + p * W;
    const y = v => Y0 - v * H;
    const kIn = root.querySelector('[data-role="k"]');
    function draw() {
      const k = kIn.valueAsNumber;
      const gini = (k - 1) / (k + 1);
      const b50 = Math.pow(0.5, k) * 100;
      const curveD = samplePath(p => Math.pow(p, k), 0, 1, 50, x, y);
      root.querySelector('[data-role="curve"]').setAttribute('d', curveD);
      root.querySelector('[data-role="area-a"]').setAttribute('d', curveD + ` L${x(0)} ${y(0)} Z`);

        ? 'G < 0.2：收入分配高度平均，洛伦兹曲线紧贴 45° 绝对平等线。'
        : gini < 0.4

          : `G = ${fmt(gini, 2)} ≥ 0.4：超过国际常用的收入差距警戒线，洛伦兹曲线明显向右下方弯曲。`;
    }
    kIn.addEventListener('input', draw);
    draw();
  }

      root.querySelector('[data-role="is0"]').setAttribute('d', c.is0);
      root.querySelector('[data-role="is1"]').setAttribute('d', c.is1);
      root.querySelector('[data-role="e0"]').setAttribute('cx', c.e0[0]);
      root.querySelector('[data-role="e0"]').setAttribute('cy', c.e0[1]);
      root.querySelector('[data-role="e1"]').setAttribute('cx', c.e1[0]);
      root.querySelector('[data-role="e1"]').setAttribute('cy', c.e1[1]);
      root.querySelector('[data-role="f-val"]').textContent = c.f;
      root.querySelector('[data-role="m-val"]').textContent = c.m;
      root.querySelector('[data-role="msg"]').textContent = c.msg;

    radios.forEach(r => r.addEventListener('change', draw));

  // 9. Chapter 17: Solow Growth Model Steady State
  function mountSolow(root) {
    root.innerHTML = `
      <div class="inline-visual-header">
        <span class="inline-visual-badge">交互图解</span>
        <h4>索罗增长模型：储蓄率、折旧率与人均资本稳态 k*</h4>
        <p>调节储蓄率 s 或折旧率 δ，观察实际投资曲线 s·f(k) 与持平投资线 δ·k 的交点（稳态 k*）如何移动。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <div class="chart-caption">
            <span><i class="chart-line mv-base-line"></i>人均产出 y = f(k)</span>
            <span><i class="chart-line mv-c1-line"></i>人均投资 s·f(k)</span>
            <span><i class="chart-line mv-c2-line"></i>折旧线 δ·k</span>
          </div>
          <svg viewBox="0 0 540 360" role="img" aria-label="索罗增长模型稳态互动图">
            <rect x="66" y="42" width="420" height="252" class="mv-grid-box"/>
            <path class="chart-axis" d="M66 30V294H498 M61 37l5-7 5 7 M491 289l7 5-7 5" fill="none" stroke-width="1.5"/>
            <text x="14" y="18" class="axis-label">人均产出 / 投资</text>
            <text x="276" y="346" text-anchor="middle" class="axis-label">人均资本存量 k</text>
            <g class="tick-label" text-anchor="middle"><text x="66" y="316">0</text><text x="171" y="316">25</text><text x="276" y="316">50</text><text x="381" y="316">75</text><text x="486" y="316">100</text></g>
            <g class="tick-label" text-anchor="end"><text x="56" y="235">3</text><text x="56" y="172">6</text><text x="56" y="109">9</text><text x="56" y="46">12</text></g>
            <path class="mv-base-curve" data-role="yk"/>
            <path class="mv-curve-1" data-role="sfk"/>
            <path class="mv-curve-2" data-role="dk"/>
            <path class="mv-guide" data-role="guide"/>
            <circle r="6" class="mv-dot-eq" data-role="pt"/>
            <text class="point-label" data-role="lbl">k*</text>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">储蓄率 s <output data-role="s-out">35%</output></label>
          <input type="range" data-role="s" min="15" max="60" step="5" value="35">
          <label class="range-label">折旧率 δ <output data-role="d-out">5%</output></label>
          <input type="range" data-role="d" min="3" max="10" step="1" value="5">
          <div class="ppf-outputs">
            <div><span>稳态人均资本 k*</span><strong data-role="k-val">49</strong></div>
            <div><span>稳态人均产出 y*</span><strong data-role="y-val">7.0</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    // y = sqrt(k), s*sqrt(k) = d*k => k* = (s/d)^2, y* = s/d
    const x = k => X0 + (k / 100) * W;
    const y = v => Y0 - (Math.min(12, v) / 12) * H;
    root.querySelector('[data-role="yk"]').setAttribute('d', samplePath(k => Math.sqrt(k), 0, 100, 60, x, y));
    const sIn = root.querySelector('[data-role="s"]');
    const dIn = root.querySelector('[data-role="d"]');
    function draw() {
      const s = sIn.valueAsNumber / 100, d = dIn.valueAsNumber / 100;
      const ks = Math.pow(s / d, 2);
      const ys = s / d;
      const inv = d * ks;
      root.querySelector('[data-role="sfk"]').setAttribute('d', samplePath(k => s * Math.sqrt(k), 0, 100, 60, x, y));
      const kEnd = Math.min(100, 12 / d);
      root.querySelector('[data-role="dk"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(kEnd).toFixed(1)} ${y(d * kEnd).toFixed(1)}`);
      const kc = Math.min(100, ks), ic = Math.min(12, inv);
      root.querySelector('[data-role="guide"]').setAttribute('d', `M${X0} ${y(ic).toFixed(1)} H${x(kc).toFixed(1)} V${Y0}`);
      root.querySelector('[data-role="pt"]').setAttribute('cx', x(kc).toFixed(1));
      root.querySelector('[data-role="pt"]').setAttribute('cy', y(ic).toFixed(1));
      root.querySelector('[data-role="lbl"]').setAttribute('x', (x(kc) + 10).toFixed(1));
      root.querySelector('[data-role="lbl"]').setAttribute('y', (y(ic) - 10).toFixed(1));
      root.querySelector('[data-role="s-out"]').value = sIn.value + '%';
      root.querySelector('[data-role="d-out"]').value = dIn.value + '%';
      root.querySelector('[data-role="k-val"]').textContent = fmt(ks, 0);
      root.querySelector('[data-role="y-val"]').textContent = fmt(ys, 1);
      root.querySelector('[data-role="msg"]').textContent = `稳态 k* = (s/δ)² = ${fmt(ks, 0)}，人均产出 y* = ${fmt(ys, 1)}。提高储蓄率 s 只能提升稳态「水平」，在无技术进步时无法永久提高长期「增长率」。`;
    }
    sIn.addEventListener('input', draw);
    dIn.addEventListener('input', draw);
    draw();
  }
