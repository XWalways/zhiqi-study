  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#182427' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>
  <style>/* Cool neutral surfaces and one teal accent for navigation and study actions. */

}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #111b1e;
  --surface: #182427;
  --surface-subtle: #202e31;
  --text: #dbe8e7;
  --heading: #edf5f4;
  --muted: #acbfc1;
  --line: #384a4e;
  --control-line: #738c90;
  --accent: #92d1c0;
  --accent-hover: #b1e3d5;
  --accent-on: #132a25;
  --accent-soft: #233b36;
  --accent-line: #608f84;
  --warning: #edd09c;
  --warning-soft: #362e22;
  --error: #f2a9b0;

}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }

:where(a, button, input, select, summary):focus-visible {

}
:where(h1, h2, h3, h4, p, dl, dd) { margin: 0; }
h1, h2, h3, h4 { color: var(--heading); line-height: 1.36; }
h1 { font: 680 clamp(2rem, 4vw, 3.15rem)/1.22 var(--font-display); letter-spacing: -.045em; }

}

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {

  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }

.map-zoom { display: inline-flex; align-items: stretch; }

.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }

.mindmap {

}

}

}

}

  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }

  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;

/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);

.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter11","number":11,"title":"国民收入核算","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-11-国民收入核算-离线学习.html"},"lessons":{"title":"国民收入核算","subtitle":"分清产出、收入和价格指标，再用计划支出理解短期均衡。","sections":[{"id":"macroeconomics","title":"宏观经济学的研究对象与目标","summary":"研究国民经济总体运行以及资源利用。","bodyHtml":"\u003cp>宏观经济学以国民经济总体为对象，使用\u003cstrong>总量分析\u003c/strong>研究总产出、就业、物价与国际收支。国民收入理论说明总产出怎样形成，资源利用程度可以通过实际产出与潜在产出比较。\u003c/p>\u003cp>常见政策目标包括充分就业、价格稳定、经济持续均衡增长和国际收支平衡。充分就业允许存在正常的摩擦性和结构性失业。\u003c/p>","keyTakeaway":"先分清总量指标的范围和分母，再比较增长、就业和价格变化。","pitfall":"某种商品涨价属于相对价格变化。通货膨胀讨论的是总体价格水平的持续上升。","example":"研究一家厂商的雇工决策是微观分析，研究全国总就业与总产出的关系是宏观分析。"},{"id":"gdp","title":"国内生产总值及核算边界","summary":"GDP 衡量一定时期内本国经济领土上生产的最终产品和服务价值。","bodyHtml":"\u003cp>\u003cstrong>GDP\u003c/strong>是一定时期内本国经济领土上生产的最终产品和服务的市场价值。它按生产地核算，是按月、季或年考察的\u003cstrong>流量\u003c/strong>。\u003c/p>\u003cp>商品属于中间品还是最终品，由本次用途决定。只计算最终产品，或逐阶段加总增加值，都可避免重复计算。未售出的当期产出计入存货投资。旧货转让本身不是当期生产，当期提供的经纪服务可以计入。\u003c/p>\u003cp>无偿家务服务通常不计入。政府非市场服务、自有住房服务等可按成本或估算价值计入。自建住房与其他自产实物也可能落在生产边界内。统计口径核验于 2026 年 11 月 11 日。\u003ca href=\"https://unstats.un.org/unsd/demographic-social/time-use/icatus-2016/\">联合国统计司关于自产实物的分类说明\u003c/a>\u003c/p>","keyTakeaway":"判断一项活动能否计入 GDP，先看生产地、期间和用途。","pitfall":"股票买卖和政府转移支付本身是资产或收入转移。提供金融中介或经纪服务可形成当期产出。","example":"面粉厂把面粉以 5 元卖给面包店，面包店将面包以 8 元卖给家庭。若面粉厂没有其他中间投入，两阶段增加值分别是 5 元和 3 元，最终产品价值是 8 元。"},{"id":"national-income","title":"GDP、GNI 与净收入指标","summary":"区分生产所在地、收入取得者以及总额和净额。","bodyHtml":"\u003cp>\u003cstrong>国民总收入 GNI\u003c/strong>在概念上承接国民生产总值 GNP。它按\u003cstrong>常住单位\u003c/strong>取得的收入核算，等于 GDP 加来自境外的初次收入净额。初次收入包括劳动报酬与财产收入等。\u003c/p>\u003cp>统计口径核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.stats.gov.cn/sj/zbjs/202302/t20230202_1897108.html\">国家统计局国民经济核算指标解释\u003c/a>\u003c/p>\u003cp>从 GDP 扣除固定资本消耗得到国内生产净值 NDP，从 GNI 扣除固定资本消耗得到国民净收入。还可用间接税、补贴和转移支付等调整市场价格或个人收入指标，个人可支配收入是个人可用于消费和储蓄的收入。\u003c/p>","keyTakeaway":"GDP 按经济领土核算，GNI 按常住单位取得的收入核算。总值扣除折旧得到净值。","pitfall":"按常住单位划分，不能直接以国籍作判断。国内外收入用净额调整，也要防止把企业产值重复计入。","example":"本地 GDP 为 1000 亿，常住单位从境外取得初次收入 50 亿，境外单位从本地取得 30 亿，则 GNI 为 1020 亿。"},{"id":"gdp-methods","title":"GDP 的支出法、收入法与生产法","summary":"同一笔产出可以从购买、收入和生产三个方向核算。","bodyHtml":"\u003cp>\u003cmark>支出法 GDP = C + I + G + (X − M)\u003c/mark>。C 为居民消费，I 为资本形成和存货变化，G 为政府购买，X − M 为净出口。进口已经可能包括在国内购买中，减去 M 可扣除境外生产。\u003c/p>\u003cp>\u003cstrong>生产法\u003c/strong>加总各生产者的增加值，并按价格口径处理产品税净额。\u003cstrong>收入法\u003c/strong>按增加值的收入构成汇总劳动报酬、生产税净额、固定资本消耗和营业盈余等。理论上三种方法描述同一总量，实测中可能存在统计差异。\u003c/p>\u003cp>统计口径核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.stats.gov.cn/zs/tjws/zytjzbqs/gnsczz/202409/t20240909_1956324.html\">国家统计局国内生产总值概述\u003c/a>\u003c/p>","keyTakeaway":"投资指实物资本形成和存货变动。政府向家庭发补助属于转移支付，政府购买才直接计入 G。","pitfall":"既有资产交易和实物资本形成的含义不同。购买进口商品时，购买支出与进口扣减需要配套计入。","example":"消费 300、投资 100、政府购买 120、出口 60、进口 80，则 GDP 为 500。"},{"id":"price-indices","title":"名义 GDP、实际 GDP 与价格指数","summary":"将名义增长中的数量变化与价格变化分开。","bodyHtml":"\u003cp>\u003cstrong>名义 GDP\u003c/strong>以当期价格估价，固定基期的\u003cstrong>实际 GDP\u003c/strong>以基期价格估价。\u003cmark>GDP 平减指数 = 名义 GDP ÷ 实际 GDP × 100\u003c/mark>。采用固定基期时，平减指数使用当期产量权重，具有帕氏指数的形式。\u003c/p>\u003cul>\u003cli>\u003cstrong>CPI\u003c/strong>反映居民消费品与服务价格变化。固定篮子方法具有拉氏指数的形式，消费者改用相对便宜的替代品时，固定篮子可能高估生活成本增幅。\u003c/li>\u003cli>\u003cstrong>PPI\u003c/strong>在生产者价格层面衡量价格变化。\u003c/li>\u003cli>\u003cstrong>通货膨胀率\u003c/strong>可用选定价格指数相对上一期的百分比变化表示。\u003c/li>\u003c/ul>","keyTakeaway":"平减指数侧重本国生产的最终产出，CPI 侧重居民消费篮子。","pitfall":"指数从 120 升到 126 时，涨了 6 个指数点，通胀率为 5%。指数范围和基期也会影响比较。","example":"名义 GDP 为 420，实际 GDP 为 400，平减指数为 105。若上一期指数为 100，本期相对于上一期上涨 5%。"},{"id":"labor-rates","title":"失业率与劳动参与率","summary":"先区分劳动年龄人口与劳动力人口，再选择分母。","bodyHtml":"\u003cp>劳动力由\u003cstrong>就业者\u003c/strong>和\u003cstrong>失业者\u003c/strong>组成。标准模型中，失业者没有就业、能够工作且积极寻找工作。不符合劳动力条件的人归入非劳动力。\u003c/p>\u003cp>\u003cmark>失业率 = 失业人数 ÷ 劳动力人数 × 100%\u003c/mark>。\u003cstrong>劳动参与率\u003c/strong>为劳动力人数除以劳动年龄人口，再乘 100%。\u003c/p>","keyTakeaway":"失业率看劳动力内部，参与率看劳动年龄人口。","pitfall":"停止求职的人可能退出劳动力。此时失业率下降也可能伴随参与率下降。","example":"劳动年龄人口为 100，70 人就业，5 人正在找工作且能够工作。劳动力为 75，失业率约 6.67%，参与率为 75%。"},{"id":"expenditure-equilibrium","title":"计划支出与均衡产出","summary":"短期价格给定时，均衡产出等于计划总支出。","bodyHtml":"\u003cp>收入—支出模型假定短期价格给定，并考察企业如何按销售和存货变化调整产量。两部门经济中，\u003cmark>均衡条件为 Y = C + I\u003c/mark>，其中 I 为计划投资。由 Y = C + S 可推出均衡时计划储蓄等于计划投资。\u003c/p>\u003cp>实际总支出按核算恒等于实际产出，非计划存货变化计入实际投资。若产出高于计划总支出，企业库存非计划增加，有减产压力。产出低于计划支出时，非计划存货减少，有增产压力。\u003c/p>","keyTakeaway":"恒等式在事后成立。均衡条件要求事前计划支出恰好吸收产出。","pitfall":"计划投资与实际投资可以因非计划存货变化而不同。","example":"消费函数 C = 80 + 0.6Y，计划投资为 40。联立 Y = C + I 得 Y = 300，储蓄为 40。"},{"id":"consumption-saving","title":"凯恩斯消费函数与储蓄倾向","summary":"用可支配收入变化解释消费与储蓄怎样分配。","bodyHtml":"\u003cp>设可支配收入为 Y\u003csub>d\u003c/sub>，简单线性消费函数为 \u003cmark>C = α + βY\u003csub>d\u003c/sub>\u003c/mark>，其中 α 表示自发消费，0 &lt; β &lt; 1 是边际消费倾向。\u003cstrong>储蓄函数 S = −α + (1 − β)Y\u003csub>d\u003c/sub>\u003c/strong>。\u003c/p>\u003cp>边际消费倾向 MPC 与边际储蓄倾向 MPS 之和为 1。平均消费倾向 APC = C/Y\u003csub>d\u003c/sub>，平均储蓄倾向 APS = S/Y\u003csub>d\u003c/sub>，两者之和也为 1。若 α 和可支配收入为正，则 APC 大于 MPC，APS 小于 MPS。收入增加时 APC 下降。在一般非线性表述中，边际消费倾向也可能随收入上升而下降，线性模型将其简化为常数。\u003c/p>","keyTakeaway":"平均倾向用总量相除，边际倾向用增量相除。","pitfall":"收入为零时平均倾向无定义。简单线性模型中的边际消费倾向固定。","example":"若 C = 100 + 0.8Y，Y 为 500 时，C = 500，APC = 1，MPC = 0.8。"},{"id":"consumption-theories","title":"相对收入、生命周期与持久收入","summary":"比较当期收入之外影响消费的三种机制。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>理论\u003c/th>\u003cth>代表人物\u003c/th>\u003cth>关键机制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>相对收入\u003c/td>\u003ctd>杜森贝里\u003c/td>\u003ctd>消费受周围人消费水平影响，表现为示范效应。过去较高的消费习惯使消费难随收入同比下降，表现为棘轮效应\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生命周期\u003c/td>\u003ctd>莫迪利安尼等\u003c/td>\u003ctd>按一生预期资源平滑消费。年轻时可能借款，中年工作时储蓄，退休时可能动用储蓄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>持久收入\u003c/td>\u003ctd>弗里德曼\u003c/td>\u003ctd>消费主要随预期长期收入变化，对暂时性收入波动的反应通常较小\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"示范效应关注别人，棘轮效应关注自己过去。生命周期强调跨年龄配置，持久收入强调预期收入的持久程度。","pitfall":"暂时收入上升也可能使消费增加，幅度取决于其对预期长期资源、信贷约束等因素的影响。","example":"一笔意外奖金与一笔长期固定加薪，虽然当期增加金额相同，对预期长期收入的影响却可能很不同。"},{"id":"multipliers","title":"支出、税收与平衡预算乘数","summary":"在价格和利率给定的简单模型中，从消费的后续轮次计算总影响。","bodyHtml":"\u003cp>封闭经济、定额税、消费斜率 β 固定且投资等外生时，新增支出成为他人的收入，带动后续消费。\u003cmark>政府购买与投资乘数为 1/(1 − β)\u003c/mark>。定额税乘数为 −β/(1 − β)，转移支付乘数为 β/(1 − β)。\u003c/p>\u003cp>政府购买与定额税同额增加时，两项作用相加，\u003cstrong>平衡预算乘数为 1\u003c/strong>。有比例税、进口漏出、利率或价格调整时，乘数要按相应模型重新计算。\u003c/p>","keyTakeaway":"政府购买直接进入计划总支出。税收和转移支付先改变可支配收入，再影响消费。","pitfall":"直接把转移支付视同政府购买，会高估它对计划支出的第一轮影响。","example":"β = 0.8 时，政府购买增加 100 使均衡产出增加 500。定额税同时增加 100 会抵消 400，净增 100。"},{"id":"output-gaps","title":"潜在产出与支出缺口","summary":"分清产出相差多少与为填平缺口要调整多少支出。","bodyHtml":"\u003cp>\u003cstrong>潜在产出\u003c/strong>是劳动与资本得到正常充分使用时可持续达到的产出。常用的产出缺口是实际产出减潜在产出，也可除以潜在产出表示百分比。\u003c/p>\u003cp>在固定价格的收入—支出图中，按充分就业产出比较计划支出和该产出水平。计划支出不足形成\u003cstrong>紧缩性支出缺口\u003c/strong>，支出过多形成\u003cstrong>膨胀性支出缺口\u003c/strong>。支出缺口经乘数作用对应较大的均衡产出偏离。\u003c/p>","keyTakeaway":"先辨题目问的是横轴上的产出差，还是充分就业产量处的纵轴支出差。","pitfall":"产出高于潜在产出可短期出现，通常意味着资源超负荷使用与价格上行压力。","example":"潜在产出为 1000，实际均衡产出为 900。在简单模型中，若支出乘数为 4，增加自主支出 25 可以填平 100 的产出缺口。"}],"mindmap":[{"label":"宏观经济学与国民收入核算","target":"macroeconomics","children":[{"label":"宏观经济学特点","target":"macroeconomics","children":[{"label":"研究国民经济总体","target":"macroeconomics"},{"label":"采用总量分析","target":"macroeconomics"},{"label":"核心关注国民收入理论与资源利用","target":"macroeconomics"}]},{"label":"政策目标","target":"macroeconomics","children":[{"label":"充分就业","target":"macroeconomics"},{"label":"价格稳定","target":"macroeconomics"},{"label":"经济持续均衡增长","target":"macroeconomics"},{"label":"国际收支平衡","target":"macroeconomics"}]},{"label":"国内生产总值","target":"gdp","children":[{"label":"本国经济领土内最终产出","target":"gdp"},{"label":"按一定时期核算流量","target":"gdp"},{"label":"避免中间品重复计算","target":"gdp"},{"label":"无偿家务服务通常排除","target":"gdp"}]},{"label":"国民总收入和净收入","target":"national-income","children":[{"label":"GDP 加境外初次收入净额得到 GNI","target":"national-income"},{"label":"扣除折旧由总值转向净值","target":"national-income"}]},{"label":"通货膨胀率与价格指数","target":"price-indices","children":[{"label":"GDP 平减指数为名义 GDP 除以实际 GDP","target":"price-indices"},{"label":"CPI 关注居民消费价格","target":"price-indices"},{"label":"PPI 关注生产者价格","target":"price-indices"}]},{"label":"失业率和劳动参与率","target":"labor-rates","children":[{"label":"失业率以劳动力为分母","target":"labor-rates"},{"label":"劳动参与率以劳动年龄人口为分母","target":"labor-rates"}]},{"label":"GDP 核算方法","target":"gdp-methods","children":[{"label":"支出法 C + I + G + X − M","target":"gdp-methods"},{"label":"收入法汇总各项初次收入与折旧等","target":"gdp-methods"},{"label":"生产法汇总增加值","target":"gdp-methods"}]}]},{"label":"国民收入的决定","target":"expenditure-equilibrium","children":[{"label":"两部门均衡产出 Y = C + I","target":"expenditure-equilibrium","children":[{"label":"计划储蓄等于计划投资","target":"expenditure-equilibrium"}]},{"label":"凯恩斯消费理论","target":"consumption-saving","children":[{"label":"收入影响消费","target":"consumption-saving"},{"label":"C = α + βY","target":"consumption-saving"},{"label":"S = −α + (1 − β)Y","target":"consumption-saving"},{"label":"MPC + MPS = 1","target":"consumption-saving"},{"label":"APC + APS = 1","target":"consumption-saving"},{"label":"自发消费为正时，MPC 小于 APC，MPS 大于 APS","target":"consumption-saving"}]},{"label":"相对收入消费理论","target":"consumption-theories","children":[{"label":"杜森贝里","target":"consumption-theories"},{"label":"过去消费习惯产生棘轮效应","target":"consumption-theories"},{"label":"周围消费水平产生示范效应","target":"consumption-theories"}]},{"label":"生命周期理论","target":"consumption-theories","children":[{"label":"莫迪利安尼等","target":"consumption-theories"},{"label":"按一生资源平滑消费","target":"consumption-theories"},{"label":"年轻和退休时消费可超收入，工作中期倾向储蓄","target":"consumption-theories"}]},{"label":"持久收入理论","target":"consumption-theories","children":[{"label":"弗里德曼","target":"consumption-theories"},{"label":"预期长期收入决定消费的主要部分","target":"consumption-theories"},{"label":"强调如何估计持久收入","target":"consumption-theories"}]},{"label":"乘数","target":"multipliers","children":[{"label":"投资与政府购买 1/(1 − β)","target":"multipliers"},{"label":"定额税 −β/(1 − β)","target":"multipliers"},{"label":"转移支付 β/(1 − β)","target":"multipliers"},{"label":"同额增税并增加政府购买时乘数为 1","target":"multipliers"}]},{"label":"潜在国民收入","target":"output-gaps","children":[{"label":"资源充分正常利用时可持续的产出","target":"output-gaps"}]},{"label":"GDP 缺口与支出缺口","target":"output-gaps","children":[{"label":"计划支出不足的紧缩性缺口","target":"output-gaps"},{"label":"计划支出过多的膨胀性缺口","target":"output-gaps"}]}]}]},"questions":[{"id":"eco-11-q01","number":1,"group":"宏观经济学与国民收入核算","type":"single","stem":"宏观经济学的中心理论是（　　）。 （2019）","options":{"A":"工资决定理论","B":"价格决定理论","C":"汇率决定理论","D":"国民收入（产出）理论"},"answer":["D"],"explanationSupplement":"宏观经济学的中心问题是总产出和国民收入如何决定。","optionExplanations":{"A":"工资决定涉及劳动市场。","B":"单个市场的价格通常是微观问题。","C":"汇率属于开放经济专题。","D":"国民收入理论解释总产出的形成。"},"conceptId":"macroeconomics"},{"id":"eco-11-q02","number":2,"group":"宏观经济学与国民收入核算","type":"single","stem":"实际 GDP等于（　　）。","options":{"A":"价格水平除以名义 GDP","B":"名义GDP 除以价格水平","C":"名义GDP乘以价格水平","D":"价格水平乘以潜在 GDP"},"answer":["B"],"explanationSupplement":"若价格水平用基期为 1 的平减因子表示，实际 GDP 等于名义 GDP 除以该因子。若指数基期为 100，先将指数除以 100。","optionExplanations":{"A":"分子分母反了。","B":"用平减因子去除价格变化。","C":"乘上价格水平会放大价格影响。","D":"潜在产出是生产能力指标。"},"conceptId":"price-indices"},{"id":"eco-11-q03","number":3,"group":"宏观经济学与国民收入核算","type":"single","stem":"GDP 平减指数是用来衡量（　　）。","options":{"A":"一段时间内，收入在贫富之间的分配的程度","B":"一段时间内，购买一定量的商品和劳务所需费用的变动程度","C":"由于更高的物价导致消费模式随时间而改变的程度","D":"消费品价格相对于工资增长的程度"},"answer":["B"],"explanationSupplement":"GDP 平减指数用当期产出分别按当期价格和基期价格估值，衡量国内最终产出的综合价格变化。计算某一期时，两个估值的数量相同，跨期的权重可以变化。","optionExplanations":{"A":"收入分配可用基尼系数等衡量。","B":"可按同一期数量比较价格，范围为国内最终产出。","C":"消费模式变化不等于价格指数。","D":"指数并不与工资增长对比。"},"conceptId":"price-indices"},{"id":"eco-11-q04","number":4,"group":"宏观经济学与国民收入核算","type":"single","stem":"如果名义 GDP增加 5%，GDP 平减指数增加 3%，那么实际 GDP（　　）。","options":{"A":"增加2%","B":"减少2%","C":"增加8%","D":"减少8%"},"answer":["A"],"explanationSupplement":"实际增长率是 1.05 ÷ 1.03 − 1，约为 1.94%。可用名义增速减价格增速近似为 2%。","optionExplanations":{"A":"与准确结果最接近。","B":"名义增速超过平减指数增速，实际产出增加。","C":"两个增速不能直接相加。","D":"方向和幅度均不符。"},"conceptId":"price-indices"},{"id":"eco-11-q05","number":5,"group":"宏观经济学与国民收入核算","type":"single","stem":"以下各项都是流量，除了（　　）。","options":{"A":"个人可支配收入","B":"消费支出","C":"个人财富","D":"国内生产总值"},"answer":["C"],"explanationSupplement":"流量按期间累计，存量按时点衡量。个人财富是某一时点的资产净值。","optionExplanations":{"A":"收入按期间累计。","B":"支出按期间累计。","C":"财富按时点衡量。","D":"GDP 是一定时期内的产出。"},"conceptId":"gdp"},{"id":"eco-11-q06","number":6,"group":"宏观经济学与国民收入核算","type":"discussion","stem":"以下被视为国民收入中的投资的是（　　）。","options":{"A":"购买100元的美国债券","B":"木匠给自己建了个小屋","C":"艺术馆买了价值100万元的艺术品","D":"自己家买了一套新盖的房子"},"answer":[],"explanationSupplement":"购买新建住宅属于住房固定资本形成。若木匠自建的小屋符合核算中的固定资产条件，自建也可以形成投资。本题缺少排除该情形的条件。","optionExplanations":{"A":"买债券是金融资产交易。","B":"自建房屋符合条件时属于资本形成。","C":"现有作品的转让不等于新生产，贵重物品另有核算口径。","D":"购买本期新建住宅是典型住房投资。"},"conceptId":"gdp-methods"},{"id":"eco-11-q07","number":7,"group":"宏观经济学与国民收入核算","type":"single","stem":"如果C表示消费、I 表示投资、G表示政府购买、X表示出口、M表示进口，则按照支出法计算的国内生产总值（GDP）的公式是（　　）。","options":{"A":"GDP=C+I+G+X","B":"GDP=C+I+G-M","C":"GDP=C+I+G+（X-M）","D":"GDP=C+I+G+（M-X）"},"answer":["C"],"explanationSupplement":"将消费、投资、政府购买与净出口相加。净出口等于出口减进口。","optionExplanations":{"A":"遗漏了进口扣减。","B":"遗漏了出口。","C":"净出口符号和各支出项均正确。","D":"把进出口的减法顺序颠倒了。"},"conceptId":"gdp-methods"},{"id":"eco-11-q08","number":8,"group":"宏观经济学与国民收入核算","type":"discussion","stem":"下列可以计入国民生产总值（GNP）的是（　　）。","options":{"A":"自己种植赠送给朋友的鲜花","B":"李某花 120万元购买的二手住房","C":"刘某收到的一笔慈善捐款","D":"李某购买住房时支付给经纪人的费用"},"answer":[],"explanationSupplement":"经纪佣金对应当期服务，二手房转让和捐款本身不新增生产。自产物品的处理还取决于生产边界、数量及估价，日常零星赠送常按简化口径略去。","optionExplanations":{"A":"日常零星自产赠礼在简化题中一般略去，正规核算还要看生产边界。","B":"旧房本身是既有资产。","C":"捐款是转移支付。","D":"经纪佣金是当期服务收入。"},"conceptId":"gdp"},{"id":"eco-11-q09","number":9,"group":"宏观经济学与国民收入核算","type":"single","stem":"根据简单的凯恩斯模型，引起国内生产总值减少的原因是（　　）。","options":{"A":"储蓄减少","B":"总供给减少","C":"消费增加","D":"消费减少"},"answer":["D"],"explanationSupplement":"在固定价格的简单凯恩斯模型中，自发消费减少使计划支出下降，均衡产出减少。","optionExplanations":{"A":"同样收入下减少储蓄通常意味着增加消费。","B":"该模型侧重计划支出变化。","C":"消费增加带动均衡产出增加。","D":"消费减少会压低计划支出和均衡产出。"},"conceptId":"expenditure-equilibrium"},{"id":"eco-11-q10","number":10,"group":"宏观经济学与国民收入核算","type":"single","stem":"可用于计算资本形成率和最终消费率的国内生产总值的核算方法是（　　）。","options":{"A":"支出法","B":"收入法","C":"生产法","D":"综合法"},"answer":["A"],"explanationSupplement":"资本形成率和最终消费率都按最终使用的支出项目计算，因此采用支出法的分项。","optionExplanations":{"A":"直接提供资本形成和最终消费分项。","B":"收入法按收入构成分类。","C":"生产法按生产增加值分类。","D":"通常按支出法的具体分项核算。"},"conceptId":"gdp-methods"},{"id":"eco-11-q11","number":11,"group":"宏观经济学与国民收入核算","type":"discussion","stem":"某时期A国的GDP 为1000亿美元，同时期本国国民在国外创造的价值增值为50亿美元，外国国民在本国创造的价值增值为60美元，则该时期A国的GNP为（　　）。","options":{"A":"1110亿","B":"990亿","C":"1010亿","D":"890亿"},"answer":[],"explanationSupplement":"若按题面的 60 美元计算，结果接近 1050 亿美元，四项都不匹配。若末项原意是 60 亿美元，并把两个跨境量当作初次收入，结果才是 990 亿美元。","optionExplanations":{"A":"错误地将流出计入加项。","B":"仅在流出量是 60 亿美元的假设下成立。","C":"调换了两项跨境收入的方向。","D":"金额与两种读法均不符。"},"conceptId":"national-income"},{"id":"eco-11-q12","number":12,"group":"宏观经济学与国民收入核算","type":"single","stem":"一国的国内生产总值大于国民生产总值，则该国公民从国外取得的收入（　　）外国公民从该国取得的收入。","options":{"A":"大于","B":"小于","C":"等于","D":"不能确定"},"answer":["B"],"explanationSupplement":"GNP 减 GDP 等于境外初次收入净额。若 GDP 大于 GNP，则净额为负，收入流入小于流出。","optionExplanations":{"A":"对应正净额。","B":"对应负净额。","C":"只有净额为零时成立。","D":"在将选项的公民理解为常住单位的简化下，可以比较。"},"conceptId":"national-income"},{"id":"eco-11-q13","number":13,"group":"宏观经济学与国民收入核算","type":"single","stem":"下列选项中，不列入国内生产总值核算的是（　　）。","options":{"A":"出口到外国的一批货物","B":"政府给贫困家庭发放的一笔救济金","C":"经纪人一笔旧房买卖收取佣金","D":"保险公司收到一笔家庭财产保险"},"answer":["B"],"explanationSupplement":"救济金是政府对家庭的收入转移。货物出口和经纪服务对应产出。财产保险可能提供服务，核算时计入估算的服务产出，而非全额保费。","optionExplanations":{"A":"本期生产并出口的货物属于最终产出。","B":"救济金本身没有交换到当期货物或服务。","C":"经纪活动提供了当期服务。","D":"保险服务可纳入，保费与服务产出金额需要区分。"},"conceptId":"gdp"},{"id":"eco-11-q14","number":14,"group":"宏观经济学与国民收入核算","type":"single","stem":"（　　）是通过核算在一定时期内全部经济单位，对最终产品的支出总量相加，得出总支出来计量GDP 的方法。","options":{"A":"支出法","B":"收入法","C":"生产法","D":"转移法"},"answer":["A"],"explanationSupplement":"支出法从最终使用角度核算，关注最终消费、资本形成与净出口。","optionExplanations":{"A":"按最终支出核算。","B":"按当期形成的收入构成核算。","C":"从总产出扣除中间投入。","D":"转移支付不构成独立的 GDP 核算方法。"},"conceptId":"gdp-methods"},{"id":"eco-11-q15","number":15,"group":"宏观经济学与国民收入核算","type":"single","stem":"下面不属于流量的是（　　）。","options":{"A":"净出口","B":"折旧","C":"转移支付","D":"国家债务"},"answer":["D"],"explanationSupplement":"债务余额在一个时点衡量。净出口、折旧和转移支付都可按一段时期累计。","optionExplanations":{"A":"按期间出口减进口。","B":"衡量期间固定资本消耗。","C":"按期间累计支付。","D":"债务余额是时点存量。"},"conceptId":"gdp"},{"id":"eco-11-q16","number":16,"group":"宏观经济学与国民收入核算","type":"single","stem":"对政府雇员支付的报酬属于（　　）。","options":{"A":"政府购买支出","B":"转移支出","C":"税收","D":"消费"},"answer":["A"],"explanationSupplement":"政府雇员以劳动提供当期服务，报酬属于政府提供公共服务的成本。","optionExplanations":{"A":"计入政府服务支出。","B":"雇员以劳动换取报酬。","C":"工资是支出，税收是政府收入。","D":"题目按政府购买口径分类。"},"conceptId":"gdp-methods"},{"id":"eco-11-q17","number":17,"group":"宏观经济学与国民收入核算","type":"discussion","stem":"下列关于 GDP 和 GNP 两个经济概念的表述，不正确的是（　　）。","options":{"A":"GDP 强调的是地域概念","B":"GNP 强调的是人口概念","C":"一个美国公民在中国工作，取得的收入可计入美国的GDP中","D":"一个英国公民在中国取得的收入可计入英国的GNP 中"},"answer":[],"explanationSupplement":"GDP 看生产地。GNP 或 GNI 看收入是否归属于本国常住单位，仅给出国籍无法确定。美国公民在中国从事的生产通常纳入中国 GDP。英国公民的收入是否计入英国 GNI，还取决于常住身份。","optionExplanations":{"A":"地域体现 GDP 的生产边界。","B":"较准确的表述是常住单位的收入。","C":"在中国从事的生产通常不计入美国 GDP。","D":"需要额外判断其是否属于英国常住单位。"},"conceptId":"national-income"},{"id":"eco-11-q18","number":18,"group":"宏观经济学与国民收入核算","type":"discussion","stem":"比较常用的国内生产总值的核算方法是（　　）。","options":{"A":"支出法和收入法","B":"生产法和支出法","C":"生产法和收入法","D":"生产法、收入法和支出法"},"answer":[],"explanationSupplement":"GDP 的三种核算方法分别是生产法、收入法和支出法。常用哪种受国家、数据和用途影响，题目未说明判断范围。","optionExplanations":{"A":"是两种正式核算方法。","B":"也是两种正式核算方法。","C":"也是两种正式核算方法。","D":"完整列出三种方法，但常用程度仍取决于适用环境。"},"conceptId":"gdp-methods"},{"id":"eco-11-q19","number":19,"group":"宏观经济学与国民收入核算","type":"single","stem":"一定时间内，所有常驻单位的增加值之和等于（　　）。","options":{"A":"国民生产总值","B":"国内生产总值","C":"国民生产净值","D":"社会总产值"},"answer":["B"],"explanationSupplement":"生产法通过汇总常住单位的增加值核算 GDP，实际核算还要注意产品税净额等估价调整。","optionExplanations":{"A":"GNP 还需考虑境外收入净额。","B":"这是 GDP 生产法的基本思想。","C":"净值还需扣除固定资本消耗。","D":"社会总产值与增加值合计不是同一口径。"},"conceptId":"gdp-methods"},{"id":"eco-11-q20","number":20,"group":"宏观经济学与国民收入核算","type":"single","stem":"在经济指标中，GNP 属于一种（　　）。","options":{"A":"动态经济指标","B":"静态经济指标","C":"相对经济指标","D":"平均经济指标"},"answer":["A"],"explanationSupplement":"GNP 或 GNI 是一定时期取得的收入总额，按题目的分类属于动态流量指标。","optionExplanations":{"A":"符合期间核算。","B":"静态量一般在时点衡量。","C":"指标是总额，可以进一步计算相对指标。","D":"总额除以人口才得到人均指标。"},"conceptId":"national-income"},{"id":"eco-11-q21","number":21,"group":"宏观经济学与国民收入核算","type":"single","stem":"GDP、GNP、CPI、PPI 分别是指（　　）。","options":{"A":"国内生产总值、国民生产总值、生产者物价指数、消费物价指数","B":"国民生产总值、国内生产总值、生产者物价指数、消费物价指数","C":"国内生产总值、国民生产总值、消费物价指数、生产者物价指数","D":"国民生产总值、国内生产总值、消费物价指数、生产者物价指数"},"answer":["C"],"explanationSupplement":"GDP 与 GNP 分别是国内生产总值和国民生产总值。CPI 与 PPI 分别看消费者和生产者价格。","optionExplanations":{"A":"颠倒了 CPI 和 PPI。","B":"两组名称均颠倒。","C":"四个缩写依序匹配。","D":"颠倒了 GDP 和 GNP。"},"conceptId":"price-indices"},{"id":"eco-11-q22","number":22,"group":"宏观经济学与国民收入核算","type":"single","stem":"在国民收入核算体系中，计入 GDP 的政府支出是指（　　）。","options":{"A":"政府工作人员的薪水和政府转移支出","B":"政府购买的物品和劳务的支出","C":"政府购买的物品和劳务的支出加上政府的转移支付之和","D":"政府购买的物品支出"},"answer":["B"],"explanationSupplement":"计入支出法 GDP 的政府购买覆盖当期货物与服务。救济和补助等转移支付不直接计入。","optionExplanations":{"A":"混入了转移支出。","B":"包含购买的物品和劳务。","C":"多加了转移支付。","D":"漏掉购买的劳务。"},"conceptId":"gdp-methods"},{"id":"eco-11-q23","number":23,"group":"宏观经济学与国民收入核算","type":"single","stem":"假定 A 为 B 提供服务应得报酬400美元，B为A提供服务应得报酬300美元，AB 商定相互抵消300美元，结果A只收B100美元，则该国的GNP为（　　）。","options":{"A":"300美元","B":"400美元","C":"100美元","D":"700美元"},"answer":["D"],"explanationSupplement":"两笔服务都形成了价值，互相抵销只是结算安排。在 A、B 为本国常住单位且只有题述交易的简化下，合计 400 + 300 = 700 美元。","optionExplanations":{"A":"仅算 B 提供的服务。","B":"仅算 A 提供的服务。","C":"仅算净现金结算。","D":"计入两笔服务价值。"},"conceptId":"gdp"},{"id":"eco-11-q24","number":24,"group":"宏观经济学与国民收入核算","type":"single","stem":"下列哪一项应计入GDP中？（　　）","options":{"A":"面包厂购买的面粉","B":"购买 40股股票","C":"家庭主妇购买的面粉","D":"购买政府债券"},"answer":["C"],"explanationSupplement":"产品按最终用途分类。家庭买面粉用于自家消费，属于最终消费。","optionExplanations":{"A":"面包厂买来生产面包，是中间投入。","B":"购买股票是金融资产交易。","C":"家庭购买面粉用于最终消费。","D":"债券买卖本身不新增产出。"},"conceptId":"gdp"},{"id":"eco-11-q25","number":25,"group":"宏观经济学与国民收入核算","type":"single","stem":"已知C=6亿，I=1亿，间接税=1亿，G=1.5亿，X=2亿，M=1.8 亿，则（　　）。","options":{"A":"NDP=8.7亿","B":"GDP=7.7 亿","C":"GDP=8.7亿","D":"NDP=5亿"},"answer":["C"],"explanationSupplement":"GDP = 6 + 1 + 1.5 + 2 − 1.8 = 8.7 亿。间接税不另加。由 GDP 求国内生产净值还需折旧。","optionExplanations":{"A":"缺少固定资本消耗数据。","B":"少计 1 亿，间接税不应从该式中单独减去。","C":"正确计算最终支出。","D":"没有数据能推出该净值。"},"conceptId":"gdp-methods"},{"id":"eco-11-q26","number":26,"group":"宏观经济学与国民收入核算","type":"single","stem":"下列各项中，能计入 GDP 的是（　　）。","options":{"A":"拍卖毕加索作品的收入","B":"为他人提供服务所得的收入","C":"出售股票的收入","D":"家庭主妇的家务劳动折合价值"},"answer":["B"],"explanationSupplement":"GDP 计入当期生产的货物和服务。既有作品的转手和股票交易本身不新增生产。","optionExplanations":{"A":"画作的转手不代表本期生产，拍卖服务另计。","B":"有偿服务是当期产出。","C":"股票交易本身是资产转移。","D":"无偿家务服务通常不计。"},"conceptId":"gdp"},{"id":"eco-11-q27","number":27,"group":"宏观经济学与国民收入核算","type":"single","stem":"国内生产总值是下面哪一项的市场价值？（　　）","options":{"A":"一定时期内一国中的所有交易","B":"一定时期内一国中交换的所有商品和劳务","C":"一定时期内一国中交换的所有最终商品和劳务","D":"一定时期内一国中生产的所有最终商品和劳务"},"answer":["D"],"explanationSupplement":"关键是一定时期、经济领土内生产和最终产出。未售出的合格当期产出也可通过存货计入。","optionExplanations":{"A":"所有交易包括资产转让和中间品。","B":"包含中间品，也用交换代替生产。","C":"交换口径漏掉存货等产出，并可能计入旧货。","D":"三个条件都符合。"},"conceptId":"gdp"},{"id":"eco-11-q28","number":28,"group":"宏观经济学与国民收入核算","type":"single","stem":"下列说法中哪项不是 GDP 的特征？（　　）","options":{"A":"它只测度最终产品","B":"它只适用于给定时期","C":"它是用实物测度的","D":"它没有计入生产过程中消耗的商品"},"answer":["C"],"explanationSupplement":"GDP 用价值统一计量异质产出。即使使用基期价格计算实际 GDP，也仍由价格与数量估值。","optionExplanations":{"A":"用于最终使用的产出计入。","B":"GDP 按期间统计。","C":"实物量不能直接加总成为 GDP。","D":"中间投入不再单独重复计入。"},"conceptId":"gdp"},{"id":"eco-11-q29","number":29,"group":"宏观经济学与国民收入核算","type":"single","stem":"“面包是最终产品，而面粉是中间产品”这一命题（　　）。","options":{"A":"一定是对的","B":"一定是不对的","C":"可能是对的，也可能是不对的","D":"在任何情况下都无法判断"},"answer":["C"],"explanationSupplement":"是否为最终品取决于用途。家庭购买的面粉是最终消费，面包厂购买的面粉是中间投入。","optionExplanations":{"A":"用途可以变化。","B":"存在符合该判断的用途。","C":"需要按具体用途判断。","D":"知道用途后即可分类。"},"conceptId":"gdp"},{"id":"eco-11-q30","number":30,"group":"宏观经济学与国民收入核算","type":"single","stem":"在用支出法核算 GDP时，（　　）项不能作为投资计入 GDP。","options":{"A":"某厂增加了1000台彩电的存货","B":"某厂新购置了一辆货运卡车","C":"某厂新建立了一条生产流水线","D":"某公司购买20万元政府债券"},"answer":["D"],"explanationSupplement":"实物固定资本和存货计入投资。购入政府债券只是金融资产交易。","optionExplanations":{"A":"存货增加计入投资。","B":"生产用新卡车计入固定资本。","C":"新生产线计入固定资本。","D":"购债本身不形成实物资本。"},"conceptId":"gdp-methods"},{"id":"eco-11-q31","number":31,"group":"宏观经济学与国民收入核算","type":"single","stem":"目前，世界各国或地区普遍使用的衡量经济活动总量的基本指标是（　　）。","options":{"A":"国民总收入","B":"国民生产总值","C":"国内生产总值","D":"净要素收入"},"answer":["C"],"explanationSupplement":"GDP 是衡量一个经济体生产活动规模的通用指标。","optionExplanations":{"A":"GNI 反映归属常住单位的收入。","B":"GNP 是 GNI 的旧称。","C":"GDP 是衡量境内生产活动规模的指标。","D":"境外净要素收入用于 GDP 与 GNI 之间的调整。"},"conceptId":"gdp"},{"id":"eco-11-q32","number":32,"group":"宏观经济学与国民收入核算","type":"single","stem":"用收入法计算的 GDP 等于（　　）。","options":{"A":"消费＋投资＋政府支出＋净出口","B":"工资+利息+地租+利润+间接税","C":"工资+利息+中间产品+间接税+利润","D":"GDP=工资＋利息+利润+租金+间接税和企业转移支付＋折旧+统计误差"},"answer":["D"],"explanationSupplement":"收入法按生产过程形成的收入核算。现代核算通常列劳动报酬、生产税净额、折旧和营业盈余。选项 D 对应含折旧的简化表达，企业转移支付和统计差异应按具体口径辨别。","optionExplanations":{"A":"这是支出法。","B":"未列折旧。","C":"中间产品不能作为要素收入加总。","D":"在所列简化选项中覆盖了要素收入与折旧。"},"conceptId":"gdp-methods"},{"id":"eco-11-q33","number":33,"group":"宏观经济学与国民收入核算","type":"single","stem":"从社会最终使用的角度计算国内生产总值的方法是（　　）。","options":{"A":"生产法","B":"收入法","C":"支出法","D":"转移法"},"answer":["C"],"explanationSupplement":"社会最终使用对应购买、投资和净出口，是支出法的观察角度。","optionExplanations":{"A":"生产法看增加值。","B":"收入法看生产形成的收入。","C":"支出法看最终使用。","D":"转移支付并非核算方法。"},"conceptId":"gdp-methods"},{"id":"eco-11-q34","number":34,"group":"宏观经济学与国民收入核算","type":"single","stem":"在核算 GDP时，转移支付（　　）。","options":{"A":"不计入是因为它们仅仅反映通货膨胀水平","B":"不计入是因为它们不具有“生产性”","C":"计入是因为它们属于投资支出的一部分","D":"计入是因为它们增加了接受者的支出"},"answer":["B"],"explanationSupplement":"转移支付将收入从一方移给另一方，支付本身未对应新的货物或服务。接受者后来购买商品时，按购买项目记账。","optionExplanations":{"A":"不计入的理由与通胀无关。","B":"支付本身不产生相应产出。","C":"转移支付不属于资本形成。","D":"之后的实际消费与本次转移支付应区分。"},"conceptId":"gdp-methods"},{"id":"eco-11-q35","number":35,"group":"宏观经济学与国民收入核算","type":"single","stem":"根据国民收入核算的原则，家庭用于教育的人力资本投资（　　）。","options":{"A":"属于消费支出","B":"属于政府支出","C":"属于投资支出","D":"不计入国民生产总值"},"answer":["A"],"explanationSupplement":"家庭支付学费是购买教育服务，在通常的国民账户口径中归入居民最终消费。","optionExplanations":{"A":"家庭购买教育服务属于消费支出。","B":"付款主体是家庭。","C":"人力资本投资的日常含义不同于实物资本形成。","D":"当期教育服务可计入。"},"conceptId":"gdp-methods"},{"id":"eco-11-q36","number":36,"group":"宏观经济学与国民收入核算","type":"single","stem":"居民人均可支配收入，通常指家庭总收入扣除个人缴纳的个人所得税及社会保障支出后的收入水平。下列经济指标中，会对居民人均可支配收入产生最直接影响的是（　　）。","options":{"A":"居民消费价格指数","B":"国内生产总值","C":"基尼系数","D":"恩格尔系数"},"answer":["B"],"explanationSupplement":"GDP 的收入构成包含劳动者报酬等居民收入来源，四项中与名义居民收入的形成联系最直接。居民人均可支配收入还受收入分配、税费、转移和人口影响。","optionExplanations":{"A":"主要影响实际购买力。","B":"总产出的收入构成包含居民收入来源。","C":"描述收入分配差异。","D":"描述食品支出比重。"},"conceptId":"national-income"},{"id":"eco-11-q37","number":37,"group":"宏观经济学与国民收入核算","type":"single","stem":"（　　）是指一定时期（通常一年）一国境内所生产的全部最终产品和服务的价值总和。","options":{"A":"国民生产总值","B":"国内生产总值","C":"国民收入","D":"产业增加值"},"answer":["B"],"explanationSupplement":"境内一定时期最终产出对应 GDP。","optionExplanations":{"A":"GNP 注重初次收入归属。","B":"题干直接指国内生产总值。","C":"国民收入侧重收入。","D":"产业增加值只看一个行业，汇总后才可得到总量。"},"conceptId":"gdp"},{"id":"eco-11-q38","number":38,"group":"宏观经济学与国民收入核算","type":"single","stem":"国民生产总值与国内生产总值的概念很容易混淆，其中国民生产总值（GNP）包括（　　）。","options":{"A":"本国国民在本国和外国生产的最终产品的市场价值","B":"外国国民在本国和外国生产的最终产品的市场价值","C":"本国国民和外国国民在本国生产的最终产品的市场价值","D":"本国国民和外国国民在外国生产的最终产品的市场价值"},"answer":["A"],"explanationSupplement":"题目用本国国民概括收入归属。严格核算按常住单位，GNI = GDP + 境外初次收入净额。","optionExplanations":{"A":"在将本国国民理解为本国常住单位的简化表述下最贴近。","B":"把本国与境外归属调换。","C":"侧重本国经济领土，是 GDP 的思路。","D":"侧重外国经济领土。"},"conceptId":"national-income"},{"id":"eco-11-q39","number":39,"group":"宏观经济学与国民收入核算","type":"single","stem":"一国从国外取得的净要素收入大于零，说明（　　）。","options":{"A":"GNP>GDP","B":"GNP=GDP","C":"GNP\u003cGDP","D":"GNP 与 GDP 不可比"},"answer":["A"],"explanationSupplement":"GNP = GDP + 境外净要素收入，净额为正时 GNP 大于 GDP。","optionExplanations":{"A":"对应正净额。","B":"对应零净额。","C":"对应负净额。","D":"二者可用境外净额联系。"},"conceptId":"national-income"},{"id":"eco-11-q40","number":40,"group":"宏观经济学与国民收入核算","type":"single","stem":"按照 GDP的核算原则，下面可以计算进入 GDP 的是（　　）。","options":{"A":"公债利息","B":"购买生活用品的消费","C":"赌博收入","D":"政府转移支付"},"answer":["B"],"explanationSupplement":"生活用品的购买可属于居民最终消费。利息、赌博奖金、转移支付本身通常不对应新生产，相关经营服务应另外核算。","optionExplanations":{"A":"利息支付属于收入分配。","B":"计入居民最终消费。","C":"输赢属于转移，可能涉及的经营服务另行辨别。","D":"本身是收入转移。"},"conceptId":"gdp-methods"},{"id":"eco-11-q41","number":41,"group":"国民收入的决定","type":"single","stem":"边际消费倾向递减规律是（　　）的前提之一。（2019）","options":{"A":"持久收入理论","B":"生命周期理论","C":"所有消费理论","D":"凯恩斯消费理论"},"answer":["D"],"explanationSupplement":"凯恩斯的一般消费假设认为，收入增加通常使消费增加，且边际消费倾向可能递减。线性模型用常数 β 简化。","optionExplanations":{"A":"持久收入理论强调长期预期收入。","B":"生命周期理论强调跨期配置。","C":"不同消费理论的假设不同。","D":"这属于凯恩斯消费理论。"},"conceptId":"consumption-saving"},{"id":"eco-11-q42","number":42,"group":"国民收入的决定","type":"single","stem":"消费函数的斜率取决于（　　）。","options":{"A":"边际消费倾向","B":"平均消费倾向","C":"与可支配收入无关的消费总量","D":"与可支配收入相关的消费总量"},"answer":["A"],"explanationSupplement":"以可支配收入为横轴、消费为纵轴，消费函数斜率为 ΔC/ΔY。","optionExplanations":{"A":"边际消费倾向是斜率。","B":"平均消费倾向是从原点连到该点的斜率。","C":"自发消费对应纵轴截距。","D":"引致消费是 βY，不是斜率。"},"conceptId":"consumption-saving"},{"id":"eco-11-q43","number":43,"group":"国民收入的决定","type":"single","stem":"消费的增量和收入的增量之比是（　　）。","options":{"A":"边际消费倾向","B":"边际储蓄倾向","C":"平均消费倾向","D":"平均储蓄倾向"},"answer":["A"],"explanationSupplement":"消费增量除以收入增量就是 MPC。","optionExplanations":{"A":"符合增量比。","B":"其分子是储蓄增量。","C":"分子、分母使用总量。","D":"使用储蓄总量除以收入总量。"},"conceptId":"consumption-saving"},{"id":"eco-11-q44","number":44,"group":"国民收入的决定","type":"single","stem":"一般来说，边际消费倾向的取值为（　　）。","options":{"A":"等于1","B":"大于1","C":"大于0","D":"介于0~1 之间"},"answer":["D"],"explanationSupplement":"简单凯恩斯模型中，新增收入的一部分用于消费，另一部分用于储蓄，因此 0 \u003c MPC \u003c 1。","optionExplanations":{"A":"等于 1 意味全部新增收入用于消费。","B":"大于 1 超过模型通常假定的上界。","C":"给出了下界，未给出上界。","D":"给出完整区间。"},"conceptId":"consumption-saving"},{"id":"eco-11-q45","number":45,"group":"国民收入的决定","type":"single","stem":"凯恩斯认为消费支出（　　）。","options":{"A":"在收入中所占的比重会不断增加","B":"与个人生命周期有关系，不同的时期，消费支出不一样","C":"是根据持久收入决定的","D":"由自发消费和引致消费构成"},"answer":["D"],"explanationSupplement":"简单消费函数由截距 α 与斜率乘以可支配收入 βY 两部分构成。","optionExplanations":{"A":"在 α > 0 时，消费占比随收入增加下降。","B":"对应生命周期理论。","C":"对应持久收入理论。","D":"自发消费与引致消费相加。"},"conceptId":"consumption-saving"},{"id":"eco-11-q46","number":46,"group":"国民收入的决定","type":"single","stem":"有关消费函数和储蓄函数的表述错误的是（　　）。","options":{"A":"消费等于自发消费和引致消费之和","B":"储蓄与消费之间的依存关系被称为储蓄函数","C":"消费函数和储蓄函数互为补数","D":"消费函数公式为 C = α + βY"},"answer":["B"],"explanationSupplement":"储蓄函数描述储蓄随可支配收入的变化。给定收入时，S = Y − C。","optionExplanations":{"A":"消费的两项构成正确。","B":"储蓄函数以可支配收入为自变量。","C":"给定收入，消费加储蓄等于收入。","D":"这是常用的线性消费函数。"},"conceptId":"consumption-saving"},{"id":"eco-11-q47","number":47,"group":"国民收入的决定","type":"single","stem":"边际储蓄倾向（MPS）的取值范围是（　　）。","options":{"A":"0\u003cMPS\u003c1","B":"MPS>1","C":"MPS=1","D":"MPS\u003c0"},"answer":["A"],"explanationSupplement":"MPS = 1 − MPC。若 0 \u003c MPC \u003c 1，则 0 \u003c MPS \u003c 1。","optionExplanations":{"A":"正确的范围。","B":"意味着 MPC 为负。","C":"要求 MPC 等于 0。","D":"意味着 MPC 大于 1。"},"conceptId":"consumption-saving"},{"id":"eco-11-q48","number":48,"group":"国民收入的决定","type":"single","stem":"边际储蓄倾向的公式可以表示为（　　）。","options":{"A":"消费总量和收入总量之比率","B":"储蓄总量和收入总量之比率","C":"储蓄的增量和收入的增量之比率","D":"消费的增量和收入的增量之比率"},"answer":["C"],"explanationSupplement":"边际储蓄倾向是 ΔS/ΔY。","optionExplanations":{"A":"这是平均消费倾向。","B":"这是平均储蓄倾向。","C":"用储蓄增量除收入增量。","D":"这是边际消费倾向。"},"conceptId":"consumption-saving"},{"id":"eco-11-q49","number":49,"group":"国民收入的决定","type":"single","stem":"根据经济学家凯恩斯的消费理论，边际消费倾向和平均消费倾向的关系是（　　）。","options":{"A":"边际消费倾向总是小于平均消费倾向","B":"边际消费倾向总是等于平均消费倾向","C":"边际消费倾向总是大于平均消费倾向","D":"边际消费倾向和平均消费倾向的关系不稳定"},"answer":["A"],"explanationSupplement":"在 C = α + βY、α 和 Y 都为正的模型中，APC = α/Y + β，大于 MPC = β。","optionExplanations":{"A":"在该模型条件下成立。","B":"只有 α 为零等情形才相等。","C":"与 α/Y 为正矛盾。","D":"在线性模型中可直接确定。"},"conceptId":"consumption-saving"},{"id":"eco-11-q50","number":50,"group":"国民收入的决定","type":"single","stem":"根据消费函数，引起消费增加的因素是（　　）。","options":{"A":"价格水平下降","B":"收入增加","C":"储蓄增加","D":"利率提高"},"answer":["B"],"explanationSupplement":"其他条件不变，C = α + βY 中的 β 为正，收入增加会增加引致消费。","optionExplanations":{"A":"物价影响实际购买力，但题目用给定消费函数考察收入变化。","B":"收入是该消费函数的自变量。","C":"储蓄与消费都可因收入增加而上升。","D":"利率未在该消费函数中直接出现。"},"conceptId":"consumption-saving"},{"id":"eco-11-q51","number":51,"group":"国民收入的决定","type":"single","stem":"设C = a + bY为消费函数，a、b>0，则平均消费倾向（　　）。","options":{"A":"大于边际消费倾向","B":"等于边际消费倾向","C":"小于边际消费倾向","D":"以上三种说法都不对"},"answer":["A"],"explanationSupplement":"正收入下，APC = a/Y + b，a/Y > 0，因此 APC > b = MPC。","optionExplanations":{"A":"与公式一致。","B":"需要 a 等于零。","C":"需有 a/Y \u003c 0，与正收入和正自发消费矛盾。","D":"A 可以由公式推出。"},"conceptId":"consumption-saving"},{"id":"eco-11-q52","number":52,"group":"国民收入的决定","type":"single","stem":"假定某人年可支配收入为2万元，如果其消费支出为1.7万元，则（　　）。","options":{"A":"边际消费倾向为 0.85","B":"边际消费倾向为 0.70","C":"平均消费倾向为0.75","D":"平均储蓄倾向为 0.15"},"answer":["D"],"explanationSupplement":"储蓄为 2 − 1.7 = 0.3 万元，APS = 0.3/2 = 0.15。只有一组数据，无法算边际倾向。","optionExplanations":{"A":"0.85 是平均消费倾向。","B":"缺少收入和消费变化量。","C":"平均消费倾向为 0.85。","D":"储蓄占可支配收入 15%。"},"conceptId":"consumption-saving"},{"id":"eco-11-q53","number":53,"group":"国民收入的决定","type":"single","stem":"如果消费函数为 C=100+0.8y，则边际储蓄倾向是（　　）。","options":{"A":"0.8","B":"1","C":"0.2","D":"无法判定"},"answer":["C"],"explanationSupplement":"消费函数斜率为 0.8，所以 MPS = 1 − 0.8 = 0.2。","optionExplanations":{"A":"这是 MPC。","B":"这是 MPC 与 MPS 的和。","C":"正确扣除 MPC。","D":"斜率已给出，可以求出。"},"conceptId":"consumption-saving"},{"id":"eco-11-q54","number":54,"group":"国民收入的决定","type":"single","stem":"边际消费倾向是（　　）。","options":{"A":"可支配收入中用于消费的比例","B":"当消费增加1单位时，收入增加的数量","C":"为使消费增加1单位，可支配收入必须增加的数量","D":"当可支配收入增加1单位时，消费增加的数量"},"answer":["D"],"explanationSupplement":"MPC 衡量可支配收入每增加一单位，消费增加多少。","optionExplanations":{"A":"这是平均消费倾向。","B":"把消费和收入的增量顺序反了。","C":"同样使用了倒数关系。","D":"符合 MPC 定义。"},"conceptId":"consumption-saving"},{"id":"eco-11-q55","number":55,"group":"国民收入的决定","type":"single","stem":"从短期来说，当居民的可支配收入等于零时，消费支出会（　　）。","options":{"A":"大于零","B":"等于零","C":"小于零","D":"以上几种情况都可能"},"answer":["A"],"explanationSupplement":"短期凯恩斯模型假定正的自发消费。即使当期收入为零，也可能动用储蓄或借款消费。","optionExplanations":{"A":"在正截距假定下成立。","B":"只有截距为零才成立。","C":"模型的自发消费为正。","D":"在指定模型里可确定。"},"conceptId":"consumption-saving"},{"id":"eco-11-q56","number":56,"group":"国民收入的决定","type":"single","stem":"引致消费取决于（　　）。","options":{"A":"自发消费","B":"边际储蓄倾向","C":"收入和边际消费倾向","D":"储蓄"},"answer":["C"],"explanationSupplement":"引致消费等于边际消费倾向乘以可支配收入。","optionExplanations":{"A":"自发消费是独立的截距。","B":"储蓄倾向通过互补关系联系消费，题目直接问引致消费。","C":"对应 βY。","D":"储蓄由可支配收入扣除消费得到。"},"conceptId":"consumption-saving"},{"id":"eco-11-q57","number":57,"group":"国民收入的决定","type":"single","stem":"在短期内，居民的（　　）有可能大于可支配收入。","options":{"A":"储蓄","B":"消费","C":"所得税","D":"转移支付"},"answer":["B"],"explanationSupplement":"当期消费可由既有储蓄或借款补足，因此可能超过当期可支配收入。","optionExplanations":{"A":"非负消费下，储蓄不超过可支配收入。","B":"可支配收入为低值时，正的自发消费可以超过它。","C":"税额未由消费函数决定。","D":"转移支付也不是模型中 C + S 分配的一项。"},"conceptId":"consumption-saving"},{"id":"eco-11-q58","number":58,"group":"国民收入的决定","type":"single","stem":"边际消费倾向与边际储蓄倾向之和（　　）。","options":{"A":"等于1","B":"大于1","C":"小于 1","D":"等于0"},"answer":["A"],"explanationSupplement":"可支配收入增量分为消费增量和储蓄增量。除以同一收入增量，MPC + MPS = 1。","optionExplanations":{"A":"符合收入分配恒等式。","B":"意味着两项增量之和超过收入增量。","C":"意味着部分新增收入在两项外遗漏。","D":"与收入增加相矛盾。"},"conceptId":"consumption-saving"},{"id":"eco-11-q59","number":59,"group":"国民收入的决定","type":"single","stem":"边际消费倾向小于1，意味着当前可支配收入的增加将使意愿的消费支出（　　）。","options":{"A":"增加，但幅度小于可支配收入的增加幅度","B":"有所下降，这是由于收入的增加会增加储蓄","C":"增加，其幅度等于可支配收入的增加幅度","D":"保持不变，这是由于边际储蓄倾向同样小于1"},"answer":["A"],"explanationSupplement":"在简单模型中，0 \u003c MPC \u003c 1。收入增加时，消费增加额等于 MPC 乘收入增量，所以增幅小于该收入增量。","optionExplanations":{"A":"符合正斜率且小于 1 的条件。","B":"储蓄和消费可一起增加。","C":"需要 MPC 等于 1。","D":"消费增量为零需要 MPC 为零。"},"conceptId":"consumption-saving"},{"id":"eco-11-q60","number":60,"group":"国民收入的决定","type":"single","stem":"如果边际消费倾向为常数，那么消费函数将是（　　）。","options":{"A":"一条不通过原点的直线","B":"一条通过原点与横轴成45°的直线","C":"一条向上凸的直线","D":"一条向下凹的直线"},"answer":["A"],"explanationSupplement":"MPC 恒定能推出消费函数是直线。标准线性凯恩斯模型还假定自发消费为正，因此直线不经过原点。","optionExplanations":{"A":"在正自发消费的前提下成立。","B":"需要截距为零且斜率为 1。","C":"直线的斜率不会随收入上升。","D":"直线的斜率不会随收入下降。"},"conceptId":"consumption-saving"},{"id":"eco-11-q61","number":61,"group":"国民收入的决定","type":"single","stem":"假设当可支配收入等于20000美元时，消费等于18000美元。当可支配收入增加到22000美元时，消费就增加到19200美元，那么边际消费倾向是（　　），边际储蓄倾向等于（　　）。","options":{"A":"0.90,0.10","B":"0.87,0.13","C":"0.60, 0.40","D":"0.40,0.60"},"answer":["C"],"explanationSupplement":"收入增加 2000，消费增加 1200，所以 MPC = 0.60，MPS = 0.40。","optionExplanations":{"A":"0.90 是初始平均消费倾向。","B":"约 0.87 是变化后的平均消费倾向。","C":"按增量计算得到这两个数。","D":"把 MPC 与 MPS 调换了。"},"conceptId":"consumption-saving"},{"id":"eco-11-q62","number":62,"group":"国民收入的决定","type":"single","stem":"在以下哪种情况下，投资乘数最大？（　　）","options":{"A":"边际消费倾向为 0.6","B":"边际消费倾向为0.4","C":"边际消费倾向为 0.75","D":"边际消费倾向为 0.2"},"answer":["C"],"explanationSupplement":"简单模型中投资乘数等于 1/(1 − MPC)。边际消费倾向越大，乘数越大。","optionExplanations":{"A":"乘数为 2.5。","B":"乘数约为 1.67。","C":"四项中 MPC 最大，乘数为 4。","D":"乘数为 1.25。"},"conceptId":"multipliers"},{"id":"eco-11-q63","number":63,"group":"国民收入的决定","type":"single","stem":"假设一个社会的边际消费倾向 β为 0.8，则投资乘数 KI等于（　　）。","options":{"A":"0.20","B":"1.25","C":"0.80","D":"5.00"},"answer":["D"],"explanationSupplement":"将 β = 0.8 代入投资乘数 1/(1 − β)，得到 5。","optionExplanations":{"A":"这是边际储蓄倾向。","B":"这是 1/β。","C":"这是题给 MPC。","D":"正确取边际储蓄倾向的倒数。"},"conceptId":"multipliers"},{"id":"eco-11-q64","number":64,"group":"国民收入的决定","type":"single","stem":"关于边际消费倾向、平均消费倾向及其相互关系的说法，正确的是（　　）。","options":{"A":"边际消费倾向恒等于平均消费倾向","B":"边际消费倾向可能大于、等于或小于0","C":"平均消费倾向总是在0到1之间","D":"边际消费倾向总是小于平均消费倾向"},"answer":["D"],"explanationSupplement":"在正收入、正自发消费的简单凯恩斯模型中，APC = β + α/Y，大于 MPC。低收入时 APC 可以超过 1。","optionExplanations":{"A":"正截距时二者不相等。","B":"简单凯恩斯模型通常假定 MPC 大于 0。","C":"消费超过收入时 APC 大于 1。","D":"在给定模型的正收入范围内成立。"},"conceptId":"consumption-saving"},{"id":"eco-11-q65","number":65,"group":"国民收入的决定","type":"discussion","stem":"如果投资支出I突然下降，那么凯恩斯模型预期（　　）。","options":{"A":"GDP 将开始持续下降，但最终下降将小于投资I的下降","B":"GDP 将迅速下降，其量大于投资 I的下降","C":"GDP 将迅速下降，其量小于投资I的下降量，但将没有进一步下降趋势","D":"GDP 将开始持续下降，直至下降量大大超过投资I的下降量"},"answer":[],"explanationSupplement":"投资下降首先压低计划支出与收入，收入减少又压低后续消费。简单模型的乘数大于 1，最终产出降幅超过投资的初始降幅。模型本身不给出调整速度。","optionExplanations":{"A":"把最终降幅方向判断反了。","B":"幅度方向正确，但迅速与否无法从模型得出。","C":"与正的后续消费效应不符。","D":"描述投资下降引发多轮支出收缩的过程，但超出幅度依赖 MPC。"},"conceptId":"multipliers"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {

  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }
 const chapterViews = chapter?.visual ? ['learn', 'map', 'visual', 'practice'] : ['learn', 'map', 'practice'];

 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));

  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');

  }

   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');

  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}

 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
