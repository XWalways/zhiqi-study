  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter20","number":3,"title":"金融市场","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-03-金融市场-离线学习.html","visual":"bond","visualSectionId":"bond-value","visuals":[{"type":"bond","sectionId":"bond-value"}]},"lessons":{"title":"金融市场","subtitle":"从资金如何交易，学到怎样识别货币和资本市场工具。","sections":[{"id":"market-types","title":"金融市场及其分类","summary":"在融资期限、交易阶段、交易场所和信用关系四个维度识别市场。","bodyHtml":"\u003cp>\u003cstrong>金融市场\u003c/strong>是金融工具发行、交易和资金定价的机制。按期限可分货币市场（通常为一年以内、含一年）和资本市场（中长期融资及股票等无到期工具）。按交易阶段分发行市场与流通市场，按场所分场内与场外，按交易对象也可分外汇、证券、衍生品等市场。\u003c/p>\u003cp>\u003cstrong>直接融资\u003c/strong>使资金方直接对用款人拥有债权或股权。银行吸收存款、再用其资产负债表发放贷款是\u003cstrong>间接融资\u003c/strong>。承销经纪服务不会改变证券持有人与发行人之间的债权或股权。\u003c/p>","keyTakeaway":"先看题干用哪一条标准分类。","pitfall":"发行市场等于一级市场，后续流通是二级市场。同一工具可同时属于多个维度。","example":"新发五年期公司债兼属一级市场与资本市场。"},{"id":"market-functions","title":"市场参与者与功能","summary":"把谁在市场中活动、活动怎么定价、资金最终到哪里分开。","bodyHtml":"\u003cp>主体有家庭、企业、政府、金融机构和中央银行。交易对象包括货币资金、债券、股权和衍生合约。利率、汇率和证券价格反映不同工具的交易条件。\u003c/p>\u003cp>\u003cstrong>微观功能\u003c/strong>包括积聚资金、提供交易渠道、管理财富和转移风险。\u003cstrong>宏观功能\u003c/strong>包括配置资源、形成价格和信息、为政策传导提供渠道。“经济晴雨表”对应反映功能，市场会把预期计入价格。\u003c/p>\u003cp>我国人民银行通过公开市场操作等参与交易，并依法主管全国银行间债券市场。国家金融监督管理总局承担除证券业以外的金融业监管职责，证监会依法负责证券期货监管。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111818164813404.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行银行间债券交易规则\u003c/a> · \u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/2023/2023_zt02/yw/202303/t20230311_1050340.html\" target=\"_blank\" rel=\"noopener noreferrer\">国务院机构改革方案\u003c/a>\u003c/p>","keyTakeaway":"聚积回答如何汇钱，配置回答钱流向哪里，反映回答价格传递何种信息。","pitfall":"市场反映预期，同时受流动性和风险偏好影响，价格并非经济统计值。","example":"企业发债获得融资，债券收益率还向市场传递信用状况和利率预期。"},{"id":"tool-properties","title":"金融工具的四个维度","summary":"期限、流动性、收益性和风险性各自回答不同问题。","bodyHtml":"\u003cp>\u003cstrong>期限\u003c/strong>是合同安排下资金存续的时间。\u003cstrong>流动性\u003c/strong>是迅速且低成本变现的能力。\u003cstrong>收益\u003c/strong>既可来自利息和股息，也可来自价格变化。\u003cstrong>风险\u003c/strong>包括违约、利率波动、难变现、汇率等。\u003c/p>\u003cp>股票、债券和商业票据是基本金融工具。期货、期权等根据标的价格或指数定价。期限长短或有无交易所都无法单独决定总风险。在其他条件相同时，流动性差的工具一般需要收益补偿。\u003c/p>","keyTakeaway":"收益比较先控制信用、期限、币种与担保，再讨论风险补偿。","pitfall":"期限越短一般利率敏感度越低，信用风险仍需单独判断。","example":"短期低评级债可能具有比长期国债更高的违约风险。"},{"id":"interbank","title":"同业拆借","summary":"金融机构依自身信用进行短期资金调剂。","bodyHtml":"\u003cp>\u003cstrong>同业拆借\u003c/strong>是符合规定的金融机构之间通过统一同业拆借网络开展的无担保资金融通。商业银行常用于弥补结算差额、清算头寸和短期周转。借入资金不得用于固定资产贷款或投资。\u003c/p>\u003cp>核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914190098678.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行《同业拆借管理办法》\u003c/a> · \u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_35aff5bda2374572b8eb87cafcd1541a.html\" target=\"_blank\" rel=\"noopener noreferrer\">《商业银行法》第四十六条\u003c/a>\u003c/p>","keyTakeaway":"同业拆借的定义关键词是机构间、无担保、资金融通。","pitfall":"担保或期限短均无法改变固定资产贷款用途的禁止性。","example":"某银行当天出现结算缺口，可通过市场借入隔夜资金以补足头寸。"},{"id":"repo","title":"证券回购","summary":"融资方现在拿到资金，未来按约归还本金并支付融资成本。","bodyHtml":"\u003cp>\u003cstrong>质押式回购\u003c/strong>中，资金融入方以债券出质，按约返还资金后解除质押。\u003cstrong>买断式回购\u003c/strong>中，交易双方现在进行债券转让，同时约定将来按约买回。交易中既有首期资金流，也有到期逆向资金流。\u003c/p>\u003cp>从央行操作角度看，逆回购首期向交易对手提供资金，正回购首期收回资金。证券担保有助于降低损失风险，仍需考察折扣率、市场波动和交易对手风险。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111818164813404.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行银行间债券交易规则\u003c/a>\u003c/p>","keyTakeaway":"答回购先确定从哪方观察，再区分质押和产权转移。","pitfall":"回购利率与存款利率的比较取决于期限、担保和市场条件。","example":"融资方今天获得 100 万元，到期返还 100.1 万元，差额为本次融资成本。"},{"id":"money-instruments","title":"短期工具、贴现与持币成本","summary":"国库券、商业票据和大额存单都能用于短期资金安排，但发行人和风险不同。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>短期国库券\u003c/strong>由政府融资时发行，常作为低信用风险短期工具。持币的机会成本可以用可替代短券的利率衡量。\u003c/li>\u003cli>\u003cstrong>商业票据\u003c/strong>的经济学典型是企业发行的短期无担保债务凭证。银行承兑汇票涉及承兑银行的到期付款责任。按面额和单利贴现时，实付＝面额 × (1－年贴现率 × 年数)。福费廷常表现为无追索买入远期出口应收款。\u003c/li>\u003cli>\u003cstrong>可转让大额定期存单\u003c/strong>是典型货币市场工具。我国面向非金融机构的大额存单为人民币记账式一般性存款，产品是否可转让、提前支取或赎回要看发行条款。同业存单另属同业市场工具。\u003c/li>\u003c/ul>\u003cp>按《贷款通则》第八条采用的期限口径，短期不超过 1 年，中期超过 1 年且不超过 5 年，长期超过 5 年。信用卡资金不得用于投资等监管禁止领域。核验于 2026 年 11 月 11 日。\u003ca href=\"https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=38628\" target=\"_blank\" rel=\"noopener noreferrer\">商务部法规库《贷款通则》\u003c/a> · \u003ca href=\"https://www.cnafc.org/cnafc/front/detail.action?id=e24707081e7f4ee6a466ea9e80c1504a\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行《大额存单管理暂行办法》\u003c/a> · \u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=272670\" target=\"_blank\" rel=\"noopener noreferrer\">信用卡业务规范通知\u003c/a>\u003c/p>","keyTakeaway":"贴现要把半年换算成 0.5 年，并从面额中扣除贴息。","pitfall":"易变现的“准货币”特性是一种描述，货币供应量的准货币是统计分类。","example":"面额 100 万元、半年到期、年贴现率 6%，实付 97 万元。"},{"id":"shares","title":"股票权利、发行与市场板块","summary":"股权意味着持股人以剩余收益和约定权利承担经营风险。","bodyHtml":"\u003cp>股票是公司股份的凭证，持有者可能取得股息和价格差。普通股一般享有表决与按规则获得利润分配等权利。优先股可在股息或剩余财产分配上优先，具体股息、表决和其他权利以类别条款为准。\u003c/p>\u003cp>\u003cstrong>A 股\u003c/strong>以人民币交易，\u003cstrong>B 股\u003c/strong>以人民币标明面值、以外币认购和交易。H 股是境内注册公司在香港上市的股票，N 股、S 股等简称强调其他境外上市地点。首次公开发行与已上市公司增发等属于发行阶段，投资者间买卖属于流通阶段。\u003c/p>\u003cp>公司章程可选择面额股或无面额股，面额股发行价格不得低于票面金额。股份有限公司发行新股增加注册资本时，股东原则上无优先认购权，章程或股东会决议可另作规定。我国多层次资本市场包括沪深主板、科创板、创业板、北交所、新三板和区域性股权市场等，深市中小板已于 2021 年并入主板。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/xyjgs/flfg/art/2024/art_d4e84936a8a744f8928ac7aec7594345.html\" target=\"_blank\" rel=\"noopener noreferrer\">《公司法》\u003c/a> · \u003ca href=\"https://www.szse.cn/www/investor/institute/bookshelf/manualseriesbook/P020190322685818724112.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">深交所股票投资指南\u003c/a> · \u003ca href=\"https://www.csrc.gov.cn/xizang/c104685/c7415066/7415066/files/%E8%A5%BF%E8%97%8F%E8%BE%96%E5%8C%BA%E4%BC%81%E4%B8%9A%E5%8F%91%E8%A1%8C%E4%B8%8A%E5%B8%82%EF%BC%88%E6%8C%82%E7%89%8C%EF%BC%89%E5%AE%9E%E5%8A%A1%E6%89%8B%E5%86%8C.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">证监会多层次资本市场概述\u003c/a> · \u003ca href=\"https://www.szse.cn/disclosure/notice/general/t20210331_585343.html\" target=\"_blank\" rel=\"noopener noreferrer\">深交所主板与中小板合并通知\u003c/a>\u003c/p>","keyTakeaway":"比较普通股与优先股时，把表决、股息和剩余财产分别看。","pitfall":"优先股的“优先”一般指分配顺位。具体股息率与新股认购安排要看条款和适用规定。","example":"公司清算付清债务后，具有财产分配优先约定的类别股可按条款先于普通股获偿。"},{"id":"bonds","title":"债券分类与发行人","summary":"从发行主体、付息规则、期限、发行地和计价币种识别债券。","bodyHtml":"\u003cp>债券代表发行人还本付息等合同义务。按主体可分政府债券、金融债券、公司信用类债券等。按现金流可分固定利率债、浮息债和零息债等。央行票据由中国人民银行发行，用于流动性管理等。\u003cstrong>外国债券\u003c/strong>由境外发行人在东道国市场用东道国货币发行。\u003cstrong>欧洲债券\u003c/strong>一般以发行市场所在国之外的货币计价。\u003c/p>\u003cp>境外机构在我国境内发行的人民币债券称熊猫债。地方政府依法自行组织地方债发行和还本付息，具体工作由地方财政部门办理。财政部代理发行并代办还本付息属于 2009—2010 年的历史安排。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.pbc.gov.cn/zhengwugongkai/attachDir/2025/11/2025111914265046017.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行金融债券发行管理办法\u003c/a> · \u003ca href=\"https://www.pbc.gov.cn/huobizhengceersi/214481/3871621/5885243/2025122616492523798.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">人民银行人民币国际化报告\u003c/a> · \u003ca href=\"https://www.mof.gov.cn/gkml/caizhengwengao/202001wg/wg202012/202105/t20210514_3702122.htm\" target=\"_blank\" rel=\"noopener noreferrer\">财政部地方政府债券发行办法\u003c/a> · \u003ca href=\"https://m.mof.gov.cn/zcjd/201503/t20150316_1202816.htm\" target=\"_blank\" rel=\"noopener noreferrer\">财政部地方债发行历史解读\u003c/a>\u003c/p>","keyTakeaway":"外国债券名称要同时校对发行主体、发行地与计价币种。","pitfall":"“欧洲债券”中的欧洲是历史名称，关键在发行市场与币种关系。","example":"日本机构在美国发行美元债是典型扬基债，在中国境内发行人民币债是典型熊猫债。"},{"id":"bond-value","title":"债券价格、票息与收益率","summary":"用未来现金流折现理解交易价格与收益率的方向。","bodyHtml":"\u003cp>在固定票息、每年付息、到期按面额 F 还本的条件下，债券价格等于各期票息 C 的折现值加上到期本金的折现值，即 \u003cstrong>P＝∑ C/(1+y)ᵗ＋F/(1+y)ⁿ\u003c/strong>，求和范围为第 1 至第 n 年。y 为每期市场折现率。票面利率是 C/F，发行人约定了支付现金流。\u003c/p>\u003cp>现金流固定时，市场收益率越高，价格越低。标准债券在付息周期起点报价时，溢价对应到期收益率低于票面利率。期限相近仍要看票息、嵌入期权和现金流分布，比较利率敏感度可用久期。\u003c/p>","keyTakeaway":"区分票息比例、市场收益率、价格和收益金额。","pitfall":"票面利率按面值计算。投资者在市场上的实际收益还与买入价格和持有期间现金流有关。","example":"面值 100 元、年票息 5 元的一年债，若收益率为 4%，定价约为 105/1.04＝100.96 元。"},{"id":"funds","title":"证券投资基金","summary":"份额持有人承担净值涨跌，管理人受托运作，托管人承担保管和监督职责。","bodyHtml":"\u003cp>基金把不同投资者的资金集合起来，依投资目标进行组合管理。按组织形态可分\u003cstrong>契约型和公司型\u003c/strong>，按运作方式可分\u003cstrong>开放式和封闭式\u003c/strong>。投资者通常按规则申购赎回开放式基金份额，上市封闭式基金可在二级市场交易。上市 ETF 属于开放式基金，其二级市场价格可能偏离基金份额净值。\u003c/p>\u003cp>基金托管人负责保管资产、办理清算交割、复核净值等。依法设立并取得资格的商业银行或其他金融机构均可担任。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/bgt/art/2023/art_f70635e95c74402c878c9f9a0a362c16.html\" target=\"_blank\" rel=\"noopener noreferrer\">《证券投资基金法》第三十二条\u003c/a> · \u003ca href=\"https://www.csrc.gov.cn/csrc/c106256/c1653705/content.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">证监会基金托管业务管理办法\u003c/a>\u003c/p>","keyTakeaway":"先识别分类标准，再分清管理、托管与份额持有三种角色。","pitfall":"基金份额可在场外按净值基础申赎，也可能在场内按市场价格交易。","example":"某 ETF 净值为 1.00 元，场内成交价为 1.01 元，市场价格相对净值有溢价。"}],"mindmap":[{"label":"金融市场概述","target":"market-types","children":[{"label":"构成","target":"market-functions","children":[{"label":"家庭、企业与政府","target":"market-functions"},{"label":"金融机构与中央银行","target":"market-functions"},{"label":"交易工具与交易价格","target":"market-functions"}]},{"label":"功能","target":"market-functions","children":[{"label":"微观","target":"market-functions","children":[{"label":"积聚资金","target":"market-functions"},{"label":"财富管理","target":"market-functions"},{"label":"转移风险","target":"market-functions"},{"label":"促进交易","target":"market-functions"}]},{"label":"宏观","target":"market-functions","children":[{"label":"资源配置","target":"market-functions"},{"label":"宏观调节","target":"market-functions"},{"label":"反映信息","target":"market-functions"}]}]},{"label":"分类","target":"market-types","children":[{"label":"货币市场与资本市场","target":"market-types"},{"label":"发行市场与流通市场","target":"market-types"},{"label":"场内市场与场外市场","target":"market-types"},{"label":"直接融资与间接融资","target":"market-types"}]},{"label":"金融工具属性","target":"tool-properties","children":[{"label":"期限性","target":"tool-properties"},{"label":"流动性","target":"tool-properties"},{"label":"收益性","target":"tool-properties"},{"label":"风险性","target":"tool-properties"},{"label":"原生与衍生工具","target":"tool-properties"}]}]},{"label":"货币市场","target":"money-instruments","children":[{"label":"短期国库券","target":"money-instruments","children":[{"label":"短期限与高流动性","target":"money-instruments"},{"label":"持币机会成本","target":"money-instruments"}]},{"label":"同业拆借","target":"interbank","children":[{"label":"信用拆借","target":"interbank"},{"label":"结算与临时周转","target":"interbank"}]},{"label":"回购协议","target":"repo","children":[{"label":"质押式与买断式","target":"repo"},{"label":"现时融资与到期回购","target":"repo"}]},{"label":"票据市场","target":"money-instruments","children":[{"label":"商业票据与承兑汇票","target":"money-instruments"},{"label":"贴现","target":"money-instruments"},{"label":"福费廷","target":"money-instruments"}]},{"label":"大额可转让存单","target":"money-instruments","children":[{"label":"存款凭证","target":"money-instruments"},{"label":"发行条款","target":"money-instruments"}]}]},{"label":"资本市场","target":"shares","children":[{"label":"股票","target":"shares","children":[{"label":"普通股与优先股","target":"shares"},{"label":"A、B、H、N、S 股","target":"shares"},{"label":"首次发行、增发与流通","target":"shares"},{"label":"多层次市场","target":"shares"}]},{"label":"债券","target":"bonds","children":[{"label":"政府、金融和公司债","target":"bonds"},{"label":"固定利率、浮息和零息","target":"bonds"},{"label":"境内、外国和欧洲债券","target":"bonds"},{"label":"价格与利率","target":"bond-value","children":[{"label":"票面利率与市场收益率","target":"bond-value"},{"label":"价格与收益率反向变动","target":"bond-value"}]}]},{"label":"证券投资基金","target":"funds","children":[{"label":"管理、托管与份额持有","target":"funds"},{"label":"开放式与封闭式","target":"funds"},{"label":"公司型与契约型","target":"funds"}]}]}]},"questions":[{"id":"fin-03-q01","number":1,"group":"金融市场概述","type":"single","stem":"按照金融交易是否有固定场所，金融市场可划分为（　　）。","options":{"A":"发行市场和流通市场","B":"货币市场和资本市场","C":"场内市场和场外市场","D":"公募市场和私募市场"},"answer":["C"],"explanationSupplement":"先识别题眼“固定场所”。场内市场通常依托交易所等有组织场所，场外市场通过交易所外的网络或协议交易。","optionExplanations":{"A":"以首次发行或后续流通区分","B":"以融资期限为主区分","C":"按交易场所区分","D":"按面向对象及发行方式区分"},"conceptId":"market-types"},{"id":"fin-03-q02","number":2,"group":"金融市场概述","type":"single","stem":"在金融市场上，既是重要的交易主体又是监管机构之一的是（　　）。","options":{"A":"中央银行","B":"企业","C":"商业银行","D":"证券公司"},"answer":["A"],"explanationSupplement":"中央银行可通过公开市场操作成为交易对手，并依法主管全国银行间债券市场等特定市场。资本市场、银行保险等还有各自监管职责，详见精讲的现行分工。","optionExplanations":{"A":"既进行公开市场操作，也依法承担相应市场管理职责","B":"通常为发行人或投资者","C":"是参与者，不承担该题所指法定监管职能","D":"是金融市场机构，不是行政监管机构"},"conceptId":"market-functions"},{"id":"fin-03-q03","number":3,"group":"金融市场概述","type":"single","stem":"金融市场最基本的功能是（　　）。","options":{"A":"资源配置职能","B":"财富功能","C":"交易功能","D":"资金积聚功能"},"answer":["D"],"explanationSupplement":"常见分类把资金汇聚列为最基础的功能。市场把分散的可用资金集中起来，才有条件支持大规模融资与投资。","optionExplanations":{"A":"是资金汇聚之后的分配作用","B":"对应投资和财富管理","C":"提供买卖机制","D":"直接概括分散资金汇集"},"conceptId":"market-functions"},{"id":"fin-03-q04","number":4,"group":"金融市场概述","type":"single","stem":"直接金融市场与间接金融市场的差别在于（　　）。","options":{"A":"是否有中介机构参与","B":"中介机构的交易规模","C":"中介机构在交易中的活跃程度","D":"中介机构在交易中的地位和性质"},"answer":["D"],"explanationSupplement":"判断中介有没有用自身资产负债表成为债权债务双方。承销商促成企业发行债券也参与交易，但资金方仍直接对企业享有债权。","optionExplanations":{"A":"直接融资也可以有承销商","B":"规模不能说明债权指向","C":"活跃程度无法识别融资法律关系","D":"中介是否成为自己的债权人和债务人是关键"},"conceptId":"market-types"},{"id":"fin-03-q05","number":5,"group":"金融市场概述","type":"single","stem":"在金融市场的各类主体中，主要以资金供应者身份参与金融市场的主体是（　　）。","options":{"A":"企业","B":"家庭","C":"政府","D":"金融机构"},"answer":["B"],"explanationSupplement":"资金流量模型通常把家庭作为净储蓄部门。家庭可能贷款，企业也可能持有闲置现金，题问的是典型总体角色。","optionExplanations":{"A":"通常是融资主体","B":"通常以储蓄方式供给资金","C":"可经发行政府债券筹资","D":"同时调剂并交易资金"},"conceptId":"market-functions"},{"id":"fin-03-q06","number":6,"group":"金融市场概述","type":"single","stem":"下列金融工具中，不属于原生金融工具的是（　　）。","options":{"A":"企业债券","B":"股票","C":"股指期货","D":"商业票据"},"answer":["C"],"explanationSupplement":"股指期货的价值以股票价格指数为基础，属于衍生工具。","optionExplanations":{"A":"企业直接创设的债权工具","B":"公司的所有权凭证","C":"以股票指数为标的的衍生工具","D":"企业发行的短期债务工具"},"conceptId":"tool-properties"},{"id":"fin-03-q07","number":7,"group":"金融市场概述","type":"discussion","stem":"直接融资的投资收益与间接融资收益相比较一般（　　）。","options":{"A":"要高","B":"要低","C":"持平","D":"不确定"},"answer":[],"explanationSupplement":"缺少同一发行人、相同期限、担保、风险和成本的前提，无法给直接和间接融资收益作统一排序。高风险债券的承诺收益可能高于存款，违约后的实际收益却可能更低。","optionExplanations":{"A":"可以在特定风险和比较口径下成立","B":"也可能出现，但不能推广","C":"不能断言两者总相同","D":"不加比较条件时无法排序"},"conceptId":"market-types"},{"id":"fin-03-q08","number":8,"group":"金融市场概述","type":"single","stem":"资金需求者将金融资产首次出售给资金的供应者所形成的交易市场称为（　　）。","options":{"A":"发行市场","B":"流通市场","C":"外汇市场","D":"货币市场"},"answer":["A"],"explanationSupplement":"资金需求者的证券首次出售，款项流向发行主体，属于一级市场。投资者之间后续交易则是二级市场。","optionExplanations":{"A":"发行主体首次向投资者出售证券","B":"投资者后续转让已发行证券","C":"按标的划分的市场","D":"按工具期限划分的市场"},"conceptId":"market-types"},{"id":"fin-03-q09","number":9,"group":"金融市场概述","type":"single","stem":"被称为国民经济的晴雨表，这是指金融市场的（　　）。","options":{"A":"聚敛功能","B":"配置功能","C":"调节功能","D":"反映功能"},"answer":["D"],"explanationSupplement":"经济数据与市场价格不必同步，但市场价格综合了市场对经济和预期的判断，故可反映经济形势。","optionExplanations":{"A":"汇集资金","B":"将资金引导到不同用途","C":"通过价格等渠道调节资金流向","D":"与“晴雨表”所指的信息反映相符"},"conceptId":"market-functions"},{"id":"fin-03-q10","number":10,"group":"金融市场概述","type":"discussion","stem":"一般而言，金融资产的流动性与风险性、收益性之间的关系存在（　　）关系。","options":{"A":"正相关","B":"负相关","C":"不相关","D":"不确定关系"},"answer":[],"explanationSupplement":"其他条件相同，流动性较差可能需要收益补偿，流动性风险也更高。信用风险、预期收益、利率风险各自受更多因素影响，整体市场数据不必负相关。","optionExplanations":{"A":"某些样本可观察到","B":"对应单因素、控制条件后的部分理论比较","C":"不能断言无关联","D":"综合比较缺少条件，无法给统一方向"},"conceptId":"tool-properties"},{"id":"fin-03-q11","number":11,"group":"货币市场","type":"single","stem":"同业拆借活动都是在金融机构之间进行，对参与者要求严格。因此，其拆借活动基本上都是（　　）拆借。","options":{"A":"质押","B":"抵押","C":"担保","D":"信用"},"answer":["D"],"explanationSupplement":"同业拆借是合格金融机构之间的无担保资金融通，重点是短期流动性管理。带债券担保的融资通常属于质押式回购等业务。","optionExplanations":{"A":"通常是质押式回购的担保方式","B":"属于有抵押融资","C":"定义强调无担保","D":"依交易对手信用开展"},"conceptId":"interbank"},{"id":"fin-03-q12","number":12,"group":"货币市场","type":"single","stem":"货币市场工具一般具有期限短、流动性强、对利率敏感等特点，有（　　）之誉。","options":{"A":"货币","B":"票据","C":"基础货币","D":"准货币"},"answer":["D"],"explanationSupplement":"“准货币”在此是易变现的比喻。与统计口径中的准货币区分，货币市场工具不会因为易转让就全部被纳入货币供应量。","optionExplanations":{"A":"工具本身通常不是交换媒介","B":"票据只是其中一类","C":"基础货币为特定央行负债口径","D":"指可较快转化为可支付货币的比喻"},"conceptId":"money-instruments"},{"id":"fin-03-q13","number":13,"group":"货币市场","type":"single","stem":"证券回购协议实质是（　　）。","options":{"A":"信用贷款","B":"证券买卖","C":"以证券为质押品的短期借款","D":"信用借款"},"answer":["C"],"explanationSupplement":"短期先融资、日后返还资金并支付回购利息。C 描述质押式回购的典型结构，买断式回购在法律形式上是先出售后买回，经济上仍具有资金融通属性。","optionExplanations":{"A":"一般无担保信用贷款缺少证券安排","B":"只能描述表面形式且忽略约定回购","C":"抓住证券支持短期融通的经济实质","D":"与 A 一样缺少标的证券"},"conceptId":"repo"},{"id":"fin-03-q14","number":14,"group":"货币市场","type":"single","stem":"公司以贴现方式出售给投资者的短期无担保的信用凭证是（　　）。","options":{"A":"公司债券","B":"银行承兑汇票","C":"大额可转让定期存单","D":"商业票据"},"answer":["D"],"explanationSupplement":"题眼是公司、短期、无担保、贴现出售。这是货币市场中商业票据的典型经济学定义。","optionExplanations":{"A":"公司债券一般为中长期，可能有担保","B":"银行承兑汇票由承兑银行承担付款义务","C":"存款类工具由银行等机构发行","D":"符合四个题设特征"},"conceptId":"money-instruments"},{"id":"fin-03-q15","number":15,"group":"货币市场","type":"single","stem":"回购交易通常在（　　）交易中应用。","options":{"A":"远期","B":"现货","C":"债券","D":"股票"},"answer":["C"],"explanationSupplement":"回购广泛用于债券交易，包括通过高流动性债券管理短期现金。","optionExplanations":{"A":"回购含未来回购腿，但不等同于远期交易分类","B":"现券买卖没有约定回购腿","C":"国债等债券是常见标的","D":"股票质押回购也存在，题问一般货币市场用法"},"conceptId":"repo"},{"id":"fin-03-q16","number":16,"group":"货币市场","type":"single","stem":"有人把一张6个月后到期、面额100万元的商业票据向银行贴现，银行按照6%的年率计算应支付对方的金额是（　　）。","options":{"A":"94万元","B":"97 万元","C":"985 万元","D":"103万元"},"answer":["B"],"explanationSupplement":"按面额计算的单利贴现额为 100 × 6% × 6/12＝3 万元，实付 100－3＝97 万元。","optionExplanations":{"A":"把半年误作一年","B":"扣除半年贴息 3 万元后的净额","C":"高于面额，不符合折价","D":"把贴息误加到面额上"},"conceptId":"money-instruments"},{"id":"fin-03-q17","number":17,"group":"货币市场","type":"single","stem":"信用卡的功能不包括（　　）。","options":{"A":"投资","B":"消费信用","C":"转账结算","D":"提取现金"},"answer":["A"],"explanationSupplement":"信用卡主要是消费信用工具，可办理支付结算以及合规的预借现金。信用卡资金不得用于投资等监管禁止领域，具体预借或转账范围依产品和规则。","optionExplanations":{"A":"信用卡资金不得用于投资","B":"是信用卡核心功能","C":"可有合规结算功能","D":"可有依规则办理的预借现金功能"},"conceptId":"money-instruments"},{"id":"fin-03-q18","number":18,"group":"货币市场","type":"single","stem":"对于回购协议的说法错误的是（　　）。","options":{"A":"所涉及的证券主要是国债","B":"回购协议交易流动性强，安全性高","C":"回购协议收益低于银行存款收益","D":"是融通短期资金的行为"},"answer":["C"],"explanationSupplement":"回购收益由期限、担保品、交易对手及市场资金状况决定，无法与存款收益作一般性高低排序。证券担保也无法消除流动性或交易对手风险。","optionExplanations":{"A":"国债是常见高流动性担保品","B":"是指高质量担保品下的常见相对特点","C":"两种收益无固定排序","D":"回购常用于调剂短期资金"},"conceptId":"repo"},{"id":"fin-03-q19","number":19,"group":"货币市场","type":"single","stem":"短期国库券和货币具有很好的安全性，但货币是较好的交换媒介。当短期国库券利率下降时，人们将持有（　　）。","options":{"A":"较多的货币，因为其机会成本上升","B":"较少的货币，因为其机会成本上升","C":"较多的货币，因为其机会成本下降","D":"较少的货币，因为其机会成本下降"},"answer":["C"],"explanationSupplement":"持有现金放弃的是本可取得的短期利息。短券利率下降，放弃的利息减少，其他条件相同时意愿持币量上升。","optionExplanations":{"A":"利率降低会降低持币机会成本","B":"既把成本方向弄反，也把持有量弄反","C":"成本下降带来更多持币","D":"成本下降通常使持币增加"},"conceptId":"money-instruments"},{"id":"fin-03-q20","number":20,"group":"货币市场","type":"single","stem":"某商业银行通过同业拆借获得一笔资金。关于该拆入资金的用途，下列哪一选项是违法的？（　　）","options":{"A":"弥补票据结算的不足","B":"弥补联行汇差头寸的不足","C":"发放有担保的短期固定资产贷款","D":"解决临时性周转资金的需要"},"answer":["C"],"explanationSupplement":"依《商业银行法》第四十六条，商业银行不得用同业拆入资金发放固定资产贷款或投资。贷款有无担保、期限是否短，不改变这一禁令。","optionExplanations":{"A":"属于弥补结算短期头寸的典型用途","B":"属于弥补汇划差额的短期用途","C":"固定资产贷款属于禁止用途","D":"临时资金周转是拆借典型用途"},"conceptId":"interbank"},{"id":"fin-03-q21","number":21,"group":"货币市场","type":"single","stem":"从业务运作实质看，福费廷就是（　　）。","options":{"A":"保付代理","B":"银行保函","C":"远期票据贴现","D":"质押贷款"},"answer":["C"],"explanationSupplement":"福费廷通常为金融机构无追索权买入或贴现出口商的远期应收款项，出口商提前获得资金。","optionExplanations":{"A":"保付代理通常称保理，业务结构和服务内容有别","B":"保函是信用支持方式，不是直接买入应收款","C":"符合无追索远期应收款融资的典型实质","D":"质押贷款仍为贷款债权，不是应收款的无追索转让"},"conceptId":"money-instruments"},{"id":"fin-03-q22","number":22,"group":"资本市场","type":"single","stem":"下列债券中，不属于外国债券的是（　　）。","options":{"A":"扬基债券","B":"武士债券","C":"金边债券","D":"猛犬债券"},"answer":["C"],"explanationSupplement":"外国债券看发行人来自境外、发行地为东道国、以东道国货币计价。金边债券一般指高信用政府债，传统上常指英国国债。","optionExplanations":{"A":"境外发行人在美国发行美元债","B":"境外发行人在日本发行日元债","C":"属于政府债券称谓","D":"境外发行人在英国发行英镑债"},"conceptId":"bonds"},{"id":"fin-03-q23","number":23,"group":"资本市场","type":"discussion","stem":"在我国金融市场中，基金托管人是取得基金托管资格的（　　）。","options":{"A":"基金公司","B":"证券公司","C":"信托公司","D":"商业银行"},"answer":[],"explanationSupplement":"《证券投资基金法》第三十二条允许取得资格的商业银行和其他金融机构担任基金托管人。商业银行属于合格机构之一，部分证券公司也可取得资格。","optionExplanations":{"A":"不能单凭基金公司的机构类别判断托管资格","B":"证券公司等其他金融机构可能获准","C":"须有相应托管资格，机构名不足以判定","D":"商业银行可在核准后担任，但无排他性"},"conceptId":"funds"},{"id":"fin-03-q24","number":24,"group":"资本市场","type":"single","stem":"存款性金融机构是指经营各种存款并提供（　　）服务以获取收益的金融机构。","options":{"A":"支付中介","B":"咨询中介","C":"信用中介","D":"信息中介"},"answer":["C"],"explanationSupplement":"吸收存款形成负债、发放贷款形成资产，以自身资产负债表联系资金供需双方，体现信用中介。","optionExplanations":{"A":"结算支付也是功能，但无法概括吸收存款后资金融通","B":"提供咨询并非吸收存款机构的核心特征","C":"资产和负债两端完成信用转换","D":"信息中介并未刻画吸收存款和放贷"},"conceptId":"market-functions"},{"id":"fin-03-q25","number":25,"group":"资本市场","type":"single","stem":"以人民币为面值、以外币为认购和交易币种、在上海和深圳证券交易所上市交易的普通股票（　　）。","options":{"A":"F股","B":"H股","C":"B股","D":"A股"},"answer":["C"],"explanationSupplement":"B 股又称人民币特种股票，以人民币标明面值，在境内证券交易所上市，外币认购和交易。","optionExplanations":{"A":"题干指境内交易所的正式类别","B":"一般指境内注册公司在香港上市的股票","C":"同时符合面值、币种和交易地点","D":"境内 A 股以人民币认购和交易"},"conceptId":"shares"},{"id":"fin-03-q26","number":26,"group":"资本市场","type":"single","stem":"中央银行债券即央行票据，其发行人为（　　）。","options":{"A":"中国银行","B":"银监会","C":"中国人民银行","D":"财政部"},"answer":["C"],"explanationSupplement":"央行票据是中央银行为调节流动性等发行的债务工具。在中国，发行主体为中国人民银行。","optionExplanations":{"A":"属于商业银行","B":"是历史监管机构名称，且不发行央行票据","C":"中国的中央银行","D":"中央政府国债由财政部门办理发行等"},"conceptId":"bonds"},{"id":"fin-03-q27","number":27,"group":"资本市场","type":"single","stem":"熊猫债券指的是在中国发行的（　　）。","options":{"A":"外国债券","B":"欧洲债券","C":"点心债券","D":"扬基债券"},"answer":["A"],"explanationSupplement":"境外机构在中国境内发行人民币债券，常称熊猫债，满足外国债券的三项特征。","optionExplanations":{"A":"发行人在境外、发行地在境内且以人民币计价","B":"欧洲债券的命名看发行地与计价币关系","C":"点心债券通常指在离岸市场发行的人民币债券","D":"扬基债券对应美国和美元"},"conceptId":"bonds"},{"id":"fin-03-q28","number":28,"group":"资本市场","type":"single","stem":"按《贷款通则》采用的期限分类，贷款期限超过1年且不超过5年的贷款属于（　　）。","options":{"A":"短期贷款","B":"中期贷款","C":"长期贷款","D":"特定贷款"},"answer":["B"],"explanationSupplement":"区间以 1 年和 5 年为界：题设中 1 年属于短期，5 年属于中期，超过 5 年为长期。实际贷款还可因产品和监管统计目的采用不同期限口径。","optionExplanations":{"A":"题设短期不超过 1 年","B":"区间 (1, 5] 符合定义","C":"超过 5 年才落入","D":"并非本题期限分类"},"conceptId":"money-instruments"},{"id":"fin-03-q29","number":29,"group":"资本市场","type":"single","stem":"国际债券市场中的外国债券是指（　　）。","options":{"A":"筹资者在国外债券市场发行的以东道国货币为面值的债券","B":"筹资者在国外债券市场发行的以东道国的境外货币为面值的债券","C":"筹资者在本国债券市场发行的以境外货币为面值的债券","D":"筹资者在本国债券市场发行的以外国货币为面值的债券"},"answer":["A"],"explanationSupplement":"外国债券是外来发行人借东道国市场、用东道国货币发行。欧洲债券的计价币种通常不是发行市场所在国货币，发行地也不限于欧洲。","optionExplanations":{"A":"符合发行主体、发行地点和币种关系","B":"计价币不是东道国货币，偏向欧洲债券概念","C":"在筹资者本国发行，不符合","D":"同样不符合境外发行主体条件"},"conceptId":"bonds"},{"id":"fin-03-q30","number":30,"group":"资本市场","type":"discussion","stem":"地方政府债券一般由（　　）代为发行和兑付。","options":{"A":"国务院","B":"中国人民银行","C":"财政部","D":"证监会"},"answer":[],"explanationSupplement":"2009—2010 年财政部曾代为发行并代办还本付息。现行《地方政府债券发行管理办法》第三条规定，地方政府依法自行组织，具体发行兑付由地方财政部门负责。","optionExplanations":{"A":"不符合现行主体","B":"不是普遍代办机关","C":"适用于 2009—2010 年历史安排","D":"不是现行发行和还本付息责任主体"},"conceptId":"bonds"},{"id":"fin-03-q31","number":31,"group":"资本市场","type":"discussion","stem":"对购买者而言，下述哪种金融产品带来的风险最低？（　　）","options":{"A":"30年期抵押贷款","B":"IBM 公司的股票","C":"短期债券","D":"长期债券"},"answer":[],"explanationSupplement":"短久期通常意味着较低利率风险，但总风险还受信用、担保、币种、流动性和集中度影响。低评级短券可能比高评级长券面临更高违约风险。","optionExplanations":{"A":"期限较长，还需看借款人和抵押担保","B":"有权益价格波动，风险不能只凭名称排序","C":"在同等发行人等条件下利率风险通常较低","D":"久期通常较长，信用等其他风险仍需看具体工具"},"conceptId":"tool-properties"},{"id":"fin-03-q32","number":32,"group":"资本市场","type":"single","stem":"下列机构中，（　　）发行的债券不属于金融债券。","options":{"A":"政策性银行","B":"商业银行","C":"保险公司","D":"地方政府"},"answer":["D"],"explanationSupplement":"金融债券由符合规定的金融机构法人发行。地方政府债券是政府债券，按地方政府一般债或专项债等发行和偿债。","optionExplanations":{"A":"政策性银行属于金融机构","B":"商业银行属于金融机构","C":"保险公司可按适用规定发行相关金融债券","D":"地方政府是政府发行人"},"conceptId":"bonds"},{"id":"fin-03-q33","number":33,"group":"资本市场","type":"single","stem":"面值为1000元的美元债券，其市场价值为1200元，这表明市场利率相对于债券票面利率（　　）。","options":{"A":"较高","B":"较低","C":"相等","D":"无法比较"},"answer":["B"],"explanationSupplement":"在固定票息、按面值还本等条件下，价格高于面值为溢价，对应该券到期收益率低于票面利率。题中比较的是该券定价采用的市场收益率。","optionExplanations":{"A":"若市场收益率较高，常见固定票息债券将折价","B":"溢价对应市场收益率低于票面利率","C":"收益率等于票息时标准债券按面值定价","D":"标准定价条件下可以比较"},"conceptId":"bond-value"},{"id":"fin-03-q34","number":34,"group":"资本市场","type":"discussion","stem":"下列关于封闭式基金与开放式基金的区别说法正确的是（　　）。","options":{"A":"开放式基金一般有一个固定的存续期；而封闭式基金一般是无期限的","B":"开放式基金的基金份额是固定的；封闭式基金规模不固定","C":"投资者买卖开放式基金份额，只能委托证券公司在证券交易所按市价买卖，交易在投资者之间完成","D":"封闭式基金的交易价格主要受二级市场供求关系的影响；开放式基金的买卖价格以基金份额净值为基础，不受市场供求关系的影响"},"answer":[],"explanationSupplement":"上市封闭式基金在二级市场按交易价格成交，场外开放式基金按基金净值为基础申购赎回。ETF 属开放式基金，二级市场成交价也受供求影响。","optionExplanations":{"A":"常见归纳方向相反","B":"份额固定与可变的描述方向相反","C":"许多开放式基金可直接按规则申购赎回","D":"按场外申赎与上市封闭式交易比较可成立，不能覆盖 ETF 二级市场"},"conceptId":"funds"},{"id":"fin-03-q35","number":35,"group":"资本市场","type":"single","stem":"优先股票的特征不包括（　　）。","options":{"A":"股息率固定","B":"股息分派优先","C":"剩余资产分配优先","D":"具有优先认股权"},"answer":["D"],"explanationSupplement":"典型优先股可优先分红和分配剩余财产，股息按条款约定，固定或浮动需看具体安排。优先认购新股不是其共同特征。","optionExplanations":{"A":"固定股息为传统模型的典型安排","B":"是常见优先股权利","C":"剩余资产一般先于普通股股东分配","D":"不是优先股的定义特征"},"conceptId":"shares"},{"id":"fin-03-q36","number":36,"group":"资本市场","type":"single","stem":"下列有关债务和股权工具的表述中，哪个是正确的？（　　）","options":{"A":"它们可以是短期金融工具","B":"债券持有者享有投票表决权","C":"债券收入的波动性要小于股权工具","D":"债券支付红利"},"answer":["C"],"explanationSupplement":"固定票息债券按合同付息，本题比较的是收入现金流。股权股息取决于分红安排和经营，价格总收益波动另需分析。","optionExplanations":{"A":"债务可以是短期，普通股一般没有固定到期日","B":"持有普通债券一般不具有股东表决权","C":"符合固定票息债券与股息收入的典型对比","D":"债券支付利息而非股东股利"},"conceptId":"shares"},{"id":"fin-03-q37","number":37,"group":"资本市场","type":"single","stem":"下列不属于影响债券的利率因素的是（　　）。","options":{"A":"筹资者的资信","B":"债券票面金额","C":"债券期限","D":"借贷资金市场利率水平"},"answer":["B"],"explanationSupplement":"票面金额影响“本金 × 利率”算出的利息金额。发行票面利率主要受信用、期限与市场利率等定价因素影响。","optionExplanations":{"A":"资信影响信用利差","B":"面额改变金额，不直接决定约定比率","C":"期限影响收益率曲线与风险","D":"市场利率为发行定价参照"},"conceptId":"bond-value"},{"id":"fin-03-q38","number":38,"group":"资本市场","type":"single","stem":"一般来说，流动性差的债权工具的特点是（　　）。","options":{"A":"风险相对较大、利率相对较高","B":"风险相对较大、利率相对较低","C":"风险相对较小、利率相对较高","D":"风险相对较小、利率相对较低"},"answer":["A"],"explanationSupplement":"对照信用、期限、担保等条件相似的工具，流动性较弱会增加买卖折价和急于变现的风险，投资者一般要求相应收益补偿。","optionExplanations":{"A":"同等条件下通常存在流动性风险溢价","B":"难变现通常需要补偿","C":"把流动性风险方向写反","D":"把风险和补偿的方向都写反"},"conceptId":"tool-properties"},{"id":"fin-03-q39","number":39,"group":"资本市场","type":"single","stem":"一般来说，债券的期限越长，其市场价格变动的可能性就（　　）。","options":{"A":"越大","B":"越小","C":"不变","D":"不确定"},"answer":["A"],"explanationSupplement":"发行人、票息等条件类似时，期限长通常使久期更高，相同的收益率变化会引起更大的价格反应。","optionExplanations":{"A":"符合一般久期规律","B":"通常反向","C":"利率变动下不会普遍不变","D":"在常见比较前提下有可判断倾向"},"conceptId":"bond-value"},{"id":"fin-03-q40","number":40,"group":"资本市场","type":"single","stem":"证券投资基金反映了投资者和基金管理人之间的关系是（　　）。","options":{"A":"债权","B":"所有权","C":"相互制衡关系","D":"委托代理关系"},"answer":["D"],"explanationSupplement":"基金管理人受托为基金份额持有人利益进行投资管理，经济关系可按委托代理理解。基金份额持有人承担净值涨跌。","optionExplanations":{"A":"并非借款合同的债权关系","B":"投资者持有基金份额，管理人承担受托管理职责","C":"职责制衡常体现于管理人和托管人的分工","D":"与受托进行投资运作匹配"},"conceptId":"funds"},{"id":"fin-03-q41","number":41,"group":"资本市场","type":"discussion","stem":"普通股股东享有的权利是（　　）。","options":{"A":"优先清偿权","B":"优先分配权","C":"股息固定","D":"优先认购公司新发股票"},"answer":[],"explanationSupplement":"现行《公司法》第二百二十七条规定，股份有限公司发行新股增加注册资本时，股东原则上无优先认购权，章程或股东会决议可另作安排。","optionExplanations":{"A":"债权人先于股东受偿，普通股没有优先清偿","B":"是某些优先股的条款","C":"普通股股息取决于决议及业绩","D":"可能由章程或决议赋予，不能作为普遍法定权利"},"conceptId":"shares"},{"id":"fin-03-q42","number":42,"group":"资本市场","type":"single","stem":"随着我国金融市场的发展，越来越多的企业通过债券市场来进行直接融资，对于已发行处在交易状态的债券，其市场交易价格与市场利率的关系，以下表述正确的（　　）。","options":{"A":"市场利率下跌，债券交易价格不变","B":"市场利率上升，债券交易价格上升","C":"市场利率下跌，债券交易价格下跌","D":"市场利率上升，债券交易价格下跌"},"answer":["D"],"explanationSupplement":"其他条件不变，固定现金流用较高的收益率折现，现值下降。题目说的是已发行债券的交易价格，合同票息通常不变。","optionExplanations":{"A":"折现率下降通常使价格上升","B":"把价格与收益率方向写反","C":"折现率下降通常使价格上升","D":"与现值计算方向一致"},"conceptId":"bond-value"},{"id":"fin-03-q43","number":43,"group":"资本市场","type":"single","stem":"证券投资基金是一种利益共享风险共担的集合证券投资方式，根据组织形态的不同可分为（　　）。","options":{"A":"开放式投资基金和封闭式投资基金","B":"收入型基金和成长型基金","C":"公司型投资基金和契约型投资基金","D":"国内基金和国际基金"},"answer":["C"],"explanationSupplement":"公司型基金与契约型基金按法律组织形态分类。份额是否允许日常申赎、收益目标、投资地域是其他分类维度。","optionExplanations":{"A":"按运作方式划分","B":"按投资目标划分","C":"按组织形态划分","D":"按地域范围等划分"},"conceptId":"funds"},{"id":"fin-03-q44","number":44,"group":"资本市场","type":"single","stem":"通常情况下，债券价格与市场利率的关系是（　　）。","options":{"A":"反向变动","B":"无关","C":"同向变动","D":"取决于宏观经济形势"},"answer":["A"],"explanationSupplement":"标准债券的未来现金流固定时，收益率上升会压低现值，收益率下降会抬高现值。含权、浮息等债券须结合现金流变化。","optionExplanations":{"A":"固定现金流折现的常见规律","B":"现值依赖折现率","C":"方向相反","D":"宏观形势影响利率等变量，但不能替代常见方向"},"conceptId":"bond-value"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

        <div class="ppf-controls">
          <label class="range-label">约定免赔额 M（元）<output data-role="m-out">1000</output></label>
          <input type="range" data-role="m" min="500" max="3000" step="500" value="1000">
          <label class="range-label">实际损失金额 L（元）<output data-role="l-out">2000</output></label>
          <input type="range" data-role="l" min="0" max="6000" step="200" value="2000">
          <div class="ppf-outputs">
            <div><span>绝对免赔赔付</span><strong data-role="abs-val">1000</strong></div>
            <div><span>相对免赔赔付</span><strong data-role="rel-val">2000</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
        </div>
      </div>`;
    const x = v => X0 + (v / 6000) * W;
    const y = v => Y0 - (v / 6000) * H;
    const mIn = root.querySelector('[data-role="m"]');
    const lIn = root.querySelector('[data-role="l"]');

    function draw() {
      const m = mIn.valueAsNumber, l = lIn.valueAsNumber;
      const absPay = l > m ? l - m : 0;
      const relPay = l > m ? l : 0;
      root.querySelector('[data-role="abs"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(m)} ${y(0)} L${x(6000)} ${y(6000 - m)}`);
      root.querySelector('[data-role="rel"]').setAttribute('d', `M${x(0)} ${y(0)} L${x(m)} ${y(0)} M${x(m)} ${y(m)} L${x(6000)} ${y(6000)}`);
      const xl = x(l).toFixed(1);
      const vl = root.querySelector('[data-role="vline"]');
      vl.setAttribute('x1', xl); vl.setAttribute('x2', xl);
      root.querySelector('[data-role="pt-abs"]').setAttribute('cx', xl);
      root.querySelector('[data-role="pt-abs"]').setAttribute('cy', y(absPay).toFixed(1));
      root.querySelector('[data-role="pt-rel"]').setAttribute('cx', xl);
      root.querySelector('[data-role="pt-rel"]').setAttribute('cy', y(relPay).toFixed(1));
      root.querySelector('[data-role="m-out"]').value = String(m);
      root.querySelector('[data-role="l-out"]').value = String(l);
      root.querySelector('[data-role="abs-val"]').textContent = String(absPay);
      root.querySelector('[data-role="rel-val"]').textContent = String(relPay);
      root.querySelector('[data-role="msg"]').textContent = l <= m
        ? `损失 ${l} 元未超过免赔额 ${m} 元：绝对免赔额与相对免赔额均不赔付（0 元）。`
        : `损失 ${l} 元超过免赔额 ${m} 元：绝对免赔额须先扣除 ${m} 元，仅赔 ${absPay} 元；相对免赔额达到门槛即全额赔付 ${relPay} 元（多赔 ${m} 元）。`;
    }
    mIn.addEventListener('input', draw);
    lIn.addEventListener('input', draw);
    draw();
  }

  function mountLiabilityTimeline(root) {
    root.innerHTML = `
      <div class="inline-visual-header">
        <span class="inline-visual-badge">交互图解</span>
        <h4>责任保险：期内发生式 vs 期内索赔式时间轴判定</h4>
        <p>拖动「事故发生时间」与「提出索赔时间」，秒懂两种承保基础的理赔边界。</p>
      </div>
      <div class="ppf-panel micro-panel">
        <div class="ppf-chart">
          <svg viewBox="0 0 540 230" role="img" aria-label="期内发生式与期内索赔式时间轴对比图">
            <rect x="46" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <rect x="190" y="42" width="160" height="106" class="mv-stage-band" stroke="var(--accent)" stroke-width="1.5"/>
            <rect x="350" y="42" width="144" height="106" fill="var(--surface)" stroke="var(--line)" stroke-dasharray="4 3"/>
            <g class="tick-label" text-anchor="middle">
              <text x="118" y="30">追溯期（2025）</text>
              <text x="270" y="30" fill="var(--accent)" font-weight="650">保单有效期（2026）</text>
              <text x="422" y="30">保单到期后（2027）</text>
              <text x="46" y="170">25.01</text><text x="190" y="170">26.01</text><text x="350" y="170">27.01</text><text x="494" y="170">27.12</text>
            </g>
            <line x1="38" y1="95" x2="504" y2="95" class="chart-axis" stroke-width="1.6"/>
            <line data-role="span" y1="95" y2="95" stroke="var(--accent)" stroke-width="4" opacity=".45"/>
            <circle r="7.5" class="mv-dot-1" data-role="occ-pt" cy="95"/>
            <text class="point-label" data-role="occ-lbl" y="74" text-anchor="middle">事故</text>
            <circle r="7.5" class="mv-dot-2" data-role="clm-pt" cy="95"/>
            <text class="point-label" data-role="clm-lbl" y="128" text-anchor="middle" style="fill:var(--mv-c2)">索赔</text>
          </svg>
        </div>
        <div class="ppf-controls">
          <label class="range-label">事故发生月份（1-12 追溯期，13-24 有效期）<output data-role="occ-out">2026.06</output></label>
          <input type="range" data-role="occ" min="2" max="34" step="1" value="18">
          <label class="range-label">提出索赔月份（须不早于事故）<output data-role="clm-out">2027.04</output></label>
          <input type="range" data-role="clm" min="2" max="36" step="1" value="28">
          <div class="ppf-outputs">
            <div><span>期内发生式</span><strong data-role="occ-res">承保</strong></div>
            <div><span>期内索赔式</span><strong data-role="clm-res">不赔</strong></div>
          </div>
          <div class="ppf-explanation" data-role="msg" aria-live="polite"></div>
          <div class="button-row">
            <button type="button" class="button button-secondary" data-sc="18,28">期内发生+期后索赔</button>
            <button type="button" class="button button-secondary" data-sc="8,19">追溯期发生+期内索赔</button>
          </div>
        </div>
      </div>`;
    const x = m => 46 + ((m - 1) / 35) * 448;
    const mLabel = m => `${2025 + Math.floor((m - 1) / 12)}.${String(((m - 1) % 12) + 1).padStart(2, '0')}`;
    const occIn = root.querySelector('[data-role="occ"]');
    const clmIn = root.querySelector('[data-role="clm"]');

    function draw() {
      let o = occIn.valueAsNumber, c = clmIn.valueAsNumber;
      if (c < o) { c = o; clmIn.value = String(c); }
      const xo = x(o).toFixed(1), xc = x(c).toFixed(1);
      root.querySelector('[data-role="occ-pt"]').setAttribute('cx', xo);
      root.querySelector('[data-role="occ-lbl"]').setAttribute('x', xo);
      root.querySelector('[data-role="clm-pt"]').setAttribute('cx', xc);
      root.querySelector('[data-role="clm-lbl"]').setAttribute('x', xc);
      const span = root.querySelector('[data-role="span"]');
      span.setAttribute('x1', xo); span.setAttribute('x2', xc);
      root.querySelector('[data-role="occ-out"]').value = mLabel(o);
      root.querySelector('[data-role="clm-out"]').value = mLabel(c);
      const occCovered = o >= 13 && o <= 24;
      const clmCovered = o >= 1 && c >= 13 && c <= 24;
      root.querySelector('[data-role="occ-res"]').textContent = occCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="clm-res"]').textContent = clmCovered ? '✓ 承保' : '× 不赔';
      root.querySelector('[data-role="msg"]').textContent =
        `期内发生式只看「事故是否落在 2026 保单期内」（当前${occCovered ? '满足' : '不满足'}）；期内索赔式要求「事故在追溯日后且索赔落在 2026 保单期内」（当前${clmCovered ? '满足' : '不满足'}）。`;
    }
    occIn.addEventListener('input', draw);
    clmIn.addEventListener('input', draw);
    root.querySelectorAll('[data-sc]').forEach(b => b.addEventListener('click', () => {
      const [o, c] = b.dataset.sc.split(',');
      occIn.value = o; clmIn.value = c; draw();
    }));
    draw();
  }

  const registry = {
    'is-lm': mountISLM,
    'ad-as': mountADAS,
    phillips: mountPhillips,
    trilemma: mountTrilemma,
    bond: mountBond,
    multiplier: mountMultiplier,
    deductible: mountDeductible,
    'liability-timeline': mountLiabilityTimeline,
  };

  document.querySelectorAll('[data-micro-visual]').forEach(container => {
    const fn = registry[container.dataset.microVisual];
    if (fn) fn(container);
  });
})();
</script>
</body>
</html>
