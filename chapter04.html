  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

/* Topic map and the interactive production chart */

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter04","number":4,"title":"消费者行为理论","moduleId":"economics","moduleTitle":"经济基础","downloadName":"经济基础-04-消费者行为理论-离线学习.html"},"lessons":{"title":"消费者行为理论","subtitle":"用偏好和预算理解购买选择，再看收入或价格变化如何改变选择。","sections":[{"id":"utility","title":"效用与两种度量方法","summary":"效用表示消费者对商品组合的主观评价。","bodyHtml":"\u003cp>\u003cstrong>效用\u003c/strong>描述消费者从消费中得到的满足程度。消费者可用效用表达对商品组合的偏好，同一物品在不同人或不同场合下可能带来不同效用。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>方法\u003c/th>\u003cth>效用如何表示\u003c/th>\u003cth>常用分析工具\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>基数效用论\u003c/td>\u003ctd>假定效用可用数值直接度量，效用增量可以相加\u003c/td>\u003ctd>总效用和边际效用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>序数效用论\u003c/td>\u003ctd>数值只用来表示偏好顺序\u003c/td>\u003ctd>无差异曲线与预算线\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"基数效用论关注效用大小。序数效用论关注哪个组合更受偏好。","pitfall":"序数效用函数也可以赋予商品组合数字。效用值 20 和 10 可表示排序，不能据此判断满足程度刚好相差一倍。","example":"甲在同一价格下更喜欢茶，乙更喜欢咖啡。两人可以分别给饮品排序，效用表示会随消费者的偏好改变。"},{"id":"marginal-utility","title":"总效用与边际效用","summary":"新增一个单位商品带来的满足程度通常随消费量上升而减少。","bodyHtml":"\u003cp>\u003cstrong>总效用\u003c/strong>是消费一定数量商品所获的效用水平。其他商品消费量不变时，\u003cstrong>边际效用\u003c/strong>是额外增加一单位该商品带来的效用增量。连续情形下，边际效用是总效用对该商品数量的导数。\u003c/p>\u003cp>\u003cmark>边际效用递减规律\u003c/mark>描述在一定时期内，随着同一商品的消费量增加，额外一单位提供的效用趋于下降。增加的边际效用仍为正时，总效用继续增加。若边际效用由正转负，总效用在转折处达到峰值。\u003c/p>\u003cp>货币通过购买商品与服务带来效用。货币的边际效用也可能递减。分析小额支出变化时，可用边际效用近似不变来简化比较。\u003c/p>","keyTakeaway":"比较总效用的增减时看边际效用的正负。比较总效用增长的快慢时看边际效用的大小。","pitfall":"边际效用下降期间，只要边际效用大于零，总效用仍会增加。","example":"三片面包依次带来 12、7、3 单位新增效用。边际效用逐片下降，总效用依次为 12、19、22。"},{"id":"preference","title":"偏好的基本假定","summary":"完整的排序规则使不同商品组合能够比较。","bodyHtml":"\u003cul>\u003cli>\u003cstrong>完全性\u003c/strong>要求任意两个组合都可以比较，允许偏好其中之一或无差异。\u003c/li>\u003cli>\u003cstrong>传递性\u003c/strong>要求比较保持一致。若 A 至少与 B 一样好，且 B 至少与 C 一样好，则 A 至少与 C 一样好。\u003c/li>\u003cli>\u003cstrong>非饱和性\u003c/strong>在通常的两种有益商品模型中表现为多多益善，其他数量不减时，多消费有益商品使组合更受偏好。\u003c/li>\u003c/ul>\u003cp>假定消费者偏好凸时，消费者通常愿意搭配消费，偏好相同的两种极端组合之间的平均组合至少同样好。\u003c/p>","keyTakeaway":"完全性保证可比较，传递性保证比较一致，非饱和性解释为何通常追求更高可达效用。","pitfall":"偏好排序属于特定消费者。改变收入和价格会改变其可选集合，分析时可继续将偏好保持不变。","example":"若某人更喜欢 A 而不是 B，又更喜欢 B 而不是 C，传递性要求他也更喜欢 A 而不是 C。"},{"id":"indifference-curves","title":"无差异曲线与边际替代率","summary":"效用相同的组合连成曲线，斜率反映消费者愿意交换的比例。","bodyHtml":"\u003cp>\u003cstrong>无差异曲线\u003c/strong>连接使同一消费者获得相同效用水平的所有商品组合。不同效用水平的曲线不相交。两种商品都多多益善时，曲线向右下倾斜，位于东北方向的更高曲线代表更高效用。\u003c/p>\u003cp>令 X 为横轴、Y 为纵轴。固定效用，额外获得一单位 X 时，愿放弃的 Y 数量是 X 对 Y 的\u003cstrong>边际替代率\u003c/strong>。在可微且边际效用为正的情形，\u003cmark>MRS = MU\u003csub>X\u003c/sub> / MU\u003csub>Y\u003c/sub>\u003c/mark>，等于无差异曲线斜率的绝对值。\u003c/p>\u003cp>在边际替代率递减的标准情形，X 越多，消费者越少愿用 Y 换取额外的 X，曲线凸向原点。完全替代品的曲线是斜率不变的直线。完全互补品的曲线呈直角。\u003c/p>","keyTakeaway":"同一条曲线上效用相同。曲线斜率的绝对值表示保持效用不变时的边际交换比例。","pitfall":"横纵轴互换后，边际替代率的分子与分母也会互换。比较效用高低应比较曲线位置，避免用两条曲线上任意点到原点的直线距离判断。","example":"若额外 1 杯咖啡恰好能补偿少喝 2 杯茶，当前咖啡对茶的边际替代率约为 2。"},{"id":"budget-line","title":"预算线与消费可行集","summary":"预算线的截距由收入和价格决定，斜率由相对价格决定。","bodyHtml":"\u003cp>以 X 为横轴、Y 为纵轴，收入 \u003cvar>I\u003c/var>、两种商品的正价格分别为 \u003cvar>P\u003csub>X\u003c/sub>\u003c/var>、\u003cvar>P\u003csub>Y\u003c/sub>\u003c/var>。\u003cstrong>预算线\u003c/strong>满足 \u003cmark>P\u003csub>X\u003c/sub>X + P\u003csub>Y\u003c/sub>Y = I\u003c/mark>。线内和线上的非负组合满足支出不超过收入。\u003c/p>\u003cp>横轴截距为 I/P\u003csub>X\u003c/sub>，纵轴截距为 I/P\u003csub>Y\u003c/sub>，斜率为 −P\u003csub>X\u003c/sub>/P\u003csub>Y\u003c/sub>。斜率的绝对值是多买一单位 X 在市场上需要放弃的 Y 数量。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>变化\u003c/th>\u003cth>图形变化\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>价格不变、收入增加\u003c/td>\u003ctd>平行外移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>只有 X 降价\u003c/td>\u003ctd>绕纵轴截距旋转，横轴截距增大\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收入不变、两种价格同比例上升\u003c/td>\u003ctd>平行内移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收入和两种价格均乘以同一正数\u003c/td>\u003ctd>截距与斜率保持不变\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"先算两轴截距，再看相对价格有没有变化。相对价格不变时，预算线斜率不变。","pitfall":"两种价格同向变动也可能改变价格比。需要确认它们是否同比例变化，才能判断预算线是否平移。","example":"收入 60 元，X 每单位 6 元，Y 每单位 3 元。截距分别为 10 和 20，斜率为 −2。若只有 X 降到 4 元，横轴截距变为 15，纵轴截距仍是 20。"},{"id":"consumer-equilibrium","title":"消费者均衡","summary":"在预算约束下，找到可达的最高效用。","bodyHtml":"\u003cp>\u003cstrong>消费者均衡\u003c/strong>是在给定偏好、收入和价格下选择效用最高的可行组合。对通常的光滑凸偏好，当两种商品的最优购买量均为正时，预算线与最高可达的无差异曲线相切。\u003c/p>\u003cp>内点切点条件为 \u003cmark>MU\u003csub>X\u003c/sub>/MU\u003csub>Y\u003c/sub> = P\u003csub>X\u003c/sub>/P\u003csub>Y\u003c/sub>\u003c/mark>，等价于 \u003cmark>MU\u003csub>X\u003c/sub>/P\u003csub>X\u003c/sub> = MU\u003csub>Y\u003c/sub>/P\u003csub>Y\u003c/sub>\u003c/mark>。右边的形式比较将一元钱分别花在两种商品上的边际效用。某种商品每元边际效用更高时，从另一种商品转移少量支出可改善效用，直至达到均衡或碰到边界。\u003c/p>\u003cp>检查两种商品是否都购买、偏好是否可微、预算是否用完。角点和拐点也可能是最优组合，应按偏好与可行集判断。\u003c/p>","keyTakeaway":"有内点时，主观交换比等于市场交换比，同时组合满足预算约束。","pitfall":"边际效用的高低需要结合商品价格。比较每元边际效用可以避免遗漏预算约束。","example":"X 每元带来 2 单位边际效用，Y 每元带来 3 单位边际效用，两者均有购买。把部分支出从 X 转到 Y 有助于提高效用。"},{"id":"consumer-paths","title":"价格—消费曲线、收入—消费曲线与恩格尔曲线","summary":"改变一个条件，跟踪每次最优选择，再换一组坐标。","bodyHtml":"\u003ctable>\u003cthead>\u003ctr>\u003cth>曲线\u003c/th>\u003cth>变动的条件\u003c/th>\u003cth>坐标和用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>价格—消费曲线\u003c/td>\u003ctd>一种商品的价格，收入、偏好和另一种价格固定\u003c/td>\u003ctd>在 X、Y 数量图上连接最优点。取变化的价格与其最优购买量，得到该商品的个人需求曲线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收入—消费曲线\u003c/td>\u003ctd>收入，价格与偏好固定\u003c/td>\u003ctd>在 X、Y 数量图上连接最优点。两种商品均为正常品时，曲线向右上方延伸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>恩格尔曲线\u003c/td>\u003ctd>收入，价格与偏好固定\u003c/td>\u003ctd>把收入与一种商品的最优购买量对应起来。正常品收入与数量同向，低档品反向\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","keyTakeaway":"价格—消费曲线通向个人需求曲线。收入—消费曲线通向恩格尔曲线。","pitfall":"收入—消费曲线的两根轴都是商品数量。两种商品中有一种是低档品时，收入上升可能使其购买量下降，曲线因而向该商品数量减少的方向弯折。","example":"收入从 100 增加到 120 元，价格不变，米的购买量从 5 增加到 6 千克。收入和米购买量的两对数值可作为恩格尔曲线上的点。"},{"id":"consumer-effects","title":"替代效应与收入效应","summary":"把本品降价对需求量的影响分解为相对价格和购买力的作用。","bodyHtml":"\u003cp>\u003cstrong>替代效应\u003c/strong>表示在对购买力变化作补偿后，相对价格变化造成的需求量变动。X 降价，消费者倾向于用相对便宜的 X 替代 Y。\u003cstrong>收入效应\u003c/strong>表示名义收入不变时，价格变动使实际购买力变化并影响购买选择。两者相加得到需求量的总变化。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>X 降价时\u003c/th>\u003cth>替代效应\u003c/th>\u003cth>收入效应\u003c/th>\u003cth>总效果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正常品，包括通常的必需品与高档品\u003c/td>\u003ctd>X 需求量增加或不变\u003c/td>\u003ctd>增加\u003c/td>\u003ctd>需求量增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般低档品\u003c/td>\u003ctd>增加\u003c/td>\u003ctd>减少，幅度较小\u003c/td>\u003ctd>需求量增加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>吉芬品\u003c/td>\u003ctd>增加\u003c/td>\u003ctd>减少，幅度较大\u003c/td>\u003ctd>需求量减少\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>在通常的局部非饱和模型中，一种商品降价且其他条件不变，原消费组合仍然可负担，预算机会扩大。新最优效用至少与原来一样高。\u003c/p>","keyTakeaway":"低档品的两个效应反向。只有收入效应压过替代效应，才会出现吉芬情形。","pitfall":"仅凭低档品或正常品的标签，无法比较两种商品需求曲线斜率的大小。","example":"某低档品降价后，替代效应使需求量增加 6 单位，收入效应使需求量减少 2 单位，净增 4 单位，需求量仍与价格反向。"},{"id":"consumer-surplus","title":"消费者剩余","summary":"每单位最高愿付价与实际支付价的差额可加总。","bodyHtml":"\u003cp>\u003cstrong>消费者剩余\u003c/strong>是购买一定数量时的总支付意愿减去实际支出。若每单位按同一市场价格成交，图上可用\u003cstrong>需求曲线下方、价格线以上\u003c/strong>且截至成交量的面积表示。\u003c/p>\u003cp>分单位报价时，按单位逐项求差。连续线性需求且需求曲线与成交价线相交时，可用三角形面积，即成交量乘以最高愿付价与市场价格的差，再除以二。\u003c/p>","keyTakeaway":"消费者剩余衡量交易为买方带来的净收益，单位与价格和支出相同。","pitfall":"消费者购买多件商品时，前几单位的最高愿付价可能更高。应加总各单位的愿付价格。","example":"买方对两本书分别最多愿付 40 元和 25 元，均以 20 元买下。消费者剩余为 (40 − 20) + (25 − 20) = 25 元。"}],"mindmap":[{"label":"效用论概述","target":"utility","children":[{"label":"效用的概念与度量","target":"utility","children":[{"label":"效用表示消费者的主观满足程度","target":"utility"},{"label":"基数效用论假定效用可直接度量","target":"utility"},{"label":"序数效用论用等级表示偏好顺序","target":"utility"}]},{"label":"边际效用递减规律","target":"marginal-utility","children":[{"label":"其他商品消费量不变，额外消费带来的效用增量通常递减","target":"marginal-utility"}]},{"label":"货币的边际效用也可能递减","target":"marginal-utility"},{"label":"偏好的基本假定","target":"preference","children":[{"label":"完全性","target":"preference"},{"label":"传递性","target":"preference"},{"label":"非饱和性","target":"preference"}]},{"label":"无差异曲线的特征","target":"indifference-curves","children":[{"label":"同一曲线上偏好相同","target":"indifference-curves"},{"label":"不同效用水平的曲线不相交","target":"indifference-curves"},{"label":"在两种商品均多多益善时，东北方向的曲线效用更高","target":"indifference-curves"},{"label":"常见情形下斜率为负，凸向原点","target":"indifference-curves"}]},{"label":"边际替代率递减","target":"indifference-curves","children":[{"label":"保持效用不变，已有的 X 越多，每单位新增 X 可替代的 Y 越少","target":"indifference-curves"}]},{"label":"影响预算线变动的因素","target":"budget-line","children":[{"label":"收入变动时，预算线平移","target":"budget-line"},{"label":"一种商品价格变动时，预算线旋转","target":"budget-line"},{"label":"两种商品价格同比例变化时，预算线平移","target":"budget-line"},{"label":"两种价格与收入同倍数变化时，预算线不变","target":"budget-line"}]}]},{"label":"消费者均衡","target":"consumer-equilibrium","children":[{"label":"消费者均衡条件","target":"consumer-equilibrium","children":[{"label":"两种商品的边际效用比等于价格比","target":"consumer-equilibrium"},{"label":"光滑凸偏好的内点最优处，边际替代率等于价格比","target":"consumer-equilibrium"}]},{"label":"价格—消费曲线","target":"consumer-paths","children":[{"label":"收入及偏好不变，改变单种商品价格并连接最优点","target":"consumer-paths"},{"label":"由价格—消费曲线可推导个人需求曲线","target":"consumer-paths"}]},{"label":"收入—消费曲线","target":"consumer-paths","children":[{"label":"两种商品均为正常品时，收入增加使曲线向右上方延伸","target":"consumer-paths"},{"label":"若一种是低档品，可能向该商品数量减少的方向弯折","target":"consumer-paths"},{"label":"由收入—消费曲线可推导恩格尔曲线","target":"consumer-paths"}]},{"label":"恩格尔曲线","target":"consumer-paths","children":[{"label":"正常品的收入和需求量同向，低档品反向","target":"consumer-paths"}]},{"label":"替代效应与收入效应","target":"consumer-effects","children":[{"label":"替代效应来自相对价格变化","target":"consumer-effects"},{"label":"收入效应来自实际购买力变化","target":"consumer-effects"},{"label":"正常品的两种效应均与本品价格反向","target":"consumer-effects"},{"label":"低档品的两种效应反向，吉芬品的收入效应占优","target":"consumer-effects"}]},{"label":"消费者剩余","target":"consumer-surplus","children":[{"label":"总支付意愿减实际支出","target":"consumer-surplus"},{"label":"需求曲线下方、价格线上方的面积","target":"consumer-surplus"}]}]}]},"questions":[{"id":"eco-04-q01","number":1,"group":"效用论概述","type":"single","stem":"当消费者对商品 X 的消费达到总效用最大时，则边际效用 MUx 为（　）。","options":{"A":"正值","B":"负值","C":"零","D":"不确定"},"answer":["C"],"explanationSupplement":"在总效用曲线光滑的内点最大值处，切线水平，边际效用 MUx=dTU/dX=0。","optionExplanations":{"A":"正的边际效用表示再增加少量 X 能提高总效用。","B":"负的边际效用表示再增加少量 X 会降低总效用。","C":"光滑内点的极大值具有零斜率。","D":"本题用可微总效用曲线的内点极大值模型。"},"conceptId":"marginal-utility"},{"id":"eco-04-q02","number":2,"group":"效用论概述","type":"single","stem":"在消费者行为理论中，能够描述消费者偏好的曲线是（　）。","options":{"A":"无差异曲线","B":"需求曲线","C":"预算约束线","D":"消费者均衡曲线"},"answer":["A"],"explanationSupplement":"无差异曲线上的每个商品组合给消费者带来相同的满足程度。整组无差异曲线用来表示消费组合之间的偏好排序。","optionExplanations":{"A":"它直接体现消费者对各个消费组合的偏好。","B":"它描述某商品价格与需求量之间的对应关系。","C":"它表示价格和收入给定时消费者能买到的商品组合边界。","D":"均衡点随外部条件变化可形成不同轨迹，偏好本身由无差异曲线表示。"},"conceptId":"indifference-curves"},{"id":"eco-04-q03","number":3,"group":"效用论概述","type":"single","stem":"认为可以用绝对数值的大小表示效用大小的理论是（　）。","options":{"A":"序数效用论","B":"总效用论","C":"边际效用论","D":"基数效用论"},"answer":["D"],"explanationSupplement":"基数效用论将效用视作可以用具体数值度量的满足程度。序数效用论只保留消费组合的偏好排序。","optionExplanations":{"A":"序数效用使用排序。","B":"总效用描述消费带来的全部满足程度。","C":"边际效用描述增加一单位消费带来的效用增量。","D":"基数效用论允许对效用数值进行度量和加总。"},"conceptId":"utility"},{"id":"eco-04-q04","number":4,"group":"效用论概述","type":"single","stem":"在分析消费者行为时，无差异曲线的形状是由（　）决定的。","options":{"A":"消费者收入","B":"所购买商品的价格","C":"相关商品的价格","D":"消费者偏好"},"answer":["D"],"explanationSupplement":"曲线的斜率体现维持相同效用时愿意用多少 Y 换取一单位 X。愿意替代的程度由偏好决定。","optionExplanations":{"A":"收入影响购买组合的可行范围。","B":"商品价格影响预算线的斜率和截距。","C":"相关品价格会影响预算与需求行为，题设所画的偏好曲线由偏好决定。","D":"偏好决定哪些组合具有相同的效用，也决定曲线的形状。"},"conceptId":"indifference-curves"},{"id":"eco-04-q05","number":5,"group":"效用论概述","type":"single","stem":"基数效用论和序数效用论的主要区别是（　）。","options":{"A":"效用是否客观","B":"效用是否可以加总","C":"效用函数是否是线性的","D":"边际效用是否是递减的"},"answer":["B"],"explanationSupplement":"基数效用保留效用量及其差值的意义。序数效用只用数值标记排序，在保持排序的变换后仍表示同一偏好。","optionExplanations":{"A":"两种方法都用于表示消费者的主观满足程度。","B":"可以度量与加总是基数效用论的处理方式。","C":"是否线性取决于模型与效用函数。","D":"边际效用递减是额外假设，区别在于效用的度量尺度。"},"conceptId":"utility"},{"id":"eco-04-q06","number":6,"group":"效用论概述","type":"single","stem":"基数效用理论运用（　）来分析消费者行为。","options":{"A":"成本曲线","B":"预算约束线","C":"无差异曲线","D":"边际效用论"},"answer":["D"],"explanationSupplement":"当效用增量可度量时，可用多购买一单位商品带来的边际效用分析消费选择，并比较每单位货币对应的边际效用。","optionExplanations":{"A":"成本曲线主要用于分析厂商成本。","B":"预算约束描述可行组合，可和两种效用框架配合使用。","C":"无差异曲线是序数效用分析的典型工具。","D":"边际效用分析使用效用增量的度量。"},"conceptId":"marginal-utility"},{"id":"eco-04-q07","number":7,"group":"效用论概述","type":"single","stem":"当商品消费量达到一定程度后，总效用达到最大值时，边际效用（　）。","options":{"A":"为零","B":"达到最大","C":"达到最小","D":"变为负值"},"answer":["A"],"explanationSupplement":"边际效用衡量总效用曲线的斜率。可微的内点最大值处斜率为零，若继续消费且边际效用为负，总效用会下降。","optionExplanations":{"A":"总效用最大值对应光滑曲线的水平切线。","B":"边际效用最大代表总效用增长最快。","C":"边际效用达到最小描述的是斜率的最低值。","D":"负边际效用表示继续增加消费会降低总效用。"},"conceptId":"marginal-utility"},{"id":"eco-04-q08","number":8,"group":"效用论概述","type":"single","stem":"关于无差异曲线的说法，错误的是（　）。","options":{"A":"消费者对于同一无差异曲线上各个点的偏好程度是无差异的","B":"任意两条无差异曲线都可能相交","C":"离原点越远的无差异曲线，消费者的偏好程度越高","D":"无差异曲线从左向右下方倾斜，凸向原点"},"answer":["B"],"explanationSupplement":"若两条不同效用水平的曲线相交，交点就必须同时属于两个不同的效用等级。这与偏好的传递性矛盾。","optionExplanations":{"A":"同一条无差异曲线表示相同效用。","B":"不同无差异曲线不能相交，这是题目要选的错误说法。","C":"两种商品都越多越好时，东北方向的曲线对应较高的效用。","D":"通常的单调偏好和递减边际替代率得到这种形状。"},"conceptId":"indifference-curves"},{"id":"eco-04-q09","number":9,"group":"效用论概述","type":"single","stem":"在相对价格不变的情况下，如果消费者的收入减少，会使预算线（　）。","options":{"A":"向右平移","B":"向左平移","C":"向上旋转","D":"向下旋转"},"answer":["B"],"explanationSupplement":"按通常题设，价格保持原水平。预算线斜率 −Px/Py 固定，收入 I 减少使两个截距 I/Px、I/Py 同时缩小，预算线向原点平移。","optionExplanations":{"A":"向外平移对应实际购买力增加。","B":"向左平移即向原点收缩。","C":"旋转需要相对价格改变。","D":"相对价格保持不变时斜率固定。"},"conceptId":"budget-line"},{"id":"eco-04-q10","number":10,"group":"效用论概述","type":"single","stem":"对预算线的斜率说法错误的是（　）。","options":{"A":"预算线斜率是两种商品价格比率的负值","B":"预算线斜率是两种商品价格的负比率","C":"预算线斜率是两种商品需求量比率的负值","D":"预算线斜率的大小表明在不改变总支出总量的前提下，两种商品可以相互替代的比率"},"answer":["C"],"explanationSupplement":"把 PxX+PyY=I 改写成 Y=I/Py−(Px/Py)X，斜率为 −Px/Py。预算线上的不同点可有不同的数量比。","optionExplanations":{"A":"将横轴商品价格除以纵轴商品价格并取负，得到预算线斜率。","B":"此项同 A，是相对价格比率的另一种表达。","C":"预算线斜率由相对价格确定，因此本项错误。","D":"以一单位 X 的价格可买 Px/Py 单位 Y，体现保持支出不变时的市场交换比率。"},"conceptId":"budget-line"},{"id":"eco-04-q11","number":11,"group":"效用论概述","type":"single","stem":"预算线的斜率取决于（　）。","options":{"A":"商品的价格","B":"消费者收入大小","C":"消费者偏好变化","D":"无差异曲线的走势"},"answer":["A"],"explanationSupplement":"预算线斜率是 −Px/Py。收入变化改变截距，偏好变化影响消费者愿意如何选择组合。","optionExplanations":{"A":"两种商品的相对价格决定预算线斜率。","B":"收入决定预算线的截距。","C":"偏好决定无差异曲线。","D":"无差异曲线的斜率描述消费者愿意替代的比率。"},"conceptId":"budget-line"},{"id":"eco-04-q12","number":12,"group":"效用论概述","type":"single","stem":"以下（　）项指的是边际效用。","options":{"A":"张某吃了第二个面包，满足程度从 10 个效用单位增加到了 15 个单位，增加了 5 个效用单位","B":"张某吃了两个面包，共获得满足 15 个效用单位","C":"张某吃了四个面包后再不想吃了","D":"张某吃了两个面包，平均每个面包带给张某的满足程度为 7.5 个效用单位"},"answer":["A"],"explanationSupplement":"从一个面包吃到两个面包，总效用从 10 升为 15，增加的 5 单位就是第二个面包的边际效用。","optionExplanations":{"A":"该项明确指出新增一个面包带来的效用增量。","B":"15 是两个面包的总效用。","C":"停止吃面包描述了选择行为，未给出新增单位带来的效用。","D":"7.5 是总效用除以数量得到的平均效用。"},"conceptId":"marginal-utility"},{"id":"eco-04-q13","number":13,"group":"效用论概述","type":"single","stem":"同一条无差异曲线上的不同点表示（　）。","options":{"A":"效用水平不同，所消费的两种商品组合比例相同","B":"效用水平相同，所消费的两种商品组合比例不同","C":"效用水平不同，所消费的两种商品组合比例却相同","D":"效用水平相同，所消费的两种商品组合比例也相同"},"answer":["B"],"explanationSupplement":"在两种商品都更受偏好的常规模型下，同一条无差异曲线上的不同点具有相同效用。沿曲线增加一种商品，就需要减少另一种商品。","optionExplanations":{"A":"曲线上的效用水平相同。","B":"两种商品的组合随点的位置而变，总效用保持相同。","C":"不同效用对应不同的无差异曲线。","D":"同一条通常向右下倾斜的曲线上的不同点具有不同的消费比例。"},"conceptId":"indifference-curves"},{"id":"eco-04-q14","number":14,"group":"效用论概述","type":"single","stem":"某消费者偏好 X 商品甚于 Y 商品，是因为（　）。","options":{"A":"商品 X 的效用大","B":"商品 X 价格低","C":"商品 X 稀缺","D":"商品 X 是满足精神需要的"},"answer":["A"],"explanationSupplement":"在消费者的偏好排序中，较偏好的选择具有较高的效用。价格影响能买到哪些组合，偏好决定想选哪个组合。","optionExplanations":{"A":"该项与 X 在偏好排序中位于 Y 之前一致。","B":"价格低可能提高购买意愿或可负担性，无法直接推出偏好排序。","C":"稀缺描述商品数量或获得条件。","D":"效用来自消费者重视的各种需要，题目未说明需要的类型。"},"conceptId":"preference"},{"id":"eco-04-q15","number":15,"group":"效用论概述","type":"single","stem":"预算线反映了（　）。","options":{"A":"消费者的收入约束","B":"消费者的偏好","C":"消费者人数","D":"货币的购买力"},"answer":["A"],"explanationSupplement":"预算线写作 PxX+PyY=I，表示刚好用完可支配预算的组合。线上与线内合起来是可负担范围。","optionExplanations":{"A":"给定价格时，收入限制了能买到的组合。","B":"偏好通过无差异曲线表达。","C":"预算线分析一个消费者的约束。","D":"购买力会影响可负担范围，预算线的定义是给定收入和价格下的约束边界。"},"conceptId":"budget-line"},{"id":"eco-04-q16","number":16,"group":"效用论概述","type":"single","stem":"下列哪项不是无差异曲线特征？（　）。","options":{"A":"离原点越远的无差异曲线的效用水平越低","B":"无差异曲线向右下方倾斜","C":"无差异曲线凸向原点","D":"任意两条无差异曲线不能相交"},"answer":["A"],"explanationSupplement":"题目要求找出错误特征。两种商品都越多越好时，东北方向的无差异曲线对应更高的效用水平。","optionExplanations":{"A":"该项把通常的效用排序方向说反。","B":"增加一种商品并相应减少另一种，可以保持效用水平。","C":"边际替代率递减时会形成凸向原点的曲线。","D":"不同效用水平的曲线不能交于同一个组合。"},"conceptId":"indifference-curves"},{"id":"eco-04-q17","number":17,"group":"效用论概述","type":"discussion","stem":"当总效用增加时，边际效用应该（　）。","options":{"A":"为正值，且不断增加","B":"为正值，但不断减少","C":"为负值，且不断减少","D":"为正值，可能增加也可能减少"},"answer":[],"explanationSupplement":"只知道总效用正在增加，可判断相应单位的边际效用为正。边际效用的走势需要另给条件。若加上边际效用递减假设，B 成立；仅按题干给出的信息，D 表述更充分。","optionExplanations":{"A":"边际效用为正能解释总效用增加，是否递增还需条件。","B":"再加上边际效用递减假设，该项成立。","C":"负的边际效用会使总效用下降。","D":"仅根据总效用增加这一条件，边际效用仍可有不同走势。"},"conceptId":"marginal-utility"},{"id":"eco-04-q18","number":18,"group":"效用论概述","type":"single","stem":"无差异曲线为斜率不变的直线时，表示相结合的两种商品是（　）。","options":{"A":"可以替代的","B":"完全替代的","C":"互补的","D":"互不相关的"},"answer":["B"],"explanationSupplement":"在本题的通常模型中，斜率为恒定的负数意味着消费者在所有组合上都愿意按同一比率交换两种商品。完全替代是对此类偏好的专称。","optionExplanations":{"A":"一般的可替代还包括边际替代率随组合而改变的情形。","B":"固定边际替代率对应完全替代品。","C":"典型的完全互补品形成直角无差异曲线。","D":"固定替代比率本身表明两种商品的偏好存在明确的替代关系。"},"conceptId":"indifference-curves"},{"id":"eco-04-q19","number":19,"group":"效用论概述","type":"single","stem":"消费者的预算线反映了（　）。","options":{"A":"消费者的收入约束","B":"消费者的需求趋势","C":"消费者的支出计划","D":"消费者获得的总效用"},"answer":["A"],"explanationSupplement":"沿预算线移动时购买组合不同，但总花费都等于收入 I。线外的组合超过给定收入。","optionExplanations":{"A":"预算线反映给定价格条件下的收入约束。","B":"需求趋势对应价格等条件变化时的购买量。","C":"预算线列出可负担的边界组合，实际计划还需结合偏好。","D":"总效用取决于实际选择的消费组合。"},"conceptId":"budget-line"},{"id":"eco-04-q20","number":20,"group":"消费者均衡","type":"single","stem":"预算线和无差异曲线（　）时的商品组合，能够满足消费者的效用最大化。","options":{"A":"重合","B":"相交","C":"相切","D":"相离"},"answer":["C"],"explanationSupplement":"在平滑、凸偏好且最优组合包含两种商品的通常模型中，预算线与能达到的最高无差异曲线相切。边际替代率等于相对价格。角点选择需要直接比较可行效用。","optionExplanations":{"A":"整段重合可能出现在完全替代等特殊情况下。","B":"一般的穿越交点附近仍可找到更高效用的可行组合。","C":"内点最优时，两条曲线在可达最高效用处相切。","D":"两条线相离表示该无差异曲线与预算线没有共同的消费组合。"},"conceptId":"consumer-equilibrium"},{"id":"eco-04-q21","number":21,"group":"消费者均衡","type":"single","stem":"若消费者张某只准备买两种商品 X 和 Y，X 的价格为 10，Y 的价格为 2。若张某买了 7 个单位 X 和 3 个单位 Y，所获得的边际效用值分别为 30 个单位和 20 个单位，则（　）。","options":{"A":"张某获得了最大效用","B":"张某应当增加 X 的购买，减少 Y 的购买","C":"张某应当增加 Y 的购买，减少 X 的购买","D":"张某想要获得最大效用，需要借钱"},"answer":["C"],"explanationSupplement":"每元购买 X 的边际效用为 30÷10=3，每元购买 Y 的边际效用为 20÷2=10。在当前组合附近，把少量支出从 X 转向 Y 可以提高总效用。","optionExplanations":{"A":"两种商品的每元边际效用不同，当前组合有改进空间。","B":"将资金从 Y 转到 X 会从边际效用较高的用途转向较低的用途。","C":"将资金从 X 转到 Y 可增加总效用。","D":"在既定预算内重新分配支出即可改进选择。"},"conceptId":"consumer-equilibrium"},{"id":"eco-04-q22","number":22,"group":"消费者均衡","type":"single","stem":"消费者剩余是（　）。","options":{"A":"消费者购买能力超出实际购买额的差额","B":"消费者得到的总效用","C":"消费者购买某一商品时愿意支付的总价格和实际支付的总价格之间的差额","D":"支出的货币的总效用"},"answer":["C"],"explanationSupplement":"如果一个消费者愿意为某件商品最多支付 20 元，实际按 15 元买到，那么该笔购买的消费者剩余是 5 元。购买多件时可加总各单位的剩余。","optionExplanations":{"A":"购买能力与实际购买额之差是剩余预算的概念。","B":"消费者剩余以货币差额表示。","C":"给出了消费者剩余的定义。","D":"货币本身的效用和最高支付意愿与实际支出的差额属于不同概念。"},"conceptId":"consumer-surplus"},{"id":"eco-04-q23","number":23,"group":"消费者均衡","type":"discussion","stem":"随着收入和价格的变化，消费者的均衡也发生变化。假如在新均衡下，各种商品的边际效用均低于原均衡状态的边际效用，这意味着（　）。","options":{"A":"消费者生活状况有了改善","B":"消费者生活状况恶化了","C":"消费者生活状况没有变化","D":"不确定"},"answer":[],"explanationSupplement":"比较福利要看两组消费组合的总效用或偏好排序。若两种商品的边际效用分别只取决于各自消费量、均为正且严格递减，边际效用同时下降可推出两种消费量增加，支持 A。在一般偏好中，某种商品的边际效用也可能受另一种商品消费量影响，因此题设不足以判断福利变化。","optionExplanations":{"A":"在边际效用各自只受本商品消费量影响等附加条件下可成立。","B":"边际效用下降本身无法推出总效用下降。","C":"总效用相同需要两组组合属于同一无差异曲线。","D":"没有给定效用函数或偏好排序时，一般情形下无法判断。"},"conceptId":"consumer-equilibrium"},{"id":"eco-04-q24","number":24,"group":"消费者均衡","type":"single","stem":"消费者均衡的实现条件是（　）。","options":{"A":"偏好不变、收入不变、价格不变","B":"效用不变、价格不变、偏好不变","C":"价格不变、价值不变、效用不变","D":"时间不变、收入不变、需求不变"},"answer":["A"],"explanationSupplement":"题目考查求均衡时给定的条件。消费者在给定偏好、收入与价格下，选择可负担的最高效用组合。内点解的最优条件还需满足预算约束和边际替代率等于相对价格。","optionExplanations":{"A":"包含偏好和构成预算约束的收入、价格。","B":"没有给定可用收入，无法确定预算线。","C":"没有给出偏好和收入，效用应由最优选择得到。","D":"需求量是消费者选择的结果，商品价格和偏好需要给定。"},"conceptId":"consumer-equilibrium"},{"id":"eco-04-q25","number":25,"group":"消费者均衡","type":"single","stem":"恩格尔曲线表示消费者在每一（　）水平对某商品的需求量。","options":{"A":"价格","B":"收入","C":"效用","D":"偏好"},"answer":["B"],"explanationSupplement":"固定偏好和各商品价格，依次改变收入并求出每一收入下的最优需求量。以收入与某一种商品的数量作图，即得恩格尔曲线。","optionExplanations":{"A":"价格与需求量的对应关系通常用需求曲线表示。","B":"恩格尔曲线以收入作为影响需求量的变量。","C":"效用等级由消费组合和偏好决定。","D":"推导恩格尔曲线时，消费者偏好保持给定。"},"conceptId":"consumer-paths"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;
        }
        const label = el('label', 'quiz-option');
        const input = el('input'); input.type = q.type === 'multiple' ? 'checkbox' : 'radio'; input.name = 'quiz-answer'; input.value = key;
        input.checked = selected.includes(key); input.disabled = show; input.dataset.qid = q.id;
        if (show && q.answer.includes(key)) label.classList.add('correct');
        if (show && selected.includes(key) && !q.answer.includes(key)) label.classList.add('wrong');
        label.append(input, el('span', '', `${key}. ${text}`)); field.append(label);
      }); card.append(field);
      if (mode === 'wrong' && s.answers[q.id] && s.answers[q.id].correct) card.append(el('p', 'quiz-status quiz-correct', '最近一次已答对 · 已掌握，历史错题仍保留'));
      const actions = el('div', 'quiz-actions');
      const nav = el('div', 'quiz-nav');
      const questionIndex = list.findIndex((item) => item.id === q.id);
      const prev = button('上一题', 'previous'); prev.disabled = questionIndex <= 0;
      const next = button('下一题', 'next'); next.disabled = questionIndex >= list.length - 1;
      nav.append(prev, next); actions.append(nav);
      if (discussion) {
        const open = openDiscussions.has(q.id);
        const toggle = button(open ? '收起讨论解析' : '查看讨论解析', 'discussion', 'button button-primary');
        toggle.setAttribute('aria-expanded', String(open));
        actions.append(toggle);
      } else if (mode !== 'test') {
        const submit = button(show ? '重新作答' : '提交答案', show ? 'retry' : 'submit', 'button button-primary');
        submit.disabled = !show && !selected.length; actions.append(submit);
      } else if (!s.test.submitted) actions.append(el('span', 'muted', '本章测试交卷后统一显示解析'));
      card.append(actions);
      const status = el('p', 'quiz-status', statusText); status.setAttribute('role', 'status'); status.setAttribute('aria-live', 'polite'); card.append(status);
      if (show || openDiscussions.has(q.id)) renderExplanation(card, q, selected);
      root.append(card);
      if (mode === 'test' && !s.test.submitted) {
        const foot = el('div', 'quiz-actions');
        foot.append(el('p', 'muted', '未答题交卷后记为未作答，不加入错题本。'), button('交卷并查看解析', 'finish-test', 'button button-primary'));
        root.append(foot);
      }
    }
    function renderTestSummary(s) {
      const summary = testSummary(questions, s.test.drafts);
      const box = el('div', 'quiz-summary');
      if (s.test.submitted) {
        box.setAttribute('role', 'status');
        box.append(el('strong', '', `${summary.correct} / ${summary.total}`), el('span', '', `  答对 · 答错 ${summary.wrong} 道 · 未答 ${summary.unanswered} 道`));
        box.append(el('p', '', `正确率 ${summary.total ? Math.round(summary.correct / summary.total * 100) : 0}% · 点击题号查看各题解析。`), button('重新测试', 'restart-test'));
      } else box.append(el('span', '', `已选择 ${summary.answered} / ${summary.total} 题 · 测试中不显示答案，随时可切换题号。`));
      root.append(box);
    }
    function renderExplanation(card, q, selected) {
      const feedback = el('div', 'quiz-feedback quiz-explanation');
      if (q.type === 'discussion') {
        feedback.append(el('h3', '', '讨论解析'));
      } else {
        const correct = grade(q, selected);
        feedback.append(el('h3', correct ? 'quiz-correct' : 'quiz-incorrect', !selected.length ? '本题未作答' : correct ? '回答正确' : '回答错误'));
        const selectionText = selected.length ? `你选择了 ${selected.join('、')}。` : '你未作答。';
        feedback.append(el('p', '', `${selectionText}正确答案是 ${q.answer.join('、')}。`));
      }
      if (q.type === 'multiple' && selected.length && !grade(q, selected)) {
        const missing = q.answer.filter((key) => !selected.includes(key)); const extra = selected.filter((key) => !q.answer.includes(key));
        const details = [];
        if (missing.length) details.push(`漏选了 ${missing.join('、')}。`);
        if (extra.length) details.push(`错选了 ${extra.join('、')}。`);

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  renderLessons();
  $('#lesson-search')?.addEventListener('input', event => {
   lessonQuery = event.target.value;
   applyLessonFilter();
  });
  $$('[data-lesson-filter]').forEach(btn => {
   btn.addEventListener('click', () => {
    lessonFilter = btn.dataset.lessonFilter;
    $$('[data-lesson-filter]').forEach(node => {
     const active = node === btn;
     node.classList.toggle('active', active);
     node.setAttribute('aria-pressed', String(active));
    });
    applyLessonFilter();
   });
  });
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if(chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn'&&hash!=='map'&&hash!=='visual')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   $('#sidebar').classList.remove('open');
   $('.mobile-menu').setAttribute('aria-expanded','false');
   if(document.activeElement?.matches('#home-search, #lesson-search')){
    document.activeElement.value='';
    document.activeElement.dispatchEvent(new Event('input'));
    document.activeElement.blur();
   }
  } else if(e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')){
   const target = $('#home-view').hidden ? (view==='learn' ? $('#lesson-search') : null) : $('#home-search');
   if(target){ e.preventDefault(); target.focus(); target.select(); }
  }
 });
})();
</script>
