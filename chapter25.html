  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

/* Topic map and the interactive production chart */

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter25","number":8,"title":"金融抑制与金融深化","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-08-金融抑制与金融深化-离线学习.html"},"lessons":{"title":"金融抑制与金融深化","subtitle":"理解利率和信贷管制怎样影响资金配置，区分金融约束论，并按口径读懂金融深化指标。","sections":[{"id":"financial-repression","title":"金融抑制的含义与常见手段","summary":"当不当干预持续扭曲金融价格与资金配置时，金融体系与实体经济可能相互拖累。","bodyHtml":"\u003cp>\u003cstrong>金融抑制\u003c/strong>是麦金农和肖研究金融发展时使用的概念。发展中经济体如果长期以行政方式压低存贷款利率、扭曲汇率或配置贷款，金融市场难以按资金稀缺性与风险分配资源。麦金农强调货币余额积累对投资的作用，肖强调金融中介和金融发展对储蓄、投资的影响。\u003c/p>\u003cp>常见手段包括利率上限、信贷配给、准入和业务限制，以及在特定制度下过高的法定准备金或流动性要求。汇率扭曲常表现为\u003cstrong>本币高估\u003c/strong>。若以每单位外币折合本币表示汇率，本币高估对应外币的本币价格偏低。判断一项措施是否形成金融抑制，要看程度、持续时间及其对市场功能的影响。\u003c/p>","keyTakeaway":"识别金融抑制时，先找“过度干预”，再找“利率、汇率或信贷配置失真”及其影响。","pitfall":"同一类工具也可能服务于审慎监管。汇率“高低”必须先说明标价法。","example":"当名义存款利率为 2%、同期通胀为 5% 时，实际利率约为 −3%。若这种回报持续低于市场水平，居民可能减少在正规机构持有的存款。"},{"id":"repression-mechanism","title":"金融抑制的结构、表现与传导","summary":"从金融工具和机构的局限，追踪到储蓄、投资、就业与收入。","bodyHtml":"\u003cp>金融资产和机构类型单一、直接融资市场薄弱，以及正规金融和非正规金融并存的\u003cstrong>二元结构\u003c/strong>，会使抑制性安排的影响更难缓解。典型表现包括金融市场不健全、产品与银行业务单一、利率僵硬、商业信用发展不足及证券品种有限。\u003c/p>\u003cp>低实际存款回报可能削弱持有正规金融资产的意愿。贷款价格受限时，信贷需求可能超过供给，资金通过数量、资格或行政安排分配，影响投资项目选择。融资与投资不足还可能影响就业与收入，反过来拖慢金融服务需求和发展。\u003c/p>\u003cp>研究补充（2026 年 11 月 11 日核对）。另有研究从政府融资讨论低实际利率对储户和债券持有人的隐性税效应。该机制的受益者、承担者和作用，与储蓄、投资、就业、收入四项经典分类需要分别理解。\u003ca href=\"https://www.imf.org/en/publications/wp/issues/2016/12/31/the-liquidation-of-government-debt-42610\">国际货币基金组织 · 金融抑制与政府债务研究\u003c/a>\u003c/p>","keyTakeaway":"四项典型传导是储蓄、投资、就业、收入，方向取决于制度与经济条件。","pitfall":"低贷款利率可能提高申请贷款的意愿，但有限资金按配额分配时，实际投资并不一定随之增加。","example":"银行不能按借款风险定价且放贷额度有限时，项目回报较高的小企业也可能被拒贷，转向成本更高的非正规融资。"},{"id":"financial-restraint","title":"金融约束论与激励","summary":"金融约束论强调在特定条件下，适度安排可以为持续经营和审查借款人创造激励。","bodyHtml":"\u003cp>赫尔曼、默多克和斯蒂格利茨提出的\u003cstrong>金融约束\u003c/strong>理论关注信息不对称下的激励。某些适度的存款利率限制或准入安排，可以为银行创造高于充分竞争情形的收益机会，即\u003cstrong>租金\u003c/strong>。如果银行重视未来持续取得这些收益，就可能有更多动力审查借款人、监测贷款和谨慎经营。\u003c/p>\u003cp>这套机制依赖适度约束、监管和未来经营价值等条件。约束过强会压低储蓄回报，减少竞争并产生寻租。研究核对（2026 年 11 月 11 日）。\u003ca href=\"https://www.gsb.stanford.edu/faculty-research/working-papers/financial-restraint-towards-new-paradigm\">斯坦福商学院 · 金融约束研究\u003c/a>\u003c/p>","keyTakeaway":"金融约束题抓住“创造租金，以改善激励”。金融抑制题抓住“扭曲价格和阻碍发展”。","pitfall":"金融约束论的租金指超过竞争情形的收益机会，效果取决于具体制度与条件。","example":"一家银行若能通过稳健经营保有未来收益，增加贷前审查和贷后监督投入可能比追求短期高风险回报更有吸引力。"},{"id":"financial-deepening","title":"金融深化的改革与表现","summary":"改善定价、扩展融资工具与中介服务，降低信息与交易成本，促进金融服务实体经济。","bodyHtml":"\u003cp>在麦金农—肖框架中，\u003cstrong>金融深化\u003c/strong>强调减少不适当干预，让利率、汇率等价格更能反映供求与风险。典型改革包括金融与财政政策协调、放松利率和汇率的过度限制、发展直接融资工具和金融市场、鼓励适当竞争，以及减少指导性信贷配给。\u003c/p>\u003cp>信息不对称和交易成本使金融中介、征信和其他信息机构具有价值。中介可以集合资金、审查借款人并分散部分风险。限制性契约、抵押品与借款人净值可以提供激励或降低违约损失。金融市场与实际经济相互促进仍依赖制度质量、风险管理和宏观稳定。\u003c/p>\u003cp>研究核对（2026 年 11 月 11 日）。\u003ca href=\"https://www.brookings.edu/books/money-and-capital-in-economic-development/\">布鲁金斯学会 · 麦金农研究\u003c/a>　\u003ca href=\"https://www.imf.org/en/news/articles/2015/09/28/04/53/sp101909\">国际货币基金组织 · 金融与经济增长\u003c/a>\u003c/p>","keyTakeaway":"金融深化既看市场、机构与产品如何发展，也看其配置资金、处理信息和分担风险的能力。","pitfall":"金融自由化可以推动深化，但开放速度、审慎监管、信息披露和契约执行条件会影响实际效果。","example":"企业除申请银行贷款外，还可以发行债券。信息披露与信用评级帮助投资人比较不同项目的风险。"},{"id":"financial-depth-measures","title":"货币化程度与金融深度指标","summary":"区分货币交易占比、货币余额与收入之比，以及金融资产和信贷的规模指标。","bodyHtml":"\u003cp>\u003cstrong>货币化程度\u003c/strong>描述货币媒介在经济活动中的普及。直接考察时可比较以货币结算的产出或交换与相应总量。实证中也常用广义货币与名义 GDP 的比率作为近似指标，广义货币是存量，GDP 是期间流量，计算时应说明时间和统计口径。\u003c/p>\u003cp>剑桥现金余额方程写作 \u003cstrong>Mᵈ＝kPY\u003c/strong>，其中 k＝名义货币需求 ÷ 名义收入，表示相对于收入希望持有多少货币。在货币市场均衡并采用一致口径时，可由相应货币存量与名义收入的比率表征。这个余额比率和“用货币完成的交易价值占比”是不同的统计量。\u003c/p>\u003cp>\u003cstrong>金融相关比率\u003c/strong>可用来描述金融资产相对于实际国民财富的规模。金融深度也可用私人部门信贷或金融机构资产与 GDP 的比率等衡量。指标核对（2026 年 11 月 11 日）。世界银行框架还同时观察金融服务的可及性、效率与稳定性。\u003ca href=\"https://www.worldbank.org/en/publication/gfdr/gfdr-2016/background/financial-development\">世界银行 · 金融发展衡量框架\u003c/a>　\u003ca href=\"https://data.worldbank.org/collections/findata/about-us\">世界银行 · 金融发展数据\u003c/a>\u003c/p>","keyTakeaway":"先看分子是交易额、货币余额、金融资产还是信贷，确认口径后再比较。","pitfall":"金融规模增大并不必然代表配置效率提高。金融相关比率与货币化程度各有解释对象。","example":"广义货币为 120 亿元，年度名义 GDP 为 100 亿元，余额与 GDP 之比为 120%。这个数值可以超过 100%，因为它不是总交易中货币结算的份额。"}],"mindmap":[{"label":"金融抑制","target":"financial-repression","children":[{"label":"含义","target":"financial-repression","children":[{"label":"金融价格扭曲与实体经济相互拖累","target":"financial-repression"}]},{"label":"结构背景","target":"repression-mechanism","children":[{"label":"金融资产形式少、机构单一","target":"repression-mechanism"},{"label":"正规与非正规金融二元结构","target":"repression-mechanism"},{"label":"直接融资薄弱、金融价格扭曲","target":"repression-mechanism"}]},{"label":"常见手段","target":"financial-repression","children":[{"label":"利率限制与信贷配给","target":"financial-repression"},{"label":"过高的准备金或流动性要求","target":"financial-repression"},{"label":"本币汇率高估","target":"financial-repression"}]},{"label":"典型表现","target":"repression-mechanism","children":[{"label":"市场不健全、利率僵硬","target":"repression-mechanism"},{"label":"金融工具、银行业务和证券品种有限","target":"repression-mechanism"},{"label":"商业信用发展不足","target":"repression-mechanism"}]},{"label":"四类后果","target":"repression-mechanism","children":[{"label":"储蓄与投资受影响","target":"repression-mechanism"},{"label":"就业与收入受影响","target":"repression-mechanism"}]},{"label":"金融约束论","target":"financial-restraint","children":[{"label":"适度约束、租金与激励条件","target":"financial-restraint"}]}]},{"label":"金融深化","target":"financial-deepening","children":[{"label":"改革内容","target":"financial-deepening","children":[{"label":"金融与财政改革协调","target":"financial-deepening"},{"label":"利率与汇率定价机制","target":"financial-deepening"},{"label":"直接融资、市场竞争与减少信贷配给","target":"financial-deepening"}]},{"label":"发展动因","target":"financial-deepening","children":[{"label":"信息不对称与交易成本","target":"financial-deepening"}]},{"label":"市场表现","target":"financial-deepening","children":[{"label":"专业信息机构与金融中介","target":"financial-deepening"},{"label":"限制性契约、抵押与净值","target":"financial-deepening"}]},{"label":"衡量方法","target":"financial-depth-measures","children":[{"label":"货币化程度与剑桥 k 的口径","target":"financial-depth-measures"},{"label":"金融相关比率、资产和信贷指标","target":"financial-depth-measures"}]}]}]},"questions":[{"id":"fin-08-q01","number":1,"group":"金融抑制","type":"single","stem":"罗纳德·麦金农提出的（　）是放松金融监管的基本理论，该理论认为政府通过银行管制利率限制了金融部门发展，阻碍了经济增长。","options":{"A":"金融创新理论","B":"金融抑制理论","C":"功能金融理论","D":"自由金融理论"},"answer":["B"],"explanationSupplement":"看到“管制利率”“限制金融发展”应联系金融抑制。其政策含义是减轻不适当干预，并根据风险和制度条件设计监管。","optionExplanations":{"A":"金融创新理论主要解释新产品、新技术或制度如何出现。","B":"符合麦金农讨论的利率管制及金融发展机制。","C":"功能金融理论主要分析财政政策应实现的宏观目标。","D":"题干描述的理论名称是金融抑制理论。"},"conceptId":"financial-repression"},{"id":"fin-08-q02","number":2,"group":"金融抑制","type":"single","stem":"下列属于金融约束论与金融抑制论的根本区别的是（　）。","options":{"A":"金融约束论强调严格管制，金融抑制论强调金融自由化","B":"金融约束论指出通过一些适当的金融管制措施来创造租金，为竞争者提供适当的激励","C":"金融约束是在金融抑制的基础上发展起来的","D":"金融约束是主动的，金融抑制是被动的"},"answer":["B"],"explanationSupplement":"抓住“租金”和“激励”两个关键词。适度措施可能创造收益机会，作用仍取决于约束程度、监管和市场环境。","optionExplanations":{"A":"金融约束论强调适度和条件，严格管制说法过宽。","B":"准确概括通过租金改变经营激励的思路。","C":"发展顺序无法说明两种理论的关键机制。","D":"主动或被动无法区分其政策效果。"},"conceptId":"financial-restraint"},{"id":"fin-08-q03","number":3,"group":"金融抑制","type":"single","stem":"麦金农和肖将金融抑制描述为（　）。","options":{"A":"金融市场的取缔","B":"金融结构的失衡","C":"利率和汇率等金融价格的扭曲","D":"对贷款的超额需求"},"answer":["C"],"explanationSupplement":"先区分政策机制和可能后果。利率低于市场均衡时可能出现超额贷款需求，但超额需求无法概括金融抑制的整体机制。","optionExplanations":{"A":"存在金融抑制时，金融市场仍可运行。","B":"结构失衡可能共存，描述不够具体。","C":"点明金融抑制涉及的核心价格扭曲。","D":"低利率下可能出现超额需求，属于传导表现之一。"},"conceptId":"financial-repression"},{"id":"fin-08-q04","number":4,"group":"金融抑制","type":"single","stem":"（　）是“金融二论”的代表人物。","options":{"A":"凯恩斯和托宾","B":"马克思和恩格斯","C":"弗里德曼和施瓦茨","D":"麦金农和肖"},"answer":["D"],"explanationSupplement":"人物题可用两个研究主题联记。麦金农讨论货币和资本积累，肖从金融深化与中介机制讨论发展。","optionExplanations":{"A":"二人的代表性研究包含货币需求、投资和资产选择等。","B":"其代表研究属于政治经济学等领域。","C":"二人以货币史等研究著称。","D":"两位作者与金融抑制、金融深化理论直接相关。"},"conceptId":"financial-repression"},{"id":"fin-08-q05","number":5,"group":"金融抑制","type":"single","stem":"以下不属于金融抑制后果的是（　）。","options":{"A":"负的税收效应","B":"负的储蓄效应","C":"负的投资效应","D":"负的就业效应"},"answer":["A"],"explanationSupplement":"题目是反选。低实际利率可能隐性转移部分储户和债券持有人的收益，这是另一项政府融资机制，也不直接推出显性税收减少。","optionExplanations":{"A":"该说法未列入经典四项分类。","B":"较低实际回报可能削弱正规金融储蓄意愿。","C":"信贷配给可能使有回报的投资项目无法融资。","D":"投资和经营扩张受阻时可能影响就业。"},"conceptId":"repression-mechanism"},{"id":"fin-08-q06","number":6,"group":"金融抑制","type":"single","stem":"政府对金融体系和金融活动的过多干预压制了金融体系的发展；而金融体系的不发展，又阻碍了经济的发展，从而造成金融抑制与经济落后的恶性循环。这种现象是指（　）。","options":{"A":"金融约束","B":"金融风险","C":"金融抑制","D":"金融滞后"},"answer":["C"],"explanationSupplement":"识别完整的因果链。行政干预影响金融价格和融资配置，金融服务不足再影响实体活动。","optionExplanations":{"A":"金融约束论强调特定条件下的适度激励。","B":"金融风险描述损失等结果的不确定性。","C":"包含政策干预、金融受压与经济落后的相互影响。","D":"金融滞后只描述发展状态，没有表明题中的成因与反馈。"},"conceptId":"financial-repression"},{"id":"fin-08-q07","number":7,"group":"金融深化","type":"discussion","stem":"金融深化的一个最基本衡量方法是（　）。","options":{"A":"流动性比率","B":"货币化程度","C":"资本充足率","D":"金融相关比率"},"answer":[],"explanationSupplement":"若题目指定从货币在经济活动中的使用程度判断，B 对应考点。若从金融资产相对于实际国民财富的规模衡量，则 D 也有适用场景。","optionExplanations":{"A":"通常用来分析机构偿付短期债务等流动性情况。","B":"货币化程度衡量货币媒介在经济活动中的普及。","C":"主要衡量机构资本缓冲，不能代表整个金融体系的深度。","D":"可用来衡量金融资产相对于实际国民财富的规模。"},"conceptId":"financial-depth-measures"},{"id":"fin-08-q08","number":8,"group":"金融深化","type":"single","stem":"研究金融发展与经济增长之间关系的理论是（　）。","options":{"A":"金融深化论","B":"金融创新论","C":"凯恩斯主义理论","D":"金融脆弱论"},"answer":["A"],"explanationSupplement":"金融深化可以通过储蓄动员、融资配置和交易成本等渠道影响实体经济。金融创新与金融脆弱性也会影响增长，但各自直接研究的重点不同。","optionExplanations":{"A":"研究金融发展如何与经济发展相互促进。","B":"主要解释金融新工具、产品或制度。","C":"关注总需求、就业与宏观经济政策等问题。","D":"关注金融结构中的脆弱性和危机形成。"},"conceptId":"financial-deepening"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.ht ":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {

    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }

    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;

      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');

    const graded = questions.filter(q => q.type !== 'discussion');

    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {

      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;

          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';

        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');

      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');

      const selected = chosen(q, s);

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');if(!range||!radios.length)return;function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  renderLessons();
  $('#lesson-search')?.addEventListener('input', event => {
   lessonQuery = event.target.value;
   applyLessonFilter();
  });
  $$('[data-lesson-filter]').forEach(btn => {
   btn.addEventListener('click', () => {
    lessonFilter = btn.dataset.lessonFilter;
    $$('[data-lesson-filter]').forEach(node => {
     const active = node === btn;
     node.classList.toggle('active', active);
     node.setAttribute('aria-pressed', String(active));
    });
    applyLessonFilter();
   });
  });
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if(chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn'&&hash!=='map'&&hash!=='visual')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   $('#sidebar').classList.remove('open');
   $('.mobile-menu').setAttribute('aria-expanded','false');
   if(document.activeElement?.matches('#home-search, #lesson-search')){
    document.activeElement.value='';
    document.activeElement.dispatchEvent(new Event('input'));
    document.activeElement.blur();
   }
  } else if(e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')){
   const target = $('#home-view').hidden ? (view==='learn' ? $('#lesson-search') : null) : $('#home-search');
   if(target){ e.preventDefault(); target.focus(); target.select(); }
  }
 });
})();
</script>
</body>
