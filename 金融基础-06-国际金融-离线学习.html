  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

/* Topic map and the interactive production chart */

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter23","number":6,"title":"国际金融","moduleId":"finance","moduleTitle":"金融基础","downloadName":"金融基础-06-国际金融-离线学习.html"},"lessons":{"title":"国际金融","subtitle":"理解国际收支怎样记账、汇率怎样标价，以及官方储备如何使用。","sections":[{"id":"bop-accounts","title":"国际收支与账户结构","summary":"国际收支平衡表记录居民与非居民在一段时间内的经济交易。","bodyHtml":"\u003cp>\u003cstrong>居民身份\u003c/strong>按经济利益中心等统计标准判断。交易按统一货币估值并采用复式记账，资料不完全一致形成的差额列为净误差与遗漏。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>账户\u003c/th>\u003cth>主要内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>经常账户\u003c/td>\u003ctd>货物、服务、初次收入、二次收入。跨境投资利润通常属于初次收入。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>资本账户\u003c/td>\u003ctd>资本转移，非生产非金融资产取得与处置。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金融账户\u003c/td>\u003ctd>直接投资、证券投资、金融衍生品、其他投资、储备资产等。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>国家外汇管理局公布人民币、美元和 SDR 计值表。人民币和 SDR 季度数据由美元计值数据按相应平均汇率折算。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.safe.gov.cn/safe/2026/0929/27942.html\">国家外汇管理局国际收支平衡表\u003c/a>\u003c/p>","keyTakeaway":"跨境货物交易记经常账户，交易对应的金融资产变动记金融账户。","pitfall":"“经常转移”对应二次收入，利润通常属于初次收入。账户一级分类与下属明细的范围不同。","example":"居民企业购买境外企业股票并达到证券投资分类条件，交易记金融账户。后续收到股息通常记经常账户初次收入。"},{"id":"bop-balances","title":"顺差、逆差与国际收支调节","summary":"先识别是贸易余额、经常账户余额还是综合差额。","bodyHtml":"\u003cp>货物进出口差额形成货物贸易余额，货物和服务再加初次及二次收入构成经常账户。基本差额等分析指标的口径要结合定义。狭义资本账户与含金融流动的合并项目也要分开。\u003c/p>\u003cp>持续逆差可能带来汇率贬值、外汇储备下降或融资压力，具体取决于汇率制度、资本流动和央行操作。逆差可以由外来融资弥补，也可能随着信心下降出现外流。资本流动、储备和估值必须分别判断。\u003c/p>\u003cp>支出变更政策调节总支出，汇率等支出转换政策影响支出在本国与外国产品间的分配。储备或国际融资可以缓冲短期缺口，长期结构性失衡还需要调整生产率或外贸结构。\u003c/p>","keyTakeaway":"经常账户有顺差时，仍需检查金融账户和储备资产。","pitfall":"复式记账的账面总额轧平，某一分析账户仍可呈现顺差或逆差。贸易逆差也可能与资本流入同时发生。","example":"国内需求减弱、进口下降时，其他项目稳定可使贸易余额改善。若同时外需下降，出口减少可能抵销这一作用。"},{"id":"fx-quotes","title":"汇率标价与汇率制度","summary":"先认清单位货币，再判断报价变动意味着谁升值。","bodyHtml":"\u003cp>汇率是两种货币的相对价格。\u003cstrong>直接标价\u003c/strong>用本币计量单位外币，\u003cstrong>间接标价\u003c/strong>用外币计量单位本币。两者互为倒数。在直接标价下，报价提高表示买同一单位外币需更多本币，即本币贬值。\u003c/p>\u003cp>可按形成机制区分官方汇率和市场汇率，按交割期限区分即期和远期，按参照范围区分双边和多边汇率。浮动汇率主要受外汇市场供求影响。人民币实行参考一篮子货币、有管理的浮动汇率制度，以市场供求为基础。核验于 2026 年 11 月 11 日。\u003ca href=\"https://xining.pbc.gov.cn/zhengcehuobisi/125207/125227/125957/f5c4690f2cbd40918bf24c2d39ac58af/b3e8c1a2b07d4facb38f4a7426415252/2025081819132397368.pdf\">中国人民银行货币政策执行报告\u003c/a>\u003c/p>","keyTakeaway":"1 个百分比基点为 0.01 个百分点，写成小数是 0.0001。外汇报价最小点位还看货币对惯例。","pitfall":"买入价与卖出价按交易方视角区分，与直接或间接标价属于不同分类。","example":"1 美元从 7.20 元变为 7.00 元时，直接标价下降，人民币对美元升值。"},{"id":"fx-effects","title":"汇率变动及其经济影响","summary":"从贸易价格、资本流动、物价和资产负债表判断传导。","bodyHtml":"\u003cp>汇率受国际收支、利率差、通胀差、央行操作、宏观政策和市场预期等影响。其他条件给定，本币升值可降低进口品本币价格，抑制输入性通胀，并提高出口品的外币价格。出口量、进口量和贸易余额还取决于计价、价格传递、需求弹性与合同调整。\u003c/p>\u003cp>汇率也改变外币资产和负债的本币价值，可通过资产负债表、投资和资本流动影响增长、就业及外债压力。\u003c/p>","keyTakeaway":"先换算价格，再分析数量和总金额。","pitfall":"升值只能给出特定渠道的方向，资本流动还要考虑预期回报、风险和资金配置。","example":"商品售价 100 美元且美元价格固定时，汇率由 1 美元兑 6 元变为兑 5 元，进口商支付的人民币从 600 元降到 500 元。"},{"id":"reserve-assets","title":"外汇与国际储备","summary":"外汇是可用于国际清偿的资产和支付工具，官方储备是货币当局可支配的储备资产。","bodyHtml":"\u003cp>《外汇管理条例》列举了外币现钞、外币支付凭证或工具、外币证券、特别提款权和其他外汇资产。国际储备通常包括\u003cstrong>货币性黄金、外汇储备、IMF 储备头寸与 SDR\u003c/strong>。备用信用额度可以提供融资来源，未支用额度本身不构成已经持有的储备资产。\u003c/p>\u003cp>储备可用于国际支付、支持汇率操作和维持融资信心。外债期限、外部融资能力、进口规模和汇率制度会影响所需储备水平。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.safe.gov.cn/heilongjiang/file/file/20170728/c8dd4cfd7f9b432faa691b7d23395809.pdf\">《中华人民共和国外汇管理条例》\u003c/a> · \u003ca href=\"https://www.imf.org/external/pubs/ft/ar/2025/pdfs/imf-annual-report-2025-appendices.pdf\">IMF 国际储备统计\u003c/a>\u003c/p>","keyTakeaway":"外汇储备是国际储备的一个组成部分。","pitfall":"私人持有的外币证券不自动成为官方储备。顺差是否转化为外汇储备，取决于货币当局是否取得相关资产。","example":"若央行用外汇储备向市场供给美元、换回本币，该笔操作会减少央行外汇资产。"},{"id":"sdr","title":"特别提款权与货币篮子","summary":"SDR 是 IMF 创设的国际储备资产和记账单位，合资格持有者可以按规则使用。","bodyHtml":"\u003cp>IMF 会员和获准的官方机构可以持有 SDR。会员可以按规则将 SDR 换取可自由使用货币，也可用于部分 IMF 相关支付。私人商户不能像使用日常货币一样直接收取 SDR。\u003c/p>\u003cp>人民币于 2016 年 10 月 1 日加入 SDR 货币篮子。自 2022 年 8 月起的估值权重为美元 43.38%、欧元 29.31%、人民币 12.28%、日元 7.59%、英镑 7.44%。核验于 2026 年 11 月 11 日。\u003ca href=\"https://www.imf.org/en/About/Factsheets/Sheets/2023/Special-Drawing-Rights-SDR\">IMF 特别提款权说明\u003c/a> · \u003ca href=\"https://www.elibrary.imf.org/display/book/9798229008341/CH027.xml\">IMF 估值决议与历史\u003c/a>\u003c/p>","keyTakeaway":"区分估值篮子货币、SDR 持有资格和实际支付用途。","pitfall":"篮子权重用于估值调整，固定货币数量按每日市场汇率计值，因此日常价值占比会变化。","example":"央行可按规则将所持 SDR 兑换为美元，再用于对外支付。"}],"mindmap":[{"label":"国际收支与汇率变动","target":"bop-accounts","children":[{"label":"国际收支平衡表","target":"bop-accounts","children":[{"label":"经常账户","target":"bop-accounts"},{"label":"资本账户","target":"bop-accounts"},{"label":"金融账户","target":"bop-accounts"},{"label":"净误差与遗漏","target":"bop-accounts"}]},{"label":"主要差额","target":"bop-balances","children":[{"label":"贸易差额","target":"bop-balances"},{"label":"经常账户差额","target":"bop-balances"},{"label":"基本账户差额","target":"bop-balances"},{"label":"综合账户差额","target":"bop-balances"}]},{"label":"持续失衡的影响","target":"bop-balances","children":[{"label":"外汇储备","target":"bop-balances"},{"label":"对外支付与债务","target":"bop-balances"},{"label":"进口、增长与就业","target":"bop-balances"},{"label":"资本流动","target":"bop-balances"}]},{"label":"失衡调节","target":"bop-balances","children":[{"label":"支出变更","target":"bop-balances"},{"label":"汇率与支出转换","target":"bop-balances"},{"label":"储备缓冲","target":"bop-balances"},{"label":"直接管理与国际金融合作","target":"bop-balances"}]},{"label":"汇率与变动因素","target":"fx-quotes","children":[{"label":"直接与间接标价","target":"fx-quotes"},{"label":"汇率制度","target":"fx-quotes"},{"label":"国际收支与通胀、利差","target":"fx-quotes"},{"label":"政策操作与市场预期","target":"fx-quotes"}]},{"label":"汇率变化的影响","target":"fx-effects","children":[{"label":"贸易收支","target":"fx-effects"},{"label":"外债压力","target":"fx-effects"},{"label":"资本流动","target":"fx-effects"},{"label":"物价、增长与就业","target":"fx-effects"}]}]},{"label":"外汇与国际储备","target":"reserve-assets","children":[{"label":"外汇类型","target":"reserve-assets","children":[{"label":"外国货币","target":"reserve-assets"},{"label":"外币支付凭证和工具","target":"reserve-assets"},{"label":"外币证券","target":"reserve-assets"},{"label":"特别提款权","target":"sdr"},{"label":"其他外汇资产","target":"reserve-assets"}]},{"label":"官方储备的构成","target":"reserve-assets","children":[{"label":"货币性黄金","target":"reserve-assets"},{"label":"外汇储备","target":"reserve-assets"},{"label":"IMF 储备头寸","target":"reserve-assets"},{"label":"特别提款权","target":"sdr","children":[{"label":"可使用的主体","target":"sdr"},{"label":"SDR 货币篮子","target":"sdr"}]}]},{"label":"国际储备的作用","target":"reserve-assets","children":[{"label":"弥补国际支付缺口","target":"reserve-assets"},{"label":"支持汇率操作","target":"reserve-assets"},{"label":"维护国际信用与投资环境","target":"reserve-assets"}]}]}]},"questions":[{"id":"fin-06-q01","number":1,"group":"国际收支与汇率变动","type":"single","stem":"以汇率形成机制为标准，汇率可分为（　　）。","options":{"A":"基本汇率与套算汇率","B":"官方汇率与市场汇率","C":"即期汇率与远期汇率","D":"双边汇率与多边汇率"},"answer":["B"],"explanationSupplement":"按形成机制区分官方报价和市场形成的汇率。","optionExplanations":{"A":"按是否经交叉换算区分。","B":"按交割期限区分。","C":"对应形成机制。","D":"按比较范围区分。"},"conceptId":"fx-quotes"},{"id":"fin-06-q02","number":2,"group":"国际收支与汇率变动","type":"single","stem":"外汇交易报价中，1个基点（BP）是指（　　）。","options":{"A":"0.001","B":"0.0001","C":"0.00001","D":"0.000001"},"answer":["B"],"explanationSupplement":"一个基点是百分之一百分点，写成小数为 0.0001。","optionExplanations":{"A":"等于 10 个基点。","B":"等于 1 个基点。","C":"等于 0.1 个基点。","D":"等于 0.01 个基点。"},"conceptId":"fx-quotes"},{"id":"fin-06-q03","number":3,"group":"国际收支与汇率变动","type":"single","stem":"在浮动汇率制度下，汇率是由（　　）。","options":{"A":"外汇市场上的供求关系自发决定的","B":"两个国家的央行之间约定的","C":"两个国家的法定货币的币值决定的","D":"外汇市场上货币流通呈自发决定的"},"answer":["A"],"explanationSupplement":"浮动汇率下，外币供求变化主要通过市场价格反映。","optionExplanations":{"A":"是一般机制。","B":"共同约定更接近固定安排。","C":"法定货币身份不决定市场价格。","D":"流通量只是可能影响供求的因素。"},"conceptId":"fx-quotes"},{"id":"fin-06-q04","number":4,"group":"国际收支与汇率变动","type":"single","stem":"对外证券投资属于国际收支平衡表的（　　）。","options":{"A":"经常项目","B":"贸易项目","C":"资本项目","D":"金融项目"},"answer":["D"],"explanationSupplement":"对外证券投资涉及股票或债券等金融资产变动，计入金融账户。","optionExplanations":{"A":"记录货物、服务和收入等。","B":"主要记录货物和服务的贸易。","C":"狭义资本账户主要记录资本转移等。","D":"证券投资是金融账户子项。"},"conceptId":"bop-accounts"},{"id":"fin-06-q05","number":5,"group":"国际收支与汇率变动","type":"single","stem":"国际收支平衡表根据（　　）编制，每笔经济交易同时在两方反映，原则上借贷方恒等。","options":{"A":"复式记账原理","B":"业务核算","C":"单式记账原理","D":"统计原理"},"answer":["A"],"explanationSupplement":"每笔跨境交易同时记录两方面的经济价值，采用复式记账。","optionExplanations":{"A":"能实现两方同时反映。","B":"未指明借贷配对方法。","C":"单式记录没有对应分录。","D":"未指明具体方法。"},"conceptId":"bop-accounts"},{"id":"fin-06-q06","number":6,"group":"国际收支与汇率变动","type":"discussion","stem":"下列关于国际收支逆差对经济的影响的说法错误的是（　　）。","options":{"A":"逆差导致该国贸易条件恶化","B":"可能导致该国对外支付能力增加","C":"本国收入下降和失业增加","D":"资本外流"},"answer":[],"explanationSupplement":"持续逆差若消耗储备，可能削弱对外支付能力。贸易条件、收入和资本流向还取决于冲击来源及政策，不能由逆差单独推出。","optionExplanations":{"A":"贸易条件取决于进出口相对价格。","B":"逆差并不会普遍提高对外支付能力，融资流入时储备仍可能改善。","C":"逆差可能与强劲内需同时出现。","D":"资本流入可为经常账户逆差融资，外流也可能在其他条件下发生。"},"conceptId":"bop-balances"},{"id":"fin-06-q07","number":7,"group":"国际收支与汇率变动","type":"single","stem":"本国货币对外币升值后会引起的经济现象是（　　）。","options":{"A":"本国出口商品量增加","B":"国内物价水平下降","C":"资本外流","D":"国内通货膨胀压力增加"},"answer":["B"],"explanationSupplement":"本币升值会降低固定外币价格的进口品本币成本，有助于缓和输入性物价压力。","optionExplanations":{"A":"出口商品对外国消费者可能变贵。","B":"符合题设常见价格传导。","C":"资本流动取决于预期和收益。","D":"进口价格渠道通常缓和压力。"},"conceptId":"fx-effects"},{"id":"fin-06-q08","number":8,"group":"国际收支与汇率变动","type":"single","stem":"直接标价法是以本国货币表示外国货币的价格，因此可以称为（　　）。","options":{"A":"本币汇率","B":"外汇汇率","C":"买入汇率","D":"卖出汇率"},"answer":["B"],"explanationSupplement":"直接标价用一定数量本币购买一单位外币，表示外币的本币价格。","optionExplanations":{"A":"本币的外币价格对应间接标价。","B":"对应外币价格。","C":"买入价按交易者方向区分。","D":"卖出价也按交易者方向区分。"},"conceptId":"fx-quotes"},{"id":"fin-06-q09","number":9,"group":"国际收支与汇率变动","type":"single","stem":"在直接标价法下，一定单位的外币折算的本国货币增多，说明本币汇率（　　）。","options":{"A":"上升","B":"下降","C":"不变","D":"难以确定"},"answer":["B"],"explanationSupplement":"同样数量外币需要更多本币，表示本币对外币贬值。题中“本币汇率”按本币价值理解。","optionExplanations":{"A":"外币的本币报价上升。","B":"本币价值下降。","C":"购买同额外币所需本币变多。","D":"给定报价单位，方向确定。"},"conceptId":"fx-quotes"},{"id":"fin-06-q10","number":10,"group":"国际收支与汇率变动","type":"single","stem":"以下关于汇率的说法中错误的是（　　）。","options":{"A":"汇率是两种货币之间的相对价格","B":"汇率的直接标价法可以表示为1单位外币等于多少本币","C":"我国的汇率报价一般采用直接标价法","D":"我国的汇率报价一般采用间接标价法"},"answer":["D"],"explanationSupplement":"在常见人民币直接标价中，外币单位固定，用人民币表示它的价格。","optionExplanations":{"A":"汇率是相对价格。","B":"符合直接标价定义。","C":"常见人民币报价可用直接标价。","D":"将通常标价方向写反。"},"conceptId":"fx-quotes"},{"id":"fin-06-q11","number":11,"group":"国际收支与汇率变动","type":"single","stem":"在经济萧条时期，由于国内需求不足，进出口业务会发生相应的变动，则国际收支可能出现（　　）。","options":{"A":"平衡","B":"逆差","C":"不确定","D":"顺差"},"answer":["D"],"explanationSupplement":"国内需求不足可能减少进口，其他条件不变时贸易余额可改善，因而存在顺差的可能。","optionExplanations":{"A":"可能出现，但未体现进口收缩的典型方向。","B":"若出口或资本流入下降更多也可能出现。","C":"要推断实际余额仍需其他信息。","D":"是题目关注的进口下降情形。"},"conceptId":"bop-balances"},{"id":"fin-06-q12","number":12,"group":"国际收支与汇率变动","type":"single","stem":"在实践中，由于资料来源不一、不全以及错漏等原因，借贷两方无法轧平。为了轧平起见，就在国际收支平衡表中设立了（　　）。","options":{"A":"经常项目","B":"资本项目","C":"净误差与遗漏项目","D":"国际储备变动额"},"answer":["C"],"explanationSupplement":"净误差与遗漏是实务编表中的平衡项，反映数据来源、记录时点和统计覆盖等差异。","optionExplanations":{"A":"是主要实质账户。","B":"记录资本转移等。","C":"用于平衡独立统计产生的差异。","D":"储备变化有单独的金融账户项目。"},"conceptId":"bop-accounts"},{"id":"fin-06-q13","number":13,"group":"国际收支与汇率变动","type":"single","stem":"A 国与B 国进行自由贸易，A国从B国进口汽车，向B国出口粮食，如果从现在开始A 国对进口汽车征收关税，那么该征税行为将导致（　　）。","options":{"A":"A 国的进口增加","B":"A 国的进口减少","C":"B 国的出口增加","D":"B 国的进口减少"},"answer":["B"],"explanationSupplement":"给定其他条件，关税提高进口汽车的本国价格，通常压低被征税汽车的进口需求。","optionExplanations":{"A":"与该品需求变化方向相反。","B":"符合对进口汽车的直接影响。","C":"B 国向 A 国出口汽车通常减少。","D":"B 国进口粮食的变化需另作分析。"},"conceptId":"fx-effects"},{"id":"fin-06-q14","number":14,"group":"国际收支与汇率变动","type":"single","stem":"一般而言，由（　　）引起的国际收支失衡是长期的且持久的。","options":{"A":"经济周期更迭","B":"货币价值变动","C":"预期目标改变","D":"经济结构滞后"},"answer":["D"],"explanationSupplement":"产业与贸易结构长期不适应外部变化，可能造成持续失衡。","optionExplanations":{"A":"主要描述周期性波动。","B":"持续性取决于冲击和调整。","C":"预期可能迅速变化。","D":"结构调整通常耗时较长。"},"conceptId":"bop-balances"},{"id":"fin-06-q15","number":15,"group":"国际收支与汇率变动","type":"single","stem":"一国国际收支顺差会使（　　）。","options":{"A":"外国对该国货币需求增加，该国货币汇率上升","B":"外国对该国货币需求减少，该国货币汇率下跌","C":"外国对该国货币需求增加，该国货币汇率下跌","D":"外国对该国货币需求减少，该国货币汇率上升"},"answer":["A"],"explanationSupplement":"在简化外汇供求框架下，顺差可能增加本币需求和本币升值压力。实际汇率也受资本流动和干预影响。","optionExplanations":{"A":"符合该市场压力。","B":"两个方向和题设机制相反。","C":"需求增加通常提高本币价值。","D":"需求减少通常降低本币价值。"},"conceptId":"bop-balances"},{"id":"fin-06-q16","number":16,"group":"国际收支与汇率变动","type":"discussion","stem":"国际收支出现巨额逆差时，会导致（　　）。","options":{"A":"本币汇率贬值，资本流入","B":"本币汇率升值，资本流出","C":"本币汇率升值，资本流入","D":"本币汇率贬值，资本流出"},"answer":[],"explanationSupplement":"逆差可能产生贬值压力。资本流动仍取决于融资渠道、收益预期与风险，经常账户逆差也可与资本净流入并存。","optionExplanations":{"A":"外来融资弥补经常账户缺口时可能出现。","B":"逆差本身不支持升值方向。","C":"升值和流入都需额外条件。","D":"资本外流冲击时可能出现。"},"conceptId":"bop-balances"},{"id":"fin-06-q17","number":17,"group":"国际收支与汇率变动","type":"single","stem":"将一国货币币值的升高定义升值，那么对该国来说，将导致（　　）。","options":{"A":"直接标价法汇率值将减小，间接标价法下汇率值将减小","B":"直接标价法汇率值将减小，间接标价法下汇率值将增大","C":"直接标价法汇率值将增大，间接标价法下汇率值将减小","D":"直接标价法汇率值将增大，间接标价法下汇率值将增大"},"answer":["B"],"explanationSupplement":"本币升值后，一单位外币能换到的本币变少，一单位本币能换到的外币变多。","optionExplanations":{"A":"间接报价会上升。","B":"直接报价下降、间接报价上升。","C":"两个方向都写反。","D":"直接报价会下降。"},"conceptId":"fx-quotes"},{"id":"fin-06-q18","number":18,"group":"国际收支与汇率变动","type":"discussion","stem":"在我国的国际收支平衡表中，各种实物和资产的往来均以（　　）作为计算单位。","options":{"A":"人民币","B":"美元","C":"欧元","D":"英镑"},"answer":[],"explanationSupplement":"国家外汇管理局以美元计值编制，并公布人民币与 SDR 折算表。题目询问计算单位，未区分编制基础与发布口径。","optionExplanations":{"A":"是公布口径之一。","B":"是季度折算所依据的基础计值。","C":"表中所列其他单位为 SDR。","D":"该公布表未列英镑。"},"conceptId":"bop-accounts"},{"id":"fin-06-q19","number":19,"group":"国际收支与汇率变动","type":"discussion","stem":"目前，我国的国际收支中，所占比重最大的是（　　）。","options":{"A":"贸易收支","B":"经常转移","C":"资本项目收支","D":"无偿转让"},"answer":[],"explanationSupplement":"货物贸易是我国国际收支的重要部分。比较所占比重要指定统计期间、具体项目和分母。2026 年上半年可用外汇局公布表核算。","optionExplanations":{"A":"在相关期间及比较口径下可占较大比重。","B":"属经常账户相关收入类别。","C":"狭义资本账户和金融账户需区分。","D":"属于无对价转移的概念，可能与其他选项口径重叠。"},"conceptId":"bop-balances"},{"id":"fin-06-q20","number":20,"group":"国际收支与汇率变动","type":"single","stem":"假设美元和人民币的汇率从1美元兑换6元人民币变为1美元兑换5元人民币，那么（　　）。","options":{"A":"美国商品在中国变得相对便宜，增加了中国的进口需求","B":"中国商品在美国变得相对便宜，增加了美国的进口需求","C":"美国商品在中国变得相对昂贵，降低了中国的进口需求","D":"中国商品在美国变得相对昂贵，增加了美国的进口需求"},"answer":["A"],"explanationSupplement":"人民币升值，给定美元价格的美国商品在中国更便宜。价格下降通常提高中国的进口需求。","optionExplanations":{"A":"符合进口价格和需求方向。","B":"中国商品的美元价格通常上升。","C":"美国商品的人民币价格下降。","D":"中国商品变贵通常压低美国进口需求。"},"conceptId":"fx-effects"},{"id":"fin-06-q21","number":21,"group":"国际收支与汇率变动","type":"single","stem":"经常账户是指反映一国与他国之间的实际资产的流动，与该国的国民收入账户有密切联系，也是国际收支平衡表中最基本、最重要的部分。所包含的四个项目中不包含（　　）。","options":{"A":"服务","B":"经常转移","C":"货物","D":"利润"},"answer":["D"],"explanationSupplement":"经常账户包括货物、服务、初次收入和二次收入。利润可纳入初次收入，但不独立作为与这四类同级的项目。","optionExplanations":{"A":"是服务类。","B":"常对应二次收入。","C":"是货物类。","D":"利润可能记作初次收入的明细，题目询问一级项目。"},"conceptId":"bop-accounts"},{"id":"fin-06-q22","number":22,"group":"国际收支与汇率变动","type":"single","stem":"关于国际收支，下列说法正确的是（　　）。","options":{"A":"国际收支反映的内容是以货币记录的交易","B":"一国的领事馆在所在国的消费不计入国际收支","C":"国际收支记录的是一国居民之间的交易","D":"依据交易双方的国籍可以判断该项交易是否应该包含在国际收支的范围内"},"answer":["A"],"explanationSupplement":"国际收支在一定时期内以货币价值记录居民与非居民的交易，实物交易也可估价入账。","optionExplanations":{"A":"是统一计值的记录。","B":"领事机构与驻在地居民的交易可计入国际收支。","C":"主体是居民与非居民。","D":"通常按经济居住地标准判断。"},"conceptId":"bop-accounts"},{"id":"fin-06-q23","number":23,"group":"外汇与国际储备","type":"single","stem":"SDR 是（　　）。","options":{"A":"欧洲经济货币联盟创设的货币","B":"IMF 创设的储备资产和记账单位","C":"欧洲货币体系的中心货币","D":"世界银行创设的一种特别使用资金的权利"},"answer":["B"],"explanationSupplement":"SDR 是 IMF 创设的储备资产，并用作 IMF 等机构的记账单位。","optionExplanations":{"A":"欧洲经济货币联盟的共同货币是欧元。","B":"符合 SDR 的用途和创设机构。","C":"SDR 的用途不限于欧洲。","D":"创设机构是 IMF。"},"conceptId":"sdr"},{"id":"fin-06-q24","number":24,"group":"外汇与国际储备","type":"discussion","stem":"仅限于会员国政府之间和 IMF 与会员国之间使用的储备资产是（　　）。","options":{"A":"黄金储备","B":"外汇储备","C":"特别提款权","D":"普通提款权"},"answer":[],"explanationSupplement":"SDR 可以由 IMF 会员及获准的官方机构持有，私人实体不能持有。","optionExplanations":{"A":"黄金可在更广泛的市场交易。","B":"外汇储备由货币当局持有，也可在市场使用。","C":"对应题目指向，但 IMF 也有获准持有人。","D":"通常指 IMF 相关融资安排。"},"conceptId":"sdr"},{"id":"fin-06-q25","number":25,"group":"外汇与国际储备","type":"single","stem":"下列表述中不正确的是（　　）。","options":{"A":"外汇是以外币表示的一种支付手段","B":"汇率是两种货币之间的相对价格","C":"欧洲债券是由欧洲国家发行的以美元为计价单位的债券","D":"国际储备是一国持有的各种形式的流动资产的综合"},"answer":["C"],"explanationSupplement":"欧洲债券按发行市场和计价货币关系区分，发行人不必来自欧洲，币种也不限于美元。","optionExplanations":{"A":"外汇可作为国际清偿工具。","B":"是汇率基本定义。","C":"同时错误限定发行人和币种。","D":"指货币当局控制的可用外部资产。"},"conceptId":"reserve-assets"},{"id":"fin-06-q26","number":26,"group":"外汇与国际储备","type":"discussion","stem":"在不考虑干预因素的情况下，某国连续5年处于国际收支顺差的状态，那么该国应出现的情况是（　　）。","options":{"A":"外汇储备减少，本国货币升值压力增大","B":"外汇储备减少，本国货币升值压力减少","C":"外汇储备增加，本国货币升值压力增大","D":"外汇储备增加，本国货币升值压力减少"},"answer":[],"explanationSupplement":"持续顺差可能带来本币升值压力。外汇储备是否增加还要看央行买汇、资金配置及估值，题中排除了干预。","optionExplanations":{"A":"方向不能由顺差单独推出。","B":"两个方向都需更多条件。","C":"央行购汇时可能出现储备增加，题设没有这个条件。","D":"仍需考虑当局操作和市场预期。"},"conceptId":"reserve-assets"},{"id":"fin-06-q27","number":27,"group":"外汇与国际储备","type":"single","stem":"2016年10月1日，（　　）正式纳入 SDR 货币篮子。","options":{"A":"美元","B":"日元","C":"英镑","D":"人民币"},"answer":["D"],"explanationSupplement":"IMF 于 2016 年 10 月 1 日启用含人民币的 SDR 篮子。","optionExplanations":{"A":"在此次调整前已在篮子中。","B":"在此次调整前已在篮子中。","C":"在此次调整前已在篮子中。","D":"此次新纳入人民币。"},"conceptId":"sdr"},{"id":"fin-06-q28","number":28,"group":"外汇与国际储备","type":"single","stem":"目前，世界各国的国际储备中，最重要的组成部分是（　　）。","options":{"A":"黄金储备","B":"外汇储备","C":"特别提款权","D":"在国际货币基金组织（IMF）的储备头寸"},"answer":["B"],"explanationSupplement":"IMF 全球汇总中，外汇储备是国际储备的主要组成。具体国家的储备结构会有所不同。","optionExplanations":{"A":"货币性黄金也是储备资产。","B":"在全球汇总中占主要地位。","C":"SDR 是 IMF 创设的储备资产。","D":"是对 IMF 的储备头寸。"},"conceptId":"reserve-assets"},{"id":"fin-06-q29","number":29,"group":"外汇与国际储备","type":"single","stem":"下列关于特别提款权的表述中，不正确的一项是（　　）。","options":{"A":"可以起到国际储备的作用","B":"可以直接用于国际贸易支付","C":"由国际货币基金组织创设","D":"是一种记账单位"},"answer":["B"],"explanationSupplement":"SDR 可以作为官方储备和记账单位，合资格持有者可换取可自由使用货币，通常不能直接用于私人货物贸易付款。","optionExplanations":{"A":"符合储备资产功能。","B":"贸易支付通常用实际货币。","C":"创设机构是 IMF。","D":"IMF 等机构可用作记账单位。"},"conceptId":"sdr"},{"id":"fin-06-q30","number":30,"group":"外汇与国际储备","type":"single","stem":"以下不属于自有储备的是（　　）。","options":{"A":"黄金储备","B":"外汇储备","C":"在 IMF 的储备头寸","D":"备用信贷"},"answer":["D"],"explanationSupplement":"未支用的备用信贷属于可能取得的融资，不能作为已持有的自有储备。","optionExplanations":{"A":"货币性黄金属于自有储备。","B":"外汇储备属于自有储备。","C":"IMF 储备头寸可计入。","D":"是可用的融资安排。"},"conceptId":"reserve-assets"},{"id":"fin-06-q31","number":31,"group":"外汇与国际储备","type":"single","stem":"在科学确定国际储备总量时，国际储备量要与（　　）。","options":{"A":"经济规模成反比","B":"外债规模成正比","C":"短期国际融资能力成正比","D":"对外开放度成反比"},"answer":["B"],"explanationSupplement":"其他条件相同时，外债偿付压力越大，储备缓冲需求通常越高。这里的正向关系不要求严格固定比例。","optionExplanations":{"A":"较大的经济规模常需更大的流动性缓冲。","B":"外债越多可能需要更高缓冲。","C":"更强的融资能力可能减少自有储备需求。","D":"开放程度提高可能增加外部流动性需求。"},"conceptId":"reserve-assets"},{"id":"fin-06-q32","number":32,"group":"外汇与国际储备","type":"single","stem":"在特别提款权中占权数最大的货币是（　　）。","options":{"A":"美元","B":"欧元","C":"日元","D":"英镑"},"answer":["A"],"explanationSupplement":"IMF 自 2022 年 8 月启用的估值权重中，美元占 43.38%，在篮子中最大。","optionExplanations":{"A":"设定权重最大。","B":"为 29.31%。","C":"为 7.59%。","D":"为 7.44%。"},"conceptId":"sdr"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);

   requestAnimationFrame(()=>requestAnimationFrame(()=>{readingTracking=true;}));
  }
  history.replaceState(null,'','#'+(requested==='map'||requested==='visual'?requested:next));
 }
 $('#continue-reading').addEventListener('click',()=>jumpConcept(state.reading.lastConcept));
 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();syncInlineQuizzes();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);syncInlineQuizzes();favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}
 function download() {
  if(offline) {
   openModal('你正在使用离线学习版','<p>本文件包含本章的讲解、思维导图和练习。保存好这份 HTML，断网后双击即可继续学习。</p><p>可在「学习记录」中导出、导入本章备份。</p>');
   return;
  }
  const a=el('a');
  a.href=(flatDownloads?'':'downloads/')+encodeURIComponent(chapter.downloadName);
  a.download=chapter.downloadName;
  document.body.append(a);
  a.click();
  a.remove();
  toast('离线 HTML 下载已开始，保存后可双击学习');
 }
 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');if(!range||!radios.length)return;function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  renderLessons();
  $('#lesson-search')?.addEventListener('input', event => {
   lessonQuery = event.target.value;
   applyLessonFilter();
  });
  $$('[data-lesson-filter]').forEach(btn => {
   btn.addEventListener('click', () => {
    lessonFilter = btn.dataset.lessonFilter;
    $$('[data-lesson-filter]').forEach(node => {
     const active = node === btn;
     node.classList.toggle('active', active);
     node.setAttribute('aria-pressed', String(active));
    });
    applyLessonFilter();
   });
  });
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if(chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn'&&hash!=='map'&&hash!=='visual')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   $('#sidebar').classList.remove('open');
   $('.mobile-menu').setAttribute('aria-expanded','false');
   if(document.activeElement?.matches('#home-search, #lesson-search')){
    document.activeElement.value='';
    document.activeElement.dispatchEvent(new Event('input'));
    document.activeElement.blur();
   }
  } else if(e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')){
   const target = $('#home-view').hidden ? (view==='learn' ? $('#lesson-search') : null) : $('#home-search');
   if(target){ e.preventDefault(); target.focus(); target.select(); }
  }
 });
})();
