  <title>经济金融保险 · 知其所以</title>
  <script>
    (() => {
      const storageKey = 'zhiqi-theme-mode';
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const readMode = () => {
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch {
          // The appearance control still works when browser storage is unavailable.
        }
        return 'system';
      };
      let mode = readMode();

      function applyAppearance() {
        const dark = mode === 'dark' || (mode === 'system' && systemTheme.matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        themeColor.content = dark ? '#151b1e' : '#fbfdfd';
      }

      applyAppearance();
      systemTheme.addEventListener('change', () => {
        if (mode === 'system') applyAppearance();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const picker = document.getElementById('theme-mode');
        const options = picker.querySelectorAll('input[type="radio"]');
        const selectCurrentMode = () => {
          for (const option of options) option.checked = option.value === mode;
        };
        selectCurrentMode();
        picker.addEventListener('change', event => {
          mode = event.target.value;
          applyAppearance();
          try {
            localStorage.setItem(storageKey, mode);
          } catch {
            // Apply the choice for this visit even if it cannot be saved.
          }
        });
        window.addEventListener('storage', event => {
          if (event.key !== storageKey && event.key !== null) return;
          mode = readMode();
          selectCurrentMode();
          applyAppearance();
        });
      });
    })();
  </script>

  flex-wrap: wrap;
}
.inline-practice-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.inline-practice-body { margin-top: 12px; }
.inline-quiz-grid { margin-bottom: 12px; }
.inline-quiz-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-subtle);
}
.inline-quiz-stem { font-size: clamp(16px, 1.5vw, 18px); line-height: 1.65; margin-bottom: 13px; }
.inline-quiz-card .quiz-feedback h4 { margin: 0 0 8px; font-size: 16px; }
.inline-quiz-card .quiz-feedback h5 { margin: 14px 0 5px; font-size: 14px; color: var(--heading); }
.next-step { border-top: 1px solid var(--line); padding: 20px clamp(24px, 3.4vw, 46px); }

/* Topic map and the interactive production chart */
.map-panel, .ppf-panel, .quiz-card, .quiz-empty {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.map-panel { min-width: 0; }
.map-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-subtle);
  border-radius: var(--radius) var(--radius) 0 0;
}
.map-toolbar button {
  min-height: 37px;
  padding: 4px 10px;
  background: var(--surface);
  color: var(--heading);
  font-size: 13px;
  font-weight: 610;
  white-space: nowrap;
}
.map-toolbar > button, .map-zoom {
  border: 1px solid var(--control-line);
  border-radius: 8px;
  background: var(--surface);
}
.map-zoom { display: inline-flex; align-items: stretch; }
.map-zoom button:first-child { border-radius: 7px 0 0 7px; }
.map-zoom button:last-child { border-radius: 0 7px 7px 0; }
.map-zoom button + button { border-left: 1px solid var(--line); }
.map-zoom #map-size { min-width: 55px; font-family: var(--font-number); }
.map-toolbar button:not(:disabled):hover { background: var(--accent-soft); color: var(--accent); }
.map-viewport {
  min-width: 0;
  overflow: auto;
  overscroll-behavior-inline: contain;
  border-radius: 0 0 var(--radius) var(--radius);
}
.mindmap {
  --map-arm: 1.25em;
  --map-edge: var(--control-line);
  width: max-content;
  margin: 0 auto;
  padding: 1.55em 1.45em;
  list-style: none;
  font-size: 14px;
  line-height: 1.45;
}
.map-item {
  position: relative;
  display: flex;
  align-items: center;
}
.map-node {
  display: flex;
  flex: none;
  align-items: center;
  gap: .28em;
  padding: .25em .55em;
  border: 1px solid transparent;
  border-radius: .6em;
}
.map-label { display: block; max-width: 19em; overflow-wrap: anywhere; }
.map-label[href]:hover { color: var(--accent); text-decoration: underline; text-underline-offset: .18em; }
.map-root {
  background: var(--accent);
  color: var(--accent-on);
  padding: .67em .8em;
  font-size: 1.08em;
  font-weight: 690;
}
.map-item[data-depth='1'] > .map-node {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.map-item[data-depth='1'] > .map-node .map-label { max-width: 14em; text-wrap: balance; }
.map-parent:not([data-depth='1']) > .map-node {
  border-color: var(--line);
  background: var(--surface-subtle);
  color: var(--heading);
}
.map-parent:not([data-depth='1']) > .map-node .map-label { max-width: 13em; text-wrap: balance; }
.map-toggle {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 1.55em;
  height: 1.55em;
  padding: 0;
  border: 1px solid var(--control-line);
  border-radius: .42em;
  color: var(--accent);
  background: var(--surface);
  font-size: 1em;
  font-weight: 650;
  line-height: 1;
}
.map-toggle:hover { background: var(--accent-soft); }
.map-children {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 0 0 var(--map-arm);
  padding: 0;
  list-style: none;
}
/* Each parent reaches a shared spine. The spine ends at its outermost children. */
.map-children::before, .map-children > .map-item::before {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--map-arm);
  border-top: 1px solid var(--map-edge);
}
.map-children::before { left: calc(-1 * var(--map-arm)); }
.map-children > .map-item { padding: .18em 0 .18em var(--map-arm); }
.map-children > .map-item::before { left: 0; }
.map-children > .map-item::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  border-left: 1px solid var(--map-edge);
}
.map-children > .map-item:first-child::after { top: 50%; }
.map-children > .map-item:last-child::after { bottom: 50%; }
.map-children > .map-item:only-child::after { display: none; }
.mindmap > .map-item > .map-children > .map-item { padding-block: .48em; }
.ppf-panel { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); }
.ppf-chart { align-self: center; min-width: 0; padding: 20px 14px; }
.ppf-chart svg { display: block; width: 100%; max-width: 640px; margin-inline: auto; }
.chart-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 17px; color: var(--muted); font-size: 12px; }
.chart-line { display: inline-block; width: 17px; border-top: 2px solid var(--heading); vertical-align: middle; margin-right: 3px; }
.chart-line.new { border-top-style: dashed; border-color: var(--accent); }
.chart-grid { stroke: var(--line); }
.chart-axis, #ppf-guides { stroke: var(--control-line); }
#ppf-curve { stroke: var(--heading); }
#ppf-new-curve { stroke: var(--accent); }
#ppf-halo { fill: var(--accent-line); opacity: .36; }
#ppf-point { fill: var(--accent); stroke: var(--surface); }
.axis-label { fill: var(--heading); font-size: 18px; }
.tick-label { fill: var(--muted); font-size: 16px; }
.point-label { fill: var(--accent); font: 700 17px var(--font-number); }
.chart-footnote { text-align: center; color: var(--muted); font-size: 12px; }
.ppf-controls { display: flex; flex-direction: column; gap: 8px; padding: 23px; border-left: 1px solid var(--line); }
.ppf-controls h3 { font-size: 17px; }
.ppf-outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 7px; }
.ppf-outputs div { border-bottom: 1px solid var(--line); padding: 0 2px 5px; }
.ppf-outputs span { display: block; color: var(--muted); font-size: 13px; }
.ppf-outputs strong { color: var(--heading); font: 600 28px/1.35 var(--font-number); }
.range-label, .range-ends { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 13px; }
.range-label output { color: var(--accent); font: 650 13px var(--font-number); }
input[type=range] { width: 100%; min-height: 25px; margin: 0; cursor: pointer; }
.ppf-scenarios { display: grid; min-width: 0; gap: 5px; margin: 7px 0; padding: 0; border: 0; }
.ppf-scenarios legend { padding: 0 0 5px; color: var(--heading); font-weight: 640; font-size: 14px; }
.ppf-scenarios label { display: flex; align-items: center; min-height: 29px; gap: 7px; color: var(--text); font-size: 13px; cursor: pointer; }
.ppf-explanation { min-height: 6em; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); font-size: 13px; }
.ppf-controls .button-row { margin-top: 4px; }
.visual-notes { display: grid; margin: 18px 0 9px; }
.visual-notes > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.visual-notes dt { color: var(--accent); font-weight: 650; font-size: 14px; }
.visual-notes dd { color: var(--muted); font-size: 14px; }

/* Catalog */
.home-hero { padding: 20px 0 29px; }
.home-hero p { margin-top: 12px; color: var(--muted); }
.catalog-section + .catalog-section { margin-top: 29px; }
.catalog-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.catalog-heading span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 23px; }
.catalog-card { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); border-radius: 6px; }
.catalog-card h3 { color: inherit; font-size: 14px; font-weight: 520; }
.catalog-card .chapter-no, .catalog-status { font-size: 12px; }
.catalog-meta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.catalog-progress { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 560 11px/1.5 var(--font-number); }
.catalog-status { white-space: nowrap; }
.catalog-card.ready { color: var(--accent); font-weight: 650; }
.catalog-card.ready:hover { background: var(--accent-soft); }
.catalog-card.ready h3 { font-weight: 670; }

/* Practice and feedback */
#quiz { max-width: 960px; font-size: 15px; }
.quiz-toolbar, .quiz-tabs, .quiz-grid, .quiz-card-header, .quiz-actions, .quiz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.quiz-toolbar, .quiz-card-header, .quiz-actions { justify-content: space-between; }
.quiz-toolbar { gap: 10px 20px; }
.quiz-tabs { gap: 6px; }
.quiz-tab { border: 1px solid transparent; border-radius: var(--radius); padding: 8px 12px; min-height: 42px; font-size: 14px; white-space: nowrap; }
.quiz-tab:hover, .quiz-tab.active { color: var(--accent); background: var(--accent-soft); }
.quiz-tab.active { border-color: var(--accent-line); font-weight: 650; }
.quiz-index { display: grid; gap: 10px; margin: 15px 0; }
.quiz-grid { gap: 6px; }
.quiz-group-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.quiz-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--radius); font: 550 13px var(--font-number); }
.quiz-number:hover, .quiz-number.answered { border-color: var(--accent); color: var(--accent); }
.quiz-number.correct { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.quiz-number.wrong { background: var(--error-soft); color: var(--error); border-color: var(--error-line); }
.quiz-number.active { outline: 2px solid var(--accent); outline-offset: -2px; }
.quiz-number:focus-visible { outline-offset: 3px; }
.quiz-card { padding: clamp(17px, 3vw, 34px); }
.quiz-card-header { gap: 6px 14px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.quiz-favorite { min-height: 38px; padding: 5px 10px; font-size: 13px; }
.quiz-favorite[aria-pressed=true] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.quiz-stem { font-size: clamp(17px, 1.7vw, 21px); line-height: 1.65; margin-bottom: 15px; }
.quiz-options { display: grid; min-width: 0; gap: 8px; padding: 0; border: 0; margin: 0; }
.quiz-options legend { color: var(--muted); font-size: 13px; padding: 0 0 6px; }
.quiz-option { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px; min-height: 45px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.quiz-option:focus-within, .quiz-option:hover { border-color: var(--control-line); }
.quiz-option input { flex: none; margin: 0; }
.quiz-option:has(input:checked), .quiz-option.correct { background: var(--accent-soft); border-color: var(--accent-line); color: var(--text); }
.quiz-option.wrong { background: var(--error-soft); border-color: var(--error-line); color: var(--error); }
.quiz-option:has(input:disabled) { cursor: default; }
.quiz-actions { margin-top: 16px; }
.quiz-feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 17px; }
.quiz-feedback h3, .quiz-feedback p { margin-bottom: 8px; }
.quiz-feedback h4 { margin: 16px 0 5px; font-size: 15px; }
.quiz-feedback p, .quiz-rationale-list { line-height: 1.85; }
.quiz-rationale-list { padding-left: 1.5em; margin: 6px 0 0; }
.quiz-rationale-list li + li { margin-top: 5px; }
.quiz-correct { color: var(--accent); }
.quiz-incorrect { color: var(--error); }
.quiz-summary { margin-top: 14px; padding: 13px 17px; border-radius: var(--radius); background: var(--accent-soft); }
.quiz-summary strong { font: 650 23px var(--font-number); color: var(--accent); }
.quiz-summary p { margin: 7px 0; }
.quiz-status { color: var(--muted); font-size: 13px; margin-top: 8px; }
.quiz-status:empty { display: none; }
.quiz-empty { padding: 25px; margin-top: 14px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }

/* Records, dialogs and status */
dialog { width: min(600px, calc(100% - 24px)); max-height: 85dvh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.modal-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 19px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-top h2 { font-size: 18px; }
#modal-content { padding: 19px; font-size: 14px; }
#modal-content p + p { margin-top: 10px; }
.record-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.record-stats > div { background: var(--surface-subtle); padding: 10px; border-radius: var(--radius); }
.record-stats strong, .record-stats small { display: block; }
.record-stats strong { color: var(--accent); font: 650 19px var(--font-number); }
.record-stats small { color: var(--muted); font-size: 12px; }
.record-actions { margin: 12px 0; }
.favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 0; }
.favorite-item > button:first-child { text-align: left; }
.favorite-item small { display: block; color: var(--muted); }
.favorite-item > button:last-child { white-space: nowrap; }
.inline-notice, .storage-notice, .noscript { padding: 10px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; }
.inline-notice { margin-block: 8px; border-radius: var(--radius); }
.inline-notice .button { margin-top: 8px; }
.toast { position: fixed; inset: auto auto 20px 50%; transform: translateX(-50%); z-index: 8; max-width: min(440px, 90vw); width: max-content; padding: 10px 16px; border-radius: var(--radius); background: var(--heading); color: var(--surface); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .reading-layout { gap: 15px; grid-template-columns: minmax(0, 1fr) minmax(135px, 158px); }
  .catalog-grid { grid-template-columns: 1fr; }
  .ppf-panel { grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); }
}

@media (max-width: 920px) {
  .reading-layout { grid-template-columns: minmax(0, 1fr); }
  .topic-index { grid-column: 1; grid-row: 1; position: static; padding-top: 0; }
  .reading-column { grid-row: 2; }
  .lesson-jump { display: flex; flex-wrap: wrap; gap: 5px 8px; }
  .lesson-jump a { margin-left: 0; padding: 4px 7px; background: var(--surface-subtle); }
  .ppf-panel { grid-template-columns: minmax(0, 1fr); }

}

  :root { --header-height: 61px; --tabs-height: 48px; }

  .brand-mark { width: 25px; height: 25px; }
  .brand small { font-size: 10px; }
  .top-actions { margin-left: auto; gap: 7px; }
  .top-actions .header-link { display: none; }
  .github-link { width: 34px; height: 34px; }
  .theme-control { --theme-slot: 28px; }
  .download-button { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  .mobile-menu { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--radius); color: var(--heading); }
  .mobile-menu span { position: relative; display: block; height: 1.5px; width: 16px; background: currentColor; }
  .mobile-menu span::before, .mobile-menu span::after { content: ''; position: absolute; left: 0; width: 100%; height: 100%; background: currentColor; }
  .mobile-menu span::before { top: -5px; }
  .mobile-menu span::after { top: 5px; }
  .layout { display: block; }
  .sidebar { display: none; position: fixed; inset: var(--header-height) auto auto 0; width: min(285px, 90vw); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) 0; box-shadow: var(--shadow); }
  .sidebar.open { display: block; }
  .sidebar-quick-actions { display: flex; gap: 8px; margin: 0 0 10px; }
  .sidebar-quick-actions button { padding: 7px 8px; background: var(--accent-soft); border-radius: var(--radius); color: var(--accent); font-size: 13px; }
  main { padding: 19px 15px 35px; }
  .breadcrumb { margin-bottom: 13px; font-size: 12px; }
  .chapter-description { margin-top: 6px; font-size: 14px; }

  .view-tabs { gap: 2px; margin: 8px 0 16px; }
  .view-tabs button { flex: 1; padding-inline: 2px; font-size: 13px; }
  .topic-index h2 { margin-bottom: 5px; }
  .lesson-jump { gap: 4px; }
  .lesson-jump a { grid-template-columns: 20px minmax(0, 1fr); gap: 2px; font-size: 12px; }
  .lesson-card { padding: 20px 14px; }
  .lesson-head { gap: 7px; }
  .lesson-head .icon-button { width: 34px; height: 38px; }
  .lesson-body { font-size: 15px; }
  .lesson-extras { grid-template-columns: 1fr; gap: 10px; }
  .lesson-body :where(th, td) { padding: 7px; }
  .lesson-body table { font-size: 12px; }
  .map-toolbar { padding: 8px; gap: 6px; }
  .map-toolbar button { padding-inline: 8px; }
  .mindmap { --map-arm: .8em; padding: 1.2em .9em; }
  .map-item[data-depth='1'] > .map-node .map-label { max-width: 10.5em; }
  .ppf-chart { padding-inline: 6px; }
  .ppf-controls { padding: 15px; }
  .home-hero { padding-top: 9px; padding-bottom: 22px; }
  .quiz-grid { gap: 5px; }

@media (max-width: 430px) {
  .topbar { padding-inline: 10px; gap: 6px; }
  .brand { font-size: 15px; gap: 5px; }
  .brand-mark { width: 22px; height: 22px; }
  .mobile-menu { width: 34px; }
  .github-link { width: 32px; height: 32px; }

  .download-button { padding-inline: 7px; font-size: 12px; }
}

@media (max-width: 360px) {
  .theme-control { --theme-slot: 24px; }
  .inline-visual, .inline-practice, .inline-quiz-card { padding: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .theme-thumb { transition: transform .18s ease-out; }
  .button:not(:disabled):active, .download-button:active { transform: translateY(1px); }
}

@media print {
  :root, :root[data-theme] { color-scheme: light; --background: #fff; --surface: #fff; --text: #22373c; --heading: #182c30; --muted: #43585c; --accent: #1a665b; --accent-soft: #edf5f2; }

  .layout, .reading-layout { display: block; }
  main { padding: 0; }
  .lesson-card { break-inside: avoid; }
}

.market-panel { --market-supply: #9c4a2f; }
[data-theme="dark"] .market-panel { --market-supply: #f6a48a; }
.market-demand-line { border-color: var(--accent); }
.market-supply-line { border-color: var(--market-supply); border-top-style: dashed; }
.market-baseline { border-color: var(--control-line); border-top-style: dotted; }
.market-demand, .market-supply, .market-guide { fill: none; }
.market-demand { stroke: var(--accent); }
.market-supply { stroke: var(--market-supply); stroke-dasharray: 8 3; }
.market-curve { stroke-width: 2.6; }
.market-before { opacity: .5; stroke-width: 1.5; stroke-dasharray: 2 5; }
.market-inactive { display: none; }
.market-guide { stroke: var(--control-line); stroke-dasharray: 3 4; }
.market-equilibrium-guide { opacity: .6; }
.market-demand-point { fill: var(--accent); }
.market-supply-point { fill: var(--market-supply); }
.market-equilibrium { fill: var(--surface); stroke: var(--heading); stroke-width: 2.2; }
.market-panel input[type="range"] { width: 100%; margin: 0 0 7px; }
.market-panel .ppf-explanation { min-height: 0; }
.market-outputs { margin-top: 0; }

/* Micro interactive charts */
.micro-panel { --mv-c1: var(--accent); --mv-c2: #b85633; --mv-c3: #5b6fc7; }
[data-theme="dark"] .micro-panel { --mv-c2: #f4a07e; --mv-c3: #9cb0ff; }
.mv-grid-box { fill: none; stroke: var(--line); stroke-width: 1; opacity: .7; }

<script>window.STUDY_CONTENT={"chapter":{"id":"chapter28","number":3,"title":"保险合同","moduleId":"insurance","moduleTitle":"保险基础","downloadName":"保险基础-03-保险合同-离线学习.html","visuals":[]},"lessons":{"title":"保险合同","subtitle":"从投保申请到理赔和终止，分清合同角色、各阶段的法律条件和容易混淆的手续。","sections":[{"id":"insurance-contract","title":"保险合同及其特性","summary":"合同当事人是投保人与保险人，典型特征包括双务、有偿、射幸和附和。","bodyHtml":"\u003cp>\u003cstrong>保险合同\u003c/strong>是投保人与保险人约定保险权利义务关系的协议。投保人按约定付保费，保险人按约定承担风险并在保险事故或约定给付条件满足时履行赔偿或给付责任。\u003c/p>\u003cp>\u003cstrong>双务性\u003c/strong>指双方互负义务。\u003cstrong>射幸性\u003c/strong>指订约时赔付是否发生、发生时点或金额具有不确定性。\u003cstrong>条件性\u003c/strong>指赔偿或给付要满足合同所定条件。\u003cstrong>附和性\u003c/strong>与预先拟定并重复使用的格式条款有关。\u003cstrong>补偿性\u003c/strong>主要体现于财产保险和费用补偿型产品。\u003cstrong>个人性\u003c/strong>指保险人承保时要考虑具体主体的利益和风险，例如个人寿险会依被保险人健康状况核保。双方掌握的信息存在差异，也形成告知和说明义务的需要。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 10、11、14、16、17、30 条分别规定合同定义、公平协商、履行、告知说明和格式条款解释。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>\u003c/p>","keyTakeaway":"“双方各负义务”是双务性，“最终赔付存在不确定性”是射幸性，“格式条款预先拟定”体现附和性。","pitfall":"没有获得赔付时，保险人在约定期间内仍提供了风险保障。","example":"为厂房购买一年火险后，厂房全年未发生承保事故，保险人未支付赔款，体现射幸性。"},{"id":"contract-forms","title":"保险合同的文件形式","summary":"按申请、证明、临时保障、书面变更四个用途辨认文件。","bodyHtml":"\u003cp>\u003cstrong>投保单\u003c/strong>通常用于投保人提出书面投保要求。\u003cstrong>保险单\u003c/strong>载明已经约定的合同内容，\u003cstrong>保险凭证\u003c/strong>可以作为其简化书面证明。\u003cstrong>暂保单\u003c/strong>记载约定的临时保障。\u003cstrong>批单\u003c/strong>常用于证明合同已有变更。依法可调取、能有形表现所载内容的数据电文可以视作书面形式。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 13 条区分承保合意与签发保险单等文件，第 20 条规定协商变更及批注、附贴批单或书面协议。《民法典》第 469 条规定书面形式及数据电文。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/202006/t20200602_463886.shtml\">最高人民检察院 · 民法典\u003c/a>\u003c/p>","keyTakeaway":"记住“投保单是申请，保险单和保险凭证是证明，暂保单是临时保障，批单是变更记录”。","pitfall":"保费收据证明收款。判断合同成立还要查保险人是否同意承保，或是否符合特定司法解释条件。","example":"企业提交财产险投保单，保险人同意承保后签发保险单。双方随后书面调整保障范围，可以出具批单。"},{"id":"contract-roles","title":"合同主体、客体和内容","summary":"分清当事人、关系人、中介，以及保险标的和保险利益。","bodyHtml":"\u003cp>保险人、投保人属于\u003cstrong>当事人\u003c/strong>。被保险人、受益人通常称\u003cstrong>关系人\u003c/strong>，同一人可以兼有多种身份。人身保险受益人由被保险人或投保人指定，投保人指定或变更时须经被保险人同意。死亡保险金在未指定、无法确定受益人等法定情形下作为被保险人遗产。\u003c/p>\u003cp>保险标的是合同承保的财产及相关利益或人的寿命、身体。按保险合同三要素的分析框架，合同客体强调对标的的可保利益。\u003cstrong>合同内容\u003c/strong>是有关各方的权利义务及相关事项，包括保险责任、免责、保险期间、金额、保费及赔付办法。\u003cstrong>基本条款\u003c/strong>规定主要内容，\u003cstrong>附加条款\u003c/strong>在此基础上增减约定。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 10、12、18、39–42 条规定合同角色、合同事项和受益人制度。受益人还负有第 21、22 条所涉通知和提供有关证明资料的义务。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>\u003c/p>","keyTakeaway":"主体问“谁参与”，客体问“保障什么利益”，内容问“双方有哪些权利义务”。","pitfall":"为有劳动关系的员工投保人身保险时，指定的受益人范围受第 39 条限制。","example":"张女士向保险公司为自己投保，兼为投保人和被保险人。她依法指定受益人后，该受益人可以在约定给付条件满足时请求保险金。"},{"id":"insurance-intermediaries","title":"保险代理人、经纪人和公估人","summary":"按委托来源、服务立场和服务内容区分三类保险中介。","bodyHtml":"\u003cp>\u003cstrong>保险代理人\u003c/strong>接受保险人委托，在授权范围内代为办理业务。\u003cstrong>保险经纪人\u003c/strong>基于投保人利益提供订立合同的中介服务并依法收费。\u003cstrong>保险公估人\u003c/strong>提供保险标的评估、事故查勘、损失鉴定和理算等专业服务。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 117、118、129 条规定代理、经纪和评估鉴定机构的相关规则，监管部门对保险中介经营的许可或备案按业务类型区分。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.nfra.gov.cn/branch/guangxi/view/pages/common/ItemDetail.html?docId=1172095&amp;itemId=1612\">国家金融监督管理总局广西监管局 · 保险中介资质提示\u003c/a>\u003c/p>","keyTakeaway":"代理看保险人委托，经纪看投保人利益，公估看评估和查勘理算。","pitfall":"题目一般问保险中介的职能分类。特定销售规章中的适用对象应按该规章定义判断。","example":"企业请经纪机构比较不同保险公司的货运险方案。出险后，公估机构可以受托查勘并估算货损。"},{"id":"contract-formation","title":"订立、成立、生效和责任开始","summary":"按顺序核对投保要求、同意承保、效力和责任开始时间。","bodyHtml":"\u003cp>投保人提出保险要求且保险人同意承保，保险合同成立。依法成立的合同通常自成立时生效，双方可以约定生效附条件或附期限。\u003cstrong>保险责任开始时间\u003c/strong>按合同约定确定，可能与成立日不同。\u003c/p>\u003cp>在人身保险中，投保人订立时对被保险人没有保险利益的，合同无效。财产保险要求事故发生时被保险人对标的有保险利益，缺乏该利益会影响请求赔偿。投保单已收且已收费、保险人尚未表示承保而发生事故时，应结合司法解释的承保条件规则判断。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对《保险法》第 12–14、31、48 条和保险法司法解释（二）第 4 条。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://cicc.court.gov.cn/html/1/380/385/12841.html\">最高人民法院 · 保险法司法解释\u003c/a>\u003c/p>","keyTakeaway":"成立看合意，生效看法律和约定，赔付还须看保险责任开始时间。","pitfall":"财险订约时缺少保险利益和财险出险时缺少保险利益的后果不同，勿将后者称为合同效力待定。","example":"保险人 5 月 1 日同意承保，双方约定 5 月 5 日零时起承担责任。判断 5 月 3 日的事故时，单看承保同意日不够。"},{"id":"contract-performance","title":"合同履行与理赔费用","summary":"事故通知、危险增加通知、减损和费用承担要对应各自义务人。","bodyHtml":"\u003cp>投保人依约缴费。投保人、被保险人或者受益人知道保险事故发生后，应及时通知保险人，申请赔付时按要求提供其所能提供的相关证明资料。财产险标的危险程度显著增加时，被保险人按合同及时通知。事故发生时，被保险人尽力采取必要措施防止或减少损失。\u003c/p>\u003cp>保险人收到申请后应依法核定和通知，符合责任的按期履行赔偿或给付义务。财产保险中，必要、合理的\u003cstrong>施救费用\u003c/strong>在标的损失赔偿外另计，最高不超过保险金额。保险人、被保险人为查明事故性质、原因和损失程度支付的必要、合理费用由保险人承担。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。《保险法》第 14、21–25、51、52、57、64 条分别规定交费、理赔、标的安全、风险增加、减损和查明费用。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>\u003c/p>","keyTakeaway":"先识别投保人和被保险人是否为同一主体，再判断具体义务。","pitfall":"事故发生通知与危险增加通知是两项不同义务。查定费用与施救费用要分别审查必要性、合理性和适用限制。","example":"足额财险承保损失 100 万元，施救和查明事故各有必要合理费用 10 万元，题设没有其他扣减时合计 120 万元。"},{"id":"contract-change","title":"合同变更和标的转让","summary":"区分变更受益人、协商修改条款、财产标的转让后承继权利义务。","bodyHtml":"\u003cp>保险人与投保人可以协商变更合同内容，通常以批注、批单或书面协议确认。人身保险受益人变更须书面通知保险人，投保人提出变更还须经被保险人同意。个人寿险更换被保险人会改变承保的寿命、身体和风险，通常需要重新核保和订约。\u003c/p>\u003cp>财产保险标的转让时，受让人依法承继被保险人的权利义务。一般由被保险人或受让人及时通知保险人，\u003cstrong>货物运输保险和另有约定的合同\u003c/strong>属于通知义务的例外。转让导致危险显著增加时，应另看保险人的增费或解除权。海上货物运输保险合同可以背书或以其他方式转让。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对《保险法》第 20、34、41、49 条与自 2026 年 5 月 1 日施行的《海商法》第 255 条。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.js.msa.gov.cn/art/2026/1/5/art_842_2101.html\">江苏海事局 · 海商法\u003c/a>\u003c/p>","keyTakeaway":"“承继被保险人的权利义务”“通知保险人”“征得同意”分别判断。","pitfall":"受让人承继被保险人地位，不能据此一并推定投保人资格自动转移。死亡给付保单转让或质押还应核对被保险人书面同意要求。","example":"货主背书转让海上货物运输保险合同时，相关合同权利义务随转让移转。"},{"id":"contract-termination","title":"合同中止、解除、终止与无效","summary":"先分清合同效力状态，再检查解除权主体、法定事由和期限。","bodyHtml":"\u003cp>\u003cstrong>自然终止\u003c/strong>常见于保险期满，履约终止可能发生在合同义务全部完成时。\u003cstrong>解除\u003c/strong>可以来自协商一致、法定事由或约定的解除条件。保险法原则上允许投保人解除，保险人解除须有法律或合同依据。违反义务可能形成解除事由，仍须核对法定条件。\u003cstrong>中止\u003c/strong>是暂时停止效力，例如分期寿险在满足首期已付且逾期等条件时可以中止，双方可以协商并补费复效。中止满两年未达成协议时，保险人有权解除并依约退还现金价值。\u003c/p>\u003cp>投保人故意或因重大过失未如实告知，并且足以影响承保或费率时，才进入相应解除权审查。还要核对知情后 30 日与合同成立后两年的限制。投保人、被保险人故意制造保险事故与受益人故意造成被保险人死亡、伤残、疾病，适用不同后果。\u003cstrong>无效\u003c/strong>涉及法定效力瑕疵，例如人身保险订立时欠缺保险利益。违反法律、行政法规的强制性规定时，还应审查该规定是否导致民事法律行为无效。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对《保险法》第 15、16、27、31、36、37、42、43、50、51 条和《民法典》第 153、557、562–563 条。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/202006/t20200602_463886.shtml\">最高人民检察院 · 民法典\u003c/a>\u003c/p>","keyTakeaway":"“无效”问合同是否取得法律效力，“解除”问有效合同是否可以提前结束，“中止”问效力能否暂时停下并恢复。","pitfall":"保险费违约、安全义务违约、未告知和故意制造事故分别适用相应规则。货运险和运输工具航程保险在保险责任开始后存在法定解除限制。","example":"分期寿险中止后，双方达成复效协议，投保人补交保费，合同效力恢复。"},{"id":"contract-interpretation","title":"保险合同争议与条款解释","summary":"结合用词、上下文和当事人意思解释条款，格式条款争议有适用条件。","bodyHtml":"\u003cp>\u003cstrong>文义解释\u003c/strong>从文字通常含义及上下文入手。\u003cstrong>意图解释\u003c/strong>结合合同目的、相关条款、交易习惯和诚信原则确认意思表示。条款有缺漏时，可以依法通过补充协议、相关条款或交易习惯等补充。保险凭证记载冲突时，还要结合投保单、经确认的变更、非格式条款及形成时间等适用具体规则。\u003c/p>\u003cp>采用保险人提供的格式条款订约时，应先按通常理解解释。若条款有两种以上解释，法院或仲裁机构应作出有利于被保险人和受益人的解释。有效协商的非格式条款与格式条款冲突时，适用非格式条款。\u003c/p>\u003cp>官方核验（2026 年 11 月 11 日）。核对《保险法》第 30 条、《民法典》第 142、466、498、510 条和保险法司法解释（二）第 14 条。\u003ca href=\"https://www.nfra.gov.cn/cn/view/pages/rulesDetail.html?docId=879931\">国家金融监督管理总局 · 保险法\u003c/a>　\u003ca href=\"https://www.spp.gov.cn/spp/zdgz/202006/t20200602_463886.shtml\">最高人民检察院 · 民法典\u003c/a>　\u003ca href=\"https://cicc.court.gov.cn/html/1/380/385/12841.html\">最高人民法院 · 保险法司法解释\u003c/a>\u003c/p>","keyTakeaway":"先看通常理解。格式条款确有两种以上解释时，适用有利于被保险人和受益人的规则。","pitfall":"批单记载产生冲突时，要确认变更经当事人依法同意以及相应法律适用条件。","example":"如果某个保险人提供的格式用语结合合同上下文后仍存在两种合理解释，法院适用《保险法》第 30 条。"}],"mindmap":[{"label":"概念与特性","target":"insurance-contract","children":[{"label":"投保人与保险人约定权利义务","target":"insurance-contract","children":[{"label":"缴纳保费与承担赔偿或给付责任","target":"insurance-contract"}]},{"label":"合同特性","target":"insurance-contract","children":[{"label":"双务性与射幸性","target":"insurance-contract"},{"label":"补偿性与条件性","target":"insurance-contract"},{"label":"附和性与格式条款","target":"contract-interpretation"},{"label":"个人性与被保险人风险","target":"contract-change"}]}]},{"label":"形式和内容","target":"contract-forms","children":[{"label":"合同文件","target":"contract-forms","children":[{"label":"投保单、保险单、保险凭证","target":"contract-forms"},{"label":"暂保单、批单","target":"contract-forms"}]},{"label":"合同的三要素","target":"contract-roles","children":[{"label":"当事人和关系人","target":"contract-roles"},{"label":"客体与可保利益","target":"contract-roles"},{"label":"权利义务与保险条款","target":"contract-roles"}]},{"label":"合同辅助人","target":"insurance-intermediaries","children":[{"label":"保险代理人","target":"insurance-intermediaries"},{"label":"保险经纪人","target":"insurance-intermediaries"},{"label":"保险公估人","target":"insurance-intermediaries"}]}]},{"label":"订立、履行、变更与终止","target":"contract-formation","children":[{"label":"订立","target":"contract-formation","children":[{"label":"合同成立","target":"contract-formation","children":[{"label":"要约与承诺","target":"contract-formation"}]},{"label":"生效与责任开始","target":"contract-formation","children":[{"label":"附条件或附期限","target":"contract-formation"}]}]},{"label":"履行","target":"contract-performance","children":[{"label":"投保人和被保险人的基本义务","target":"contract-performance"},{"label":"保险人的基本义务","target":"contract-performance"}]},{"label":"变更","target":"contract-change","children":[{"label":"关系人变更","target":"contract-change","children":[{"label":"被保险人和受益人的变更","target":"contract-change"}]},{"label":"合同内容变更","target":"contract-change"}]},{"label":"终止与中止","target":"contract-termination","children":[{"label":"期满和履约完成","target":"contract-termination"},{"label":"法定、约定与协商解除","target":"contract-termination"},{"label":"违约后的法律后果","target":"contract-termination"},{"label":"效力中止与复效","target":"contract-termination"}]},{"label":"争议与解释","target":"contract-interpretation","children":[{"label":"文义与意图","target":"contract-interpretation"},{"label":"有利于被保险人和受益人","target":"contract-interpretation"},{"label":"凭证冲突和补充解释","target":"contract-interpretation"}]}]}]},"questions":[{"id":"ins-03-q01","number":1,"group":"保险合同的概念与特性","type":"single","stem":"保险合同是（　）与保险人约定保险权利义务关系的协议。","options":{"A":"投保人","B":"当事人","C":"投保人或被保险人","D":"关系人"},"answer":["A"],"explanationSupplement":"识别题干已经给出的保险人，另一方应填投保人。被保险人可以同时是投保人，但两种身份的含义不同。","optionExplanations":{"A":"投保人是提出保险要求并负担保费的一方。","B":"“当事人”概括双方，题目需要填明确的一方。","C":"作为被保险人的身份本身不等于订立合同的一方。","D":"被保险人、受益人通常称合同关系人。"},"conceptId":"insurance-contract"},{"id":"ins-03-q02","number":2,"group":"保险合同的概念与特性","type":"single","stem":"保险合同中投保人依约定缴纳保费，但保险人的保险赔偿或给付义务，只有当承保范围内的风险实际发生时才发生，这说明了保险合同是（　）。","options":{"A":"附和合同","B":"最大诚信合同","C":"射幸合同","D":"保障合同"},"answer":["C"],"explanationSupplement":"“已缴费，赔付是否发生仍不确定”对应射幸性。有些人身保险按合同所定年龄或期限等条件给付，题面以事故给付为例。","optionExplanations":{"A":"附和性描述格式条款的订约方式。","B":"最大诚信关注如实告知和说明等行为。","C":"实际赔付取决于不确定事件，符合题意。","D":"保障是功能描述，此处考查给付结果的不确定性。"},"conceptId":"insurance-contract"},{"id":"ins-03-q03","number":3,"group":"保险合同的概念与特性","type":"single","stem":"保险合同对当事人双方诚信的要求远远高于其他合同，其主要原因是（　）。","options":{"A":"保险双方地位不平等","B":"保险合同的复杂性","C":"保险标的的不确定性","D":"保险双方信息的不对称性"},"answer":["D"],"explanationSupplement":"投保人可能更了解身体和财产风险，保险人更了解产品设计与限制。法律通过询问告知、提示说明等制度改善双方信息。","optionExplanations":{"A":"合同当事人的市场地位差异并非题目所问的核心机制。","B":"条款复杂会增加理解难度，核心仍是双方信息不同。","C":"保险事故可能不确定，保险标的通常可识别。","D":"各方掌握不同信息，解释了更高的告知与说明要求。"},"conceptId":"insurance-contract"},{"id":"ins-03-q04","number":4,"group":"保险合同的概念与特性","type":"single","stem":"生活中有的人抱怨买保险不划算，因为交了保险费以后如果不发生保险事故，一分钱也得不到。这充分反映了保险合同的（　）特征。（2020）","options":{"A":"双务性","B":"射幸性","C":"附和性","D":"补偿性"},"answer":["B"],"explanationSupplement":"即使没有实际赔款，保险人在保险期间仍承担了约定风险。题目问赔付结果的特点。","optionExplanations":{"A":"双务性看双方承担的义务。","B":"赔付是否发生取决于不确定的承保事故。","C":"附和性看条款是否预先拟定。","D":"补偿性看赔偿与实际损失的关系。"},"conceptId":"insurance-contract"},{"id":"ins-03-q05","number":5,"group":"保险合同的概念与特性","type":"single","stem":"在处理保险合同争议时，如果保险合同条款含义不清，通常采取有利于被保险人的解释原则进行解释和处理，其原因在于（　）。（2023）","options":{"A":"保险合同是双务性合同","B":"保险合同是射幸性合同","C":"保险合同是附和性合同","D":"保险合同是条件性合同"},"answer":["C"],"explanationSupplement":"《保险法》第 30 条先要求按通常理解解释。对保险人提供的格式条款存在两种以上解释时，法院或者仲裁机构作有利于被保险人和受益人的解释。","optionExplanations":{"A":"双方互负义务不产生该解释规则。","B":"赔付是否发生的不确定性不涉及条款由谁拟定。","C":"预拟格式条款正是该规则的适用背景。","D":"条件性描述保险赔偿或给付的触发条件。"},"conceptId":"contract-interpretation"},{"id":"ins-03-q06","number":6,"group":"保险合同的形式和内容","type":"single","stem":"（　）是保险合同成立的一种书面证明，也称小保单。","options":{"A":"保险费收据","B":"投保单","C":"保险凭证","D":"暂保单"},"answer":["C"],"explanationSupplement":"看到“小保单”先想到保险凭证。暂保单则用于证明一段约定的临时保障。","optionExplanations":{"A":"收据用于证明已经收取保费。","B":"投保单载明投保申请。","C":"保险凭证是简化的书面合同证明。","D":"暂保单的关键是临时保障。"},"conceptId":"contract-forms"},{"id":"ins-03-q07","number":7,"group":"保险合同的形式和内容","type":"single","stem":"投保人为订立保险合同而向保险人提出书面要约的形式是（　）。","options":{"A":"暂保单","B":"保险凭证","C":"投保单","D":"保险单"},"answer":["C"],"explanationSupplement":"先看出具人和文件方向。投保人向保险人递交的是投保单，保险人同意承保后一般签发保险单或保险凭证。","optionExplanations":{"A":"暂保单记录临时保障。","B":"保险凭证用于证明已约定的保险。","C":"投保人借此提出书面要约。","D":"保险单记载合同约定内容。"},"conceptId":"contract-forms"},{"id":"ins-03-q08","number":8,"group":"保险合同的形式和内容","type":"single","stem":"投保人为订立保险合同而向保险人提出书面要约的形式是（　）。","options":{"A":"暂保单","B":"保险凭证","C":"投保单","D":"保险单"},"answer":["C"],"explanationSupplement":"《保险法》第 13 条以投保人提出要求、保险人同意承保作为合同成立的判断框架，投保单对应前一步。","optionExplanations":{"A":"其用途是约定临时保险保障。","B":"是合同证明文件。","C":"是填写投保信息并申请保险的文件。","D":"通常在承保合意达成后由保险人签发。"},"conceptId":"contract-forms"},{"id":"ins-03-q09","number":9,"group":"保险合同的形式和内容","type":"single","stem":"（　）是投保人向保险人申请订立保险合同的书面要约。（2022）","options":{"A":"投保单","B":"保险单","C":"保险费","D":"保险凭证"},"answer":["A"],"explanationSupplement":"按时间线记忆，投保人先提交申请，保险人同意承保后签发保险单或其他保险凭证。保费按约定交纳。","optionExplanations":{"A":"对应书面投保申请。","B":"保险单证明已经约定的保险内容。","C":"保险费是款项，不是申请文件。","D":"保险凭证通常用作合同证明。"},"conceptId":"contract-forms"},{"id":"ins-03-q10","number":10,"group":"保险合同的形式和内容","type":"single","stem":"受益人是指（　）。","options":{"A":"保险合同中由被保险人指定的享有保险金请求的人","B":"人身保险合同中由被保险人或者投保人指定享有保险金请求权的人","C":"投保人、被保险人不可以成为受益人","D":"受益人只是受益主体，不承担任何义务"},"answer":["B"],"explanationSupplement":"注意第 39 条关于指定人的规则。投保人也可以指定，但须经被保险人同意。知道保险事故后的通知和理赔时提供材料等规则也可能适用于受益人。","optionExplanations":{"A":"范围应限定人身保险，且指定主体遗漏投保人。","B":"同时覆盖险种、指定主体和保险金请求权。","C":"依法符合条件时，投保人或被保险人均可以成为受益人。","D":"《保险法》第 21、22 条明确相应通知、资料义务。"},"conceptId":"contract-roles"},{"id":"ins-03-q11","number":11,"group":"保险合同的形式和内容","type":"single","stem":"保险合同的双方当事人是保险人和（　）。（2021）","options":{"A":"保险代理人","B":"被保险人","C":"受益人","D":"投保人"},"answer":["D"],"explanationSupplement":"“当事人”按合同缔结身份识别。投保人、被保险人和受益人可能由同一人兼任，也可能各不相同。","optionExplanations":{"A":"代理人是在授权范围内办业务的辅助者。","B":"被保险人通常是合同关系人，可同时兼任投保人。","C":"受益人通过指定等取得保险金请求权。","D":"投保人是提出投保要求并按约定付费的一方。"},"conceptId":"contract-roles"},{"id":"ins-03-q12","number":12,"group":"保险合同的形式和内容","type":"single","stem":"保险经纪人是基于（　）的利益提供中介服务的机构。（2022）","options":{"A":"保险人","B":"投保人","C":"被保险人","D":"受益人"},"answer":["B"],"explanationSupplement":"对比第 117 条。保险代理人依据保险人委托开展业务，保险经纪人基于投保人利益提供订约服务。","optionExplanations":{"A":"保险人的委托对应保险代理关系。","B":"符合保险经纪人的法定定义。","C":"被保险人可能与投保人同一，法律定义仍使用投保人。","D":"受益人是请求保险金的角色，未对应经纪人的法定定义。"},"conceptId":"insurance-intermediaries"},{"id":"ins-03-q13","number":13,"group":"保险合同的形式和内容","type":"multiple","stem":"下列属于保险中介的有（　）。（多选，2020）","options":{"A":"保险公司代表处","B":"保险代理人","C":"保险经纪人","D":"保险公估人"},"answer":["B","C","D"],"explanationSupplement":"按职能记忆。代理为保险人代办，经纪协助投保人订约，公估承担评估、查勘和理算等专业服务。","optionExplanations":{"A":"保险公司代表处属于保险公司相关机构。","B":"代理人依法接受保险人委托办理业务。","C":"经纪人提供订立保险合同的中介服务。","D":"公估人提供查勘和损失评估等服务。"},"conceptId":"insurance-intermediaries"},{"id":"ins-03-q14","number":14,"group":"保险合同的形式和内容","type":"single","stem":"保险合同当事人之间由法律确认的权利和义务及相关事项是（　）。","options":{"A":"保险合同的主体","B":"保险合同的内容","C":"保险合同的客体","D":"保险合同的事项"},"answer":["B"],"explanationSupplement":"按三要素区分主体、客体和内容。《保险法》第 18 条列有保险责任、期间、金额、保费、赔付办法等典型事项。","optionExplanations":{"A":"主体指合同当事人和相关参与人。","B":"权利义务及其相关约定共同构成合同内容。","C":"在保险合同分析中强调与保险标的相关的可保利益。","D":"个别事项属于具体约定，题目考查三要素中的内容。"},"conceptId":"contract-roles"},{"id":"ins-03-q15","number":15,"group":"保险合同的形式和内容","type":"single","stem":"按照保险条款的性质不同，可将其分为（　）。","options":{"A":"基本条款和附加条款","B":"基本条款和保证条款","C":"基础条款和保证条款","D":"基础条款和附加条款"},"answer":["A"],"explanationSupplement":"基本条款确立主要权利义务，附加条款补充或调整约定。考试用语是“基本条款”。","optionExplanations":{"A":"这组术语对应题中分类。","B":"保证条款是特定约定，不能替代附加条款类别。","C":"“基础”和“保证”不符合题中分类术语。","D":"应使用“基本条款”这一术语。"},"conceptId":"contract-roles"},{"id":"ins-03-q16","number":16,"group":"保险合同的订立、履行、变更与终止","type":"discussion","stem":"订立合同时，投保人对被保险人不具有保险利益的，合同效力（　）。","options":{"A":"待定","B":"无效","C":"有效","D":"视合同性质而定，如果是财产保险合同，效力待定，若是人身保险合同，无效"},"answer":[],"explanationSupplement":"题干未直接限定险种。若理解为人身保险，B 对应《保险法》第 31 条。D 虽区分了险种，但财险“效力待定”的说法不符合第 12、48 条，故按讨论处理。","optionExplanations":{"A":"欠缺保险利益没有统一的效力待定后果。","B":"在人身保险语境下成立。","C":"人身保险不满足该订立条件时无效。","D":"人身保险部分成立，财险部分混淆了赔偿请求与合同效力。"},"conceptId":"contract-formation"},{"id":"ins-03-q17","number":17,"group":"保险合同的订立、履行、变更与终止","type":"single","stem":"（　）知道保险事故发生后，应当及时通知保险人。","options":{"A":"投保人","B":"被保险人","C":"受益人","D":"投保人、被保险人或者受益人"},"answer":["D"],"explanationSupplement":"题目考查完整列举。因故意或者重大过失未及时通知而使部分事项难以确定时，赔付后果还要结合法定条件及保险人是否已知悉事故判断。","optionExplanations":{"A":"投保人属于法定主体之一。","B":"被保险人也承担相应义务。","C":"受益人也在法定列举范围内。","D":"覆盖法定的三类通知主体。"},"conceptId":"contract-performance"},{"id":"ins-03-q18","number":18,"group":"保险合同的订立、履行、变更与终止","type":"single","stem":"保险人、被保险人为查明和确定保险事故的性质、原因和保险标的损失的程度所支付的必要的、合理的费用，由（　）承担。","options":{"A":"被保险人","B":"被保险人和保险人按照各自的责任","C":"保险人","D":"保险人根据被保险人的信用情况酌情"},"answer":["C"],"explanationSupplement":"抓住“性质、原因、损失程度”和“必要、合理”。这里是查明保险事故的费用，施救费用另有第 57 条规定。","optionExplanations":{"A":"由被保险人先行支付也可能依法由保险人承担。","B":"费用承担按第 64 条，题目未涉及按责任比例分担。","C":"对应法定的费用承担方。","D":"法律以费用目的、必要性和合理性为判断条件。"},"conceptId":"contract-performance"},{"id":"ins-03-q19","number":19,"group":"保险合同的订立、履行、变更与终止","type":"discussion","stem":"在保险合同中，投保人的义务包括（　）。（多选）","options":{"A":"按照约定的时间交纳保险费的义务","B":"保险事故发生的通知义务","C":"保险事故“危险增加”的通知义务","D":"保险事故发生时，避免保险标的损失扩大的义务"},"answer":[],"explanationSupplement":"题干没有说明投保人同时是被保险人。按《保险法》第 14、21、52、57 条分别识别义务主体。身份重合时，同一人可能负担四项义务。","optionExplanations":{"A":"投保人按约定交付保险费。","B":"投保人知道保险事故后应及时通知。","C":"法定用语是标的危险程度显著增加，通知义务主体为被保险人。","D":"财产险事故发生时，法定的施救减损义务主体为被保险人。"},"conceptId":"contract-performance"},{"id":"ins-03-q20","number":20,"group":"保险合同的订立、履行、变更与终止","type":"single","stem":"某企业投保全额财产保险 200 万元，在一次保险事故中，实际遭受损失 100 万元，为保护和抢救财产支出必要的合理费用 10 万元，为验明事故的性质支出人民币 10 万元。该企业可向保险公司获得赔偿数额为（　）。（2019）","options":{"A":"200 万元","B":"100 万元","C":"110 万元","D":"120 万元"},"answer":["D"],"explanationSupplement":"《保险法》第 57 条的施救费用在损失赔偿之外另计，并受独立限额约束。第 64 条的查明费用同样要求必要、合理。","optionExplanations":{"A":"200 万元是保额，题设损失未达到该金额。","B":"只计财产直接损失，漏计费用。","C":"在损失外只计入一项费用。","D":"合计承保损失和两项费用。"},"conceptId":"contract-performance"},{"id":"ins-03-q21","number":21,"group":"保险合同的订立、履行、变更与终止","type":"single","stem":"在人寿保险中，一般不允许变更被保险人，这是因为（　）。","options":{"A":"在人身保险中，因为被保险人本人的寿命或身体是保险标的，所以被保险人的变更可能导致保险合同终止","B":"人身保险合同主体包括保险人及投保人、被保险人、受益人","C":"在人身保险中，允许保险单随投保人的转移而自动转让，无须征得保险人的同意","D":"以上说法都不对"},"answer":["A"],"explanationSupplement":"“更换被保险人”和“变更受益人”影响不同。前者通常需要重新核保、重新订约，后者按第 41 条办理。","optionExplanations":{"A":"解释了更换被保险人改变保险标的及风险。","B":"列出参与人，没有解释更换被保险人的影响。","C":"法律与合同对保单转让有专门要求，不能概括为自动转让。","D":"A 给出了相应理由。"},"conceptId":"contract-change"},{"id":"ins-03-q22","number":22,"group":"保险合同的订立、履行、变更与终止","type":"discussion","stem":"在（　）保险合同中，投保人、被保险人可随保险标的转让而自动变更，无须征得保险人同意，合同继续有效。（2021）","options":{"A":"机动车辆","B":"产品责任","C":"货物运输","D":"家庭财产"},"answer":[],"explanationSupplement":"《保险法》第 49 条规定标的受让人承继被保险人的权利义务，货运险及另有约定的合同例外于通知要求。《海商法》第 255 条规定海上货物运输保险合同可由被保险人背书或以其他方式转让。不能据此推定所有货运险投保人地位随货物自动变更。","optionExplanations":{"A":"机动车保险要看具体险种、通知与风险变化规则。","B":"产品责任险的标的是相关赔偿责任，无货运险的法定通知例外。","C":"若问转让通知例外，C 符合。题面关于双重身份自动变更的表述过宽。","D":"家庭财产险通常适用财险转让的一般规则，并看合同约定。"},"conceptId":"contract-change"},{"id":"ins-03-q23","number":23,"group":"保险合同的订立、履行、变更与终止","type":"discussion","stem":"在（　）情况下，保险人可以解除保险合同。（多选）","options":{"A":"投保人故意隐瞒事实不履行如实告知义务","B":"投保人、被保险人或受益人故意制造保险事故","C":"人身保险合同中，未指定受益人","D":"财产保险中，投保人、被保险人未按约定履行其对标的安全应尽之责"},"answer":[],"explanationSupplement":"《保险法》第 16 条要求未告知足以影响承保决定或提高费率。第 27 条区别虚构事故索赔与故意制造事故。第 43 条另规定受益人故意导致被保险人死亡、伤残、疾病等情形下丧失受益权。D 对应第 51 条。","optionExplanations":{"A":"还要满足足以影响承保或提高费率，并受解除权期限限制。","B":"第 27 条关于故意制造事故的主体是投保人、被保险人，受益人另有规则。","C":"未指定受益人时依第 42 条等处理，单凭该事实不能解除。","D":"依第 51 条可要求增加保险费或者解除合同。"},"conceptId":"contract-termination"},{"id":"ins-03-q24","number":24,"group":"保险合同的订立、履行、变更与终止","type":"discussion","stem":"下列因素中，导致保险合同无效的原因有（　）。（多选）","options":{"A":"违反法律和行政法规","B":"违反国家利益和社会公共利益","C":"投保人因疏忽过失而违反如实告知义务","D":"投保人或被保险人对保险标的不具有保险利益"},"answer":[],"explanationSupplement":"题面 A 与 D 的范围过宽。先按《民法典》第 153 条审查强制性规定及无效例外，再按《保险法》第 31、48 条分别看人身险、财险的保险利益要求。违反告知义务与解除权另按第 16 条判断。","optionExplanations":{"A":"不是所有违反法律、行政法规的行为都导致无效，应审查强制性规定及其效力。","B":"具体须判断是否达到违背公序良俗等法定无效条件。","C":"一般疏忽不会使合同无效，重大过失还须结合法定解除条件。","D":"人身险订立时缺利益可致无效，财险出险时欠缺利益影响请求赔偿。"},"conceptId":"contract-termination"},{"id":"ins-03-q25","number":25,"group":"保险合同的订立、履行、变更与终止","type":"single","stem":"按照保险合同条款通常的文字含义并结合上下文解释的原则是（　）。","options":{"A":"文义解释","B":"意图解释","C":"有利于被保险人和受益人","D":"补充解释"},"answer":["A"],"explanationSupplement":"先读争议条款及其相邻条款，术语须结合语境理解。若涉及格式条款的多种解释，再按法律适用特别规则。","optionExplanations":{"A":"对应题目所说的文字通常含义与上下文。","B":"意图解释关注合同目的和真实意思表示。","C":"这项适用于格式条款有两种以上解释等情形。","D":"补充解释解决合同没有约定或约定不明时的补足问题。"},"conceptId":"contract-interpretation"},{"id":"ins-03-q26","number":26,"group":"保险合同的订立、履行、变更与终止","type":"multiple","stem":"保险合同条款的解释应遵守的原则是（　）。（多选，2021）","options":{"A":"条文解释原则","B":"意图解释原则","C":"有利于保险人解释的原则","D":"有利于被保险人解释的原则"},"answer":["A","B","D"],"explanationSupplement":"按《保险法》第 30 条先作通常解释，再看是否存在两种以上解释。意图解释可结合《民法典》第 142、466 条理解。","optionExplanations":{"A":"按题中用语，属于对条文通常含义的解释。","B":"可结合相关条款、合同目的和交易习惯判断意思。","C":"保险法未设一律偏向保险人的解释原则。","D":"在格式条款多义的法定条件下适用，并同时保护受益人。"},"conceptId":"contract-interpretation"},{"id":"ins-03-q27","number":27,"group":"保险合同的订立、履行、变更与终止","type":"multiple","stem":"保险合同的解释应当遵守的原则是（　）。（多选，2022）","options":{"A":"文义解释原则","B":"有利于保险人的原则","C":"意图解释原则","D":"有利于被保险人和受益人的原则"},"answer":["A","C","D"],"explanationSupplement":"读条款时可将文字、上下文、合同目的和特别解释规则依次检查。D 有法定适用条件。","optionExplanations":{"A":"按通常用语和语境理解条款。","B":"不存在这种一般解释原则。","C":"可结合合同目的和其他相关条款。","D":"符合《保险法》第 30 条的格式条款多义情形。"},"conceptId":"contract-interpretation"}],"catalog":[{"id":"economics","title":"经济基础","subtitle":"从微观选择到宏观运行","chapters":[{"id":"chapter01","number":1,"title":"微观经济学概述","href":"chapter01.html"},{"id":"chapter02","number":2,"title":"需求、供给及市场均衡理论","href":"chapter02.html"},{"id":"chapter03","number":3,"title":"弹性理论","href":"chapter03.html"},{"id":"chapter04","number":4,"title":"消费者行为理论","href":"chapter04.html"},{"id":"chapter05","number":5,"title":"生产理论","href":"chapter05.html"},{"id":"chapter06","number":6,"title":"成本理论","href":"chapter06.html"},{"id":"chapter07","number":7,"title":"市场结构理论","href":"chapter07.html"},{"id":"chapter08","number":8,"title":"博弈论初步","href":"chapter08.html"},{"id":"chapter09","number":9,"title":"生产要素市场理论","href":"chapter09.html"},{"id":"chapter10","number":10,"title":"资源配置和市场失灵","href":"chapter10.html"},{"id":"chapter11","number":11,"title":"国民收入核算","href":"chapter11.html"},{"id":"chapter12","number":12,"title":"国民收入的决定：IS-LM模型","href":"chapter12.html"},{"id":"chapter13","number":13,"title":"国民收入的决定：总需求-总供给模型","href":"chapter13.html"},{"id":"chapter14","number":14,"title":"失业与通货膨胀","href":"chapter14.html"},{"id":"chapter15","number":15,"title":"宏观经济政策及其有效性","href":"chapter15.html"},{"id":"chapter16","number":16,"title":"开放经济下的短期经济模型","href":"chapter16.html"},{"id":"chapter17","number":17,"title":"经济增长与经济周期","href":"chapter17.html"}]},{"id":"finance","title":"金融基础","subtitle":"认识货币、市场与金融体系","chapters":[{"id":"chapter18","number":1,"title":"货币与货币制度","href":"chapter18.html"},{"id":"chapter19","number":2,"title":"信用与利率","href":"chapter19.html"},{"id":"chapter20","number":3,"title":"金融市场","href":"chapter20.html"},{"id":"chapter21","number":4,"title":"金融机构","href":"chapter21.html"},{"id":"chapter22","number":5,"title":"货币供求与货币政策","href":"chapter22.html"},{"id":"chapter23","number":6,"title":"国际金融","href":"chapter23.html"},{"id":"chapter24","number":7,"title":"金融风险与金融监管","href":"chapter24.html"},{"id":"chapter25","number":8,"title":"金融抑制与金融深化","href":"chapter25.html"}]},{"id":"insurance","title":"保险基础","subtitle":"理解风险、保障与保险经营","chapters":[{"id":"chapter26","number":1,"title":"风险与保险","href":"chapter26.html"},{"id":"chapter27","number":2,"title":"保险的基本原则","href":"chapter27.html"},{"id":"chapter28","number":3,"title":"保险合同","href":"chapter28.html"},{"id":"chapter29","number":4,"title":"保险公司经营管理和保险监管","href":"chapter29.html"},{"id":"chapter30","number":5,"title":"财产保险","href":"chapter30.html"},{"id":"chapter31","number":6,"title":"人身保险","href":"chapter31.html"}]}]};</script>
<script>(function (global) {
  'use strict';
  let activeController = null;
  const unique = (values) => Array.isArray(values) ? [...new Set(values)].sort() : [];
  function grade(question, selected) {
    if (!question || question.type === 'discussion' || !question.options || !Array.isArray(selected) || !Array.isArray(question.answer)) return false;
    const actual = unique(selected);
    const expected = unique(question.answer);
    if (!actual.length || !expected.length || actual.some((v) => typeof v !== 'string' || !Object.hasOwn(question.options, v))) return false;
    if (question.type !== 'multiple' && actual.length !== 1) return false;
    return actual.length === expected.length && actual.every((v, i) => v === expected[i]);
  }
  function recordAttempt(state, question, selected, at) {
    if (question.type === 'discussion' || !Array.isArray(selected) || !selected.length) return false;
    const correct = grade(question, selected);
    const previous = state.answers[question.id] || {};
    state.answers[question.id] = {
      selected: unique(selected), submitted: true, correct,
      attempts: (Number.isInteger(previous.attempts) ? previous.attempts : 0) + 1,
      everWrong: previous.everWrong === true || !correct,
      lastAnsweredAt: at || new Date().toISOString()
    };
    return true;
  }
  function testSummary(questions, drafts) {
    const graded = questions.filter(q => q.type !== 'discussion');
    const summary = { total: graded.length, answered: 0, correct: 0, wrong: 0, unanswered: 0 };
    graded.forEach((q) => {
      const selected = drafts[q.id] || [];
      if (!selected.length) summary.unanswered += 1;
      else { summary.answered += 1; if (grade(q, selected)) summary.correct += 1; else summary.wrong += 1; }
    });
    return summary;
  }
  function submitTest(state, questions, at) {
    if (state.test.submitted) return false;
    questions.forEach((q) => recordAttempt(state, q, state.test.drafts[q.id] || [], at));
    state.test.submitted = true;
    return true;
  }
  function validateImport(input, questions) {
    if (!input || input.version !== 1 || !input.answers || typeof input.answers !== 'object' || Array.isArray(input.answers)) return false;
    const byId = new Map(questions.map((q) => [q.id, q]));
    return Object.entries(input.answers).every(([id, record]) => {
      const q = byId.get(id);
      return q && q.type !== 'discussion' && record && Array.isArray(record.selected) && record.selected.length > 0 && record.selected.every((v) => Object.hasOwn(q.options, v)) &&
        (q.type === 'multiple' || unique(record.selected).length === 1) && record.correct === grade(q, record.selected) && Number.isInteger(record.attempts) && record.attempts > 0;
    });
  }
  function mount(root, config) {
    if (!root) throw new Error('Quiz root is required');
    const { questions, store, onConceptJump } = config;
    const graded = questions.filter(q => q.type !== 'discussion');
    const openDiscussions = new Set();
    let mode = 'practice';
    let currentId = questions[0] && questions[0].id;
    let statusText = '';
    let destroyed = false;
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };
    const button = (text, action, cls) => {
      const node = el('button', cls || 'button button-secondary', text);
      node.type = 'button'; node.dataset.action = action;
      return node;
    };
    function state() {
      const s = store.get();
      return { ...s, answers: s.answers || {}, drafts: s.drafts || {}, favorites: s.favorites || [], test: s.test || { drafts: {}, submitted: false } };
    }
    function update(mutator) {
      store.update((s) => {
        s.answers ||= {}; s.drafts ||= {}; s.favorites ||= []; s.test ||= { drafts: {}, submitted: false }; s.test.drafts ||= {};
        mutator(s);
      });
    }
    function filtered(s) {
      if (mode === 'test') return graded;
      if (mode === 'wrong') return graded.filter(q => s.answers[q.id]?.everWrong);
      return questions;
    }
    function chosen(q, s) {
      if (mode === 'test') return s.test.drafts[q.id] || [];
      if (Object.hasOwn(s.drafts, q.id)) return s.drafts[q.id];
      return s.answers[q.id] ? s.answers[q.id].selected : [];
    }
    function revealed(q, s) {
      return mode === 'test' ? s.test.submitted === true : !!(s.answers[q.id] && s.answers[q.id].submitted && !Object.hasOwn(s.drafts, q.id));
    }
    function render() {
      if (destroyed) return;
      const s = state();
      const list = filtered(s);
      if (!list.some((q) => q.id === currentId)) currentId = list[0] && list[0].id;
      const q = list.find((item) => item.id === currentId);
      root.replaceChildren();
      const toolbar = el('div', 'quiz-toolbar');
      const tabs = el('div', 'quiz-tabs'); tabs.setAttribute('aria-label', '答题方式');
      [['practice', '逐题练习'], ['test', '本章测试'], ['wrong', '错题复习']].forEach(([key, label]) => {
        const tab = button(label, 'mode', 'quiz-tab' + (mode === key ? ' active' : ''));
        tab.dataset.mode = key; tab.setAttribute('aria-pressed', String(mode === key)); tabs.append(tab);
      });
      toolbar.append(tabs);
      const stats = el('span', 'muted', mode === 'wrong' ? `历史错题 ${list.length} 道 · 答对后保留记录` : mode === 'test' ? `${graded.length} 道计分题` : `${questions.length} 道练习题 · 答题记录保存在当前浏览器`);
      toolbar.append(stats); root.append(toolbar);
      if (mode === 'test') renderTestSummary(s);
      if (!q) {
        root.append(el('div', 'quiz-empty', mode === 'wrong' ? '还没有错题。完成练习后，答错的题目会出现在这里。' : '本章暂无题目。'));
        return;
      }
      const index = el('nav', 'quiz-index');
      index.setAttribute('aria-label', '题号导航');
      let activeGroup;
      let grid;
      list.forEach((item) => {
        if (!grid || item.group !== activeGroup) {
          activeGroup = item.group;
          const section = el('div', 'quiz-question-group');
          if (activeGroup) section.append(el('span', 'quiz-group-label', activeGroup));
          grid = el('div', 'quiz-grid');
          section.append(grid);
          index.append(section);
        }
        const n = button(String(item.number), 'question', 'quiz-number'); n.dataset.qid = item.id;
        const rec = s.answers[item.id];
        let result = 'unanswered';
        if (mode === 'test') {
          if (s.test.submitted) result = (s.test.drafts[item.id] || []).length ? (grade(item, s.test.drafts[item.id]) ? 'correct' : 'wrong') : 'unanswered';
          else if ((s.test.drafts[item.id] || []).length) result = 'draft';
        } else if (Object.hasOwn(s.drafts, item.id) && s.drafts[item.id].length) result = 'draft';
        else if (rec) result = rec.correct ? 'correct' : 'wrong';
        n.dataset.state = result;
        if (result === 'correct' || result === 'wrong') n.classList.add(result);
        if (result === 'draft') n.classList.add('answered');
        if (item.id === q.id) { n.classList.add('active'); n.setAttribute('aria-current', 'true'); }
        n.setAttribute('aria-label', `第 ${item.number} 题${item.type === 'discussion' ? '，讨论题' : result === 'correct' ? '，已答对' : result === 'wrong' ? '，答错' : result === 'draft' ? '，已选择待提交' : '，未作答'}`);
        grid.append(n);
      }); root.append(index);
      const card = el('article', 'quiz-card');
      const head = el('div', 'quiz-card-header');
      const discussion = q.type === 'discussion';
      const types = { multiple: '多项选择题 · 全部选对得分', single: '单项选择题', discussion: '讨论题 · 不计分' };
      const position = mode === 'test' ? `测试第 ${list.indexOf(q) + 1} / ${list.length} 题` : `第 ${q.number} / ${questions.length} 题`;
      head.append(el('span', '', [q.group, position, types[q.type]].filter(Boolean).join(' · ')));
      const favorite = button(s.favorites.includes(q.id) ? '★ 已收藏' : '☆ 收藏此题', 'favorite', 'button button-secondary quiz-favorite');
      favorite.setAttribute('aria-pressed', String(s.favorites.includes(q.id))); head.append(favorite); card.append(head);
      const stem = el('h3', 'quiz-stem', q.stem); stem.id = 'quiz-current-stem'; card.append(stem);
      const field = el('fieldset', 'quiz-options');
      field.setAttribute('aria-labelledby', stem.id);
      field.append(el('legend', '', discussion ? '讨论选项' : q.type === 'multiple' ? '请选择所有符合题意的选项' : '请选择一个选项'));
      const selected = chosen(q, s);
      const show = revealed(q, s);
      Object.entries(q.options).forEach(([key, text]) => {
        if (discussion) {
          field.append(el('div', 'quiz-option', `${key}. ${text}`));
          return;

   try {
    const saved=localStorage.getItem(KEY);
    if (saved) state=validateState(JSON.parse(saved));
   } catch { notice(); }
  }
  mutator(state);
  try { localStorage.setItem(KEY,JSON.stringify(state)); } catch { notice(); }
  updateProgress();
  return clone(state);
 }

 function applyLessonFilter(){
  if(!chapter)return;
  const q=lessonQuery.trim().toLowerCase();
  let visible=0;
  $$('#lessons .lesson-card').forEach(card=>{
   const id=card.id;
   const isSeen=state.reading?.seen?.includes(id);
   const isFav=state.favorites.includes('concept:'+id);
   const matchFilter=lessonFilter==='all'||(lessonFilter==='unread'&&!isSeen)||(lessonFilter==='favorites'&&isFav);
   const matchQuery=!q||card.dataset.searchText.includes(q);
   const show=matchFilter&&matchQuery;
   card.hidden=!show;
   if(show)visible++;
  });
  const emptyBox=$('#learn-empty');
  if(emptyBox)emptyBox.hidden=visible>0;
 }
 function updateProgress(){
  const seenSet=new Set(state.reading?.seen||[]);
  const count=seenSet.size;
  $('#reading-label').textContent=`已读 ${count} / ${C.lessons.sections.length} 个知识点`;
  $('#continue-reading').hidden=!state.reading?.lastConcept;
  $$('#lesson-jump a').forEach(link=>{if(link.dataset.concept===state.reading.lastConcept)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');});
  $$('[data-favorite-concept]').forEach(b=>{const yes=state.favorites.includes('concept:'+b.dataset.favoriteConcept);b.classList.toggle('selected',yes);b.textContent=yes?'★':'☆';b.setAttribute('aria-pressed',String(yes));});
  $$('[data-read-badge]').forEach(badge=>{
   const seen=seenSet.has(badge.dataset.readBadge);
   badge.textContent=seen?'已读':'未读';
   badge.classList.toggle('is-done',seen);
  });
  applyLessonFilter();
 }

 function chapterLink(entry) {
  return offline ? (entry.id === chapter?.id ? '#learn' : null) : entry.href;

 function readChapterProgress(chapterId) {
  try {
   const k = chapterId === 'chapter01' ? keyBase : `${keyBase}:${chapterId}`;
   const raw = localStorage.getItem(k);
   if (!raw) return null;
   const parsed = JSON.parse(raw);
   const seen = Array.isArray(parsed?.reading?.seen) ? parsed.reading.seen.length : 0;
   const answered = parsed?.answers && typeof parsed.answers === 'object' ? Object.keys(parsed.answers).length : 0;
   if (!seen && !answered) return null;
   return { seen, answered };
  } catch {
   return null;
  }
 }

 const observer = new IntersectionObserver(entries => {
  if (view !== 'learn' || $('#chapter-view').hidden) return;
  const visible=entries.filter(entry=>entry.isIntersecting).map(entry=>entry.target.id);
  if(!visible.some(id=>!state.reading.seen.includes(id)))return;
  store.update(record=>{
   record.reading.seen=[...new Set([...record.reading.seen,...visible])];
   if(!record.reading.lastConcept)record.reading.lastConcept=visible[0];
  });
 }, { threshold: 0.12, rootMargin: '-125px 0px -15% 0px' });

 function renderMap() {
  const tree = $('#mindmap');
  const viewport = $('.map-viewport');
  const expand = $('#map-expand');
  const zoomIn = $('#map-zoom-in');
  const zoomOut = $('#map-zoom-out');
  const size = $('#map-size');
  const collapsePanel = $('#map-collapse-panel');
  const panelBody = $('#map-panel-body');
  const branches = [];
  const startExpanded = !matchMedia('(max-width: 767px)').matches;
  const readingSize = 14;
  const minScale = 0.25;
  const maxScale = 1.75;
  let scale = 1;
  let hasOpened = false;

  function setExpanded(branch, expanded) {
   branch.children.hidden = !expanded;
   branch.toggle.setAttribute('aria-expanded', String(expanded));
   branch.toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'}“${branch.label}”的分支`);
   branch.toggle.textContent = expanded ? '−' : '+';
  }

  function updateExpandLabel() {
   expand.textContent = branches.every(branch => !branch.children.hidden) ? '收起分支' : '全部展开';
  }

  function buildNode(node, depth, parentTarget) {
   const item = el('li', 'map-item');
   const target = node.target || parentTarget;
   const isRoot = depth === 0;
   item.dataset.depth = String(depth);
   const label = el(isRoot ? 'span' : 'a', 'map-label', node.label);
   const face = el('div', isRoot ? 'map-node map-root' : 'map-node');
   if (!isRoot) {
    label.href = '#' + target;
    label.dataset.concept = target;
   }
   face.append(label);
   item.append(face);
   if (!node.children?.length) return item;

   const children = el('ul', 'map-children');
   if (!isRoot) {
    item.classList.add('map-parent');
    children.id = `map-branch-${branches.length + 1}`;
    const toggle = button('', 'map-toggle');
    toggle.setAttribute('aria-controls', children.id);
    const branch = { toggle, children, label: node.label };
    branches.push(branch);
    setExpanded(branch, startExpanded);
    toggle.addEventListener('click', () => {
     setExpanded(branch, children.hidden);
     updateExpandLabel();
    });
    face.append(toggle);
   }
   for (const child of node.children) children.append(buildNode(child, depth + 1, target));
   item.append(children);
   return item;
  }

  function setScale(next) {
   scale = Math.min(maxScale, Math.max(minScale, next));
   tree.style.fontSize = `${readingSize * scale}px`;
   size.textContent = `${Math.round(scale * 100)}%`;
   zoomIn.disabled = scale >= maxScale;
   zoomOut.disabled = scale <= minScale;
  }

  function fitWidth() {
   const availableWidth = viewport.clientWidth;
   if (!availableWidth) return;
   setScale(1);
   const readingWidth = tree.getBoundingClientRect().width;
   if (readingWidth > availableWidth) setScale((availableWidth - 8) / readingWidth);
   viewport.scrollLeft = 0;
  }

  tree.append(buildNode({ label: C.lessons.title, children: C.lessons.mindmap }, 0));
  updateExpandLabel();
  expand.addEventListener('click', () => {
   const next = branches.some(branch => branch.children.hidden);
   branches.forEach(branch => setExpanded(branch, next));
   updateExpandLabel();
  });
  zoomIn.addEventListener('click', () => setScale(scale * 1.2));
  zoomOut.addEventListener('click', () => setScale(scale / 1.2));
  size.addEventListener('click', () => setScale(1));
  $('#map-fit').addEventListener('click', fitWidth);
  if (collapsePanel && panelBody) {
   collapsePanel.addEventListener('click', () => {
    const nextHidden = !panelBody.hidden;
    panelBody.hidden = nextHidden;
    collapsePanel.setAttribute('aria-expanded', String(!nextHidden));
    collapsePanel.textContent = nextHidden ? '展开导图' : '收起导图';
    if (!nextHidden) requestAnimationFrame(fitWidth);
   });
  }

  return () => {
   if (hasOpened) return;
   hasOpened = true;
   fitWidth();
  };
 }

 function switchView(next, scroll=true) {
  const requested = next;
  if (!chapterViews.includes(next)) next='learn';
  saveReadingPosition();
  pausePPF();
  view=next;
  $$('.content-view').forEach(v=>v.hidden=v.id!=='view-'+next);
  $$('[data-view]').forEach(b=>{
   const matchKey = requested === 'map' ? 'map' : next;
   const active = b.closest('#mobile-bottom-nav') ? b.dataset.view === matchKey : b.dataset.view === next;
   b.classList.toggle('active',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(next==='learn') {
   fitMapOnFirstOpen();
   syncInlineQuizzes();
  }
  if(next==='practice') mountQuiz();
  if(requested==='map') {
   readingTracking=false;
   requestAnimationFrame(()=>{
    $('#chapter-mindmap')?.scrollIntoView({behavior:'instant',block:'start'});
    requestAnimationFrame(()=>{readingTracking=true;});
   });
  } else if(requested==='visual' && $('#inline-visual')) {
   readingTracking=false;
   requestAnimationFrame(()=>{
    $('#inline-visual').scrollIntoView({behavior:'instant',block:'start'});
    requestAnimationFrame(()=>{readingTracking=true;});
   });
  } else if(scroll) {
   readingTracking=false;
   $('.view-tabs').scrollIntoView({behavior:'instant',block:'start'});
   requestAnimationFrame(()=>requestAnimationFrame(()=>{readingTracking=true;}));
  }
  history.replaceState(null,'','#'+(requested==='map'||requested==='visual'?requested:next));
 }

 function records() {
  const wrap=el('div');
  wrap.append(el('p','','本章记录保存在当前浏览器。可用备份文件在设备之间，以及本章在线版和离线版之间转移。'));
  const stats=el('div','record-stats'), answered=Object.values(state.answers), correct=answered.filter(x=>x.correct).length;
  const scoredCount=C.questions.filter(q=>q.type!=='discussion').length;
  for(const [value,label] of [[state.reading.seen.length+'/'+C.lessons.sections.length,'已读知识点'],[answered.length+'/'+scoredCount,'已作答'],[correct,'最近答对']]) {
   const item=el('div');
   item.append(el('strong','',value),el('small','',label));
   stats.append(item);
  }
  wrap.append(stats);
  const actions=el('div','record-actions');
  actions.append(button('导出学习记录','button button-primary',()=>{
   const backup={app:'zhiqi-study',chapterId:chapter.id,exportedAt:new Date().toISOString(),state};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
   saveBlob(blob,`知其所以-${chapter.id}-学习记录-${backup.exportedAt.slice(0,10)}.json`);
   toast('学习记录已导出');
  }));
  const file=el('input');
  file.type='file';file.accept='.json,application/json';file.hidden=true;
  const status=el('p','muted');
  status.setAttribute('role','status');
  file.addEventListener('change',async()=>{
   try {
    const f=file.files[0];
    if(!f)return;
    if(f.size>2*1024*1024)throw Error('备份文件过大，请选择有效的学习记录');
    const parsed=JSON.parse(await f.text());
    const backupChapter=parsed?.chapterId ?? 'chapter01';
    if(backupChapter!==chapter.id)throw Error('备份属于其他章节，请在对应章节导入');
    const next=validateState(parsed?.app==='zhiqi-study'?parsed.state:parsed);
    const confirm=el('div','inline-notice');
    confirm.append(el('p','',`已检查备份，含 ${Object.keys(next.answers).length} 道作答记录、${next.reading.seen.length} 个已读知识点。导入将替换本章记录。`),
     button('确认导入并替换','button button-primary',()=>{
      store.update(record=>Object.assign(record,next));
      mountQuiz();syncInlineQuizzes();records();toast('学习记录已恢复');
     }));
    status.replaceChildren(confirm);
   } catch(e) {
    status.textContent='无法导入：'+e.message;
   } finally {
    file.value='';
   }
  });
  actions.append(button('导入记录','button button-secondary',()=>file.click()),file);
  wrap.append(actions,status,el('p','muted',storageAvailable?'浏览器存储可用。清除浏览器数据前，建议先导出备份。':'当前存储不可用，请在离开页面前导出备份。'));
  openModal('学习记录与备份',wrap);
 }
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function favorites(){const wrap=el('div');if(!state.favorites.length)wrap.append(el('p','muted','还没有收藏。阅读时点击知识点右侧的 ☆，或在答题时收藏题目。'));state.favorites.forEach(id=>{const isConcept=id.startsWith('concept:'),item=isConcept?C.lessons.sections.find(s=>s.id===id.slice(8)):C.questions.find(q=>q.id===id);if(!item)return;const row=el('div','favorite-item');const b=button(isConcept?item.title:`第 ${item.number} 题 · ${item.stem}`,'',()=>{$('#modal').close();if(isConcept)jumpConcept(item.id);else{showChapter();switchView('practice');window.StudyQuiz.openQuestion?.(item.id);}});b.append(el('small','',isConcept?'知识点':'练习题'));row.append(b,button('移除','text-button',()=>{toggleFavorite(id);syncInlineQuizzes();favorites();}));wrap.append(row);});openModal('我的收藏',wrap);}
 function download() {
  if(offline) {
   openModal('你正在使用离线学习版','<p>本文件包含本章的讲解、思维导图和练习。保存好这份 HTML，断网后双击即可继续学习。</p><p>可在「学习记录」中导出、导入本章备份。</p>');
   return;
  }
  const a=el('a');
  a.href=(flatDownloads?'':'downloads/')+encodeURIComponent(chapter.downloadName);
  a.download=chapter.downloadName;
  document.body.append(a);
  a.click();
  a.remove();
  toast('离线 HTML 下载已开始，保存后可双击学习');
 }
 document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.concept){e.preventDefault();jumpConcept(target.dataset.concept);return;}if(target.dataset.view){switchView(target.dataset.view);return;}if(target.dataset.switch){switchView(target.dataset.switch);return;}if(offline&&target.hasAttribute('data-open-chapter')){e.preventDefault();showChapter();switchView('learn');window.scrollTo({top:0,behavior:'instant'});return;}if(offline&&target.getAttribute('href')==='index.html'){e.preventDefault();showHome();history.replaceState(null,'','#home');return;}switch(target.dataset.action){case'favorites':favorites();break;case'records':records();break;case'download':download();break;case'sidebar':{const open=$('#sidebar').classList.toggle('open');target.setAttribute('aria-expanded',String(open));break;}}});
 function pausePPF(){if(ppfTimer){clearInterval(ppfTimer);ppfTimer=null;}if($('#ppf-play')){$('#ppf-play').textContent='播放取舍变化';$('#ppf-play').setAttribute('aria-pressed','false');}}
 function initPPF(){const range=$('#grain-range'),radios=$$('input[name=scenario]');if(!range||!radios.length)return;function point(p,f=1){const x=p*470*f,y=Math.sqrt(Math.max(0,1-p*p))*340*f;return[76+x,388-y];}function path(f){let d='';for(let i=0;i<=100;i++){const[x,y]=point(i/100,f);d+=(i?' L':'M')+x.toFixed(2)+' '+y.toFixed(2);}return d;}
  $('#ppf-curve').setAttribute('d',path(1));$('#ppf-new-curve').setAttribute('d',path(1.12));
  function draw(){const v=Number(range.value)/100,scenario=radios.find(r=>r.checked).value,f=scenario==='idle'?.7:scenario==='growth'?1.12:1;const[x,y]=point(v,f);$('#ppf-point').setAttribute('cx',x);$('#ppf-point').setAttribute('cy',y);$('#ppf-halo').setAttribute('cx',x);$('#ppf-halo').setAttribute('cy',y);$('#ppf-guides').setAttribute('d',`M76 ${y}H${x}V388`);$('#ppf-point-label').setAttribute('x',x+13);$('#ppf-point-label').setAttribute('y',y-14);$('#grain-output').textContent=Math.round(v*100*f);$('#machine-output').textContent=Math.round(Math.sqrt(1-v*v)*100*f);$('#grain-percent').value=range.value+'%';$('#ppf-new-curve').setAttribute('opacity',scenario==='growth'?'1':'0');const explanation=scenario==='idle'?'点在原有曲线内：存在资源闲置或利用低效。提高利用效率，可让两类产品产量同时增加。':scenario==='growth'?'技术进步使生产边界向外移动：相同资源下可以生产更多。图中按两类产品同比例提高作简化演示。':'点在曲线上：资源充分有效利用。向右移动时粮食增加、机器减少，这就是取舍。';if($('#ppf-explanation').textContent!==explanation)$('#ppf-explanation').textContent=explanation;}
  range.addEventListener('input',draw);radios.forEach(r=>r.addEventListener('change',draw));let direction=1;$('#ppf-play').addEventListener('click',()=>{if(ppfTimer){pausePPF();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('已启用减少动态效果，请拖动滑块逐步观察');return;}$('#ppf-play').textContent='暂停变化';$('#ppf-play').setAttribute('aria-pressed','true');ppfTimer=setInterval(()=>{let n=Number(range.value)+direction;if(n>=95||n<=5)direction*=-1;range.value=n;draw();},90);});$('#ppf-reset').addEventListener('click',()=>{pausePPF();range.value=60;radios[0].checked=true;draw();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePPF();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches)pausePPF();});draw();}
 renderSidebar();
 renderHome();
 let fitMapOnFirstOpen;
 if(chapter) {
  window.addEventListener('scroll',()=>{
   if(!readingTracking||view!=='learn'||$('#chapter-view').hidden)return;
   readingChanged=true;
   clearTimeout(readingTimer);
   readingTimer=setTimeout(saveReadingPosition,160);
  },{passive:true});
  window.addEventListener('pagehide',saveReadingPosition);
  $('#chapter-module').textContent=chapter.moduleTitle;
  $('#chapter-number').textContent=`第 ${chapter.number} 章`;
  $('#chapter-title').textContent=chapter.title;
  $('#chapter-description').textContent=C.lessons.subtitle;
  $('.chapter-exercise-count').textContent=`${C.questions.length} 道练习`;
  renderLessons();
  $('#lesson-search')?.addEventListener('input', event => {
   lessonQuery = event.target.value;
   applyLessonFilter();
  });
  $$('[data-lesson-filter]').forEach(btn => {
   btn.addEventListener('click', () => {
    lessonFilter = btn.dataset.lessonFilter;
    $$('[data-lesson-filter]').forEach(node => {
     const active = node === btn;
     node.classList.toggle('active', active);
     node.setAttribute('aria-pressed', String(active));
    });
    applyLessonFilter();
   });
  });
  $$('.lesson-card').forEach(card=>observer.observe(card));
  fitMapOnFirstOpen=renderMap();
  if((chapter.visuals||[]).some(v=>v.type==='ppf')||chapter.visual==='ppf')initPPF();
  mountQuiz();
  updateProgress();
  let hash=location.hash.slice(1);
  try { hash=decodeURIComponent(hash); } catch { hash=''; }
  if(offline&&hash==='home')showHome();
  else {
   showChapter();
   if(sectionIds.has(hash)) {
    jumpConcept(hash);
   } else {
    switchView(hash,false);
    if(view==='learn'&&hash!=='map'&&hash!=='visual')restoreReadingPosition({...state.reading});
    else readingTracking=true;
   }
  }
 } else {
  showHome();
 }
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   $('#sidebar').classList.remove('open');
   $('.mobile-menu').setAttribute('aria-expanded','false');
   if(document.activeElement?.matches('#home-search, #lesson-search')){
    document.activeElement.value='';
    document.activeElement.dispatchEvent(new Event('input'));
    document.activeElement.blur();
   }
  } else if(e.key==='/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')){
   const target = $('#home-view').hidden ? (view==='learn' ? $('#lesson-search') : null) : $('#home-search');
   if(target){ e.preventDefault(); target.focus(); target.select(); }
  }
 });
})();
